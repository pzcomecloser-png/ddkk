<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <!-- 📱 아이폰 사파리 메뉴창/주소창 완전 제거 (독립 앱 실행) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="김대리 창고" />
  <meta name="theme-color" content="#0b0d14" />
  <title>창고담당 김대리 - 레트로 창고 퍼즐</title>
  <style>
    :root {
      --bg-color: #0b0d14;
      --card-bg: #141824;
      --panel-border: #222a3d;
      --accent-color: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.45);
      --success-color: #10b981;
      --success-glow: rgba(16, 185, 129, 0.4);
      --danger-color: #ef4444;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --btn-bg: #1e2536;
      --btn-hover: #2c364d;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
      touch-action: manipulation; /* 👈 버튼 터치 지연 없이 즉시 반응 */
    }

    body body {
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0;
      left: 0;
      overflow: hidden;
      overscroll-behavior: none;
      overscroll-behavior-y: none;
      -webkit-overflow-scrolling: auto;
      -webkit-text-size-adjust: 100% !important;
      text-size-adjust: 100% !important;
      zoom: 1 !important;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    .game-container {
      background: var(--card-bg);
      border: 2px solid var(--panel-border);
      border-radius: 18px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      max-width: 540px; /* 👈 720px에서 축소 */
      width: 100%;
      position: relative;
    }

    /* 1단 윗줄: 양 끝으로 쫙 벌리기 */
    .header-bar {
      width: 100%;
      display: flex;
      justify-content: space-between; /* 👈 왼쪽 끝과 오른쪽 끝 밀착 */
      align-items: center;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--panel-border);
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

     /* 👈 여기에 새로 추가! (BGM 버튼을 오른쪽 끝으로 밀어냄) */
    #bgmSelectBtn {
      margin-left: auto !important;
    }

    .title-badge {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000;
      font-weight: 800;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }

    .level-title {
      font-size: 13.5px; /* 👈 16px에서 13.5px로 축소 */
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap; /* 글자가 줄바꿈되지 않도록 방지 */
    }

    /* 2단 아랫줄: 공간을 똑같이 나눠서 균등 간격 배치 */
    .stats-group {
      display: flex;
      justify-content: space-between; /* 👈 아이템 사이 간격을 100% 동일하게 배분 */
      align-items: center;
      width: 100%; /* 전체 폭 100% 사용 */
      font-size: 11.5px;
      font-weight: 600;
    }

    /* 🎯 마지막 '남은 목표'는 무조건 오른쪽 끝 밀착 */
    .stats-group .stat-item:last-child {
      margin-left: auto !important;
    }

     /* 🎯 아랫줄 각 항목이 너비에 맞게 균등하게 늘어남 */
    .stat-item {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(0, 0, 0, 0.35);
      padding: 3px 6px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      white-space: nowrap;

      /* 👈 여기에 새로 추가! (남은 목표 칸을 오른쪽 끝으로 밀어냄) */
    .stats-group .stat-item:last-child {
      margin-left: auto !important;
    }
    }

    .stat-item span.label {
      color: var(--text-sub);
      font-size: 11px;
    }

    .home-btn {
      background: var(--btn-bg);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      padding: 4px 9px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    .home-btn:hover {
      background: var(--btn-hover);
      border-color: #4b5563;
    }

    /* 15개 스테이지 선택 바 */
    .stage-selector-container {
      width: 100%;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .stage-selector-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11.5px;
      color: var(--text-sub);
    }

    .level-grid-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      width: 100%;
    }

    .lvl-dot {
      flex: 1 0 calc(6.66% - 5px);
      min-width: 32px;
      height: 28px;
      border-radius: 6px;
      background: #1a2030;
      border: 1px solid #2e384c;
      color: #94a3b8;
      font-size: 11.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      position: relative;
    }

    .lvl-dot:hover {
      background: #283348;
      color: #fff;
    }

    .lvl-dot.active {
      background: var(--accent-color);
      color: #000;
      border-color: #fbbf24;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .lvl-dot.cleared {
      border-color: var(--success-color);
      color: var(--success-color);
    }

    .lvl-dot.cleared::after {
      content: '✓';
      position: absolute;
      top: 0px;
      right: 2px;
      font-size: 8px;
      font-weight: bold;
    }

    /* 게임 캔버스 래퍼 */
    .canvas-wrapper {
      position: relative;
      background: #080a0f;
      border: 2px solid #202738;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: inset 0 4px 24px rgba(0, 0, 0, 0.9);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: pointer;
      width: 100%;       /* 👈 가로 공간 100% 꽉 채움 */
      max-width: 100%;
      height: auto;
      aspect-ratio: 600 / 660;
    }

    /* 클리어 팝업 */
    .banner-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #000000; /* 👈 완전 암전 */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 100;
      text-align: center;
      padding: 16px;
    }

    .banner-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .banner-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .banner-title {
      font-size: 24px;
      font-weight: 800;
      color: #34d399;
      text-shadow: 0 0 18px rgba(52, 211, 153, 0.6);
      margin-bottom: 6px;
    }

    .banner-desc {
      font-size: 13.5px;
      color: var(--text-sub);
      margin-bottom: 16px;
    }

    .banner-btn {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      border: none;
      font-size: 14px;
      font-weight: 700;
      padding: 10px 22px;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
      transition: transform 0.1s, filter 0.2s;
    }

    .banner-btn:active {
      transform: scale(0.96);
    }

    .gamepad-container {
      width: 100%;
      display: flex;
      justify-content: flex-end; /* 👈 PC에서는 버튼들을 오른쪽 끝으로 정렬 */
      align-items: center;
      padding: 8px 4px 4px 4px;
      gap: 12px;
      transition: flex-direction 0.2s ease;
    }
    /* 👆 터치 조작 모드: 십자키/교체버튼 숨기고 하단 전체를 제스처 영역화 */
    .gamepad-container.touch-only-mode .dpad-cross,
    .gamepad-container.touch-only-mode .swap-ctrl-btn {
      display: none !important;
    }
    .gamepad-container.touch-only-mode {
      justify-content: flex-end; /* 되돌리기/재시작 버튼 우측 밀착 */
    }
    /* 🔄 좌우 반전 모드 */
    .gamepad-container.swapped {
      flex-direction: row-reverse;
    }

    /* ⇄ 중앙 얇고 긴 바 형태 전환 버튼 (재시작 버튼 폭 대응) */
    .swap-ctrl-btn {
      width: 54px;
      height: 20px;
      border-radius: 10px;
      background: #161b26;
      border: 1px solid #36425c;
      color: #38bdf8;
      font-size: 11px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      flex-shrink: 0;
      letter-spacing: -0.5px;
      line-height: 1;
    }
    .swap-ctrl-btn:active {
      background: #38bdf8;
      color: #0b0d14;
      transform: scale(0.94);
    }

     /* PC에서는 가상 십자키와 반전버튼 숨김 (키보드로 조작) */
    .dpad-cross,
    .swap-ctrl-btn {
      display: none !important;
    }

    /* 🎮 일체형 Retro Pixel Art 십자키 (+) - 150px 미세 조정 */
    .dpad-cross {
      display: grid;
      grid-template-columns: repeat(3, 50px);
      grid-template-rows: repeat(3, 50px);
      width: 150px;
      height: 150px;
      position: relative;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    /* 십자키 날개 공통 스타일 */
    .dpad-btn {
      background-color: #383435;
      border: none;
      position: relative;
      cursor: pointer;
      outline: none;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
      -webkit-tap-highlight-color: transparent;
    }

    /* 터치 범위 확장 히트박스 */
    .dpad-btn::before {
      content: '';
      position: absolute;
      top: -10px;
      left: -10px;
      right: -10px;
      bottom: -10px;
      z-index: 10;
    }

    /* 일체형 십자키 중앙 블록 */
    .dpad-center {
      grid-column: 2;
      grid-row: 2;
      background-color: #383435;
      z-index: 1;
    }

    /* 각 방향별 외곽 검은선 + 브라운 베벨 테두리 (안쪽은 터서 일체화) */
    .dpad-up {
      grid-column: 2; grid-row: 1;
      box-shadow: 
        inset 0 4px 0 #5a5350, inset 4px 0 0 #5a5350, inset -4px 0 0 #5a5350,
        0 -4px 0 #000, -4px 0 0 #000, 4px 0 0 #000;
    }
    .dpad-down {
      grid-column: 2; grid-row: 3;
      box-shadow: 
        inset 0 -4px 0 #232021, inset 4px 0 0 #5a5350, inset -4px 0 0 #232021,
        0 4px 0 #000, -4px 0 0 #000, 4px 0 0 #000;
    }
    .dpad-left {
      grid-column: 1; grid-row: 2;
      box-shadow: 
        inset 4px 0 0 #5a5350, inset 0 4px 0 #5a5350, inset 0 -4px 0 #232021,
        -4px 0 0 #000, 0 -4px 0 #000, 0 4px 0 #000;
    }
    .dpad-right {
      grid-column: 3; grid-row: 2;
      box-shadow: 
        inset -4px 0 0 #232021, inset 0 4px 0 #5a5350, inset 0 -4px 0 #232021,
        4px 0 0 #000, 0 -4px 0 #000, 0 4px 0 #000;
    }

    /* 누를 때 픽셀 눌림 피드백 */
    .dpad-btn:active {
      background-color: #2b2829;
    }
    .dpad-btn:active .pixel-arrow {
      transform: translate(2px, 2px);
    }

    /* 계단식 픽셀 도트 화살표 (Retro Pixel Art) */
    .pixel-arrow {
      width: 24px;
      height: 24px;
      display: block;
      pointer-events: none;
      background-repeat: no-repeat;
    }
    /* 위 화살표 ▲ */
    .dpad-up .pixel-arrow {
      background-image: 
        linear-gradient(#fff, #fff), linear-gradient(#fff, #fff),
        linear-gradient(#fff, #fff), linear-gradient(#fff, #fff);
      background-size: 4px 4px, 12px 4px, 20px 4px, 8px 6px;
      background-position: 10px 2px, 6px 6px, 2px 10px, 8px 14px;
    }
    /* 아래 화살표 ▼ */
    .dpad-down .pixel-arrow {
      background-image: 
        linear-gradient(#fff, #fff), linear-gradient(#fff, #fff),
        linear-gradient(#fff, #fff), linear-gradient(#fff, #fff);
      background-size: 8px 6px, 20px 4px, 12px 4px, 4px 4px;
      background-position: 8px 4px, 2px 10px, 6px 14px, 10px 18px;
    }
    /* 왼쪽 화살표 ◀ */
    .dpad-left .pixel-arrow {
      background-image: 
        linear-gradient(#fff, #fff), linear-gradient(#fff, #fff),
        linear-gradient(#fff, #fff), linear-gradient(#fff, #fff);
      background-size: 4px 4px, 4px 12px, 4px 20px, 6px 8px;
      background-position: 2px 10px, 6px 6px, 10px 2px, 14px 8px;
    }
    /* 오른쪽 화살표 ▶ */
    .dpad-right .pixel-arrow {
      background-image: 
        linear-gradient(#fff, #fff), linear-gradient(#fff, #fff),
        linear-gradient(#fff, #fff), linear-gradient(#fff, #fff);
      background-size: 6px 8px, 4px 20px, 4px 12px, 4px 4px;
      background-position: 4px 8px, 10px 2px, 14px 6px, 18px 10px;
    }


    /* ====================================================
       3D Pseudo-Isometric 액션 버튼 (되돌리기 / 재시작)
       ==================================================== */
    .action-circle-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* 1. 음각 베이스 홈 */
    .circle-btn-wrapper {
      background: #151821;
      padding: 4px;
      border-radius: 50%;
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* 2. 3D 입체 공통 */
    .circle-btn {
      width: 56px;
      height: 56px;
      border: none;
      border-radius: 50%;
      color: #ffffff;
      cursor: pointer;
      position: relative;
      top: -5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.05s ease;
    }

    .circle-btn .btn-text {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: -0.5px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      line-height: 1.1;
    }

    /* 3. 되돌리기 (파스텔 블루) */
    .circle-btn.undo {
      background: #70a1ff;
      box-shadow: 0 5px 0 #3b6ecc, 0 7px 10px rgba(0, 0, 0, 0.45);
    }
    .circle-btn.undo:active {
      top: 0px;
      box-shadow: 0 0 0 #3b6ecc, 0 2px 4px rgba(0, 0, 0, 0.4);
    }

    /* 4. 재시작 (파스텔 레드) */
    .circle-btn.reset {
      background: #ff7675;
      box-shadow: 0 5px 0 #d63031, 0 7px 10px rgba(0, 0, 0, 0.45);
    }
    .circle-btn.reset:active {
      top: 0px;
      box-shadow: 0 0 0 #d63031, 0 2px 4px rgba(0, 0, 0, 0.4);
    }

    /* 단축키 뱃지 */
    .key-badge {
      position: absolute;
      bottom: -6px;
      font-size: 9px;
      font-weight: 800;
      color: #cbd5e1;
      background: rgba(15, 23, 42, 0.9);
      padding: 0 5px;
      border-radius: 3px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-family: monospace;
      pointer-events: none;
    }

    .circle-btn .btn-text {
      font-size: 13px;
      font-weight: 800;
      color: #ffffff;
      text-align: center;
      letter-spacing: -0.3px;
    }

    /* 하단 힌트 바 */
    .help-hint {
      width: 100%;
      margin-top: 10px;
      padding: 8px 12px;
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.2);
      border-radius: 8px;
      font-size: 12px;
      color: #fcd34d;
      display: flex;
      align-items: center;
      gap: 6px;
      line-height: 1.4;
    }
    /* 📱 사파리 주소창/하단바 제외 순수 화면 100% 꽉 채움 */
    /* 📱 사파리 주소창 제외: 하단 키패드 최하단 밀착 + 남은 전체 영역 게임 화면 */
    @media (max-width: 640px) {

      /* 모바일에서는 가상 십자키와 반전버튼 다시 켜기 */
      .dpad-cross {
        display: grid !important;
      }
      .swap-ctrl-btn {
        display: flex !important;
      }

      /* 모바일에서는 시계 이모티콘 빼고 순수 '시간'만 표시 */
      #timerLabel {
        font-size: 0;
      }
      #timerLabel::after {
        content: "시간";
        font-size: 11px;
      }

      .pc-vol-slider {
        display: none !important; /* 👈 모바일에서 스피커 + 슬라이더 완전 삭제 */
      }
      .mobile-vol-btn-group {
        display: flex !important; /* 👈 모바일에서 ◀ 100% ▶ 만 표시 */
      }

      body {
        padding: 0;
        margin: 0;
        width: 100vw;
        height: 100svh;
        overflow: hidden;
      }

      .game-container {
        width: 100%;
        height: 100svh;
        max-width: 100%;
        /* 상단 4px, 좌우 4px, 하단은 아이폰 홈바(safe-area)에 바짝 밀착 */
        padding: 4px 4px env(safe-area-inset-bottom, 2px) 4px;
        border: none;
        border-radius: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      /* 모바일에서는 긴 스테이지 바 숨김 */
      .stage-selector-container {
        display: none !important;
      }
      .mobile-stage-btn {
        display: inline-flex !important;
      }

      /* 1. 상단 상태바: 여백 최소화 */
      .header-bar {
        margin-bottom: 2px;
        padding-bottom: 2px;
        flex-shrink: 0;
      }
      .level-title {
        font-size: 12px;
      }
      .stats-group {
        gap: 2px;
        font-size: 11px;
      }
      .stat-item {
        padding: 2px 4px;
        gap: 2px;
      }

      /* 2. 중앙 캔버스: 상단바와 하단패드를 뺀 모든 남는 공간을 100% 흡수 */
      .canvas-wrapper {
        flex: 1 1 auto; /* 👈 남은 세로 공간 전부 차지 */
        width: 100%;
        margin-bottom: 2px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

<script>
/* =====================================================================
   1. 사운드 시스템 (Web Audio API)
   ===================================================================== */
/* =====================================================================
   1. 사운드 & 8비트 레트로 BGM 시스템 (Web Audio API 완전 통합)
   ===================================================================== */
// 🎛️ BGM 음원 스위치: true = bgm1.mp3 재생 / false = 기존 신디사이저 로파이 재생
const USE_MP3_BGM = true;

class SoundEngine {
  setTrack(modeOrTrack) {
    const isPlaying = this.bgmPlaying;
    if (this.bgmAudio) {
      this.bgmAudio.pause();
    }

    this.playMode = modeOrTrack; // 'seq' | 'rand' | '1'~'5'

    let fileNum = 1;
    if (modeOrTrack === 'seq') {
      fileNum = this.currentSeqIndex || 1;
    } else if (modeOrTrack === 'rand') {
      // 직전 곡과 다른 곡 무작위 선택
      let nextR;
      do {
        nextR = Math.floor(Math.random() * 5) + 1;
      } while (nextR === this.currentRandIndex && 5 > 1);
      this.currentRandIndex = nextR;
      fileNum = nextR;
    } else {
      fileNum = parseInt(modeOrTrack, 10) || 1;
    }

    this.bgmAudio = new Audio(`bgm${fileNum}.mp3`);
    this.bgmAudio.loop = (!['seq', 'rand'].includes(modeOrTrack)); // 단일 곡일 때만 단독 루프
    this.bgmAudio.preload = 'auto';

    const isMobile = window.innerWidth <= 640;
    const bgmRatio = isMobile ? 0.05 : 0.10;
    this.bgmAudio.volume = this.bgmVolume * bgmRatio;

    // 곡 끝났을 때 동작 분기
    this.bgmAudio.addEventListener('ended', () => {
      if (this.playMode === 'seq') {
        // 1 -> 2 -> 3 -> 4 -> 5 -> 1 순환
        this.currentSeqIndex = ((fileNum % 5) + 1);
        this.setTrack('seq');
      } else if (this.playMode === 'rand') {
        // 랜덤 다음 곡
        this.setTrack('rand');
      } else {
        // 단일 곡 무한 루프
        this.bgmAudio.currentTime = 0;
        this.bgmAudio.play().catch(() => {});
      }
    });

    if (isPlaying) {
      this.bgmAudio.play().catch(() => {});
    }

    localStorage.setItem('kimdaeri_bgm_track', modeOrTrack);
  }

  constructor() {
    this.ctx = null;
    this.masterGain = null;
    this.bgmGain = null;
    this.sfxGain = null;
    
    this.bgmTimer = null;
    this.bgmVolume = 0.7;
    this.bgmPlaying = false;
    this.bgmStep = 0;

    // 🎵 mp3 음원 객체 생성 + 2중 무한 루프 방어 (아이폰 사파리 완벽 보장)
    this.bgmAudio = new Audio('bgm1.mp3');
    this.bgmAudio.loop = true;
    this.bgmAudio.preload = 'auto';
    this.bgmAudio.volume = this.bgmVolume * 0.1;
    this.bgmAudio.addEventListener('ended', () => {
      this.bgmAudio.currentTime = 0;
      this.bgmAudio.play().catch(() => {});
    });
  }

  init() {
    if (!this.ctx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioContext();

      // 마스터 노드 구조: Source -> (BGM/SFX Gain) -> Master Gain -> Destination
      this.masterGain = this.ctx.createGain();
      this.masterGain.gain.setValueAtTime(1.0, this.ctx.currentTime);
      this.masterGain.connect(this.ctx.destination);

      this.bgmGain = this.ctx.createGain();
      this.bgmGain.gain.setValueAtTime(this.bgmVolume, this.ctx.currentTime);
      this.bgmGain.connect(this.masterGain);

      this.sfxGain = this.ctx.createGain();
      this.sfxGain.gain.setValueAtTime(0.8, this.ctx.currentTime);
      this.sfxGain.connect(this.masterGain);
    }
    
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  startBGM() {
    this.init();
    if (this.bgmVolume <= 0) return;
    this.bgmPlaying = true;

    if (USE_MP3_BGM) {
      // 1. mp3 재생 (10% 볼륨 유지)
      this.bgmAudio.volume = this.bgmVolume * 0.1;
      this.bgmAudio.play().catch(() => {});
    } else {
      // 2. 기존 신디사이저 로파이 재생 (보존)
      this.scheduleBgmTick();
    }
  }

  stopBGM() {
    this.bgmPlaying = false;
    if (USE_MP3_BGM) {
      if (this.bgmAudio) {
        this.bgmAudio.pause();
        this.bgmAudio.currentTime = 0;
      }
    } else {
      if (this.bgmTimer) {
        clearTimeout(this.bgmTimer);
        this.bgmTimer = null;
      }
    }
  }

  setBgmVolume(val) {
    const x = Math.max(0, Math.min(1, val));
    // 🎚️ 0~70% 구간: 최대 30% / 70~100% 구간: 31~100%
    const vol = (x <= 0.7) ? (x / 0.7) * 0.3 : 0.31 + ((x - 0.7) / 0.3) * 0.69;
    this.bgmVolume = vol;

    const isMobile = window.innerWidth <= 640;
    
    // 🎵 BGM 비율: 모바일은 0.05 (절반으로 뚝 낮춤), PC는 0.10 유지
    const bgmRatio = isMobile ? 0.05 : 0.10;
    if (this.bgmAudio) this.bgmAudio.volume = vol * bgmRatio;

    if (this.ctx) {
      if (this.masterGain) this.masterGain.gain.setValueAtTime(1.0, this.ctx.currentTime);
      if (this.bgmGain) this.bgmGain.gain.setValueAtTime(vol * bgmRatio, this.ctx.currentTime);
      // 🔊 효과음 비율: 모바일은 2.2배 풀파워 빵빵하게, PC는 1.3배 유지
      const sfxRatio = isMobile ? 3 : 1.3;
      if (this.sfxGain) this.sfxGain.gain.setValueAtTime(vol * sfxRatio, this.ctx.currentTime);
    }
  }

  scheduleBgmTick() {
    if (!this.bgmPlaying || !this.ctx) return;
    
    // ☕ 김대리의 느긋하고 평온한 휴식 테마 (Cmaj9 - Em7 - Fmaj7 - Gsus4)
    // 여유롭고 몽환적인 16단계 루프 (약 600ms 간격)
    const progression = [
      // 1. Cmaj9 (나른한 쉼)
      { bass: 130.81, pad: [261.63, 329.63, 392.00], lead: 587.33 },
      { bass: null,   pad: [329.63, 392.00],         lead: null },
      { bass: null,   pad: [261.63, 493.88],         lead: 659.25 },
      { bass: null,   pad: [329.63, 392.00],         lead: 523.25 },

      // 2. Em7 (포근한 오후)
      { bass: 82.41,  pad: [246.94, 329.63, 392.00], lead: 493.88 },
      { bass: null,   pad: [293.66, 392.00],         lead: null },
      { bass: null,   pad: [246.94, 329.63],         lead: 587.33 },
      { bass: null,   pad: [293.66, 392.00],         lead: 493.88 },

      // 3. Fmaj7 (노을빛 창고)
      { bass: 87.31,  pad: [261.63, 329.63, 440.00], lead: 523.25 },
      { bass: null,   pad: [329.63, 440.00],         lead: null },
      { bass: null,   pad: [261.63, 329.63],         lead: 659.25 },
      { bass: null,   pad: [329.63, 440.00],         lead: 587.33 },

      // 4. Gsus4 -> G7 (칼퇴를 꿈꾸며)
      { bass: 98.00,  pad: [261.63, 293.66, 392.00], lead: 493.88 },
      { bass: null,   pad: [246.94, 392.00],         lead: null },
      { bass: null,   pad: [293.66, 392.00],         lead: 523.25 },
      { bass: null,   pad: [246.94, 392.00],         lead: 392.00 }
    ];

    const stepData = progression[this.bgmStep % progression.length];

    // 1. 깊고 포근한 저음 베이스 (4박마다 롱테일)
    if (stepData.bass) {
      this.playBgmNote(stepData.bass, 1.8, 'sine', 0.26, 320);
    }

    // 2. 몽환적인 코드 패드 (부드럽게 퍼지는 삼각파)
    if (stepData.pad) {
      stepData.pad.forEach((pFreq, i) => {
        setTimeout(() => {
          this.playBgmNote(pFreq, 1.4, 'sine', 0.12, 480);
        }, i * 35);
      });
    }

    // 3. 은은한 멜로디 차임벨 (맑은 사인파)
    if (stepData.lead) {
      setTimeout(() => {
        this.playBgmNote(stepData.lead, 1.2, 'sine', 0.14, 650);
      }, 70);
    }

    this.bgmStep++;
    // 640ms의 느긋한 템포 (느릿느릿 여유로운 로파이 펄스)
    this.bgmTimer = setTimeout(() => this.scheduleBgmTick(), 640);
  }

  playBgmNote(freq, dur, waveType = 'sine', vol = 0.15, cutoff = 500) {
    if (!this.ctx || this.bgmVolume <= 0) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      const filter = this.ctx.createBiquadFilter();

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(cutoff, this.ctx.currentTime);

      osc.type = waveType;
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

      const now = this.ctx.currentTime;
      const peak = vol * this.bgmVolume;
      gain.gain.setValueAtTime(0.0001, now);
      // 부드러운 어택 (0.12초)과 긴 릴리즈
      gain.gain.linearRampToValueAtTime(peak, now + 0.12);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(this.bgmGain || this.ctx.destination);

      osc.start(now);
      osc.stop(now + dur + 0.05);
    } catch (e) {}
  }

  playStep() {
    if (this.bgmVolume <= 0) return; // 👈 0일 때만 무음
    this.init();
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(140, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(75, this.ctx.currentTime + 0.04);
    // 📱 모바일(스마트폰 스피커)에서는 2로 초대형 증폭, PC는 0.60 유지
    const stepGain = (window.innerWidth <= 640) ? 2 : 0.60;
    gain.gain.setValueAtTime(stepGain, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
    osc.connect(gain);
    gain.connect(this.sfxGain || this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.04);
  }

  playPush() {
    if (this.bgmVolume <= 0) return; // 👈 0이면 즉시 무음
    this.init();
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(180, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(55, this.ctx.currentTime + 0.09);
    gain.gain.setValueAtTime(0.65, this.ctx.currentTime); // 상자 밀기 2.3배 증폭
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.09);
    osc.connect(gain);
    gain.connect(this.sfxGain || this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.09);
  }

  playGoal() {
    if (this.bgmVolume <= 0) return;
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    [523.25, 659.25, 783.99].forEach((freq, i) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now + i * 0.06);
      gain.gain.setValueAtTime(0.24, now + i * 0.06);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.25);
      osc.connect(gain);
      gain.connect(this.sfxGain || this.ctx.destination);
      osc.start(now + i * 0.06);
      osc.stop(now + i * 0.06 + 0.26);
    });
  }

  playUndo() {
    if (this.bgmVolume <= 0) return;
    this.init();
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(260, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(520, this.ctx.currentTime + 0.06);
    gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.06);
    osc.connect(gain);
    gain.connect(this.sfxGain || this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.06);
  }

  playTalk() {
    if (this.bgmVolume <= 0) return; // 👈 0이면 즉시 무음
    this.init();
    if (!this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      const filter = this.ctx.createBiquadFilter();

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(650, this.ctx.currentTime);

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(240 + Math.random() * 40, this.ctx.currentTime);

      const now = this.ctx.currentTime;
      // 볼륨을 0.08 -> 0.012로 대폭 낮춰 부드러운 타자기 느낌 부여
      gain.gain.setValueAtTime(1, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.035);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(this.sfxGain || this.ctx.destination);

      osc.start(now);
      osc.stop(now + 0.04);
    } catch (e) {}
  }

  playDoor() {
    if (this.bgmVolume <= 0) return;
    this.init();
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(100, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.35);
    gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.35);
    osc.connect(gain);
    gain.connect(this.sfxGain || this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.36);
  }

  playVictory() {
    if (this.bgmVolume <= 0) return;
    this.init();
    if (!this.ctx) return;
    const notes = [523.25, 659.25, 783.99, 1046.50];
    const now = this.ctx.currentTime;
    notes.forEach((freq, idx) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now + idx * 0.09);
      gain.gain.setValueAtTime(0.3, now + idx * 0.09);
      gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.32);
      osc.connect(gain);
      gain.connect(this.sfxGain || this.ctx.destination);
      osc.start(now + idx * 0.09);
      osc.stop(now + idx * 0.09 + 0.33);
    });
  }

  playStart() {
    if (this.bgmVolume <= 0) return;
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    [330, 440, 554.37, 659.25, 880].forEach((freq, idx) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now + idx * 0.05);
      gain.gain.setValueAtTime(0.03, now + idx * 0.05); // 👈 0.25 -> 0.03 (초저음량 은은함)
      gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.05 + 0.2);
      osc.connect(gain);
      gain.connect(this.sfxGain || this.ctx.destination);
      osc.start(now + idx * 0.05);
      osc.stop(now + idx * 0.05 + 0.22);
    });
  }
}

try {
  const saved = localStorage.getItem('kimdaeri_cleared_stages');

    clearedStages = new Set(JSON.parse(saved));
  }
  const savedHints = localStorage.getItem('kimdaeri_global_hints');
  if (savedHints !== null) {
    globalHintRemaining = Math.max(0, parseInt(savedHints, 10));
  }
  const savedCh2 = localStorage.getItem('kimdaeri_ch2_seen');
  if (savedCh2 === 'true') {
    chapter2Seen = true;
  }
  const savedTimes = localStorage.getItem('kimdaeri_stage_times');
  if (savedTimes) {
    stageClearTimes = JSON.parse(savedTimes);
  }
} catch (e) {
  console.log('Storage not accessible', e);
}

function saveProgress() {
  try {
    localStorage.setItem('kimdaeri_cleared_stages', JSON.stringify([...clearedStages]));
    localStorage.setItem('kimdaeri_global_hints', globalHintRemaining.toString());
    localStorage.setItem('kimdaeri_ch2_seen', chapter2Seen ? 'true' : 'false');
    localStorage.setItem('kimdaeri_stage_times', JSON.stringify(stageClearTimes));
  } catch (e) {}
}

function clearProgress() {
  if (confirm('모든 스테이지 클리어 기록, 시간 기록, 힌트 횟수를 초기화하시겠습니까?')) {
    clearedStages.clear();
    globalHintRemaining = 5;
    chapter2Seen = false;
    stageClearTimes = {};
    try {
      localStorage.removeItem('kimdaeri_cleared_stages');
      localStorage.removeItem('kimdaeri_global_hints');
      localStorage.removeItem('kimdaeri_ch2_seen');
      localStorage.removeItem('kimdaeri_stage_times');
    } catch (e) {}
    sound.init();
    sound.playUndo();
    updateUI();
    renderNav();
  }
}

function formatTime(totalSeconds) {
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
}

function formatKoreanDuration(totalSeconds) {
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const s = totalSeconds % 60;
  if (h > 0) return `${h}시간 ${m}분 ${s}초`;
  if (m > 0) return `${m}분 ${s}초`;
  return `${s}초`;
}

function startStageTimer(keepExisting = false) {
  stopStageTimer();
  // ⏱️ keepExisting이 true면 기존 흘러가던 시간을 리셋하지 않고 계속 이어감
  if (!keepExisting || !stageStartTime) {
    stageStartTime = Date.now();
  }
  const timerEl = document.getElementById('stageTimer');
  if (timerEl) {
    const elapsed = Math.floor((Date.now() - stageStartTime) / 1000);
    timerEl.innerText = formatTime(elapsed);
  }
  
  stageTimerInterval = setInterval(() => {
    if (gameState === 'PLAYING' && !isCleared && stageStartTime) {
      const elapsed = Math.floor((Date.now() - stageStartTime) / 1000);
      const el = document.getElementById('stageTimer');
      if (el) el.innerText = formatTime(elapsed);
    }
  }, 1000);
}

function stopStageTimer() {
  if (stageTimerInterval) {
    clearInterval(stageTimerInterval);
    stageTimerInterval = null;
  }
}

// 타이틀 화면에서 PUSH START 눌렀을 때 동작
function onTitlePushStart() {
  sound.init();
  if (clearedStages.size >= 1) {
    let targetStage = 0;
    for (let i = 0; i < STAGES.length; i++) {
      if (!clearedStages.has(i)) {
        targetStage = i;
        break;
      }
    }
    // 16단계 시작 전이고 2번째 스토리를 아직 안 봤다면 Chapter 2 재생
    sound.playStart();
    startGame(targetStage);
  } else {
    // 최초 플레이 시 프롤로그 스토리 시작
    startStory(1, 'gameplay');
  }
}

function startStory(chapter = 1, mode = 'gameplay') {
  isCleared = false;
  clearTimeout(clearBannerTimeout); // 👈 뒤늦게 뜨려는 팝업 타이머 즉시 파기!
  const banner = document.getElementById('clearBanner');
  if (banner) banner.classList.remove('active');

  sound.init();
  sound.stopBGM();
  gameState = 'STORY';
  storyChapter = chapter;
  storyPlaybackMode = mode;
  showStorySelectModal = false;
  storyIndex = 0;
  storyTextProgress = 0;
  doorOpenProgress = 0;
  isDoorOpening = false;
  
  if (chapter === 2) {
    chapter2Seen = true;
    saveProgress();
  }

  document.getElementById('stageName').innerText = chapter === 1 ? "스토리 1: 5년 전 기획서" : "스토리 2: 7년 전 기획서";
  document.getElementById('diffBadge').innerText = "스토리";
  document.getElementById('diffBadge').style.color = "#38bdf8";
  document.getElementById('hintText').innerHTML = "💬 <strong>스토리:</strong> 화면 터치나 [Space / Enter] 키를 눌러 다음 대사로 넘어가세요. (우상단 SKIP 가능)";
}

function advanceStory() {
  sound.init();
  const currentScenes = storyChapter === 1 ? STORY_CHAPTER_1 : STORY_CHAPTER_2;
  const currentScene = currentScenes[storyIndex];

  if (storyTextProgress < currentScene.text.length) {
    storyTextProgress = currentScene.text.length;
    sound.playTalk();
    return;
  }

  if (storyIndex < currentScenes.length - 1) {
    storyIndex++;
    storyTextProgress = 0;
    sound.playTalk();
  } else {
    if (!isDoorOpening) {
      isDoorOpening = true;
      sound.playDoor();
    }
  }
}

function skipStory() {
  sound.init();
  sound.playStart();
  isDoorOpening = false;
  doorOpenProgress = 0;
  const banner = document.getElementById('clearBanner');
  if (banner) banner.classList.remove('active');

  if (storyPlaybackMode === 'replay') {
    showTitleScreen();
  } else {
    const targetStage = (storyChapter === 1) ? 0 : 15;
    startGame(targetStage);
  }
}

function finishStory() {
  isDoorOpening = false;
  doorOpenProgress = 0;
  const banner = document.getElementById('clearBanner');
  if (banner) banner.classList.remove('active');

  if (storyPlaybackMode === 'replay') {
    showTitleScreen();
  } else {
    const targetStage = (storyChapter === 1) ? 0 : 15;
    startGame(targetStage);
  }
}

function startGame(stageIdx = 0) {
  sound.init();
  if (sound.ctx && sound.ctx.state === 'suspended') {
    sound.ctx.resume();
  }
  
  // 🎚️ 기본 볼륨 30%(0.3) 보장 및 슬라이더 동기화
  const slider = document.getElementById('volSlider');
  const baseVol = slider ? (parseFloat(slider.value) || 0.7) : 0.7;
  sound.setBgmVolume(baseVol);

  gameState = 'PLAYING';
  sound.startBGM();
  initStage(stageIdx);
}

function showTitleScreen() {
  gameState = 'TITLE';

  document.getElementById('clearBanner').classList.remove('active');

  const remainGoals = Math.max(0, STAGES.length - clearedStages.size);
  const targetEl = document.getElementById('targetRemaining');
  if (targetEl) targetEl.innerText = `${remainGoals}개`;

  // 🎯 2. 타이틀 화면에서는 '난이도' 칸 전체를 숨김
  const diffBadge = document.getElementById('diffBadge');

    diffBadge.parentElement.style.display = 'none';

}

function initStage(index, preserveTimer = false) {
  currentStageIndex = index;
  if (!preserveTimer) stageResetCount = 0; // 👈 새 스테이지 진입 시 0으로 초기화
  const stageData = STAGES[index];
  
  if (gameState === 'PLAYING') {
    sound.startBGM();
    startStageTimer(preserveTimer); // 👈 재시작 시에는 타이머 유지
  }
  
  document.getElementById('stageName').innerText = stageData.name;
  const diffEl = document.getElementById('diffBadge');
  if (diffEl) {
    diffEl.innerText = stageData.diff;
    diffEl.style.color = stageData.diffColor;
    // 🎯 스테이지 플레이 화면에서는 난이도 칸을 다시 보여줌
    if (diffEl.parentElement) {
      diffEl.parentElement.style.display = 'flex';
    }
  }
  
  // 힌트는 기본적으로 숨김 처리 (힌트 버튼 클릭 시 노출)
  const hintEl = document.getElementById('hintText');
  if (hintEl) {
    hintEl.style.display = 'none';
    hintEl.innerHTML = '';
  }
  document.getElementById('clearBanner').classList.remove('active');
  
  const rawMap = stageData.map;
  rows = rawMap.length;
  cols = Math.max(...rawMap.map(r => r.length));
  
  grid = [];
  moveHistory = [];
  moveCount = 0;
  undoRemaining = 3;
  isCleared = false;
  particles = [];
  
  for (let r = 0; r < rows; r++) {
    const rowArr = [];
    for (let c = 0; c < cols; c++) {
      const char = rawMap[r][c] || ' ';
      let cell = {
        type: 'floor',
        isGoal: false,
        hasBox: false
      };
      
      if (char === '#') cell.type = 'wall';
      else if (char === '.') cell.type = 'floor';
      else if (char === '@') {
        cell.type = 'floor';
        player.x = c;
        player.y = r;
      } else if (char === '$') {
        cell.type = 'floor';
        cell.hasBox = true;
      } else if (char === '*') {
        cell.type = 'floor';
        cell.isGoal = true;
      } else if (char === '&') {
        cell.type = 'floor';
        cell.isGoal = true;
        cell.hasBox = true;
      } else if (char === '+') {
        cell.type = 'floor';
        cell.isGoal = true;
        player.x = c;
        player.y = r;
      } else {
        cell.type = 'void';
      }
      rowArr.push(cell);
    }
    grid.push(rowArr);
  }
  
  const fitTile = Math.min(Math.floor((canvas.width - 32) / cols), Math.floor((canvas.height - 32) / rows));
  tileSize = Math.max(56, Math.min(fitTile + 14, 62));
  
  offsetX = 0;
  offsetY = 0;

  // 🎯 실제 벽/바닥 유효 범위(Bounding Box) 계산
  let minC = cols, maxC = 0, minR = rows, maxR = 0;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (grid[r][c].type !== 'void') {
        if (c < minC) minC = c;
        if (c > maxC) maxC = c;
        if (r < minR) minR = r;
        if (r > maxR) maxR = r;
      }
    }
  }
  const initTile = Math.max(62, Math.min(Math.floor((canvas.width - 24) / Math.min(cols, 8)), 72));
  const validCenterX = ((minC + maxC + 1) / 2) * initTile;
  const validCenterY = ((minR + maxR + 1) / 2) * initTile;
  camCurrentX = validCenterX - canvas.width / 2;
  camCurrentY = validCenterY - canvas.height / 2;
  
  updateUI();
  renderNav();
}

function cloneGrid(src) {
  return src.map(row => row.map(cell => ({ ...cell })));
}

function updateUI() {
  document.getElementById('moveCount').innerText = moveCount;
  
  let remaining = 0;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (grid[r] && grid[r][c] && grid[r][c].isGoal && !grid[r][c].hasBox) {
        remaining++;
      }
    }
  }

// 전체 30개에서 클리어할 때마다 1개씩 차감
  const remainGoals = Math.max(0, STAGES.length - clearedStages.size);
  const targetEl = document.getElementById('targetRemaining');
  if (targetEl) targetEl.innerText = `${remainGoals}개`;

  const clearEl = document.getElementById('clearedCount');
  if (clearEl) clearEl.innerText = `클리어: ${clearedStages.size} / ${STAGES.length}`;

  // 되돌리기 잔여 횟수 및 버튼 상태 갱신
  const undoBtn = document.getElementById('undoBtn');
  if (undoBtn) {
    const textEl = undoBtn.querySelector('.btn-text');
    if (textEl) {
      textEl.innerText = `되돌리기 (${undoRemaining})`;
    }
    if (undoRemaining <= 0 || moveHistory.length === 0) {
      undoBtn.style.opacity = '0.4';
      undoBtn.style.cursor = 'not-allowed';
    } else {
      undoBtn.style.opacity = '1.0';
      undoBtn.style.cursor = 'pointer';
    }
  }

  // 🔄 재시작 횟수 버튼 갱신
  const resetBtn = document.getElementById('resetBtn');
  if (resetBtn) {
    const textEl = resetBtn.querySelector('.btn-text');
    if (textEl) {
      textEl.innerText = `재시작 (${stageResetCount})`;
    }
  }
}

/* =====================================================================
   5. 이동 논리 & 상자 밀기
   ===================================================================== */
function tryMove(dx, dy, dirName) {
  if (gameState !== 'PLAYING' || isCleared) return;
  sound.init();

  player.facing = dirName;
  const nextX = player.x + dx;
  const nextY = player.y + dy;

  if (nextY < 0 || nextY >= rows || nextX < 0 || nextX >= cols) return;
  const targetCell = grid[nextY][nextX];
  if (targetCell.type === 'wall' || targetCell.type === 'void') return;

  // 빈 바닥 이동
  if (!targetCell.hasBox) {
    moveHistory.push({
      player: { ...player },
      grid: cloneGrid(grid),
      moveCount: moveCount
    });

    player.x = nextX;
    player.y = nextY;
    player.animFrame = (player.animFrame + 1) % 4;
    moveCount++;
    sound.playStep();
    updateUI();
    return;
  }

  // 상자 밀기
  if (targetCell.hasBox) {
    const boxNextX = nextX + dx;
    const boxNextY = nextY + dy;

    if (boxNextY < 0 || boxNextY >= rows || boxNextX < 0 || boxNextX >= cols) return;
    const boxTargetCell = grid[boxNextY][boxNextX];
    if (boxTargetCell.type === 'wall' || boxTargetCell.type === 'void' || boxTargetCell.hasBox) {
      return;
    }

    moveHistory.push({
      player: { ...player },
      grid: cloneGrid(grid),
      moveCount: moveCount
    });

    targetCell.hasBox = false;
    boxTargetCell.hasBox = true;
    player.x = nextX;
    player.y = nextY;
    player.animFrame = (player.animFrame + 1) % 4;
    moveCount++;

    if (boxTargetCell.isGoal) {
      sound.playGoal();
      spawnGoalParticles(boxNextX, boxNextY);
    } else {
      sound.playPush();
    }

    updateUI();
    checkVictory();
  }
}

function undo() {
  if (gameState !== 'PLAYING' || moveHistory.length === 0 || isCleared) return;
  if (undoRemaining <= 0) return;
  
  sound.init();
  sound.playUndo();

  const prev = moveHistory.pop();
  player = { ...prev.player };
  grid = cloneGrid(prev.grid);
  moveCount = prev.moveCount;
  undoRemaining--;
  
  updateUI();
}

function resetStage() {
  if (gameState !== 'PLAYING') return;
  sound.init();
  sound.playUndo();
  stageResetCount++; // 👈 1씩 증가
  initStage(currentStageIndex, true);
  updateUI();
}

function checkVictory() {
  let allDone = true;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (grid[r][c].isGoal && !grid[r][c].hasBox) {
        allDone = false;
        break;
      }
    }
  }

  if (allDone) {
    isCleared = true;
    gameState = 'CLEAR'; // 👈 골인 즉시 키 입력 차단 (연타 방지)
    stopStageTimer();

    const elapsedSec = stageStartTime ? Math.max(1, Math.floor((Date.now() - stageStartTime) / 1000)) : 0;
    stageClearTimes[currentStageIndex] = elapsedSec;
    clearedStages.add(currentStageIndex);
    saveProgress();
    sound.playVictory();
    renderNav();
    updateUI();

    const bannerTitle = document.querySelector('#clearBanner .banner-title');
    const bannerDesc = document.querySelector('#clearBanner .banner-desc');
    const bannerBtn = document.getElementById('nextStageBtn');
    const stageTimeStr = formatKoreanDuration(elapsedSec);

    // 30 스테이지(최종 엔딩)
    if (currentStageIndex >= STAGES.length - 1) {
      let totalSec = 0;
      for (let i = 0; i < STAGES.length; i++) totalSec += (stageClearTimes[i] || 0);
      const totalTimeStr = formatKoreanDuration(totalSec);
      if (bannerTitle) bannerTitle.innerText = "🎉 전설의 칼퇴 확정! 김대리 퇴근 성공!";
      if (bannerDesc) bannerDesc.innerHTML = `모든 난관을 뚫고 7년 전 기획서까지 완벽하게 찾아냈습니다.<br><strong style="color:#fcd34d;">⏱️ 이번: ${stageTimeStr} | 🏆 총: ${totalTimeStr}</strong><br>이제 진짜 당당하게 퇴근합니다!`;
      if (bannerBtn) bannerBtn.innerText = "🏠 타이틀로 돌아가기 (Space / Enter)";
    } else {
      // 1~29 스테이지
      if (bannerTitle) bannerTitle.innerText = "✨ 스테이지 클리어!";
      if (bannerDesc) {
        const descMsg = (currentStageIndex === 14) 
          ? "5년 전 기획서 획득 성공! 박부장에게 보고합니다." 
          : "김대리가 상자를 안전하게 정리했습니다.";
        bannerDesc.innerHTML = `${descMsg}<br><span style="color:#fcd34d; font-weight:700;">⏱️ 클리어 시간: ${stageTimeStr}</span>`;
      }
      if (bannerBtn) bannerBtn.innerText = "다음 업무로 (Space / Enter)";
    }

    // 🎯 핵심 변경: setTimeout 없이 즉시 배너 노출
    document.getElementById('clearBanner').classList.add('active');
  }
}

function spawnGoalParticles(gridX, gridY) {
  const px = offsetX + gridX * tileSize + tileSize / 2;
  const py = offsetY + gridY * tileSize + tileSize / 2;
  for (let i = 0; i < 18; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 3.5 + 1;
    particles.push({
      x: px,
      y: py,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      color: '#34d399',
      size: Math.random() * 4 + 2,
      life: 1.0,
      decay: 0.04
    });
  }
}

function draw() {
  titleTimer++;

  if (gameState === 'TITLE') {
    drawTitleScreen();
  } else if (gameState === 'STORY') {
    drawStoryScreen();
  } else {
    drawInGame();
  }

  requestAnimationFrame(draw);
}

// 🎬 스토리 컷씬
function drawStoryScreen() {
  const w = canvas.width;
  const h = canvas.height;
  const scenes = storyChapter === 1 ? STORY_CHAPTER_1 : STORY_CHAPTER_2;
  const scene = scenes[storyIndex];

  if (storyTextProgress < scene.text.length && titleTimer % 2 === 0) {
    storyTextProgress++;
    if (storyTextProgress % 3 === 0) sound.playTalk();
  }

  if (scene.type === 'building') {
    drawBuildingScene(w, h);
  } else if (scene.type === 'office') {
    drawOfficeScene(w, h, scene.speaker);
  } else if (scene.type === 'warehouse_inside' || scene.type === 'door') {
    drawWarehouseInsideScene(w, h);
  }

  drawDialogBox(w, h, scene);

  // 우측 상단 SKIP 버튼
  ctx.save();
  ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.roundRect(w - 90, 12, 78, 28, 6);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#fcd34d';
  ctx.font = 'bold 12px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('SKIP ⏭', w - 51, 30);
  ctx.restore();

  if (isDoorOpening) {
    doorOpenProgress += 0.05; // 👈 0.035 -> 0.05로 빠르게 페이드
    ctx.fillStyle = `rgba(0, 0, 0, ${Math.min(1, doorOpenProgress)})`;
    ctx.fillRect(0, 0, w, h);
    if (doorOpenProgress >= 1.0) {
      isDoorOpening = false;
      doorOpenProgress = 0;
      finishStory();
    }
  }
}

function drawBuildingScene(w, h) {
  const grad = ctx.createLinearGradient(0, 0, 0, h);

  ctx.fillRect(0, 0, w, h);

    const sx = (i * 73 + 17) % w;

  ctx.fillStyle = '#fef08a';
  ctx.beginPath();
  ctx.arc(w - 70, 50, 22, 0, Math.PI * 2);

  const bx = w / 2 - bw / 2;

  ctx.fillRect(bx, by, bw, bh);

  ctx.lineWidth = 2;

  ctx.fillStyle = '#1e293b';
  ctx.fillRect(bx + 14, by + 12, bw - 28, 38);

  ctx.lineWidth = 2;
  ctx.strokeRect(bx + 14, by + 12, bw - 28, 38);

  ctx.textAlign = 'center';
  ctx.fillText('엄 청 그 룹', w / 2, by + 37);
  ctx.restore();

  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 5; c++) {
      const wx = bx + 22 + c * 24;
      const wy = by + 65 + r * 16;
      const isLit = (r + c * 3 + titleTimer) % 5 !== 0;
      ctx.fillStyle = isLit ? 'rgba(253, 224, 71, 0.75)' : 'rgba(30, 41, 59, 0.6)';
      ctx.fillRect(wx, wy, 14, 9);
    }

function drawWarehouseInsideScene(w, h) {
  // 1. 어둡고 먼지 쌓인 지하 창고 배경
  const bgGrad = ctx.createLinearGradient(0, 0, 0, h);

  ctx.fillRect(0, h * 0.58, w, h * 0.42);
  ctx.strokeStyle = '#121824';
  ctx.lineWidth = 1;
  for (let x = 0; x < w; x += 40) {
    ctx.beginPath();

  ctx.fillStyle = '#fef08a';

  ctx.arc(lampX, lampY + 5, 7, 0, Math.PI * 2);

  // 따뜻한 조명 원뿔 오라

  drawKraftStorageBox(495, 130, 64, 48);
  drawKraftStorageBox(430, 125, 60, 46);

  ctx.fillRect(170, 235, 14, 18);

function drawKraftStorageBox(x, y, w, h) {

  ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';

  ctx.fillStyle = '#dfc49e';
  ctx.fillRect(x, y, w, lidH - skirtH);

  // 2. 뚜껑 테두리 턱
  ctx.fillStyle = '#cb9f6e';
  ctx.fillRect(x, y + lidH - skirtH, w, skirtH);

  ctx.fillStyle = 'rgba(0, 0, 0, 0.18)';
  ctx.fillRect(x, y + lidH, w, 2);

  ctx.fillStyle = '#ba8d5b';
  ctx.fillRect(x + 1, y + lidH, w - 2, bodyH);

  // 우측 3D 음영
  ctx.fillStyle = '#a67b48';
  ctx.fillRect(x + w - 10, y + lidH, 9, bodyH);

  // 4. 측면 타원형 손잡이 컷아웃 구멍
  ctx.fillStyle = '#221508';
  ctx.beginPath();
  ctx.roundRect(x + w - 9, y + lidH + Math.floor(bodyH * 0.22), 6, Math.floor(bodyH * 0.42), 3);
  ctx.fill();

  // 외곽선
  ctx.strokeStyle = '#54391e';
  ctx.lineWidth = 1.3;
  ctx.strokeRect(x, y, w, h);
}

function drawFlusteredKimDaeri(cx, cy, timer) {

  // 2. 2등신 큼직한 머리 (난감한 표정)
  ctx.fillStyle = '#fed7aa';

  ctx.roundRect(-15, -23, 30, 25, 8);

  // 댄디컷 헤어
  ctx.fillStyle = '#3e2723';
  ctx.beginPath();
  ctx.roundRect(-16, -26, 32, 12, 6);
  ctx.fill();
  ctx.fillRect(-16, -20, 5, 10);
  ctx.fillRect(11, -20, 5, 10);

  // 만화풍 멘붕 눈 (> < 눈 모양)
  ctx.strokeStyle = '#0f172a';
  ctx.lineWidth = 2;
  // 좌측 '>'
  ctx.beginPath();
  ctx.moveTo(-9, -11); ctx.lineTo(-5, -8); ctx.lineTo(-9, -5);
  ctx.stroke();
  // 우측 '<'
  ctx.beginPath();
  ctx.moveTo(9, -11); ctx.lineTo(5, -8); ctx.lineTo(9, -5);
  ctx.stroke();

  // 삐질삐질 솟아나는 푸른 땀방울 💦 (3개)
  ctx.fillStyle = '#38bdf8';
  // 좌측 땀
  ctx.beginPath();
  ctx.moveTo(-16, -21); ctx.lineTo(-13, -16); ctx.lineTo(-18, -16); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(-15.5, -15, 2.5, 0, Math.PI * 2); ctx.fill();
  // 우측 큰 땀
  ctx.beginPath();
  ctx.moveTo(15, -23); ctx.lineTo(19, -17); ctx.lineTo(13, -17); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(16, -16, 3, 0, Math.PI * 2); ctx.fill();

  // 난감하게 떨리는 입 (~ 모양)
  ctx.strokeStyle = '#b91c1c';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-4, -1);
  ctx.quadraticCurveTo(-2, -3, 0, -1);
  ctx.quadraticCurveTo(2, 1, 4, -1);
  ctx.stroke();

  // 핑크 볼터치
  ctx.fillStyle = 'rgba(244, 63, 94, 0.45)';
  ctx.beginPath();
  ctx.arc(-10, -5, 3.5, 0, Math.PI * 2);
  ctx.arc(10, -5, 3.5, 0, Math.PI * 2);
  ctx.fill();

  // 3. 양손으로 머리를 감싸쥔 "으악 어쩌지?!" 포즈!

  ctx.beginPath();
  ctx.arc(-14, -15, 4, 0, Math.PI * 2);
  ctx.fill();
  // 오른손 머리 위
  ctx.beginPath();

  ctx.restore();
}

function wrapText(context, text, x, y, maxWidth, lineHeight) {
  let line = '';
  for (let i = 0; i < text.length; i++) {
    const testLine = line + text[i];
    const metrics = context.measureText(testLine);
    if (metrics.width > maxWidth && i > 0) {
      context.fillText(line, x, y);
      line = text[i];
      y += lineHeight;
    } else {
      line = testLine;
    }
  }
  context.fillText(line, x, y);
}

  // 3. 닫기 버튼

  mc.x = w / 2 - 60;

  mc.w = 120;
  mc.h = 32;

  ctx.strokeStyle = '#64748b';

  ctx.stroke();

  ctx.font = 'bold 12px "Pretendard", sans-serif';

  ctx.restore();
}

function drawInGame() {
  const isDeepZone = currentStageIndex >= 15;
  const isMobile = window.innerWidth <= 640; // 📱 모바일 기기 여부 판정

  ctx.fillStyle = isDeepZone ? '#080d0e' : '#090b10';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)';
  ctx.lineWidth = 1;
  for (let x = 0; x < canvas.width; x += 20) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, canvas.height);
    ctx.stroke();
  }

  // 📐 타일 크기 & 오프셋 (PC: 기존 유지 / 모바일: 확대 추적 or 전체보기)
  let curTile = 46;
  let curOffsetX = 0;
  let curOffsetY = 0;

  if (!isMobile) {
    // 🖥️ PC: 전체 맵 한눈에 깔끔 뷰
    const fitW = Math.floor((canvas.width - 32) / cols);
    const fitH = Math.floor((canvas.height - 32) / rows);
    curTile = Math.min(fitW, fitH, 46);
    curOffsetX = Math.floor((canvas.width - cols * curTile) / 2);
    curOffsetY = Math.floor((canvas.height - rows * curTile) / 2);
  } else {
    // 📱 모바일: 억지 늘림 없이 1:1 정비율 유지하며 화면 꽉 차게 최대 확대 + 카메라 추적
    // 📱 가로/세로 모두 보라색 영역에 쏙 들어가도록 정비율 계산
    const fitW = Math.floor((canvas.width - 24) / cols);
    const fitH = Math.floor((canvas.height - 24) / rows);
    curTile = Math.max(58, Math.min(fitW, fitH, 72));
    const targetCamX = (player.x + 0.5) * curTile - canvas.width / 2;
    const targetCamY = (player.y + 0.5) * curTile - canvas.height / 2;

    const mapW = cols * curTile;
    const mapH = rows * curTile;

    // 🎯 앞뒤 빈 공백 제거한 실제 유효 맵 중심 정렬
    let minC = cols, maxC = 0, minR = rows, maxR = 0;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (grid[r][c].type !== 'void') {
          if (c < minC) minC = c; if (c > maxC) maxC = c;
          if (r < minR) minR = r; if (r > maxR) maxR = r;
        }
      }
    }
    const realW = (maxC - minC + 1) * curTile;
    const realH = (maxR - minR + 1) * curTile;
    const realCenterX = ((minC + maxC + 1) / 2) * curTile;
    const realCenterY = ((minR + maxR + 1) / 2) * curTile;

    let targetX = realW <= canvas.width ? realCenterX - canvas.width / 2 : Math.max(minC * curTile, Math.min((maxC + 1) * curTile - canvas.width, targetCamX));
    let targetY = realH <= canvas.height ? realCenterY - canvas.height / 2 : Math.max(minR * curTile, Math.min((maxR + 1) * curTile - canvas.height, targetCamY));

    camCurrentX += (targetX - camCurrentX) * 0.25;
    camCurrentY += (targetY - camCurrentY) * 0.25;

    curOffsetX = -Math.round(camCurrentX);
    curOffsetY = -Math.round(camCurrentY);
  }

  ctx.save();

  // 1. 바닥 & 목표 발판 & 벽 렌더링
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cell = grid[r][c];
      const px = curOffsetX + c * curTile;
      const py = curOffsetY + r * curTile;

      if (cell.type === 'floor') {
        const isAlt = (r + c) % 2 === 0;
        if (isDeepZone) {
          ctx.fillStyle = isAlt ? '#131f22' : '#0e1719';
          ctx.fillRect(px, py, curTile, curTile);
          ctx.strokeStyle = '#1c2d31';
          ctx.strokeRect(px + 0.5, py + 0.5, curTile - 1, curTile - 1);
        } else {
          ctx.fillStyle = isAlt ? '#181e2a' : '#141822';
          ctx.fillRect(px, py, curTile, curTile);
          ctx.strokeStyle = '#222938';
          ctx.strokeRect(px + 0.5, py + 0.5, curTile - 1, curTile - 1);
        }

        if (cell.isGoal) {
          drawGoalPad(px, py, curTile, cell.hasBox);
        }
      } else if (cell.type === 'wall') {
        drawCustomWall(px, py, curTile);
      }
    }
  }

  // 2. 상자 & 플레이어 렌더링
  const renderList = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cell = grid[r][c];
      const px = curOffsetX + c * curTile;
      const py = curOffsetY + r * curTile;

      if (cell.hasBox) {
        renderList.push({
          type: 'box',
          y: py,
          draw: () => draw3DBox(px, py, curTile, cell.isGoal)
        });
      }
    }
  }

  const playerPx = curOffsetX + player.x * curTile;
  const playerPy = curOffsetY + player.y * curTile;
  renderList.push({
    type: 'player',
    y: playerPy,
    draw: () => drawPixelCharacter(playerPx, playerPy, curTile, player.facing, player.animFrame)
  });

  renderList.sort((a, b) => a.y - b.y);
  renderList.forEach(item => item.draw());

  drawParticles();
  ctx.restore();
}

// 🧱 이동 불가 구역 벽 블록
function drawCustomWall(x, y, size) {
  const isDeepZone = currentStageIndex >= 15;
  ctx.fillStyle = isDeepZone ? '#080d0e' : '#0c1017';
  ctx.fillRect(x, y, size, size);

  const topH = Math.floor(size * 0.44);
  const margin = 2;
  const halfW = Math.floor((size - margin * 3) / 2);
  const panelH = topH - margin * 2;

  // 1. 상단 메탈 패널 (지하 10층: 다크 틸 메탈)
  ctx.fillStyle = isDeepZone ? '#283c42' : '#394354';
  ctx.fillRect(x + margin, y + margin, halfW, panelH);
  ctx.fillRect(x + margin * 2 + halfW, y + margin, halfW, panelH);

  // 2. 상단 하이라이트 라인
  ctx.fillStyle = isDeepZone ? '#3b545c' : '#4c5970';
  ctx.fillRect(x + margin + 1, y + margin + 1, halfW - 2, 2);
  ctx.fillRect(x + margin * 2 + halfW + 1, y + margin + 1, halfW - 2, 2);

  // 3. 패널 사이 분할 홈 섀도우
  ctx.fillStyle = isDeepZone ? '#141f22' : '#1c2330';
  ctx.fillRect(x + margin + halfW, y + margin, margin, panelH);

  // 4. 하단 베이스 블록
  const bottomY = y + topH;
  const bottomH = size - topH - margin;
  ctx.fillStyle = isDeepZone ? '#1d2c30' : '#262f40';
  ctx.fillRect(x + margin, bottomY, size - margin * 2, bottomH);

  ctx.fillStyle = isDeepZone ? '#10181a' : '#171c26';
  ctx.fillRect(x + margin, y + size - 4, size - margin * 2, 3);

  ctx.strokeStyle = isDeepZone ? '#06090a' : '#0b0f16';
  ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, size - 1, size - 1);
}

function drawGoalPad(x, y, size, hasBox) {
  const padInset = size * 0.15;
  const padSize = size - padInset * 2;
  const cx = x + size / 2;
  const cy = y + size / 2;

  ctx.fillStyle = hasBox ? 'rgba(16, 185, 129, 0.28)' : 'rgba(245, 158, 11, 0.16)';
  ctx.fillRect(x + padInset, y + padInset, padSize, padSize);

  ctx.strokeStyle = hasBox ? '#10b981' : '#f59e0b';
  ctx.lineWidth = 2;
  ctx.strokeRect(x + padInset, y + padInset, padSize, padSize);

  ctx.save();
  ctx.translate(cx, cy);
  ctx.beginPath();
  ctx.moveTo(0, -padSize * 0.35);
  ctx.lineTo(padSize * 0.35, 0);
  ctx.lineTo(0, padSize * 0.35);
  ctx.lineTo(-padSize * 0.35, 0);
  ctx.closePath();
  ctx.fillStyle = hasBox ? '#34d399' : '#fbbf24';
  ctx.fill();
  ctx.restore();
}

function draw3DBox(x, y, size, onGoal) {
  const margin = 2;
  const bx = x + margin;
  const by = y + margin;
  const bw = size - margin * 2;
  const bh = size - margin * 2;

  // 1. 바닥 접촉 그림자 (바닥에서 붕 띄우지 않고 바닥에 밀착되는 섀도우)
  ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
  ctx.fillRect(bx + 1, by + bh - 2, bw - 2, 4);

  const lidH = Math.max(7, Math.floor(bh * 0.28)); // 뚜껑 상단부 높이
  const skirtH = Math.max(3, Math.floor(bh * 0.12)); // 뚜껑 테두리 턱 높이
  const bodyH = bh - lidH;

  if (onGoal) {
    // 💠 골인된 상태: 바닥 밀착형 에메랄드 크리스탈 서류 보관 박스
    // 1) 뚜껑 윗면 (밝은 에메랄드 그린)
    ctx.fillStyle = '#10b981';
    ctx.fillRect(bx, by, bw, lidH - skirtH);

    // 2) 뚜껑 앞 턱 (살짝 덮여 내려오는 테두리)
    ctx.fillStyle = '#059669';
    ctx.fillRect(bx, by + lidH - skirtH, bw, skirtH);

    // 뚜껑 아래 그림자
    ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
    ctx.fillRect(bx, by + lidH, bw, 2);

    // 3) 메인 박스 몸체 정면
    ctx.fillStyle = '#047857';
    ctx.fillRect(bx + 1, by + lidH, bw - 2, bodyH);

    // 우측면 3D 명암
    ctx.fillStyle = '#065f46';
    ctx.fillRect(bx + bw - 8, by + lidH, 7, bodyH);

    // 4) 측면 타원형 손잡이 컷아웃 구멍
    const hx = bx + bw - 7;
    const hy = by + lidH + Math.floor(bodyH * 0.22);
    const hw = 5;
    const hh = Math.floor(bodyH * 0.38);

    ctx.fillStyle = '#022c22';
    ctx.beginPath();
    ctx.roundRect(hx, hy, hw, hh, 2.5);
    ctx.fill();

    // 5) 중앙 발광 에메랄드 다이아몬드 크리스탈 보석
    const cx = bx + bw / 2;
    const cy = by + lidH + bodyH / 2;
    ctx.save();
    ctx.shadowColor = 'rgba(52, 211, 153, 0.85)';
    ctx.shadowBlur = 10;
    ctx.fillStyle = '#ecfdf5';
    ctx.beginPath();
    ctx.moveTo(cx, cy - 5);
    ctx.lineTo(cx + 5, cy);
    ctx.lineTo(cx, cy + 5);
    ctx.lineTo(cx - 5, cy);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // 외곽선
    ctx.strokeStyle = '#064e3b';
    ctx.lineWidth = 1.4;
    ctx.strokeRect(bx, by, bw, bh);
  } else {
    // 📦 사진 레퍼런스 100% 반영: 바닥에 딱 붙은 3D 크라프트 서류 보관 박스 (뚜껑 + 손잡이 컷아웃)
    // 1) 뚜껑 윗면 (밝은 베이지 크라프트 상단면)
    ctx.fillStyle = '#dfc49e';
    ctx.fillRect(bx, by, bw, lidH - skirtH);

    // 뚜껑 윗면 미세 접힘 하이라이트 라인
    ctx.strokeStyle = '#eed8be';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(bx + 2, by + 1);
    ctx.lineTo(bx + bw - 2, by + 1);
    ctx.stroke();

    // 2) 뚜껑 앞 턱 (살짝 덮여 내려오는 뚜껑 테두리)
    ctx.fillStyle = '#cb9f6e';
    ctx.fillRect(bx, by + lidH - skirtH, bw, skirtH);

    // 뚜껑 아래 드리워지는 그림자 띠
    ctx.fillStyle = 'rgba(0, 0, 0, 0.18)';
    ctx.fillRect(bx, by + lidH, bw, 2);

    // 3) 메인 박스 몸체 정면 (따뜻한 천연 골판지 크라프트 톤)
    ctx.fillStyle = '#ba8d5b';
    ctx.fillRect(bx + 1, by + lidH, bw - 2, bodyH);

    // 우측면 3D 입체 음영
    ctx.fillStyle = '#a67b48';
    ctx.fillRect(bx + bw - 8, by + lidH, 7, bodyH);

    // 4) 측면 타원형 손잡이 컷아웃 구멍 (사진 속 블랙 오벌 손잡이)
    const hx = bx + bw - 7;
    const hy = by + lidH + Math.floor(bodyH * 0.22);
    const hw = 5;
    const hh = Math.floor(bodyH * 0.38);

    ctx.fillStyle = '#221508'; // 손잡이 안쪽 어두운 내부
    ctx.beginPath();
    ctx.roundRect(hx, hy, hw, hh, 2.5);
    ctx.fill();
    // 손잡이 상단 하이라이트
    ctx.fillStyle = '#dfc49e';
    ctx.fillRect(hx, hy, hw, 1);

    // 5) 박스 전체 정밀 외곽선
    ctx.strokeStyle = '#54391e';
    ctx.lineWidth = 1.3;
    ctx.strokeRect(bx, by, bw, bh);
  }
}

function drawPixelCharacter(x, y, size, facing, frame) {
  const cx = x + size / 2;
  const cy = y + size / 2 - 2;
  const bob = (frame % 2 === 1) ? 1.5 : 0;

  ctx.save();
  ctx.translate(cx, cy + bob);

  // 1. 발 아래 그림자
  ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
  ctx.beginPath();
  ctx.ellipse(0, size * 0.35, size * 0.28, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  const scale = size / 48;
  ctx.scale(scale, scale);

  // 2. 2등신 아담한 몸체 (블루 셔츠 + 네이비 바지)
  ctx.fillStyle = '#3b82f6';
  ctx.beginPath();
  ctx.roundRect(-9, 1, 18, 13, 3);
  ctx.fill();
  ctx.strokeStyle = '#1d4ed8';
  ctx.lineWidth = 1;
  ctx.stroke();

  // 레드 넥타이 & 사원증 (앞/옆모습일 때만)
  if (facing !== 'up') {
    ctx.fillStyle = '#ef4444';
    let tieX = (facing === 'left') ? -4 : (facing === 'right') ? 2 : -1.5;
    ctx.fillRect(tieX, 2, 3, 7);

    // 사원증
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(tieX - 1, 5, 5, 6);
    ctx.fillStyle = '#f59e0b';
    ctx.fillRect(tieX - 1, 5, 5, 1.5);
  }

  // 3. 다리 & 브라운 구두 (발걸음 바운스)
  ctx.fillStyle = '#1e293b';
  const legL = (frame % 2 === 1) ? 1.5 : -1.5;
  const legR = (frame % 2 === 1) ? -1.5 : 1.5;
  // 좌/우 발
  ctx.fillStyle = '#78350f';
  if (facing === 'left') {
    ctx.fillRect(-7, 13 + legL, 6, 4);
    ctx.fillRect(0, 13 + legR, 5, 4);
  } else if (facing === 'right') {
    ctx.fillRect(-5, 13 + legL, 5, 4);
    ctx.fillRect(1, 13 + legR, 6, 4);
  } else {
    ctx.fillRect(-7, 13 + legL, 5, 4);
    ctx.fillRect(2, 13 + legR, 5, 4);
  }

  // 4. 2등신 큼직하고 귀여운 머리 (살구빛 뽀얀 피부)
  ctx.fillStyle = '#fed7aa';
  ctx.beginPath();
  ctx.roundRect(-12, -18, 24, 20, 6);
  ctx.fill();

  // 5. 댄디컷 갈색 헤어 & 시선 방향 처리
  ctx.fillStyle = '#3e2723';

  if (facing === 'up') {
    // 🔙 뒷모습: 풍성하고 단정한 뒷머리
    ctx.beginPath();
    ctx.roundRect(-13, -20, 26, 21, 6);
    ctx.fill();
    // 목덜미 살짝
    ctx.fillStyle = '#fed7aa';
    ctx.fillRect(-4, -1, 8, 3);
  } else {
    // 윗머리 볼륨
    ctx.beginPath();
    ctx.roundRect(-13, -20, 26, 10, 5);
    ctx.fill();

    if (facing === 'down') {
      // ⬇️ 정면: 양 옆머리 & 앞머리 컬
      ctx.fillRect(-13, -15, 4, 8);
      ctx.fillRect(9, -15, 4, 8);
      ctx.beginPath();
      ctx.arc(-4, -11, 3.5, 0, Math.PI);
      ctx.arc(4, -11, 3.5, 0, Math.PI);
      ctx.fill();

      // 똘망똘망한 두 눈
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(-5, -6, 2, 0, Math.PI * 2);
      ctx.arc(5, -6, 2, 0, Math.PI * 2);
      ctx.fill();
      // 하이라이트
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-6, -7, 1, 1);
      ctx.fillRect(4, -7, 1, 1);

      // 핑크 볼터치
      ctx.fillStyle = 'rgba(244, 63, 94, 0.45)';
      ctx.beginPath();
      ctx.arc(-8, -3, 2.5, 0, Math.PI * 2);
      ctx.arc(8, -3, 2.5, 0, Math.PI * 2);
      ctx.fill();
    } else if (facing === 'left') {
      // ⬅️ 좌측 방향 프로필
      ctx.fillRect(3, -16, 9, 12); // 뒷머리
      ctx.beginPath();
      ctx.arc(-5, -11, 4, 0, Math.PI);
      ctx.fill();

      // 왼쪽 눈
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(-7, -6, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-8, -7, 1, 1);

      // 볼터치
      ctx.fillStyle = 'rgba(244, 63, 94, 0.45)';
      ctx.beginPath();
      ctx.arc(-9, -3, 2.5, 0, Math.PI * 2);
      ctx.fill();
    } else if (facing === 'right') {
      // ➡️ 우측 방향 프로필
      ctx.fillRect(-12, -16, 9, 12); // 뒷머리
      ctx.beginPath();
      ctx.arc(5, -11, 4, 0, Math.PI);
      ctx.fill();

      // 오른쪽 눈
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(7, -6, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(6, -7, 1, 1);

      // 볼터치
      ctx.fillStyle = 'rgba(244, 63, 94, 0.45)';
      ctx.beginPath();
      ctx.arc(9, -3, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  ctx.restore();
}

function drawParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.12;
    p.life -= p.decay;

    if (p.life <= 0) {
      particles.splice(i, 1);
      continue;
    }

    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life;
    ctx.fillRect(p.x, p.y, p.size, p.size);
    ctx.globalAlpha = 1.0;
  }
}

// 📱 게임 화면 + 하단 컨트롤러 영역 전체 스와이프(슬라이드) 방향전환
let globalTouchStartX = 0;
let globalTouchStartY = 0;

window.addEventListener('pointerdown', (e) => {
  if (e.target.closest('button')) return; // 버튼 누를 땐 스와이프 제외
  globalTouchStartX = e.clientX;
  globalTouchStartY = e.clientY;
}, { passive: true });

window.addEventListener('pointerup', (e) => {
  if (gameState !== 'PLAYING' || isCleared) return;
  if (e.target.closest('button')) return;

  const dx = e.clientX - globalTouchStartX;
  const dy = e.clientY - globalTouchStartY;
  const absX = Math.abs(dx);
  const absY = Math.abs(dy);

  // 10px만 스쳐도 즉시 1칸 이동 (화면 + 하단패드 어디든 작동)
  if (Math.max(absX, absY) > 10) {
    if (absX > absY) {
      if (dx > 0) tryMove(1, 0, 'right');
      else tryMove(-1, 0, 'left');
    } else {
      if (dy > 0) tryMove(0, 1, 'down');
      else tryMove(0, -1, 'up');
    }
  }
}, { passive: true });

function handleTitleClick(x, y) {
   // 모달 열려있을 때
  if (showStorySelectModal) {
    const my = canvas.height / 2 - 110; // 660 / 2 - 110 = 220
    const mx = canvas.width / 2 - 130;  // 600 / 2 - 130 = 170

    // 1. 스토리 1 버튼 (Y: 265 ~ 320)
    if (x >= 150 && x <= 450 && y >= my + 45 && y <= my + 95) {
      sound.init(); sound.playTalk();
      showStorySelectModal = false;
      startStory(1, 'replay');
      return;
    }
    // 2. 스토리 2 버튼 (Y: 320 ~ 375)
    if (x >= 150 && x <= 450 && y >= my + 98 && y <= my + 150) {
      const ch2Unlocked = clearedStages.has(14) || chapter2Seen || devModeActive;
      if (ch2Unlocked) {
        sound.init(); sound.playTalk();
        showStorySelectModal = false;
        startStory(2, 'replay');
      } else {
        alert('🔒 스토리 2는 15단계를 클리어하거나 개발자 모드에서 감상할 수 있습니다.');
      }
      return;
    }
    // 3. 닫기 버튼 or 바깥 터치 (모달 닫기)
    showStorySelectModal = false;
    return;
  }

  // 1. 개발자 버튼 (판정 범위 대폭 확장)
  const d = devModeBtnRect;
  if (x >= d.x - 12 && x <= d.x + d.w + 12 && y >= d.y - 12 && y <= d.y + d.h + 12) {
    if (devModeActive) {
      if (confirm('개발자 모드를 해제하시겠습니까?')) {
        devModeActive = false;
        renderNav();
        updateUI();
      }
    } else {
      const pw = prompt('개발자 모드 암호를 입력하세요:');
      if (pw === '1029') {
        devModeActive = true;
        alert('🔓 개발자 모드 활성화!');
        renderNav();
        updateUI();
      } else if (pw !== null) alert('❌ 암호 불일치');
    }
    return;
  }

  // 2. 스토리 보기 버튼 (판정 범위 ±12px 확장)
  const s = storyReplayBtnRect;
  if (x >= s.x - 12 && x <= s.x + s.w + 12 && y >= s.y - 12 && y <= s.y + s.h + 12) {
    sound.init();
    sound.playTalk();
    showStorySelectModal = true;
    return;
  }

  // 3. 기록 초기화 버튼 (판정 범위 ±12px 확장)
  const r = resetProgressBtnRect;
  if (x >= r.x - 12 && x <= r.x + r.w + 12 && y >= r.y - 12 && y <= r.y + r.h + 12) {
    clearProgress();
    return;
  }

  // 👆 터치 모드 토글 버튼 클릭
  const t = touchModeBtnRect;
  if (x >= t.x - 10 && x <= t.x + t.w + 10 && y >= t.y - 10 && y <= t.y + t.h + 10) {
    sound.init(); sound.playPush();
    isTouchMode = !isTouchMode;
    localStorage.setItem('kimdaeri_touch_mode', isTouchMode ? 'true' : 'false');
    updateTouchModeUI();
    return;
  }

  // 4. PUSH START 버튼
  const b = pushStartBtnRect;
  if (x >= b.x - 10 && x <= b.x + b.w + 10 && y >= b.y - 10 && y <= b.y + b.h + 10) {
    onTitlePushStart();
    return;
  }
}

canvas.addEventListener('pointerdown', (e) => {
  sound.init();
  if (sound.ctx && sound.ctx.state === 'suspended') sound.ctx.resume();
  e.preventDefault();

  // 🎯 클리어 상태면 화면 터치 즉시 다음 판
  if (isCleared) {
    nextStage();
    return;
  }

  const rect = canvas.getBoundingClientRect();
  touchStartX = (e.clientX - rect.left) * (canvas.width / rect.width);
  touchStartY = (e.clientY - rect.top) * (canvas.height / rect.height);
  touchMoved = false;

  // 타이틀 화면 클릭 처리
  if (gameState === 'TITLE') {
    handleTitleClick(touchStartX, touchStartY);
    return;
  }
  if (gameState === 'STORY') {
    if (touchStartX >= canvas.width - 95 && touchStartY <= 45) skipStory();
    else advanceStory();
  }
});




function nextStage() {
  // 1. 배너 닫기
  const banner = document.getElementById('clearBanner');
  if (banner) banner.classList.remove('active');

  isCleared = false;

  // 2. 15단계면 스토리 2로 전환
  if (currentStageIndex === 14) {
    startStory(2, 'gameplay');
    return;
  }

  // 3. 다음 스테이지 또는 타이틀
  if (currentStageIndex + 1 < STAGES.length) {
    gameState = 'PLAYING';
    initStage(currentStageIndex + 1);
  } else {
    showTitleScreen();
  }
}

function showHint() {
  if (gameState !== 'PLAYING' || isCleared) return;
  
  const hintEl = document.getElementById('hintText');
  // 힌트가 이미 화면에 노출되어 있는 경우 잔여 횟수를 소비하지 않음
  if (hintEl && hintEl.style.display === 'flex') {
    return;
  }
  
  if (globalHintRemaining <= 0) return;
  
  sound.init();
  sound.playTalk();
  globalHintRemaining--;
  saveProgress();
  if (hintEl) {
    hintEl.innerHTML = STAGES[currentStageIndex].hint;
    hintEl.style.display = 'flex';
  }
  updateUI();
}

  }
}

  STAGES.forEach((stg, idx) => {
    const dot = document.createElement('div');
    const unlocked = idx === 0 || clearedStages.has(idx - 1) || devModeActive;
    const isClearedStage = clearedStages.has(idx);

    if (unlocked) {
      dot.className = `lvl-dot ${idx === currentStageIndex && gameState === 'PLAYING' ? 'active' : ''} ${isClearedStage ? 'cleared' : ''}`;
      dot.innerText = idx + 1;
      dot.title = `${stg.name} [${stg.diff}]`;
      dot.style.opacity = '1.0';
      dot.style.cursor = 'pointer';
      dot.addEventListener('click', () => {
        sound.init();
        closeStageModal();
        gameState = 'PLAYING';
        initStage(idx);

    } else {
      dot.className = 'lvl-dot locked';
      dot.innerHTML = '<span style="font-size:10px;">🔒</span>';
      dot.title = `Stage ${idx + 1} (이전 스테이지를 먼저 클리어하세요)`;
      dot.style.opacity = '0.35';
      dot.style.cursor = 'not-allowed';

    e.stopPropagation();
    const track = btn.getAttribute('data-track');
    sound.setTrack(track);
    closeBgmModal();
  });
});

// 저장된 트랙 복원
const savedTrack = localStorage.getItem('kimdaeri_bgm_track');
if (savedTrack) sound.setTrack(savedTrack);

showTitleScreen();
renderNav();
requestAnimationFrame(draw);
// 📱 사파리 배율 설정과 상관없이 무조건 100% 정비율로 화면 고정
function force100PercentScale() {
  if (window.visualViewport) {
    const scale = window.visualViewport.scale;
    const container = document.querySelector('.game-container');
    if (container && scale !== 1.0) {
      container.style.transform = `scale(${1 / scale})`;
      container.style.transformOrigin = 'center center';
    } else if (container) {
      container.style.transform = 'none';
    }
  }
}

window.visualViewport?.addEventListener('resize', force100PercentScale);
window.addEventListener('resize', force100PercentScale);
window.addEventListener('load', force100PercentScale);
</script>
