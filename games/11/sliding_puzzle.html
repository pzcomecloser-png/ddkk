<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>캐릭터 슬라이딩 퍼즐 (30 Stages)</title>
    <style>
        :root {
            --primary: #ff6b6b;
            --secondary: #4ecdc4;
            --bg-color: #f7f9fc;
            --text-color: #2c3e50;
            --board-bg: #fff;
            --tile-border: rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom) 20px;
            background-image: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            box-sizing: border-box;
            overscroll-behavior: none; 
            user-select: none; 
            -webkit-user-select: none;
        }

        .header {
            text-align: center;
            margin: 20px 0 20px 0;
            width: 100%;
        }

        h1 {
            color: var(--primary);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            margin: 0 0 10px 0;
            font-size: 1.8rem;
        }

        .status {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--secondary);
            background: white;
            padding: 10px 25px;
            border-radius: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .difficulty-badge {
            background: #ffeaa7;
            color: #d63031;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
        }

        .game-board {
            position: relative;
            background: var(--board-bg);
            padding: 8px;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1 / 1; 
            touch-action: none; 
        }

        .board-inner {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 8px;
            overflow: hidden;
            background: #f0f0f0;
        }

        .tile {
            position: absolute;
            border-radius: 4px;
            box-shadow: inset 0 0 0 1px var(--tile-border), 0 2px 4px rgba(0,0,0,0.2);
            transition: top 0.15s ease-in-out, left 0.15s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
            background-color: white;
        }

        .tile:active {
            filter: brightness(1.1);
        }

        .tile.empty {
            background: transparent !important;
            box-shadow: none;
        }

        .controls {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 400px;
            align-items: center;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            width: 100%;
        }

        button {
            flex: 1;
            padding: 16px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            color: white;
            -webkit-tap-highlight-color: transparent;
        }

        button:active {
            transform: scale(0.94);
        }

        #shuffle-btn { background-color: var(--secondary); box-shadow: 0 4px 15px rgba(78, 205, 196, 0.4); }
        #next-stage-btn { background-color: var(--primary); box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4); display: none; }
        
        /* 스테이지 선택기 */
        .stage-selector {
            width: 100%;
            padding: 10px;
            border-radius: 12px;
            border: 2px solid #eee;
            font-size: 1rem;
            text-align: center;
            background: white;
            color: var(--text-color);
            outline: none;
        }
        
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        
        .overlay h2 {
            color: var(--primary);
            font-size: 2.2rem;
            margin-bottom: 15px;
            text-align: center;
        }
        .overlay p {
            font-size: 1.1rem;
            color: #555;
            margin: 0 0 20px 0;
        }
        .full-image-preview {
            width: 150px;
            height: 150px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            background-size: cover;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>✨ 만화 퍼즐 30 ✨</h1>
        <div class="status">
            Stage <span id="stage-number">1</span>
            <span class="difficulty-badge" id="grid-badge">3x3</span>
        </div>
    </div>

    <div class="game-board" id="board-container">
        <div class="board-inner" id="board">
            <div class="overlay" id="win-overlay">
                <h2>클리어! 🎉</h2>
                <div class="full-image-preview" id="preview-img"></div>
                <p>멋지게 완성했습니다!</p>
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="btn-group">
            <button id="shuffle-btn">🔄 다시 섞기</button>
            <button id="next-stage-btn">다음 ➡️</button>
        </div>
        <select class="stage-selector" id="stage-select">
            <!-- JS로 30개 옵션 동적 생성 -->
        </select>
    </div>

    <script>
        // 30단계 스테이지 동적 생성 (DiceBear 만화/캐릭터 API 활용)
        // 난이도: 1~5 (3x3) / 6~10 (4x4) / 11~15 (5x5) / 16~20 (6x6) / 21~25 (7x7) / 26~30 (8x8)
        const STAGES = Array.from({ length: 30 }, (_, i) => {
            const stageNum = i + 1;
            let gridSize = 3;
            if (stageNum > 5) gridSize = 4;
            if (stageNum > 10) gridSize = 5;
            if (stageNum > 15) gridSize = 6;
            if (stageNum > 20) gridSize = 7;
            if (stageNum > 25) gridSize = 8;

            // 스테이지 구간별로 다른 캐릭터 그림체(style) 적용
            let style = "adventurer";
            if (stageNum > 5) style = "notionists";
            if (stageNum > 10) style = "bottts";
            if (stageNum > 15) style = "fun-emoji";
            if (stageNum > 20) style = "micah";
            if (stageNum > 25) style = "pixel-art";

            // 시드(seed)값을 통해 매번 고정된 동일한 캐릭터 이미지가 나오도록 설정
            const bgColors = ["b6e3f4", "c0aede", "d1d4f9", "ffd5dc", "ffdfbf"];
            const bgColor = bgColors[i % bgColors.length];
            const imageUrl = `https://api.dicebear.com/7.x/${style}/svg?seed=stage${stageNum}&backgroundColor=${bgColor}&size=400`;

            return { grid: gridSize, image: imageUrl };
        });

        let currentStage = 0;
        let gridSize = 3;
        let tiles = [];
        let emptyPos = { row: 2, col: 2 };
        let isAnimating = false;

        const boardEl = document.getElementById('board');
        const stageNumEl = document.getElementById('stage-number');
        const gridBadgeEl = document.getElementById('grid-badge');
        const overlayEl = document.getElementById('win-overlay');
        const previewImgEl = document.getElementById('preview-img');
        const nextStageBtn = document.getElementById('next-stage-btn');
        const stageSelectEl = document.getElementById('stage-select');

        // 스테이지 선택 드롭다운 채우기
        STAGES.forEach((stage, index) => {
            const option = document.createElement('option');
            option.value = index;
            option.textContent = `Stage ${index + 1} (${stage.grid}x${stage.grid})`;
            stageSelectEl.appendChild(option);
        });

        stageSelectEl.addEventListener('change', (e) => {
            currentStage = parseInt(e.target.value);
            initStage();
        });

        function initStage() {
            gridSize = STAGES[currentStage].grid;
            stageNumEl.textContent = currentStage + 1;
            gridBadgeEl.textContent = `${gridSize}x${gridSize}`;
            stageSelectEl.value = currentStage;
            
            boardEl.innerHTML = ''; 
            boardEl.appendChild(overlayEl); 
            overlayEl.classList.remove('active');
            nextStageBtn.style.display = 'none';
            
            // 클리어 팝업용 원본 이미지 미리보기 갱신
            previewImgEl.style.backgroundImage = `url('${STAGES[currentStage].image}')`;

            const pct = 100 / gridSize;
            tiles = [];
            
            for (let row = 0; row < gridSize; row++) {
                let rowArray = [];
                for (let col = 0; col < gridSize; col++) {
                    const isLast = (row === gridSize - 1 && col === gridSize - 1);
                    
                    const tile = document.createElement('div');
                    tile.classList.add('tile');
                    tile.style.width = `${pct}%`;
                    tile.style.height = `${pct}%`;
                    
                    if (isLast) {
                        tile.classList.add('empty');
                        emptyPos = { row, col };
                    } else {
                        tile.style.backgroundImage = `url('${STAGES[currentStage].image}')`;
                        tile.style.backgroundSize = `${gridSize * 100}% ${gridSize * 100}%`;
                        const bgPosX = gridSize > 1 ? (col / (gridSize - 1)) * 100 : 0;
                        const bgPosY = gridSize > 1 ? (row / (gridSize - 1)) * 100 : 0;
                        tile.style.backgroundPosition = `${bgPosX}% ${bgPosY}%`;
                        
                        tile.dataset.correctRow = row;
                        tile.dataset.correctCol = col;
                        
                        tile.addEventListener('click', () => handleTileClick(row, col));
                    }
                    
                    setPosition(tile, row, col);
                    boardEl.appendChild(tile);
                    
                    rowArray.push({
                        element: tile,
                        correctRow: isLast ? gridSize - 1 : row,
                        correctCol: isLast ? gridSize - 1 : col,
                        isEmpty: isLast
                    });
                }
                tiles.push(rowArray);
            }
            
            shuffleBoard();
        }

        function setPosition(element, row, col) {
            const pct = 100 / gridSize;
            element.style.top = `${row * pct}%`;
            element.style.left = `${col * pct}%`;
        }

        function handleTileClick(row, col) {
            if (isAnimating) return;
            const isAdjacent = (Math.abs(emptyPos.row - row) + Math.abs(emptyPos.col - col)) === 1;
            if (isAdjacent) {
                swapTiles(row, col, emptyPos.row, emptyPos.col);
                setTimeout(checkWin, 200); 
            }
        }

        function swapTiles(row1, col1, row2, col2) {
            isAnimating = true;
            const tile1 = tiles[row1][col1];
            const tile2 = tiles[row2][col2];
            
            tiles[row1][col1] = tile2;
            tiles[row2][col2] = tile1;
            
            if (tile1.isEmpty) emptyPos = { row: row2, col: col2 };
            else if (tile2.isEmpty) emptyPos = { row: row1, col: col1 };
            
            setPosition(tile1.element, row2, col2);
            setPosition(tile2.element, row1, col1);
            
            updateTileEvents();
            setTimeout(() => { isAnimating = false; }, 150);
        }
        
        function updateTileEvents() {
            for (let row = 0; row < gridSize; row++) {
                for (let col = 0; col < gridSize; col++) {
                    const tileObj = tiles[row][col];
                    if (!tileObj.isEmpty) {
                        const el = tileObj.element;
                        const newEl = el.cloneNode(true);
                        el.parentNode.replaceChild(newEl, el);
                        newEl.addEventListener('click', () => handleTileClick(row, col));
                        tileObj.element = newEl;
                    }
                }
            }
        }

        function checkWin() {
            let isWin = true;
            for (let row = 0; row < gridSize; row++) {
                for (let col = 0; col < gridSize; col++) {
                    const t = tiles[row][col];
                    if (t.correctRow !== row || t.correctCol !== col) {
                        isWin = false; break;
                    }
                }
            }
            if (isWin) {
                overlayEl.classList.add('active');
                if (currentStage < STAGES.length - 1) {
                    nextStageBtn.style.display = 'inline-block';
                    overlayEl.querySelector('h2').textContent = "클리어! 🎉";
                } else {
                    overlayEl.querySelector('h2').textContent = "최종장 클리어! 🏆";
                    overlayEl.querySelector('p').textContent = "모든 30개의 퍼즐을 정복했습니다!";
                }
            }
        }

        function shuffleBoard() {
            // 난이도에 비례하여 셔플 횟수 증가 (너무 많이 하면 오히려 원형으로 돌아오므로 적당히 조절)
            const moves = gridSize * gridSize * 20; 
            for (let i = 0; i < moves; i++) {
                const possibleMoves = [];
                const { row, col } = emptyPos;
                if (row > 0) possibleMoves.push({ r: row - 1, c: col });
                if (row < gridSize - 1) possibleMoves.push({ r: row + 1, c: col });
                if (col > 0) possibleMoves.push({ r: row, c: col - 1 });
                if (col < gridSize - 1) possibleMoves.push({ r: row, c: col + 1 });
                
                const randomMove = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
                const t1 = tiles[row][col];
                const t2 = tiles[randomMove.r][randomMove.c];
                
                tiles[row][col] = t2;
                tiles[randomMove.r][randomMove.c] = t1;
                emptyPos = { row: randomMove.r, col: randomMove.c };
            }
            for (let row = 0; row < gridSize; row++) {
                for (let col = 0; col < gridSize; col++) {
                    setPosition(tiles[row][col].element, row, col);
                }
            }
            updateTileEvents();
        }

        // 터치 및 스와이프 조작
        let touchStartX = 0;
        let touchStartY = 0;
        const boardContainer = document.getElementById('board-container');

        boardContainer.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: false });

        boardContainer.addEventListener('touchmove', (e) => {
            e.preventDefault(); 
        }, { passive: false });

        boardContainer.addEventListener('touchend', (e) => {
            if (isAnimating || overlayEl.classList.contains('active')) return;

            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;
            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;
            const threshold = 30; 

            if (Math.abs(dx) < threshold && Math.abs(dy) < threshold) return; 

            let targetRow = emptyPos.row;
            let targetCol = emptyPos.col;

            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 0) targetCol -= 1; 
                else targetCol += 1;        
            } else {
                if (dy > 0) targetRow -= 1; 
                else targetRow += 1;        
            }

            if (targetRow >= 0 && targetRow < gridSize && targetCol >= 0 && targetCol < gridSize) {
                handleTileClick(targetRow, targetCol);
            }
        });

        document.getElementById('shuffle-btn').addEventListener('click', () => {
            overlayEl.classList.remove('active');
            nextStageBtn.style.display = 'none';
            shuffleBoard();
        });

        nextStageBtn.addEventListener('click', () => {
            currentStage++;
            initStage();
        });

        initStage();
    </script>
</body>
</html>
