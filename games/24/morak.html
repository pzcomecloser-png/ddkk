<script>
'use strict';
/* =========================================================
   모락모락 토끼온천 (Steamy Bunny Spa)  —  © DDKK 2026
   1단계: 뼈대 · 60fps 고정 루프 · 스케일/레터박스 · 화면 모드 선택 · 개발자 모드
   2단계: 사운드 엔진 (16비트 칩튠 효과음 · BGM 4곡 · 2마디 단위 전환 · 볼륨)
   3단계: 타이틀 화면 (젤리 로고 · 온천 토끼 · 이어하기/새로하기 · 확인 창)
   4단계: 아트 렌더링 (파스텔 팔레트 · 스프라이트 캐시 · Y 정렬 · 둥근 그림자 · 스프링/스쿼시 · 에셋 8종)
   5단계: 원핑거 조작 (플로팅 조이스틱 · 관성 이동 · 넓은 설원 · 카메라 추적 · 튜토리얼)
   6단계: 설원 월드 (구역 5곳 · 언 개울/얼음벽 · 봄 땅 녹이기 · 꽃/나비 · 구역 배너 · 말풍선)
   7단계 전반: 자동 벌목 (도끼질 · 나무 체력 · 쓰러짐/그루터기 · 통나무 포물선 · 등 뒤 스택 · 통나무 HUD)
   7단계 후반: 나무 다시 자라기(새싹→뽕!) · 휘청이는 통나무 탑 · 뒤뚱 걸음 · MAX 표시 · 통나무 저장
   8단계: 바닥 타일 건설 (건설 데이터 표 · 드롭존 · 가속 투입 · 건물 솟아오름 · 해금 연쇄 · 길 안내 화살표)
   9단계: 보일러 점화 (연료 타일 · 점화 컷인 · 눈 녹기 · 노천탕 · 벚꽃 · 연료 소모/식음 · 재점화)
   10단계: 동물 손님 4종 (입장 → 퐁당 → 수건·볼 발그레 → 코인) · 요금함 · 자석 수거 · 코인 HUD · 첫 손님 컷인
   11단계: 업그레이드 발판 3종 (도끼: 동시 벌목 · 신발: 이동 속도 · 가방: 용량) · 코인 투입 · 레벨업 연출 · 레벨 표시
   12단계: 아기 펭귄 일꾼 (숙소 건설 · 코인 고용 최대 3마리 · 자동 벌목 → 보일러/건설 타일 운반 · 미끄러짐 · 휴식)
   13단계 전반: 다리 수리 (건설 타일 · 판자 연출 · 개울 건너기) · 당근밭 (자라기 · 자동 수확 · 앞치마 바구니 · 당근 HUD)
   13단계 후반: 당근주스 포장마차 (건설 · 당근 넣기 타일 · 믹서 자동 제조 · 손님 구매 → 추가 코인 · 첫 판매 컷인)
   14단계 전반: 습격 시스템 (주기 · 경보 사이렌 · 경보 컷인 · 습격 BGM · 눈보라 포털 · 적 3종 등장/이동/퇴각 · 붉은 테두리 · 방향 표시)
   14단계 후반: 적의 장난 (눈사람: 온천 얼리기 · 슬라임: 연료 갉아먹기 · 늑대: 코인 훔쳐 도망) · 피해 표시 · 습격 결과 요약
   15단계: 자동 전투 (눈덩이 자동 투척 · 체력 하트 · 넉백/경직 · 퇴치 연출 · 전리품 코인/통나무 · 늑대 코인 회수 · 습격 결과 카드)
   16단계: 방어 시설 (시바견 경비초소: 출동·물기·복귀 최대 3마리 · 눈뭉치 대포: 조준·포격·스플래시 Lv.3) · 업그레이드 발판 연동
   17단계 전반: 보스 대왕 예티 (등장 컷인 · 보스 BGM · 바닥 경고 표시 → 내려찍기/얼음 바위 · 토끼 피격·기절·통나무 흘림 · 체력 바 · 퇴치/퇴각)
   17단계 후반: 분노 2페이즈 (빨라짐 · 바위 5연발 · 이중 충격파) · 얼음문 붕괴 연출(카메라 이동) · 얼음 계곡 개방 · 반짝 얼음 결정 8개
   18단계: 마을 이야기 5장 (장 소개 컷인 · 목표 카드 · 길 안내 화살표 · 목표 달성/장 클리어 연출 · 보상 · 습격은 4장부터)
   19단계: 엔딩 (최종장 · 벚꽃 료칸 · 황금 카피바라 폭포탕 · 엔딩 씬: 축하 → 불꽃놀이 축제 → 스태프 롤 · 엔딩 왈츠) · 세이브 보강(자동 저장 · 앱 전환 시 저장)
   20단계: 마무리 (유진이에게 쓰는 아빠의 편지 · 개발자 모드 카테고리 메뉴(터치 버튼) · 단계 표시 제거 · 사라진 물체 정리 최적화 · V1.0.0)
   ========================================================= */
const VERSION = 'V1.0.0';
const RES = { portrait:{w:1170,h:2080}, landscape:{w:2080,h:1170} };
const KEY_MODE = 'morak.mode';
const FONT = '"SF Pro Rounded","Hiragino Maru Gothic ProN","Apple SD Gothic Neo",ui-rounded,system-ui,sans-serif';
const C = {
  ink:'#5b4a6b', inkSoft:'#9a88a8', pink:'#ffb6d0', pinkDeep:'#ff7fab', pinkLine:'#e46f98',
  earIn:'#ffdbe8', blush:'rgba(255,110,150,.38)', eye:'#3d2f45',
  sky1:'#bfe2ff', sky2:'#fff3fa', mint:'#7fd8cf', aqua:'#7fd3f0', shadow:'rgba(90,70,120,.16)'
};
const TAU = Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const easeInOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const store={
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};

/* ---------- 캔버스 · 해상도 · 레터박스 ---------- */
const cvs=document.getElementById('c'); let ctx=cvs.getContext('2d');
let W=1170, H=2080, mode=null, viewScale=1, bgGrad=null, pines=[];

function windowOrient(){ return innerWidth>innerHeight?'landscape':'portrait'; }
function resOrient(){ return W>H?'landscape':'portrait'; }
function setResolution(m){
  W=RES[m].w; H=RES[m].h; cvs.width=W; cvs.height=H;
  bgGrad=ctx.createLinearGradient(0,0,0,H);
  bgGrad.addColorStop(0,C.sky1); bgGrad.addColorStop(1,C.sky2);
  pines=[]; const n=Math.round(W/150);
  for(let i=0;i<n;i++){ const x=(i+.5)*W/n+Math.sin(i*12.9898)*40; pines.push({x,s:.7+((i*37)%10)/20}); }
  fit(); Snow.init();
  if(scene&&scene.layout) scene.layout();
}
function fit(){
  viewScale=Math.min(innerWidth/W, innerHeight/H);
  cvs.style.width=Math.floor(W*viewScale)+'px';
  cvs.style.height=Math.floor(H*viewScale)+'px';
}
addEventListener('resize',()=>{
  fit();
  // 모드 선택 화면에서는 기기 방향에 맞춰 선택 화면 자체를 회전
  if(scene===Select && Select.sel<0 && !tr && windowOrient()!==resOrient()) setResolution(windowOrient());
});

/* ---------- 그리기 도우미 ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function ell(x,y,rx,ry){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,TAU);}
function star(x,y,r,rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.beginPath();
  for(let i=0;i<8;i++){const q=i%2?r*.38:r,a=i*Math.PI/4;ctx.lineTo(Math.cos(a)*q,Math.sin(a)*q);}ctx.closePath();ctx.fill();ctx.restore();}
function text(s,x,y,size,col,weight,align){ctx.font=`${weight||700} ${size}px ${FONT}`;ctx.fillStyle=col;ctx.textAlign=align||'center';ctx.textBaseline='middle';ctx.fillText(s,x,y);}
function hitR(p,b){return p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h;}
function hitC(p,c){return Math.hypot(p.x-c.x,p.y-c.y)<=c.r;}

/* 핑크 아기 토끼 (머리)  o: earL, earR, blink, happy, back(뒷모습), look(-1~1 시선) */
function drawBunny(x,y,s,o){
  o=o||{}; const eL=o.earL||0, eR=o.earR||0, L=(o.look||0)*12, back=!!o.back;
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  ctx.lineWidth=5; ctx.strokeStyle=C.pinkLine; ctx.lineJoin='round'; ctx.lineCap='round';
  for(const [d,r] of [[-1,eL],[1,eR]]){
    ctx.save(); ctx.translate(d*28+L*.35,-34); ctx.rotate(d*.16+r);
    ell(0,-50,21,54); ctx.fillStyle=C.pink; ctx.fill(); ctx.stroke();
    if(!back){ ell(0,-46,10,38); ctx.fillStyle=C.earIn; ctx.fill(); }
    ctx.restore();
  }
  ell(0,0,66,56); ctx.fillStyle=C.pink; ctx.fill(); ctx.stroke();
  ell(-28,-28,16,8); ctx.fillStyle='rgba(255,255,255,.55)'; ctx.fill();
  if(!back){
    for(const d of [-1,1]){
      const ex=d*24+L;
      if(o.happy){ ctx.beginPath(); ctx.lineWidth=5; ctx.strokeStyle=C.eye; ctx.moveTo(ex-9,2); ctx.quadraticCurveTo(ex,-10,ex+9,2); ctx.stroke(); }
      else if(o.blink){ ctx.beginPath(); ctx.lineWidth=5; ctx.strokeStyle=C.eye; ctx.moveTo(ex-9,-1); ctx.quadraticCurveTo(ex,6,ex+9,-1); ctx.stroke(); }
      else{ ell(ex,-2,7.5,9); ctx.fillStyle=C.eye; ctx.fill(); ell(ex+2.5,-5.5,2.8,2.8); ctx.fillStyle='#fff'; ctx.fill(); }
      ell(d*42+L*.8,15,12,7); ctx.fillStyle=C.blush; ctx.fill();
    }
    ell(L,9,5.5,3.8); ctx.fillStyle=C.pinkDeep; ctx.fill();
    ctx.beginPath(); ctx.lineWidth=3.5; ctx.strokeStyle=C.eye;
    ctx.moveTo(L-9,15); ctx.quadraticCurveTo(L-4.5,21,L,15); ctx.quadraticCurveTo(L+4.5,21,L+9,15); ctx.stroke();
  }
  ctx.restore();
}
/* 타이틀 로고 (글자마다 물결) */
function drawTitle(cx,cy,size,t){
  const chars=[...'모락모락 토끼온천']; ctx.font=`900 ${size}px ${FONT}`;
  const gap=size*.02, ws=chars.map(c=>ctx.measureText(c).width);
  let x=cx-(ws.reduce((a,b)=>a+b,0)+gap*(chars.length-1))/2;
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.lineJoin='round';
  chars.forEach((ch,i)=>{
    if(ch!==' '){
      const px=x+ws[i]/2, py=cy+Math.sin(t*.06+i*.55)*size*.05;
      ctx.lineWidth=size*.26; ctx.strokeStyle='#7a5a8c'; ctx.strokeText(ch,px,py+size*.07);
      ctx.lineWidth=size*.2; ctx.strokeStyle='#fff'; ctx.strokeText(ch,px,py);
      const g=ctx.createLinearGradient(0,py-size/2,0,py+size/2);
      if(i<4){g.addColorStop(0,'#a8ecff');g.addColorStop(1,'#4fbde6');} else {g.addColorStop(0,'#ffc2d8');g.addColorStop(1,'#ff6f9f');}
      ctx.fillStyle=g; ctx.fillText(ch,px,py);
    }
    x+=ws[i]+gap;
  });
}
/* 김 (모락모락) */
function steam(x,y,h,t,seed){
  ctx.save(); ctx.lineCap='round'; ctx.strokeStyle='#fff';
  for(let k=0;k<2;k++){
    const p=(t*.008+seed+k*.5)%1; ctx.globalAlpha=Math.sin(p*Math.PI)*.9; ctx.lineWidth=12*(1-p*.5);
    ctx.beginPath();
    for(let j=0;j<=10;j++){const q=j/10,px=x+Math.sin(q*5+t*.04+seed*7)*12*(.5+q),py=y-p*h*.6-q*h*.4; j?ctx.lineTo(px,py):ctx.moveTo(px,py);}
    ctx.stroke();
  }
  ctx.restore();
}
/* 설원 배경 */
function hillY(x,base,amp,f){return base+Math.sin(x*f)*amp+Math.sin(x*f*2.3+1)*amp*.4;}
function hill(base,col,amp,f){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=40)ctx.lineTo(x,hillY(x,base,amp,f));ctx.lineTo(W,H);ctx.closePath();ctx.fill();}
function pine(x,y,s){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  ctx.fillStyle='#c9dcef'; for(let i=0;i<3;i++){const w=70-i*16,yy=-i*38;ctx.beginPath();ctx.moveTo(-w,yy);ctx.lineTo(0,yy-70);ctx.lineTo(w,yy);ctx.closePath();ctx.fill();}
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(-16,-136); ctx.lineTo(0,-146); ctx.lineTo(16,-136); ctx.lineTo(0,-120); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawBG(){
  ctx.fillStyle=bgGrad; ctx.fillRect(0,0,W,H);
  const b1=H*.74, b2=H*.84;
  hill(b1,'#e6f1fd',70,.004);
  for(const p of pines) pine(p.x,hillY(p.x,b1,70,.004)+20,p.s);
  hill(b2,'#ffffff',50,.006);
}

/* ---------- 파티클 (오브젝트 풀) ---------- */
const Snow={p:[],
  init(){this.p=[];const n=Math.round(W*H/16000);for(let i=0;i<n;i++){const s={};this.reset(s,true);this.p.push(s);}},
  reset(s,any){s.x=Math.random()*W;s.y=any?Math.random()*H:-20;s.r=3+Math.random()*7;s.vy=1+Math.random()*2.2;s.ph=Math.random()*TAU;s.sw=.5+Math.random()*1.2;s.a=.5+Math.random()*.5;},
  update(){for(const s of this.p){s.y+=s.vy;s.ph+=.02;s.x+=Math.sin(s.ph)*s.sw*.6;if(s.y>H+20)this.reset(s,false);}},
  render(){ctx.fillStyle='#fff';for(const s of this.p){ctx.globalAlpha=s.a;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,TAU);ctx.fill();}ctx.globalAlpha=1;}
};
const Sparks={pool:Array.from({length:96},()=>({on:false})),
  burst(x,y,n,cols){let c=0;for(const s of this.pool){if(s.on)continue;const a=Math.random()*TAU,sp=6+Math.random()*12;
    Object.assign(s,{on:true,x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-4,life:0,max:40+Math.random()*25,r:10+Math.random()*14,rot:Math.random()*TAU,col:cols[c%cols.length]});if(++c>=n)break;}},
  update(){for(const s of this.pool){if(!s.on)continue;s.x+=s.vx;s.y+=s.vy;s.vx*=.92;s.vy=s.vy*.92+.5;s.rot+=.1;if(++s.life>=s.max)s.on=false;}},
  render(){for(const s of this.pool){if(!s.on)continue;const k=1-s.life/s.max;ctx.globalAlpha=k;ctx.fillStyle=s.col;star(s.x,s.y,s.r*(.5+k*.5),s.rot);}ctx.globalAlpha=1;}
};

/* ---------- 사운드 엔진 (Web Audio · 16비트 칩튠) ---------- */
const mf=m=>440*Math.pow(2,(m-69)/12);
const VOL_LEVELS=[0,.35,.7,1], KEY_VOL='morak.vol', BGM_VOL=.6;
const A={ctx:null,voices:0,last:{},waves:{},level:2,
  loadLevel(){const v=store.get(KEY_VOL);if(v!==null&&+v>=0&&+v<=3)this.level=+v;},
  unlock(){
    if(!this.ctx){
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
      const c=this.ctx=new AC();
      const comp=c.createDynamicsCompressor(); comp.threshold.value=-12; comp.ratio.value=4; comp.connect(c.destination);
      this.master=c.createGain(); this.master.gain.value=VOL_LEVELS[this.level]; this.master.connect(comp);
      this.sfx=c.createGain(); this.sfx.gain.value=.9; this.sfx.connect(this.master);
      this.bgm=c.createGain(); this.bgm.gain.value=BGM_VOL; this.bgm.connect(this.master);   // BGM 페이더
      this.mus=c.createGain(); this.mus.connect(this.bgm);                                    // 멜로디 (에코 적용)
      const d=c.createDelay(1), fb=c.createGain(), lp=c.createBiquadFilter(), wet=c.createGain();
      d.delayTime.value=.19; fb.gain.value=.28; lp.type='lowpass'; lp.frequency.value=3000; wet.gain.value=.22;
      this.mus.connect(d); d.connect(lp); lp.connect(fb); fb.connect(d); lp.connect(wet); wet.connect(this.bgm);
      const nb=this.noiseBuf=c.createBuffer(1,c.sampleRate,c.sampleRate), ch=nb.getChannelData(0);
      for(let i=0;i<ch.length;i++) ch[i]=Math.random()*2-1;
      for(const duty of [.125,.25,.5]){const n=32,re=new Float32Array(n),im=new Float32Array(n);
        for(let k=1;k<n;k++) re[k]=2*Math.sin(k*Math.PI*duty)/(k*Math.PI); this.waves[duty]=c.createPeriodicWave(re,im);}
      const s=c.createBufferSource(); s.buffer=c.createBuffer(1,1,22050); s.connect(c.destination); s.start(0); // iOS 잠금 해제
      Music.start();
    }
    if(this.ctx.state!=='running'&&!document.hidden) this.ctx.resume();
  },
  ok(name,gap){const c=this.ctx; if(!c||c.state!=='running'||!this.level||this.voices>56) return false;
    if(gap){const n=c.currentTime; if(n-(this.last[name]??-9)<gap) return false; this.last[name]=n;} return true;},
  setLevel(l){this.level=l; store.set(KEY_VOL,l); if(this.ctx) this.master.gain.setTargetAtTime(VOL_LEVELS[l],this.ctx.currentTime,.03);},
  track(node,g){this.voices++; node.onended=()=>{this.voices--; g.disconnect();};},
  // type: 'sine'|'triangle'|… 또는 펄스 듀티(.125/.25/.5)
  osc(type,f,t,dur,vol,dest,o){
    o=o||{}; const c=this.ctx, os=c.createOscillator(), g=c.createGain(), a=o.a||.004;
    if(typeof type==='number') os.setPeriodicWave(this.waves[type]); else os.type=type;
    os.frequency.setValueAtTime(f,t);
    if(o.f2) os.frequency.exponentialRampToValueAtTime(o.f2,t+(o.st||dur));
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+a);
    if(o.sus){ g.gain.linearRampToValueAtTime(vol*.7,t+Math.min(.1,dur*.5)); g.gain.setValueAtTime(vol*.7,t+dur*.85); g.gain.linearRampToValueAtTime(0,t+dur); }

const NOTE={C:0,D:2,E:4,F:5,G:7,A:9,B:11}, accOf=s=>s==='#'?1:s==='b'?-1:0;
function noteNum(s){const r=/^([A-G])(#|b)?(\d)$/.exec(s); return 12*(+r[3]+1)+NOTE[r[1]]+accOf(r[2]);}
function chordOf(s){const r=/^([A-G])(#|b)?(m)?(7)?(?:\/([A-G])(#|b)?)?$/.exec(s), root=NOTE[r[1]]+accOf(r[2]), iv=r[3]?[0,3,7]:[0,4,7];
  if(r[4]) iv.push(10); return {root,iv,bass:r[5]?(NOTE[r[5]]+accOf(r[6])+12)%12:root};}

/* 시퀀서: 미리 예약(lookahead) 방식, 곡 전환은 2마디 경계에서 */
const Music={cur:null,next:null,want:undefined,step:0,t:0,timer:null,vis:[],shown:{song:null,bar:0,beat:0,pulse:0},
  start(){ if(!this.timer) this.timer=setInterval(()=>this.tick(),25); if(this.want!==undefined){const w=this.want; this.want=undefined; this.play(w);} },
  play(name,now){                    // name=null → 정지, now=true → 즉시 전환
    if(!A.ctx){ this.want=name; return; }
    if(!name||!this.cur||now){ this.cut(name); return; }
    this.next=name===this.cur?null:name;
  },
  cut(name){
    const n=A.ctx.currentTime, g=A.bgm.gain;
    g.cancelScheduledValues(n); g.setValueAtTime(g.value,n); g.linearRampToValueAtTime(0,n+.08);
    g.setValueAtTime(0,n+.12); g.linearRampToValueAtTime(BGM_VOL,n+.2);
    this.cur=name||null; this.next=null; this.step=0; this.t=n+.13; this.vis.length=0; if(!name) this.shown.song=null;
  },
  tick(){
    const c=A.ctx; if(!c||!this.cur||c.state!=='running') return;
    if(this.t<c.currentTime-.2) this.t=c.currentTime+.05;
    while(this.t<c.currentTime+.15){
      if(this.step%32===0&&this.next){ this.cur=this.next; this.next=null; this.step=0; }
      const S=SONGS[this.cur], sp=60/S.bpm/4, s=this.step%S.len;
      this.playStep(S,s,this.t,sp);
      if(s%4===0) this.vis.push({t:this.t,song:this.cur,bar:s>>4,beat:(s&15)>>2});
      this.step++; this.t+=sp;
    }
  },
  playStep(S,s,t,sp){
    const ch=S.ch[s>>4], i=s&15, L=S.li, R=S.arp, B=S.bass, D=S.drums, n=S.notes[s];
    if(n) A.osc(L.w,mf(n.m),t,n.len*sp*L.gate,L.v,A.mus,{sus:1,a:.008,vib:L.vib&&n.len>=4});
    if(s%R.every===0){const tones=ch.iv.map(x=>12*(R.oct+1)+ch.root+x); A.osc(R.w,mf(tones[(s/R.every)%tones.length]),t,sp*R.every*.85,R.v,A.mus);}
    const b=B.pat[i]; if(b!=='.'){const semi=b==='F'?ch.root+7:b==='O'?ch.bass+12:ch.bass; A.osc(B.w,mf(12*(B.oct+1)+semi),t,sp*(B.len||1.8),B.v,A.bgm,{sus:1,a:.005});}
    for(const k of 'ksh') if(D.v[k]&&D[k][i]==='x') Drum[k](t,D.v[k]);
  },
  update(){ if(!A.ctx) return; const n=A.ctx.currentTime, v=this.vis, sh=this.shown;   // 실제 들리는 박자에 맞춰 표시
    while(v.length&&v[0].t<=n){ Object.assign(sh,v.shift()); sh.pulse=1; } sh.pulse*=.88; }
};

/* ---------- 화면 전환 (분홍 아이리스) ---------- */
let tr=null;
function transitionTo(cb,cx,cy){ if(!tr){ tr={phase:'out',t:0,dur:28,cx:cx??W/2,cy:cy??H/2,cb}; SFX.whoosh(); } }
function updateTransition(){
  if(!tr) return; tr.t++;
  if(tr.phase==='out'&&tr.t>=tr.dur){ tr.cb&&tr.cb(); Object.assign(tr,{phase:'in',t:0,cx:W/2,cy:H/2,dur:30}); }
  else if(tr.phase==='in'&&tr.t>=tr.dur) tr=null;
}
function renderTransition(){
  if(!tr) return;
  const p=tr.phase==='out'?easeInOut(tr.t/tr.dur):1-easeInOut(tr.t/tr.dur);
  if(p<=0) return;
  const r=Math.hypot(W,H)*(1-p);
  ctx.save(); ctx.beginPath(); ctx.rect(0,0,W,H); ctx.arc(tr.cx,tr.cy,Math.max(r,.01),0,TAU,true);
  ctx.fillStyle='#ffc6da'; ctx.fill('evenodd'); ctx.restore();
  if(p>.75){ ctx.globalAlpha=(p-.75)/.25; drawBunny(W/2,H/2+40,1.6*(.8+.2*p)); ctx.globalAlpha=1; }
}

const Select={name:'모드 선택',cards:[],hover:-1,pressed:-1,sel:-1,selT:0,t:0,
  enter(){this.hover=-1;this.pressed=-1;this.sel=-1;this.selT=0;this.t=0;this.layout();Music.play('peace');},
  layout(){
    const P=W<H; this.P=P; const cw=440,ch=560,gap=P?70:150;
    Object.assign(this,P?{tY:360,tS:104,eY:460,qY:640,hY:700,top:880}:{tY:140,tS:124,eY:240,qY:322,hY:372,top:540});
    this.cards=[{m:'portrait',x:W/2-gap/2-cw},{m:'landscape',x:W/2+gap/2}].map((c,i)=>Object.assign(c,
      {y:this.top,w:cw,h:ch,sc:1,v:0,alpha:1,earT:99,earAmp:0,seed:i*97}));
  },
  pick(i){
    if(this.sel>=0||i<0) return;
    const c=this.cards[i]; this.sel=i; this.selT=0; c.v+=.1; c.earT=0; c.earAmp=1; SFX.select();
    Sparks.burst(c.x+c.w/2,c.y+c.h/2,26,[C.pink,'#fff',C.mint,'#ffe38a']);
  },
  update(){
    this.t++;
    this.cards.forEach((c,i)=>{
      const target=this.sel===i?1.06:this.sel>=0?.92:this.pressed===i?.95:this.hover===i?1.04:1;
      c.v+=(target-c.sc)*.25; c.v*=.7; c.sc+=c.v;
      c.alpha+=((this.sel>=0&&this.sel!==i?.35:1)-c.alpha)*.15;
      c.earT++; if(c.earT>80&&Math.random()<.004){c.earT=0;c.earAmp=.35;}
    });
    if(this.sel>=0&&++this.selT===50){
      const c=this.cards[this.sel]; mode=c.m; store.set(KEY_MODE,mode);
      transitionTo(()=>{setResolution(mode);go(Title);},c.x+c.w/2,c.y+c.h/2);
    }
  },
  cardAt(p){return this.cards.findIndex(c=>hitR(p,c));},
  down(p){if(this.sel<0)this.pressed=this.cardAt(p);},
  move(p,type){if(type==='mouse'&&this.sel<0)this.hover=this.cardAt(p);},
  up(p){const i=this.cardAt(p);if(i>=0&&i===this.pressed)this.pick(i);this.pressed=-1;},
  key(k){if(k==='ArrowLeft')this.hover=0;else if(k==='ArrowRight')this.hover=1;else if(k==='Enter'||k===' ')this.pick(this.hover);},
  renderCard(c,i){
    const t=this.t, f=Math.sin(t*.04+i*1.7)*8;
    const ear=c.earT<70?Math.sin(c.earT*.7)*.5*c.earAmp*Math.exp(-c.earT/14):0;
    ctx.save(); ctx.globalAlpha=c.alpha;
    ctx.translate(c.x+c.w/2,c.y+c.h/2+f); ctx.scale(c.sc,c.sc); ctx.translate(-c.w/2,-c.h/2);
    drawBunny(c.w/2,8,.95,{earL:-ear*.6,earR:ear,blink:(t+c.seed)%230<8});
    ctx.fillStyle=C.shadow; rr(10,26,c.w-20,c.h,46); ctx.fill();
    rr(0,0,c.w,c.h,46); ctx.fillStyle='#fff'; ctx.fill();
    ctx.lineWidth=6; ctx.strokeStyle=this.sel===i?C.pinkDeep:this.hover===i?'#ffc9dc':'#efe4f4'; ctx.stroke();
    for(const d of [-1,1]){ell(c.w/2+d*44,2,22,14);ctx.fillStyle=C.pink;ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=C.pinkLine;ctx.stroke();}
    // 기기 아이콘
    const P=c.m==='portrait', dw=P?150:270, dh=P?250:160, dx=c.w/2-dw/2, dy=220-dh/2;
    rr(dx,dy,dw,dh,28); ctx.fillStyle=C.ink; ctx.fill();
    ctx.save(); rr(dx+10,dy+10,dw-20,dh-20,20); ctx.clip();
    const g=ctx.createLinearGradient(0,dy,0,dy+dh); g.addColorStop(0,C.sky1); g.addColorStop(1,'#fff'); ctx.fillStyle=g; ctx.fillRect(dx,dy,dw,dh);
    ctx.fillStyle='#fff'; ell(c.w/2-dw*.2,dy+dh*.95,dw*.6,dh*.3); ctx.fill(); ell(c.w/2+dw*.3,dy+dh,dw*.5,dh*.28); ctx.fill();
    ell(c.w/2,dy+dh*.72,dw*.2,dh*.07); ctx.fillStyle=C.aqua; ctx.fill();
    ell(c.w/2,dy+dh*.62,9,9); ctx.fillStyle=C.pinkDeep; ctx.fill();
    ctx.restore();
    text(P?'세로 모드':'가로 모드',c.w/2,400,58,C.ink,800);
    text(P?'1170 × 2080':'2080 × 1170',c.w/2,454,32,C.inkSoft,600);
    const tag=P?'iPhone 추천':'iPad · Mac 추천'; ctx.font=`700 28px ${FONT}`; const tw=ctx.measureText(tag).width+48;
    rr(c.w/2-tw/2,488,tw,50,25); ctx.fillStyle='#fff0f6'; ctx.fill(); text(tag,c.w/2,514,28,C.pinkDeep,700);
    if(mode===c.m&&this.sel<0){rr(c.w-118,24,96,44,22);ctx.fillStyle='#e9f8f6';ctx.fill();text('현재',c.w-70,47,26,'#3fa99e',800);}
    if(this.sel===i){
      const k=clamp(this.selT/12,0,1), s=k<1?k*1.25:1;
      ctx.save(); ctx.translate(c.w-36,36); ctx.scale(s,s);
      ell(0,0,40,40); ctx.fillStyle=C.mint; ctx.fill(); ctx.lineWidth=6; ctx.strokeStyle='#fff'; ctx.stroke();
      ctx.beginPath(); ctx.lineWidth=9; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.moveTo(-16,0); ctx.lineTo(-4,12); ctx.lineTo(17,-11); ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  },
  render(){
    const t=this.t; drawBG();
    if(this.P){ // 세로: 하단에 작은 온천
      const ox=W/2, oy=1720;
      for(let i=0;i<14;i++){const a=i/14*TAU;ell(ox+Math.cos(a)*260,oy+Math.sin(a)*95,46,30);ctx.fillStyle=i%2?'#d9d2e6':'#cbc2db';ctx.fill();}
      ell(ox,oy,240,80); ctx.fillStyle=C.aqua; ctx.fill(); ell(ox-60,oy-18,90,20); ctx.fillStyle='rgba(255,255,255,.45)'; ctx.fill();
      for(let k=0;k<4;k++) steam(ox-150+k*100,oy-30,200,t,k*.27);
    }
    Snow.render();
    const tS=this.tS; ctx.font=`900 ${tS}px ${FONT}`; const half=ctx.measureText('모락모락 토끼온천').width/2;
    for(let k=0;k<3;k++) steam(W/2-half+tS*.5+k*tS*.95,this.tY-tS*.55,150,t,k*.31);
    drawTitle(W/2,this.tY,tS,t);
    ctx.font=`800 34px ${FONT}`; if('letterSpacing' in ctx) ctx.letterSpacing='10px';
    text('STEAMY BUNNY SPA',W/2,this.eY,34,C.inkSoft,800); if('letterSpacing' in ctx) ctx.letterSpacing='0px';
    text('어떤 화면으로 놀까요?',W/2,this.qY,54,C.ink,800);
    text('나중에 설정(⚙︎)에서 언제든 바꿀 수 있어요',W/2,this.hY,30,C.inkSoft,600);
    this.cards.forEach((c,i)=>this.renderCard(c,i));
  }
};

/* ---------- 씬: 준비 화면 (2단계 사운드 테스트) ---------- */
const BGM_BTNS=[['peace','평화'],['raid','습격'],['boss','보스'],['ending','엔딩'],[null,'정지']];
const SFX_BTNS=[['chop','도끼 통!'],['drop','투입 뾱'],['dropRun','연속 투입'],['coin','코인'],['coins','코인 우르르'],['build','건설 뿅!'],
  ['levelup','레벨업'],['alarm','경보'],['hit','타격'],['stomp','보스 쿵'],['tap','탭'],['select','선택']];
const Hub={name:'사운드 테스트',t:0,press:null,btns:[],dropI:0,dropT:-99,
  enter(){this.t=0;this.press=null;this.layout();Music.play('peace');},
  layout(){
    const P=W<H; this.P=P; this.pw=P?960:1700; this.ph=P?1280:900;
    this.px=W/2-this.pw/2; this.py=P?(H-this.ph)/2+40:(H-this.ph)/2;
    const {px,py,ph}=this, bx=P?px+40:px+80, bw=P?880:760, sx=P?px+40:px+880, sw=P?880:740;
    const bY=py+(P?340:310), sY=py+(P?640:310), sh=P?96:88, sg=16;
    this.labels=[['배경음악',bx,bY-44],['효과음',sx,sY-44]]; this.np={x:bx,y:bY+(P?150:160)};
    this.btns=[];
    const w1=(bw-80)/5; BGM_BTNS.forEach(([id,l],i)=>this.btns.push({k:'bgm',id,l,x:bx+i*(w1+20),y:bY,w:w1,h:96,f:0}));
    const w2=(sw-40)/3; SFX_BTNS.forEach(([id,l],i)=>this.btns.push({k:'sfx',id,l,x:sx+(i%3)*(w2+20),y:sY+Math.floor(i/3)*(sh+sg),w:w2,h:sh,f:0}));
    this.btns.push({k:'mode',l:'타이틀로',x:W/2-270,y:py+ph-130,w:540,h:100,f:0});
    this.gear={x:100,y:100,r:58};
  },
  update(){this.t++; for(const b of this.btns) b.f*=.9;},
  btnAt(p){return this.btns.find(b=>hitR(p,b));},
  down(p){
    const b=this.btnAt(p);
    if(b) this.press=b; else if(hitC(p,this.gear)) this.press='gear';
    else { this.press=null; Sparks.burst(p.x,p.y,10,[C.pink,'#fff',C.mint]); SFX.tap(); }
  },
  up(p){
    const pr=this.press; this.press=null;
    if(pr==='gear'){ if(hitC(p,this.gear)) openModeSelect(p); return; }
    if(!pr||!hitR(p,pr)) return;
    pr.f=1;
    if(pr.k==='mode'){ transitionTo(()=>go(Title),p.x,p.y); return; }
    if(pr.k==='bgm'){ Music.play(pr.id); if(!pr.id) SFX.tap(); return; }
    Sparks.burst(pr.x+pr.w/2,pr.y+pr.h/2,8,[C.pink,'#fff','#ffe38a']);
    if(pr.id==='drop'){ if(this.t-this.dropT>70) this.dropI=0; this.dropT=this.t; SFX.drop(this.dropI++); }
    else if(pr.id==='dropRun') SFX.dropRun(15);
    else if(pr.id==='coins') SFX.coins(12);
    else SFX[pr.id]();
  },
  drawBtn(b){
    const ms=Music.shown, on=b.k==='bgm'&&(b.id?Music.cur===b.id:!Music.cur&&A.ctx), q=b.k==='bgm'&&b.id&&Music.next===b.id;
    const s=(this.press===b?.94:1)+b.f*.06, primary=b.k==='mode'||on;
    ctx.save(); ctx.translate(b.x+b.w/2,b.y+b.h/2); ctx.scale(s,s);
    rr(-b.w/2,-b.h/2+7,b.w,b.h,b.h/2); ctx.fillStyle=primary?'#e0628f':'#e6dcef'; ctx.fill();
    rr(-b.w/2,-b.h/2,b.w,b.h,b.h/2); ctx.fillStyle=primary?C.pinkDeep:b.f>.05?'#fff0f6':'#fff'; ctx.fill();
    if(on&&b.id){ ctx.globalAlpha=ms.pulse*.5; ctx.lineWidth=8; ctx.strokeStyle='#ffd1e1'; ctx.stroke(); ctx.globalAlpha=1; }
    if(q){ ctx.setLineDash([14,10]); ctx.lineDashOffset=-this.t; ctx.lineWidth=5; ctx.strokeStyle=C.pinkDeep; ctx.stroke(); ctx.setLineDash([]); }
    text(b.l,0,0,b.k==='mode'?42:this.P?36:32,primary?'#fff':C.ink,800);
    ctx.restore();
  },
  render(){
    const t=this.t, P=this.P, {px,py,pw,ph}=this;
    drawBG(); Snow.render();
    const gs=this.press==='gear'?.9:1; ctx.save(); ctx.translate(this.gear.x,this.gear.y); ctx.scale(gs,gs);
    ell(0,6,58,58); ctx.fillStyle=C.shadow; ctx.fill(); ell(0,0,58,58); ctx.fillStyle='#fff'; ctx.fill();
    ctx.rotate(t*.005); ctx.beginPath();
    for(let i=0;i<32;i++){const a=i/32*TAU,q=(Math.floor(i/2)%2)?24:32;ctx.lineTo(Math.cos(a)*q,Math.sin(a)*q);}
    ctx.closePath(); ctx.fillStyle=C.ink; ctx.fill(); ell(0,0,10,10); ctx.fillStyle='#fff'; ctx.fill(); ctx.restore();
    // 패널 (토끼는 박자에 맞춰 까딱)
    const ms=Music.shown, bob=ms.song?ms.pulse*10:0, ear=Math.sin(t*.05)*.08+(ms.song?ms.pulse*.12:0);
    drawBunny(W/2,py+10-bob,P?1.05:.85,{earL:-ear,earR:ear,blink:t%240<8});
    ctx.fillStyle=C.shadow; rr(px+12,py+28,pw-24,ph,56); ctx.fill();
    rr(px,py,pw,ph,56); ctx.fillStyle='rgba(255,255,255,.96)'; ctx.fill();
    for(const d of [-1,1]){ell(W/2+d*(P?46:38),py+4,P?23:19,P?15:12);ctx.fillStyle=C.pink;ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=C.pinkLine;ctx.stroke();}
    drawTitle(W/2,py+(P?130:110),84,t);
    ctx.font=`800 30px ${FONT}`; const bw=ctx.measureText('개발 확인 · 사운드 테스트').width+56, by=py+(P?188:166);
    rr(W/2-bw/2,by,bw,54,27); ctx.fillStyle='#e9f8f6'; ctx.fill(); text('개발 확인 · 사운드 테스트',W/2,by+28,30,'#3fa99e',800);
    for(const [l,x,y] of this.labels) text(l,x+8,y,38,C.inkSoft,800,'left');
    if(!A.ctx) text('화면을 터치하면 소리가 켜져요',this.np.x+8,this.np.y,34,C.pinkDeep,700,'left');
    else if(ms.song){
      const S=SONGS[ms.song];
      text(`♪ ${S.name}  ${S.bpm} BPM${Music.next?`  →  ${SONGS[Music.next].name} 대기 (2마디 뒤)`:''}`,this.np.x+8,this.np.y,34,C.ink,700,'left');
      for(let i=0;i<S.bars;i++){ const x=this.np.x+30+i*56, y=this.np.y+62, cur=i===ms.bar;
        ell(x,y,cur?18+ms.pulse*5:13,cur?18+ms.pulse*5:13); ctx.fillStyle=cur?C.pinkDeep:i<ms.bar?C.pink:'#efe4f4'; ctx.fill(); }
      for(let k=0;k<4;k++){ const x=this.np.x+30+S.bars*56+30+k*36, y=this.np.y+62;
        ell(x,y,9,9); ctx.fillStyle=k===ms.beat?C.mint:'#e3eef0'; ctx.fill(); }
    } else text('음악 정지',this.np.x+8,this.np.y,34,C.inkSoft,700,'left');
    this.btns.forEach(b=>this.drawBtn(b));
    text('다음 → 5단계: 핑크 토끼 + 원핑거 조작',W/2,py+ph+(P?70:45),P?32:30,C.inkSoft,700);
    if(Input.down){ctx.lineWidth=6;ctx.strokeStyle='rgba(255,127,171,.7)';ell(Input.x,Input.y,46+Math.sin(t*.3)*4,46+Math.sin(t*.3)*4);ctx.stroke();}
  }
};
function openModeSelect(p){ transitionTo(()=>{setResolution(windowOrient());go(Select);},p.x,p.y); }

/* ---------- 저장 데이터 ---------- */
const KEY_SAVE='morak.save';
function loadSave(){ try{ const s=JSON.parse(store.get(KEY_SAVE)); return s&&s.v?s:null; }catch(e){ return null; } }
function writeSave(s){ store.set(KEY_SAVE,JSON.stringify(s)); }
const pad2=n=>String(n).padStart(2,'0');
function fmtDate(t){ const d=new Date(t); return `${d.getMonth()+1}/${d.getDate()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }

/* ---------- 타이틀 소품 ---------- */
const rnd=(i,s)=>{const x=Math.sin(i*12.9898+(s||0)*78.233)*43758.5453; return x-Math.floor(x);};
const easeOutBack=t=>{const c=1.70158; return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
function withCtx(c2,fn){const o=ctx; ctx=c2; try{fn();}finally{ctx=o;}}
function cloud(x,y,s){ctx.fillStyle='rgba(255,255,255,.78)';
  for(const [dx,dy,r] of [[-70,12,40],[-25,-12,56],[30,-2,46],[74,14,32]]){ell(x+dx*s,y+dy*s,r*s*1.3,r*s);ctx.fill();}}
function mountains(hz,n,hMin,hMax,col,seed){
  for(let i=0;i<n;i++){
    const x=(i+.5)/n*W+(rnd(i,seed)-.5)*W/n*.6, h=hMin+rnd(i+9,seed)*(hMax-hMin), w=h*(1.1+rnd(i+3,seed)*.5), y0=hz-h;
    ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(x-w,hz+2); ctx.lineTo(x,y0); ctx.lineTo(x+w,hz+2); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(x,y0); ctx.lineTo(x+w*.28,y0+h*.28); ctx.lineTo(x+w*.12,y0+h*.22);
    ctx.lineTo(x,y0+h*.3); ctx.lineTo(x-w*.14,y0+h*.21); ctx.lineTo(x-w*.28,y0+h*.28); ctx.closePath(); ctx.fill();
  }
}
function lantern(x,y,s){
  const st='#d6cee3', sh='#bdb3d0';
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  ell(0,4,74,15); ctx.fillStyle='rgba(120,110,160,.15)'; ctx.fill();
  rr(-52,-22,104,24,8); ctx.fillStyle=sh; ctx.fill();
  rr(-18,-112,36,92,8); ctx.fillStyle=st; ctx.fill();
  rr(-56,-134,112,24,8); ctx.fillStyle=sh; ctx.fill();
  rr(-40,-206,80,74,10); ctx.fillStyle=st; ctx.fill();
  rr(-24,-192,48,46,6); ctx.fillStyle='#ffe2a6'; ctx.fill();
  ctx.strokeStyle=sh; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(0,-192); ctx.lineTo(0,-146); ctx.moveTo(-24,-169); ctx.lineTo(24,-169); ctx.stroke();
  ctx.fillStyle=sh; ctx.beginPath(); ctx.moveTo(-86,-202); ctx.lineTo(-30,-242); ctx.lineTo(30,-242); ctx.lineTo(86,-202); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#fff'; ell(0,-240,40,12); ctx.fill(); ell(-52,-218,22,8); ctx.fill(); ell(50,-216,20,7); ctx.fill();
  ell(0,-254,12,12); ctx.fillStyle=st; ctx.fill(); ell(-3,-262,9,5); ctx.fillStyle='#fff'; ctx.fill();
  ctx.restore();
}
function rock(r){ell(r.x,r.y+7,r.r*1.15,r.r*.72);ctx.fillStyle='#b9afcd';ctx.fill();ell(r.x,r.y,r.r*1.15,r.r*.7);ctx.fillStyle='#d6cee4';ctx.fill();
  ell(r.x-r.r*.12,r.y-r.r*.3,r.r*.82,r.r*.36);ctx.fillStyle='#fff';ctx.fill();}
function duck(x,y,s,dir){
  ctx.save(); ctx.translate(x,y); ctx.scale(s*dir,s);
  ctx.lineWidth=4; ctx.strokeStyle='rgba(255,255,255,.6)'; ell(0,14,46,9); ctx.stroke();
  ctx.fillStyle='#ffe37d'; ell(0,0,34,20); ctx.fill(); ell(-30,-10,12,9); ctx.fill(); ell(18,-22,16,16); ctx.fill();
  ctx.fillStyle='#ffd24f'; ell(-4,-3,15,8); ctx.fill();
  ctx.fillStyle='#ff9f5a'; ell(35,-20,10,5); ctx.fill();

function paw(x,y,s,col){ctx.fillStyle=col;ell(x,y+4*s,13*s,11*s);ctx.fill();for(const [dx,dy] of [[-12,-9],[0,-14],[12,-9]]){ell(x+dx*s,y+dy*s,5.5*s,6*s);ctx.fill();}}
function bathBody(x,y,s){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.lineWidth=5; ctx.strokeStyle=C.pinkLine;
  for(const d of [-1,1]){ell(d*30,104,15,11);ctx.fillStyle=C.pink;ctx.fill();ctx.stroke();}

function towel(x,y,s){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.rotate(-.08);
  rr(-38,-78,76,28,13); ctx.fillStyle='#fff'; ctx.fill(); ctx.lineWidth=4; ctx.strokeStyle='#e2d6ea'; ctx.stroke();
  ctx.beginPath(); ctx.lineWidth=5; ctx.lineCap='round'; ctx.strokeStyle=C.pink; ctx.moveTo(-28,-64); ctx.lineTo(28,-64); ctx.stroke();

function drawGear(x,y,t,pressed){
  const gs=pressed?.9:1; ctx.save(); ctx.translate(x,y); ctx.scale(gs,gs);
  ell(0,6,58,58); ctx.fillStyle=C.shadow; ctx.fill(); ell(0,0,58,58); ctx.fillStyle='#fff'; ctx.fill();
  ctx.rotate(t*.005); ctx.beginPath();
  for(let i=0;i<32;i++){const a=i/32*TAU,q=(Math.floor(i/2)%2)?24:32;ctx.lineTo(Math.cos(a)*q,Math.sin(a)*q);}
  ctx.closePath(); ctx.fillStyle=C.ink; ctx.fill(); ell(0,0,10,10); ctx.fillStyle='#fff'; ctx.fill(); ctx.restore();

/* ---------- 씬: 타이틀 ---------- */
const Title={name:'타이틀',cs:[],glyphs:[],

    [[-.5,-.4],[0,-.62],[.5,-.4]].forEach(([a,b],i)=>objs.push({type:'coin',x:this.px+a*this.pr,y:this.py+b*this.pry,s:ms,ph:i*1.3}));
    for(let i=0,n=0;n<10&&i<80;i++){
      const a=rnd(i,41)*TAU, r=.4+rnd(i,42)*.48, x=this.px+Math.cos(a)*r*this.pr, y=this.py+Math.sin(a)*r*this.pry;
      if(objs.some(o=>(o.type==='coin'||o.type==='flower')&&Math.hypot(o.x-x,o.y-y)<46*ms)) continue;
      objs.push({type:'flower',x,y,s:ms*(.85+rnd(i,43)*.3),pink:rnd(i,44)<.6,sw:new Spring(.12,.85),cd:0}); n++;
    }
    this.twinkles=Array.from({length:18},(_,i)=>({x:this.wx0+rnd(i,51)*(this.wx1-this.wx0),y:this.wy0+rnd(i,52)*(this.wy1-this.wy0),ph:rnd(i,53)*TAU}));
    this.b={type:'bunny',x:this.px,y:this.py+this.pry*.15,s:P?.8:.62,vx:0,vy:0,sp:P?9:7.5,dir:1,back:false,ph:0,mv:0,step:1,
      sq:new Spring(.3,.7),z:0,vz:0,tx:null,ty:null,stuck:0,idle:0,blink:0,blinkT:120,happy:0};
    objs.push(this.b);
    this.bakeGround();
  },
  bakeGround(){
    const c=this.ground||(this.ground=document.createElement('canvas')); c.width=W; c.height=H;
    withCtx(c.getContext('2d'),()=>{
      let g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#f8faff'); g.addColorStop(1,'#e8eef9'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
      for(let i=0;i<24;i++){ const x=rnd(i,21)*W, y=rnd(i,22)*H, rx=90+rnd(i,23)*170, ry=20+rnd(i,24)*22;
        ell(x+8,y+8,rx,ry); ctx.fillStyle='rgba(200,213,238,.32)'; ctx.fill(); ell(x,y,rx*.92,ry*.85); ctx.fillStyle='rgba(255,255,255,.85)'; ctx.fill(); }
      ctx.fillStyle='rgba(175,198,236,.45)'; for(let i=0;i<140;i++) ctx.fillRect(rnd(i,31)*W,rnd(i,32)*H,3,3);
      // 눈이 녹은 봄 땅 미리보기
      const {px,py,pr,pry}=this;
      ell(px,py+10,pr+30,pry+22); ctx.fillStyle='rgba(200,213,238,.55)'; ctx.fill();
      ctx.beginPath(); for(let i=0;i<=64;i++){ const a=i/64*TAU, k=1+.045*Math.sin(a*7)+.025*Math.sin(a*13+1); i?ctx.lineTo(px+Math.cos(a)*pr*k,py+Math.sin(a)*pry*k):ctx.moveTo(px+pr*k,py); }
      ctx.closePath(); ctx.fillStyle=PAL.grass; ctx.fill();
      ell(px-pr*.12,py-pry*.15,pr*.62,pry*.5); ctx.fillStyle=PAL.grassHi; ctx.fill();
      ctx.strokeStyle=PAL.grass2; ctx.lineWidth=4; ctx.lineCap='round';
      for(let i=0;i<18;i++){ const a=rnd(i,61)*TAU, r=rnd(i,62)*.85, x=px+Math.cos(a)*r*pr, y=py+Math.sin(a)*r*pry;
        ctx.beginPath(); ctx.moveTo(x-7,y-10); ctx.lineTo(x,y); ctx.lineTo(x+7,y-10); ctx.moveTo(x,y); ctx.lineTo(x,y-13); ctx.stroke(); }
      ctx.fillStyle='#fff'; for(let i=0;i<28;i++){ const a=i/28*TAU; ell(px+Math.cos(a)*pr*1.03,py+Math.sin(a)*pry*1.05,16+rnd(i,63)*10,9+rnd(i,64)*5); ctx.fill(); }
    });
  },
  print(b){
    const x=b.x+(b.step>0?-12:12)*b.s, y=b.y;
    if(((x-this.px)/this.pr)**2+((y-this.py)/this.pry)**2<1) return;   // 잔디 위엔 발자국 없음
    const f=this.prints[this.pi++%this.prints.length]; f.on=true; f.x=x; f.y=y; f.life=0; f.a=Math.atan2(b.vy,b.vx);
  },
  update(){
    const t=++this.t, b=this.b;
    // 이동 (5단계에서 조이스틱으로 교체 예정, 지금은 탭한 곳으로 걸어감)
    let tvx=0,tvy=0;
    if(b.tx!=null){ const dx=b.tx-b.x, dy=b.ty-b.y, d=Math.hypot(dx,dy);
      if(d<b.sp){ b.tx=null; b.sq.kick(.06); FX.puff(b.x,b.y,4,'#fff',b.s); }
      else{ const f=Math.max(.35,Math.min(1,d/80)); tvx=dx/d*b.sp*f; tvy=dy/d*b.sp*f; } }
    b.vx+=(tvx-b.vx)*.22; b.vy+=(tvy-b.vy)*.22;
    const ox=b.x, oy=b.y; b.x+=b.vx; b.y+=b.vy;
    const br=24*b.s/.8;
    for(const o of this.solids){ const dx=b.x-o.x, dy=(b.y-o.y)*1.6, d=Math.hypot(dx,dy), m=o.r+br;
      if(d<m&&d>.01){ const k=(m-d)/d; b.x+=dx*k; b.y+=dy*k/1.6; } }
    b.x=clamp(b.x,this.wx0,this.wx1); b.y=clamp(b.y,this.wy0,this.wy1);
    if(b.tx!=null){ if(Math.hypot(b.x-ox,b.y-oy)<b.sp*.2){ if(++b.stuck>18){ b.tx=null; b.stuck=0; } } else b.stuck=0; }
    const spd=Math.hypot(b.vx,b.vy);
    b.mv+=((spd>.8?1:0)-b.mv)*.18;
    if(spd>.8){ if(b.vx>.6) b.dir=1; else if(b.vx<-.6) b.dir=-1; b.back=b.vy<-Math.abs(b.vx)*.8; b.ph+=.12+spd*.026; b.idle=0; }
    else b.ph+=(Math.round(b.ph/Math.PI)*Math.PI-b.ph)*.2;   // 멈추면 발 모으기
    const st=Math.sin(b.ph)>=0?1:-1;
    if(st!==b.step){ b.step=st; if(b.mv>.5&&b.z===0){ this.print(b); SFX.step(); } }
    // 점프 (토끼 탭) : 공중에선 길쭉, 착지하면 납작
    if(b.z<0||b.vz<0){ b.vz+=1.1; b.z+=b.vz; if(b.z>=0){ b.z=0; b.vz=0; b.sq.kick(.11); FX.puff(b.x,b.y,5,'#fff',b.s); SFX.step(); } }
    b.sq.t=b.z<0?clamp(-Math.abs(b.vz)*.012,-.14,0):(b.mv<.1?Math.sin(t*.07)*.015:0);
    b.sq.step();
    // 가만히 있으면 혼자 산책
    if(b.tx==null&&b.z===0&&b.mv<.1&&t-this.lastTap>300&&++b.idle>170){ b.idle=0;
      for(let k=0;k<12;k++){ const x=this.wx0+Math.random()*(this.wx1-this.wx0), y=this.wy0+Math.random()*(this.wy1-this.wy0);
        if(Math.hypot(x-b.x,y-b.y)>200&&!this.solids.some(o=>Math.hypot(x-o.x,(y-o.y)*1.6)<o.r+60)){ b.tx=x; b.ty=y; break; } } }
    if(--b.blinkT<0){ b.blink=8; b.blinkT=140+Math.random()*220; }
    if(b.blink>0) b.blink--; if(b.happy>0) b.happy--;
    // 나무 뒤에 숨으면 나무를 반투명하게 · 꽃은 지나가면 살랑
    const bx0=b.x-40*b.s, bx1=b.x+40*b.s, by0=b.y+b.z-250*b.s;
    for(const o of this.objs){
      if(o.type==='tree'){ o.wob.step(); o.sq.step();
        const hid=b.y<o.y-4&&bx1>o.x-90*o.k&&bx0<o.x+90*o.k&&b.y>o.y-275*o.k&&by0<o.y-30*o.k;
        o.fade+=((hid?.45:1)-o.fade)*.15; }
      else if(o.type==='flower'){ o.sw.step(); if(o.cd>0) o.cd--;
        if(o.cd===0&&b.mv>.3&&Math.abs(b.x-o.x)<44*b.s/.8&&Math.abs(b.y-o.y)<26){ o.sw.kick((o.x>b.x?1:-1)*.07); o.cd=25; } }
    }
    for(const f of this.prints) if(f.on&&++f.life>300) f.on=false;
    if(this.marker&&++this.marker.life>30) this.marker=null;
    for(const s of this.slots) s.step();
    FX.update();
  },
  hitTree(p){ let best=null; for(const o of this.objs) if(o.type==='tree'&&Math.abs(p.x-o.x)<88*o.k&&p.y<o.y-20*o.k&&p.y>o.y-275*o.k&&(!best||o.y>best.y)) best=o; return best; },
  slotAt(p){ const s=this.shelf; if(!hitR(p,s)) return -1; return clamp(Math.floor((p.x-s.x-20)/((s.w-40)/SHELF.length)),0,SHELF.length-1); },
  shake(o,px){ o.wob.kick((px<o.x?1:-1)*.07); o.sq.kick(.07); SFX.chop();
    FX.leaves(o.x,o.y-170*o.k,8,o.y+10,o.k); FX.puff(o.x,o.y-200*o.k,3,'#fff',o.k); },
  down(p){
    this.press=null;
    if(hitC(p,this.backB)){ this.press='back'; return; }
    if(hitC(p,this.sndB)){ this.press='snd'; return; }
    const si=this.slotAt(p);
    if(si>=0){ this.slots[si].kick(.16); const it=SHELF[si]; it.snd==='drop'?SFX.drop(3):SFX[it.snd](); return; }
    const b=this.b; this.lastTap=this.t;
    if(Math.hypot(p.x-b.x,p.y-(b.y+b.z-110*b.s))<95*b.s){ if(b.z===0){ b.vz=-17*Math.sqrt(b.s/.8); b.happy=70; b.sq.kick(-.08); SFX.jump(); } return; }
    const tree=this.hitTree(p); if(tree){ this.shake(tree,p.x); return; }
    if(p.y<this.wy0-60||p.y>this.shelf.y) return;
    b.tx=clamp(p.x,this.wx0,this.wx1); b.ty=clamp(p.y,this.wy0,this.wy1); b.stuck=0;
    this.marker={x:b.tx,y:b.ty,life:0}; SFX.tap();
  },
  up(p){
    const pr=this.press; this.press=null;
    if(pr==='back'&&hitC(p,this.backB)) transitionTo(()=>go(Title),p.x,p.y);
    else if(pr==='snd'&&hitC(p,this.sndB)) transitionTo(()=>go(Hub),p.x,p.y);
  },
  shadowO(o){
    const k=o.k, s=o.s;
    switch(o.type){
      case 'tree': shadow(o.x,o.y,74*k,22*k,.2); break;
      case 'rock': shadow(o.x,o.y-2,58*s,16*s,.2); break;
      case 'mound': shadow(o.x,o.y-2,76*s,15*s,.14); break;
      case 'pile': shadow(o.x,o.y,120*s,20*s,.2); break;
      case 'stump': shadow(o.x,o.y,44*s,13*s,.2); break;
      case 'coin': { const h=Math.sin(this.t*.06+o.ph); shadow(o.x,o.y,(18-h*2)*s,(7-h)*s,.18); break; }
      case 'flower': shadow(o.x,o.y,14*s,5*s,.14); break;
      case 'bunny': { const f=1/(1-o.z*.004); shadow(o.x,o.y,46*s*f,15*s*f,.24*f); break; }
    }
  },
  drawO(o){
    switch(o.type){
      case 'tree': drawSpr(SPR.pine(),o.x,o.y,o.k,o.sq.x,o.wob.x,o.fade); break;
      case 'rock': drawSpr(SPR.rock(),o.x,o.y,o.s); break;
      case 'mound': drawSpr(SPR.mound(),o.x,o.y,o.s); break;
      case 'pile': drawSpr(SPR.pile(),o.x,o.y,o.s); break;
      case 'stump': drawSpr(SPR.stump(),o.x,o.y,o.s); break;
      case 'flower': drawSpr(o.pink?SPR.flowerP():SPR.flowerY(),o.x,o.y,o.s,0,o.sw.x); break;
      case 'coin': drawCoin(o.x,o.y,o.s,this.t,o.ph); break;
      case 'bunny': drawBunnyBody(o.x,o.y+o.z,o.s,{dir:o.dir,back:o.back,walk:o.ph,mv:o.mv,sq:o.sq.x,blink:o.blink>0,happy:o.happy>0}); break;
    }
  },
  renderShelf(){
    const s=this.shelf, P=this.P, n=SHELF.length, sw=(s.w-40)/n, gy=s.y+s.h-(P?70:60), box=gy-s.y-22;
    ctx.fillStyle=C.shadow; rr(s.x+10,s.y+14,s.w-20,s.h,36); ctx.fill();
    rr(s.x,s.y,s.w,s.h,36); ctx.fillStyle='rgba(255,255,255,.95)'; ctx.fill();
    SHELF.forEach((it,i)=>{
      const cx=s.x+20+sw*(i+.5), sc=Math.min(1.3,box/it.h,(sw-18)/it.w), q=this.slots[i].x;
      ell(cx,gy+2,sw*.36,11); ctx.fillStyle='#eef2fa'; ctx.fill();
      ctx.save(); ctx.translate(cx,gy); ctx.scale(1+q,1-q); it.draw(sc,this.t); ctx.restore();
      text(it.l,cx,s.y+s.h-(P?34:28),P?27:25,C.inkSoft,800);
    });
  },
  renderHeader(){
    const P=this.P, y=P?110:96, s='4단계 · 아트 렌더링';
    ctx.font=`800 38px ${FONT}`; const w=ctx.measureText(s).width+70;
    rr(W/2-w/2,y-28,w,68,34); ctx.fillStyle=C.shadow; ctx.fill();
    rr(W/2-w/2,y-34,w,68,34); ctx.fillStyle='#e9f8f6'; ctx.fill(); text(s,W/2,y,38,'#3fa99e',800);
    textO('바닥을 탭하면 토끼가 걸어가요 · 토끼는 점프 · 나무는 흔들흔들',W/2,y+(P?80:66),P?28:28,C.inkSoft);
  },
  render(){
    const t=this.t, b=this.b, ps=b.s/.8;
    ctx.drawImage(this.ground,0,0,W,H);
    for(const w of this.twinkles){ const a=Math.sin(t*.05+w.ph); if(a>.3){ ctx.globalAlpha=(a-.3)/.7; ctx.fillStyle='#b9d0f3'; star(w.x,w.y,9,t*.02); } }
    ctx.globalAlpha=1;
    for(const f of this.prints) if(f.on){ ctx.save(); ctx.translate(f.x,f.y); ctx.rotate(f.a);
      ctx.fillStyle=`rgba(${PAL.print},${(.55*(1-f.life/300)).toFixed(3)})`; ell(0,0,10*ps,6*ps); ctx.fill(); ctx.restore(); }
    if(this.marker){ const m=this.marker, k=m.life/30; ctx.lineWidth=6; ctx.strokeStyle=`rgba(255,127,171,${(1-k).toFixed(3)})`; ell(m.x,m.y,(30+k*30)*ps,(12+k*12)*ps); ctx.stroke(); }
    for(const o of this.objs) this.shadowO(o);          // 1) 그림자는 바닥에 먼저
    for(const o of this.objs) RL.add(o.x,o.y,drawObj,o); // 2) 발밑 y 기준으로 정렬해서 그림
    RL.flush();
    FX.render(); Snow.render();
    this.renderHeader(); this.renderShelf();
    drawIconBtn(this.backB,'back',this.press==='back'); drawIconBtn(this.sndB,'note',this.press==='snd');
  }
};

   5단계: 원핑거 조작 (플로팅 조이스틱 · 키보드) + 넓은 설원 + 카메라 추적

const Keys=new Set();

document.addEventListener('visibilitychange',()=>{ if(document.hidden){ releaseAll(); saveNow(); } });

function saveNow(){ try{ if(scene===Game&&Game.save){ Game.save.t=Date.now(); writeSave(Game.save); Game.dirty=false; } }catch(e){} }   // 앱 전환·창 닫기 직전 저장

/* 플로팅 조이스틱: 누른 곳에 생기고, 손가락이 반경을 넘으면 받침이 따라옴 */
const Joy={R:130,on:false,a:0,bx:0,by:0,kx:0,ky:0,vx:0,vy:0,mag:0,
  start(p){ this.on=true; this.bx=this.kx=p.x; this.by=this.ky=p.y; this.vx=this.vy=this.mag=0; },
  move(p){
    if(!this.on) return; let dx=p.x-this.bx, dy=p.y-this.by, d=Math.hypot(dx,dy);
    if(d>this.R){ this.bx=p.x-dx/d*this.R; this.by=p.y-dy/d*this.R; d=this.R; dx=p.x-this.bx; dy=p.y-this.by; }
    this.kx=p.x; this.ky=p.y;
    const dz=.12, m=d/this.R; this.mag=m<dz?0:Math.min(1,(m-dz)/(.6-dz));   // 반경 60%면 최고 속도
    if(d>0){ this.vx=dx/d; this.vy=dy/d; }
  },
  end(){ this.on=false; this.mag=0; },
  update(){ this.a+=((this.on?1:0)-this.a)*.25; if(!this.on){ this.kx+=(this.bx-this.kx)*.3; this.ky+=(this.by-this.ky)*.3; } },
  render(){
    if(this.a<.02) return; const {bx,by,kx,ky,R}=this;
    ctx.save(); ctx.globalAlpha=this.a;
    ell(bx,by,R,R); ctx.fillStyle='rgba(255,255,255,.32)'; ctx.fill(); ctx.lineWidth=6; ctx.strokeStyle='rgba(255,182,208,.8)'; ctx.stroke();
    if(this.mag>0){ const a=Math.atan2(this.vy,this.vx); ctx.lineWidth=12; ctx.lineCap='round';
      ctx.strokeStyle=`rgba(255,127,171,${(.35+.55*this.mag).toFixed(3)})`; ctx.beginPath(); ctx.arc(bx,by,R-4,a-.55,a+.55); ctx.stroke(); }
    ell(kx,ky+7,58,58); ctx.fillStyle='rgba(200,90,130,.3)'; ctx.fill();
    ell(kx,ky,58,58); ctx.fillStyle=C.pinkDeep; ctx.fill(); ctx.lineWidth=6; ctx.strokeStyle='#fff'; ctx.stroke();
    paw(kx,ky+4,1.25,'#fff');
    ctx.restore();
  }
};

/* 새 에셋 */
Art.sign=function(label,w){ w=w||224; const hw=w/2; ctx.lineJoin='round'; ctx.lineWidth=5; ctx.strokeStyle=PAL.barkLine;
  rr(-9,-112,18,114,6); ctx.fillStyle=PAL.bark; ctx.fill(); ctx.stroke();

function signSpr(label){ const k='sign:'+label, c=Spr.cache.get(k); if(c) return c;

Art.crystal=function(){ ctx.lineJoin='round';
  ell(0,-4,62,16); ctx.fillStyle='#fff'; ctx.fill();
  for(const [cx,w,h] of [[-30,20,78],[26,22,92],[-2,28,128]]){

  ctx.strokeStyle=PAL.grass2; ctx.lineWidth=3.5; ctx.lineCap='round';
  for(let i=0;i<26;i++){ const x=rnd(i,311)*S, y=rnd(i,312)*S;
    tile(()=>{ ctx.beginPath(); ctx.moveTo(x-6,y-8); ctx.lineTo(x,y); ctx.lineTo(x+6,y-8); ctx.moveTo(x,y); ctx.lineTo(x,y-11); ctx.stroke(); }); }
  ctx.fillStyle='rgba(255,255,255,.6)'; for(let i=0;i<30;i++) ctx.fillRect(rnd(i,321)*S,rnd(i,322)*S,3,3); }); }

/* 맵 생성 */
function genWorld(){
  const WW=WORLD.w, WH=WORLD.h, objs=[], sol=[], inner=[];
  const add=(o,r)=>{ objs.push(o); if(r){ const s={x:o.x,y:o.y,r,o}; sol.push(s); o.sol=s; } return o; };
  const tree=(x,y,k)=>add({type:'tree',x,y,k,rad:100*k,wob:new Spring(.08,.9),sq:new Spring(.25,.72),fade:1,cd:0,sp:0,spT:0,hp:TREE_HP,hpT:0,fell:null,regrow:0,grow:1},30*k);
  let i=0;
  // 경계 숲
  for(let x=-300;x<=WW+300;x+=140) for(const [y,s] of [[-90,1],[-230,2],[WH+130,3],[WH+270,4]]) tree(x+(rnd(i,s)-.5)*70,y+(rnd(i,s+10)-.5)*50,1+rnd(i++,s+20)*.3);
  for(let y=0;y<=WH;y+=160) for(const [x,s] of [[-110,5],[-260,6],[WW+110,7],[WW+260,8]]) tree(x+(rnd(i,s)-.5)*60,y+(rnd(i,s+10)-.5)*60,1+rnd(i++,s+20)*.3);
  for(const o of objs) o.border=true;   // 테두리 숲은 벨 수 없음
  const inHome=(x,y,m)=>((x-HOME.x)/(HOME.rx+m))**2+((y-HOME.y)/(HOME.ry+m))**2<1;
  const free=(x,y,r)=>inner.every(q=>Math.hypot(q.x-x,q.y-y)>=r+q.rad);
  const okN=(x,y,r)=>x>140&&x<WALL_X-120&&y>240&&y<riverY(x)-RIVER_HW-110&&!inHome(x,y,40)&&Math.hypot(x-SPAWN.x,y-SPAWN.y)>300&&free(x,y,r);
  const place=(n,seed,r,a,mk,okf)=>{ for(let j=0,c=0;j<n*40&&c<n;j++){ const x=a[0]+rnd(j,seed)*(a[2]-a[0]), y=a[1]+rnd(j,seed+1)*(a[3]-a[1]);
    if((okf||okN)(x,y,r)){ inner.push(mk(x,y,j)); c++; } } };
  const T=(x,y,j)=>tree(x,y,.85+rnd(j,7)*.4);
  place(70,201,82,[140,240,WALL_X-120,950],T);          // 북쪽 소나무 숲 (빽빽)
  place(34,211,82,[140,950,980,2450],T);                // 서쪽 숲
  place(12,221,90,[980,950,WALL_X-120,2450],T);         // 설원엔 드문드문
  place(14,231,70,[980,900,WALL_X-120,2450],(x,y)=>add({type:'rock',x,y,rad:70,sp:0,spT:0},46));
  place(18,241,70,[980,900,WALL_X-120,2450],(x,y)=>add({type:'mound',x,y,rad:80,melt:1},56));
  add({type:'sign',label:'♨ 온천 예정지',x:HOME.x-170,y:HOME.y-210},34);
  // 얼음벽 + 얼음문 (17단계 보스 처치 후 열림)
  for(let y=-150;y<riverY(WALL_X)-40;y+=96){ if(Math.abs(y-GATE_Y)<150) continue; add({type:'crystal',x:WALL_X+(rnd(y,3)-.5)*24,y,k:.9+rnd(y,4)*.35}); }
  add({type:'gate',x:WALL_X,y:GATE_Y+40});
  const any=(x,y,r)=>free(x,y,r);
  place(26,251,100,[WALL_X+140,200,WW-140,riverY(WW)-200],(x,y,j)=>add({type:'crystal',x,y,k:.8+rnd(j,9)*.6,rad:100}),any);
  place(10,261,70,[WALL_X+140,200,WW-140,riverY(WW)-200],(x,y)=>add({type:'mound',x,y,rad:80,melt:1}),any);
  // 부서진 다리 (13단계에서 수리)
  const by0=riverY(BRIDGE_X);
  for(const s of [-1,1]){ add({type:'post',x:BRIDGE_X+s*70,y:by0-RIVER_HW-24}); add({type:'post',x:BRIDGE_X+s*70,y:by0+RIVER_HW+24}); }
  add({type:'sign',label:'다리가 부서졌어요',x:BRIDGE_X-250,y:by0-RIVER_HW-70});   // 개울가라 충돌 없음 (사이에 끼지 않게)
  // 개울 건너 대나무 숲
  place(40,271,85,[140,2700,WW-140,WH-120],(x,y,j)=>add({type:'bamboo',x,y,k:.9+rnd(j,11)*.35,rad:85}),(x,y,r)=>y>riverY(x)+RIVER_HW+120&&free(x,y,r));
  for(const s of SEEDS) add({type:'seed',id:s.id,x:s.x,y:s.y,R:s.R,used:false,fade:1});
  return {objs,sol};
}

/* 봄 땅: 녹은 영역(원본 위치 + 반경)이 퍼지며 잔디·꽃이 피어남 */
const Thaw={src:[],deco:[],
  reset(){ this.src.length=0; this.deco.length=0; },
  k(s,a){ return 1+.055*Math.sin(a*7+s.seed)+.03*Math.sin(a*13+s.seed*2.1)+.02*Math.sin(a*3+s.seed*.7); },
  rel(s,x,y){ const dx=x-s.x, dy=(y-s.y)/.78; return Math.hypot(dx,dy)/this.k(s,Math.atan2(dy,dx)); },
  inside(x,y){ for(const s of this.src) if(s.r>0&&this.rel(s,x,y)<s.r) return true; return false; },
  growing(){ for(const s of this.src) if(s.t<s.dur) return true; return false; },
  add(id,x,y,R,instant){
    const s={id,x,y,R,seed:rnd(x,y)*10,dur:Math.round(50+R*.12),t:0,r:0};
    if(instant){ s.t=s.dur; s.r=R; }
    this.src.push(s);
    const n=Math.round(R*R/2300);
    for(let j=0;j<n;j++){
      const a=rnd(j,s.seed*13)*TAU, d=Math.sqrt(rnd(j,s.seed*17+1))*R*.9, kk=this.k(s,a), px=x+Math.cos(a)*d*kk, py=y+Math.sin(a)*d*.78*kk;
      if(py>riverY(px)-RIVER_HW-30||px>WALL_X-40||(this.excl&&this.excl(px,py))) continue;
      const u=rnd(j,s.seed*19+2), kind=u<.22?'P':u<.38?'Y':u<.52?'C':'T';
      this.deco.push({type:'deco',s,x:px,y:py,d,kind,rt:instant?-1:null,sc:instant?1:0,cd:0,sw:new Spring(.12,.85)});
    }
    return s;
  },
  update(t){
    for(const s of this.src) if(s.t<s.dur){ s.t++; s.r=s.R*(1-Math.pow(1-s.t/s.dur,3)); }
    let n=0;
    for(const d of this.deco){ if(d.rt==null&&d.s.r>=d.d){ d.rt=t; n++; }
      if(d.rt!=null&&d.sc<1) d.sc=easeOutBack(Math.min(1,(t-d.rt)/18)); if(d.cd>0) d.cd--; d.sw.step(); }
    return n;
  },
  path(s,r,oy){ ctx.beginPath(); for(let i=0;i<=72;i++){ const a=i/72*TAU, k=this.k(s,a)*r, x=s.x+Math.cos(a)*k, y=s.y+oy+Math.sin(a)*k*.78; i?ctx.lineTo(x,y):ctx.moveTo(x,y); } ctx.closePath(); },
  renderGround(vl,vt,vr,vb){
    const S=this.src; if(!S.length) return;
    const inV=s=>s.x+s.r*1.2+40>vl&&s.x-s.r*1.2-40<vr&&s.y+s.r+40>vt&&s.y-s.r-40<vb;
    for(const s of S) if(inV(s)){ this.path(s,s.r+26,5); ctx.fillStyle='rgba(190,205,232,.5)'; ctx.fill(); }   // 젖은 그림자
    for(const s of S) if(inV(s)){ this.path(s,s.r+12,0); ctx.fillStyle='#fff'; ctx.fill(); }                   // 눈 테두리
    for(const s of S) if(inV(s)){ this.path(s,s.r,0); ctx.fillStyle=grassPat; ctx.fill(); }                      // 잔디
    for(const s of S) if(inV(s)&&s.t<s.dur){ const k=s.t/s.dur; this.path(s,s.r+12+40*k,0);                    // 퍼지는 물결
      ctx.lineWidth=12*(1-k)+2; ctx.strokeStyle=`rgba(255,255,255,${(.9*(1-k)).toFixed(3)})`; ctx.stroke(); }
    ctx.lineCap='round';
    for(const d of this.deco){ if(d.sc<=.01||d.x<vl-30||d.x>vr+30||d.y<vt-30||d.y>vb+30) continue; const s=d.sc;
      if(d.kind==='T'){ ctx.strokeStyle=PAL.grass2; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(d.x-9*s,d.y-13*s); ctx.lineTo(d.x,d.y); ctx.lineTo(d.x+9*s,d.y-13*s); ctx.moveTo(d.x,d.y); ctx.lineTo(d.x+1,d.y-17*s); ctx.stroke(); }
      else if(d.kind==='C'){ ctx.fillStyle='#8fd07a'; for(let i=0;i<3;i++){ const a=i/3*TAU-Math.PI/2; ell(d.x+Math.cos(a)*7*s,d.y-6*s+Math.sin(a)*6*s,7*s,6*s); ctx.fill(); } }
      else shadow(d.x,d.y,12*s,4*s,.14); }
  }
};
function drawDeco(d){ if(d.sc>.01) drawSpr(d.kind==='P'?SPR.flowerP():SPR.flowerY(),d.x,d.y,.8*d.sc,0,d.sw.x); }

/* 나비 (봄 땅 위를 팔랑팔랑) */
const Bfly={list:[],
  init(){ this.list=['#ffb6d0','#fff09a','#bfe3ff','#ffb6d0','#d9c6ff'].map((col,i)=>({type:'bfly',on:false,x:0,y:0,tx:0,ty:0,ph:rnd(i,401)*TAU,col,t:0,dir:1,a:0})); },
  pick(f){ const ss=Thaw.src.filter(s=>s.t>=s.dur); if(!ss.length) return false;
    const s=ss[(Math.random()*ss.length)|0], a=Math.random()*TAU, d=Math.sqrt(Math.random())*s.R*.75, k=Thaw.k(s,a);
    f.tx=s.x+Math.cos(a)*d*k; f.ty=s.y+Math.sin(a)*d*.78*k; f.t=0; return true; },
  update(){ for(const f of this.list){
    if(!f.on){ if(this.pick(f)){ f.on=true; f.x=f.tx; f.y=f.ty; f.a=0; this.pick(f); } continue; }
    f.ph+=.35; f.t++; f.a=Math.min(1,f.a+.03);
    const dx=f.tx-f.x, dy=f.ty-f.y, d=Math.hypot(dx,dy);
    if(d<20||f.t>420) this.pick(f); else { f.x+=dx/d*2.2+Math.sin(f.ph*.13)*1.2; f.y+=dy/d*2.2; if(Math.abs(dx)>2) f.dir=dx>0?1:-1; } } },
  draw(f){ const flap=Math.abs(Math.sin(f.ph)), y=f.y-70-Math.sin(f.ph*.1)*14;
    ctx.save(); ctx.globalAlpha*=f.a; ctx.translate(f.x,y); ctx.scale(f.dir,1);
    for(const d of [-1,1]){ ctx.save(); ctx.scale(d*(.25+.75*flap),1); ctx.fillStyle=f.col; ell(11,-6,12,10); ctx.fill(); ell(9,6,8,7); ctx.fill(); ctx.restore(); }
    rr(-3,-10,6,20,3); ctx.fillStyle=C.ink; ctx.fill(); ctx.restore(); }
};

function drawSeed(o){

}

/* 언 개울 */
function drawRiver(vl,vr,vt,vb){
  if(vb<2420||vt>2820) return;
  const st=40, x0=Math.floor(vl/st)*st-st, x1=vr+st;
  ctx.beginPath(); for(let x=x0;x<=x1;x+=st) ctx.lineTo(x,riverY(x)-RIVER_HW); for(let x=Math.floor(x1/st)*st;x>=x0;x-=st) ctx.lineTo(x,riverY(x)+RIVER_HW); ctx.closePath();
  ctx.fillStyle='#c4e5f6'; ctx.fill();
  ctx.save(); ctx.clip();
  ctx.lineWidth=3; ctx.strokeStyle='rgba(255,255,255,.85)';
  for(let i=Math.floor(x0/260);i*260<x1;i++){
    const x=i*260+rnd(i,501)*120, y=riverY(x)+(rnd(i,502)-.5)*100;
    ctx.save(); ctx.translate(x,y); ctx.rotate(-.25); ctx.fillStyle='rgba(255,255,255,.65)'; ell(0,0,60+rnd(i,503)*40,7); ctx.fill(); ell(30,14,26,4); ctx.fill(); ctx.restore();
    const cx=i*260+130+rnd(i,504)*60, cy=riverY(cx)+(rnd(i,505)-.5)*80;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+22,cy+14); ctx.lineTo(cx+12,cy+34); ctx.moveTo(cx+22,cy+14); ctx.lineTo(cx+44,cy+10); ctx.stroke(); }

const Dev={on:false,taps:[],fps:0,ups:0,_f:0,_u:0,_t:performance.now(),resetBtn:null,cat:0,hits:[],flash:null,
  toggle(){this.on=!this.on;},

  tick(now){if(now-this._t>=1000){this.fps=this._f;this.ups=this._u;this._f=this._u=0;this._t=now;}},
  down(p){ if(!this.on) return false;
    for(const h of this.hits) if(hitR(p,h)){ if(h.cat!==undefined){ this.cat=h.cat; SFX.tap(); } else if(h.key){ scene.key&&scene.key(h.key); this.flash={k:h.key,t:12}; SFX.tap(); } return true; }
    if(this.resetBtn&&hitR(p,this.resetBtn)){store.del(KEY_MODE);store.del(KEY_SAVE);mode=null;openModeSelect(p);return true;}
    return !!(this.panel&&hitR(p,this.panel)); },
  render(){

    const ex=(!cats||!cat.items)&&scene.devLines?scene.devLines():[], ms=Music.shown, w=760, x=W-w-30, y=30;

    const rows=cat&&cat.items?Math.ceil(cat.items.length/2):0, h=L.length*44+(cats?90:0)+ex.length*36+rows*84+130;

      cats.forEach((c,i)=>{ const bx=x+30+i*(tw+10), on=c===cat; rr(bx,cy,tw,60,30); ctx.fillStyle=on?'#ff7fab':'rgba(255,255,255,.12)'; ctx.fill();
        text(c.name,bx+tw/2,cy+31,26,on?'#fff':'#e8defa',800); this.hits.push({x:bx,y:cy,w:tw,h:60,cat:i}); });
      cy+=86; }
    ex.forEach((s,i)=>text(s,x+30,cy+14+i*36,22,'#d8cdef',600,'left')); cy+=ex.length*36;
    if(cat&&cat.items){ const bw=(w-70)/2;                                            // 동작 버튼 (터치 · 키보드 둘 다)
      cat.items.forEach(([k,l],i)=>{ const bx=x+30+(i%2)*(bw+10), by=cy+Math.floor(i/2)*84, fl=this.flash&&this.flash.k===k;
        rr(bx,by,bw,70,20); ctx.fillStyle=fl?'#ffd866':k==='R'?'rgba(255,110,140,.35)':'rgba(255,255,255,.14)'; ctx.fill();
        rr(bx+12,by+15,40,40,12); ctx.fillStyle='rgba(0,0,0,.25)'; ctx.fill(); text(k,bx+32,by+36,24,'#ffd866',900);
        text(l,bx+66,by+36,25,fl?'#5b4a6b':'#fff',800,'left'); this.hits.push({x:bx,y:by,w:bw,h:70,key:k}); }); }
    if(this.flash&&--this.flash.t<=0) this.flash=null;

/* ---------- 입력 (화면 전체 · 레터박스 영역 포함) ---------- */
const Input={x:0,y:0,down:false,id:null};
function toVirtual(e){const r=cvs.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
addEventListener('pointerdown',e=>{
  A.unlock();
  if(Input.id!==null) return; e.preventDefault();
  const p=toVirtual(e); Input.id=e.pointerId; Input.down=true; Input.x=p.x; Input.y=p.y;
  if(Vol.hit(p)){ Vol.tap(); return; }
  if(tr) return;
  if(Dev.down(p)) return;
  if(p.x<300&&p.y>H-100) Dev.tapVersion();
  scene.down&&scene.down(p,e.pointerType);
},{passive:false});
addEventListener('pointermove',e=>{
  const p=toVirtual(e), primary=e.pointerId===Input.id;
  if(primary){Input.x=p.x;Input.y=p.y;}
  if(!tr&&scene.move) scene.move(p,e.pointerType,primary);
});
function pointerEnd(e){
  A.unlock();
  if(e.pointerId!==Input.id) return;
  const p=toVirtual(e); Input.id=null; Input.down=false;
  if(Vol.hit(p)) return;
  if(!tr&&scene.up) scene.up(p,e.pointerType);
}
addEventListener('pointerup',pointerEnd); addEventListener('pointercancel',pointerEnd);
addEventListener('touchend',()=>A.unlock());   // iOS: 터치 종료 시점에도 오디오 잠금 해제
addEventListener('keydown',e=>{
  A.unlock();
  if(e.code==='Backquote'){Dev.toggle();return;}
  if(e.code.startsWith('Arrow')||e.code==='Space') e.preventDefault();
  Keys.add(e.code);
  if(!tr&&scene.key) scene.key(e.key);
});
['gesturestart','gesturechange','dblclick','contextmenu'].forEach(ev=>addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

/* ---------- 씬 관리 · 60fps 고정 루프 ---------- */
/* ---------- 19단계: 엔딩 씬 (축하 → 불꽃놀이 축제 → 스태프 롤) — 건너뛸 수 없음 ---------- */
const CREDITS=[['모락모락 토끼온천','title'],['',''],['기획 · 디자인','h'],['DDKK',''],['',''],['프로그래밍','h'],['DDKK',''],['',''],['도트 · 일러스트','h'],['DDKK',''],['',''],['16비트 음악 · 효과음','h'],['DDKK',''],['',''],['출연','h'],['핑크 아기 토끼',''],['시바견 · 카피바라 · 아기 펭귄 · 하얀 족제비',''],['펭귄 일꾼들 · 경비견 시바',''],['장난꾸러기 눈사람 · 얼음 슬라임 · 늑대 도적',''],['대왕 예티',''],['',''],['이 게임을 선물합니다','h'],['사랑하는 둘째딸 유진이에게',''],['',''],['',''],['따끈따끈한 봄이 왔어요','big'],['',''],['© DDKK 2026','copy']];
const LETTER=['유진이에게','','유진아, 토끼 온천에 봄이 왔어!','작은 토끼가 눈 덮인 마을을','따뜻하게 녹였던 것처럼,','유진이는 우리 집의 따뜻한 봄이야.','','언제나 씩씩하고 다정하게 자라렴.','사랑해, 우리 둘째딸!','','— 아빠가'];
const LETTER_F=840;   // 편지 장면 14초 (한 글자씩 써지고 잠시 머무름)
const Ending={name:'엔딩',
  enter(){ this.t=0; this.fw=[]; this.sp=[]; this.petals=Array.from({length:60},(_,i)=>({x:Math.random()*W,y:Math.random()*H,v:1+Math.random()*1.6,ph:Math.random()*6,s:.6+Math.random()*.8}));
    this.cast=[['shiba',-1],['capy',0],['penguin',1],['ermine',2]].map(([sp,i])=>({sp,i,ph:Math.random()*6})); this.done=false; this.press=false; this.lastLt=0;
    const sv=loadSave(); this.stats=sv?{coins:(sv.stat&&sv.stat.coins)|0,logs:(sv.stat&&sv.stat.logs)|0,kills:(sv.stat&&sv.stat.kills)|0,raids:sv.raidN|0}:{coins:0,logs:0,kills:0,raids:0};
    if(Music.cur!=='ending') Music.play('ending',true); },
  launch(){ const x=W*(.15+Math.random()*.7), y=H*(this.P()? .12+Math.random()*.25 : .12+Math.random()*.3), cols=[['#ff7fab','#ffd0e0'],['#ffd866','#fff3b8'],['#8fd3ff','#e0f4ff'],['#a6f0c6','#e8fff2'],['#c7a6ff','#efe4ff']][(Math.random()*5)|0];
    this.fw.push({x,y:H+20,ty:y,vy:-(H+20-y)/40,t:0,cols,shape:Math.random()<.2?'heart':'ring'}); SFX.firework(); },
  P(){ return W<H; },
  burst(f){ const n=f.shape==='heart'?40:48;
    for(let i=0;i<n;i++){ let vx,vy; const a=i/n*TAU;
      if(f.shape==='heart'){ const k=a; vx=16*Math.pow(Math.sin(k),3)*.42; vy=-(13*Math.cos(k)-5*Math.cos(2*k)-2*Math.cos(3*k)-Math.cos(4*k))*.42; }
      else { const sp=7+Math.random()*2; vx=Math.cos(a)*sp; vy=Math.sin(a)*sp; }
      this.sp.push({x:f.x,y:f.y,vx,vy,life:0,max:70+Math.random()*25,c:i%3?f.cols[0]:f.cols[1]}); } },
  update(){ const t=++this.t, P=this.P();
    for(const p of this.petals){ p.y+=p.v; p.x+=Math.sin(t*.02+p.ph)*.8; if(p.y>H+20){ p.y=-20; p.x=Math.random()*W; } }
    if(t>200&&t<1500&&(t%26===0||(t>900&&t<1100&&t%11===0))) this.launch();
    for(let i=this.fw.length-1;i>=0;i--){ const f=this.fw[i]; f.t++; f.y+=f.vy; if(f.y<=f.ty){ this.fw.splice(i,1); this.burst(f); } }
    for(let i=this.sp.length-1;i>=0;i--){ const p=this.sp[i]; p.life++; p.x+=p.vx; p.y+=p.vy; p.vx*=.96; p.vy=p.vy*.96+.08; if(p.life>p.max) this.sp.splice(i,1); }
    for(const c of this.cast) c.ph+=.06;
    if(t===this.rollEnd()) SFX.select();
    if(t>this.rollEnd()&&t<this.rollEnd()+400&&t%9===0){ const lt=this.letterChars(t-this.rollEnd()-40); if(lt>this.lastLt){ this.lastLt=lt; SFX.bubble(); } }
    if(t>=this.rollEnd()+LETTER_F) this.done=true; },
  rollStart(){ return 1500; }, rollEnd(){ return 1500+Math.round(CREDITS.length*60*(this.P()?1.1:1)+H*.9+240); },
  letterChars(f){ return Math.max(0,Math.floor(f/3)); },
  renderLetter(f){   // 아빠의 편지: 한 글자씩 써지는 편지지
    const P=this.P(), a=clamp(f/40,0,1)*clamp((LETTER_F-f)/40,0,1); if(a<=0) return;
    ctx.save(); ctx.globalAlpha=a; ctx.fillStyle='rgba(30,15,45,.55)'; ctx.fillRect(0,0,W,H);
    const w=P?940:1000, lh=P?74:64, h=170+LETTER.length*lh, x=W/2-w/2, y=H/2-h/2-(P?40:0), k=easeOutBack(clamp(f/30,0,1));
    ctx.translate(W/2,y+h/2); ctx.scale(k,k); ctx.rotate(-.012); ctx.translate(-W/2,-(y+h/2));
    rr(x,y+12,w,h,36); ctx.fillStyle='rgba(80,30,60,.3)'; ctx.fill();
    rr(x,y,w,h,36); ctx.fillStyle='#fff8f3'; ctx.fill(); ctx.lineWidth=8; ctx.strokeStyle='#ffc2d6'; ctx.stroke();
    ctx.strokeStyle='rgba(255,170,200,.35)'; ctx.lineWidth=3; for(let i=1;i<LETTER.length+1;i++){ const ly=y+90+i*lh; ctx.beginPath(); ctx.moveTo(x+60,ly); ctx.lineTo(x+w-60,ly); ctx.stroke(); }
    ctx.fillStyle='#ff9fbf'; for(const [hx,hy,r] of [[x+60,y+56,14],[x+w-60,y+56,14],[x+w-120,y+40,9]]) heart(hx,hy,r);
    let left=this.letterChars(f-40);
    LETTER.forEach((line,i)=>{ if(left<=0) return; const n=Math.min(line.length,left); left-=line.length+2; const s=line.slice(0,n), ly=y+90+(i+1)*lh-lh*.35;
      if(i===0) text(s,x+80,ly,P?54:50,'#ff6f9f',900,'left');
      else if(line.startsWith('—')) text(s,x+w-90,ly,P?50:46,'#d0507f',900,'right');
      else text(s,x+80,ly,P?44:40,'#5b4a6b',800,'left'); });
    if(this.letterChars(f-40)>LETTER.join('  ').length){ const bx=x+w-150, by=y+h-40, hop=Math.abs(Math.sin(this.t*.1))*-10;
      drawBunny(bx,by+hop,.55,{happy:true}); ctx.fillStyle='#ff6f9f'; heart(bx+70,by-150+Math.sin(this.t*.08)*6,16); }
    ctx.restore(); },
  down(){ if(this.done) this.press=true; },
  up(){ if(this.done&&this.press){ this.press=false; Music.play('peace'); transitionTo(()=>go(Title)); } },
  key(k){ if(this.done&&(k==='Enter'||k===' ')){ Music.play('peace'); transitionTo(()=>go(Title)); } },
  render(){ const t=this.t, P=this.P(), dusk=clamp((t-160)/240,0,1);
    const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,lerpCol('#ffe0ec','#2a2350',dusk)); g.addColorStop(.6,lerpCol('#fff4e6','#5b3f7a',dusk)); g.addColorStop(1,lerpCol('#fff8f0','#c2709a',dusk));
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    if(dusk>0){ for(let i=0;i<70;i++){ const x=rnd(i,1201)*W, y=rnd(i,1202)*H*.6, a=dusk*(.4+.6*Math.abs(Math.sin(t*.03+i))); ctx.globalAlpha=a; ctx.fillStyle='#fff'; ell(x,y,2,2); ctx.fill(); } ctx.globalAlpha=1; }
    for(const f of this.fw){ ctx.fillStyle=f.cols[1]; ell(f.x,f.y,5,9); ctx.fill(); ctx.globalAlpha=.5; ell(f.x,f.y+16,3,10); ctx.fill(); ctx.globalAlpha=1; }
    ctx.globalCompositeOperation='lighter';
    for(const p of this.sp){ const k=1-p.life/p.max; ctx.globalAlpha=k; ctx.fillStyle=p.c; ell(p.x,p.y,4+3*k,4+3*k); ctx.fill(); }
    ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
    // 마을 실루엣 + 료칸 + 온천
    const gy=P?H*.74:H*.72;
    ctx.fillStyle=lerpCol('#bfe6c6','#3f3a62',dusk*.8); ctx.beginPath(); ctx.moveTo(0,gy); for(let x=0;x<=W;x+=60) ctx.lineTo(x,gy-30-Math.sin(x*.004)*40); ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.fill();
    const R=SPR.ryokan(), rs=P?1.3:1.1; ctx.drawImage(R.c,W*.5-R.ox*rs,gy-30-R.oy*rs,R.w*rs,R.h*rs);
    for(let i=0;i<4;i++){ const x=W*(.12+i*.25)+(i>1?60:-60); drawSpr(SPR.sakura(),x,gy+10,P?1.1:.95); }
    const py=gy+(P?260:150); ell(W/2,py,P?420:520,P?120:110); ctx.fillStyle='#8fd8ee'; ctx.fill(); ell(W/2,py-6,P?400:500,P?106:96); ctx.fillStyle='#bfefff'; ctx.fill();
    for(let k=0;k<6;k++) steam(W/2-300+k*120,py-40,260,t,k*.2);
    // 손님들 + 토끼
    for(const c of this.cast){ const x=W/2+c.i*(P?190:230)-(P?95:115), y=py+10+Math.sin(c.ph)*4;
      ctx.save(); ctx.beginPath(); ctx.rect(x-120,y-300,240,300); ctx.clip(); ctx.translate(x,y+30); ctx.scale(.9,.9); drawGuestBody(c.sp,0,false); drawGuestHead(c.sp,0,-92,1,{happy:true,blush:1,towel:true}); ctx.restore();
      ctx.lineWidth=4; ctx.strokeStyle='rgba(255,255,255,.8)'; ell(x,y,48,11); ctx.stroke(); }
    const bx=W/2, by=py-(P?150:130)+Math.abs(Math.sin(t*.08))*-14; drawBunny(bx,by,P?1.3:1.1,{happy:true,earL:Math.sin(t*.1)*.1,earR:-Math.sin(t*.1)*.1});
    if(t%60<30){ ctx.fillStyle='#ffd866'; star(bx+100,by-200,12,t*.05); star(bx-110,by-180,9,-t*.05); }
    // 꽃잎
    for(const p of this.petals){ ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(t*.02+p.ph); ctx.fillStyle=lerpCol('#ffb6cf','#ffd6e6',(Math.sin(p.ph)+1)/2); ell(0,0,9*p.s,6*p.s); ctx.fill(); ctx.restore(); }
    // 1막: 축하 문구
    const a1=clamp(t/40,0,1)*clamp((300-t)/40,0,1);
    if(a1>0){ ctx.save(); ctx.globalAlpha=a1; const k=easeOutBack(clamp(t/40,0,1)); ctx.translate(W/2,H*.2); ctx.scale(k,k);
      textO('마을에 봄이 왔어요!',0,0,P?84:96,'#ff6f9f',900); textO('모두가 기다리던 봄의 축제',0,90,P?40:46,'#8a6aa8',800); ctx.restore(); }
    // 2막: 기록
    const a2=clamp((t-320)/30,0,1)*clamp((900-t)/40,0,1);
    if(a2>0){ const S=this.stats, lines=[['🪵 모은 통나무',S.logs],['🪙 모은 코인',S.coins],['❄ 물리친 적',S.kills],['⚠ 막아낸 습격',S.raids]], w=P?720:760, h=110+lines.length*70, x=W/2-w/2, y=H*(P?.16:.1);
      ctx.save(); ctx.globalAlpha=a2; rr(x,y+8,w,h,40); ctx.fillStyle='rgba(60,30,80,.25)'; ctx.fill(); rr(x,y,w,h,40); ctx.fillStyle='rgba(255,255,255,.93)'; ctx.fill();
      text('토끼 온천의 기록',W/2,y+56,44,'#ff6f9f',900);
      lines.forEach(([l,v],i)=>{ const kk=clamp((t-350-i*20)/16,0,1); if(kk<=0) return; ctx.globalAlpha=a2*kk; text(l,x+70,y+130+i*70,38,'#5b4a6b',800,'left'); text(String(v),x+w-70,y+130+i*70,44,'#e8a020',900,'right'); });
      ctx.restore(); }
    // 3막: 스태프 롤
    if(t>this.rollStart()){ const off=(t-this.rollStart()); ctx.save(); ctx.fillStyle='rgba(20,10,40,'+clamp(off/120,0,.45)+')'; ctx.fillRect(0,0,W,H);
      CREDITS.forEach(([l,k],i)=>{ const y=H+80+i*60*(P?1.1:1)-off; if(y<-80||y>H+80) return;
        if(k==='title') textO(l,W/2,y,P?78:86,'#ff7fab',900); else if(k==='h') text(l,W/2,y,34,'#ffd0e0',800); else if(k==='big') textO(l,W/2,y,P?60:66,'#ffd866',900); else if(k==='copy') text(l,W/2,y,40,'#fff',800); else text(l,W/2,y,40,'#fff',700); });
      ctx.restore(); }
    if(t>this.rollEnd()) this.renderLetter(t-this.rollEnd());
    if(this.done){ const a=.5+.5*Math.sin(t*.08); ctx.save(); ctx.globalAlpha=a; textO('화면을 터치하면 타이틀로',W/2,H*.88,40,'#ff6f9f',900); ctx.restore();
      ctx.save(); ctx.translate(W/2,H*.5); const k=easeOutBack(clamp((t-this.rollEnd()-LETTER_F)/30,0,1)); ctx.scale(k,k); textO('THE END',0,0,P?110:120,'#ff7fab',900); textO('유진아, 고마워!',0,100,48,'#ffd866',900); ctx.restore(); }
  }
};

let scene=null;
function go(s){scene=s;s.enter();}
function update(){ scene.update(); Snow.update(); Sparks.update(); Vol.update(); Music.update(); updateTransition(); }
function render(){ scene.render(); Sparks.render(); renderFooter(); Dev.render(); renderTransition(); }
const STEP=1000/60; let acc=0, last=performance.now();
function frame(now){
  let dt=now-last; last=now; if(dt>250) dt=250; acc+=dt;
  let n=0; while(acc>=STEP&&n<5){update();acc-=STEP;n++;Dev._u++;}
  if(n===5) acc=0;
  render(); Dev._f++; Dev.tick(now);
  requestAnimationFrame(frame);
}

/* ---------- 시작 ---------- */
(function boot(){
  A.loadLevel();
  const saved=store.get(KEY_MODE);
  if(saved&&RES[saved]){ mode=saved; setResolution(mode); go(Title); }
  else { setResolution(windowOrient()); go(Select); }
  tr={phase:'in',t:0,dur:36,cx:W/2,cy:H/2,cb:null};
  requestAnimationFrame(frame);
})();
</script>
