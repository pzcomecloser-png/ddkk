<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>사건록: 4대 기괴 밀실 파일 (추리 어드벤처)</title>
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 20px);
      --safe-bottom: env(safe-area-inset-bottom, 20px);
      --primary: #c93b3b;
      --gold: #dfb15b;
      --ink: #16151a;
      --paper: #f4efe2;
      --dark-card: #181b24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #08090d;
      color: #333;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* iPhone Frame wrapper for desktop preview */
    #phone-container {
      width: 100vw;
      height: 100vh;
      max-width: 430px;
      max-height: 932px;
      position: relative;
      background: #0f1118;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 50px rgba(0,0,0,0.85);
    }

    @media (min-width: 500px) {
      #phone-container {
        height: 844px;
        width: 390px;
        border-radius: 48px;
        border: 10px solid #282c37;
      }
    }

    /* Dynamic Island notch styling */
    .notch {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 28px;
      background: #000;
      border-radius: 20px;
      z-index: 999;
      pointer-events: none;
    }

    /* =========================================================
       TITLE & CASE SELECT SCREENS
       ========================================================= */
    #title-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0a0c12 url('title_bg.png') center center / cover no-repeat;
      z-index: 200;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: calc(var(--safe-top) + 40px) 24px calc(var(--safe-bottom) + 36px) 24px;
      text-align: center;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .title-logo-area {
      margin-top: 30px;
    }

    .badge-sub {
      display: inline-block;
      background: rgba(223, 177, 91, 0.18);
      border: 1px solid var(--gold);
      color: var(--gold);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    .main-game-title {
      color: #fff;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1px;
      line-height: 1.3;
      text-shadow: 0 4px 16px rgba(0,0,0,0.8);
    }

    .main-game-title span {
      color: var(--gold);
    }

    .title-tagline {
      color: #a4a8b8;
      font-size: 13px;
      margin-top: 8px;
      line-height: 1.5;
    }

    .title-actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .start-btn {
      width: 100%;
      max-width: 280px;
      padding: 16px 20px;
      background: linear-gradient(135deg, #d9a044 0%, #aa7222 100%);
      color: #111;
      font-size: 16px;
      font-weight: 800;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(217, 160, 68, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: transform 0.15s ease;
    }

    .start-btn:active {
      transform: scale(0.96);
    }

    .sound-toggle-btn {
      background: rgba(18, 20, 28, 0.7);
      border: 1px solid rgba(223, 177, 91, 0.35);
      color: #dfb15b;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Scenario Select Modal / Screen */
    #scenario-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(8, 10, 16, 0.94);
      backdrop-filter: blur(12px);
      z-index: 250;
      display: none;
      flex-direction: column;
      padding: calc(var(--safe-top) + 36px) 16px calc(var(--safe-bottom) + 16px) 16px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #scenario-modal.show {
      display: flex;
      opacity: 1;
    }

    .scenario-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(223, 177, 91, 0.25);
    }

    .scenario-header h3 {
      color: var(--gold);
      font-size: 18px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .scenario-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-right: 4px;
    }

    .scenario-card {
      background: #191c26;
      border: 1px solid rgba(223, 177, 91, 0.3);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      gap: 12px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .scenario-card:active {
      transform: scale(0.97);
      border-color: var(--gold);
      background: #242938;
    }

    .scenario-thumb {
      width: 72px;
      height: 96px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .scenario-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .scenario-tag {
      font-size: 10px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 0.5px;
    }

    .scenario-title {
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      margin: 3px 0;
      line-height: 1.3;
    }

    .scenario-desc {
      color: #9498a8;
      font-size: 11px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .scenario-difficulty {
      font-size: 10px;
      color: #e09b35;
      font-weight: 600;
      margin-top: 4px;
    }

    /* =========================================================
       MAIN IN-GAME HEADERS & STAGE
       ========================================================= */
    header {
      padding-top: calc(var(--safe-top) + 36px);
      padding-bottom: 12px;
      padding-left: 14px;
      padding-right: 14px;
      background: linear-gradient(180deg, rgba(16,18,24,0.98) 0%, rgba(16,18,24,0.85) 100%);
      border-bottom: 1px solid rgba(223, 177, 91, 0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }

    .case-title {
      color: var(--gold);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .clue-progress {
      background: rgba(223,177,91,0.15);
      border: 1px solid var(--gold);
      color: #fff;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 600;
    }

    .icon-btn-header {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(223,177,91,0.25);
      color: var(--gold);
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
      font-weight: 700;
    }

    /* Main Visual Stage */
    #stage {
      position: relative;
      flex: 1;
      width: 100%;
      background: #0a0b10 url('scene_user.png') center center / cover no-repeat;
      overflow: hidden;
      touch-action: none;
    }

    #sceneCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
    }

    /* Detective Touch Ripple (Hidden Object Inspection) */
    .inspect-ripple {
      position: absolute;
      width: 48px;
      height: 48px;
      transform: translate(-50%, -50%);
      border: 2px solid var(--gold);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(223, 177, 91, 0.35) 0%, rgba(223, 177, 91, 0) 70%);
      pointer-events: none;
      animation: inspectPulse 0.45s ease-out forwards;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }

    @keyframes inspectPulse {
      0% { transform: translate(-50%, -50%) scale(0.3); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.4); opacity: 0; }
    }

    /* Character Display Overlay (for Interrogation mode) */
    #suspect-stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      background: radial-gradient(circle at 50% 30%, rgba(20, 24, 35, 0.45) 0%, rgba(8, 10, 16, 0.88) 100%);
      backdrop-filter: blur(4px);
      pointer-events: none;
      z-index: 15;
    }

    .suspect-avatar-container {
      width: 320px;
      height: 380px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      filter: drop-shadow(0 15px 35px rgba(0,0,0,0.95));
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .suspect-img-portrait {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
      border-radius: 24px 24px 0 0;
      border: 2px solid rgba(223, 177, 91, 0.4);
      border-bottom: none;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.7);
    }

    .sweat-drop {
      position: absolute;
      top: 40px;
      right: 50px;
      font-size: 24px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    /* Dialogue & Narrative Box */
    #dialogue-area {
      background: linear-gradient(180deg, #181920 0%, #101116 100%);
      border-top: 2px solid #332d20;
      padding: 14px 16px;
      min-height: 145px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      z-index: 25;
      box-shadow: 0 -8px 24px rgba(0,0,0,0.5);
    }

    .speaker-tag {
      display: inline-block;
      align-self: flex-start;
      padding: 3px 10px;
      background: var(--primary);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      border-radius: 4px;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 6px rgba(201, 59, 59, 0.4);
    }

    .dialogue-text {
      color: #e5e5ea;
      font-size: 14px;
      line-height: 1.5;
      min-height: 48px;
      font-weight: 400;
      word-break: keep-all;
    }

    .dialogue-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 8px;
    }

    /* Bottom Action Tab Bar (iPhone Touch Friendly) */
    nav#bottom-nav {
      background: #0f1015;
      border-top: 1px solid rgba(255,255,255,0.08);
      display: grid;
      grid-template-columns: repeat(3, 1fr) 1.2fr;
      padding: 6px 8px calc(var(--safe-bottom) + 6px) 8px;
      gap: 6px;
      z-index: 30;
    }

    .nav-btn {
      background: #1c1d26;
      border: 1px solid rgba(223, 177, 91, 0.2);
      border-radius: 12px;
      color: #a0a0b0;
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }

    .nav-btn .icon {
      font-size: 18px;
    }

    .nav-btn.active {
      background: rgba(223, 177, 91, 0.18);
      border-color: var(--gold);
      color: var(--gold);
      transform: translateY(-1px);
    }

    .nav-btn:active {
      transform: scale(0.94);
    }

    .nav-btn.accuse-btn {
      background: linear-gradient(135deg, #c93b3b 0%, #871c1c 100%);
      border: 1px solid #ff6363;
      color: #fff;
      font-weight: 700;
    }

    /* Evidence Notebook Modal (Bottom Sheet) */
    #clue-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(8px);
      z-index: 50;
      display: none;
      flex-direction: column;
      justify-content: flex-end;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    #clue-modal.show {
      display: flex;
      opacity: 1;
    }

    .sheet-card {
      background: #1a1c24;
      border-top: 2px solid var(--gold);
      border-radius: 24px 24px 0 0;
      max-height: 75%;
      overflow-y: auto;
      padding: 20px 18px calc(var(--safe-bottom) + 20px) 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #clue-modal.show .sheet-card {
      transform: translateY(0);
    }

    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .sheet-title {
      color: var(--gold);
      font-size: 16px;
      font-weight: 700;
    }

    .close-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .clue-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .clue-item {
      background: #242733;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .clue-item.selected {
      border-color: var(--gold);
      background: rgba(223, 177, 91, 0.15);
    }

    .clue-thumb {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      background: #151720;
      border: 1px solid rgba(223, 177, 91, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .clue-info h4 {
      color: #fff;
      font-size: 14px;
      margin-bottom: 3px;
    }

    .clue-info p {
      color: #9ea0b2;
      font-size: 12px;
      line-height: 1.35;
    }

    .present-clue-btn {
      margin-top: 10px;
      padding: 13px;
      background: linear-gradient(135deg, var(--gold) 0%, #b88628 100%);
      color: #111;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      box-shadow: 0 4px 12px rgba(223, 177, 91, 0.3);
    }

    /* Dramatic Cut-in / OBJECTION Banner */
    #cutin-banner {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      transform: translateY(-50%) scale(0.7);
      background: linear-gradient(90deg, transparent 0%, rgba(201,59,59,0.95) 20%, rgba(201,59,59,0.95) 80%, transparent 100%);
      padding: 18px 0;
      text-align: center;
      color: #fff;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 4px;
      text-shadow: 0 4px 12px rgba(0,0,0,0.8);
      z-index: 100;
      pointer-events: none;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #cutin-banner.active {
      opacity: 1;
      transform: translateY(-50%) scale(1);
    }

    /* Screen Shake effect */
    .shake {
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-8px, 6px); }
      40% { transform: translate(8px, -6px); }
      60% { transform: translate(-6px, -4px); }
      80% { transform: translate(4px, 4px); }
    }

    /* Suspect Select Modal for Accusation */
    #accuse-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.88);
      z-index: 60;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      gap: 16px;
    }

    .suspect-card-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      width: 100%;
    }

    .suspect-pick-card {
      background: #1f222e;
      border: 1px solid rgba(223,177,91,0.3);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      color: #fff;
    }

    .suspect-pick-card:active {
      border-color: var(--primary);
      background: rgba(201,59,59,0.2);
    }

    /* Ending Overlay */
    #ending-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0d0f14;
      z-index: 120;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      text-align: center;
      color: #fff;
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

<div id="phone-container">
  <div class="notch"></div>

  <!-- =========================================================
       1. MAIN TITLE SCREEN
       ========================================================= -->
  <div id="title-screen">
    <div class="title-logo-area">
      <div class="badge-sub">SECRET CASE FILES</div>
      <h1 class="main-game-title">사건록<br><span>4대 기괴 밀실 파일</span></h1>
      <p class="title-tagline">진실은 오직 예리한 관찰과<br>증언 속 모순에 숨겨져 있다.</p>
    </div>

    <div class="title-actions">
      <button class="start-btn" onclick="openScenarioModal()">
        <span>📜</span>
        <span>사건 일지 (시나리오 선택)</span>
      </button>
      <button class="sound-toggle-btn" id="titleBgmBtn" onclick="toggleBgm()">
        🎵 국악 풍류 BGM
      </button>
    </div>
  </div>

  <!-- =========================================================
       2. SCENARIO SELECTION MODAL
       ========================================================= -->
  <div id="scenario-modal">
    <div class="scenario-header">
      <h3><span>📂</span> 사건 파일 선택</h3>
      <button class="close-btn" onclick="closeScenarioModal()">✕</button>
    </div>

    <div class="scenario-list" id="scenarioListContainer">
      <!-- Generated dynamically in JS -->
    </div>
  </div>

  <!-- =========================================================
       3. IN-GAME HEADER & ACTIONS
       ========================================================= -->
  <header>
    <div class="case-title">
      <button class="icon-btn-header" onclick="returnToTitle()">🏠</button>
      <span id="headerCaseName">사건 1: 월영루의 독살</span>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <button id="bgmToggleBtn" onclick="toggleBgm()" style="background:rgba(223,177,91,0.2); border:1px solid var(--gold); color:var(--gold); border-radius:12px; padding:3px 8px; font-size:11px; cursor:pointer; font-weight:700;">🎵 풍류</button>
      <div class="clue-progress" id="clueCounter">단서 0 / 4</div>
    </div>
  </header>

  <!-- =========================================================
       4. INTERACTIVE VISUAL STAGE
       ========================================================= -->
  <div id="stage">
    <canvas id="sceneCanvas"></canvas>

    <!-- Suspect Visual Presentation for Interrogation -->
    <div id="suspect-stage">
      <div class="suspect-avatar-container" id="suspectAvatar">
        <div id="avatarSvg"></div>
        <div class="sweat-drop" id="sweatDrop">💧</div>
      </div>
    </div>

    <!-- Cut-in Banner (이의 제기!) -->
    <div id="cutin-banner">그 말엔 모순이 있소!</div>
  </div>

  <!-- Dialogue Box -->
  <div id="dialogue-area">
    <div>
      <div class="speaker-tag" id="speakerName">암행어사</div>
      <div class="dialogue-text" id="dialogueBody">
        현장을 주의 깊게 수색하여 진실을 밝혀내야 한다.
      </div>
    </div>
    <div class="dialogue-actions" id="dialogueActions">
      <!-- Dynamic contextual buttons -->
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav id="bottom-nav">
    <button class="nav-btn active" id="btn-scene" onclick="switchMode('investigate')">
      <span class="icon">🔍</span>
      <span>현장 조사</span>
    </button>
    <button class="nav-btn" id="btn-suspects" onclick="switchMode('interrogate')">
      <span class="icon">👥</span>
      <span>용의자 심문</span>
    </button>

  const AudioEngine = {
    ctx: null,

    init() {
      if (!this.ctx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();
      }
      if (this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    },
    playHeavyBuk(volume = 0.4, decay = 0.6) {
      this.init();
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(85, now);
      osc.frequency.exponentialRampToValueAtTime(32, now + decay);
      gain.gain.setValueAtTime(volume, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + decay);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + decay);
    },
    playGayageum(freq = 330, volume = 0.22, decay = 1.2) {
      this.init();
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now);
      osc.frequency.linearRampToValueAtTime(freq * 1.015, now + decay * 0.4);
      osc.frequency.linearRampToValueAtTime(freq, now + decay);
      gain.gain.setValueAtTime(volume, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + decay);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + decay);
    },
    playJing(volume = 0.25) {
      this.init();
      const now = this.ctx.currentTime;
      [140, 210, 280].forEach(f => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f, now);
        gain.gain.setValueAtTime(volume * 0.33, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.8);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 1.8);
      });
    },
    playObjection() {
      this.init();
      this.playHeavyBuk(0.5, 0.4);
      setTimeout(() => this.playHeavyBuk(0.65, 0.5), 180);
      setTimeout(() => {
        this.playHeavyBuk(0.9, 0.9);
        this.playJing(0.35);
      }, 380);
    },

      this.init();
      const notes = [293.66, 329.63, 392.00, 440.00, 523.25];
      notes.forEach((freq, idx) => {
        setTimeout(() => this.playGayageum(freq, 0.2, 0.9), idx * 110);
      });
      setTimeout(() => this.playHeavyBuk(0.35, 0.5), notes.length * 110);
    },
    playError() {
      this.init();
      this.playHeavyBuk(0.4, 0.25);
    },
    startBgm() {
      this.init();
      if (this.bgmRunning) return;
      this.bgmRunning = true;
      const scale = [196.00, 220.00, 261.63, 293.66, 329.63, 392.00, 440.00, 523.25];
      let step = 0;
      const bgmTick = () => {
        if (!this.bgmRunning) return;
        const noteIdx = Math.floor(Math.sin(step * 0.7) * 3 + 4) % scale.length;
        this.playGayageum(scale[noteIdx], 0.12, 1.4);
        if (step % 4 === 0) this.playHeavyBuk(0.18, 0.8);
        step++;
        const nextTime = 650 + (step % 3) * 120;
        this.bgmTimer = setTimeout(bgmTick, nextTime);
      };
      bgmTick();
    },
    stopBgm() {
      this.bgmRunning = false;
      if (this.bgmTimer) {
        clearTimeout(this.bgmTimer);
        this.bgmTimer = null;
      }
    },
    toggleBgm() {
      if (this.bgmRunning) {
        this.stopBgm();
        return false;
      } else {
        this.startBgm();
        return true;
      }
    }
  };

    const btn = document.getElementById('bgmToggleBtn');

    if (btn) btn.innerText = isPlaying ? '🔊 풍류' : '🔇 풍류';
    if (titleBtn) titleBtn.innerText = label;
  }

  let currentCase = casesDB.case1;
  let gameState = {
    mode: 'investigate',
    currentSuspectId: 'doctor',
    selectedClueId: null,
    totalCluesFound: 0
  };

  function initScenarioList() {
    const container = document.getElementById('scenarioListContainer');
    container.innerHTML = '';
    Object.values(casesDB).forEach(c => {
      const card = document.createElement('div');
      card.className = 'scenario-card';
      card.onclick = () => selectCase(c.id);
      card.innerHTML = `
        <img src="${c.bgImage}" class="scenario-thumb" alt="${c.title}">
        <div class="scenario-info">
          <div>
            <div class="scenario-tag">${c.badge}</div>
            <div class="scenario-title">${c.title}</div>
            <div class="scenario-desc">${c.briefing}</div>
          </div>
          <div class="scenario-difficulty">난이도: ${c.difficulty}</div>
        </div>
      `;
      container.appendChild(card);
    });
  }

  function openScenarioModal() {
    AudioEngine.playGayageum(440, 0.2, 0.8);
    initScenarioList();
    document.getElementById('scenario-modal').classList.add('show');
  }

  function closeScenarioModal() {
    document.getElementById('scenario-modal').classList.remove('show');
  }

  function selectCase(caseId) {
    AudioEngine.playEvidenceFound();
    currentCase = casesDB[caseId];
    closeScenarioModal();
    document.getElementById('title-screen').style.display = 'none';

    // Reset state for new case
    gameState.mode = 'investigate';
    gameState.selectedClueId = null;
    gameState.totalCluesFound = 0;
    Object.values(currentCase.clues).forEach(c => c.discovered = false);
    Object.values(currentCase.suspects).forEach(s => s.cracked = false);

    // Pick first suspect
    gameState.currentSuspectId = Object.keys(currentCase.suspects)[0];

    // Update UI
    document.getElementById('headerCaseName').innerText = currentCase.title;
    document.getElementById('stage').style.backgroundImage = `url('${currentCase.bgImage}?t=${Date.now()}')`;
    document.getElementById('speakerName').innerText = `${currentCase.detectiveName} (현장 수색)`;
    document.getElementById('dialogueBody').innerText = currentCase.briefing;
    document.getElementById('ending-overlay').style.display = 'none';

    updateClueProgress();
    switchMode('investigate');
  }

  function returnToTitle() {
    AudioEngine.playGayageum(293.66, 0.2, 0.8);
    document.getElementById('ending-overlay').style.display = 'none';
    document.getElementById('title-screen').style.display = 'flex';
  }

  function restartCase() {
    selectCase(currentCase.id);
  }

  /* =========================================================
     IN-GAME ACTIONS & INTERROGATION
     ========================================================= */
  function switchMode(newMode) {
    gameState.mode = newMode;
    const isInvestigate = (newMode === 'investigate');

    document.getElementById('btn-scene').classList.toggle('active', isInvestigate);
    document.getElementById('btn-suspects').classList.toggle('active', !isInvestigate);
    document.getElementById('suspect-stage').style.display = isInvestigate ? 'none' : 'flex';

    if (isInvestigate) {
      document.getElementById('speakerName').innerText = `${currentCase.detectiveName} (현장 수색)`;
      document.getElementById('dialogueBody').innerText = '현장을 직접 살펴보고, 의심스러운 물건이나 흔적을 터치하여 조사해보자.';
      document.getElementById('dialogueActions').innerHTML = '';
    } else {
      loadSuspect(gameState.currentSuspectId);
    }
  }

  function loadSuspect(suspectId) {
    gameState.currentSuspectId = suspectId;
    const suspect = currentCase.suspects[suspectId];
    
    // Avatar image
    document.getElementById('avatarSvg').innerHTML = `<img src="${suspect.img}" alt="${suspect.name}" class="suspect-img-portrait" />`;
    document.getElementById('sweatDrop').style.opacity = suspect.cracked ? '1' : '0';

    document.getElementById('speakerName').innerText = `${suspect.name} (${suspect.tag})`;

    let questionsHtml = '<div style="display:flex; flex-direction:column; gap:6px; margin-top:8px;">';
    suspect.questions.forEach((item, idx) => {
      questionsHtml += `<button onclick="askQuestion(${idx})" style="background:#262a36; border:1px solid rgba(223,177,91,0.3); color:#dfb15b; font-size:12px; padding:6px 10px; border-radius:8px; text-align:left; cursor:pointer;">❓ "${item.q}"</button>`;
    });
    questionsHtml += '</div>';

    document.getElementById('dialogueBody').innerHTML = `"${suspect.quote}"${questionsHtml}`;

    const actionsContainer = document.getElementById('dialogueActions');
    actionsContainer.innerHTML = `
      <button class="nav-btn" style="padding: 6px 10px; flex-direction:row; color:#fff;" onclick="cycleSuspect()">
        <span>다른 인물 🔄</span>
      </button>
      <button class="nav-btn" style="padding: 6px 12px; flex-direction:row; background: var(--primary); color:#fff; border-color:#ff6666;" onclick="startPresentClue()">
        <span>모순 지적 💥</span>
      </button>
    `;
  }

  function cycleSuspect() {
    AudioEngine.playHeavyBuk(0.28, 0.4);
    const keys = Object.keys(currentCase.suspects);
    let nextIdx = (keys.indexOf(gameState.currentSuspectId) + 1) % keys.length;
    loadSuspect(keys[nextIdx]);
  }

  function askQuestion(qIdx) {
    AudioEngine.playGayageum(392.00, 0.18, 0.8);
    const suspect = currentCase.suspects[gameState.currentSuspectId];
    const item = suspect.questions[qIdx];
    document.getElementById('dialogueBody').innerHTML = `
      <span style="color:#dfb15b; font-size:13px; font-weight:700;">[질문] "${item.q}"</span><br><br>
      <span style="color:#fff;">"${item.a}"</span>
    `;
  }

  /* =========================================================
     TOUCH INVESTIGATION HIT DETECTION
     ========================================================= */
  const stageEl = document.getElementById('stage');
  stageEl.addEventListener('pointerdown', handleStageClick);

  function handleStageClick(e) {
    if (gameState.mode !== 'investigate') return;
    if (e.target.closest('#cutin-banner') || e.target.closest('button')) return;

    const rect = stageEl.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const xPct = (x / rect.width) * 100;
    const yPct = (y / rect.height) * 100;

    createInspectRipple(x, y);

    const hit = currentCase.checkHit(xPct, yPct);
    if (hit.type === 'clue') {
      investigate(hit.key);
    } else {
      AudioEngine.playGayageum(220.00, 0.15, 0.6);
      document.getElementById('speakerName').innerText = `${currentCase.detectiveName} (현장 관찰)`;
      document.getElementById('dialogueBody').innerHTML = hit.text;
    }
  }

  function createInspectRipple(x, y) {
    const ripple = document.createElement('div');
    ripple.className = 'inspect-ripple';
    ripple.style.left = x + 'px';
    ripple.style.top = y + 'px';
    ripple.innerHTML = '🔍';
    stageEl.appendChild(ripple);
    setTimeout(() => {
      if (ripple.parentNode) ripple.parentNode.removeChild(ripple);
    }, 450);
  }

  function investigate(clueKey) {
    AudioEngine.playEvidenceFound();
    const clue = currentCase.clues[clueKey];
    if (clue && !clue.discovered) {
      clue.discovered = true;
      gameState.totalCluesFound++;
      updateClueProgress();
    }

    document.getElementById('speakerName').innerText = `단서 발견: ${clue.name}`;
    document.getElementById('dialogueBody').innerHTML = `<strong>${clue.desc}</strong><br><span style="color:var(--gold); font-size:12px;">(수첩에 증거로 기록되었습니다.)</span>`;

    // Case 1 specific combo
    if (currentCase.id === 'case1' && currentCase.clues.fan.discovered && currentCase.clues.candle.discovered && !currentCase.clues.symptom.discovered) {
      currentCase.clues.symptom.discovered = true;
      gameState.totalCluesFound++;
      updateClueProgress();
      setTimeout(() => {
        document.getElementById('dialogueBody').innerHTML += `<br><br><span style="color:#ff8888; font-weight:700;">⚡ [새로운 추론] 부채의 백색 가루와 촛대 기름이 만나면 치명적인 독으로 합성됨을 밝혀냈습니다!</span>`;
      }, 1000);
    }
  }

  function updateClueProgress() {
    const total = Object.keys(currentCase.clues).length;
    document.getElementById('clueCounter').innerText = `단서 ${gameState.totalCluesFound} / ${total}`;
  }

  /* =========================================================
     CLUE NOTEBOOK & OBJECTION SYSTEM
     ========================================================= */
  function openClueModal(forPresenting = false) {
    AudioEngine.playGayageum(440.00, 0.22, 1.0);
    const modal = document.getElementById('clue-modal');
    const list = document.getElementById('clueList');
    list.innerHTML = '';

    const discoveredClues = Object.values(currentCase.clues).filter(c => c.discovered);

    if (discoveredClues.length === 0) {
      list.innerHTML = `<div style="color:#888; text-align:center; padding: 24px;">아직 발견된 단서가 없습니다.<br>현장의 물건들을 터치해 수색하세요!</div>`;
    } else {
      discoveredClues.forEach(clue => {
        const item = document.createElement('div');
        item.className = `clue-item ${gameState.selectedClueId === clue.id ? 'selected' : ''}`;
        item.onclick = () => selectClue(clue.id);
        item.innerHTML = `
          <div class="clue-thumb">${clue.icon}</div>
          <div class="clue-info">
            <h4>${clue.name}</h4>
            <p>${clue.desc}</p>
          </div>
        `;
        list.appendChild(item);
      });
    }

    document.getElementById('presentBtn').style.display = forPresenting ? 'block' : 'none';
    modal.classList.add('show');
  }

  function closeClueModal() {
    document.getElementById('clue-modal').classList.remove('show');
  }

  function selectClue(clueId) {
    AudioEngine.playGayageum(523.25, 0.2, 0.6);
    gameState.selectedClueId = clueId;
    document.querySelectorAll('.clue-item').forEach(el => el.classList.remove('selected'));
    event.currentTarget.classList.add('selected');
  }

  function startPresentClue() {
    openClueModal(true);
  }

  function presentSelectedClue() {
    if (!gameState.selectedClueId) {
      alert('먼저 반박에 제시할 단서를 선택해주세요!');
      return;
    }

    closeClueModal();
    const suspect = currentCase.suspects[gameState.currentSuspectId];

    if (suspect.isCulprit && suspect.contradictionClues.includes(gameState.selectedClueId)) {
      triggerCutIn(() => {
        suspect.cracked = true;
        document.getElementById('sweatDrop').style.opacity = '1';
        document.getElementById('suspectAvatar').classList.add('shake');
        document.getElementById('speakerName').innerText = `${suspect.name} (당황)`;
        document.getElementById('dialogueBody').innerHTML = `
          <span style="color:#ff6666; font-weight:700;">"그, 그것은... 거짓말이 아닙니다! 어찌 그 증거가 저와 관련이 있다는 말이오?!"</span>
          <br><br>용의자가 사색이 되어 말을 더듬기 시작했다. 진범의 결정적 모순이 드러났다!
        `;
      });
    } else {
      AudioEngine.playError();
      document.getElementById('speakerName').innerText = `${suspect.name}`;
      document.getElementById('dialogueBody').innerText = `"그 증거가 저의 진술과 무슨 상관이 있다는 말씀입니까? 억측을 거두어 주십시오!"`;
    }
  }

  function triggerCutIn(callback) {
    AudioEngine.playObjection();
    const banner = document.getElementById('cutin-banner');
    document.getElementById('phone-container').classList.add('shake');
    banner.classList.add('active');

    setTimeout(() => {
      banner.classList.remove('active');
      document.getElementById('phone-container').classList.remove('shake');
      if (callback) callback();
    }, 1100);
  }

  /* =========================================================
     ACCUSATION & ENDING EVALUATION
     ========================================================= */
  function openAccuseModal() {
    AudioEngine.playHeavyBuk(0.45, 0.7);
    const grid = document.getElementById('accuseCardGrid');
    grid.innerHTML = '';
    Object.values(currentCase.suspects).forEach(s => {
      const card = document.createElement('div');
      card.className = 'suspect-pick-card';
      card.onclick = () => finalAccuse(s.id);
      card.innerHTML = `
        <img src="${s.img}" style="width:48px; height:48px; border-radius:50%; object-fit:cover;" alt="${s.name}" />
        <div>
          <div style="font-weight: 700;">${s.name}</div>
          <div style="font-size: 11px; color: #888;">${s.tag}</div>
        </div>
      `;
      grid.appendChild(card);
    });
    document.getElementById('accuse-modal').style.display = 'flex';
  }

  function closeAccuseModal() {
    document.getElementById('accuse-modal').style.display = 'none';
  }

  function finalAccuse(targetSuspectId) {
    closeAccuseModal();
    const overlay = document.getElementById('ending-overlay');
    const badge = document.getElementById('endingBadge');
    const title = document.getElementById('endingTitle');
    const desc = document.getElementById('endingDesc');
    const suspect = currentCase.suspects[targetSuspectId];

    if (suspect.isCulprit && suspect.cracked) {
      AudioEngine.playEvidenceFound();
      badge.innerText = '🌟';
      title.innerText = '진범 검거: 사건 종결 [등급 S]';
      desc.innerHTML = `
        <div style="background:rgba(223,177,91,0.15); border:1px solid #dfb15b; border-radius:10px; padding:10px; margin-bottom:12px;">
          <span style="color:#dfb15b; font-weight:700;">[사건 해결] ${suspect.name} 자백 확보</span>
        </div>
        명확한 물증과 결정적 모순을 들이밀자 <strong>${suspect.name}</strong>이 모든 범행을 자백했습니다.<br><br>
        그대의 치밀한 수사와 예리한 추리로 미궁에 빠질 뻔한 사건의 진실을 완벽히 밝혀냈습니다!
      `;
    } else if (suspect.isCulprit && !suspect.cracked) {
      AudioEngine.playError();
      badge.innerText = '⚖️';
      title.innerText = '증거 불충분: 수사 실패 [등급 B]';
      desc.innerHTML = `
        진범인 <strong>${suspect.name}</strong>을 지목했으나, 그의 거짓말과 모순을 확실한 증거로 입증하지 못했습니다.<br><br>
        용의자는 법망을 유유히 빠져나갔고 사건은 미제로 남았습니다.
      `;
    } else {
      AudioEngine.playError();
      badge.innerText = '❌';
      title.innerText = '오인 체포: 수사 파탄 [등급 F]';
      desc.innerHTML = `
        무고한 <strong>${suspect.name}</strong>을 범인으로 지목하여 수사에 치명적인 오점을 남겼습니다.<br><br>
        진범은 어둠 속에서 조소하며 현장을 유유히 벗어났습니다.
      `;
    }

    overlay.style.display = 'flex';
  }

  /* =========================================================
     INIT BOOTSTRAP
     ========================================================= */
  window.addEventListener('DOMContentLoaded', () => {
    initScenarioList();
  });
</script>

</body>
</html>
