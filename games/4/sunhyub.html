<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>무협 탄막 검객 - 선협전 (Tale of Immortal Style)</title>
  <style>
    :root {
      --bg-color: #120e0b;
      --panel-bg: rgba(28, 22, 18, 0.92);
      --border-color: #6b533a;
      --accent-gold: #fbbf24;
      --accent-cyan: #38bdf8;
      --accent-red: #ef4444;
      --accent-green: #22c55e;
      --text: #f3f4f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      font-family: "Noto Serif KR", -apple-system, BlinkMacSystemFont, "Segoe UI", serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .game-container {
      position: relative;
      width: 960px;
      height: 640px;
      border: 3px solid #523f2b;
      border-radius: 8px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.95), 0 0 20px rgba(107, 83, 58, 0.4);
      overflow: hidden;
      background: #362a20;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    /* TOP BOSS BAR (귀곡팔황 스타일 보스 체력바) */
    .boss-bar-container {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      pointer-events: none;
      z-index: 10;
    }

    .boss-name {
      font-size: 15px;
      font-weight: bold;
      color: #fef08a;
      text-shadow: 1px 1px 3px #000, 0 0 8px rgba(0,0,0,0.8);
      letter-spacing: 2px;
    }

    .boss-hp-outer {
      width: 100%;
      height: 16px;
      background: #1c1917;
      border: 2px solid #a16207;
      box-shadow: 0 0 10px rgba(0,0,0,0.8);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .boss-hp-inner {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #b91c1c, #f87171);
      transition: width 0.1s ease-out;
    }

    /* BOTTOM WUXIA HUD BAR (하단 무협 인터페이스 / 귀곡팔황 UI) */
    .bottom-hud {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 90px;
      background: linear-gradient(180deg, rgba(28, 22, 18, 0.85) 0%, rgba(18, 14, 11, 0.98) 100%);
      border-top: 2px solid #78350f;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      pointer-events: auto;
      z-index: 20;
    }

    /* Flee / Escape Button (도주) */
    .flee-btn {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: radial-gradient(circle, #3f2d20 0%, #1c140e 100%);
      border: 2px solid #a16207;
      color: #fef08a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.8), 0 0 10px rgba(0,0,0,0.5);
      transition: all 0.2s ease;
    }

    .flee-btn:hover {
      border-color: #f59e0b;
      transform: scale(1.05);
    }

    .flee-title { font-size: 15px; font-weight: bold; }
    .flee-sub { font-size: 9px; color: #a1a1aa; }

    /* Center Gauges (체력 / 영력 / 집중력) */
    .gauges-panel {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 320px;
    }

    .gauge-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: bold;
      color: #e4e4e7;
    }

    .gauge-label { width: 50px; text-align: right; color: #d4d4d8; }

    .gauge-bar-outer {
      flex: 1;
      height: 12px;
      background: #18181b;
      border: 1px solid #523f2b;
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    .gauge-bar-inner {
      height: 100%;
      width: 100%;
      transition: width 0.15s ease-out;
    }

    .hp-bar { background: linear-gradient(90deg, #991b1b, #ef4444); }
    .mp-bar { background: linear-gradient(90deg, #1e40af, #38bdf8); }
    .focus-bar { background: linear-gradient(90deg, #15803d, #4ade80); }

    .gauge-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      color: #fff;
      text-shadow: 1px 1px 2px #000;
    }

    /* Quick Slot Skills (스킬 슬롯) */
    .skills-slots {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .skill-box {
      width: 44px;
      height: 44px;
      background: #271e17;
      border: 2px solid #78350f;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      font-size: 18px;
      box-shadow: inset 0 0 6px rgba(0,0,0,0.8);
      cursor: pointer;
    }

    .skill-box.active {
      border-color: #f59e0b;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
    }

    .skill-key {
      position: absolute;
      bottom: 2px;
      right: 4px;
      font-size: 9px;
      font-weight: bold;
      color: #a1a1aa;
    }

    .sound-btn {
      background: #271e17;
      border: 1px solid #78350f;
      color: #fbbf24;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }

    .sound-btn:hover { background: #f59e0b; color: #000; }

    /* Modal for Level-up / Manuals */
    .modal {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 100;
      backdrop-filter: blur(6px);
    }

    .modal.hidden { display: none; }

    .modal-title {
      font-size: 26px;
      color: #f59e0b;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .upgrade-list { display: flex; gap: 16px; }

    .upgrade-card {
      background: #271e17;
      border: 2px solid #78350f;
      border-radius: 8px;
      padding: 16px;
      width: 190px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .upgrade-card:hover {
      border-color: #f59e0b;
      transform: translateY(-4px);
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
    }

    /* Start / Overlay Screen */
    .overlay-screen {
      position: absolute;
      inset: 0;
      background: rgba(18, 14, 11, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 200;
    }

    .overlay-title {
      font-size: 38px;
      font-weight: bold;
      color: #fbbf24;
      text-shadow: 0 0 15px rgba(251, 191, 36, 0.5);
    }

    .start-btn {
      padding: 12px 32px;
      font-size: 18px;
      font-weight: bold;
      background: linear-gradient(135deg, #b45309, #78350f);
      color: #fff;
      border: 1px solid #f59e0b;
      border-radius: 6px;
      cursor: pointer;
    }

    .start-btn:hover { transform: scale(1.05); }
  </style>
</head>
<body>

  <div class="game-container">
    <canvas id="canvas" width="960" height="640"></canvas>

    <!-- Top Boss HP Bar (상단 보스 체력바) -->
    <div class="boss-bar-container" id="bossBarContainer">
      <div class="boss-name" id="bossName">마교 교주 - 무라 (Lv.Boss)</div>
      <div class="boss-hp-outer">
        <div class="boss-hp-inner" id="bossHpBar"></div>
      </div>
    </div>

    <!-- Bottom Wuxia HUD Bar (하단 무협 스킬 및 상태창 HUD) -->
    <div class="bottom-hud">
      <!-- Flee Button -->
      <div class="flee-btn" id="fleeBtn">
        <span class="flee-title">도주</span>
        <span class="flee-sub">ESC</span>
      </div>

      <!-- Status Gauges -->
      <div class="gauges-panel">
        <div class="gauge-row">
          <span class="gauge-label">체력</span>
          <div class="gauge-bar-outer">
            <div class="gauge-bar-inner hp-bar" id="hpBar"></div>
            <div class="gauge-text" id="hpText">350 / 350</div>
          </div>
        </div>
        <div class="gauge-row">
          <span class="gauge-label">영력</span>
          <div class="gauge-bar-outer">
            <div class="gauge-bar-inner mp-bar" id="mpBar"></div>
            <div class="gauge-text" id="mpText">160 / 160</div>
          </div>
        </div>
        <div class="gauge-row">
          <span class="gauge-label">집중력</span>
          <div class="gauge-bar-outer">
            <div class="gauge-bar-inner focus-bar" id="focusBar"></div>
            <div class="gauge-text" id="focusText">143 / 143</div>
          </div>
        </div>
      </div>

      <!-- Quick Slot Skill Bar -->
      <div class="skills-slots">
        <div class="skill-box active">🗡️<span class="skill-key">1</span></div>
        <div class="skill-box">⚡<span class="skill-key">2</span></div>
        <div class="skill-box">✨<span class="skill-key">3</span></div>
        <div class="skill-box">🌪️<span class="skill-key">4</span></div>
        <div class="skill-box">💊<span class="skill-key">5</span></div>
        <div class="skill-box">👟<span class="skill-key">SPACE</span></div>
        <button class="sound-btn" id="soundToggleBtn">🔊 사운드: OFF</button>
      </div>
    </div>

    <!-- Upgrade Modal -->
    <div class="modal hidden" id="upgradeModal">
      <div class="modal-title">✨ 무공 깨달음 (레벨 업!)</div>
      <div style="color: #a1a1aa; font-size: 13px;">전수받을 비급을 선택하세요:</div>
      <div class="upgrade-list" id="upgradeList"></div>
    </div>

    <!-- Start Overlay -->
    <div class="overlay-screen" id="startScreen">
      <div class="overlay-title">🗡️ 선협전 (Tale of Immortal)</div>
      <div style="color: #d4d4d8; font-size: 15px; text-align: center; line-height: 1.6;">
        **WASD / 방향키**: 캐릭터 이동<br>
        **마우스 커서**: 검기 조준 및 비검 발사<br>
        **Spacebar**: 신법 (경공 대시)
      </div>
      <button class="start-btn" id="startBtn">입마(入魔) 토벌 시작</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // UI Elements
    const hpBar = document.getElementById('hpBar');
    const hpText = document.getElementById('hpText');
    const mpBar = document.getElementById('mpBar');
    const mpText = document.getElementById('mpText');
    const focusBar = document.getElementById('focusBar');
    const focusText = document.getElementById('focusText');
    const bossBarContainer = document.getElementById('bossBarContainer');
    const bossName = document.getElementById('bossName');
    const bossHpBar = document.getElementById('bossHpBar');
    const soundToggleBtn = document.getElementById('soundToggleBtn');
    const upgradeModal = document.getElementById('upgradeModal');
    const upgradeList = document.getElementById('upgradeList');
    const startScreen = document.getElementById('startScreen');
    const startBtn = document.getElementById('startBtn');

    // Web Audio Sound Synth
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let soundEnabled = false;
    let bgmInterval = null;
    let bgmNoteIndex = 0;

    const pentatonicNotes = [293.66, 349.23, 392.00, 440.00, 523.25, 587.33, 698.46];
    const bgmMelody = [0, 2, 3, 4, 3, 2, 0, 1, 2, 4, 5, 4, 2, 3, 1, 0];

    function playBGMNote() {
      if (!soundEnabled) return;
      try {
        const noteFreq = pentatonicNotes[bgmMelody[bgmNoteIndex % bgmMelody.length]];
        bgmNoteIndex++;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const now = audioCtx.currentTime;

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(noteFreq, now);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(now + 0.35);
      } catch (e) {}
    }

    function toggleMasterSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      soundEnabled = !soundEnabled;

      if (soundEnabled) {
        soundToggleBtn.textContent = '🔊 사운드: ON';
        bgmInterval = setInterval(playBGMNote, 220);
      } else {
        soundToggleBtn.textContent = '🔇 사운드: OFF';
        clearInterval(bgmInterval);
      }
    }

    soundToggleBtn.addEventListener('click', toggleMasterSound);

    function playSound(type) {
      if (!soundEnabled) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const now = audioCtx.currentTime;

        if (type === 'slash') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(450, now);
          osc.frequency.exponentialRampToValueAtTime(90, now + 0.14);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.14);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(); osc.stop(now + 0.14);
        } else if (type === 'item') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.08);
          osc.frequency.setValueAtTime(783.99, now + 0.16);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(); osc.stop(now + 0.25);
        } else if (type === 'hit') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(130, now);
          osc.frequency.linearRampToValueAtTime(40, now + 0.1);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(); osc.stop(now + 0.1);
        } else if (type === 'dash') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.exponentialRampToValueAtTime(650, now + 0.12);
          gain.gain.setValueAtTime(0.09, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(); osc.stop(now + 0.12);
        }
      } catch (e) {}
    }

    // Upgrades
    const UPGRADES = [
      { id: 'slash_size', name: '태산압도 (검기 확장)', icon: '🗡️', desc: '검기의 범위와 공격 크기를 25% 증가시킵니다.' },
      { id: 'slash_speed', name: '쾌검술 (연사 증가)', icon: '⚡', desc: '공격 속도를 20% 향상시킵니다.' },
      { id: 'damage', name: '파천검의 (데미지)', icon: '💥', desc: '모든 공격의 피해량을 30% 증가시킵니다.' },
      { id: 'flying_sword', name: '어검술 (비검 추가)', icon: '✨', desc: '주위를 회전하는 어검을 1자루 추가합니다.' },
      { id: 'multi_slash', name: '분신검무 (다중 검기)', icon: '🌪️', desc: '다중 방향 검기를 발사합니다.' },
      { id: 'heal', name: '대환단 (체력 회복)', icon: '💊', desc: '최대 체력을 +30 증가시키고 체력을 회복합니다.' }
    ];

    // Game State
    let isRunning = false;
    let isPaused = false;
    let keys = {};
    let mouse = { x: 480, y: 320 };
    let score = 0;
    let gameTime = 0;

    // Player Object
    let player = {
      x: 480, y: 320,
      radius: 16,
      speed: 3.4,
      hp: 350, maxHp: 350,
      mp: 160, maxMp: 160,
      focus: 143, maxFocus: 143,
      level: 1, exp: 0, nextExp: 100,
      damage: 30,
      slashCooldown: 0,
      slashInterval: 30,
      slashSize: 1.0,
      multiSlashCount: 1,
      flyingSwords: 0,
      dashCooldown: 0,
      dashMaxCooldown: 120,
      isDashing: false,
      dashTimer: 0
    };

    // Arrays
    let slashes = [];
    let enemies = [];
    let enemyBullets = [];
    let items = [];
    let particles = [];
    let damageTexts = []; // Floating Damage Text (데미지 텍스트)

    // Controls
    window.addEventListener('keydown', e => { keys[e.code] = true; });
    window.addEventListener('keyup', e => { keys[e.code] = false; });
    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = e.clientX - rect.left;
      mouse.y = e.clientY - rect.top;
    });

    function resetGame() {
      player = {
        x: 480, y: 320, radius: 16, speed: 3.4,
        hp: 350, maxHp: 350, mp: 160, maxMp: 160, focus: 143, maxFocus: 143,
        level: 1, exp: 0, nextExp: 100, damage: 30,
        slashCooldown: 0, slashInterval: 30, slashSize: 1.0,
        multiSlashCount: 1, flyingSwords: 0, dashCooldown: 0,
        dashMaxCooldown: 120, isDashing: false, dashTimer: 0
      };
      slashes = []; enemies = []; enemyBullets = []; items = []; particles = []; damageTexts = [];
      score = 0; gameTime = 0;
      updateUI();
    }

    function spawnEnemy() {
      if (enemies.length > 35) return;

      let x, y;
      if (Math.random() < 0.5) {
        x = Math.random() < 0.5 ? -30 : canvas.width + 30;
        y = Math.random() * canvas.height;
      } else {
        x = Math.random() * canvas.width;
        y = Math.random() < 0.5 ? -30 : canvas.height + 30;
      }

      const isBoss = (score > 0 && score % 20 === 0 && Math.random() < 0.4) || (gameTime > 1800 && Math.random() < 0.05);

      enemies.push({
        x: x, y: y,
        radius: isBoss ? 30 : 16,
        hp: isBoss ? 510 : 60 + Math.floor(gameTime / 150),
        maxHp: isBoss ? 510 : 60 + Math.floor(gameTime / 150),
        speed: isBoss ? 0.8 : 1.2 + Math.random() * 0.7,
        isBoss: isBoss,
        name: isBoss ? "무라" : "마교 적요",
        shootCooldown: Math.floor(Math.random() * 60),
        shootPattern: isBoss ? 'leaf' : (Math.random() < 0.5 ? 'aim' : 'spiral'),
        angle: 0
      });
    }

    function addDamageText(x, y, text, color = '#ef4444') {
      damageTexts.push({
        x: x + (Math.random() * 20 - 10),
        y: y - 10,
        text: text,
        color: color,
        life: 25,
        maxLife: 25
      });
    }

    function createSlash(angle) {
      slashes.push({
        x: player.x,
        y: player.y,
        angle: angle,
        radius: 75 * player.slashSize,
        arc: Math.PI * 0.85,
        damage: player.damage,
        life: 12, maxLife: 12
      });
      playSound('slash');
    }

    function triggerPlayerSlash() {
      const aimAngle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
      const count = player.multiSlashCount;

      for (let i = 0; i < count; i++) {
        const angleOffset = (i - (count - 1) / 2) * (Math.PI / 3);
        createSlash(aimAngle + angleOffset);
      }
    }

    function update() {
      if (!isRunning || isPaused) return;
      gameTime++;

      if (gameTime % Math.max(20, 60 - Math.floor(gameTime / 100)) === 0) {
        spawnEnemy();
      }

      // Movement
      let dx = 0, dy = 0;
      if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
      if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
      if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
      if (keys['KeyD'] || keys['ArrowRight']) dx += 1;

      if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }

      // Dash (신법)
      if (keys['Space'] && player.dashCooldown <= 0) {
        player.isDashing = true;
        player.dashTimer = 10;
        player.dashCooldown = player.dashMaxCooldown;
        playSound('dash');
      }

      if (player.dashCooldown > 0) player.dashCooldown--;

      let currentSpeed = player.speed;
      if (player.isDashing) {
        currentSpeed *= 3.2;
        player.dashTimer--;
        if (player.dashTimer <= 0) player.isDashing = false;

        particles.push({
          x: player.x, y: player.y,
          vx: 0, vy: 0, radius: player.radius,
          color: 'rgba(56, 189, 248, 0.4)', life: 8, maxLife: 8
        });
      }

      player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x + dx * currentSpeed));
      player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y + dy * currentSpeed));

      // Slash Attack
      if (player.slashCooldown <= 0) {
        triggerPlayerSlash();
        player.slashCooldown = player.slashInterval;
      } else {
        player.slashCooldown--;
      }

      // Flying Swords
      if (player.flyingSwords > 0) {
        const orbitRadius = 75;
        const speed = 0.05;
        for (let i = 0; i < player.flyingSwords; i++) {
          const angle = (gameTime * speed) + (i * (Math.PI * 2 / player.flyingSwords));
          const sx = player.x + Math.cos(angle) * orbitRadius;
          const sy = player.y + Math.sin(angle) * orbitRadius;

          enemies.forEach(e => {
            const dist = Math.hypot(e.x - sx, e.y - sy);
            if (dist < e.radius + 16) {
              const dmg = Math.floor(player.damage * 0.35);
              e.hp -= dmg;
              addDamageText(e.x, e.y, `-${dmg}`, '#38bdf8');
              createHitParticles(sx, sy, '#38bdf8', 3);
            }
          });
        }
      }

      // Update Slashes
      for (let i = slashes.length - 1; i >= 0; i--) {
        const s = slashes[i];
        s.life--;

        enemies.forEach(e => {
          const dist = Math.hypot(e.x - s.x, e.y - s.y);
          if (dist < s.radius + e.radius) {
            const enemyAngle = Math.atan2(e.y - s.y, e.x - s.x);
            let diff = Math.abs(enemyAngle - s.angle);
            while (diff > Math.PI) diff -= Math.PI * 2;
            diff = Math.abs(diff);

            if (diff < s.arc / 2 + 0.25) {
              const dmg = player.damage;
              e.hp -= dmg;
              addDamageText(e.x, e.y, `-${dmg}`, '#ef4444');
              createHitParticles(e.x, e.y, '#fbbf24', 5);
              playSound('hit');
            }
          }
        });

        if (s.life <= 0) slashes.splice(i, 1);
      }

      // Update Enemies & Xianxia Green Leaf Projectiles
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];

        const angle = Math.atan2(player.y - e.y, player.x - e.x);
        e.x += Math.cos(angle) * e.speed;
        e.y += Math.sin(angle) * e.speed;

        e.shootCooldown--;
        if (e.shootCooldown <= 0) {
          if (e.shootPattern === 'leaf' || e.isBoss) {
            // Xianxia Green Leaf Danmaku (귀곡팔황 나뭇잎 탄막)
            const count = 10;
            for (let b = 0; b < count; b++) {
              const bAngle = (Math.PI * 2 / count) * b + e.angle;
              enemyBullets.push({
                x: e.x, y: e.y,
                vx: Math.cos(bAngle) * 2.4,
                vy: Math.sin(bAngle) * 2.4,
                radius: 4, isLeaf: true, color: '#22c55e'
              });
            }
            e.angle += 0.25;
            e.shootCooldown = 50;
          } else {
            const bAngle = Math.atan2(player.y - e.y, player.x - e.x);
            enemyBullets.push({
              x: e.x, y: e.y,
              vx: Math.cos(bAngle) * 3.2,
              vy: Math.sin(bAngle) * 3.2,
              radius: 5, isLeaf: false, color: '#ef4444'
            });
            e.shootCooldown = 65;
          }
        }

        if (e.hp <= 0) {
          score++;
          createHitParticles(e.x, e.y, '#22c55e', 12);

          if (Math.random() < 0.65) {
            const isElixir = Math.random() < 0.3;
            items.push({
              x: e.x, y: e.y,
              type: isElixir ? 'elixir' : 'orb',
              radius: isElixir ? 10 : 8,
              value: isElixir ? 40 : 35
            });
          }

          enemies.splice(i, 1);
        }
      }

      // Update Bullets
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const b = enemyBullets[i];
        b.x += b.vx;
        b.y += b.vy;

        if (!player.isDashing) {
          const dist = Math.hypot(b.x - player.x, b.y - player.y);
          if (dist < b.radius + player.radius) {
            player.hp -= 15;
            addDamageText(player.x, player.y, `-15`, '#f87171');
            createHitParticles(player.x, player.y, '#ef4444', 8);
            playSound('hit');
            enemyBullets.splice(i, 1);

            if (player.hp <= 0) {
              gameOver();
              return;
            }
            continue;
          }
        }

        if (b.x < -20 || b.x > canvas.width + 20 || b.y < -20 || b.y > canvas.height + 20) {
          enemyBullets.splice(i, 1);
        }
      }

      // Update Items
      for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        const dist = Math.hypot(item.x - player.x, item.y - player.y);

        if (dist < 110) {
          const angle = Math.atan2(player.y - item.y, player.x - item.x);
          item.x += Math.cos(angle) * 6.5;
          item.y += Math.sin(angle) * 6.5;
        }

        if (dist < player.radius + item.radius + 6) {
          playSound('item');
          if (item.type === 'elixir') {
            player.hp = Math.min(player.maxHp, player.hp + item.value);
          } else {
            gainExp(item.value);
          }
          items.splice(i, 1);
        }
      }

      // Update Damage Texts
      for (let i = damageTexts.length - 1; i >= 0; i--) {
        const dt = damageTexts[i];
        dt.y -= 0.8;
        dt.life--;
        if (dt.life <= 0) damageTexts.splice(i, 1);
      }

      // Update Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }

      updateUI();
    }

    function gainExp(amount) {
      player.exp += amount;
      if (player.exp >= player.nextExp) {
        player.exp -= player.nextExp;
        player.level++;
        player.nextExp = Math.floor(player.nextExp * 1.4);
        showUpgradeModal();
      }
    }

    function createHitParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.2 + Math.random() * 3.5;
        particles.push({
          x: x, y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: 2 + Math.random() * 3,
          color: color,
          life: 16, maxLife: 16
        });
      }
    }

    function showUpgradeModal() {
      isPaused = true;
      upgradeList.innerHTML = '';

      const shuffled = [...UPGRADES].sort(() => 0.5 - Math.random()).slice(0, 3);

      shuffled.forEach(up => {
        const card = document.createElement('div');
        card.className = 'upgrade-card';
        card.innerHTML = `
          <div style="font-size:32px;">${up.icon}</div>
          <div style="font-size:15px; font-weight:bold; color:#fef08a;">${up.name}</div>
          <div style="font-size:11px; color:#a1a1aa; line-height:1.4;">${up.desc}</div>
        `;
        card.onclick = () => applyUpgrade(up.id);
        upgradeList.appendChild(card);
      });

      upgradeModal.classList.remove('hidden');
    }

    function applyUpgrade(id) {
      if (id === 'slash_size') player.slashSize += 0.25;
      if (id === 'slash_speed') player.slashInterval = Math.max(12, Math.floor(player.slashInterval * 0.8));
      if (id === 'damage') player.damage += 10;
      if (id === 'flying_sword') player.flyingSwords++;
      if (id === 'multi_slash') player.multiSlashCount++;
      if (id === 'heal') {
        player.maxHp += 30;
        player.hp = Math.min(player.maxHp, player.hp + 100);
      }

      upgradeModal.classList.add('hidden');
      isPaused = false;
    }

    // DRAW FUNCTIONS - XIANXIA / TALE OF IMMORTAL ATMOSPHERE

    function drawBackground() {
      // Dark Earthy Dirt Floor (귀곡팔황 땅 무늬)
      ctx.fillStyle = '#362a20';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Dirt patches
      ctx.fillStyle = '#2b2018';
      for (let i = 0; i < 15; i++) {
        const px = (i * 137) % canvas.width;
        const py = (i * 243) % canvas.height;
        ctx.beginPath();
        ctx.ellipse(px, py, 40, 25, 0.4, 0, Math.PI * 2);
        ctx.fill();
      }

      // Stone Formations & Grass Bushes (돌 / 풀 무늬)
      ctx.fillStyle = '#1c2419'; // Grass patch
      ctx.beginPath(); ctx.ellipse(180, 160, 35, 20, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(750, 220, 40, 25, 0, 0, Math.PI * 2); ctx.fill();

      // Ancient Ritual Magic Circle on Floor (원형 마법진)
      ctx.strokeStyle = 'rgba(120, 80, 50, 0.25)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(480, 320, 180, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(480, 320, 120, 0, Math.PI * 2); ctx.stroke();
    }

    // CONCEPT ART PLAYER SPRITE
    function drawPlayerSprite(x, y, radius, angle, isDashing) {
      ctx.save();
      ctx.translate(x, y);

      if (isDashing) {
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#38bdf8';
      }

      ctx.rotate(angle);

      // White Ribbon
      ctx.strokeStyle = '#f8fafc';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-8, -2);
      ctx.quadraticCurveTo(-18, -10 + Math.sin(gameTime * 0.2) * 5, -26, -6);
      ctx.stroke();

      // High Ponytail
      ctx.fillStyle = '#1e1b18';
      ctx.beginPath(); ctx.ellipse(-7, -1, 8, 10, 0, 0, Math.PI * 2); ctx.fill();

      // Navy Pants
      ctx.fillStyle = '#1e2240';
      ctx.beginPath();
      ctx.moveTo(-10, -8); ctx.lineTo(3, -10); ctx.lineTo(3, 10); ctx.lineTo(-10, 8);
      ctx.closePath(); ctx.fill();

      // Navy Vest
      ctx.fillStyle = '#2b3052';
      ctx.beginPath();
      ctx.moveTo(-7, -6); ctx.lineTo(7, -5); ctx.lineTo(7, 5); ctx.lineTo(-7, 6);
      ctx.closePath(); ctx.fill();

      // Gold Trim
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(-5, -5); ctx.lineTo(2, 0); ctx.lineTo(-5, 5);
      ctx.stroke();

      // Red Belt
      ctx.fillStyle = '#dc2626';
      ctx.fillRect(-2, -6, 4, 12);

      // Arms & Wraps
      ctx.fillStyle = '#fed7aa'; ctx.fillRect(1, -9, 5, 3);
      ctx.fillStyle = '#f8fafc'; ctx.fillRect(6, -9, 4, 3);
      ctx.fillStyle = '#fed7aa'; ctx.fillRect(1, 6, 5, 3);
      ctx.fillStyle = '#f8fafc'; ctx.fillRect(6, 6, 4, 3);

      // Head
      ctx.fillStyle = '#fed7aa';
      ctx.beginPath(); ctx.ellipse(0, 0, 5, 4.5, 0, 0, Math.PI * 2); ctx.fill();

      // Eyes
      ctx.fillStyle = '#1e1b18';
      ctx.fillRect(2, -2.5, 2, 1.8); ctx.fillRect(2, 1, 2, 1.8);

      // Broadsword / Dao
      ctx.shadowBlur = 12; ctx.shadowColor = '#38bdf8';
      ctx.fillStyle = '#f59e0b'; ctx.fillRect(10, -5, 3, 10);
      ctx.fillStyle = '#e2e8f0';
      ctx.beginPath();
      ctx.moveTo(13, -2); ctx.lineTo(34, -4); ctx.lineTo(38, 1); ctx.lineTo(13, 2);
      ctx.closePath(); ctx.fill();

      ctx.restore();
    }

    // TALE OF IMMORTAL XIANXIA BOSS & MINION
    function drawEnemySprite(e) {
      ctx.save();
      ctx.translate(e.x, e.y);

      const angle = Math.atan2(player.y - e.y, player.x - e.x);
      ctx.rotate(angle);

      if (e.isBoss) {
        // TALE OF IMMORTAL FEMALE BOSS / DEMON LORD (무라 / 선협 보스)
        ctx.shadowBlur = 25; ctx.shadowColor = '#fbbf24';

        // Long Floating White Xianxia Robes (백의 선녀/마두 로브)
        ctx.fillStyle = '#f8fafc';
        ctx.beginPath();
        ctx.moveTo(-14, -16); ctx.lineTo(-24, 0); ctx.lineTo(-14, 16);
        ctx.closePath(); ctx.fill();

        // Long Dark Hair
        ctx.fillStyle = '#0f172a';
        ctx.beginPath(); ctx.ellipse(-10, 0, 10, 14, 0, 0, Math.PI * 2); ctx.fill();

        // Gold Waist Ribbon
        ctx.fillStyle = '#f59e0b';
        ctx.fillRect(-6, -8, 5, 16);

        // Head
        ctx.fillStyle = '#fde047';
        ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI * 2); ctx.fill();

        // Glowing Divine Staff (선협 보주 지팡이)
        ctx.fillStyle = '#f59e0b'; ctx.fillRect(8, -14, 3, 28);
        ctx.fillStyle = '#38bdf8'; ctx.beginPath(); ctx.arc(9, -14, 6, 0, Math.PI * 2); ctx.fill();

      } else {
        // GREEN/RED CULTIST
        ctx.shadowBlur = 10; ctx.shadowColor = '#22c55e';

        ctx.fillStyle = '#14532d';
        ctx.beginPath();
        ctx.moveTo(-8, -8); ctx.lineTo(6, -6); ctx.lineTo(6, 6); ctx.lineTo(-8, 8);
        ctx.closePath(); ctx.fill();

        ctx.fillStyle = '#fde047';
        ctx.beginPath(); ctx.arc(-2, 0, 5, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = '#22c55e'; ctx.fillRect(4, -8, 2, 16);
      }

      ctx.restore();
    }

    function drawItemSprite(item) {
      ctx.save();
      ctx.translate(item.x, item.y);

      if (item.type === 'elixir') {
        ctx.shadowBlur = 14; ctx.shadowColor = '#22c55e';
        ctx.fillStyle = '#15803d';
        ctx.beginPath(); ctx.arc(0, 3, 7, 0, Math.PI * 2); ctx.arc(0, -4, 4.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#f59e0b'; ctx.fillRect(-5, -1, 10, 2);
      } else {
        ctx.shadowBlur = 14; ctx.shadowColor = '#fbbf24';
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath(); ctx.arc(0, 0, item.radius, 0, Math.PI * 2); ctx.fill();
      }

      ctx.restore();
    }

    function draw() {
      drawBackground();

      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.radius * (p.life / p.maxLife), 0, Math.PI * 2); ctx.fill();
      });

      items.forEach(drawItemSprite);

      // Draw Xianxia Green Leaf / Needle Bullets (귀곡팔황 나뭇잎 탄막)
      enemyBullets.forEach(b => {
        ctx.save();
        ctx.translate(b.x, b.y);

        if (b.isLeaf) {
          const angle = Math.atan2(b.vy, b.vx);
          ctx.rotate(angle);
          ctx.shadowBlur = 10; ctx.shadowColor = '#22c55e';
          ctx.fillStyle = '#4ade80';

          // Leaf shape
          ctx.beginPath();
          ctx.moveTo(-6, 0); ctx.quadraticCurveTo(0, -4, 8, 0); ctx.quadraticCurveTo(0, 4, -6, 0);
          ctx.fill();
        } else {
          ctx.shadowBlur = 8; ctx.shadowColor = b.color;
          ctx.fillStyle = b.color;
          ctx.beginPath(); ctx.arc(0, 0, b.radius, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
      });

      enemies.forEach(e => {
        drawEnemySprite(e);

        // Enemy HP Bar
        if (e.hp < e.maxHp) {
          ctx.fillStyle = 'rgba(0,0,0,0.7)';
          ctx.fillRect(e.x - 18, e.y - e.radius - 12, 36, 5);
          ctx.fillStyle = '#22c55e';
          ctx.fillRect(e.x - 18, e.y - e.radius - 12, 36 * (e.hp / e.maxHp), 5);
        }
      });

      if (player.flyingSwords > 0) {
        const orbitRadius = 75;
        const speed = 0.05;
        for (let i = 0; i < player.flyingSwords; i++) {
          const angle = (gameTime * speed) + (i * (Math.PI * 2 / player.flyingSwords));
          const sx = player.x + Math.cos(angle) * orbitRadius;
          const sy = player.y + Math.sin(angle) * orbitRadius;

          ctx.save();
          ctx.translate(sx, sy);
          ctx.rotate(angle + Math.PI / 2);
          ctx.shadowBlur = 12; ctx.shadowColor = '#38bdf8';
          ctx.fillStyle = '#38bdf8';
          ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(5, 8); ctx.lineTo(-5, 8); ctx.closePath(); ctx.fill();
          ctx.restore();
        }
      }

      slashes.forEach(s => {
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(s.angle);

        const progress = s.life / s.maxLife;
        ctx.shadowBlur = 15; ctx.shadowColor = '#fbbf24';
        ctx.strokeStyle = `rgba(251, 191, 36, ${progress})`;
        ctx.lineWidth = 7 * s.radius / 70;

        ctx.beginPath(); ctx.arc(0, 0, s.radius, -s.arc / 2, s.arc / 2); ctx.stroke();
        ctx.restore();
      });

      // Player
      const playerAngle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
      drawPlayerSprite(player.x, player.y, player.radius, playerAngle, player.isDashing);

      // Floating Damage Text (데미지 텍스트)
      damageTexts.forEach(dt => {
        ctx.save();
        ctx.font = 'bold 15px sans-serif';
        ctx.fillStyle = dt.color;
        ctx.shadowBlur = 4; ctx.shadowColor = '#000';
        ctx.fillText(dt.text, dt.x, dt.y);
        ctx.restore();
      });
    }

    function updateUI() {
      hpBar.style.width = `${Math.max(0, (player.hp / player.maxHp) * 100)}%`;
      hpText.textContent = `${Math.ceil(player.hp)} / ${player.maxHp}`;

      mpBar.style.width = `${Math.max(0, (player.mp / player.maxMp) * 100)}%`;
      mpText.textContent = `${Math.ceil(player.mp)} / ${player.maxMp}`;

      focusBar.style.width = `${Math.max(0, (player.focus / player.maxFocus) * 100)}%`;
      focusText.textContent = `${Math.ceil(player.focus)} / ${player.maxFocus}`;

      // Boss Bar
      const boss = enemies.find(e => e.isBoss);
      if (boss) {
        bossBarContainer.style.display = 'flex';
        bossName.textContent = `${boss.name} (${Math.ceil(boss.hp)} / ${boss.maxHp})`;
        bossHpBar.style.width = `${Math.max(0, (boss.hp / boss.maxHp) * 100)}%`;
      } else {
        bossBarContainer.style.display = 'none';
      }
    }

    function gameOver() {
      isRunning = false;
      alert(`⚔️ 기혈이 다하여 전사하셨습니다...\n\n- 처치한 적: ${score} 마리`);
      startScreen.style.display = 'flex';
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    startBtn.addEventListener('click', () => {
      startScreen.style.display = 'none';
      resetGame();
      isRunning = true;
    });

    loop();
  </script>
</body>
