    // 폭탄 발동 함수 (화면 전체 폭발 및 적 & 적 총알 전멸)
    function triggerBomb() {
      if (bombs <= 0 || isGameOver || isContinueState) return;
      bombs--;
      updateBombsDisplay();

      // 전체 화면 백색 섬광 및 충격파 생성
      bombShockwaves.push({
        radius: 10,
        maxRadius: Math.max(WIDTH, HEIGHT) * 1.1,
        alpha: 1.0
      });

      // 1. 화면 내의 모든 적 파괴 및 점수 획득
      enemies.forEach(e => {
        createExplosion(e.x, e.y, 45, '#f59e0b', 30);
        score += 300;
      });
      if (enemies.length > 0) {
        playExplosionSound(true); // 폭탄 사용 시 묵직한 대폭발음 출력
      }
      enemies = [];

      // 2. 모든 적 총알 소멸 및 보너스 파편화
      enemyBullets.forEach(b => {
        createExplosion(b.x, b.y, 14, '#38bdf8', 6);
      });
      enemyBullets = [];

      updateScoreDisplay();

      // 폭탄으로 적 전멸 시 30만점 달성 체크
      if (score >= 300000 && !isVictoryState) {
        triggerVictory();
      }
    }

    bombBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      triggerBomb();
    });

    // 키보드 스페이스바나 B키로도 폭탄 사용 가능 지원
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'KeyB') {
        triggerBomb();
      }
    });

    // 폭발 이펙트 생성기 (파티클 시스템)
    function createExplosion(x, y, radius, color, count = 18) {
      explosions.push({
        x, y,
        particles: Array.from({ length: count }, () => {
          const angle = Math.random() * Math.PI * 2;
          const spd = 2 + Math.random() * 7;
          return {
            x: 0,
            y: 0,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd,
            size: 3 + Math.random() * 5,
            color: Math.random() > 0.4 ? color : '#facc15',
            alpha: 1.0,
            decay: 0.02 + Math.random() * 0.03
          };
        }),
        ringRadius: 5,
        ringMax: radius * 1.5,
        ringAlpha: 1.0,
        dead: false
      });
    }

    // 플레이어 피격 처리
    function hitPlayer() {
      if (playerInvulnerable > 0 || isGameOver || isContinueState) return;

      // 1. 피격 즉시 2초 무적 선적용 (1프레임 다중 피격 원천 차단)
      playerInvulnerable = 120;

      // 2. 피격 이펙트 및 사운드 방어 실행
      try {
        createExplosion(playerX, playerY, 50, '#ef4444', 35);
        playExplosionSound(false);
      } catch (err) {
        console.warn('피격 이펙트 오류 무시:', err);
      }

      // 3. 잔기(Life) 차감 로직
      // lives === 2 (첫 피격) -> lives 1 (생존, 아이콘 1개 꺼짐)
      // lives === 1 (두번째 피격) -> lives 0 (생존, 마지막 기체, 아이콘 모두 꺼짐)
      // lives === 0 (세번째 피격) -> 비로소 사망 및 컨티뉴/게임오버 진입
      if (lives > 0) {
        lives--;
        updateLivesDisplay();
        // 적 총알 화면 주변 제거 (회복 시간 제공)
        enemyBullets = enemyBullets.filter(b => Math.hypot(b.x - playerX, b.y - playerY) > 200);
      } else {
        // 잔기가 0인 상태에서 추가 피격 -> 기체 대폭발 후 컨티뉴/게임오버 진입
        try {
          createExplosion(playerX, playerY, 70, '#ef4444', 50);
          playExplosionSound(true);
        } catch (err) {
          console.warn('사망 이펙트 오류 무시:', err);
        }
        triggerContinueOrGameOver();
      }
    }

    // 컨티뉴 및 게임오버 모달 제어
    function triggerContinueOrGameOver() {
      if (credits > 0) {
        // 컨티뉴 진입
        isContinueState = true;
        continueTimer = 10;
        overlayTitle.className = 'overlay-title continue-text';
        overlayTitle.innerText = 'CONTINUE?';
        countdownDisplay.style.display = 'block';
        countdownDisplay.innerText = continueTimer;
        finalScoreBox.style.display = 'none'; // 컨티뉴 중에는 점수 박스 숨김
        continueBtn.style.display = 'inline-block';
        backTitleBtn.style.display = 'none'; // 컨티뉴 중에는 타이틀 복귀 버튼 숨김
        continueInfo.innerText = `CREDIT(S) REMAINING: ${credits}`;
        retroOverlay.style.display = 'flex';

        if (continueInterval) clearInterval(continueInterval);
        continueInterval = setInterval(() => {
          continueTimer--;
          if (continueTimer >= 1) {
            countdownDisplay.innerText = continueTimer;
          } else {
            // 1에서 0으로 갈 때 0은 표시하지 않고 바로 GAME OVER 처리!
            clearInterval(continueInterval);
            triggerGameOver();
          }
        }, 1000);
      } else {
        // 컨티뉴 2회 모두 소진됨 -> 즉시 게임오버
        triggerGameOver();
      }
    }

    function triggerGameOver() {
      isContinueState = false;
      isGameOver = true;
      if (continueInterval) clearInterval(continueInterval);

      overlayTitle.className = 'overlay-title gameover-text';
      overlayTitle.innerText = 'GAME OVER';
      countdownDisplay.style.display = 'none'; // 0 미표시

      // 최종 점수 9자리 포맷으로 표시
      finalScoreVal.innerText = score.toString().padStart(9, '0');
      finalScoreBox.style.display = 'flex';

      continueBtn.style.display = 'none';
      backTitleBtn.style.display = 'inline-block'; // 타이틀 복귀 버튼 노출
      continueInfo.innerText = 'INSERT COIN / REFRESH TO RESTART';
      retroOverlay.style.display = 'flex';
    }

    // 모달 및 화면 터치/클릭 시 컨티뉴 즉시 처리
    function handleContinueAction() {
      if (!isContinueState || credits <= 0) return;
      credits--;
      clearInterval(continueInterval);
      isContinueState = false;
      retroOverlay.style.display = 'none';

      // 플레이어 리스폰 (잔기 2개, 폭탄 2개 재충전, 무적 3초)
      lives = 2;
      bombs = 2;
      updateLivesDisplay();
      updateBombsDisplay();
      playerInvulnerable = 180;
      playerX = WIDTH / 2;
      targetX = WIDTH / 2;
      lastTouchX = null;
      lastTouchY = null;

      // 화면 내 적 총알 전멸
      enemyBullets = [];
      createExplosion(playerX, playerY, 60, '#38bdf8', 40);
    }

    continueBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      handleContinueAction();
    });
    retroOverlay.addEventListener('click', (e) => {
      e.stopPropagation();
      handleContinueAction();
    });
    retroOverlay.addEventListener('touchstart', (e) => {
      e.stopPropagation();
      handleContinueAction();
    }, { passive: false });

    // -------------------------------------------------------------
    // 적 기체 타입 시스템 (기존 3종 + 신규 3종: 그룹편대, 소형/중형/대형 자코)
    // -------------------------------------------------------------
    // Type 1: 정찰 요격기 (Crimson Interceptor)
    //   - 이동: 날렵한 붉은 델타익, 좌우 지그재그 사인파(Sine wave)
    //   - 사격: "빠르게 끊어서" 2연사(Burst)로 플레이어를 조준 사격
    //
    // Type 2: 기갑 전폭기 (Panzer Bomber)
    //   - 이동: 묵직한 녹색 헥사곤 장갑, 상공에서 선회(U턴/Swoop)
    //   - 사격: "천천히 많은 총알" - 5방향 부채꼴 탄막(Slow Spread Ring) 방출
    //
    // Type 3: 스텔스 중전투기 (Shadow Fighter)
    //   - 이동: 짙은 보라색 3단 전진익, 상공 진입 후 제자리 호버링
    //   - 사격: "넓게 적은 양의 총알" - 좌우 양날개에서 넓은 각도의 트윈 와이드 샷 발사
    //
    // Type 4: 그룹 편대 자코 (Squad Zako) - 좌→우 또는 우→좌 횡대 이동, 여러 대가 편대로 총알 뿌림
    // Type 5: 소형 자코 (Scout Zako) - 상단/측면에서 급속 등장, 1~3발 조준탄 발사 후 즉시 도주, 체력 매우 낮음
    // Type 6: 중형 자코 (Heavy Zako) - 화면에 오래 체류, 확산탄 or 고속 연사 조준탄, 체력 높음
    // Type 7: 대형 자코 (Fortress Zako) - 여러 포탑을 가진 준보스급, 넓은 고정탄막 + 조준탄막 동시 구사

    let enemies = [];
    let enemySpawnTimer = 0;
    let targetEnemyCount = 6; // 화면에 유지할 목표 적 기체 수 (5~8 랜덤, 난이도에 따라 상한 확장)
    let targetRecalcTimer = 0;
    let spawnCycleIndex = 0; // 순환 스폰 인덱스 (7타입)
    let squadSpawnTimer = 0; // 그룹 편대 전용 스폰 타이머
    let scoutSpawnTimer = 0; // 소형 자코 전용 스폰 타이머 (자주 등장)
    let fortressTimer = 0;   // 대형 요새형 자코 전용 타이머 (1분 30초 = 90초 주기)

    // -------------------------------------------------------------
    // 난이도 스케일링 시스템 (시작 난이도 50% = 0.5x, 10,000점당 +10%, 500,000점에서 최대 6.0배 고정)
    // 적용 대상: 적 스폰 속도 / 동시 등장 수 / 탄속 / 탄막(발사 빈도, 탄 수)
    // 미적용 대상: 체력(hp), 플레이어 스탯 — 항상 고정
    // -------------------------------------------------------------
    let difficultyMultiplier = 0.5;
    function updateDifficulty() {
      const cappedScore = Math.min(score, 500000);
      const level = Math.floor(cappedScore / 10000); // 0 ~ 50
      difficultyMultiplier = 0.5 + level * 0.10; // 0.5 ~ 5.5
    }

    class Enemy {
      constructor(type, opts = {}) {
        this.type = type;
        this.age = 0;
        this.dead = false;
        this.shootCooldown = 0;
        this.hp = 1; // 기본 체력 (총알/레이저 1회 피격 시 사망)
        this.maxHp = 1;

        if (this.type === 1) {
          // [Type 1] 요격기 (붉은색) - 1방에 즉시 사망
          this.baseX = 100 + Math.random() * (WIDTH - 200);
          this.x = this.baseX;
          this.y = -60;
          this.speedY = 4.0 + Math.random() * 1.2;
          this.amplitude = 75 + Math.random() * 45;
          this.freq = 0.038;
          this.width = 36;
          this.height = 38;
          this.radius = 20;
          this.burstCount = 0;
          this.burstTimer = 0;
          this.hp = this.maxHp = 1; // 1방 즉사
        } else if (this.type === 2) {
          // [Type 2] 전폭기 (초록색) - 1방에 즉시 사망
          this.startX = Math.random() > 0.5 ? 80 : WIDTH - 80;
          this.x = this.startX;
          this.y = -80;
          this.vx = (this.startX < WIDTH / 2) ? 3.0 : -3.0;
          this.vy = 3.2;
          this.state = 'enter';
          this.width = 54;
          this.height = 50;
          this.radius = 28;
          this.shootTimer = 40;
          this.hp = this.maxHp = 1; // 1방 즉사
        } else if (this.type === 3) {
          // [Type 3] 스텔스 중전투기
          this.x = 130 + Math.random() * (WIDTH - 260);
          this.y = -90;
          this.targetY = 220 + Math.random() * 160;
          this.hoverTime = 0;
          this.maxHover = 180; // 3초간 호버링
          this.width = 64;
          this.height = 58;
          this.radius = 32;
          this.wideShotTimer = 45;
          this.hp = this.maxHp = 2; // 스텔스기는 2방
        } else if (this.type === 4) {
          // [Type 4] 그룹 편대 자코 (Squad Zako) - 좌→우 또는 우→좌 횡대 이동
          // opts로 편대 방향과 편대 내 위치(row/col)를 전달받음
          this.dir = opts.dir || 1; // 1: 좌->우, -1: 우->좌
          this.x = (this.dir === 1) ? -60 - (opts.col || 0) * 70 : WIDTH + 60 + (opts.col || 0) * 70;
          this.y = opts.rowY || (150 + Math.random() * 500);
          this.vx = this.dir * (3.2 + Math.random() * 0.6);
          this.vy = 0;
          this.width = 34;
          this.height = 34;
          this.radius = 18;
          this.shootTimer = 30 + Math.floor(Math.random() * 30); // 편대원마다 발사 시점 분산
          this.hp = this.maxHp = 2;
        } else if (this.type === 5) {
          // [Type 5] 소형 자코 (Scout Zako) - 상단/측면 급속 등장, 1~3발 쏘고 즉시 도주
          const spawnSide = Math.floor(Math.random() * 3); // 0: top, 1: left, 2: right
          if (spawnSide === 0) {
            this.x = 80 + Math.random() * (WIDTH - 160);
            this.y = -40;
            this.vx = (Math.random() - 0.5) * 2;
            this.vy = 9 + Math.random() * 2; // 매우 빠르게 등장
          } else if (spawnSide === 1) {
            this.x = -40;
            this.y = 150 + Math.random() * 500;
            this.vx = 9 + Math.random() * 2;
            this.vy = (Math.random() - 0.5) * 1.5;
          } else {
            this.x = WIDTH + 40;
            this.y = 150 + Math.random() * 500;
            this.vx = -(9 + Math.random() * 2);
            this.vy = (Math.random() - 0.5) * 1.5;
          }
          this.phase = 'dash-in'; // dash-in -> shoot -> flee
          this.phaseTimer = 0;
          this.shotsLeft = 1 + Math.floor(Math.random() * 3); // 1~3발
          this.width = 26;
          this.height = 26;
          this.radius = 14;
          this.hp = this.maxHp = 1; // 체력 매우 낮음 (원샷킬)
        } else if (this.type === 6) {
          // [Type 6] 중형 자코 (Heavy Zako) - 등장 즉시 탄환 발사 & 체력 3
          this.x = 150 + Math.random() * (WIDTH - 300);
          this.y = -100;
          this.targetY = 260 + Math.random() * 220;
          this.state = 'enter';
          this.stayTimer = 0;
          this.maxStay = 260;
          this.subPattern = Math.random() > 0.5 ? 'spread' : 'rapid';
          this.shootTimer = 999; // 나타나자마자 즉시 1차 사격 개시하도록 타이머 선충전
          this.enterShotDone = false; // 진입 중 즉시 사격 여부 플래그
          this.width = 70;
          this.height = 64;
          this.radius = 36;
          this.hp = this.maxHp = 3;
        } else {
          // [Type 7] 대형 자코 (Fortress Zako) - 가장 큰 적 체력 2배 상향 (코어 8 -> 16, 포탑 각 2 -> 4)
          this.x = WIDTH / 2;
          this.y = -150;
          this.targetY = 260;
          this.state = 'enter';
          this.shootTimer = 0;
          this.spreadTimer = 0;
          this.width = 220;
          this.height = 140;
          this.radius = 100;
          // 포탑 4개 체력 2배 상향 (각 2 -> 4)
          this.turrets = [
            { dx: -80, dy: -10, hp: 4, maxHp: 4, alive: true },
            { dx: -40, dy: 20, hp: 4, maxHp: 4, alive: true },
            { dx: 40, dy: 20, hp: 4, maxHp: 4, alive: true },
            { dx: 80, dy: -10, hp: 4, maxHp: 4, alive: true }
          ];
          this.hp = this.maxHp = 16; // 코어 체력 기존 8 -> 2배인 16으로 상향
        }
      }


      update() {
        this.age++;

        // 1. 이동 및 사격 패턴 (난이도 배율 difficultyMultiplier 적용: 탄속/주기/탄막 확장, 체력은 고정)
        const dMul = difficultyMultiplier;

        if (this.type === 1) {
          // [Type 1] 요격기: 지그재그 강하 + 고속 조준탄 2연사
          this.y += this.speedY;
          this.x = this.baseX + Math.sin(this.age * this.freq) * this.amplitude;

          if (this.y > 100 && this.y < HEIGHT * 0.75) {
            this.burstTimer++;
            const interval = Math.max(20, Math.floor(55 / dMul));
            if (this.burstTimer >= interval) {
              this.burstTimer = 0;
              this.fireAtPlayer(8.5 * Math.min(2.5, dMul));
            }
          }
        } else if (this.type === 2) {
          // [Type 2] 전폭기: U턴 선회 + 5~9방향 느린 부채꼴 탄막
          this.x += this.vx;
          this.y += this.vy;

          if (this.y > 380 && this.state === 'enter') {
            this.state = 'swoop';
            this.vy = -1.2;
            this.vx *= 1.4;
          } else if (this.state === 'swoop' && this.y < 280) {
            this.state = 'exit';
            this.vy = 5.2;
          }

          if (this.y > 80 && this.y < HEIGHT - 200) {
            this.shootTimer++;
            const interval = Math.max(30, Math.floor(80 / dMul));
            if (this.shootTimer >= interval) {
              this.shootTimer = 0;
              const baseAngle = Math.atan2(playerY - this.y, playerX - this.x);
              // 난이도에 따라 탄 수 5발 -> 7발 -> 9발 확장
              const fanCount = dMul >= 3.0 ? 9 : (dMul >= 1.8 ? 7 : 5);
              const halfSpread = 0.5;
              const step = (halfSpread * 2) / (fanCount - 1);
              for (let i = 0; i < fanCount; i++) {
                const ang = baseAngle - halfSpread + i * step;
                enemyBullets.push({
                  x: this.x,
                  y: this.y + 12,
                  vx: Math.cos(ang) * (2.8 * Math.min(2.2, dMul)),
                  vy: Math.sin(ang) * (2.8 * Math.min(2.2, dMul)),
                  radius: 11, // 크고 눈에 잘 띔
                  color: '#4ade80'
                });
              }
            }
          }
        } else if (this.type === 3) {
          // [Type 3] 스텔스 중전투기: 호버링 + 넓은 트윈 와이드 샷
          if (this.y < this.targetY) {
            this.y += (this.targetY - this.y) * 0.04 + 1;
          } else if (this.hoverTime < this.maxHover) {
            this.hoverTime++;
            this.x += Math.sin(this.hoverTime * 0.08) * 0.8;

            this.wideShotTimer++;
            const interval = Math.max(25, Math.floor(60 / dMul));
            if (this.wideShotTimer >= interval) {
              this.wideShotTimer = 0;
              const bSpeed = 4.2 * Math.min(2.2, dMul);
              [-24, 24].forEach((offX, idx) => {
                const dirX = idx === 0 ? -2.8 : 2.8;
                enemyBullets.push({
                  x: this.x + offX,
                  y: this.y + 6,
                  vx: dirX * Math.min(2.0, dMul),
                  vy: bSpeed,
                  radius: 13, // 보라색 대구경 탄환 (매우 굵게)
                  color: '#e879f9'
                });
              });
            }
          } else {
            this.y += 6.5;
          }
        } else if (this.type === 4) {
          // [Type 4] 그룹 편대 자코: 좌→우 or 우→좌 횡대 횡단 이동하며 하방 탄환 일제 살포
          this.x += this.vx;
          this.shootTimer++;
          const interval = Math.max(20, Math.floor(45 / dMul));
          if (this.shootTimer >= interval && this.x > 30 && this.x < WIDTH - 30) {
            this.shootTimer = 0;
            enemyBullets.push({
              x: this.x,
              y: this.y + 10,
              vx: (Math.random() - 0.5) * 1.5,
              vy: (4.0 + Math.random() * 1.5) * Math.min(2.2, dMul),
              radius: 10,
              color: '#f97316' // 오렌지색 편대 탄환
            });
          }
        } else if (this.type === 5) {
          // [Type 5] 소형 자코: 초고속 돌진 -> 1~3발 빠른 직선탄 발사 -> 즉시 화면 밖으로 급반전 도주
          this.phaseTimer++;
          if (this.phase === 'dash-in') {
            this.x += this.vx;
            this.y += this.vy;
            if (this.phaseTimer > 18) {
              this.phase = 'shoot';
              this.phaseTimer = 0;
            }
          } else if (this.phase === 'shoot') {
            if (this.shotsLeft > 0) {
              this.fireAtPlayer(9.0 * Math.min(2.4, dMul));
              this.shotsLeft--;
            }
            this.phase = 'flee';
            // 플레이어 반대 방향 또는 상단/측면으로 초고속 이탈
            this.vx = (this.x < WIDTH / 2 ? -1 : 1) * 11;
            this.vy = -7;
          } else if (this.phase === 'flee') {
            this.x += this.vx;
            this.y += this.vy;
          }
        } else if (this.type === 6) {
          // [Type 6] 중형 자코: 화면 진입 즉시 사격 + 화면 체류 중 지속 탄막 (부채꼴 확산탄 or 고속 조준 연사탄)
          const fireType6Bullet = () => {
            if (this.subPattern === 'spread') {
              // 7~11방향 확산탄막
              const fCount = dMul >= 2.5 ? 11 : 7;
              for (let i = 0; i < fCount; i++) {
                const ang = Math.PI * 0.15 + (Math.PI * 0.7 * (i / (fCount - 1)));
                enemyBullets.push({
                  x: this.x,
                  y: this.y + 20,
                  vx: Math.cos(ang) * (3.8 * Math.min(2.0, dMul)),
                  vy: Math.sin(ang) * (3.8 * Math.min(2.0, dMul)),
                  radius: 12,
                  color: '#38bdf8' // 시안 블루 중형 탄환
                });
              }
            } else {
              // 플레이어 방향 3점사 고속 집중탄
              const baseAng = Math.atan2(playerY - this.y, playerX - this.x);
              [-0.15, 0, 0.15].forEach(angOff => {
                enemyBullets.push({
                  x: this.x,
                  y: this.y + 20,
                  vx: Math.cos(baseAng + angOff) * (8.0 * Math.min(2.2, dMul)),
                  vy: Math.sin(baseAng + angOff) * (8.0 * Math.min(2.2, dMul)),
                  radius: 11,
                  color: '#ef4444'
                });
              });
            }
          };

          if (this.state === 'enter') {
            this.y += (this.targetY - this.y) * 0.05 + 1;
            // 화면 상단에 모습을 드러내자마자(y > 30) 즉시 1회 선제 사격 발사
            if (!this.enterShotDone && this.y >= 30) {
              this.enterShotDone = true;
              fireType6Bullet();
            }
            if (Math.abs(this.y - this.targetY) < 10) this.state = 'stay';
          } else if (this.state === 'stay') {
            this.stayTimer++;
            this.x += Math.sin(this.stayTimer * 0.05) * 1.5; // 좌우 부유

            this.shootTimer++;
            const interval = Math.max(25, Math.floor(50 / dMul));
            if (this.shootTimer >= interval) {
              this.shootTimer = 0;
              fireType6Bullet();
            }
            if (this.stayTimer >= this.maxStay) this.state = 'exit';
          } else {
            this.y += 5.5; // 화면 하단으로 돌파 이탈
          }
        } else if (this.type === 7) {
          // [Type 7] 대형 요새형 자코 (준보스): 중앙 진입 + 4개 포탑 독립 탄막 + 코어 전방위 탄막
          if (this.state === 'enter') {
            this.y += (this.targetY - this.y) * 0.03 + 1;
            if (Math.abs(this.y - this.targetY) < 10) this.state = 'fight';
          } else if (this.state === 'fight') {
            this.x += Math.sin(this.age * 0.02) * 1.8;

            // 포탑 사격 (살아있는 포탑마다 조준탄/직선탄 발사)
            this.shootTimer++;
            const tInterval = Math.max(30, Math.floor(65 / dMul));
            if (this.shootTimer >= tInterval) {
              this.shootTimer = 0;
              this.turrets.forEach(t => {
                if (t.alive) {
                  const tx = this.x + t.dx;
                  const ty = this.y + t.dy;
                  const ang = Math.atan2(playerY - ty, playerX - tx);
                  enemyBullets.push({
                    x: tx,
                    y: ty,
                    vx: Math.cos(ang) * (5.5 * Math.min(2.0, dMul)),
                    vy: Math.sin(ang) * (5.5 * Math.min(2.0, dMul)),
                    radius: 12,
                    color: '#fbbf24' // 골드 포탑 탄환
                  });
                }
              });
            }

            // 코어 주기적 8방향 링 탄막
            this.spreadTimer++;
            const sInterval = Math.max(45, Math.floor(90 / dMul));
            if (this.spreadTimer >= sInterval) {
              this.spreadTimer = 0;
              const ringCount = 10;
              for (let i = 0; i < ringCount; i++) {
                const ang = (Math.PI * 2 / ringCount) * i + (this.age * 0.05);
                enemyBullets.push({
                  x: this.x,
                  y: this.y + 30,
                  vx: Math.cos(ang) * (3.5 * Math.min(2.0, dMul)),
                  vy: Math.sin(ang) * (3.5 * Math.min(2.0, dMul)),
                  radius: 13,
                  color: '#f43f5e' // 로즈레드 보스 코어 탄환
                });
              }
            }
          }
        }

        // 화면 이탈 시 제거
        if (this.y > HEIGHT + 160 || this.y < -220 || this.x < -180 || this.x > WIDTH + 180) {
          this.dead = true;
        }
      }

      fireAtPlayer(speed) {
        const dx = playerX - this.x;
        const dy = playerY - this.y;
        const dist = Math.hypot(dx, dy) || 1;
        enemyBullets.push({
          x: this.x,
          y: this.y + 15,
          vx: (dx / dist) * speed,
          vy: (dy / dist) * speed,
          radius: 11, // 8 -> 11 대폭 확대 (눈에 뚜렷함)
          color: '#ef4444' // 고속 붉은 탄환
        });
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        // 지면 그림자
        if (shadowToggle.checked) {
          ctx.save();
          ctx.translate(35, 50);
          ctx.fillStyle = 'rgba(0, 0, 0, 0.32)';
          if (this.type === 1) {
            ctx.beginPath(); ctx.moveTo(0, 20); ctx.lineTo(-18, -14); ctx.lineTo(18, -14); ctx.fill();
          } else if (this.type === 2) {
            ctx.beginPath(); ctx.moveTo(0, 26); ctx.lineTo(-26, -18); ctx.lineTo(26, -18); ctx.fill();
          } else if (this.type === 3) {
            ctx.beginPath(); ctx.moveTo(0, 30); ctx.lineTo(-32, -20); ctx.lineTo(32, -20); ctx.fill();
          } else if (this.type === 4) {
            ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI * 2); ctx.fill();
          } else if (this.type === 5) {
            ctx.beginPath(); ctx.moveTo(0, 14); ctx.lineTo(-12, -10); ctx.lineTo(12, -10); ctx.fill();
          } else if (this.type === 6) {
            ctx.beginPath(); ctx.rect(-32, -28, 64, 56); ctx.fill();
          } else {
            ctx.beginPath(); ctx.rect(-100, -60, 200, 120); ctx.fill();
          }
          ctx.restore();
        }

        // [적 Type 1] 고속 요격기
        if (this.type === 1) {
          ctx.fillStyle = '#f97316';
          ctx.beginPath(); ctx.moveTo(-6, -16); ctx.lineTo(0, -28 - Math.random() * 6); ctx.lineTo(6, -16); ctx.fill();
          ctx.fillStyle = '#dc2626';
          ctx.beginPath(); ctx.moveTo(0, 20); ctx.lineTo(-18, -14); ctx.lineTo(-6, -10); ctx.lineTo(0, -6); ctx.lineTo(6, -10); ctx.lineTo(18, -14); ctx.closePath(); ctx.fill();
          ctx.strokeStyle = '#f87171'; ctx.lineWidth = 1.5; ctx.stroke();
          ctx.fillStyle = '#fef08a';
          ctx.beginPath(); ctx.ellipse(0, 2, 3.5, 6, 0, 0, Math.PI * 2); ctx.fill();

        // [적 Type 2] 기갑 전폭기
        } else if (this.type === 2) {
          ctx.fillStyle = '#eab308';
          [-12, 12].forEach(fx => {
            ctx.beginPath(); ctx.moveTo(fx - 4, -22); ctx.lineTo(fx, -36 - Math.random() * 8); ctx.lineTo(fx + 4, -22); ctx.fill();
          });
          ctx.fillStyle = '#15803d';
          ctx.beginPath(); ctx.moveTo(0, 26); ctx.lineTo(-24, 6); ctx.lineTo(-27, -18); ctx.lineTo(-10, -22); ctx.lineTo(10, -22); ctx.lineTo(27, -18); ctx.lineTo(24, 6); ctx.closePath(); ctx.fill();
          ctx.strokeStyle = '#4ade80'; ctx.lineWidth = 2; ctx.stroke();
          ctx.fillStyle = '#0f172a'; ctx.fillRect(-8, -4, 16, 14);
          ctx.strokeStyle = '#86efac'; ctx.strokeRect(-8, -4, 16, 14);
          ctx.fillStyle = '#0284c7'; ctx.beginPath(); ctx.arc(0, 2, 5, 0, Math.PI * 2); ctx.fill();

        // [적 Type 3] 스텔스 중전투기
        } else if (this.type === 3) {
          ctx.fillStyle = '#c084fc';
          [-18, 0, 18].forEach(fx => {
            ctx.beginPath(); ctx.moveTo(fx - 3, -24); ctx.lineTo(fx, -38 - Math.random() * 7); ctx.lineTo(fx + 3, -24); ctx.fill();
          });
          ctx.fillStyle = '#3b0764';
          ctx.beginPath(); ctx.moveTo(0, 32); ctx.lineTo(16, 12); ctx.lineTo(34, 4); ctx.lineTo(26, -20); ctx.lineTo(10, -14); ctx.lineTo(0, -24); ctx.lineTo(-10, -14); ctx.lineTo(-26, -20); ctx.lineTo(-34, 4); ctx.lineTo(-16, 12); ctx.closePath(); ctx.fill();
          ctx.strokeStyle = '#a855f7'; ctx.lineWidth = 2.5; ctx.stroke();
          ctx.fillStyle = '#e879f9';
          ctx.beginPath(); ctx.moveTo(0, 18); ctx.lineTo(6, -6); ctx.lineTo(-6, -6); ctx.closePath(); ctx.fill();

        // [적 Type 4] 그룹 편대 자코 (Squad Zako) - 오렌지/옐로우 날렵한 전투기
        } else if (this.type === 4) {
          ctx.fillStyle = '#fb923c';
          ctx.beginPath();
          ctx.moveTo(0, 16);
          ctx.lineTo(-16, -12);
          ctx.lineTo(0, -6);
          ctx.lineTo(16, -12);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = '#fde047'; ctx.lineWidth = 2; ctx.stroke();
          // 방향 표시 화살촉 콕핏
          ctx.fillStyle = '#ef4444';
          ctx.beginPath(); ctx.arc(0, 2, 4, 0, Math.PI * 2); ctx.fill();

        // [적 Type 5] 소형 자코 (Scout Zako) - 초소형 침투정, 붉은색 점멸
        } else if (this.type === 5) {
          ctx.fillStyle = '#e11d48';
          ctx.beginPath();
          ctx.moveTo(0, 14);
          ctx.lineTo(-11, -11);
          ctx.lineTo(11, -11);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = '#fda4af'; ctx.lineWidth = 1.5; ctx.stroke();
          ctx.fillStyle = '#ffffff';
          ctx.beginPath(); ctx.arc(0, 0, 3, 0, Math.PI * 2); ctx.fill();

        // [적 Type 6] 중형 자코 (Heavy Zako) - 묵직한 네이비 블루 건쉽
        } else if (this.type === 6) {
          ctx.fillStyle = '#1e3a5f';
          ctx.fillRect(-30, -24, 60, 48);
          ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2.5;
          ctx.strokeRect(-30, -24, 60, 48);
          // 좌우 주익 포대
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(-38, -10, 8, 20);
          ctx.fillRect(30, -10, 8, 20);
          // 중앙 코어
          ctx.fillStyle = '#38bdf8';
          ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
          // 체력 바 (HP Bar)
          const hpRatio = Math.max(0, this.hp / this.maxHp);
          ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(-28, -34, 56, 5);
          ctx.fillStyle = '#22c55e'; ctx.fillRect(-28, -34, 56 * hpRatio, 5);

        // [적 Type 7] 대형 요새형 자코 (Fortress Zako) - 초대형 기동 요새
        } else {
          // 거대 동체 베이스
          ctx.fillStyle = '#18181b';
          ctx.fillRect(-95, -50, 190, 100);
          ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 3;
          ctx.strokeRect(-95, -50, 190, 100);

          // 장갑 패널
          ctx.fillStyle = '#27272a';
          ctx.fillRect(-85, -40, 170, 80);

          // 중앙 메인 반응로 코어 (펄스)
          const pulse = 16 + Math.sin(this.age * 0.1) * 3;
          ctx.fillStyle = '#ef4444';
          ctx.shadowColor = '#ef4444'; ctx.shadowBlur = 15;
          ctx.beginPath(); ctx.arc(0, 0, pulse, 0, Math.PI * 2); ctx.fill();
          ctx.shadowBlur = 0;

          // 4개의 독립 포탑 렌더링
          this.turrets.forEach((t, idx) => {
            if (t.alive) {
              ctx.fillStyle = '#52525b';
              ctx.beginPath(); ctx.arc(t.dx, t.dy, 12, 0, Math.PI * 2); ctx.fill();
              ctx.strokeStyle = '#facc15'; ctx.lineWidth = 2; ctx.stroke();
              // 포열
              const ang = Math.atan2(playerY - (this.y + t.dy), playerX - (this.x + t.dx));
              ctx.strokeStyle = '#facc15'; ctx.lineWidth = 3;
              ctx.beginPath();
              ctx.moveTo(t.dx, t.dy);
              ctx.lineTo(t.dx + Math.cos(ang) * 18, t.dy + Math.sin(ang) * 18);
              ctx.stroke();
            } else {
              // 파괴된 포탑 잔해
              ctx.fillStyle = '#27272a';
              ctx.beginPath(); ctx.arc(t.dx, t.dy, 8, 0, Math.PI * 2); ctx.fill();
            }
          });

          // 요새 전체 체력 바
          const fHpRatio = Math.max(0, this.hp / this.maxHp);
          ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(-90, -62, 180, 7);
          ctx.fillStyle = '#f43f5e'; ctx.fillRect(-90, -62, 180 * fHpRatio, 7);
          ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1; ctx.strokeRect(-90, -62, 180, 7);
        }

        ctx.restore();
      }
    }

    // 메인 루프
    let lastTime = performance.now();
    let frameCount = 0;
    let fpsTimer = 0;

    function gameLoop(now) {
      const delta = (now - lastTime) / 1000;
      lastTime = now;

      frameCount++;
      fpsTimer += delta;
      if (fpsTimer >= 0.5) {
        fpsCounter.innerText = `FPS: ${Math.round(frameCount / fpsTimer)}`;
        frameCount = 0;
        fpsTimer = 0;
      }

      // 1. 배경 좌표 아래로 이동 및 3대 바이옴 순환 스크롤
      bgSegments.forEach(seg => {
        seg.y += baseSpeed;
      });

      // 아래 화면 밖으로 완전히 벗어난 세그먼트는 다른 세그먼트의 바로 위로 재배치하고 다음 바이옴 텍스처 인덱스로 갱신
      if (bgSegments[0].y >= HEIGHT) {
        bgSegments[0].y = bgSegments[1].y - HEIGHT;
        bgSegments[0].texIdx = (bgSegments[1].texIdx + 1) % TOTAL_SEGMENTS;
      }
      if (bgSegments[1].y >= HEIGHT) {
        bgSegments[1].y = bgSegments[0].y - HEIGHT;
        bgSegments[1].texIdx = (bgSegments[0].texIdx + 1) % TOTAL_SEGMENTS;
      }

      // 2. 지면 렌더링
      bgSegments.forEach(seg => {
        const tex = groundTextures[seg.texIdx];
        ctx.drawImage(tex, 0, Math.floor(seg.y));
      });

      // 무적 시간 카운트다운
      if (playerInvulnerable > 0) {
        playerInvulnerable--;
      }

      // -----------------------------------------------------------
      // 3. 플레이어 자동 총알 발사 (R 아이템 획득 시 총알 탄속 rapidBoost% 가속)
      // -----------------------------------------------------------
      if (gameStarted && !isGameOver && !isContinueState && !isVictoryState) {
        autoShootTimer++;
        if (autoShootTimer >= 8) {
          autoShootTimer = 0;
          // 기본 탄속 -15에서 rapidBoost(최대 +40%)만큼 탄속 증가
          const speedFactor = 1 + (rapidBoost / 100);
          const bulletSpeed = -15 * speedFactor;
          playerBullets.push({ x: playerX - 12, y: playerY - 24, vy: bulletSpeed, width: 4, height: 16 });
          playerBullets.push({ x: playerX + 12, y: playerY - 24, vy: bulletSpeed, width: 4, height: 16 });
          // 레이저 발사 효과음 출력
          playLaserSound();
        }
      }

      // 플레이어 총알 이동 & 렌더링
      ctx.fillStyle = '#38bdf8';
      ctx.shadowColor = '#0284c7';
      ctx.shadowBlur = 8;
      for (let i = playerBullets.length - 1; i >= 0; i--) {
        const pb = playerBullets[i];
        pb.y += pb.vy;

        ctx.fillRect(pb.x - pb.width / 2, pb.y, pb.width, pb.height);

        // 적과의 충돌 검사 (HP 차감 및 격추 판정 - 요새 코어는 외곽 포탑이 남아있어도 타격 가능)
        let hit = false;
        for (let j = enemies.length - 1; j >= 0; j--) {
          const enemy = enemies[j];
          if (Math.hypot(pb.x - enemy.x, pb.y - enemy.y) < enemy.radius + 6) {
            hit = true;
            createExplosion(pb.x, pb.y, 16, '#facc15', 8);
            playHitSound(); // 적기 피격 타격음 출력

            // 대형 요새(Type 7)인 경우: 외곽 포탑 근처면 포탑 데미지, 중앙 코어 근처면 코어 데미지 즉시 차감
            if (enemy.type === 7 && enemy.turrets) {
              let turretHit = false;
              for (let t of enemy.turrets) {
                if (t.alive && Math.hypot(pb.x - (enemy.x + t.dx), pb.y - (enemy.y + t.dy)) < 22) {
                  t.hp--;
                  turretHit = true;
                  createExplosion(pb.x, pb.y, 22, '#fbbf24', 12);
                  if (t.hp <= 0) {
                    t.alive = false;
                    createExplosion(enemy.x + t.dx, enemy.y + t.dy, 35, '#f59e0b', 20);
                    playExplosionSound(false); // 포탑 격파음
                    score += 200; // 포탑 격파 보너스
                    updateScoreDisplay();
                  }
                  break;
                }
              }
              // 포탑을 빗맞췄거나 코어 중심부 타격 시 코어 HP 즉시 차감
              if (!turretHit) {
                enemy.hp--;
                createExplosion(pb.x, pb.y, 20, '#ef4444', 10);
              }
            } else {
              enemy.hp--;
            }

            // 체력 0 이하 시 최종 격추
            if (enemy.hp <= 0) {
              enemy.dead = true;
              const expRad = enemy.type === 7 ? 80 : (enemy.type === 6 ? 55 : (enemy.type === 2 ? 40 : 25));
              createExplosion(enemy.x, enemy.y, expRad, '#f59e0b', enemy.type === 7 ? 60 : 24);
              playExplosionSound(enemy.type === 7); // 적기 폭발 격추음 (준보스 시 묵직한 롱 럼블)
              const scores = { 1: 100, 2: 200, 3: 300, 4: 150, 5: 80, 6: 600, 7: 1500 };
              score += scores[enemy.type] || 100;
              updateScoreDisplay();

              // 30만점 달성 시 승리 엔딩 체크 (전체 적 전멸 + 팡파레 + 꽃가루 비 + 승리 모달)
              if (score >= 300000 && !isVictoryState) {
                triggerVictory();
              }

              // 대형 요새 격파 시 100% 확률로 R 아이템 드롭, 일반 적은 2.5% 희귀 드롭
              if (enemy.type === 7 || Math.random() < 0.025) {
                items.push({
                  x: enemy.x,
                  y: enemy.y,
                  vy: 1.8, // 아래로 천천히 하강
                  radius: 18,
                  angle: 0
                });
              }

              enemies.splice(j, 1);
            }
            break;
          }
        }

        if (hit || pb.y < -30) {
          playerBullets.splice(i, 1);
        }
      }
      ctx.shadowBlur = 0; // 리셋

      // -----------------------------------------------------------
      // 4. 적 생성 & 업데이트 & 렌더링 (일반 자코 + 그룹 편대 + 소형/중형/대형 자코)
      // -----------------------------------------------------------
      if (gameStarted && !isGameOver && !isVictoryState) {
        updateDifficulty(); // 점수 기반 난이도 배율 갱신 (10,000점당 +10%, 최대 6.0배)

        // [A] 그룹 편대(Type 4) 스폰 타이머 (좌->우 or 우->좌 3~5대 횡대 편대)
        squadSpawnTimer += delta;
        if (squadSpawnTimer > Math.max(5, 11 / difficultyMultiplier)) {
          squadSpawnTimer = 0;
          const sDir = Math.random() > 0.5 ? 1 : -1;
          const sRowY = 140 + Math.random() * 450;
          const sCount = 3 + Math.floor(Math.random() * 3); // 3~5대
          for (let c = 0; c < sCount; c++) {
            enemies.push(new Enemy(4, { dir: sDir, rowY: sRowY, col: c }));
          }
        }

        // [B] 소형 자코(Type 5) 급습 타이머 (상단/측면 급속 등장 후 이탈)
        scoutSpawnTimer += delta;
        if (scoutSpawnTimer > Math.max(1.8, 4.0 / difficultyMultiplier)) {
          scoutSpawnTimer = 0;
          enemies.push(new Enemy(5));
        }

        // [C] 대형 요새형 자코(Type 7) - 1분 30초(90초)마다 정확히 1번씩만 단독 등장
        fortressTimer += delta;
        if (fortressTimer >= 90) {
          fortressTimer = 0;
          const fortressExists = enemies.some(e => e.type === 7);
          if (!fortressExists) {
            enemies.push(new Enemy(7));
          }
        }

        // [D] 일반 순환 스폰 (Type 1~3 기본 적 + Type 6 중형)
        const spawnInterval = 0.65 / difficultyMultiplier;
        enemySpawnTimer += delta;
        if (enemySpawnTimer > spawnInterval && enemies.length < targetEnemyCount) {
          enemySpawnTimer = 0;
          // 가중치 확률: 기본 1~3(75%), 중형 6(25%) - 대형 7은 여기서 안 나옴
          const roll = Math.random();
          let nextType = 1;
          if (roll < 0.75) {
            spawnCycleIndex = (spawnCycleIndex + 1) % 3;
            nextType = spawnCycleIndex + 1; // Type 1, 2, 3
          } else {
            nextType = 6; // 중형 자코
          }
          enemies.push(new Enemy(nextType));
        }

        // 목표 동시 등장 수 재조정 타이머 (난이도에 따라 상한이 5~8에서 점차 확장)
        targetRecalcTimer += delta;
        if (targetRecalcTimer > 4) {
          targetRecalcTimer = 0;
          const extraCap = Math.floor((difficultyMultiplier - 1) * 3);
          targetEnemyCount = 5 + Math.floor(Math.random() * 4) + extraCap;
        }
      }

      for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = enemies[i];
        enemy.update();
        enemy.draw();

        // 적과 플레이어의 직접 충돌 검사 (피격점을 기체 끝이 아닌 안쪽 중심부로 축소: 18 -> 8)
        if (!isGameOver && !isContinueState && playerInvulnerable <= 0) {
          if (Math.hypot(playerX - enemy.x, playerY - enemy.y) < enemy.radius + 8) {
            enemy.dead = true;
            createExplosion(enemy.x, enemy.y, 45, '#f59e0b', 24);
            enemies.splice(i, 1);
            hitPlayer();
            continue;
          }
        }

        if (enemy.dead) {
          enemies.splice(i, 1);
        }
      }

      // -----------------------------------------------------------
      // 5. 적 총알 이동, 렌더링 & 플레이어 피격 검사 (피격점 안쪽 축소: 12 -> 5)
      // -----------------------------------------------------------
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const eb = enemyBullets[i];
        eb.x += eb.vx;
        eb.y += eb.vy;

        // 총알 드로잉 (글로우 이펙트)
        ctx.fillStyle = eb.color;
        ctx.beginPath();
        ctx.arc(eb.x, eb.y, eb.radius, 0, Math.PI * 2);
        ctx.fill();

        // 플레이어 피격 판정 (비행기 외곽 끝이 아닌 중심 콕핏 안쪽 5px 코어 판정)
        if (!isGameOver && !isContinueState && playerInvulnerable <= 0) {
          if (Math.hypot(playerX - eb.x, playerY - eb.y) < eb.radius + 5) {
            enemyBullets.splice(i, 1);
            hitPlayer();
            continue;
          }
        }

        // 화면 밖으로 벗어나면 소멸
        if (eb.x < -30 || eb.x > WIDTH + 30 || eb.y < -30 || eb.y > HEIGHT + 30) {
          enemyBullets.splice(i, 1);
        }
      }

      // -----------------------------------------------------------
      // 6. 폭탄 충격파 & 전체 화면 폭발 렌더링
      // -----------------------------------------------------------
      for (let i = bombShockwaves.length - 1; i >= 0; i--) {
        const sw = bombShockwaves[i];
        sw.radius += 28;
        sw.alpha -= 0.022;

        // 전체 화면 플래시
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0, sw.alpha * 0.45)})`;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        // 원형 충격파 링
        ctx.strokeStyle = `rgba(239, 68, 68, ${Math.max(0, sw.alpha)})`;
        ctx.lineWidth = 12;
        ctx.beginPath();
        ctx.arc(playerX, playerY, sw.radius, 0, Math.PI * 2);
        ctx.stroke();

        if (sw.alpha <= 0 || sw.radius >= sw.maxRadius) {
          bombShockwaves.splice(i, 1);
        }
      }

      // -----------------------------------------------------------
      // 7. 파티클 폭발 이펙트 렌더링
      // -----------------------------------------------------------
      for (let i = explosions.length - 1; i >= 0; i--) {
        const exp = explosions[i];
        // 충격파 링
        if (exp.ringAlpha > 0) {
          ctx.strokeStyle = `rgba(250, 204, 21, ${exp.ringAlpha})`;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(exp.x, exp.y, exp.ringRadius, 0, Math.PI * 2);
          ctx.stroke();
          exp.ringRadius += 2.5;
          exp.ringAlpha -= 0.05;
        }

        // 개별 파티클
        let aliveParticles = 0;
        exp.particles.forEach(p => {
          if (p.alpha > 0) {
            p.x += p.vx;
            p.y += p.vy;
            p.alpha -= p.decay;
            ctx.fillStyle = p.color;
            ctx.globalAlpha = Math.max(0, p.alpha);
            ctx.beginPath();
            ctx.arc(exp.x + p.x, exp.y + p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1.0;
            aliveParticles++;
          }
        });

        if (aliveParticles === 0 && exp.ringAlpha <= 0) {
          explosions.splice(i, 1);
        }
      }

      // -----------------------------------------------------------
      // 7.5 'R' 형태 아이템 이동, 렌더링 & 플레이어 획득 검사
      // -----------------------------------------------------------
      if (gameStarted && !isGameOver && !isVictoryState) {
        // 자연 스폰 빈도 대폭 완화 (기존 18초 -> 45초마다 1개씩 하강)
        itemSpawnTimer += delta;
        if (itemSpawnTimer > 45) {
          itemSpawnTimer = 0;
          items.push({
            x: 80 + Math.random() * (WIDTH - 160),
            y: -30,
            vy: 1.8,
            radius: 18,
            angle: 0
          });
        }
      }

      for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i];
        it.y += it.vy;
        it.angle += 0.04;

        // 아이템 드로잉 (황금빛 원형 배지 + 중앙 붉은색 "R" 알파벳)
        ctx.save();
        ctx.translate(it.x, it.y);

        // 외곽 회전 네온 링
        ctx.strokeStyle = '#facc15';
        ctx.lineWidth = 3;
        ctx.shadowColor = '#facc15';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(0, 0, it.radius, 0, Math.PI * 2);
        ctx.stroke();

        // 내부 배경 디스크
        ctx.fillStyle = '#1e1b4b';
        ctx.beginPath();
        ctx.arc(0, 0, it.radius - 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // 'R' 레트로 굵은 폰트 렌더링
        ctx.fillStyle = '#f43f5e';
        ctx.font = 'bold 20px "Press Start 2P", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('R', 0, 2);

        ctx.restore();

        // 플레이어 획득 검사 (충돌 반경 28px)
        if (gameStarted && !isGameOver && !isContinueState) {
          if (Math.hypot(playerX - it.x, playerY - it.y) < it.radius + 20) {
            // 총알 속도 5% 증가 (최대 +60% 캡)
            if (rapidBoost < 60) {
              rapidBoost = Math.min(60, rapidBoost + 5);
              updateRapidDisplay();
            }
            score += 500;
            updateScoreDisplay();
            createExplosion(it.x, it.y, 35, '#facc15', 25);
            items.splice(i, 1);
            continue;
          }
        }

        // 화면 아래로 벗어나면 소멸
        if (it.y > HEIGHT + 40) {
          items.splice(i, 1);
        }
      }

      // 7.8 꽃가루(Confetti) 렌더링 & 3D 펄럭임 물리 시뮬레이션
      if (confettis.length > 0) {
        confettis.forEach(c => {
          c.wobble += c.wobbleSpeed;
          c.x += c.vx + Math.sin(c.wobble) * 2.2;
          c.y += c.vy;
          c.rot += c.vRot;

          ctx.save();
          ctx.translate(c.x, c.y);
          ctx.rotate(c.rot);
          ctx.fillStyle = c.color;
          ctx.fillRect(-c.w / 2, -c.h / 2 * Math.cos(c.wobble), c.w, c.h);
          ctx.restore();

          if (c.y > HEIGHT + 20) {
            c.y = -20;
            c.x = Math.random() * WIDTH;
          }
        });
      }

      // -----------------------------------------------------------
      // 8. 플레이어 기체 부드러운 추종 및 렌더링 (모든 방향 이동 가능, 피격 무적 시 깜빡임)
      // -----------------------------------------------------------
      if (Number.isFinite(targetX)) playerX = targetX;
      if (Number.isFinite(targetY)) playerY = targetY;

      // 화면 밖으로 나가지 않도록 경계값 고정 (여유 마진 40px)
      playerX = Math.max(40, Math.min(WIDTH - 40, playerX));
      playerY = Math.max(60, Math.min(HEIGHT - 40, playerY));

      if (gameStarted && !isGameOver) {
        if (playerInvulnerable % 6 < 3) {
          drawPlayer(playerX, playerY);
        }
      }

      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);

    // -------------------------------------------------------------
    // 타이틀 화면 제어 (주인공/적 없이 배경만 흐르는 상태 유지 후 시작)
    // -------------------------------------------------------------
    const titleScreen = document.getElementById('title-screen');

    function startGame() {
      if (gameStarted) return;
      initAudio(); // 브라우저 오디오 권한 언락
      gameStarted = true;
      titleScreen.style.display = 'none';
      // 시작 시 플레이어 위치 초기화 및 무적 부여
      playerX = WIDTH / 2;
      playerY = HEIGHT * 0.8;
      targetX = playerX;
      targetY = playerY;
      playerInvulnerable = 90;
    }

    // 타이틀 화면 시작 이벤트
    titleScreen.addEventListener('click', startGame);
    titleScreen.addEventListener('touchstart', (e) => {
      e.preventDefault();
      startGame();
    }, { passive: false });

    // 전역 윈도우 클릭/키보드로도 컨티뉴 즉시 처리
    window.addEventListener('click', () => {
      if (isContinueState && credits > 0) {
        handleContinueAction();
      }
    });

    window.addEventListener('keydown', (e) => {
      if (!gameStarted && (e.code === 'Space' || e.code === 'Enter')) {
        startGame();
      } else if (isContinueState && (e.code === 'Space' || e.code === 'Enter')) {
        handleContinueAction();
      }
    });
  </script>
</body>
