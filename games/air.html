<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Air Fight - Retro Arcade Top-down Shooter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Bangers&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
    }
    body {
      background-color: #0b1117;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start; /* 화면 최상단 밀착 */
      min-height: 100vh;
      min-height: 100dvh;
      padding-top: env(safe-area-inset-top, 0); /* 노치/다이내믹 아일랜드 대응 */
    }
    #game-container {
      position: relative;
      width: min(800px, 100vw, calc(100dvh * 800 / 1200));
      height: min(1200px, calc(100vw * 1200 / 800), 100dvh);
      aspect-ratio: 800 / 1200;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      overflow: hidden;
      background: #1e281e;
      margin-top: 0;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .hud {
      position: absolute;
      top: 14px;
      left: 18px;
      right: 18px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      font-family: "Press Start 2P", monospace;
      font-size: 11px;
      letter-spacing: 1px;
      z-index: 10;
    }
    .hud-left {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-start;
    }
    .hud-lives {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hud-lives svg {
      width: 20px;
      height: 20px;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.6));
    }
    /* 박스 테두리 제거된 BOMB 컴팩트 인라인 표시 (잔기 바로 아래) */
    .hud-bombs {
      display: flex;
      align-items: center;
      gap: 6px;
      pointer-events: auto;
      cursor: pointer;
    }
    .hud-bombs .bomb-label {
      font-family: "Press Start 2P", monospace;
      font-size: 10px;
      color: #ef4444;
      text-shadow: 1px 1px 0 #991b1b;
      margin-right: 2px;
    }
    .hud-bombs svg {
      width: 20px;
      height: 20px;
      filter: drop-shadow(0 2px 4px rgba(239, 68, 68, 0.6));
      transition: opacity 0.15s;
    }
    .hud-status-left {
      font-size: 10px;
      font-family: "SF Mono", Menlo, monospace;
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-top: 2px;
    }
    .hud-score {
      text-align: center;
      color: #facc15;
      text-shadow: 2px 2px 0px #854d0e, 0 0 10px rgba(250, 204, 21, 0.6);
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .hud-score .label {
      font-size: 13px;
      letter-spacing: 2px;
    }
    .hud-score .digits {
      font-size: 16px;
      color: #fef08a;
    }
    /* 우측 상단 컨트롤 버튼 그룹 (볼륨 + 일시정지) */
    .hud-controls-right {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }
    .hud-btn {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #38bdf8;
      border-radius: 8px;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #38bdf8;
      padding: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      transition: transform 0.1s, background-color 0.1s;
    }
    .hud-btn:active {
      transform: scale(0.92);
      background: rgba(30, 41, 59, 0.95);
    }
    /* 일시정지 오버레이 */
    #pause-overlay {
      position: absolute;
      inset: 0;
      z-index: 45;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(5, 7, 13, 0.7);
      backdrop-filter: blur(4px);
    }
    #pause-overlay .pause-text {
      font-family: "Press Start 2P", monospace;
      font-size: clamp(28px, 7vw, 48px);
      color: #facc15;
      text-shadow: 4px 4px 0 #854d0e, 0 0 25px rgba(250, 204, 21, 0.8);
      letter-spacing: 4px;
      animation: pulseTitle 0.9s infinite alternate;
      margin-bottom: 20px;
    }
    #pause-overlay .pause-hint {
      font-family: "Press Start 2P", monospace;
      font-size: clamp(10px, 2.8vw, 13px);
      color: #94a3b8;
    }
    /* Continue & Game Over Modal */
    #retro-overlay {
      position: absolute;
      inset: 0;
      background: rgba(5, 7, 13, 0.85);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      backdrop-filter: blur(4px);
    }
    .overlay-title {
      font-family: "Press Start 2P", monospace;
      font-size: clamp(20px, 6vw, 44px);
      letter-spacing: clamp(1px, 0.5vw, 4px);
      text-align: center;
      margin-bottom: 24px;
      padding: 0 16px;
      animation: pulseTitle 0.8s infinite alternate;
    }
    .continue-text {
      color: #38bdf8;
      text-shadow: 4px 4px 0 #0369a1, 0 0 20px rgba(56, 189, 248, 0.8);
    }
    .gameover-text {
      color: #ef4444;
      text-shadow: 4px 4px 0 #991b1b, 0 0 25px rgba(239, 68, 68, 0.8);
    }
    .countdown-number {
      font-family: "Press Start 2P", monospace;
      font-size: clamp(48px, 14vw, 80px);
      color: #facc15;
      text-shadow: 6px 6px 0 #854d0e, 0 0 25px rgba(250, 204, 21, 0.9);
      margin-bottom: 28px;
    }
    .final-score-box {
      font-family: "Press Start 2P", monospace;
      margin: 12px 0 20px 0;
      text-align: center;
      display: none;
      flex-direction: column;
      gap: 8px;
    }
    .final-score-label {
      font-size: clamp(10px, 3vw, 13px);
      color: #94a3b8;
      letter-spacing: 2px;
    }
    .final-score-val {
      font-size: clamp(20px, 6vw, 32px);
      color: #facc15;
      text-shadow: 2px 2px 0 #854d0e, 0 0 15px rgba(250, 204, 21, 0.7);
      letter-spacing: 2px;
    }
    .continue-btn {
      font-family: "Press Start 2P", monospace;
      font-size: 14px;
      background: #facc15;
      color: #1e1b4b;
      padding: 14px 28px;
      border: 4px solid #fef08a;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 6px 0 #854d0e;
      transition: transform 0.1s;
    }
    .continue-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #854d0e;
    }
    .back-title-btn {
      font-family: "Press Start 2P", monospace;
      font-size: clamp(10px, 2.8vw, 13px);
      background: rgba(30, 41, 59, 0.95);
      color: #38bdf8;
      border: 2px solid #38bdf8;
      border-radius: 8px;
      padding: 12px 20px;
      margin-top: 14px;
      cursor: pointer;
      box-shadow: 0 4px 0 #0369a1;
      display: none;
      transition: transform 0.1s, background-color 0.1s;
    }
    .back-title-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #0369a1;
      background: #0f172a;
    }

    /* 30만점 달성 축하 승리 오버레이 모달 */
    #victory-overlay {
      position: absolute;
      inset: 0;
      z-index: 60;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, rgba(15, 23, 42, 0.78) 0%, rgba(5, 7, 13, 0.94) 100%);
      backdrop-filter: blur(6px);
      padding: 20px;
      animation: victoryFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes victoryFadeIn {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }
    .congrat-title {
      font-family: "Bangers", "Press Start 2P", cursive;
      font-size: clamp(26px, 6.2vw, 56px);
      color: #facc15;
      text-align: center;
      letter-spacing: clamp(1px, 0.4vw, 3px);
      line-height: 1.1;
      padding: 0 12px;
      max-width: 90%;
      -webkit-text-stroke: 2px #78350f;
      text-shadow:
        3px 3px 0 #b45309,
        6px 6px 0 rgba(0, 0, 0, 0.6),
        0 0 28px rgba(250, 204, 21, 0.8);
      animation: victoryPulse 1s infinite alternate;
      margin-bottom: 20px;
    }
    @keyframes victoryPulse {
      0% { transform: scale(1) rotate(-1.5deg); }
      100% { transform: scale(1.04) rotate(1.5deg); filter: brightness(1.2); }
    }
    .congrat-msg {
      font-family: "Press Start 2P", -apple-system, sans-serif;
      font-size: clamp(12px, 3.2vw, 18px);
      color: #f8fafc;
      text-align: center;
      line-height: 1.8;
      text-shadow: 2px 2px 0 #0f172a, 0 0 16px rgba(56, 189, 248, 0.7);
      margin-bottom: 26px;
      padding: 0 12px;
      word-break: keep-all;
    }
    .congrat-msg .highlight {
      color: #38bdf8;
      font-weight: bold;
    }
    .score-badge {
      background: rgba(15, 23, 42, 0.85);
      border: 3px solid #facc15;
      border-radius: 14px;
      padding: 14px 28px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6), 0 0 20px rgba(250, 204, 21, 0.3);
      margin-bottom: 28px;
      animation: floatBadge 2.5s ease-in-out infinite;
    }
    @keyframes floatBadge {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .score-badge .label {
      font-family: "Press Start 2P", monospace;
      font-size: clamp(9px, 2.5vw, 12px);
      color: #94a3b8;
      margin-bottom: 6px;
      letter-spacing: 2px;
    }
    .score-badge .score-number {
      font-family: "Press Start 2P", monospace;
      font-size: clamp(22px, 5.5vw, 36px);
      color: #facc15;
      text-shadow: 3px 3px 0 #854d0e;
      letter-spacing: 2px;
    }
    .victory-btn {
      font-family: "Press Start 2P", monospace;
      font-size: clamp(11px, 2.8vw, 14px);
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
      color: #031427;
      padding: 14px 30px;
      border: 3px solid #bae6fd;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 6px 0 #0369a1, 0 10px 25px rgba(2, 132, 199, 0.4);
      transition: transform 0.1s;
    }
    .victory-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #0369a1;
    }
    .continue-info {
      font-family: "Press Start 2P", monospace;
      font-size: 10px;
      color: #94a3b8;
      margin-top: 18px;
    }
    @keyframes pulseTitle {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); }
    }
    /* Title Screen */
    #title-screen {
      position: absolute;
      inset: 0;
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(5, 7, 13, 0.35);
      cursor: pointer;
    }
    #title-screen .game-title {
      font-family: "Bangers", "Press Start 2P", cursive;
      font-size: 120px;
      letter-spacing: 6px;
      color: #facc15;
      -webkit-text-stroke: 4px #7c2d12;
      text-shadow:
        6px 6px 0 #991b1b,
        12px 12px 0 rgba(0,0,0,0.5),
        0 0 40px rgba(250, 204, 21, 0.6);
      transform: rotate(-3deg);
      margin-bottom: 60px;
      text-align: center;
      line-height: 1.1;
    }
    #title-screen .push-start {
      font-family: "Press Start 2P", monospace;
      font-size: 26px;
      letter-spacing: 3px;
      color: #f8fafc;
      text-shadow: 3px 3px 0 #0369a1, 0 0 18px rgba(56, 189, 248, 0.7);
      animation: blinkStart 1s steps(1) infinite;
    }
    @keyframes blinkStart {
      0%, 50% { opacity: 1; }
      50.01%, 100% { opacity: 0; }
    }
    .controls {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 20, 0.82);
      backdrop-filter: blur(8px);
      padding: 8px 18px;
      border-radius: 20px;
      border: 1px solid rgba(134, 239, 172, 0.2);
      display: flex;
      gap: 16px;
      font-size: 12px;
      color: #cbd5e1;
      z-index: 10;
      align-items: center;
    }
    .controls label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .controls input[type="range"] {
      width: 90px;
      accent-color: #4ade80;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="hud">
      <!-- 왼쪽 상단 1P 잔기 + 바로 아래 BOMB 아이콘 컴팩트 배치 -->
      <div class="hud-left">
        <div class="hud-lives" id="hud-lives" title="잔여 기체 (LIVES)">
          <span style="color: #60a5fa; margin-right: 2px;">1P</span>
          <svg id="life-icon-1" viewBox="0 0 32 32">
            <!-- 비행기 미니멀 아이콘 -->
            <path d="M16 2 L28 26 L16 20 L4 26 Z" fill="#f8fafc" stroke="#3b82f6" stroke-width="2"/>
            <ellipse cx="16" cy="14" rx="3" ry="5" fill="#0284c7"/>
          </svg>
          <svg id="life-icon-2" viewBox="0 0 32 32">
            <path d="M16 2 L28 26 L16 20 L4 26 Z" fill="#f8fafc" stroke="#3b82f6" stroke-width="2"/>
            <ellipse cx="16" cy="14" rx="3" ry="5" fill="#0284c7"/>
          </svg>
        </div>

        <!-- 잔기 바로 아래 BOMB 아이콘 (빨간 테두리 박스 없음) -->
        <div class="hud-bombs" id="bombBtn" title="클릭시 전탄 소멸 및 전체 폭발!">
          <span class="bomb-label">BOMB</span>
          <!-- 레트로 폭탄 SVG 1 -->
          <svg id="bomb-icon-1" viewBox="0 0 32 32">
            <path d="M22 4 Q25 1 27 3 Q29 5 26 8" stroke="#f59e0b" stroke-width="2" fill="none"/>
            <circle cx="28" cy="2" r="2.5" fill="#ef4444"/>
            <rect x="18" y="7" width="5" height="4" fill="#64748b" rx="1"/>
            <circle cx="15" cy="19" r="10.5" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
            <ellipse cx="12" cy="16" rx="2.5" ry="3.5" fill="rgba(255, 255, 255, 0.45)" transform="rotate(-30 12 16)"/>
          </svg>
          <!-- 레트로 폭탄 SVG 2 -->
          <svg id="bomb-icon-2" viewBox="0 0 32 32">
            <path d="M22 4 Q25 1 27 3 Q29 5 26 8" stroke="#f59e0b" stroke-width="2" fill="none"/>
            <circle cx="28" cy="2" r="2.5" fill="#ef4444"/>
            <rect x="18" y="7" width="5" height="4" fill="#64748b" rx="1"/>
            <circle cx="15" cy="19" r="10.5" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
            <ellipse cx="12" cy="16" rx="2.5" ry="3.5" fill="rgba(255, 255, 255, 0.45)" transform="rotate(-30 12 16)"/>
          </svg>
        </div>
      </div>

      <!-- 상단 가운데 레트로 옐로우 SCORE 점수판 (9자리: 000000000) -->
      <div class="hud-score">
        <span class="label">SCORE</span>
        <span class="digits" id="score-val">000000000</span>
      </div>

      <!-- 우측 상단 상태 정보: FPS & Rapid 배율 표시 + 사운드 토글 버튼 -->
      <div class="hud-status" style="display: flex; align-items: center; gap: 12px; pointer-events: auto;">
        <div>
          <div id="fps-counter" style="color: #86efac;">FPS: 60</div>
          <div id="rapid-display" style="color: #38bdf8; margin-top: 4px; font-weight: bold;">Rapid: +0%</div>
        </div>
        <button id="soundToggleBtn" title="사운드 On/Off" style="background: rgba(15, 23, 42, 0.85); border: 1px solid #38bdf8; border-radius: 8px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #38bdf8; padding: 0; box-shadow: 0 2px 8px rgba(0,0,0,0.5);">
          <!-- 스피커 On 아이콘 SVG -->
          <svg id="soundOnIcon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <!-- 스피커 Off 아이콘 SVG (초기 숨김) -->
          <svg id="soundOffIcon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>
      </div>
    </div>


    <!-- 오락실 CONTINUE & GAMEOVER 오버레이 -->
    <div id="retro-overlay">
      <div id="overlay-title" class="overlay-title continue-text">CONTINUE?</div>
      <div id="countdown-display" class="countdown-number">10</div>
      <!-- 게임오버 시 노출되는 최종 점수 박스 -->
      <div id="finalScoreBox" class="final-score-box">
        <span class="final-score-label">FINAL SCORE</span>
        <span id="finalScoreVal" class="final-score-val">000000000</span>
      </div>
      <button id="continueBtn" class="continue-btn">PRESS START</button>
      <button id="backTitleBtn" class="back-title-btn">GO TITLE</button>
      <div id="continue-info" class="continue-info">CREDIT(S) REMAINING: 2</div>
    </div>

    <!-- 30만점 달성 축하 승리 오버레이 모달 -->
    <div id="victory-overlay">
      <div class="congrat-title">Congraturation!</div>
      <div class="congrat-msg">
        당신의 노력으로 <span class="highlight">뭔가를 구했습니다!</span>
      </div>
      <div class="score-badge">
        <div class="label">MISSION CLEAR SCORE</div>
        <div id="victoryScoreVal" class="score-number">000300000</div>
      </div>
      <button id="victoryTitleBtn" class="victory-btn">BACK TO THE TITLE</button>
    </div>

    <canvas id="gameCanvas" width="800" height="1200"></canvas>

    <!-- 타이틀 화면 (배경만 흐르고, 주인공/적 없음) -->
    <div id="title-screen">
      <div class="game-title">AIR<br>FIGHT</div>
      <div class="push-start">PUSH START</div>
    </div>

    <div class="controls" id="controlsPanel" style="display:none;">
      <label>
        비행 속도: <input type="range" id="speedSlider" min="1" max="20" value="14">
        <span id="speedVal">14px</span>
      </label>
      <label>
        <input type="checkbox" id="shadowToggle" checked> 비행기 상공 그림자
      </label>
    </div>

    <!-- 좌측 최상단 숨겨진 터치 영역 (5회 클릭 시 설정 패널 토글) -->
    <div id="secretTapZone" style="position:absolute; top:0; left:0; width:80px; height:80px; z-index:30; cursor:default;"></div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const WIDTH = 800;
    const HEIGHT = 1200;

    let baseSpeed = 14;
    const speedSlider = document.getElementById('speedSlider');
    const speedVal = document.getElementById('speedVal');
    const shadowToggle = document.getElementById('shadowToggle');
    const fpsCounter = document.getElementById('fps-counter');
    const controlsPanel = document.getElementById('controlsPanel');
    const secretTapZone = document.getElementById('secretTapZone');

    let secretTapCount = 0;
    let gameStarted = false; // 타이틀 화면(PUSH START) 통과 여부 - 게임 로직 전반에서 참조
    let secretTapTimer = null;
    secretTapZone.addEventListener('click', () => {
      secretTapCount++;
      clearTimeout(secretTapTimer);
      secretTapTimer = setTimeout(() => { secretTapCount = 0; }, 1500);
      if (secretTapCount >= 5) {
        secretTapCount = 0;
        controlsPanel.style.display = (controlsPanel.style.display === 'none') ? 'flex' : 'none';
      }
    });

    speedSlider.addEventListener('input', (e) => {
      baseSpeed = parseInt(e.target.value, 10);
      speedVal.innerText = `${baseSpeed}px`;
    });

    // -------------------------------------------------------------
    // 지형 & 건물 절차적 텍스처 생성 (3대 멀티 바이옴: 800x1200 x 3 = 3600px 거대 순환 전장)
    // -------------------------------------------------------------
    // 유틸: 시드 기반 난수
    const seedRandom = (seed) => {
      let x = Math.sin(seed) * 10000;
      return x - Math.floor(x);
    };

    // 지면 풀숲/덤불 군락 렌더링 공통 함수
    function drawFoliageClusterOn(tCtx, cx, cy, count, radius, startSeed = 10) {
      let s = startSeed;
      for (let j = 0; j < count; j++) {
        const fx = cx + (seedRandom(s++) - 0.5) * radius * 1.6;
        const fy = cy + (seedRandom(s++) - 0.5) * radius * 1.6;
        const fr = 12 + seedRandom(s++) * 18;

        // 수풀 바닥 그림자 (지면 밀착)
        tCtx.fillStyle = 'rgba(0, 0, 0, 0.35)';
        tCtx.beginPath();
        tCtx.arc(fx + 4, fy + 8, fr * 0.95, 0, Math.PI * 2);
        tCtx.fill();

        // 수풀 본체 (원형 나무 캐노피)
        const treeGrad = tCtx.createRadialGradient(fx - 4, fy - 6, 2, fx, fy, fr);
        treeGrad.addColorStop(0, '#4d7c3d');
        treeGrad.addColorStop(0.7, '#2f4f24');
        treeGrad.addColorStop(1, '#1b3215');
        tCtx.fillStyle = treeGrad;
        tCtx.beginPath();
        tCtx.arc(fx, fy, fr, 0, Math.PI * 2);
        tCtx.fill();

        // 잎사귀 하이라이트 텍스처
        tCtx.fillStyle = 'rgba(134, 239, 172, 0.2)';
        tCtx.beginPath();
        tCtx.arc(fx - 3, fy - 4, fr * 0.45, 0, Math.PI * 2);
        tCtx.fill();
      }
    }

    // 포격 크레이터(폭격 구덩이) 공통 함수
    function drawCraterOn(tCtx, cx, cy, r) {
      // 그을음 및 그림자
      tCtx.fillStyle = 'rgba(15, 12, 10, 0.7)';
      tCtx.beginPath();
      tCtx.arc(cx, cy, r, 0, Math.PI * 2);
      tCtx.fill();

      // 타버린 내부 그라데이션
      const cGrad = tCtx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, 2, cx, cy, r);
      cGrad.addColorStop(0, '#1c1917');
      cGrad.addColorStop(0.6, '#292524');
      cGrad.addColorStop(1, '#44403c');
      tCtx.fillStyle = cGrad;
      tCtx.beginPath();
      tCtx.arc(cx, cy, r * 0.82, 0, Math.PI * 2);
      tCtx.fill();

      // 가장자리 흙 융기 림 (Rim)
      tCtx.strokeStyle = 'rgba(120, 113, 108, 0.6)';
      tCtx.lineWidth = 3;
      tCtx.stroke();
    }

    // 군용 주차 트럭/차량 공통 함수
    function drawMilitaryTruckOn(tCtx, x, y, angle = 0, color = '#3f4f38') {
      tCtx.save();
      tCtx.translate(x, y);
      tCtx.rotate(angle);

      // 그림자
      tCtx.fillStyle = 'rgba(0, 0, 0, 0.45)';
      tCtx.fillRect(-10 + 6, -18 + 8, 20, 36);

      // 차체 본체
      tCtx.fillStyle = color;
      tCtx.fillRect(-10, -18, 20, 36);

      // 운전석 캐빈
      tCtx.fillStyle = '#1e293b';
      tCtx.fillRect(-9, -17, 18, 12);
      // 앞유리창
      tCtx.fillStyle = '#93c5fd';
      tCtx.fillRect(-7, -15, 14, 5);

      // 짐칸 (화물 천막 커버)
      tCtx.fillStyle = '#4a5942';
      tCtx.fillRect(-9, -3, 18, 19);
      tCtx.strokeStyle = '#273422';
      tCtx.lineWidth = 1.5;
      tCtx.strokeRect(-9, -3, 18, 19);

      // 바퀴 4개
      tCtx.fillStyle = '#0f172a';
      tCtx.fillRect(-13, -14, 3, 7);
      tCtx.fillRect(10, -14, 3, 7);
      tCtx.fillRect(-13, 7, 3, 7);
      tCtx.fillRect(10, 7, 3, 7);

      tCtx.restore();
    }

    // 대공포 진지 공통 함수
    function drawDefenseBunkerOn(tCtx, bx, by) {
      tCtx.fillStyle = 'rgba(0, 0, 0, 0.4)';
      tCtx.beginPath();
      tCtx.arc(bx + 8, by + 10, 24, 0, Math.PI * 2);
      tCtx.fill();

      tCtx.fillStyle = '#5c4d38';
      tCtx.beginPath();
      tCtx.arc(bx, by, 22, 0, Math.PI * 2);
      tCtx.fill();

      tCtx.fillStyle = '#1e293b';
      tCtx.beginPath();
      tCtx.arc(bx, by, 14, 0, Math.PI * 2);
      tCtx.fill();

      tCtx.strokeStyle = '#94a3b8';
      tCtx.lineWidth = 3;
      tCtx.beginPath();
      tCtx.moveTo(bx - 3, by); tCtx.lineTo(bx - 3, by - 24);
      tCtx.moveTo(bx + 3, by); tCtx.lineTo(bx + 3, by - 24);
      tCtx.stroke();
    }

    // -------------------------------------------------------------
    // 바이옴 1: 군사 전초기지 & 사령부 (Military Airbase HQ)
    // -------------------------------------------------------------
    function createGroundTerrainTexture1() {
      const offscreen = document.createElement('canvas');
      offscreen.width = WIDTH;
      offscreen.height = HEIGHT;
      const tCtx = offscreen.getContext('2d');

      // 기본 지면 (야전 잔디/대지)
      const groundGrad = tCtx.createLinearGradient(0, 0, 0, HEIGHT);
      groundGrad.addColorStop(0, '#2d3b2a');
      groundGrad.addColorStop(0.5, '#354531');
      groundGrad.addColorStop(1, '#2d3b2a');
      tCtx.fillStyle = groundGrad;
      tCtx.fillRect(0, 0, WIDTH, HEIGHT);

      // 잔디/흙 지형 패치
      let s = 42;
      for (let i = 0; i < 90; i++) {
        const px = seedRandom(s++) * WIDTH;
        const py = seedRandom(s++) * HEIGHT;
        const pr = 30 + seedRandom(s++) * 70;
        const isDirt = seedRandom(s++) > 0.6;
        tCtx.fillStyle = isDirt ? 'rgba(74, 62, 44, 0.28)' : 'rgba(38, 54, 34, 0.35)';
        tCtx.beginPath();
        tCtx.arc(px, py, pr, 0, Math.PI * 2);
        tCtx.fill();
      }

      // 메인 흙길 도로
      tCtx.strokeStyle = 'rgba(92, 77, 56, 0.65)';
      tCtx.lineWidth = 42;
      tCtx.beginPath();
      tCtx.moveTo(280, 0);
      tCtx.bezierCurveTo(340, 400, 240, 800, 310, HEIGHT);
      tCtx.stroke();

      // 바퀴 자국
      tCtx.strokeStyle = 'rgba(56, 46, 33, 0.4)';
      tCtx.lineWidth = 3;
      tCtx.beginPath();
      tCtx.moveTo(270, 0);
      tCtx.bezierCurveTo(330, 400, 230, 800, 300, HEIGHT);
      tCtx.moveTo(290, 0);
      tCtx.bezierCurveTo(350, 400, 250, 800, 320, HEIGHT);
      tCtx.stroke();

      // 지선 콘크리트 도로망
      tCtx.strokeStyle = '#475569';
      tCtx.lineWidth = 26;
      tCtx.beginPath();
      tCtx.moveTo(290, 240); tCtx.lineTo(600, 240);
      tCtx.moveTo(280, 720); tCtx.lineTo(120, 720);
      tCtx.moveTo(310, 1050); tCtx.lineTo(580, 1050);
      tCtx.stroke();

      tCtx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
      tCtx.lineWidth = 1.5;
      tCtx.beginPath();
      tCtx.moveTo(290, 227); tCtx.lineTo(600, 227);
      tCtx.moveTo(290, 253); tCtx.lineTo(600, 253);
      tCtx.stroke();

      // 수풀 군락
      const bushSpots = [
        [100, 100], [180, 130], [80, 360], [700, 80], [720, 480],
        [140, 920], [680, 860], [440, 520], [80, 1120], [450, 1150]
      ];
      bushSpots.forEach(([bx, by]) => drawFoliageClusterOn(tCtx, bx, by, 7, 32, s++));

      // 보급 창고 단지
      function drawWarehouse(wx, wy, w, h, roofColor) {
        tCtx.fillStyle = 'rgba(0, 0, 0, 0.48)';
        tCtx.fillRect(wx + 16, wy + 18, w + 10, h + 12);

        tCtx.fillStyle = '#334155';
        tCtx.fillRect(wx - 4, wy - 4, w + 8, h + 8);

        tCtx.fillStyle = '#1e293b';
        tCtx.fillRect(wx, wy + h - 6, w, 14);

        tCtx.fillStyle = '#0f172a';
        tCtx.fillRect(wx + w * 0.2, wy + h - 4, w * 0.6, 12);
        tCtx.strokeStyle = '#64748b';
        tCtx.strokeRect(wx + w * 0.2, wy + h - 4, w * 0.6, 12);

        const roofGrad = tCtx.createLinearGradient(wx, wy, wx, wy + h);
        roofGrad.addColorStop(0, roofColor);
        roofGrad.addColorStop(1, '#1e293b');
        tCtx.fillStyle = roofGrad;
        tCtx.fillRect(wx, wy, w, h);
        tCtx.strokeStyle = '#475569';
        tCtx.lineWidth = 1.5;
        tCtx.strokeRect(wx, wy, w, h);

        tCtx.strokeStyle = 'rgba(0, 0, 0, 0.25)';
        tCtx.lineWidth = 2;
        for (let x = wx + 12; x < wx + w; x += 14) {
          tCtx.beginPath();
          tCtx.moveTo(x, wy);
          tCtx.lineTo(x, wy + h);
          tCtx.stroke();
        }

        tCtx.fillStyle = '#090d16';
        tCtx.fillRect(wx + w * 0.35, wy + h * 0.4, w * 0.3, 10);
      }

      drawWarehouse(520, 160, 170, 110, '#475569');
      drawWarehouse(540, 310, 140, 95, '#3b4252');

      // 전초 사령부 군사 기지 본관
      function drawBaseHeadquarters(hx, hy, size) {
        const shadowOffset = 22;
        tCtx.fillStyle = 'rgba(0, 0, 0, 0.52)';
        tCtx.fillRect(hx + shadowOffset, hy + shadowOffset, size + 10, size + 10);

        tCtx.fillStyle = '#1e293b';
        tCtx.fillRect(hx - 12, hy - 12, size + 24, size + 24);

        tCtx.strokeStyle = '#475569';
        tCtx.lineWidth = 4;
        tCtx.strokeRect(hx - 10, hy - 10, size + 20, size + 20);

        const bGrad = tCtx.createLinearGradient(hx, hy, hx, hy + size);
        bGrad.addColorStop(0, '#47523d');
        bGrad.addColorStop(1, '#2c3326');
        tCtx.fillStyle = bGrad;
        tCtx.fillRect(hx, hy, size, size);
        tCtx.strokeStyle = '#5c6b4e';
        tCtx.lineWidth = 2;
        tCtx.strokeRect(hx, hy, size, size);

        const innerSize = size * 0.52;
        const ix = hx + (size - innerSize) / 2;
        const iy = hy + (size - innerSize) / 2;
        tCtx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        tCtx.fillRect(ix + 6, iy + 8, innerSize, innerSize);

        tCtx.fillStyle = '#1f2937';
        tCtx.fillRect(ix, iy, innerSize, innerSize);
        tCtx.strokeStyle = '#60a5fa';
        tCtx.lineWidth = 1.5;
        tCtx.strokeRect(ix, iy, innerSize, innerSize);

        const cx = hx + size / 2;
        const cy = hy + size / 2;
        tCtx.fillStyle = '#0f172a';
        tCtx.beginPath();
        tCtx.arc(cx, cy, 14, 0, Math.PI * 2);
        tCtx.fill();

        tCtx.strokeStyle = '#93c5fd';
        tCtx.lineWidth = 3;
        tCtx.beginPath();
        tCtx.arc(cx, cy, 10, -Math.PI * 0.3, Math.PI * 0.7);
        tCtx.stroke();

        tCtx.fillStyle = '#ef4444';
        tCtx.beginPath();
        tCtx.arc(cx, cy, 3.5, 0, Math.PI * 2);
        tCtx.fill();
      }

      drawBaseHeadquarters(70, 640, 160);

      // 헬리패드
      function drawHeliport(cx, cy, radius) {
        tCtx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        tCtx.fillRect(cx - radius * 1.25 + 10, cy - radius * 1.25 + 12, radius * 2.5, radius * 2.5);

        tCtx.fillStyle = '#334155';
        tCtx.fillRect(cx - radius * 1.25, cy - radius * 1.25, radius * 2.5, radius * 2.5);
        tCtx.strokeStyle = '#475569';
        tCtx.lineWidth = 2;
        tCtx.strokeRect(cx - radius * 1.25, cy - radius * 1.25, radius * 2.5, radius * 2.5);

        tCtx.strokeStyle = '#facc15';
        tCtx.lineWidth = 3;
        tCtx.beginPath();
        tCtx.arc(cx, cy, radius, 0, Math.PI * 2);
        tCtx.stroke();

        tCtx.fillStyle = '#facc15';
        tCtx.font = `bold ${Math.floor(radius * 1.15)}px sans-serif`;
        tCtx.textAlign = 'center';
        tCtx.textBaseline = 'middle';
        tCtx.fillText('H', cx, cy);

        tCtx.fillStyle = '#4ade80';
        [[-1, 0], [1, 0], [0, -1], [0, 1]].forEach(([dx, dy]) => {
          tCtx.beginPath();
          tCtx.arc(cx + dx * radius, cy + dy * radius, 3, 0, Math.PI * 2);
          tCtx.fill();
        });
      }

      drawHeliport(150, 480, 36);

      // 유류 탱크 단지
      function drawFuelTanks(baseX, baseY) {
        const tanks = [
          { x: baseX, y: baseY, r: 38 },
          { x: baseX + 80, y: baseY + 15, r: 34 },
          { x: baseX + 40, y: baseY + 80, r: 36 }
        ];

        tanks.forEach(tank => {
          tCtx.fillStyle = 'rgba(0, 0, 0, 0.5)';
          tCtx.beginPath();
          tCtx.arc(tank.x + 14, tank.y + 16, tank.r, 0, Math.PI * 2);
          tCtx.fill();

          const tGrad = tCtx.createRadialGradient(tank.x - 8, tank.y - 12, 4, tank.x, tank.y, tank.r);
          tGrad.addColorStop(0, '#94a3b8');
          tGrad.addColorStop(0.7, '#475569');
          tGrad.addColorStop(1, '#1e293b');
          tCtx.fillStyle = tGrad;
          tCtx.beginPath();
          tCtx.arc(tank.x, tank.y, tank.r, 0, Math.PI * 2);
          tCtx.fill();

          tCtx.strokeStyle = '#cbd5e1';
          tCtx.lineWidth = 1.5;
          tCtx.stroke();

          tCtx.strokeStyle = '#0f172a';
          tCtx.lineWidth = 3;
          tCtx.beginPath();
          tCtx.moveTo(tank.x - tank.r + 4, tank.y);
          tCtx.lineTo(tank.x + tank.r - 4, tank.y);
          tCtx.stroke();

          tCtx.fillStyle = '#ef4444';
          tCtx.beginPath();
          tCtx.arc(tank.x, tank.y, 4, 0, Math.PI * 2);
          tCtx.fill();
        });

        tCtx.strokeStyle = '#ca8a04';
        tCtx.lineWidth = 2.5;
        tCtx.strokeRect(baseX - 48, baseY - 48, 185, 175);
      }

      drawFuelTanks(530, 930);

      // 대공포 진지
      drawDefenseBunkerOn(tCtx, 450, 430);
      drawDefenseBunkerOn(tCtx, 210, 1020);

      // 군용 트럭 배치
      drawMilitaryTruckOn(tCtx, 490, 240, 0);
      drawMilitaryTruckOn(tCtx, 520, 255, 0.1);
      drawMilitaryTruckOn(tCtx, 160, 720, Math.PI / 2);

      // 포격 크레이터 흔적
      drawCraterOn(tCtx, 370, 120, 18);
      drawCraterOn(tCtx, 410, 140, 12);
      drawCraterOn(tCtx, 680, 680, 22);

      return offscreen;
    }

    // -------------------------------------------------------------
    // 바이옴 2: 대형 비행장 활주로 & 격납고 단지 (Airstrip & Taxiway)
    // -------------------------------------------------------------
    function createGroundTerrainTexture2() {
      const offscreen = document.createElement('canvas');
      offscreen.width = WIDTH;
      offscreen.height = HEIGHT;
      const tCtx = offscreen.getContext('2d');

      // 잔디 지면
      const groundGrad = tCtx.createLinearGradient(0, 0, 0, HEIGHT);
      groundGrad.addColorStop(0, '#2d3b2a');
      groundGrad.addColorStop(0.5, '#32402e');
      groundGrad.addColorStop(1, '#2a3827');
      tCtx.fillStyle = groundGrad;
      tCtx.fillRect(0, 0, WIDTH, HEIGHT);

      // 지면 패치
      let s = 105;
      for (let i = 0; i < 70; i++) {
        const px = seedRandom(s++) * WIDTH;
        const py = seedRandom(s++) * HEIGHT;
        const pr = 25 + seedRandom(s++) * 60;
        tCtx.fillStyle = seedRandom(s++) > 0.5 ? 'rgba(68, 56, 38, 0.25)' : 'rgba(34, 48, 30, 0.32)';
        tCtx.beginPath();
        tCtx.arc(px, py, pr, 0, Math.PI * 2);
        tCtx.fill();
      }

      // 메인 군용 활주로 (Runway - 폭 170px의 아스팔트/콘크리트 직선로)
      const rwX = 260;
      const rwW = 180;

      // 활주로 기초 섀도우
      tCtx.fillStyle = 'rgba(0, 0, 0, 0.4)';
      tCtx.fillRect(rwX + 6, 0, rwW, HEIGHT);

      // 활주로 메인 아스팔트
      const rwGrad = tCtx.createLinearGradient(rwX, 0, rwX + rwW, 0);
      rwGrad.addColorStop(0, '#334155');
      rwGrad.addColorStop(0.15, '#1e293b');
      rwGrad.addColorStop(0.85, '#1e293b');
      rwGrad.addColorStop(1, '#334155');
      tCtx.fillStyle = rwGrad;
      tCtx.fillRect(rwX, 0, rwW, HEIGHT);

      // 활주로 외곽 백색 경계선

      tCtx.lineWidth = 4;
      tCtx.beginPath();
      tCtx.moveTo(rwX + 8, 0); tCtx.lineTo(rwX + 8, HEIGHT);

      tCtx.strokeStyle = '#facc15';
      tCtx.lineWidth = 5;
      tCtx.setLineDash([40, 30]);
      tCtx.beginPath();
      tCtx.moveTo(rwX + rwW / 2, 0);
      tCtx.lineTo(rwX + rwW / 2, HEIGHT);

      tCtx.setLineDash([]); // 대시 해제

      // 착륙 구역 피아노 건반 마킹 (Threshold Stripes)
      tCtx.fillStyle = '#f8fafc';

      tCtx.fillText('09L', rwX + rwW / 2, 130);

      // 보조 유도로 (Taxiway - 우측 주기장 연결)
      tCtx.fillStyle = '#334155';
      tCtx.fillRect(rwX + rwW, 420, 240, 80);
      tCtx.fillRect(rwX + rwW, 850, 240, 80);

      // 유도로 황색 중심 유도선
      tCtx.strokeStyle = '#eab308';
      tCtx.lineWidth = 3;
      tCtx.beginPath();
      tCtx.moveTo(rwX + rwW, 460); tCtx.lineTo(rwX + rwW + 240, 460);
      tCtx.moveTo(rwX + rwW, 890); tCtx.lineTo(rwX + rwW + 240, 890);
      tCtx.stroke();

      // 우측 대형 주기장 에이프런 (Aircraft Parking Apron)
      tCtx.fillStyle = 'rgba(0, 0, 0, 0.45)';
      tCtx.fillRect(520 + 8, 260 + 10, 250, 680);
      tCtx.fillStyle = '#1e293b';
      tCtx.fillRect(520, 260, 250, 680);
      tCtx.strokeStyle = '#475569';
      tCtx.lineWidth = 3;
      tCtx.strokeRect(520, 260, 250, 680);

      // 에이프런 타일 그리드
      tCtx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
      tCtx.lineWidth = 1.5;
      for (let y = 320; y < 940; y += 60) {
        tCtx.beginPath();
        tCtx.moveTo(520, y); tCtx.lineTo(770, y);
        tCtx.stroke();
      }

      // 주기된 지원 전투기 실루엣 2대
      function drawParkedJet(jx, jy) {
        tCtx.fillStyle = 'rgba(0, 0, 0, 0.5)';
        tCtx.beginPath();
        tCtx.moveTo(jx + 6, jy - 20 + 8);
        tCtx.lineTo(jx + 24 + 6, jy + 20 + 8);
        tCtx.lineTo(jx + 6, jy + 12 + 8);
        tCtx.lineTo(jx - 24 + 6, jy + 20 + 8);
        tCtx.closePath();
        tCtx.fill();

        tCtx.fillStyle = '#64748b';
        tCtx.beginPath();
        tCtx.moveTo(jx, jy - 20);
        tCtx.lineTo(jx + 24, jy + 20);
        tCtx.lineTo(jx, jy + 12);
        tCtx.lineTo(jx - 24, jy + 20);
        tCtx.closePath();
        tCtx.fill();
        tCtx.strokeStyle = '#94a3b8';
        tCtx.lineWidth = 1.5;
        tCtx.stroke();
      }

      drawParkedJet(620, 360);

    // -------------------------------------------------------------
    // 바이옴 3: 협곡 하천 & 철교 & 해안 요새 (River, Iron Bridge & Fortress)
    // -------------------------------------------------------------
    function createGroundTerrainTexture3() {
      const offscreen = document.createElement('canvas');
      offscreen.width = WIDTH;
      offscreen.height = HEIGHT;
      const tCtx = offscreen.getContext('2d');

      // 울창한 숲/암벽 지면
      const groundGrad = tCtx.createLinearGradient(0, 0, 0, HEIGHT);
      groundGrad.addColorStop(0, '#243322');
      groundGrad.addColorStop(0.5, '#2e3d29');
      groundGrad.addColorStop(1, '#223020');
      tCtx.fillStyle = groundGrad;
      tCtx.fillRect(0, 0, WIDTH, HEIGHT);

      // 암벽 지형 및 얼룩
      let s = 310;
      for (let i = 0; i < 80; i++) {
        const px = seedRandom(s++) * WIDTH;
        const py = seedRandom(s++) * HEIGHT;
        const pr = 20 + seedRandom(s++) * 55;
        tCtx.fillStyle = seedRandom(s++) > 0.4 ? 'rgba(40, 50, 36, 0.4)' : 'rgba(70, 60, 50, 0.3)';
        tCtx.beginPath();
        tCtx.arc(px, py, pr, 0, Math.PI * 2);
        tCtx.fill();
      }

      // 거대 협곡 강줄기 (화면 좌측 바깥에서 우측 바깥까지 시원하게 완전히 관통하는 거대 하천)
      tCtx.save();
      const riverPoints = [
        { x: -100, y: 520 },
        { cx1: 180, cy1: 580, cx2: 360, cy2: 440, x: 500, y: 470 },
        { cx1: 620, cy1: 500, cx2: 740, cy2: 430, x: WIDTH + 100, y: 460 }
      ];

      // A. 양쪽 흙/암벽 제방 및 수심 깊은 그림자 테두리 (너비 230px)
      tCtx.strokeStyle = 'rgba(15, 23, 42, 0.8)';
      tCtx.lineWidth = 220;
      tCtx.lineCap = 'round';
      tCtx.lineJoin = 'round';
      tCtx.beginPath();
      tCtx.moveTo(riverPoints[0].x, riverPoints[0].y);
      tCtx.bezierCurveTo(riverPoints[1].cx1, riverPoints[1].cy1, riverPoints[1].cx2, riverPoints[1].cy2, riverPoints[1].x, riverPoints[1].y);
      tCtx.bezierCurveTo(riverPoints[2].cx1, riverPoints[2].cy1, riverPoints[2].cx2, riverPoints[2].cy2, riverPoints[2].x, riverPoints[2].y);
      tCtx.stroke();

      // B. 황토/모래톱 강기슭 림 (너비 190px)
      tCtx.strokeStyle = '#334155';
      tCtx.lineWidth = 190;
      tCtx.beginPath();
      tCtx.moveTo(riverPoints[0].x, riverPoints[0].y);
      tCtx.bezierCurveTo(riverPoints[1].cx1, riverPoints[1].cy1, riverPoints[1].cx2, riverPoints[1].cy2, riverPoints[1].x, riverPoints[1].y);
      tCtx.bezierCurveTo(riverPoints[2].cx1, riverPoints[2].cy1, riverPoints[2].cx2, riverPoints[2].cy2, riverPoints[2].x, riverPoints[2].y);
      tCtx.stroke();

      // C. 강 수면 메인 그라데이션 (너비 160px: 에메랄드 딥블루)
      const waterGrad = tCtx.createLinearGradient(0, 380, 0, 620);
      waterGrad.addColorStop(0, '#0284c7');
      waterGrad.addColorStop(0.35, '#0369a1');
      waterGrad.addColorStop(0.7, '#075985');
      waterGrad.addColorStop(1, '#0c4a6e');
      tCtx.strokeStyle = waterGrad;
      tCtx.lineWidth = 160;
      tCtx.beginPath();
      tCtx.moveTo(riverPoints[0].x, riverPoints[0].y);
      tCtx.bezierCurveTo(riverPoints[1].cx1, riverPoints[1].cy1, riverPoints[1].cx2, riverPoints[1].cy2, riverPoints[1].x, riverPoints[1].y);
      tCtx.bezierCurveTo(riverPoints[2].cx1, riverPoints[2].cy1, riverPoints[2].cx2, riverPoints[2].cy2, riverPoints[2].x, riverPoints[2].y);
      tCtx.stroke();

      // D. 흐르는 물결 & 햇빛 반사 하이라이트
      tCtx.strokeStyle = 'rgba(255, 255, 255, 0.32)';
      tCtx.lineWidth = 3;
      for (let rx = -50; rx <= WIDTH + 50; rx += 55) {
        // 하천 중심 곡선 근처 y 좌표 추정
        const t = (rx + 50) / (WIDTH + 100);
        const ry = 510 - Math.sin(t * Math.PI * 1.5) * 50;
        tCtx.beginPath();
        tCtx.moveTo(rx - 22, ry + ((rx % 3) - 1) * 18);
        tCtx.lineTo(rx + 22, ry + ((rx % 3) - 1) * 18);
        tCtx.stroke();
      }
      tCtx.restore();

      // 강을 종단으로 가로지르는 군용 대형 철교 (Truss Iron Bridge)
      const brX = 380;
      const brW = 84;

      // 교각 수면 그림자
      tCtx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      tCtx.fillRect(brX + 16, 320, brW + 10, 340);

      // 도로/철교 상판
      tCtx.fillStyle = '#334155';
      tCtx.fillRect(brX, 0, brW, HEIGHT);

      // 아스팔트 차선
      tCtx.strokeStyle = '#e2e8f0';
      tCtx.lineWidth = 2;
      tCtx.setLineDash([20, 20]);
      tCtx.beginPath();
      tCtx.moveTo(brX + brW / 2, 0);
      tCtx.lineTo(brX + brW / 2, HEIGHT);
      tCtx.stroke();
      tCtx.setLineDash([]);

      // 강 위 철골 트러스 구조물 (X자 격자 철골 프레임)
      tCtx.strokeStyle = '#dc2626'; // 선명한 붉은색 군용 트러스
      tCtx.lineWidth = 4;
      tCtx.strokeRect(brX, 360, brW, 260);

      tCtx.lineWidth = 2.5;
      for (let y = 360; y < 620; y += 40) {
        tCtx.beginPath();
        tCtx.moveTo(brX, y); tCtx.lineTo(brX + brW, y + 40);
        tCtx.moveTo(brX + brW, y); tCtx.lineTo(brX, y + 40);
        tCtx.stroke();
      }

      // 교각 방호 포대 진지 (북단/남단 2개소)
      drawDefenseBunkerOn(tCtx, 280, 310);
      drawDefenseBunkerOn(tCtx, 490, 670);

      // 강 건너편 암벽 요새 벙커 (Hardened Concrete Bunker)
      function drawCliffBunker(bx, by) {
        tCtx.fillStyle = 'rgba(0, 0, 0, 0.55)';
        tCtx.fillRect(bx + 14, by + 16, 110, 80);

        tCtx.fillStyle = '#475569';
        tCtx.fillRect(bx, by, 110, 80);
        tCtx.strokeStyle = '#1e293b';
        tCtx.lineWidth = 3;
        tCtx.strokeRect(bx, by, 110, 80);

        // 총안구 (Embrasure 슬릿)
        tCtx.fillStyle = '#020617';
        tCtx.fillRect(bx + 20, by + 30, 70, 16);

        // 상단 관측 큐폴라
        tCtx.fillStyle = '#334155';
        tCtx.beginPath();
        tCtx.arc(bx + 55, by - 4, 18, Math.PI, 0);
        tCtx.fill();
        tCtx.strokeStyle = '#64748b';
        tCtx.stroke();
      }

      drawCliffBunker(120, 140);
      drawCliffBunker(580, 820);

      // 보급 트럭 통행
      drawMilitaryTruckOn(tCtx, brX + 22, 220, 0);
      drawMilitaryTruckOn(tCtx, brX + 60, 780, Math.PI);

      // 울창한 숲 군락 집중 배치
      drawFoliageClusterOn(tCtx, 100, 720, 9, 36, 401);
      drawFoliageClusterOn(tCtx, 680, 220, 9, 36, 402);
      drawFoliageClusterOn(tCtx, 220, 920, 8, 34, 403);
      drawFoliageClusterOn(tCtx, 720, 960, 7, 30, 404);

      // 강변 크레이터
      drawCraterOn(tCtx, 250, 420, 24);
      drawCraterOn(tCtx, 520, 580, 20);

      return offscreen;
    }

    // -------------------------------------------------------------
    // 3장의 개별 바이옴 텍스처 프리베이킹
    // -------------------------------------------------------------
    const groundTextures = [
      createGroundTerrainTexture1(),
      createGroundTerrainTexture2(),
      createGroundTerrainTexture3()
    ];
    const groundTexture = groundTextures[0]; // 하위 호환용 참조 유지

    // -------------------------------------------------------------
    // 무한 루프 멀티 세그먼트 스크롤 시스템
    // -------------------------------------------------------------
    const TOTAL_SEGMENTS = groundTextures.length; // 3구역 (총 3600px 길이 루프)
    const bgSegments = [
      { y: 0, texIdx: 0 },
      { y: -HEIGHT, texIdx: 1 }
    ];

    // 플레이어 전투기 상태
    let playerX = WIDTH / 2;
    let playerY = HEIGHT * 0.8;
    let targetX = playerX;
    let targetY = playerY;

    // 모바일 터치 상대 이동 (Relative Touch Delta) 변수
    let lastTouchX = null;
    let lastTouchY = null;

    function updatePointerPos(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      targetX = (clientX - rect.left) * scaleX;
      targetY = (clientY - rect.top) * scaleY;
    }

    // 데스크톱 마우스 조작
    canvas.addEventListener('mousemove', (e) => {
      updatePointerPos(e.clientX, e.clientY);
    });

    // 윈도우 전역 터치 조작 (게임 캔버스뿐만 아니라 하단 여백 화면 어디든 스와이프해도 기체 조작 & 2손가락 폭탄)
    window.addEventListener('touchstart', (e) => {
      // 컨티뉴 카운트다운 중이면 화면 아무 곳 터치 시 즉시 부활 처리
      if (isContinueState && credits > 0) {
        handleContinueAction();
        return;
      }
      // 손가락 2개 이상 터치 시 폭탄 즉시 발동
      if (e.touches.length >= 2) {
        triggerBomb();
        return;
      }
      if (e.touches.length === 1) {
        lastTouchX = e.touches[0].clientX;
        lastTouchY = e.touches[0].clientY;
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length >= 2) return;
      if (e.touches.length === 1 && lastTouchX !== null && lastTouchY !== null) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;

        const curX = e.touches[0].clientX;
        const curY = e.touches[0].clientY;
        const deltaX = (curX - lastTouchX) * scaleX;
        const deltaY = (curY - lastTouchY) * scaleY;

        lastTouchX = curX;
        lastTouchY = curY;

        if (Number.isFinite(deltaX) && Number.isFinite(deltaY)) {
          targetX += deltaX;
          targetY += deltaY;
        }

        // 경계 제한
        targetX = Math.max(40, Math.min(WIDTH - 40, targetX));
        targetY = Math.max(60, Math.min(HEIGHT - 40, targetY));
      }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      if (e.touches.length === 1) {
        lastTouchX = e.touches[0].clientX;
        lastTouchY = e.touches[0].clientY;
      } else if (e.touches.length === 0) {
        lastTouchX = null;
        lastTouchY = null;
      }
    }, { passive: true });

    window.addEventListener('touchcancel', () => {
      lastTouchX = null;
      lastTouchY = null;
    }, { passive: true });

    // PC 마우스 양쪽 버튼(좌클릭 + 우클릭) 동시 입력 시 폭탄 발동
    let mouseButtonsDown = 0;

    canvas.addEventListener('mousedown', (e) => {
      // e.buttons 비트마스크: 1(좌클릭) + 2(우클릭) = 3(동시 클릭)
      mouseButtonsDown = e.buttons;
      if ((mouseButtonsDown & 1) && (mouseButtonsDown & 2)) {
        triggerBomb();
      }
    });

    canvas.addEventListener('mouseup', (e) => {
      mouseButtonsDown = e.buttons;
    });

    // 우클릭 시 브라우저 기본 컨텍스트 메뉴 방지 (우클릭 게임 조작 보장)
    canvas.addEventListener('contextmenu', (e) => {
      e.preventDefault();
    });

    // 플레이어 전투기 및 지면 투영 그림자 드로잉
    function drawPlayer(x, y) {
      // 1. 비행기가 높은 상공에 떠 있음을 나타내는 '지면 그림자' (고도차 연출)
      if (shadowToggle.checked) {
        ctx.save();
        // 그림자는 빛의 각도에 맞춰 우하단으로 길게 오프셋(+45px, +60px)
        ctx.translate(x + 45, y + 65);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)'; // 지면에 비치는 반투명 실루엣
        ctx.beginPath();
        ctx.moveTo(0, -32);
        ctx.lineTo(26, 24);
        ctx.lineTo(0, 16);
        ctx.lineTo(-26, 24);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      // 2. 비행기 본체 렌더링
      ctx.save();
      ctx.translate(x, y);

      // 제트 엔진 추진 화염 (Afterburner)
      ctx.fillStyle = '#38bdf8';
      ctx.shadowColor = '#0284c7';
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.moveTo(-10, 26);
      ctx.lineTo(0, 46 + Math.random() * 8);
      ctx.lineTo(10, 26);
      ctx.closePath();
      ctx.fill();

      // 기체 본체
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#f8fafc';
      ctx.beginPath();
      ctx.moveTo(0, -34);
      ctx.lineTo(28, 22);
      ctx.lineTo(0, 15);
      ctx.lineTo(-28, 22);
      ctx.closePath();
      ctx.fill();

      // 날개 위장/라인 액센트
      ctx.strokeStyle = '#3b82f6';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-20, 16);
      ctx.lineTo(-28, 22);
      ctx.moveTo(20, 16);
      ctx.lineTo(28, 22);
      ctx.stroke();

      // 콕핏 캐노피
      ctx.fillStyle = '#0284c7';
      ctx.beginPath();
      ctx.ellipse(0, -7, 5, 13, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // -------------------------------------------------------------
    // 슈팅 게임 코어 시스템 (점수, 잔기, 폭탄, 탄환, 피격, 폭발, 컨티뉴)
    // -------------------------------------------------------------
    let score = 0; // 기본값 0점 (5자리 포맷: 00000)
    let lives = 2; // 잔기 2개 (2번 맞을 수 있고, 잔기 0 상태에서 1번 더 맞으면 컨티뉴)

    // -------------------------------------------------------------

    // -------------------------------------------------------------
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // 30만점 승리 팡파레 멜로디 (도 - 미 - 솔 - 높은도 4음 화음)
    function playVictoryAudio() {
      if (!soundEnabled) return;
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      playExplosionSound(true); // 대폭발 콤보음

      const notes = [
        { f: 523.25, time: 0.15, dur: 0.12 }, // C5
        { f: 659.25, time: 0.28, dur: 0.12 }, // E5
        { f: 783.99, time: 0.41, dur: 0.15 }, // G5
        { f: 1046.50, time: 0.58, dur: 0.60 } // C6
      ];

      notes.forEach(n => {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(n.f, now + n.time);
        g.gain.setValueAtTime(0.24, now + n.time);
        g.gain.exponentialRampToValueAtTime(0.001, now + n.time + n.dur);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start(now + n.time);
        osc.stop(now + n.time + n.dur);
      });
    }

    // 꽃가루(Confetti) 생성 함수 (300개)
    const CONFETTI_COLORS = [

          vx: (Math.random() - 0.5) * 4.5,

    // 레이저 발사 효과음 (급격한 드롭의 쫀득한 '뾱/삐용~' 레이저)
    // 볼륨 30% 감축 (0.13 -> 0.09) + R 아이템 획득(rapidBoost)당 소리 속도 5%씩 가속 (지속시간 단축)
    function playLaserSound() {
      if (!soundEnabled) return;
      try {
        initAudio();
        if (!audioCtx || audioCtx.state === 'suspended') return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();

        // 귀에 자극 없는 둥근 Triangle 파형 + 680Hz 로우패스 필터
        osc.type = 'triangle';
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(680, audioCtx.currentTime);

        const now = audioCtx.currentTime;
        
        // R 아이템 먹을 때마다(rapidBoost: 5% 단위) 사운드 속도 5%씩 가속 -> 지속시간 duration 단축
        // rapidSpeedFactor = 1 + (rapidBoost / 100)
        const rapidSpeedFactor = 1 + (rapidBoost / 100);
        const duration = 0.09 / rapidSpeedFactor;

        // 피치: 720Hz에서 85Hz로 가파른 지수 곡선을 그리며 급격히 곤두박질치는 글라이드 라인
        osc.frequency.setValueAtTime(720, now);
        osc.frequency.exponentialRampToValueAtTime(85, now + duration);

        // 볼륨: 50% 추가 감축 (0.09 -> 0.045)
        gain.gain.setValueAtTime(0.045, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + duration);
      } catch (e) {}
    }

    // 적기 피격 효과음 (소리를 확실히 키우고 찰진 명중감을 부여: 메탈릭 임팩트 2중 오실레이터, 게인 0.35)
    function playHitSound() {
      if (!soundEnabled) return;
      try {
        initAudio();
        if (!audioCtx || audioCtx.state === 'suspended') return;

        const now = audioCtx.currentTime;

        // A. 단단한 금속 타격 바이트 (Square 520Hz -> 200Hz)
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(200, now + 0.07);

        gain.gain.setValueAtTime(0.35, now); // 볼륨 대폭 상향 (기존 0.14 -> 0.35)
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.07);

        // B. 묵직한 펀치감 서브 (Triangle 240Hz -> 80Hz)
        const sub = audioCtx.createOscillator();
        const subGain = audioCtx.createGain();
        sub.type = 'triangle';
        sub.frequency.setValueAtTime(240, now);
        sub.frequency.exponentialRampToValueAtTime(80, now + 0.07);

        subGain.gain.setValueAtTime(0.30, now);
        subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);

        sub.connect(subGain);
        subGain.connect(audioCtx.destination);
        sub.start(now);
        sub.stop(now + 0.07);
      } catch (e) {}
    }

    // 적기 폭발 격추 효과음 (화이트 노이즈 버스트 + 저주파 럼블 붐)
    function playExplosionSound(isBoss = false) {
      if (!soundEnabled) return;
      try {
        initAudio();
        if (!audioCtx || audioCtx.state === 'suspended') return;

        const now = audioCtx.currentTime;
        const duration = isBoss ? 0.65 : 0.28;

        // 1. 노이즈 버스트 (파열음)
        const bufferSize = Math.floor(audioCtx.sampleRate * duration);
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        // 로우패스 필터로 먹먹한 폭발음 질감 구현
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(isBoss ? 900 : 1200, now);
        filter.frequency.linearRampToValueAtTime(150, now + duration);

        const noiseGain = audioCtx.createGain();
        noiseGain.gain.setValueAtTime(isBoss ? 0.45 : 0.26, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        noise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(audioCtx.destination);

        noise.start(now);
        noise.stop(now + duration);

        // 2. 묵직한 서브 베이스 럼블 (Boom!)
        const subOsc = audioCtx.createOscillator();
        const subGain = audioCtx.createGain();
        subOsc.type = 'triangle';
        subOsc.frequency.setValueAtTime(isBoss ? 160 : 130, now);
        subOsc.frequency.exponentialRampToValueAtTime(30, now + duration);

        subGain.gain.setValueAtTime(isBoss ? 0.4 : 0.22, now);
        subGain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        subOsc.connect(subGain);
        subGain.connect(audioCtx.destination);

        subOsc.start(now);
        subOsc.stop(now + duration);
      } catch (err) {
        console.warn('사운드 실행 실패:', err);
      }
    }

    // 사운드 On/Off 토글

    function updateScoreDisplay() {
