<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>세계를 구하자 (Save the World)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Galmuri11:wght@400;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      background-color: #0b0b12;
      color: #fff;
      font-family: 'Galmuri11', monospace, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }

    #game-container {
      position: relative;
      width: 800px;
      max-width: 95vw;
      aspect-ratio: 4 / 3;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), 0 0 20px rgba(106, 76, 255, 0.3);
      border: 4px solid #332d56;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: none;
    }

    .audio-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(15, 15, 25, 0.85);
      color: #ffd700;
      border: 2px solid #5a4e8c;
      padding: 8px 14px;
      font-family: 'Galmuri11', monospace;
      font-size: 13px;
      border-radius: 6px;
      cursor: pointer;
      z-index: 10;
      transition: all 0.2s ease;
      touch-action: manipulation;
    }

    .audio-btn:hover, .audio-btn:active {
      background: #5a4e8c;
      color: #fff;
    }

    .instructions {
      margin-top: 14px;
      color: #8c82b0;
      font-size: 13px;
      letter-spacing: 1px;
      text-align: center;
      padding: 0 10px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <button id="audio-toggle" class="audio-btn">🔊 사운드: ON</button>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
  </div>
  <div class="instructions">
    [화면 터치 / 마우스 클릭 / SPACE 키] 로 진행합니다
  </div>

<script>
/* ============================================================
   8-BIT SYNTHESIZER (Web Audio API)
============================================================ */
class SoundEngine {
  constructor() {
    this.ctx = null;
    this.muted = false;
  }

  init() {
    if (!this.ctx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioContext();
    }
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  playTone(freq, type, duration, gainVal = 0.1, decay = true) {
    if (this.muted || !this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

      gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
      if (decay) {
        gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
      }

      osc.connect(gain);
      gain.connect(this.ctx.destination);

      osc.start();
      osc.stop(this.ctx.currentTime + duration);
    } catch (e) {}
  }

  playTitleBeep() {
    this.init();
    this.playTone(523.25, 'square', 0.15, 0.12);
    setTimeout(() => this.playTone(659.25, 'square', 0.2, 0.12), 100);
    setTimeout(() => this.playTone(783.99, 'square', 0.35, 0.15), 200);
  }

  playTextBlip() {
    this.init();
    const f = 160 + Math.random() * 40;
    this.playTone(f, 'triangle', 0.04, 0.08);
  }

  playDemonLaugh() {
    this.init();
    const pitches = [130, 110, 140, 100, 120, 90];
    pitches.forEach((p, idx) => {
      setTimeout(() => {
        this.playTone(p, 'sawtooth', 0.12, 0.15);
      }, idx * 90);
    });
  }

  playHeroAppear() {
    this.init();
    const notes = [440, 554.37, 659.25, 880];
    notes.forEach((n, idx) => {
      setTimeout(() => {
        this.playTone(n, 'square', 0.15, 0.1);
      }, idx * 80);
    });
  }

  playSlash() {
    this.init();
    if (this.muted || !this.ctx) return;
    try {
      const bufferSize = this.ctx.sampleRate * 0.25;
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const output = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }
      const whiteNoise = this.ctx.createBufferSource();
      whiteNoise.buffer = buffer;

      const filter = this.ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(1200, this.ctx.currentTime);
      filter.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.25);

      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.25);

      whiteNoise.connect(filter);
      filter.connect(gain);
      gain.connect(this.ctx.destination);

      whiteNoise.start();
      this.playTone(1200, 'sawtooth', 0.18, 0.2);
    } catch (e) {}
  }

  playPeaceJingle() {
    this.init();
    const melody = [
      { f: 523.25, d: 0.2 }, { f: 659.25, d: 0.2 }, { f: 783.99, d: 0.2 },
      { f: 1046.50, d: 0.5 }, { f: 880.00, d: 0.2 }, { f: 1046.50, d: 0.7 }
    ];
    let time = 0;
    melody.forEach(m => {
      setTimeout(() => this.playTone(m.f, 'triangle', m.d, 0.15), time * 1000);
      time += m.d * 0.85;
    });
  }

  playConquestJingle() {
    this.init();
    const darkMelody = [
      { f: 220.00, d: 0.25 }, { f: 207.65, d: 0.25 }, { f: 196.00, d: 0.3 },
      { f: 146.83, d: 0.4 }, { f: 110.00, d: 0.9 }
    ];
    let time = 0;
    darkMelody.forEach(m => {
      setTimeout(() => this.playTone(m.f, 'sawtooth', m.d, 0.2), time * 1000);
      time += m.d * 0.9;
    });
  }
}

const audio = new SoundEngine();
const audioToggleBtn = document.getElementById('audio-toggle');
const toggleAudio = (e) => {
  e.stopPropagation();
  audio.init();
  audio.muted = !audio.muted;
  audioToggleBtn.textContent = audio.muted ? '🔇 사운드: OFF' : '🔊 사운드: ON';
};
audioToggleBtn.addEventListener('click', toggleAudio);
audioToggleBtn.addEventListener('touchend', toggleAudio);

/* ============================================================
   GAME LOGIC & RENDERER
============================================================ */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const STATE = {
  TITLE: 'TITLE',
  DEMON_INTRO: 'DEMON_INTRO',
  HERO_APPEAR: 'HERO_APPEAR',
  CHOICE: 'CHOICE',
  SLASH: 'SLASH',
  ENDING_PEACE: 'ENDING_PEACE',
  ENDING_CONQUEST: 'ENDING_CONQUEST',
  THE_END: 'THE_END'
};

let currentState = STATE.TITLE;
let stateTime = 0;
let lastTime = performance.now();

let dialogList = [];
let currentDialogIndex = 0;
let displayedText = "";
let charTimer = 0;
let isTextComplete = false;

let selectedChoice = 0; // 0: 구한다, 1: 구하지 않는다
let choiceButtons = [
  { text: "1. 세계 구한다", x: 220, y: 440, w: 360, h: 48 },
  { text: "2. 구하지 않는다", x: 220, y: 505, w: 360, h: 48 }
];

let particles = [];
let slashEffect = { active: false, progress: 0, x1: 0, y1: 0, x2: 0, y2: 0 };
let demonSplit = { leftOffset: 0, rightOffset: 0, alpha: 1, split: false };
let endingChoice = 0;

let lightningTimer = 0;
let lightningAlpha = 0;
let castleTorches = [
  { x: 280, y: 320 }, { x: 520, y: 320 }, { x: 380, y: 260 }, { x: 420, y: 260 }
];

function changeState(newState) {
  currentState = newState;
  stateTime = 0;
  charTimer = 0;
  displayedText = "";
  isTextComplete = false;

  if (newState === STATE.DEMON_INTRO) {
    dialogList = [
      { speaker: "마왕", text: "나 마왕." },
      { speaker: "마왕", text: "세계정복 한다!!" },
      { speaker: "마왕", text: "내놔 세상 으하하하하!!" }
    ];
    currentDialogIndex = 0;
    demonSplit = { leftOffset: 0, rightOffset: 0, alpha: 1, split: false };
    audio.playDemonLaugh();
  } else if (newState === STATE.HERO_APPEAR) {
    dialogList = [
      { speaker: "용사", text: "거기까지다, 마왕! 내가 네 녀석을 막겠다!" }
    ];
    currentDialogIndex = 0;
    audio.playHeroAppear();
  } else if (newState === STATE.CHOICE) {
    selectedChoice = 0;
  } else if (newState === STATE.SLASH) {
    slashEffect = { active: true, progress: 0, x1: 280, y1: 150, x2: 520, y2: 380 };
    demonSplit.split = true;
    audio.playSlash();
    spawnSlashParticles(400, 260);
  } else if (newState === STATE.ENDING_PEACE) {
    audio.playPeaceJingle();
  } else if (newState === STATE.ENDING_CONQUEST) {
    audio.playConquestJingle();
  }
}

function spawnSlashParticles(x, y) {
  particles = [];
  for (let i = 0; i < 60; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 8;
    particles.push({
      x: x,
      y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 2,
      color: ['#ff0055', '#ffcc00', '#ffffff', '#9900ff'][Math.floor(Math.random() * 4)],
      size: 3 + Math.random() * 5,
      alpha: 1,
      decay: 0.02 + Math.random() * 0.03
    });
  }
}

/* ============================================================
   PIXEL ART DRAWING UTILITIES
============================================================ */
function drawPixelRect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
}

// 1. 마왕성 & 타이틀 배경
function drawTitleBackground(time) {
  const skyGrad = ctx.createLinearGradient(0, 0, 0, 450);
  skyGrad.addColorStop(0, '#0a0518');
  skyGrad.addColorStop(0.6, '#240d3a');
  skyGrad.addColorStop(1, '#50123e');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, 800, 600);

  if (lightningAlpha > 0) {
    ctx.fillStyle = `rgba(230, 220, 255, ${lightningAlpha})`;
    ctx.fillRect(0, 0, 800, 600);
  }

  // Red Blood Moon
  ctx.fillStyle = '#ff2a55';
  ctx.beginPath();
  ctx.arc(620, 120, 50, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ff6b8b';
  ctx.beginPath();
  ctx.arc(615, 115, 42, 0, Math.PI * 2);
  ctx.fill();

  // Clouds
  ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
  ctx.fillRect(0, 180 + Math.sin(time * 0.5) * 5, 800, 70);

  // Demon Castle Silhouette
  ctx.fillStyle = '#0f081c';
  ctx.fillRect(340, 180, 120, 270);
  ctx.fillRect(320, 220, 160, 230);
  ctx.beginPath();
  ctx.moveTo(340, 180); ctx.lineTo(400, 90); ctx.lineTo(460, 180); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(270, 240); ctx.lineTo(310, 150); ctx.lineTo(350, 240); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(450, 240); ctx.lineTo(490, 150); ctx.lineTo(530, 240); ctx.fill();

  ctx.fillRect(240, 240, 90, 210);
  ctx.fillRect(470, 240, 90, 210);
  ctx.fillRect(160, 300, 90, 150);
  ctx.fillRect(550, 300, 90, 150);

  // Glowing Windows
  const windowGlow = 0.5 + Math.sin(time * 3) * 0.4;
  ctx.fillStyle = `rgba(255, 60, 0, ${windowGlow})`;
  ctx.fillRect(390, 230, 20, 35);
  ctx.fillRect(360, 270, 15, 25);
  ctx.fillRect(425, 270, 15, 25);
  ctx.fillRect(280, 280, 14, 25);
  ctx.fillRect(505, 280, 14, 25);

  castleTorches.forEach(t => {
    ctx.fillStyle = '#ff8800';
    ctx.fillRect(t.x, t.y + Math.sin(time * 8 + t.x) * 2, 6, 6);
    ctx.fillStyle = '#ffff00';
    ctx.fillRect(t.x + 1, t.y - 3 + Math.sin(time * 10 + t.x) * 2, 4, 5);
  });

  // Mountain Floor
  ctx.fillStyle = '#140c24';
  ctx.beginPath();
  ctx.moveTo(0, 430);
  ctx.lineTo(250, 410);
  ctx.lineTo(400, 440);
  ctx.lineTo(600, 400);
  ctx.lineTo(800, 440);
  ctx.lineTo(800, 600);
  ctx.lineTo(0, 600);
  ctx.fill();

  ctx.fillStyle = '#0a0614';
  ctx.fillRect(0, 470, 800, 130);
}

// 2. 용사 뒷모습
function drawHeroBackView(x, y, time) {
  const capeWave = Math.sin(time * 5) * 6;
  const bob = Math.sin(time * 3) * 2;

  ctx.fillStyle = '#9e1b32';
  ctx.beginPath();
  ctx.moveTo(x - 14, y - 40 + bob);
  ctx.lineTo(x + 14, y - 40 + bob);
  ctx.lineTo(x + 28 + capeWave, y + 25 + bob);
  ctx.lineTo(x - 22 + capeWave * 0.5, y + 28 + bob);
  ctx.closePath();
  ctx.fill();

  drawPixelRect(x - 14, y - 42 + bob, 28, 38, '#3d4454');
  drawPixelRect(x - 18, y - 44 + bob, 8, 14, '#636e85');
  drawPixelRect(x + 10, y - 44 + bob, 8, 14, '#636e85');

  drawPixelRect(x - 12, y - 10 + bob, 24, 6, '#6b3e1b');
  drawPixelRect(x - 4, y - 10 + bob, 8, 6, '#e5b83b');

  drawPixelRect(x - 12, y - 68 + bob, 24, 26, '#3a2312');
  drawPixelRect(x - 14, y - 64 + bob, 4, 18, '#2b190c');
  drawPixelRect(x + 10, y - 64 + bob, 4, 18, '#2b190c');

  // Sword
  ctx.fillStyle = '#8a93a8';
  ctx.fillRect(x + 10, y - 75 + bob, 6, 50);
  ctx.fillStyle = '#e5b83b';
  ctx.fillRect(x + 4, y - 45 + bob, 18, 6);
  ctx.fillStyle = '#442211';
  ctx.fillRect(x + 10, y - 39 + bob, 6, 14);

  drawPixelRect(x - 12, y - 4 + bob, 10, 32, '#2b2238');
  drawPixelRect(x + 2, y - 4 + bob, 10, 32, '#2b2238');
  drawPixelRect(x - 14, y + 22 + bob, 12, 12, '#1a1324');
  drawPixelRect(x + 2, y + 22 + bob, 12, 12, '#1a1324');
}

// 3. 2개의 뿔 마왕
function drawDemon(centerX, centerY, bounceOffset, splitState, time) {
  const leftX = centerX - (splitState.split ? splitState.leftOffset : 0);
  const rightX = centerX + (splitState.split ? splitState.rightOffset : 0);
  const curY = centerY + bounceOffset;

  ctx.save();
  ctx.globalAlpha = splitState.alpha;

  if (splitState.split) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, centerX - splitState.leftOffset * 0.2, 600);
    ctx.clip();
    renderDemonBody(leftX, curY, time, bounceOffset);
    ctx.restore();

    ctx.save();
    ctx.beginPath();
    ctx.rect(centerX + splitState.rightOffset * 0.2, 0, 800, 600);
    ctx.clip();
    renderDemonBody(rightX, curY, time, bounceOffset);
    ctx.restore();
  } else {
    renderDemonBody(centerX, curY, time, bounceOffset);
  }

  ctx.restore();
}

function renderDemonBody(cx, cy, time, bounce) {
  for (let i = -6; i <= 6; i++) {
    const auraH = 15 + Math.sin(time * 8 + i) * 12;
    ctx.fillStyle = i % 2 === 0 ? 'rgba(170, 0, 255, 0.4)' : 'rgba(255, 0, 80, 0.35)';
    ctx.fillRect(cx + i * 12 - 6, cy + 80 - auraH, 10, auraH);
  }

  const wingFlap = Math.sin(time * 6) * 8;
  ctx.fillStyle = '#22092c';
  ctx.beginPath();
  ctx.moveTo(cx - 30, cy - 20);
  ctx.lineTo(cx - 150, cy - 90 + wingFlap);
  ctx.lineTo(cx - 120, cy + 20);
  ctx.lineTo(cx - 40, cy + 40);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(cx + 30, cy - 20);
  ctx.lineTo(cx + 150, cy - 90 + wingFlap);
  ctx.lineTo(cx + 120, cy + 20);
  ctx.lineTo(cx + 40, cy + 40);
  ctx.closePath();
  ctx.fill();

  drawPixelRect(cx - 55, cy - 20, 110, 120, '#351147');
  drawPixelRect(cx - 45, cy - 15, 90, 110, '#4e1b69');

  drawPixelRect(cx - 15, cy - 15, 30, 110, '#8c1d40');
  drawPixelRect(cx - 5, cy - 15, 10, 110, '#e5b83b');

  drawPixelRect(cx - 75, cy - 40, 30, 30, '#1d0726');
  drawPixelRect(cx + 45, cy - 40, 30, 30, '#1d0726');
  drawPixelRect(cx - 70, cy - 55, 8, 16, '#c42348');
  drawPixelRect(cx + 62, cy - 55, 8, 16, '#c42348');

  // Head
  drawPixelRect(cx - 38, cy - 80, 76, 60, '#a81334');
  drawPixelRect(cx - 32, cy - 74, 64, 50, '#c72045');

  // 2개의 뿔 (TWO HORNS)
  drawPixelRect(cx - 46, cy - 95, 14, 25, '#f5deb3');
  drawPixelRect(cx - 54, cy - 115, 12, 25, '#edd298');
  drawPixelRect(cx - 62, cy - 130, 10, 20, '#dfbe76');
  drawPixelRect(cx - 56, cy - 140, 8, 14, '#1b1b1b');

  drawPixelRect(cx + 32, cy - 95, 14, 25, '#f5deb3');
  drawPixelRect(cx + 42, cy - 115, 12, 25, '#edd298');
  drawPixelRect(cx + 52, cy - 130, 10, 20, '#dfbe76');
  drawPixelRect(cx + 48, cy - 140, 8, 14, '#1b1b1b');

  // Eyes
  drawPixelRect(cx - 24, cy - 62, 16, 10, '#ffee00');
  drawPixelRect(cx + 8, cy - 62, 16, 10, '#ffee00');
  drawPixelRect(cx - 18, cy - 60, 6, 6, '#ff0000');
  drawPixelRect(cx + 12, cy - 60, 6, 6, '#ff0000');

  drawPixelRect(cx - 28, cy - 68, 22, 6, '#5e071b');
  drawPixelRect(cx + 6, cy - 68, 22, 6, '#5e071b');

  // Laughing Mouth
  const laughOpen = Math.abs(bounce) > 2 ? 22 : 12;
  drawPixelRect(cx - 24, cy - 44, 48, laughOpen, '#1a050b');
  drawPixelRect(cx - 20, cy - 44, 6, 8, '#ffffff');
  drawPixelRect(cx - 6, cy - 44, 6, 6, '#ffffff');
  drawPixelRect(cx + 8, cy - 44, 6, 6, '#ffffff');
  drawPixelRect(cx + 16, cy - 44, 6, 8, '#ffffff');
  drawPixelRect(cx - 14, cy - 44 + laughOpen - 6, 6, 6, '#ffffff');
  drawPixelRect(cx + 8, cy - 44 + laughOpen - 6, 6, 6, '#ffffff');

  // Arms
  const armOffset = Math.sin(time * 10) * 8;
  drawPixelRect(cx - 95, cy - 10 + armOffset, 24, 55, '#a81334');
  drawPixelRect(cx - 105, cy + 35 + armOffset, 20, 20, '#2b060e');
  drawPixelRect(cx + 71, cy - 10 - armOffset, 24, 55, '#a81334');
  drawPixelRect(cx + 85, cy + 35 - armOffset, 20, 20, '#2b060e');
}

// 4. 용사 앞모습 (방패와 검)
function drawHeroFrontView(x, y, time, isEvil = false) {
  const bob = Math.sin(time * 6) * 2;

  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.ellipse(x, y + 42, 35, 12, 0, 0, Math.PI * 2);
  ctx.fill();

  if (isEvil) {
    ctx.fillStyle = 'rgba(255, 0, 60, 0.3)';
    ctx.fillRect(x - 40, y - 75 + bob, 80, 110);
  }

  ctx.fillStyle = isEvil ? '#4a082b' : '#b31b34';
  ctx.fillRect(x - 22, y - 35 + bob, 44, 50);

  drawPixelRect(x - 16, y - 38 + bob, 32, 42, isEvil ? '#252033' : '#4d5975');
  drawPixelRect(x - 12, y - 32 + bob, 24, 30, isEvil ? '#42162c' : '#7283a8');
  drawPixelRect(x - 4, y - 26 + bob, 8, 14, isEvil ? '#ff0044' : '#ffd700');

  drawPixelRect(x - 14, y - 66 + bob, 28, 28, '#ffdbac');
  drawPixelRect(x - 16, y - 72 + bob, 32, 14, isEvil ? '#2b1b17' : '#e5a823');
  drawPixelRect(x - 18, y - 68 + bob, 6, 20, isEvil ? '#2b1b17' : '#e5a823');
  drawPixelRect(x + 12, y - 68 + bob, 6, 20, isEvil ? '#2b1b17' : '#e5a823');

  if (isEvil) {
    drawPixelRect(x - 12, y - 82 + bob, 6, 12, '#ff0055');
    drawPixelRect(x + 6, y - 82 + bob, 6, 12, '#ff0055');
  }

  if (isEvil) {
    drawPixelRect(x - 8, y - 56 + bob, 5, 5, '#ff0033');
    drawPixelRect(x + 3, y - 56 + bob, 5, 5, '#ff0033');
  } else {
    drawPixelRect(x - 8, y - 56 + bob, 4, 6, '#1e3f66');
    drawPixelRect(x + 4, y - 56 + bob, 4, 6, '#1e3f66');
  }

  drawPixelRect(x - 14, y + 4 + bob, 12, 34, '#242a38');
  drawPixelRect(x + 2, y + 4 + bob, 12, 34, '#242a38');
  drawPixelRect(x - 16, y + 26 + bob, 14, 14, '#151720');
  drawPixelRect(x + 2, y + 26 + bob, 14, 14, '#151720');

  // 방패 (Shield)
  const shieldX = x - 38;
  const shieldY = y - 30 + bob;
  drawPixelRect(shieldX, shieldY, 20, 36, '#2a4473');
  drawPixelRect(shieldX + 3, shieldY + 3, 14, 30, '#436fb3');
  drawPixelRect(shieldX + 7, shieldY + 8, 6, 18, '#ffd700');
  drawPixelRect(shieldX + 4, shieldY + 14, 12, 6, '#ffd700');

  // 검 (Sword)
  const swordX = x + 24;
  const swordY = y - 55 + bob;
  ctx.fillStyle = isEvil ? '#ff0044' : '#eef8ff';
  ctx.fillRect(swordX + 2, swordY, 8, 48);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(swordX + 4, swordY + 2, 4, 42);
  ctx.fillStyle = '#d4af37';
  ctx.fillRect(swordX - 4, swordY + 44, 20, 6);
  ctx.fillStyle = '#5c2c16';
  ctx.fillRect(swordX + 3, swordY + 50, 6, 12);
  ctx.fillStyle = '#d4af37';
  ctx.fillRect(swordX + 2, swordY + 62, 8, 6);
}

// 5. 대화창
function drawDialogBox(speaker, text, progressText) {
  ctx.fillStyle = 'rgba(10, 10, 20, 0.92)';
  ctx.fillRect(40, 420, 720, 150);

  ctx.lineWidth = 4;
  ctx.strokeStyle = '#6a4cff';
  ctx.strokeRect(40, 420, 720, 150);

  ctx.strokeStyle = '#ffd700';
  ctx.lineWidth = 2;
  ctx.strokeRect(46, 426, 708, 138);

  if (speaker) {
    ctx.fillStyle = speaker === "마왕" ? '#b31b34' : '#2b5ea8';
    ctx.fillRect(60, 395, 140, 34);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.strokeRect(60, 395, 140, 34);

    ctx.fillStyle = '#fff';
    ctx.font = '700 16px "Galmuri11", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(speaker, 130, 418);
  }

  ctx.fillStyle = '#ffffff';
  ctx.font = '20px "Galmuri11", monospace';
  ctx.textAlign = 'left';
  ctx.fillText(progressText, 70, 475);

  if (isTextComplete && (Math.floor(Date.now() / 400) % 2 === 0)) {
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.moveTo(720, 540);
    ctx.lineTo(735, 540);
    ctx.lineTo(727.5, 550);
    ctx.closePath();
    ctx.fill();
  }
}

// 6. 선택지 UI
function drawChoiceUI() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
  ctx.fillRect(0, 0, 800, 600);

  ctx.fillStyle = '#1c142e';
  ctx.fillRect(160, 340, 480, 230);
  ctx.strokeStyle = '#ffd700';
  ctx.lineWidth = 4;
  ctx.strokeRect(160, 340, 480, 230);

  ctx.fillStyle = '#fff';
  ctx.font = '700 22px "Galmuri11", monospace';
  ctx.textAlign = 'center';
  ctx.fillText("어떻게 하겠습니까?", 400, 395);

  choiceButtons.forEach((btn, idx) => {
    const isSelected = selectedChoice === idx;

    ctx.fillStyle = isSelected ? '#552288' : '#241a38';
    ctx.fillRect(btn.x, btn.y, btn.w, btn.h);

    ctx.strokeStyle = isSelected ? '#00ffcc' : '#6b5794';
    ctx.lineWidth = isSelected ? 3 : 2;
    ctx.strokeRect(btn.x, btn.y, btn.w, btn.h);

    if (isSelected) {
      ctx.fillStyle = '#00ffcc';
      ctx.fillText("▶", btn.x + 25, btn.y + 31);
    }

    ctx.fillStyle = isSelected ? '#ffffff' : '#b8a9d6';
    ctx.font = '18px "Galmuri11", monospace';
    ctx.textAlign = 'left';
    ctx.fillText(btn.text, btn.x + 50, btn.y + 31);
  });
}

// 7. 참격 슬래시 이펙트 & 파티클
function drawSlashAnimation() {
  if (!slashEffect.active) return;

  ctx.save();
  if (slashEffect.progress < 0.3) {
    ctx.fillStyle = `rgba(255, 255, 255, ${(0.3 - slashEffect.progress) * 3})`;
    ctx.fillRect(0, 0, 800, 600);
  }

  const p = Math.min(1, slashEffect.progress * 2);
  const curX = slashEffect.x1 + (slashEffect.x2 - slashEffect.x1) * p;
  const curY = slashEffect.y1 + (slashEffect.y2 - slashEffect.y1) * p;

  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 14;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(slashEffect.x1, slashEffect.y1);
  ctx.lineTo(curX, curY);
  ctx.stroke();

  ctx.strokeStyle = '#00ffff';
  ctx.lineWidth = 6;
  ctx.stroke();

  ctx.restore();
}

function updateAndDrawParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15;
    p.alpha -= p.decay;

    if (p.alpha <= 0) {
      particles.splice(i, 1);
      continue;
    }

    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.alpha;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1.0;
}

/* ============================================================
   MAIN GAME LOOP & SCENE UPDATES
============================================================ */
function update(dt, time) {
  stateTime += dt;

  if (currentState === STATE.TITLE) {
    lightningTimer += dt;
    if (lightningTimer > 3.5 + Math.random() * 4) {
      lightningAlpha = 0.8;
      lightningTimer = 0;
    }
    if (lightningAlpha > 0) {
      lightningAlpha -= dt * 3;
      if (lightningAlpha < 0) lightningAlpha = 0;
    }
  }

  if (currentState === STATE.DEMON_INTRO || currentState === STATE.HERO_APPEAR) {
    const targetText = dialogList[currentDialogIndex]?.text || "";
    if (displayedText.length < targetText.length) {
      charTimer += dt;
      if (charTimer >= 0.05) {
        charTimer = 0;
        displayedText = targetText.slice(0, displayedText.length + 1);
        audio.playTextBlip();
      }
    } else {
      isTextComplete = true;
    }
  }

  if (currentState === STATE.SLASH) {
    slashEffect.progress += dt * 1.5;

    if (slashEffect.progress > 0.2) {
      demonSplit.leftOffset += dt * 120;
      demonSplit.rightOffset += dt * 120;
      demonSplit.alpha = Math.max(0, 1 - (slashEffect.progress - 0.2) * 1.2);
    }

    if (slashEffect.progress >= 1.6) {
      slashEffect.active = false;
      if (endingChoice === 0) {
        changeState(STATE.ENDING_PEACE);
      } else {
        changeState(STATE.ENDING_CONQUEST);
      }
    }
  }
}

function render(time) {
  ctx.clearRect(0, 0, 800, 600);

  // 1. TITLE SCREEN
  if (currentState === STATE.TITLE) {
    drawTitleBackground(time);
    drawHeroBackView(400, 480, time);

    ctx.fillStyle = 'rgba(10, 5, 20, 0.75)';
    ctx.fillRect(120, 50, 560, 100);
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 4;
    ctx.strokeRect(120, 50, 560, 100);

    ctx.fillStyle = '#ffcc00';
    ctx.font = '700 44px "Galmuri11", sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#ff0055';
    ctx.shadowBlur = 15;
    ctx.fillText("세계를 구하자", 400, 118);
    ctx.shadowBlur = 0;

    const floatY = 320 + Math.sin(time * 4) * 10;
    ctx.fillStyle = '#1c1533';
    ctx.fillRect(240, floatY, 320, 50);
    ctx.strokeStyle = '#00ffcc';
    ctx.lineWidth = 3;
    ctx.strokeRect(240, floatY, 320, 50);

    ctx.fillStyle = '#ffffff';
    ctx.font = '700 16px "Press Start 2P", "Galmuri11", monospace';
    ctx.fillText("START / TOUCH", 400, floatY + 32);

    ctx.fillStyle = '#9e8ec7';
    ctx.font = '14px "Galmuri11", monospace';
    ctx.fillText("화면을 터치하거나 스페이스바를 누르세요", 400, 570);
  }

  // 2. DEMON INTRO
  else if (currentState === STATE.DEMON_INTRO) {
    ctx.fillStyle = '#050208';
    ctx.fillRect(0, 0, 800, 600);

    const demonBounce = Math.sin(time * 14) * 8;
    drawDemon(400, 240, demonBounce, demonSplit, time);

    const curSpeaker = dialogList[currentDialogIndex]?.speaker || "마왕";
    drawDialogBox(curSpeaker, dialogList[currentDialogIndex]?.text || "", displayedText);
  }

  // 3. HERO APPEAR
  else if (currentState === STATE.HERO_APPEAR) {
    ctx.fillStyle = '#0a0614';
    ctx.fillRect(0, 0, 800, 600);
    ctx.fillStyle = '#160e29';
    ctx.fillRect(0, 360, 800, 240);

    drawDemon(560, 220, Math.sin(time * 6) * 4, demonSplit, time);
    drawHeroFrontView(240, 320, time, false);

    drawDialogBox("용사", dialogList[currentDialogIndex]?.text || "", displayedText);
  }

  // 4. CHOICE SELECTION
  else if (currentState === STATE.CHOICE) {
    ctx.fillStyle = '#0a0614';
    ctx.fillRect(0, 0, 800, 600);
    ctx.fillStyle = '#160e29';
    ctx.fillRect(0, 360, 800, 240);

    drawDemon(560, 220, 0, demonSplit, time);
    drawHeroFrontView(240, 320, time, false);

    drawChoiceUI();
  }

  // 5. SLASH ACTION
  else if (currentState === STATE.SLASH) {
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, 800, 600);

    drawHeroFrontView(280 + slashEffect.progress * 150, 300, time, endingChoice === 1);

    if (slashEffect.progress < 0.8) {
      ctx.fillStyle = '#ff0055';
      ctx.fillRect(220, 180, 140, 48);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3;
      ctx.strokeRect(220, 180, 140, 48);
      ctx.fillStyle = '#fff';
      ctx.font = '700 24px "Galmuri11", monospace';
      ctx.textAlign = 'center';
      ctx.fillText("이얍!!", 290, 213);
    }

    drawDemon(560, 220, 0, demonSplit, time);
    drawSlashAnimation();
    updateAndDrawParticles(0.016);
  }

  // 6. ENDING: PEACE
  else if (currentState === STATE.ENDING_PEACE) {
    const peaceGrad = ctx.createLinearGradient(0, 0, 0, 400);
    peaceGrad.addColorStop(0, '#56b4d3');
    peaceGrad.addColorStop(1, '#348ac7');
    ctx.fillStyle = peaceGrad;
    ctx.fillRect(0, 0, 800, 600);

    ctx.fillStyle = '#ffe600';
    ctx.beginPath();
    ctx.arc(680, 100, 45, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#43a047';
    ctx.fillRect(0, 380, 800, 220);
    ctx.fillStyle = '#2e7d32';
    ctx.fillRect(0, 440, 800, 160);

    for (let i = 0; i < 15; i++) {
      ctx.fillStyle = i % 2 === 0 ? '#ff4081' : '#ffeb3b';
      ctx.fillRect(40 + i * 50, 420 + (i % 3) * 20, 8, 8);
    }

    drawHeroFrontView(400, 360, time, false);

    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
    ctx.fillRect(80, 80, 640, 130);
    ctx.strokeStyle = '#2e7d32';
    ctx.lineWidth = 4;
    ctx.strokeRect(80, 80, 640, 130);

    ctx.fillStyle = '#1b5e20';
    ctx.font = '700 24px "Galmuri11", monospace';
    ctx.textAlign = 'center';
    ctx.fillText("✨ 세계에 평화가 찾아왔습니다! ✨", 400, 135);

    ctx.fillStyle = '#333333';
    ctx.font = '16px "Galmuri11", monospace';
    ctx.fillText("마왕은 쓰러졌고, 사람들은 다시 평화와 행복을 되찾았습니다.", 400, 175);

    if (stateTime > 2.5) {
      drawTheEndOverlay(time);
    }
  }

  // 7. ENDING: CONQUEST
  else if (currentState === STATE.ENDING_CONQUEST) {
    const darkGrad = ctx.createLinearGradient(0, 0, 0, 500);
    darkGrad.addColorStop(0, '#1f000a');
    darkGrad.addColorStop(0.7, '#420014');
    darkGrad.addColorStop(1, '#8a001a');
    ctx.fillStyle = darkGrad;
    ctx.fillRect(0, 0, 800, 600);

    ctx.fillStyle = '#ff0033';
    ctx.beginPath();
    ctx.arc(400, 120, 60, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#14050d';
    ctx.fillRect(0, 380, 800, 220);

    drawHeroFrontView(400, 360, time, true);

    ctx.fillStyle = 'rgba(20, 0, 10, 0.9)';
    ctx.fillRect(80, 80, 640, 130);
    ctx.strokeStyle = '#ff0044';
    ctx.lineWidth = 4;
    ctx.strokeRect(80, 80, 640, 130);

    ctx.fillStyle = '#ff2a55';
    ctx.font = '700 24px "Galmuri11", monospace';
    ctx.textAlign = 'center';
    ctx.fillText("👑 새로운 마왕의 탄생 👑", 400, 135);

    ctx.fillStyle = '#ffccd5';
    ctx.font = '16px "Galmuri11", monospace';
    ctx.fillText("마왕을 쓰러뜨린 용사는 스스로 마왕이 되어 세계를 정복했습니다!", 400, 175);

    if (stateTime > 2.5) {
      drawTheEndOverlay(time);
    }
  }
}

// 8. "The End" Screen
function drawTheEndOverlay(time) {
  const alpha = Math.min(1, (stateTime - 2.5) * 1.5);

  ctx.fillStyle = `rgba(0, 0, 0, ${alpha * 0.95})`;
  ctx.fillRect(0, 0, 800, 600);

  if (alpha > 0.5) {
    ctx.fillStyle = '#ffffff';
    ctx.font = '700 48px "Press Start 2P", "Galmuri11", monospace';
    ctx.textAlign = 'center';
    ctx.fillText("The End", 400, 280);

    if (Math.floor(Date.now() / 500) % 2 === 0) {
      ctx.fillStyle = '#ffd700';
      ctx.font = '16px "Galmuri11", monospace';
      ctx.fillText("PRESS SPACE OR TOUCH TO RESTART", 400, 380);
    }
  }
}

/* ============================================================
   INPUT HANDLING (KEYBOARD & TOUCH / CLICK)
============================================================ */
function handleAdvance() {
  audio.init();

  if (currentState === STATE.TITLE) {
    audio.playTitleBeep();
    changeState(STATE.DEMON_INTRO);
  }
  else if (currentState === STATE.DEMON_INTRO) {
    if (!isTextComplete) {
      displayedText = dialogList[currentDialogIndex].text;
      isTextComplete = true;
    } else {
      currentDialogIndex++;
      if (currentDialogIndex < dialogList.length) {
        displayedText = "";
        isTextComplete = false;
        charTimer = 0;
        audio.playDemonLaugh();
      } else {
        changeState(STATE.HERO_APPEAR);
      }
    }
  }
  else if (currentState === STATE.HERO_APPEAR) {
    if (!isTextComplete) {
      displayedText = dialogList[currentDialogIndex].text;
      isTextComplete = true;
    } else {
      changeState(STATE.CHOICE);
    }
  }
  else if (currentState === STATE.CHOICE) {
    endingChoice = selectedChoice;
    changeState(STATE.SLASH);
  }
  else if (currentState === STATE.ENDING_PEACE || currentState === STATE.ENDING_CONQUEST) {
    if (stateTime > 3.0) {
      changeState(STATE.TITLE);
    }
  }
}

// 터치 및 마우스 클릭 공통 처리
function handlePointerDown(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const mouseX = (clientX - rect.left) * (canvas.width / rect.width);
  const mouseY = (clientY - rect.top) * (canvas.height / rect.height);

  if (currentState === STATE.CHOICE) {
    choiceButtons.forEach((btn, idx) => {
      if (
        mouseX >= btn.x && mouseX <= btn.x + btn.w &&
        mouseY >= btn.y && mouseY <= btn.y + btn.h
      ) {
        selectedChoice = idx;
        handleAdvance();
      }
    });
  } else {
    handleAdvance();
  }
}

// 키보드 이벤트
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    handleAdvance();
  }
  else if (currentState === STATE.CHOICE) {
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
      selectedChoice = 0;
      audio.playTextBlip();
    } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
      selectedChoice = 1;
      audio.playTextBlip();
    } else if (e.key === '1') {
      selectedChoice = 0;
      handleAdvance();
    } else if (e.key === '2') {
      selectedChoice = 1;
      handleAdvance();
    } else if (e.key === 'Enter') {
      handleAdvance();
    }
  }
});

// 터치 이벤트 등록
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (e.touches.length > 0) {
    const t = e.touches[0];
    handlePointerDown(t.clientX, t.clientY);
  }
}, { passive: false });

// 마우스 클릭 이벤트
canvas.addEventListener('mousedown', (e) => {
  handlePointerDown(e.clientX, e.clientY);
});

// 마우스 호버 선택지 반응
canvas.addEventListener('mousemove', (e) => {
  if (currentState !== STATE.CHOICE) return;
  const rect = canvas.getBoundingClientRect();
  const mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
  const mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);

  choiceButtons.forEach((btn, idx) => {
    if (
      mouseX >= btn.x && mouseX <= btn.x + btn.w &&
      mouseY >= btn.y && mouseY <= btn.y + btn.h
    ) {
      if (selectedChoice !== idx) {
        selectedChoice = idx;
        audio.playTextBlip();
      }
    }
  });
});

/* ============================================================
   GAME LOOP
============================================================ */
function loop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
  lastTime = timestamp;
  const time = timestamp / 1000;

  update(dt, time);
  render(time);

  requestAnimationFrame(loop);
}

requestAnimationFrame((timestamp) => {
  lastTime = timestamp;
  loop(timestamp);
});
</script>
