<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>냠냠 틱택토</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#0d0f14;touch-action:none}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
'use strict';
// ===== 화면 구조 (세균전·리버시·사목과 동일) =====
// 실제 캔버스: 1170×2080
// 세로모드: 논리 화면 1170×2080, 회전 없음 (기본) / 가로모드: 논리 화면 2080×1170, 오른쪽 90° 회전
const CW = 1170, CH = 2080;
let orient = 'port';
let LW = CW, LH = CH;

// ===== 판 · 젤리 =====
const N = 3, CELL = 300;
let BX = 0, BY = 0;
const TAU = Math.PI * 2;
const FONT = '-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';
const BLUE = 1, ORG = 2;
const SIZE_R = [0, 56, 86, 116];                      // 아기 / 큰 / 왕관 젤리 반지름
const SIZE_NAME = ['', '아기 젤리', '큰 젤리', '왕관 젤리'];
const JEL = {
  1: { body: '#3f9cff', light: '#d2ebff', dark: '#1d5fb8', rim: '#0e3a75', accent: '#5ab0ff', name: '1P', color: '파랑' },
  2: { body: '#ff9a2e', light: '#ffe3bf', dark: '#c4610c', rim: '#7a3a06', accent: '#ffa94d', name: '2P', color: '주황' }
};

const canvas = document.getElementById('game');
canvas.width = CW; canvas.height = CH;
const ctx = canvas.getContext('2d');

// ===== 레터박스 스케일링 =====
function fit() {
  const s = Math.min(window.innerWidth / CW, window.innerHeight / CH);
  canvas.style.width = Math.floor(CW * s) + 'px';
  canvas.style.height = Math.floor(CH * s) + 'px';
}
addEventListener('resize', fit);
addEventListener('orientationchange', () => setTimeout(fit, 150));
fit();

// iOS 스크롤/확대 방지
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

// ===== 룰 =====
// 판: 칸 9개, 칸마다 젤리 더미(아래 → 위). 맨 위 젤리만 보이고, 더 큰 젤리만 위에 올릴 수 있음
// 쉬운 규칙: 손에 든 젤리 놓기만 / 원래 규칙: 놓기 + 판 위 내 젤리(맨 위) 옮기기
const LINES = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
const topOf = (b, i) => b[i].length ? b[i][b[i].length - 1] : null;
const canPut = (b, i, s) => { const t = topOf(b, i); return !t || t.s < s; };
const winLinesOf = (b, p) => LINES.filter(L => L.every(i => { const t = topOf(b, i); return t && t.p === p; }));

// 둘 수 있는 수: { from: -1(손) 또는 칸 번호, s: 크기, to: 칸 번호 }
function legalMoves(b, hands, p, rule) {
  const out = [];
  for (let s = 1; s <= 3; s++) if (hands[p][s] > 0) for (let i = 0; i < 9; i++) if (canPut(b, i, s)) out.push({ from: -1, s, to: i });
  if (rule === 'full') for (let f = 0; f < 9; f++) {
    const t = topOf(b, f);
    if (!t || t.p !== p) continue;
    for (let i = 0; i < 9; i++) if (i !== f && canPut(b, i, t.s)) out.push({ from: f, s: t.s, to: i });
  }
  return out;
}
let nextId = 1;
function applyMove(b, hands, m, p) {
  let pc;
  if (m.from < 0) { hands[p][m.s]--; pc = { p, s: m.s, id: nextId++ }; }
  else pc = b[m.from].pop();
  b[m.to].push(pc);
}
// 판정: 옮긴 뒤의 판 기준. 나와 상대가 동시에 3줄이면 옮긴 사람 승리
function judge(b, mover) {
  const wm = winLinesOf(b, mover), wo = winLinesOf(b, 3 - mover);
  if (wm.length) return { winner: mover, lines: wm, reveal: false };
  if (wo.length) return { winner: 3 - mover, lines: wo, reveal: true };   // 옮기다 숨어 있던 상대 젤리가 드러나 상대 완성
  return null;
}
const stateKey = (b, hands, p) => b.map(st => st.map(q => q.p * 10 + q.s).join(',')).join('|') + '/' + hands[1].join('') + hands[2].join('') + '/' + p;
// ===== 룰 끝 =====

// ===== 상태 =====
let rule = 'easy', mode = 'pvp';
let scene = 'title', sceneTime = 0, cpuAt = 0, confirmQuit = false, confirmAt = 0;
let wins = { 1: 0, 2: 0 };
let aiWorker = null, cpuReq = 0, cpuResult = null;   // 아주 어려움: 백그라운드 계산   // 이긴 판 수 (다시하기는 이어서, 새로 고르면 0부터)
function go(sc) { if (sc === 'title' || sc === 'mode') cutSounds(); scene = sc; sceneTime = performance.now(); confirmQuit = false; sel = null; press = null; }
const busy = () => !!fx || !!intro || performance.now() < fxUntil;
const isCpuTurn = () => scene === 'game' && mode === 'cpu' && turn === ORG && !gameOver && !busy();
const canPlay = () => scene === 'game' && !gameOver && !confirmQuit && !busy() && !(mode === 'cpu' && turn === ORG);

// ===== 설정 저장 (화면 방향 · 음량 · 규칙 · 난이도) =====
const load = (k, ok) => { try { const v = localStorage.getItem('nyamnyam_' + k); return ok(v) ? v : null; } catch (e) { return null; } };
const save = (k, v) => { try { localStorage.setItem('nyamnyam_' + k, v); } catch (e) {} };
const RULES = { easy: ['쉬운 규칙', '#5aff96'], full: ['원래 규칙', '#ffa94d'] };
const DIFFS = { easy: ['쉬움', '#5aff96'], normal: ['보통', '#ffd23c'], hard: ['어려움', '#ff5a6e'], expert: ['아주 어려움', '#c49bff'] };
rule = load('rule', v => !!RULES[v]) || rule;
let diff = load('diff', v => !!DIFFS[v]) || 'normal';
orient = load('orient', v => v === 'land' || v === 'port') || orient;
const savedVol = load('vol', v => v === '0' || v === '1' || v === '2');
let vol = savedVol === null ? 2 : +savedVol;   // 0 끔 / 1 작게 / 2 크게

// ===== 버튼 (위치·글자 위치는 applyLayout에서 화면 방향별로 px 단위 지정) =====
const btn = (id, label, extra = {}) => ({ id, label, x: 0, y: 0, w: 0, h: 0, iy: 0, ly: 0, sy: 0, ...extra });
const MODE_BTNS = [btn('cpu', 'CPU전', { sub: '1P vs CPU' }), btn('pvp', '1P vs 2P', { sub: '둘이서 대전' })];
const HOW_BTN = [btn('howto', '게임방법')];
const RULE_BTNS = [btn('easy', '쉬운 규칙', { sub: '젤리를 놓기만 해요' }), btn('full', '원래 규칙', { sub: '판 위 젤리도 옮겨요' })];
const DIFF_BTNS = [
  btn('easy', '쉬움', { sub: '살살 해줄게~', stars: 1 }),
  btn('normal', '보통', { sub: '한판 붙어보자!', stars: 2 }),
  btn('hard', '어려움', { sub: '봐주는 거 없음', stars: 3 }),
  btn('expert', '아주 어려움', { sub: '각오는 됐겠지?', stars: 4 })
];
const BACK_BTN = [btn('back', '◀ 뒤로')];
const RESULT_BTNS = [btn('retry', '다시하기'), btn('title', '타이틀로')];
const ORIENT_BTNS = [btn('land', '가로모드'), btn('port', '세로모드')];
const QUIT_BTNS = [btn('yes', 'Yes'), btn('no', 'No')];
const VOLB = { x: 0, y: 0, r: 36 }, HOMEB = { x: 0, y: 0, r: 36 };
const hitBtn = (bs, x, y) => bs.find(b => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h);
let board, hands, turn, gameOver, endTime, winner, winL, reveal, drawWhy, lastMove, toast, toastTime, seen;
let sel = null;     // 고른 젤리: { from: -1(손) 또는 칸 번호, s }
// 4단계 연출: 움직이는 젤리 / 선공 정하기 / 연출 잠금 / 만화 글자 / 막기 / 두근두근(바로 이길 수 있는 자리)
let fx = null, intro = null, fxUntil = 0, pops = [], blockFx = null, threat = { 1: null, 2: null };
let winFx = null;   // 5단계: 승리 컷씬 + 승리 모션 / 무승부
let press = null;   // 누르는 중: { x0, y0, x, y, moved, wasSel, cancelTap }
const RESULT_DELAY = 900;
const resultAt = () => winFx ? winFx.cut + winFx.dur : RESULT_DELAY;   // 컷씬 + 모션이 끝난 뒤 결과
const pname = p => (mode === 'cpu' && p === ORG) ? 'CPU' : JEL[p].name;
const who = p => mode === 'cpu' ? pname(p) : JEL[p].color;   // 결과 화면에 쓰는 이름
// 선공: CPU전은 플레이어(파랑)가 항상 먼저, 1P vs 2P는 매 판 무작위
const firstPlayer = () => mode === 'cpu' ? BLUE : (Math.random() < 0.5 ? BLUE : ORG);

function reset() {
  board = Array.from({ length: 9 }, () => []);
  hands = { 1: [0, 2, 2, 2], 2: [0, 2, 2, 2] };   // [-, 아기, 큰, 왕관]
  turn = firstPlayer();
  gameOver = false; endTime = 0; winner = 0; winL = null; reveal = false; drawWhy = '';
  lastMove = null; sel = null; press = null; seen = {}; cpuAt = 0; confirmQuit = false;
  cpuReq++; cpuResult = null;   // 이전 판의 계산 결과는 버림
  seen[stateKey(board, hands, turn)] = 1;
  fx = null; fxUntil = 0; pops = []; blockFx = null; winFx = null; threat = { 1: null, 2: null }; toast = '';
  intro = { at: performance.now(), first: turn };   // 선공 정하기 옥신각신 (CPU전은 플레이어가 항상 이김)
  cutSounds(); introSfx();
}
function newMatch() { wins = { 1: 0, 2: 0 }; reset(); }   // 모드·규칙·난이도를 새로 골랐을 때
function showToast(msg) { toast = msg; toastTime = performance.now(); }

// 수를 두면 판은 바로 바뀌고, 화면은 연출로 보여 준 뒤 finishMove에서 판정
// start: 끌어서 놓았을 때 손가락 위치 (없으면 손 자리 · 칸에서 출발)
function doMove(m, start) {
  const p = turn, st = board[m.to];
  const eaten = st.length ? st[st.length - 1] : null;
  const x0 = start ? start.x : m.from < 0 ? SLOTS[p][m.s].x : cellX(m.from);
  const y0 = start ? start.y : m.from < 0 ? SLOTS[p][m.s].y - 26 : cellY(m.from) - 46;
  applyMove(board, hands, m, p);
  const pc = topOf(board, m.to), revealed = m.from >= 0 ? topOf(board, m.from) : null;
  lastMove = { from: m.from, to: m.to };
  sel = null; press = null;
  fx = makeFx(p, pc, m, x0, y0, eaten, revealed);
  moveSfx(fx);
}
function finishMove(f) {
  const now = performance.now(), p = f.p, o = 3 - p;
  fx = null;
  const j = judge(board, p);
  if (j) { gameOver = true; winner = j.winner; winL = j.lines; reveal = j.reveal; endTime = now; wins[j.winner]++; threat = { 1: null, 2: null }; winFx = makeWinFx(j.winner, j.lines, j.reveal ? f.from : -1, now); winSound(winFx); return; }
  const nt = calcThreats(), po = f.prevThreat[o], pm = f.prevThreat[p];
  if (po && (!nt[o] || nt[o].spots.size < po.spots.size)) {   // 상대의 승리 자리를 없앰 → 막았다!
    blockFx = { cell: f.to, at: now, cells: [...po.cells] };
    fxUntil = now + BLOCK_MS;
    SFX.block();
    addPop('막았다!', cellX(f.to), cellY(f.to) - CELL * 0.62, 68, '#7fd4ff', BLOCK_MS, -0.06);
  }
  if (nt[p] && (!pm || [...nt[p].spots].some(i => !pm.spots.has(i)))) {   // 바로 이길 수 있는 자리가 새로 생김
    if (!blockFx || blockFx.at !== now) SFX.heart();
    addPop('두근두근!', cellX(f.to), cellY(f.to) - CELL * (blockFx && blockFx.at === now ? 0.98 : 0.62), 54, '#ff7ad9', 800, 0.06);
  }
  threat = nt;
  if (legalMoves(board, hands, o, rule).length) turn = o;
  else if (legalMoves(board, hands, p, rule).length) { showToast(`${JEL[o].color} 놓을 곳 없음 · PASS`); SFX.pass(); }
  else return endDraw('더 놓을 젤리가 없어요');
  if (rule === 'full') {   // 같은 판 모양(손에 든 젤리·차례 포함)이 3번 나오면 무승부
    const k = stateKey(board, hands, turn);
    seen[k] = (seen[k] || 0) + 1;
    if (seen[k] >= 3) endDraw('같은 모양이 3번 나왔어요');
  }
}
// 바로 이길 수 있는 자리: { spots: 놓으면 이기는 칸, cells: 그때 같이 줄이 되는 내 젤리 칸 }
function calcThreats() {
  const out = { 1: null, 2: null }, b = toCode(board), h = handCode(hands), full = rule === 'full';
  for (const p of [BLUE, ORG]) {
    const spots = new Set(), cells = new Set();
    for (const m of aiMoves(b, h, p, full)) {
      aiDo(b, h, m, p);
      if (aiResult(b, p) > 0) {
        const t = m % 10;
        spots.add(t);
        for (const L of LINES) if (L.includes(t) && L.every(i => TOPP[b[i]] === p)) for (const i of L) if (i !== t) cells.add(i);
      }
      aiUndo(b, h, m, p);
    }
    if (spots.size) out[p] = { spots, cells };
  }
  return out;
}
function endDraw(why) { gameOver = true; winner = 0; drawWhy = why; endTime = performance.now(); winFx = { type: 'draw', at: endTime, cut: 0, dur: WMO.draw }; winSound(winFx); }

// ===== 좌표 · 배치 =====
const cellX = i => BX + (i % 3) * CELL + CELL / 2;
const cellY = i => BY + Math.floor(i / 3) * CELL + CELL / 2;
function cellAt(x, y) {
  const c = Math.floor((x - BX) / CELL), r = Math.floor((y - BY) / CELL);
  return c >= 0 && c < N && r >= 0 && r < N ? r * N + c : null;
}
const SLOTS = { 1: [], 2: [] };   // 손에 든 젤리 자리 [크기] = { x, y }
const PANEL = { 1: null, 2: null };
// setBtn(버튼, x, y, w, h, 아이콘 y, 제목 y, 부제 y) — 글자 위치는 버튼 위쪽 기준 px
function setBtn(b, x, y, w, h, iy = 0, ly = h / 2 + 4, sy = 0) { Object.assign(b, { x, y, w, h, iy, ly, sy }); }
function applyLayout() {
  const oW = LW, oH = LH;
  [LW, LH] = orient === 'port' ? [CW, CH] : [CH, CW];
  BX = (LW - N * CELL) / 2; BY = (LH - N * CELL) / 2;
  for (const g of BG) { g.x *= LW / oW; g.y *= LH / oH; }
  if (orient === 'port') {   // 위 2P, 아래 1P (가로로 긴 패널: 왼쪽 글자 · 오른쪽 젤리)
    const x0 = BX - 50, w = N * CELL + 100;
    for (const [p, cy] of [[ORG, (BY - 30) / 2], [BLUE, (BY + N * CELL + 30 + LH) / 2]]) {
      PANEL[p] = { x: x0, y: cy - 170, w, h: 340, lx: x0 + 155, ly: cy, horiz: true };
      [470, 650, 900].forEach((x, k) => { SLOTS[p][k + 1] = { x, y: cy + 20 }; });
    }
  } else {                   // 왼쪽 1P, 오른쪽 2P (세로로 긴 패널: 위 글자 · 아래 젤리)
    for (const [p, cx] of [[BLUE, BX / 2], [ORG, LW - BX / 2]]) {
      PANEL[p] = { x: cx - 250, y: BY - 50, w: 500, h: N * CELL + 90, lx: cx, ly: 0, horiz: false };
      [478, 639, 906].forEach((y, k) => { SLOTS[p][k + 1] = { x: cx - 40, y }; });
    }
  }
  VOLB.x = LW - 50; VOLB.y = LH - 44;
  HOMEB.x = VOLB.x - 110; HOMEB.y = VOLB.y;
  const [m1, m2] = MODE_BTNS, [u1, u2] = RULE_BTNS, [r1, r2] = RESULT_BTNS, [o1, o2] = ORIENT_BTNS;
  setBtn(QUIT_BTNS[0], LW / 2 - 330, LH / 2 + 70, 300, 140); setBtn(QUIT_BTNS[1], LW / 2 + 30, LH / 2 + 70, 300, 140);
  if (orient === 'port') {
    setBtn(m1, 245, 480, 680, 480, 150, 320, 415);
    setBtn(m2, 245, 1060, 680, 480, 150, 320, 415);
    setBtn(HOW_BTN[0], 245, 1640, 680, 150);
    setBtn(u1, 245, 480, 680, 480, 150, 320, 415);
    setBtn(u2, 245, 1060, 680, 480, 150, 320, 415);
    DIFF_BTNS.forEach((b, i) => setBtn(b, 245, 420 + i * 325, 680, 300, 64, 165, 255));
    setBtn(BACK_BTN[0], 345, 1760, 480, 130);
    setBtn(r1, 345, 1300, 480, 150); setBtn(r2, 345, 1490, 480, 150);
    setBtn(o1, 810, 1350, 310, 140); setBtn(o2, 810, 1530, 310, 140);
  } else {
    setBtn(m1, 280, 330, 680, 480, 150, 320, 415);
    setBtn(m2, 1120, 330, 680, 480, 150, 320, 415);
    setBtn(HOW_BTN[0], 700, 900, 680, 130);
    setBtn(u1, 280, 330, 680, 480, 150, 320, 415);
    setBtn(u2, 1120, 330, 680, 480, 150, 320, 415);
    DIFF_BTNS.forEach((b, i) => setBtn(b, 115 + i * 470, 330, 440, 420, 120, 270, 370));
    setBtn(BACK_BTN[0], 800, 880, 480, 130);
    setBtn(r1, 520, 800, 480, 150); setBtn(r2, 1080, 800, 480, 150);
    setBtn(o1, 1720, 395, 310, 140); setBtn(o2, 1720, 575, 310, 140);
  }
}

// ===== 입력 =====
// 손에 든 젤리: 탭해서 고른 뒤 칸 탭 / 또는 끌어서 칸에 놓기
// 판 위 젤리(원래 규칙): 내 젤리 탭 → 칸 탭 / 또는 끌기. 같은 자리에 다시 내려놓으면 취소
function toLogical(e) {
  const rect = canvas.getBoundingClientRect();
  const px = (e.clientX - rect.left) * (CW / rect.width);
  const py = (e.clientY - rect.top) * (CH / rect.height);
  return orient === 'land' ? [py, CW - px] : [px, py];   // 실제 (px,py) → 논리 (x,y)
}
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  onDown(...toLogical(e));
});
canvas.addEventListener('pointermove', e => onMove(...toLogical(e)));
canvas.addEventListener('pointerup', e => onUp(...toLogical(e)));
canvas.addEventListener('pointercancel', () => { press = null; });

const isTarget = i => sel && i !== sel.from && canPut(board, i, sel.s);
function handHit(p, x, y) {
  for (let s = 1; s <= 3; s++) { const q = SLOTS[p][s]; if (Math.hypot(x - q.x, y - q.y) < SIZE_R[s] + 35) return s; }
  return 0;
}
function setVol(v) { vol = v; save('vol', v); if (master) master.gain.setValueAtTime(VOLS[v], AC.currentTime); }
function warn(msg) { showToast(msg); SFX.err(); }
function onDown(x, y) {
  const now = performance.now();
  if (Math.hypot(x - VOLB.x, y - VOLB.y) < 55) { setVol((vol + 2) % 3); SFX.click(); return; }   // 크게→작게→끔
  if (confirmQuit) {   // 게임 포기 확인창: Yes / No 만 받음
    if (now - confirmAt < 250) return;
    const b = hitBtn(QUIT_BTNS, x, y);
    if (b && b.id === 'yes') { SFX.click(); go('title'); }
    else if (b) { confirmQuit = false; SFX.cancel(); }
    return;
  }
  if (scene !== 'title' && Math.hypot(x - HOMEB.x, y - HOMEB.y) < 55) {   // 홈: 게임 중이면 확인창, 그 외에는 바로 타이틀
    SFX.click();

  }
}

// ===== CPU AI =====
// 판을 칸마다 6비트 숫자로 압축: 크기 s(1~3)마다 2비트 = 그 크기 젤리의 주인 (0 없음 / 1 파랑 / 2 주황)
// 손에 든 젤리: [파랑 아기·큰·왕관, 주황 아기·큰·왕관] / 수 = from*100 + 크기*10 + to (from 9 = 손)
const WIN = 1000;
const TOPS = new Int8Array(64), TOPP = new Int8Array(64);   // 칸 숫자 → 맨 위 젤리 크기 / 주인
for (let c = 0; c < 64; c++) for (let z = 3; z >= 1; z--) { const o = (c >> (2 * (z - 1))) & 3; if (o) { TOPS[c] = z; TOPP[c] = o; break; } }
function toCode(b) { const out = new Int8Array(9); for (let i = 0; i < 9; i++) for (const q of b[i]) out[i] |= q.p << (2 * (q.s - 1)); return out; }

function hIdx(p, z) { return (p - 1) * 3 + z - 1; }
function aiWins(b, p) {
  for (const L of LINES) if (TOPP[b[L[0]]] === p && TOPP[b[L[1]]] === p && TOPP[b[L[2]]] === p) return true;
  return false;
}
function aiMoves(b, h, p, full) {   // 큰 젤리부터 (탐색 순서)
  const out = [];
  for (let z = 3; z >= 1; z--) if (h[hIdx(p, z)] > 0) for (let i = 0; i < 9; i++) if (TOPS[b[i]] < z) out.push(900 + z * 10 + i);
  if (full) for (let f = 0; f < 9; f++) {
    const c = b[f], tz = TOPS[c];
    if (!tz || TOPP[c] !== p) continue;
    for (let i = 0; i < 9; i++) if (i !== f && TOPS[b[i]] < tz) out.push(f * 100 + tz * 10 + i);
  }
  return out;
}
function aiDo(b, h, m, p) { const f = m / 100 | 0, z = (m / 10 | 0) % 10, t = m % 10; if (f === 9) h[hIdx(p, z)]--; else b[f] &= ~(3 << (2 * (z - 1))); b[t] |= p << (2 * (z - 1)); }
function aiUndo(b, h, m, p) { const f = m / 100 | 0, z = (m / 10 | 0) % 10, t = m % 10; b[t] &= ~(3 << (2 * (z - 1))); if (f === 9) h[hIdx(p, z)]++; else b[f] |= p << (2 * (z - 1)); }
// 둔 사람 기준: 1 이김 / -1 짐 (옮기다 숨은 상대 젤리가 드러나 상대 줄 완성) / 0 계속 — 동시 3줄이면 옮긴 사람 승리
function aiResult(b, p) { return aiWins(b, p) ? 1 : aiWins(b, 3 - p) ? -1 : 0; }
// 평가: 상대가 안 막은 줄의 내 젤리 수 (2개 +6, 1개 +1) + 가운데 +3 + 손에 아껴 둔 왕관 젤리 +1.5

  const o = 3 - p; let v = 0;

    if (!n) v += m === 2 ? 6 : m; else if (!m) v -= n === 2 ? 6 : n;
  }

}
// 탐색: 1수, 2수… maxDepth까지 깊이를 늘려 가며 읽음 (budget ms가 지나면 그때까지의 최선)
function aiSearch(b0, h0, p, full, maxDepth, budget) {

  let nodes = 0;
  function nm(q, d, a, be, ply) {
    if ((++nodes & 1023) === 0 && Date.now() > deadline) throw TO;
    const ms = aiMoves(b, h, q, full);
    if (!ms.length) return aiMoves(b, h, 3 - q, full).length ? -nm(3 - q, d, -be, -a, ply) : 0;   // 패스 / 무승부
    for (const m of ms) { aiDo(b, h, m, q); const r = aiResult(b, q); aiUndo(b, h, m, q); if (r > 0) return WIN - ply; }   // 바로 이기는 수
    if (d <= 0) return aiEval(b, h, q);
    let best = -1e9;
    for (const m of ms) {
      aiDo(b, h, m, q);
      const r = aiResult(b, q), v = r < 0 ? -(WIN - ply) : -nm(3 - q, d - 1, -be, -a, ply + 1);
      aiUndo(b, h, m, q);
      if (v > best) best = v;

    }

  }

  for (const m of root) { aiDo(b, h, m, p); const r = aiResult(b, p); aiUndo(b, h, m, p); if (r > 0) return { m, depth: 1, ms: 0 }; }
  const key = {};   // 가운데 · 큰 젤리 우선 + 약간의 무작위 (매번 같은 수만 두지 않도록)
  for (const m of root) key[m] = (m % 10 === 4 ? -2 : 0) - ((m / 10 | 0) % 10) * 0.5 + (m < 900 ? 0.8 : 0) + Math.random();

        aiUndo(b, h, m, p);
        if (v > a || bm === null) { a = v; bm = m; }
      }
      best = bm; done = d;
      if (Math.abs(a) >= WIN - 40) break;   // 승패가 보이면 그만 읽음
    } catch (e) { if (e !== TO) throw e; break; }
  }
  return { m: best, depth: done, ms: Date.now() - t0 };
}

// 쉬움: 이기는 수도 40%는 놓치고, 위험을 피하는 것도 가끔만 (아이가 이길 수 있게). 판 위 젤리는 거의 안 옮김
function cpuEasy(b, h, p, full) {
  const ms = aiMoves(b, h, p, full), o = 3 - p;
  const after = (m, fn) => { aiDo(b, h, m, p); const r = fn(); aiUndo(b, h, m, p); return r; };
  const oppWins = () => aiMoves(b, h, o, full).some(m2 => { aiDo(b, h, m2, o); const r = aiResult(b, o); aiUndo(b, h, m2, o); return r > 0; });
  const win = ms.find(m => after(m, () => aiResult(b, p)) > 0);
  if (win != null && Math.random() < 0.6) return win;
  if (Math.random() < 0.35) {
    const safe = ms.filter(m => after(m, () => aiResult(b, p) >= 0 && !oppWins()));
    if (safe.length) return safe[Math.random() * safe.length | 0];
  }
  const hand = ms.filter(m => m >= 900), pool = hand.length && Math.random() < 0.85 ? hand : ms;
  return pool[Math.random() * pool.length | 0];
}
// 보통: 이기는 수 → 상대에게 바로 이길 자리를 주지 않는 수 중 모양이 좋은 수 (1수만 봄)
function cpuNormal(b, h, p, full) {
  const ms = aiMoves(b, h, p, full), o = 3 - p;
  let best = ms[0], bs = -Infinity;
  for (const m of ms) {
    aiDo(b, h, m, p);
    const r = aiResult(b, p);
    let sc = r > 0 ? 1e6 : r < 0 ? -1e6 : 0;
    if (!r) {
      const threat = aiMoves(b, h, o, full).some(m2 => { aiDo(b, h, m2, o); const x = aiResult(b, o); aiUndo(b, h, m2, o); return x > 0; });
      sc = (threat ? -1000 : 0) + aiEval(b, h, p) + Math.random() * 4;
    }
    aiUndo(b, h, m, p);
    if (sc > bs) { bs = sc; best = m; }
  }

}
// 어려움: 5수 앞까지 (최대 0.6초) / 아주 어려움: 0.75초 안에서 최대한 깊이 — 둘 다 백그라운드 계산
const SEARCH = { hard: [5, 600], expert: [40, 750] };
function aiChoose(b, h, p, level, full, budget) {
  if (level === 'easy') return cpuEasy(b, h, p, full);
  if (level === 'normal') return cpuNormal(b, h, p, full);
  const [d, ms] = SEARCH[level];
  return aiSearch(b, h, p, full, d, budget || ms).m;
}
// ===== CPU AI 끝 =====

try {   // 아주 어려움 계산은 Web Worker에서 → 생각하는 동안에도 화면이 멈추지 않음
  const src = [
    `const WIN=${WIN},LINES=${JSON.stringify(LINES)},TOPS=Int8Array.from(${JSON.stringify(Array.from(TOPS))}),TOPP=Int8Array.from(${JSON.stringify(Array.from(TOPP))});`,
    ...[hIdx, aiWins, aiMoves, aiDo, aiUndo, aiResult, aiEval, aiSearch].map(f => f.toString()),
    'onmessage=e=>postMessage({id:e.data.id,r:aiSearch(Int8Array.from(e.data.b),Int8Array.from(e.data.h),e.data.p,e.data.full,e.data.depth,e.data.budget)});'
  ].join('\n');
  aiWorker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
  aiWorker.onmessage = e => { if (e.data.id === cpuReq) cpuResult = e.data.r; };
  aiWorker.onerror = () => { aiWorker = null; };   // 실패하면 직접 계산
} catch (e) { aiWorker = null; }

const decodeMove = m => m == null ? null : { from: (m / 100 | 0) === 9 ? -1 : m / 100 | 0, s: (m / 10 | 0) % 10, to: m % 10 };
function updateCpu(now) {
  if (!isCpuTurn()) return;
  if (confirmQuit) { if (cpuAt) cpuAt = Math.max(cpuAt, now + 300); return; }   // 확인창 동안 대기
  const full = rule === 'full';
  if (!cpuAt) {
    cpuAt = now + 500 + Math.random() * 500;   // 0.5~1초 생각
    if (SEARCH[diff]) {
      cpuReq++; cpuResult = null;
      const [depth, budget] = SEARCH[diff];
      if (aiWorker) aiWorker.postMessage({ id: cpuReq, b: Array.from(toCode(board)), h: Array.from(handCode(hands)), p: ORG, full, depth, budget });
    }
    return;
  }
  if (now < cpuAt) return;
  let m;
  if (SEARCH[diff]) {
    if (aiWorker && !cpuResult) return;   // 아직 계산 중 (계속 '생각 중...')
    m = cpuResult ? cpuResult.m : aiChoose(toCode(board), handCode(hands), ORG, diff, full, 250);   // 백그라운드를 못 쓰면 0.25초만 직접
  } else m = aiChoose(toCode(board), handCode(hands), ORG, diff, full);
  cpuAt = 0; cpuResult = null;
  const mv = decodeMove(m), legal = legalMoves(board, hands, ORG, rule);
  const ok = mv && legal.find(x => x.from === mv.from && x.s === mv.s && x.to === mv.to);
  if (ok) doMove(ok); else if (legal.length) doMove(legal[0]);   // 안전장치
}

// ===== 젤리 연출 =====
const BLOCK_MS = 700;
// 먹기 연출 (먹는 젤리 크기 · 먹히는 젤리 크기): open 입 벌림 / drop 덮치기 / after 꿀꺽 뒤 (ms)
const EAT = {
  21: { open: 140, drop: 150, after: 380, word: '꿀꺽!', col: '#ffd23c' },
  31: { open: 60, drop: 110, after: 300, word: '한입에 냠!', col: '#ff7ad9' },
  32: { open: 190, drop: 170, after: 650, word: '와앙~', col: '#ffa94d', chew: true }
};
const REV = { at: 60, dur: 480 };   // 옮길 때 배 속에 있던 젤리가 '뿅'
const easeIn = v => Math.pow(clamp01(v), 2);
function makeFx(p, pc, m, x0, y0, eaten, revealed) {
  const R = SIZE_R[pc.s], x1 = cellX(m.to), y1 = eaten ? cellY(m.to) - R * 0.95 : cellY(m.to);
  const dist = Math.hypot(x1 - x0, y1 - y0), fly = Math.max(280, Math.min(520, 260 + dist * 0.22));
  const E = eaten ? EAT[pc.s * 10 + eaten.s] : null;
  const dur = fly + (E ? E.open + E.drop + E.after : 260);
  return { p, pc, from: m.from, to: m.to, x0, y0, x1, y1, fly, eaten, E, revealed, revEnd: REV.at + REV.dur,
    dur, at: performance.now(), arc: 120 + dist * 0.12, prevThreat: threat };
}
function updateFx(now) {
  if (fx && now - fx.at >= fx.dur) finishMove(fx);
  if (intro && now - intro.at >= INTRO_MS) { showToast(`${JEL[intro.first].color} 먼저!`); intro = null; }
}
function ring(x, y, age, life, r0, r1, col) {
  if (age < 0 || age > life) return;
  const k = age / life;
  ctx.strokeStyle = col.replace('A', String(0.75 * (1 - k))); ctx.lineWidth = 9 * (1 - k) + 2;
  ctx.beginPath(); ctx.arc(x, y, r0 + (r1 - r0) * easeOut(k), 0, TAU); ctx.stroke();
}
function drawFx(f, e, t) {
  const pc = f.pc, R = SIZE_R[pc.s], cx = cellX(f.to), cy = cellY(f.to);
  // 1) 옮긴 자리: 배 속에 있던 젤리가 '뿅' 튀어나옴
  if (f.revealed && e < f.revEnd) {
    const k = clamp01((e - REV.at) / REV.dur), bellyY = cellY(f.from) + R * 0.36;
    const y = bellyY + (cellY(f.from) - bellyY) * easeOut(k) - Math.sin(k * Math.PI) * 46;
    const sc = k < 0.6 ? 0.8 + 0.35 * easeOut(k / 0.6) : 1.15 - 0.15 * easeOut((k - 0.6) / 0.4);
    drawJelly(cellX(f.from), y, f.revealed.p, f.revealed.s, t, f.revealed.id, k < 0.5 ? 'scared' : 'normal', { k: sc, alpha: 0.85 });
  }
  if (f.revealed) {
    ring(cellX(f.from), cellY(f.from), e - REV.at, 420, 30, CELL * 0.5, 'rgba(255,255,255,A)');
    popText('뿅!', cellX(f.from) + CELL * 0.22, cellY(f.from) - CELL * 0.4, e - REV.at, 600, 64, '#ffffff', 0.12);
  }
  // 2) 먹힐 젤리: 덜덜 떨다가 배 속으로
  const E = f.E, le = e - f.fly;
  if (f.eaten) {
    const bellyY = cy + R * 0.36, dk = E ? clamp01((le - E.open) / E.drop) : 0;
    const shake = dk < 1 ? Math.sin(t * 70) * (2 + 4 * clamp01(e / f.fly)) : 0;
    drawJelly(cx + shake, cy + (bellyY - cy) * easeIn(dk), f.eaten.p, f.eaten.s, t, f.eaten.id, 'scared',
      { k: 1 - 0.2 * dk, alpha: dk >= 1 ? 1 : 0.8, shadow: dk < 1 });
  }
  // 3) 움직이는 젤리: 포물선으로 날아감 → (먹기) 입 벌림 · 덮치기 · 꿀꺽 / (그냥) 말랑 착지
  let x, y, face = 'happy', sx = 1, sy = 1, rot = 0;
  if (e < f.fly) {
    const k = e / f.fly, u = k * k * (3 - 2 * k);
    x = f.x0 + (f.x1 - f.x0) * u; y = f.y0 + (f.y1 - f.y0) * u - Math.sin(k * Math.PI) * f.arc;
    sx = 0.9; sy = 1.12; rot = (f.x1 - f.x0) * 0.0003 * Math.sin(k * Math.PI);
  } else if (!E) {   // 말랑 착지

  } else if (le < E.open) {   // 입 크게 벌림
    const k = le / E.open;
    x = cx; y = f.y1 - 10 * Math.sin(k * Math.PI / 2); face = 'open'; sx = 0.94; sy = 1.1;
  } else if (le < E.open + E.drop) {   // 덮치기
    const k = easeIn((le - E.open) / E.drop);
    x = cx; y = f.y1 - 10 + (cy - f.y1 + 10) * k; face = 'open'; sx = 0.92 + 0.08 * k; sy = 1.12 - 0.1 * k;
  } else {   // 꿀꺽 → (왕관이 큰 젤리를 먹으면) 우물우물
    const a = le - E.open - E.drop, k = clamp01(a / 170), sq = Math.sin(k * Math.PI) * 0.24;
    x = cx; y = cy; face = a < 170 ? 'happy' : E.chew ? 'munch' : 'happy';
    sx = 1 + sq; sy = 1 - sq;
    if (E.chew && a >= 170) { const c = Math.sin((a - 170) / 160 * Math.PI * 2); sx = 1 + 0.07 * c; sy = 1 - 0.07 * c; }
    else if (a >= 170) { const g = Math.sin(clamp01((a - 170) / 180) * Math.PI) * 0.1; sx = 1 + g; sy = 1 + g; }   // 꿀꺽 부풀기
  }
  drawJelly(x, y, pc.p, pc.s, t, pc.id, face, { alpha: 0.8, shadow: e >= f.fly, sx, sy, rot });
  if (E) {
    const a = le - E.open - E.drop;
    popText(E.word, cx, cy - CELL * 0.62, a, E.chew ? 420 : 560, 66, E.col, -0.08);
    if (E.chew) popText('우물우물', cx, cy - CELL * 0.62, a - 330, E.after - 300, 54, '#ffffff', 0.06);
  }
}
// 바로 이길 수 있는 자리: 그 색 점선 테두리 + 두근두근 하트 (아이도 막을 곳을 알 수 있게)
function drawThreats(t) {
  const hb = heartBeat(t);
  for (const p of [BLUE, ORG]) {
    const th = threat[p];
    if (!th) continue;
    for (const i of th.spots) {
      const x = cellX(i), y = cellY(i), s = 1 + 0.1 * hb, both = threat[3 - p] && threat[3 - p].spots.has(i);
      ctx.strokeStyle = JEL[p].accent; ctx.lineWidth = 7; ctx.setLineDash([16, 14]); ctx.lineDashOffset = -t * 40 * (p === BLUE ? 1 : -1);
      rrect(x - CELL / 2 + (both && p === ORG ? 20 : 12), y - CELL / 2 + (both && p === ORG ? 20 : 12), CELL - (both && p === ORG ? 40 : 24), CELL - (both && p === ORG ? 40 : 24), 32);
      ctx.stroke(); ctx.setLineDash([]);

function addPop(txt, x, y, size = 54, col = '#ffffff', hold = 600, rot = -0.08) { pops.push({ txt, x, y, size, col, hold, rot, at: performance.now() }); }
// 두근: 0.9초에 두 번 '두-근' 하고 뛰는 박자 (0~1)

}

  ctx.fillStyle = col; ctx.fill(); ctx.restore();
}

// 말풍선: 톡 튀어나왔다가 사라짐
function bubble(txt, x, y, age, hold, size = 40) {
  if (age < 0 || age > hold) return;
  const k = age < 180 ? easeOut(age / 180) * (1 + 0.18 * Math.sin(age / 180 * Math.PI)) : 1;
  ctx.save(); ctx.globalAlpha = clamp01((hold - age) / 160);
  ctx.font = `800 ${size}px ${FONT}`;
  const w = ctx.measureText(txt).width + size * 1.1, h = size * 1.7, bx = Math.max(w / 2 + 12, Math.min(LW - w / 2 - 12, x));
  ctx.translate(bx, y + Math.sin(age * 0.008) * 3); ctx.scale(k, k);
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#111'; ctx.lineWidth = 4; ctx.lineJoin = 'round';
  rrect(-w / 2, -h / 2, w, h, h / 2); ctx.fill(); ctx.stroke();
  const tx = Math.max(-w / 2 + h / 2, Math.min(w / 2 - h / 2, x - bx));
  ctx.beginPath(); ctx.moveTo(tx - 13, h / 2 - 3); ctx.lineTo(tx, h / 2 + 20); ctx.lineTo(tx + 13, h / 2 - 3); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(tx - 13, h / 2); ctx.lineTo(tx, h / 2 + 20); ctx.lineTo(tx + 13, h / 2); ctx.stroke();
  ctx.fillStyle = '#111'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(txt, 0, 2);
  ctx.restore();
}

// ===== 선공 정하기: 두 왕관 젤리의 옥신각신 배치기 대결 (탭하면 건너뛰기) =====
const INTRO_MS = 2700;
const BUMPS = [950, 1300, 1650];   // 배치기 시각
function drawIntro(t, now) {
  const e = now - intro.at, win = intro.first, lose = 3 - win;
  const fade = clamp01(e / 200) * (1 - clamp01((e - INTRO_MS + 250) / 250));
  ctx.fillStyle = `rgba(0,0,0,${0.6 * fade})`; ctx.fillRect(-80, -80, LW + 160, LH + 160);
  ctx.save(); ctx.globalAlpha = fade;
  const cx = LW / 2, cy = LH / 2 + 40, K = 1.25, R = SIZE_R[3] * K, base = R + 120, contact = R * 0.92;
  const last = BUMPS[BUMPS.length - 1];
  for (const p of [BLUE, ORG]) {
    const sg = p === BLUE ? -1 : 1;
    let x = cx + sg * base, y = cy, sx = 1, sy = 1, rot = 0, face = 'angry';
    if (e < 260) x = cx + sg * (base + (LW / 2 + R) * (1 - easeOut(e / 260)));   // 양쪽에서 들어옴
    else if (e < BUMPS[0]) { const w = Math.sin(e * 0.02) * 0.06; sx = 1 + w; sy = 1 - w; x += -sg * Math.abs(Math.sin(e * 0.012)) * 18; }   // 씩씩
    for (const b of BUMPS) {   // 배치기: 다가가서 '뿌잉!' 하고 튕겨남
      const be = e - b;
      if (be < 0 || be >= 360 || (b === last && p === lose && be >= 230)) continue;
      if (be < 170) x = cx + sg * (base - (base - contact) * easeIn(be / 170));
      else if (be < 230) { x = cx + sg * contact; const q = Math.sin((be - 170) / 60 * Math.PI) * 0.2; sx = 1 - q; sy = 1 + q; }
      else x = cx + sg * (contact + (base - contact) * easeOut((be - 230) / 130));
    }
    const fe = e - last - 230;
    if (fe >= 0) {
      if (p === lose) {   // 진 젤리: 통통 튕겨 나가 어지러움
        const k = clamp01(fe / 650), far = base + 260;
        x = cx + sg * (contact + (far - contact) * easeOut(k)); y = cy - Math.sin(k * Math.PI) * 220 + (k >= 1 ? 0 : 0);
        rot = sg * k * TAU * 1.25; face = 'scared';
        if (k >= 1) { rot = sg * 0.35; const q = Math.sin(clamp01((fe - 650) / 200) * Math.PI) * 0.2; sx = 1 + q; sy = 1 - q; }
      } else {            // 이긴 젤리: 신나서 폴짝
        face = 'happy'; x = cx + sg * (contact + (base - contact) * easeOut(fe / 300)); y = cy - Math.abs(Math.sin(fe / 260 * Math.PI)) * 50 * (1 - clamp01((fe - 800) / 300));
      }
    }
    drawJelly(x, y, p, 3, t, p, face, { k: K, sx, sy, rot });
    if (fe >= 650 && p === lose) {   // 어지러운 별
      for (let i = 0; i < 3; i++) { const a = t * 6 + i * TAU / 3; drawStar(x + Math.cos(a) * R * 0.7, y - R * 1.35 + Math.sin(a) * R * 0.18, 16, 7, '#ffe14d'); }
    }
    if (fe >= 100 && p === win) {   // '선공!' 배지
      const k = easeOut((fe - 100) / 220), bw = 230, bh = 80, by = y - R * 1.85;
      ctx.save(); ctx.translate(x, by); ctx.scale(k, k);
      ctx.fillStyle = '#ffd23c'; rrect(-bw / 2, -bh / 2, bw, bh, bh / 2); ctx.fill();
      ctx.strokeStyle = '#7a5a00'; ctx.lineWidth = 5; rrect(-bw / 2, -bh / 2, bw, bh, bh / 2); ctx.stroke();
      ctx.fillStyle = '#111'; ctx.font = `900 50px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('선공!', 0, 3);
      ctx.restore();
    }
  }
  for (const b of BUMPS) {
    const be = e - b - 170;
    ring(cx, cy, be, 300, 30, R * 0.9, 'rgba(255,240,150,A)');
    popText(b === last ? '뿌잉~!!' : '뿌잉!', cx, cy - R * 1.5, be, 320, b === last ? 76 : 58, '#ffffff', b === BUMPS[1] ? 0.1 : -0.1);
  }
  bubble('내가 먼저!', cx - base, cy - R * 1.7, e - 280, 600, 44);
  bubble('아니야, 나야!', cx + base, cy - R * 1.7, e - 580, 520, 44);
  const msg = `${who(win)} 먼저!`;
  popText(msg, cx, cy + R * 1.75, e - last - 450, INTRO_MS - last - 450, 96, JEL[win].accent, 0);
  ctx.restore();
}

// ===== 승리 연출: 컷씬(1.4초) → 이은 방향별 승리 모션 → 결과 =====
// 가로: 젤리 기차 / 세로: 젤리 탑 점프 / 대각선: 젤리 미끄럼틀 / 두 줄 이상: 젤리 파티 / 숨은 젤리로 이김: '앗, 나왔다!' / 무승부: 으쓱
const WCUT = 1400;
const WC = { IN: 160, FACE: 110, GLINT: 300, ROAR: 430, STAMP: 580, OUT: 1180 };   // 컷씬 타이밍 (ms)
const WMO = { h: 2300, v: 2300, d: 2400, multi: 3800, draw: 1800 };               // 모션 길이 (ms)
const REVEAL_MS = 700;   // 숨은 젤리로 이겼을 때 컷씬 앞에 '앗, 나왔다!'
const WIN_WORDS = ['냠냠!!', '맛있다!!', '해냈다!!'];
const BAND_COL = { 1: ['#0e2f66', '#3f9cff'], 2: ['#6b3304', '#ff9a2e'] };
const RAINBOW = ['#ffd23c', '#ff7ad9', '#7fd4ff', '#9dff7a', '#ffa94d', '#c49bff', '#ff5a6e', '#5affd8'];
const frac = v => v - Math.floor(v);
const hsh = n => frac(Math.sin(n * 12.9898) * 43758.5453);

function makeWinFx(p, lines, revealFrom, now) {
  const ls = lines.map(L => L.slice());   // LINES 순서: 가로 왼→오, 세로·대각선 위→아래
  const kind = L => { const d = L[1] - L[0]; return d === 1 ? 'h' : d === 3 ? 'v' : 'd'; };
  const type = ls.length > 1 ? 'multi' : kind(ls[0]);
  const cells = new Set(), all = [];
  ls.forEach((L, li) => L.forEach((i, qi) => { if (!cells.has(i)) { cells.add(i); const pc = topOf(board, i); all.push({ i, li, qi, s: pc.s, id: pc.id }); } }));
  const pre = revealFrom >= 0 ? REVEAL_MS : 0;
  return { type, p, lines: ls, cells, all, at: now, pre, cut: pre + WCUT, dur: WMO[type], revealFrom,
    word: WIN_WORDS[Math.floor(Math.random() * WIN_WORDS.length)] };
}

function shout(txt, x, y, size, sc, fill, edge, rot, alpha) {
  if (sc <= 0 || alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sc, sc);
  ctx.font = `900 ${size}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.lineWidth = size * 0.3; ctx.strokeStyle = '#000'; ctx.strokeText(txt, 0, 0);
  ctx.lineWidth = size * 0.14; ctx.strokeStyle = edge; ctx.strokeText(txt, 0, 0);
  ctx.fillStyle = fill; ctx.fillText(txt, 0, 0);
  ctx.restore();
}
function glint4(x, y, r) {
  ctx.fillStyle = '#fff'; ctx.beginPath();
  ctx.moveTo(x, y - r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.quadraticCurveTo(x, y, x, y + r);
  ctx.quadraticCurveTo(x, y, x - r, y); ctx.quadraticCurveTo(x, y, x, y - r); ctx.fill();
}
// 얼굴 뒤 기운 (1P 빨간 불꽃 / 2P 노란 불꽃), 위쪽이 더 길게 타오름
function drawAura(R, t, p, power) {
  const cols = p === BLUE ? ['rgba(63,156,255,.9)', '#9fd0ff', '#ffffff'] : ['rgba(255,140,30,.9)', '#ffc27a', '#fff3e0'];
  for (let ly = 0; ly < 3; ly++) {
    ctx.fillStyle = cols[ly];
    ctx.beginPath();
    const n = 20;
    for (let i = 0; i <= n * 2; i++) {
      const a = i / (n * 2) * TAU;
      let rr = R * 0.97, lift = 0;
      if (i % 2 === 0) {
        const up = Math.max(0, -Math.sin(a)), fl = Math.sin(t * 24 + i * 1.7 + ly * 2) * 0.1;
        rr = R * (1 + (0.22 + 0.38 * up + fl) * power * (1 - ly * 0.32));
        lift = R * 0.08 * power;
      }
      const x = Math.cos(a) * rr, y = Math.sin(a) * rr - lift;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath(); ctx.fill();
  }
}


// ----- 승리 컷씬: 번쩍 → 띠 쾅 → 왕관 젤리 얼굴 클로즈업 + 기운 → 눈빛 번쩍 → 기합! → '냠냠 완성!!' 도장 쾅 → 퇴장 -----
function drawWinCut(f, ce, t) {
  const port = orient === 'port', k = JEL[f.p], bc = BAND_COL[f.p];
  const kin = easeOut(ce / WC.IN), kout = easeIn((ce - WC.OUT) / (WCUT - WC.OUT));
  ctx.fillStyle = `rgba(0,0,0,${0.6 * kin * (1 - kout)})`; ctx.fillRect(-80, -80, LW + 160, LH + 160);
  if (ce < 100) { ctx.fillStyle = `rgba(255,255,255,${0.6 * (1 - ce / 100)})`; ctx.fillRect(-80, -80, LW + 160, LH + 160); }
  const L = port
    ? { bh: 640, fx: 0, fy: -130, R: 205, tx: 0, ty: 225, tw: LW - 120, ts: 130, nx: -LW / 2 + 140, ny: -250, wx: 330, wy: -230, ws: 80 }
    : { bh: 400, fx: -LW / 2 + 360, fy: 0, R: 235, tx: 300, ty: 40, tw: LW - 840, ts: 150, nx: 300, ny: -155, wx: -LW / 2 + 630, wy: -150, ws: 92 };
  ctx.save();
  ctx.translate(LW / 2 + (kout - (1 - kin)) * LW * 1.4, LH / 2);
  ctx.rotate(-0.08);
  const bw = LW * 1.8, g = ctx.createLinearGradient(0, -L.bh / 2, 0, L.bh / 2);   // 띠
  g.addColorStop(0, bc[1]); g.addColorStop(0.5, bc[0]); g.addColorStop(1, bc[1]);
  ctx.fillStyle = g; ctx.fillRect(-bw / 2, -L.bh / 2, bw, L.bh);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(-bw / 2, -L.bh / 2 - 18, bw, 12); ctx.fillRect(-bw / 2, L.bh / 2 + 6, bw, 12);
  ctx.fillStyle = '#c49bff'; ctx.fillRect(-bw / 2, -L.bh / 2 - 30, bw, 6); ctx.fillRect(-bw / 2, L.bh / 2 + 24, bw, 6);
  ctx.save(); ctx.beginPath(); ctx.rect(-bw / 2, -L.bh / 2, bw, L.bh); ctx.clip();   // 집중선
  const pw = ce >= WC.ROAR ? 1 : 0.5, seed = Math.floor(ce / 45);
  ctx.strokeStyle = `rgba(255,255,255,${0.22 + 0.2 * pw})`; ctx.lineCap = 'round';
  for (let i = 0; i < 48; i++) {
    const fr = hsh(i + seed * 7.13), a = i / 48 * TAU + fr * 0.12, r0 = L.R * (1.25 + fr * 0.9), r1 = LW * 1.2;
    ctx.lineWidth = 2 + fr * 7 * pw;
    ctx.beginPath(); ctx.moveTo(L.fx + Math.cos(a) * r0, L.fy + Math.sin(a) * r0); ctx.lineTo(L.fx + Math.cos(a) * r1, L.fy + Math.sin(a) * r1); ctx.stroke();
  }
  ctx.restore();
  const fe = ce - WC.FACE, roar = ce >= WC.ROAR;   // 얼굴 클로즈업
  let pop = fe < 0 ? 0 : easeOut(fe / 200) * (1 + 0.12 * Math.sin(clamp01(fe / 320) * Math.PI));
  if (roar) pop *= 1 + 0.1 * (1 - clamp01((ce - WC.ROAR) / 220));
  pop *= 1 + kout * 0.4;
  const vib = roar && ce < WC.ROAR + 520 ? 6 : 0;
  if (pop > 0) {
    ctx.save(); ctx.translate(L.fx + Math.sin(t * 95) * vib, L.fy + Math.cos(t * 83) * vib); ctx.scale(pop, pop);
    drawAura(L.R, t, f.p, roar ? 1.25 : 0.7);
    drawJelly(0, -L.R * 0.05, f.p, 3, t, 0, roar ? 'roar' : 'fierce', { k: L.R / SIZE_R[3], shadow: false, alpha: 0.92 });
    ctx.restore();
    const gk = (ce - WC.GLINT) / 160;   // 눈빛 번쩍
    if (gk > 0 && gk < 1) { const tw = Math.sin(gk * Math.PI); for (const sg of [-1, 1]) glint4(L.fx + sg * 0.28 * L.R * pop, L.fy - 0.14 * L.R * pop, L.R * 0.34 * tw); }
  }
  const na = clamp01((ce - 140) / 150);   // 이름표
  if (na > 0) {
    const nm = pname(f.p);
    ctx.globalAlpha = na; ctx.font = `900 52px ${FONT}`;
    const w = ctx.measureText(nm).width + 50;
    ctx.fillStyle = '#ffffff'; rrect(L.nx - w / 2, L.ny - 38, w, 76, 38); ctx.fill();
    ctx.fillStyle = '#111'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(nm, L.nx, L.ny + 2);
    ctx.globalAlpha = 1;
  }
  const we = ce - WC.ROAR;   // 기합!
  if (we >= 0) { const sc = we < 120 ? easeOut(we / 120) * 1.3 : 1.3 - 0.3 * clamp01((we - 120) / 150); shout(f.word, L.wx + Math.sin(t * 80) * 4, L.wy, L.ws, sc, '#ffffff', k.accent, 0.14, 1); }
  const se = ce - WC.STAMP;   // '사목 완성!!' 도장 쾅
  if (se >= 0) {
    const TXT = '냠냠 완성!!', ts = fitSize(TXT, L.ts, L.tw);
    const sc = se < 130 ? 2.4 - 1.5 * easeIn(se / 130) : 0.9 + 0.1 * easeOut((se - 130) / 140), al = clamp01(se / 60);
    ctx.save(); ctx.translate(L.tx, L.ty); ctx.scale(sc, sc); ctx.globalAlpha = al;
    ctx.font = `900 ${ts}px ${FONT}`;
    const tw = ctx.measureText(TXT).width;
    ctx.beginPath();
    for (let i = 0; i < 28; i++) { const a = i / 28 * TAU, rr = i % 2 ? 0.78 : 1.0, x = Math.cos(a) * tw * 0.62 * rr, y = Math.sin(a) * ts * 0.8 * rr; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.closePath(); ctx.fillStyle = '#c49bff'; ctx.fill(); ctx.lineWidth = 8; ctx.strokeStyle = '#000'; ctx.stroke();
    ctx.restore();
    shout(TXT, L.tx, L.ty, ts, sc, '#ffffff', '#ff3b3b', -0.03, al);
    if (se > 100 && se < 420) {
      const rk = (se - 100) / 320;
      ctx.strokeStyle = `rgba(255,255,255,${1 - rk})`; ctx.lineWidth = 10 * (1 - rk) + 2;
      ctx.beginPath(); ctx.ellipse(L.tx, L.ty, tw * 0.62 * (0.9 + rk * 0.5), ts * 0.8 * (0.9 + rk * 0.5), 0, 0, TAU); ctx.stroke();
    }
  }
  ctx.restore();
}


// ----- 승리 모션 (e = 모션 시간 ms, 음수면 컷씬 중) -----
function drawWinMotion(f, e, t) {
  if (e < 0) {   // 컷씬 중 (+ 숨은 젤리로 이겼을 때는 '앗, 나왔다!')
    const pe = e + f.cut;
    for (const q of f.all) {
      const near = f.pre && pe < f.pre, sh = near ? Math.sin(t * 50 + q.i) * 3 : 0;
      drawJelly(cellX(q.i) + sh, cellY(q.i), f.p, q.s, t, q.id, near ? 'scared' : 'happy', { alpha: 0.8 });
    }
    if (f.pre && pe < f.pre) {
      const x = cellX(f.revealFrom), y = cellY(f.revealFrom);
      bubble('앗, 나왔다!', x, y - CELL * 0.62, pe, f.pre, 46);
      ring(x, y, pe, 500, 40, CELL * 0.55, 'rgba(255,240,150,A)');
    }
    return;
  }
  ({ h: wmH, v: wmV, d: wmD, multi: wmM })[f.type](f, e, t);
}
const lineMid = L => [L.reduce((a, i) => a + cellX(i), 0) / L.length, L.reduce((a, i) => a + cellY(i), 0) / L.length];
const lineTop = L => Math.min(...L.map(i => cellY(i)));
const pieceOf = (f, i) => f.all.find(q => q.i === i);
// 가로: 젤리 기차 — 왼쪽부터 칙칙폭폭 출렁이며 오른쪽으로 갔다가 제자리로 → 다 같이 폴짝 '냠냠~!'
function wmH(f, e, t) {
  const L = f.lines[0], [mx] = lineMid(L), my = lineTop(L) - CELL * 0.72;
  if (e < 1500) {   // 기차 연기
    for (let j = 0; j < 4; j++) {
      const a = (e - j * 260) / 700;
      if (a < 0 || a > 1) continue;
      ctx.fillStyle = `rgba(255,255,255,${0.5 * (1 - a)})`;
      ctx.beginPath(); ctx.arc(cellX(L[2]) + CELL * 0.35 + a * 40, cellY(L[2]) - CELL * 0.3 - a * 90, 20 + a * 26, 0, TAU); ctx.fill();
    }
  }
  L.forEach((i, k) => {
    const pc = pieceOf(f, i);
    let dx = 0, h = 0, sx = 1, sy = 1;
    if (e < 1500) {
      const u = e / 1500, chug = Math.sin(e / 140 * Math.PI - k * 1.1);
      dx = Math.sin(u * Math.PI) * CELL * 0.22;
      h = Math.max(0, chug) * 18; sx = 1 + 0.08 * chug; sy = 1 - 0.08 * chug;
    } else {
      const s1 = e - 1500 - k * 90;
      if (s1 >= 0 && s1 < 360) { h = Math.sin(s1 / 360 * Math.PI) * CELL * 0.4; sx = 0.9; sy = 1.12; }
      else if (s1 >= 360 && s1 < 460) { const q = Math.sin((s1 - 360) / 100 * Math.PI) * 0.2; sx = 1 + q; sy = 1 - q; }
    }
    drawJelly(cellX(i) + dx, cellY(i) - h, f.p, pc.s, t, pc.id, 'happy', { alpha: 0.82, sx, sy });
  });
  popText('칙칙폭폭~', mx, my, e, 1400, 58, '#ffd23c', -0.05);
  popText('냠냠~!', mx, my, e - 1550, 750, 84, '#ffffff', 0.05);
}
// 세로: 젤리 탑 점프 — 위 젤리가 아래로 통통 밟고 내려간 뒤, 맨 아래가 '영차!' 하고 셋이 같이 솟음 → '쿵!'
function wmV(f, e, t) {
  const L = f.lines[0], bx = cellX(L[0]);
  let lift = 0, land = 0;
  if (e >= 900 && e < 1650) { const k = (e - 900) / 750; lift = Math.sin(k * Math.PI) * CELL * 0.6; }
  else if (e >= 1650) land = Math.sin(clamp01((e - 1650) / 220) * Math.PI) * 0.18;
  L.forEach((i, k) => {
    const pc = pieceOf(f, i);
    let sx = 1 + land, sy = 1 - land, h = lift;
    const s1 = e - k * 230;   // 위부터 차례로 꾹 눌림
    if (e < 900 && s1 >= 0 && s1 < 260) { const q = Math.sin(s1 / 260 * Math.PI) * 0.24; sx = 1 + q; sy = 1 - q; h = Math.sin(s1 / 260 * Math.PI) * -6; }
    if (e >= 900 && e < 1650) { sx = 0.92; sy = 1.1; }
    drawJelly(bx, cellY(i) - h, f.p, pc.s, t, pc.id, 'happy', { alpha: 0.82, sx, sy });
  });
  const top = cellY(L[0]) - CELL * 0.65 - lift;
  for (let k = 0; k < 3; k++) popText('통!', bx + CELL * 0.4, cellY(L[k]) - CELL * 0.2, e - k * 230, 300, 46, '#ffffff', 0.12);
  popText('영차!!', bx, top, e - 900, 700, 76, '#ffa94d', -0.06);
  popText('쿵!', bx + CELL * 0.42, cellY(L[2]) + CELL * 0.2, e - 1650, 450, 70, '#ffffff', 0);
}
// 대각선: 젤리 미끄럼틀 — 위 젤리가 아래로 '슝~' 미끄러지며 지나가는 젤리를 톡톡 → 아래부터 차례로 '짝!' → 다 같이 '야호~!'
function wmD(f, e, t) {

  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.moveTo(x, y - 19); ctx.lineTo(x + 19, y - 2); ctx.lineTo(x - 19, y - 2); ctx.closePath(); ctx.fill();   // 지붕
  ctx.fillRect(x - 13, y - 3, 26, 19);                                                                                    // 벽
  ctx.fillStyle = '#282c38'; ctx.fillRect(x - 4, y + 5, 8, 11);                                                          // 문
}

// ===== 게임 포기 확인창 =====
function drawQuit(t, now) {
  const k = easeOut((now - confirmAt) / 180), sc = 0.85 + 0.15 * k * (1 + 0.06 * Math.sin(clamp01((now - confirmAt) / 260) * Math.PI));
  ctx.fillStyle = `rgba(0,0,0,${0.6 * k})`; ctx.fillRect(-80, -80, LW + 160, LH + 160);
  const w = Math.min(LW - 80, 900), h = 560, cx = LW / 2, cy = LH / 2;
  ctx.save(); ctx.globalAlpha = k;
  ctx.translate(cx, cy); ctx.scale(sc, sc); ctx.translate(-cx, -cy);
  ctx.fillStyle = '#1b1f2a'; rrect(cx - w / 2, cy - h / 2, w, h, 44); ctx.fill();
  ctx.strokeStyle = '#ffd23c'; ctx.lineWidth = 6; rrect(cx - w / 2, cy - h / 2, w, h, 44); ctx.stroke();
  drawJelly(cx, cy - 175, turn, 2, t, 0, 'scared', { k: 0.72 });   // 걱정하는 젤리
  const TXT = '게임을 포기하시겠습니까?';
  ctx.fillStyle = '#fff'; ctx.font = `900 ${fitSize(TXT, 64, w - 80)}px ${FONT}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(TXT, cx, cy - 30);
  for (const b of QUIT_BTNS) {
    const yes = b.id === 'yes';
    ctx.fillStyle = yes ? '#ff5a6e' : '#2c3242'; rrect(b.x, b.y, b.w, b.h, 36); ctx.fill();
    ctx.strokeStyle = yes ? '#ffc9d0' : 'rgba(255,255,255,.85)'; ctx.lineWidth = 6; rrect(b.x, b.y, b.w, b.h, 36); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = `900 76px ${FONT}`; ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 4);
  }
  ctx.restore();
}

function frame(now) {
  const t = now / 1000;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#0d0f14'; ctx.fillRect(0, 0, CW, CH);
  if (orient === 'land') ctx.setTransform(0, 1, -1, 0, CW, 0);   // 가로모드: 오른쪽 90° (x,y) → (1170-y, x)
  if (scene === 'title') drawTitle(t, now);
  else if (scene === 'mode') drawMode(t, now);
  else if (scene === 'rule') drawRule(t, now);
  else if (scene === 'diff') drawDiff(t, now);
  else if (scene === 'howto') drawHowto(t, now);
  else {
    updateFx(now);
    updateCpu(now);
    const sh = winShake(now);
    ctx.save(); ctx.translate(sh[0], sh[1]);
    drawPanel(BLUE, t); drawPanel(ORG, t);
    drawRuleTag();
    drawBoard(t, now);
    ctx.restore();
    drawDragged(t);
    if (intro) drawIntro(t, now);
    drawToast(now);
    if (winFx && winFx.type !== 'draw') { const ce = now - winFx.at - winFx.pre; if (ce >= 0 && ce < WCUT) drawWinCut(winFx, ce, t); }
    drawResult(t, now);
  }
  drawVol();
  drawHome();
  if (confirmQuit) drawQuit(t, now);
  requestAnimationFrame(frame);
}

applyLayout();
reset(); intro = null;
go('title');
requestAnimationFrame(frame);
</script>
</body>
