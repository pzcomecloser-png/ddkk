<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>갈톤보드 구슬 게임 (Geometry Wars Style)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        :root {
            --neon-cyan: #00ffff;
            --neon-pink: #ff00ff;
            --neon-green: #39ff14;
            --neon-yellow: #ffff00;
            --neon-red: #ff003c;
            --bg-color: #050508;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100vw;
            height: 100dvh;
            background-color: var(--bg-color);
            color: #fff;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        /* 배경 그리드 */
        .bg-grid {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: 
                linear-gradient(rgba(0, 255, 255, 0.12) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.12) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
            transform: perspective(500px) rotateX(10deg);
            transform-origin: center top;
            opacity: 0.6;
        }

        /* 게임 화면 비율 보정 래퍼 */
        .game-wrapper {
            position: relative;
            width: 1280px;
            height: 720px;
            transform-origin: center center;
            flex-shrink: 0;
        }

        .game-screen {
            position: absolute;
            top: 0; left: 0;
            width: 1280px;
            height: 720px;
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 15px var(--neon-cyan), inset 0 0 15px var(--neon-cyan);
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            z-index: 1;
            overflow: hidden;
        }

        /* UI Panel */
        .ui-panel {
            position: absolute;
            top: 20px; left: 30px;
            z-index: 10;
        }
        .ui-text {
            font-size: 24px;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan);
            margin-bottom: 8px;
        }
        .ui-marbles {
            font-size: 32px;
            color: var(--neon-pink);
            text-shadow: 0 0 10px var(--neon-pink);
        }
        
        .ui-cards {
            position: absolute;
            top: 20px; left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 10;
        }
        .card {
            width: 65px; height: 85px;
            border: 2px solid var(--neon-yellow);
            box-shadow: 0 0 10px var(--neon-yellow), inset 0 0 5px var(--neon-yellow);
            display: flex; justify-content: center; align-items: center;
            font-size: 13px; text-align: center; color: var(--neon-yellow);
            text-shadow: 0 0 5px var(--neon-yellow);
            background: rgba(0,0,0,0.5);
        }

        /* 갈톤보드 */
        .galton-board {
            position: absolute;
            top: 100px; left: 50px;
            width: 800px; height: 480px;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }
        .pegs-container {
            position: relative;
            width: 100%; height: 85%;
        }
        .peg {
            position: absolute;
            width: 8px; height: 8px;
            background: transparent;
            border: 2px solid var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--neon-cyan);
            transform: translate(-50%, -50%);
        }
        .slots-container {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 15%;
            display: flex;
        }
        .slot {
            flex: 1;
            border-left: 2px dashed rgba(0, 255, 255, 0.4);
            display: flex; justify-content: center; align-items: center;
            font-size: 16px; font-weight: bold;
        }
        .slot:last-child { border-right: 2px dashed rgba(0, 255, 255, 0.4); }
        .slot-x1 { color: var(--neon-cyan); text-shadow: 0 0 8px var(--neon-cyan); }
        .slot-x2 { color: var(--neon-green); text-shadow: 0 0 8px var(--neon-green); }
        .slot-x3 { color: var(--neon-yellow); text-shadow: 0 0 8px var(--neon-yellow); }
        .slot-x5 { color: var(--neon-pink); text-shadow: 0 0 8px var(--neon-pink); }
        .slot-fail { color: var(--neon-red); text-shadow: 0 0 8px var(--neon-red); border-bottom: 3px solid var(--neon-red); }

        /* 동적 움직이는 구슬 */
        .active-marble {
            position: absolute;
            width: 14px; height: 14px;
            background: var(--neon-pink);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--neon-pink), 0 0 25px var(--neon-pink);
            transform: translate(-50%, -50%);
            z-index: 5;
            pointer-events: none;
        }

        /* 컨베이어 벨트 */
        .conveyor-belt {
            position: absolute;
            top: 590px; left: 50px;
            width: 950px; height: 40px;
            border-top: 2px solid var(--neon-cyan);
            border-bottom: 2px solid var(--neon-cyan);
            background: repeating-linear-gradient(
                90deg,
                transparent,
                transparent 20px,
                rgba(0, 255, 255, 0.2) 20px,
                rgba(0, 255, 255, 0.2) 40px
            );
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            animation: moveConveyor 1s linear infinite;
        }
        @keyframes moveConveyor {
            from { background-position: 0 0; }
            to { background-position: 40px 0; }
        }

        /* 구슬 창고 */
        .storage-tank {
            position: absolute;
            top: 530px; left: 1000px;
            width: 150px; height: 100px;
            border: 3px solid var(--neon-green);
            box-shadow: 0 0 20px var(--neon-green), inset 0 0 20px var(--neon-green);
            display: flex; flex-wrap: wrap-reverse; align-content: flex-start; justify-content: center;
            padding: 5px; gap: 3px;
            background: rgba(57, 255, 20, 0.1);
            overflow: hidden;
        }
        .storage-tank::before {
            content: "STORAGE";
            position: absolute; top: -25px; left: 0; width: 100%; text-align: center;
            color: var(--neon-green); text-shadow: 0 0 5px var(--neon-green); font-size: 14px;
        }
        .stored-marble {
            width: 12px; height: 12px;
            background: var(--neon-pink);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--neon-pink);
        }

        /* 장전 튜브 */
        .reload-tube {
            position: absolute;
            top: 150px; left: 1120px;
            width: 30px; height: 380px;
            border-left: 2px solid var(--neon-cyan);
            border-right: 2px solid var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5), inset 0 0 10px rgba(0, 255, 255, 0.3);
        }

        /* 갈톤 대포 */
        .cannon-area {
            position: absolute;
            top: 80px; left: 880px;
            width: 240px; height: 100px;
            transform: rotate(-15deg);
        }
        .cannon-body {
            position: absolute;
            right: 0; top: 20px;
            width: 120px; height: 60px;
            border: 3px solid var(--neon-green);
            background: rgba(57, 255, 20, 0.15);
            box-shadow: 0 0 20px var(--neon-green), inset 0 0 15px var(--neon-green);
            border-radius: 10px;
        }
        .cannon-barrel {
            position: absolute;
            right: 110px; top: 30px;
            width: 130px; height: 40px;
            border: 3px solid var(--neon-cyan);
            background: transparent;
            box-shadow: 0 0 20px var(--neon-cyan), inset 0 0 10px var(--neon-cyan);
        }
        .cannon-barrel::before {
            content: ''; position: absolute;
            left: -10px; top: -5px; width: 20px; height: 44px;
            background: var(--neon-cyan);
            box-shadow: 0 0 15px var(--neon-cyan);
        }
        
        .fire-flash {
            position: absolute;
            left: -40px; top: 5px;
            width: 40px; height: 30px;
            background: radial-gradient(circle, var(--neon-pink) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.1s;
        }

        .trajectory {
            position: absolute;
            top: 80px; left: 450px;
            width: 420px; height: 2px;
            border-top: 2px dashed rgba(255, 0, 255, 0.3);
            transform: rotate(12deg);
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>

    <div class="game-wrapper" id="gameWrapper">
        <div class="game-screen" id="gameScreen">
            <!-- UI -->
            <div class="ui-panel">
                <div class="ui-text">STAGE 04 - CLEAR 500</div>
                <div class="ui-marbles" id="marbleCountText">MARBLES: 100</div>
                <div class="ui-text" style="font-size: 16px; margin-top: 10px; color: var(--neon-green);">UPGRADE: 스피드업 (Lv.3)</div>
            </div>

            <div class="ui-cards">
                <div class="card">피버<br>카드</div>
                <div class="card" style="border-color: var(--neon-pink); box-shadow: 0 0 10px var(--neon-pink), inset 0 0 5px var(--neon-pink); color: var(--neon-pink);">올인</div>
                <div class="card" style="border-color: #333; box-shadow: none; color: #555;">EMPTY</div>
            </div>

            <div class="trajectory"></div>

            <!-- 갈톤보드 -->
            <div class="galton-board">
                <div class="pegs-container" id="pegs"></div>
                <div class="slots-container">
                    <div class="slot slot-fail">FAIL</div>
                    <div class="slot slot-x1">x1</div>
                    <div class="slot slot-x1">x1</div>
                    <div class="slot slot-x2">x2</div>
                    <div class="slot slot-x2">x2</div>
                    <div class="slot slot-x3">x3</div>
                    <div class="slot slot-x5">x5</div>
                    <div class="slot slot-x3">x3</div>
                    <div class="slot slot-x2">x2</div>
                    <div class="slot slot-x2">x2</div>
                    <div class="slot slot-x1">x1</div>
                    <div class="slot slot-x1">x1</div>
                    <div class="slot slot-fail">FAIL</div>
                </div>
            </div>

            <!-- 컨베이어 벨트 -->
            <div class="conveyor-belt"></div>

            <!-- 구슬 창고 -->
            <div class="storage-tank" id="storageTank"></div>

            <!-- 장전 튜브 -->
            <div class="reload-tube"></div>

            <!-- 갈톤 대포 -->
            <div class="cannon-area">
                <div class="cannon-barrel">
                    <div class="fire-flash" id="fireFlash"></div>
                </div>
                <div class="cannon-body"></div>
            </div>
        </div>
    </div>

    <script>
        // 1. 화면 스케일링 (아이폰 사파리 가로모드 꽉 차게)
        function fitScreen() {
            const wrapper = document.getElementById('gameWrapper');
            const scaleX = window.innerWidth / 1280;
            const scaleY = window.innerHeight / 720;
            const scale = Math.min(scaleX, scaleY);
            wrapper.style.transform = `scale(${scale})`;
        }
        window.addEventListener('resize', fitScreen);
        window.addEventListener('orientationchange', fitScreen);
        fitScreen();

        // 2. 갈톤보드 핀(Peg) 생성
        const pegsContainer = document.getElementById('pegs');
        const rows = 12;
        const startX = 400; // 보드 내 중앙
        const startY = 30;
        const xSpacing = 28;
        const ySpacing = 30;
        const pegPositions = [];

        for (let row = 0; row < rows; row++) {
            const cols = row + 3;
            pegPositions[row] = [];
            for (let col = 0; col < cols; col++) {
                const x = startX - ((cols - 1) * xSpacing) / 2 + (col * xSpacing);
                const y = startY + (row * ySpacing);
                
                const peg = document.createElement('div');
                peg.className = 'peg';
                peg.style.left = x + 'px';
                peg.style.top = y + 'px';
                pegsContainer.appendChild(peg);
                
                pegPositions[row].push({ x: x + 50, y: y + 100 }); // 절대 좌표 변환
            }
        }

        // 3. 구슬 순환 애니메이션 시스템
        const gameScreen = document.getElementById('gameScreen');
        const storageTank = document.getElementById('storageTank');
        const fireFlash = document.getElementById('fireFlash');
        const marbleCountText = document.getElementById('marbleCountText');

        let marbleTotalCount = 100;
        let storedVisualCount = 15;
        const marbles = [];

        // 창고 초기 시각화
        function updateStorageTank() {
            storageTank.innerHTML = '';
            const displayCount = Math.min(storedVisualCount, 28);
            for (let i = 0; i < displayCount; i++) {
                const m = document.createElement('div');
                m.className = 'stored-marble';
                storageTank.appendChild(m);
            }
        }
        updateStorageTank();

        // 구슬 발사 생성
        function launchMarble() {
            // 플래시 효과
            fireFlash.style.opacity = '1';
            setTimeout(() => fireFlash.style.opacity = '0', 100);

            const el = document.createElement('div');
            el.className = 'active-marble';
            gameScreen.appendChild(el);

            const marble = {
                el: el,
                state: 'LAUNCHING', // LAUNCHING -> BOARD -> BELT -> TUBE
                x: 950,
                y: 110,
                targetX: 450,
                targetY: 120,
                speed: 14,
                currentRow: 0,
                colIndex: 0
            };

            marbles.push(marble);

            if (storedVisualCount > 0) {
                storedVisualCount--;
                updateStorageTank();
            }
        }

        // 발사 간격 (0.45초마다 발사)
        setInterval(launchMarble, 450);

        // 메인 프레임 무브먼트 루프
        function updatePhysics() {
            for (let i = marbles.length - 1; i >= 0; i--) {
                const m = marbles[i];

                if (m.state === 'LAUNCHING') {
                    // 대포 -> 갈톤보드 상단 진입
                    const dx = m.targetX - m.x;
                    const dy = m.targetY - m.y;
                    const dist = Math.hypot(dx, dy);

                    if (dist < m.speed) {
                        m.state = 'BOARD';
                        m.currentRow = 0;
                        m.colIndex = 1; // 중앙 시작
                        const firstPeg = pegPositions[0][m.colIndex];
                        m.targetX = firstPeg.x;
                        m.targetY = firstPeg.y;
                    } else {
                        m.x += (dx / dist) * m.speed;
                        m.y += (dy / dist) * m.speed;
                    }
                } 
                else if (m.state === 'BOARD') {
                    // 핀 튕김 낙하
                    const dx = m.targetX - m.x;
                    const dy = m.targetY - m.y;
                    const dist = Math.hypot(dx, dy);

                    if (dist < 8) {
                        m.currentRow++;
                        if (m.currentRow < rows) {
                            // 좌/우 50% 확률 튕김
                            if (Math.random() < 0.5) {
                                m.colIndex += 1;
                            }
                            const nextPeg = pegPositions[m.currentRow][m.colIndex];
                            m.targetX = nextPeg.x + (Math.random() * 6 - 3);
                            m.targetY = nextPeg.y;
                        } else {
                            // 슬롯 & 컨베이어 벨트로 낙하
                            m.state = 'BELT';
                            m.targetY = 610;
                        }
                    } else {
                        m.x += (dx / dist) * 7;
                        m.y += (dy / dist) * 7;
                    }
                }
                else if (m.state === 'BELT') {
                    // 벨트 타고 우측 이동
                    if (m.y < 610) {
                        m.y += 6;
                    } else {
                        m.x += 8;
                        if (m.x >= 1075) {
                            m.state = 'TUBE';
                            m.x = 1135;
                            m.y = 530;
                        }
                    }
                }
                else if (m.state === 'TUBE') {
                    // 장전 튜브 타고 위로 상승 후 대포 재장전
                    m.y -= 10;
                    if (m.y <= 120) {
                        // 순환 완료
                        m.el.remove();
                        marbles.splice(i, 1);

                        storedVisualCount++;
                        updateStorageTank();

                        marbleTotalCount++;
                        marbleCountText.innerText = `MARBLES: ${marbleTotalCount}`;
                        continue;
                    }
                }

                m.el.style.left = m.x + 'px';
                m.el.style.top = m.y + 'px';
            }

            requestAnimationFrame(updatePhysics);
        }

        requestAnimationFrame(updatePhysics);
    </script>
</body>
</html>
