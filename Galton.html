<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galton</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #080808;
    color: #e8e8e8;
    font-family: "Courier New", monospace;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  #game {
    width: 1000px;
    max-width: 96vw;
  }
  #header {
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #555;
    padding: 0 0 12px;
    margin-bottom: 18px;
    font-size: 17px;
  }
  #screen {
    display: grid;
    grid-template-columns: 1fr 270px;
    gap: 28px;
  }
  #board, #cannon {
    white-space: pre;
    font-size: 15px;
    line-height: 1.22;
    min-height: 430px;
  }
  #board { position: relative; }
  #cannon {
    border-left: 1px solid #444;
    padding-left: 24px;
  }
  #info {
    margin-top: 18px;
    border-top: 1px solid #444;
    padding-top: 12px;
    font-size: 14px;
    color: #aaa;
  }
  .clear { color: #fff; font-weight: bold; }
</style>
</head>
<body>
<div id="game">
  <div id="header">
    <span>G A L T O N</span>
    <span id="stage">STAGE 01</span>
  </div>

  <div id="screen">
    <pre id="board"></pre>
    <pre id="cannon"></pre>
  </div>

  <div id="info"></div>
</div>

<script>
const ROWS = 11;
const WIDTH = 61;
const CENTER = 25;

let marbles = 100;
let fired = 0;
let gained = 0;
let falling = [];
let cleared = false;

const slots = [
  {v:0}, {v:1}, {v:1}, {v:1}, {v:2},
  {v:2}, {v:1}, {v:3}, {v:1}, {v:0},
  {v:1}, {v:3}, {v:1}, {v:2}, {v:2}
];

// 갈톤 핀 좌표
const pins = [];
for (let r = 0; r < 7; r++) {
  const count = r + 1;
  const start = CENTER - r;
  for (let i = 0; i < count; i++) {
    pins.push({r: r + 1, c: start + i * 2});
  }
}

function makeGrid() {
  return Array.from({length: ROWS + 4}, () => Array(WIDTH).fill(' '));
}

function put(g, r, c, s) {
  if (r < 0 || r >= g.length || c < 0 || c >= WIDTH) return;
  for (let i = 0; i < s.length; i++) {
    if (c + i >= 0 && c + i < WIDTH) g[r][c+i] = s[i];
  }
}

function draw() {
  const g = makeGrid();

  // 상단 보드 프레임
  put(g, 0, 8, "┌───────────────────────────────────────────┐");
  put(g, 1, 8, "│               G A L T O N                 │");
  put(g, 2, 8, "│                                           │");

  // 핀
  for (const p of pins) {
    put(g, p.r + 2, 8 + p.c, "•");
  }

  // 현재 떨어지는 구슬
  for (const m of falling) {
    put(g, m.r + 2, 8 + Math.round(m.c), "●");
  }

  // 하단 슬롯
  const slotStart = 8 + CENTER - 14;
  put(g, 10, slotStart, "┌──┬──┬──┬──┬──┬──┬──┬──┬──┬──┬──┬──┬──┬──┬──┐");
  let labels = "";
  for (const s of slots) labels += `│${s.v === 0 ? "X" : s.v + "×"} `;
  put(g, 11, slotStart, labels + "│");
  put(g, 12, slotStart, "└──┴──┴──┴──┴──┴──┴──┴──┴──┴──┴──┴──┴──┴──┴──┘");

  document.getElementById("board").textContent = g.map(row => row.join("")).join("\n");

  // 대포
  const cannonText =
`       ┌───────────────┐
       │  MARBLE CANNON│
       └───────┬───────┘
               │
        ┌──────┴──────┐
        │     ●       │
        │   ┌───┐     │
        │   │ ● │     │
        │   └───┘     │
        └──────┬──────┘
               │
        ┌──────┴──────┐
        │  ● ● ● ● ●  │
        │  ● ● ● ● ●  │
        │  ● ● ● ● ●  │
        └─────────────┘
          MARBLES: ${String(marbles).padStart(3," ")}

       AUTO FIRE: ON
       SPEED: 2.0 / sec`;
  document.getElementById("cannon").textContent = cannonText;

  document.getElementById("info").textContent =
    `MARBLES ${marbles}   |   FIRED ${fired}   |   GAINED ${gained}   |   TARGET 200`
    + (cleared ? "   |   ★ STAGE CLEAR" : "");
}

function fire() {
  if (cleared || marbles <= 0) return;

  marbles--;
  fired++;

  // 실제 애니메이션 경로: 위에서 시작해 핀 사이를 좌우로 튕기며 내려감
  let c = CENTER;
  const path = [];
  for (let r = 0; r < 8; r++) {
    const dir = Math.random() < 0.5 ? -1 : 1;
    c += dir * (r < 7 ? 1 : 0);
    path.push({r, c});
  }

  // 15칸의 중앙 집중형 분포를 근사
  const x = Math.random() + Math.random() + Math.random() + Math.random() + Math.random() + Math.random() + Math.random() - 3;
  let slot = Math.round(7 + x * 2.0);
  slot = Math.max(0, Math.min(14, slot));

  falling.push({r:0, c:CENTER, path, step:0, slot});

  setTimeout(() => resolveMarble(falling[falling.length-1]), 650);
}

function resolveMarble(m) {
  if (!m) return;
  const idx = falling.indexOf(m);
  if (idx === -1) return;

  const result = slots[m.slot].v;
  if (result > 0) {
    marbles += result;
    gained += result;
  }

  falling.splice(idx, 1);

  if (marbles >= 200) {
    cleared = true;
    clearInterval(autoFire);
  }
  draw();
}

function animate() {
  for (const m of falling) {
    if (m.step < m.path.length) {
      const p = m.path[m.step++];
      m.r = p.r;
      m.c = p.c;
    }
  }
  draw();
}

draw();
const animation = setInterval(animate, 90);
const autoFire = setInterval(fire, 500);
</script>
</body>
</html>
