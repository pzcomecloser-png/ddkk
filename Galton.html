<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galton</title>
<style>
  body {
    margin: 0;
    background: #111;
    color: #eee;
    font-family: monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  #game {
    width: 900px;
    max-width: 95vw;
  }
  pre {
    font-size: 14px;
    line-height: 1.15;
    margin: 0;
    white-space: pre;
    overflow: hidden;
  }
  #status {
    margin-top: 14px;
    font-size: 16px;
  }
</style>
</head>
<body>
<div id="game">
<pre id="board"></pre>
<div id="status"></div>
</div>

<script>
const ROWS = 10;
const COLS = 21;

let board = Array.from({length: ROWS}, () => Array(COLS).fill(' '));
let marbles = 100;
let gained = 0;
let fired = 0;

function draw() {
  board = Array.from({length: ROWS}, () => Array(COLS).fill(' '));

  // Cannon
  board[ROWS - 1][2] = 'C';
  board[ROWS - 2][3] = '=';
  board[ROWS - 3][4] = '>';

  // Galton pins
  for (let r = 0; r < ROWS - 3; r++) {
    const count = r + 1;
    const start = Math.floor((COLS - count * 2) / 2) + 1;
    for (let i = 0; i < count; i++) {
      const x = start + i * 2;
      board[r + 1][x] = '•';
    }
  }

  // Bottom slots
  const slots = ['X','1','1','1','2','2','1','3','1','X','1','3','1','2','2','1','1','1','X'];
  for (let i = 0; i < slots.length; i++) {
    board[ROWS - 1][i] = slots[i];
  }

  document.getElementById('board').textContent =
`                 G A L T O N

${board.map(row => row.join('')).join('\n')}

        ───────────────────
        X 1 1 1 2 2 1 3 1 X 1 3 1 2 2 1 1 1 X`;

  document.getElementById('status').textContent =
    `STAGE 1    MARBLES: ${marbles}    FIRED: ${fired}    GAINED: ${gained}    TARGET: 200`;
}

function fire() {
  if (marbles <= 0) return;

  marbles--;
  fired++;

  // 간단한 15칸 갈톤 분포 근사: 중앙에 더 자주 도착
  const center = 7;
  const distance = Math.floor(Math.abs(Math.random() - Math.random()) * 8);
  let slot = center + (Math.random() < 0.5 ? -distance : distance);
  slot = Math.max(0, Math.min(18, slot));

  const values = [0,1,1,1,2,2,1,3,1,0,1,3,1,2,2,1,1,1,0];
  const result = values[slot];

  if (result > 0) {
    const amount = result;
    marbles += amount;
    gained += amount;
  }

  draw();

  if (marbles >= 200) {
    document.getElementById('status').textContent += '    ★ STAGE CLEAR!';
    clearInterval(timer);
  }
}

draw();

// 시작하면 자동 발사
const timer = setInterval(fire, 500);
</script>
</body>
</html>
