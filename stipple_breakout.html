        if (currentStage === BOSS3_AFTER_STAGE && !boss) return 34;
        return currentStage + 1 >= STAGES.length ? 0 : currentStage + 1;
    }
    function saveCheck(v) { let h = 0x2F6B ^ Number(v % 2147483647n); for (let k = 0; k < 6; k++) { h = Math.imul(h ^ (h >>> 13), 0x5BD1E995) >>> 0; h = (h + Number((v >> BigInt(k * 11)) & 2047n) * 40503) >>> 0; } return h & 0x3FFF; }   // 14비트
    function makeSaveCode(state) {
        let v = 0n;
        for (const [k, n] of SAVE_FIELDS()) { const x = Math.max(0, Math.min(n - 1, state[k] | 0)); v = v * BigInt(n) + BigInt(x); }
        v = v * 16384n + BigInt(saveCheck(v));
        v ^= 0x5A3C96F00F1E2D3Bn & ((1n << 80n) - 1n);   // 섞기 (비슷한 진행이 비슷한 코드가 안 되게)
        let out = '';
        for (let i = 0; i < 16; i++) { out = SAVE_ABC[Number(v & 31n)] + out; v >>= 5n; }
        return out.match(/.{4}/g).join('-');
    }
    function readSaveCode(code) {
        const t = String(code).toUpperCase().replace(/[^A-Z0-9]/g, '').replace(/O/g, '0').replace(/I/g, '1');
        if (t.length !== 16) return { err: '16자리를 입력하세요' };
        let v = 0n;
        for (const ch of t) { const i = SAVE_ABC.indexOf(ch); if (i < 0) return { err: '잘못된 코드' }; v = v * 32n + BigInt(i); }
        v ^= 0x5A3C96F00F1E2D3Bn & ((1n << 80n) - 1n);
        const chk = Number(v % 16384n); v /= 16384n;
        if (saveCheck(v) !== chk) return { err: '잘못된 코드' };
        const st = {}, F = SAVE_FIELDS();
        for (let i = F.length - 1; i >= 0; i--) { const [k, n] = F[i]; st[k] = Number(v % BigInt(n)); v /= BigInt(n); }
        if (v !== 0n) return { err: '잘못된 코드' };
        if (st.ver !== SAVE_VER) return { err: '지원하지 않는 코드' };
        if (st.lives < 1) return { err: '잘못된 코드' };
        return { st };
    }
    function currentSaveState(to) {
        const st = { ver: SAVE_VER, to, lives, gems: gemCount, score: Math.floor(score / 100) };
        SAVE_CARDS.forEach(id => st[id] = cardLevel(id));
        return st;
    }
    // 코드로 돌아가기: 카드 · 보석 · 점수 · 목숨을 되돌리고 그 위치부터 시작
    function loadSave(st, code) {
        for (const k in upgrades) delete upgrades[k];
        SAVE_CARDS.forEach(id => { if (st[id]) upgrades[id] = st[id]; });
        upgrades.save = 1; saveCode = code; saveTo = st.to;      // 넣은 코드를 업그레이드 화면에서 다시 볼 수 있게
        lives = st.lives; gemCount = st.gems; score = st.score * 100;
        introCard = null; lastPurchase = null; enemies.length = 0;
        if (st.to >= 32) { startBossFight(st.to - 31); gameState = 'BOSS_WARN'; }
        else { initGame(st.to); gameState = 'PLAY'; }
        absorbCharge = absorbMax();
    }
    function canOffer(card) {
        if (card.reward) return false;                  // 보상 카드 (심연의 구체) 는 상점에 안 나옴
        if (card.id === 'life') return lives < MAX_LIVES;
        if (card.id === 'absorb' && currentStage + 1 < ABSORB_FROM_STAGE) return false;
        if (card.id === 'save') return currentStage + 1 >= SAVE_FROM_STAGE;   // 10스테이지 클리어 뒤 상점부터, 몇 번이든
        return cardLevel(card.id) < card.max;          // 1회/5단계 카드는 최대 단계면 제외
    }
    const LASER_GUARANTEE_STAGES = 5;   // 1~5스테이지 클리어 뒤 상점
    function rollShopCards() {
        const pool = SHOP_CARDS.filter(canOffer).map(c => c.id);
        for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
        shopCards = pool.slice(0, 3);
        // 레이저 보장: 레이저가 없으면 1~5스테이지 클리어 뒤 상점(리롤 포함)에 레이저를 꼭 넣음 (자리는 무작위)
        if (currentStage < LASER_GUARANTEE_STAGES && cardLevel('laser') === 0 && !shopCards.includes('laser')) {
            shopCards[Math.floor(Math.random() * shopCards.length)] = 'laser';
        }
        if (currentStage + 1 === ABSORB_FROM_STAGE && cardLevel('absorb') === 0 && !shopCards.includes('absorb')) {
            const free = shopCards.map((id, i) => i).filter(i => shopCards[i] !== 'laser');
            shopCards[free[Math.floor(Math.random() * free.length)]] = 'absorb';
        }
        shopSel = -1;
        shopOpenT = performance.now();
    }
    function openShop() {
        gameState = 'SHOP';
        shopBought = null;
        lastPurchase = null;
        rerollCost = REROLL_BASE;
        shopMsg = '';
        rollShopCards();
    }

    // 상점 화면 배치 (그리기와 터치 판정이 같은 값을 사용)
    function shopLayout() {
        const pad = 40, gap = 30, cw = (LOGIC_WIDTH - pad * 2 - gap * 2) / 3, ch = cw * 1.5, cy = 420;
        const cards = shopCards.map((id, i) => ({ x: pad + i * (cw + gap), y: cy, w: cw, h: ch }));
        const by = cy + ch + 110, bw = 330, bh = 116, bgap = 30, bx = (LOGIC_WIDTH - bw * 3 - bgap * 2) / 2;
        return {
            cards,
            reroll: { x: bx, y: by, w: bw, h: bh },
            buy:    { x: bx + bw + bgap, y: by, w: bw, h: bh },
            skip:   { x: bx + (bw + bgap) * 2, y: by, w: bw, h: bh },
            next:   { x: LOGIC_WIDTH / 2 - 260, y: by, w: 520, h: bh },
            msgY: by + bh + 90
        };
    }
    const inRect = (r, x, y) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;

    function shopToast(msg) { shopMsg = msg; shopMsgT = performance.now(); }

    // 다음 스테이지 시작. 직전 상점에서 산 카드가 있으면 흡수 연출 후 시작
    const INTRO_POP_MS = 300, INTRO_HOLD_MS = 800, INTRO_FLY_MS = 550;
    const INTRO_CARD_W = 343, INTRO_CARD_H = 515, INTRO_SCALE = 1.25;
    let introCard = null, introT = 0, introHold = INTRO_HOLD_MS;
    function goNextStage() {
        if (currentStage === BOSS_AFTER_STAGE && !boss) startBossFight(1);
        else if (currentStage === BOSS2_AFTER_STAGE && !boss) startBossFight(2);
        else if (currentStage === BOSS3_AFTER_STAGE && !boss) startBossFight(3);
        else initGame(currentStage + 1);
        if (lastPurchase) {
            introCard = lastPurchase;
            lastPurchase = null;
            introT = 0; introHold = INTRO_HOLD_MS;
            gameState = 'CARD_INTRO';
        } else {
            gameState = boss ? 'BOSS_WARN' : 'PLAY';
        }
    }
    function updateCardIntro() {
        introT += STEP_MS;
        movePaddle();
        if (introT >= INTRO_POP_MS + introHold + INTRO_FLY_MS) {
            introCard = null;
            upgHudPulse = 450;
            gameState = boss && bossWarnT < BOSS_WARN_MS ? 'BOSS_WARN' : 'PLAY';
        }
    }
    // 카드 위치: 가운데 -> 곡선을 그리며 업그레이드 버튼으로 (빨려 들어가듯 점점 빨라짐)
    function introPose(t) {
        const cx = LOGIC_WIDTH / 2, cy = LOGIC_HEIGHT / 2;
        const tx = UPG_BTN.x + UPG_BTN.w / 2, ty = UPG_BTN.y + UPG_BTN.h / 2;
        if (t < INTRO_POP_MS) {
            const u = t / INTRO_POP_MS, back = 1 + 2.2 * Math.pow(u - 1, 3) + 1.2 * Math.pow(u - 1, 2);   // 살짝 튀어나왔다 자리잡음
            return { x: cx, y: cy, sc: INTRO_SCALE * back, rot: 0, a: Math.min(1, u * 2), k: 0 };
        }
        if (t < INTRO_POP_MS + introHold) {
            const bob = Math.sin((t - INTRO_POP_MS) / 160) * 6;
            return { x: cx, y: cy + bob, sc: INTRO_SCALE, rot: 0, a: 1, k: 0 };
        }
        const u = Math.min(1, (t - INTRO_POP_MS - introHold) / INTRO_FLY_MS), k = u * u * u;
        const qx = LOGIC_WIDTH * 0.92, qy = LOGIC_HEIGHT * 0.42;           // 곡선 조절점
        const x = (1 - k) * (1 - k) * cx + 2 * (1 - k) * k * qx + k * k * tx;
        const y = (1 - k) * (1 - k) * cy + 2 * (1 - k) * k * qy + k * k * ty;
        return { x, y, sc: INTRO_SCALE * (1 - k) + 0.05 * k, rot: k * 0.9, a: k > 0.85 ? (1 - k) / 0.15 : 1, k };
    }
    function drawCardIntro() {
        if (!introCard) return;
        const P = introPose(introT), f = Math.floor(performance.now() / SAND_INTERVAL) % SAND_FRAMES;
        // 배경 어둡게 (날아가는 동안 걷힘)
        ctx.fillStyle = `rgba(0,0,0,${0.6 * (1 - P.k)})`;
        ctx.fillRect(0, HUD_TOP_H, LOGIC_WIDTH, LOGIC_HEIGHT - HUD_TOP_H - HUD_BOTTOM_H);
        // 안내 문구 (가운데에 있을 때만)
        if (P.k === 0) {
            ctx.globalAlpha = P.a;
            ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.font = font('bold 56px');
            ctx.fillText(introCard === 'abyss' ? '획득' : 'UPGRADE', P.x, P.y - INTRO_CARD_H * INTRO_SCALE / 2 - 60);
            ctx.globalAlpha = 1;
        }
        // 날아가는 동안 뒤에 남는 모래 꼬리
        if (P.k > 0) {
            for (let i = 1; i <= 14; i++) {
                const q = introPose(introT - i * 18);
                if (q.k <= 0) break;
                const L = Math.round(255 * (1 - i / 15));
                ctx.fillStyle = `rgb(${L},${L},${L})`;
                const d = 10 * (1 - i / 15) + 2;
                ctx.fillRect(q.x - d / 2 + Math.sin(i * 2.3) * 8, q.y - d / 2 + Math.cos(i * 1.7) * 8, d, d);
            }
        }
        ctx.save();
        ctx.globalAlpha = Math.max(0, P.a);
        ctx.translate(P.x, P.y);
        ctx.rotate(P.rot);
        ctx.scale(P.sc, P.sc);
        drawShopCard(ctx, -INTRO_CARD_W / 2, -INTRO_CARD_H / 2, INTRO_CARD_W, INTRO_CARD_H, cardById(introCard), cardLevel(introCard), f, { noPrice: true, descStep: cardLevel(introCard) - 1 });   // 방금 산 단계 설명
        ctx.restore();
    }

    // 상점 터치 처리 (논리 좌표)
    function handleShopTap(x, y) {
        const L = shopLayout();
        if (shopBought) { if (inRect(L.next, x, y)) goNextStage(); return; }
        const ci = L.cards.findIndex(r => inRect(r, x, y));
        if (ci >= 0) { shopSel = ci === shopSel ? -1 : ci; return; }
        if (inRect(L.reroll, x, y)) {
            if (gemCount < rerollCost) { shopToast('보석이 부족합니다'); return; }
            gemCount -= rerollCost;
            rerollCost += REROLL_STEP;
            rollShopCards();
            return;
        }
        if (inRect(L.buy, x, y)) {
            if (shopSel < 0) { shopToast('카드를 먼저 선택하세요'); return; }
            const id = shopCards[shopSel], price = cardPrice(id);
            if (gemCount < price) { shopToast('보석이 부족합니다'); return; }
            gemCount -= price;
            sfx('buy');
            upgrades[id] = cardLevel(id) + 1;
            if (id === 'life') lives = Math.min(MAX_LIVES, lives + 1);
            if (id === 'absorb') absorbCharge = absorbMax();
            if (id === 'save') { saveTo = saveNextTo(); saveCode = makeSaveCode(currentSaveState(saveTo)); }   // 산 뒤의 보석 · 카드로
            shopBought = id; shopBoughtLv = cardLevel(id) - 1; shopBoughtPrice = price;   // 산 카드는 산 때의 단계 · 설명 · 가격 그대로 보여 줌 (V4.48.2)
            lastPurchase = id;
            return;
        }
        if (inRect(L.skip, x, y)) goNextStage();
    }

    function drawShopButton(r, label, cost, enabled, strong) {
        ctx.fillStyle = strong && enabled ? 'rgb(235,235,235)' : 'rgb(12,12,12)';
        ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 16); ctx.fill();
        ctx.strokeStyle = enabled ? 'rgb(220,220,220)' : 'rgb(70,70,70)';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 16); ctx.stroke();
        ctx.fillStyle = strong && enabled ? '#000' : (enabled ? 'rgb(235,235,235)' : 'rgb(80,80,80)');
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = font('bold 42px');
        if (cost == null) { ctx.fillText(label, r.x + r.w / 2, r.y + r.h / 2); return; }
        const text = `${label} ${cost}`, tw = ctx.measureText(text).width, gx = r.x + r.w / 2 - (tw + 40) / 2;
        ctx.textAlign = 'left';
        ctx.fillText(text, gx, r.y + r.h / 2);
        drawMoneyGem(ctx, gx + tw + 26, r.y + r.h / 2, 34, performance.now());
    }

    function drawShop() {
        const now = performance.now(), f = Math.floor(now / SAND_INTERVAL) % SAND_FRAMES, L = shopLayout();
        ctx.fillStyle = '#000';
        ctx.fillRect(0, HUD_TOP_H, LOGIC_WIDTH, LOGIC_HEIGHT - HUD_TOP_H - HUD_BOTTOM_H);

        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = '#fff'; ctx.font = font('bold 96px');
        ctx.fillText('SHOP', LOGIC_WIDTH / 2, 230);
        ctx.fillStyle = 'rgb(150,150,150)'; ctx.font = font('34px');
        ctx.fillText(shopBought ? '구매 완료' : '카드 1장을 구매할 수 있습니다', LOGIC_WIDTH / 2, 320);

        if (!shopCards.length) {
            ctx.fillStyle = 'rgb(150,150,150)'; ctx.font = font('36px');
            ctx.fillText('구매할 수 있는 카드가 없습니다', LOGIC_WIDTH / 2, L.msgY - 400);
        }

        shopCards.forEach((id, i) => {
            const r = L.cards[i], card = cardById(id), price = cardPrice(id);
            // 등장: 카드마다 0.12초 간격으로 아래에서 떠오름
            const t = Math.min(1, Math.max(0, (now - shopOpenT - i * 120) / 350)), e = 1 - Math.pow(1 - t, 3);
            const sel = i === shopSel && !shopBought, lift = sel ? -18 : 0;
            ctx.save();
            ctx.globalAlpha = e;
            ctx.translate(0, (1 - e) * 60 + lift);
            const bought = shopBought === id;   // 산 카드: 다음 단계로 바뀌지 않게 산 때의 단계 · 가격으로 그림
            drawShopCard(ctx, r.x, r.y, r.w, r.h, card, bought ? shopBoughtLv : cardLevel(id), f, bought ? { price: shopBoughtPrice, affordable: true } : { price, affordable: gemCount >= price });
            if (sel) {
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 6;
                ctx.beginPath(); ctx.roundRect(r.x - 8, r.y - 8, r.w + 16, r.h + 16, 20); ctx.stroke();
            }
            if (shopBought && id !== shopBought) {          // 산 카드 외에는 어둡게
                ctx.fillStyle = 'rgba(0,0,0,0.65)';
                ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 14); ctx.fill();
            }
            if (shopBought === id) {                         // 구매 완료 표시
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.roundRect(r.x + 20, r.y + r.h / 2 - 40, r.w - 40, 80, 12); ctx.fill();
                ctx.fillStyle = '#000'; ctx.font = font('bold 40px'); ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';   // drawShopCard 가 'top' 으로 바꿔 두므로 다시 지정 (글씨가 아래로 처지던 원인)
                ctx.fillText('구매 완료', r.x + r.w / 2, r.y + r.h / 2);
            }
            ctx.restore();
        });

        if (shopBought === 'save' && saveCode) {            // 산 코드 보여 주기
            const by = L.cards[0].y - 150;
            ctx.fillStyle = 'rgb(20,20,20)'; ctx.beginPath(); ctx.roundRect(80, by - 60, LOGIC_WIDTH - 160, 120, 14); ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.roundRect(80, by - 60, LOGIC_WIDTH - 160, 120, 14); ctx.stroke();
            ctx.fillStyle = '#fff'; ctx.font = font('bold 64px'); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(saveCode, LOGIC_WIDTH / 2, by);
            ctx.fillStyle = 'rgb(160,160,160)'; ctx.font = font('30px');
            ctx.fillText(`${saveStageLabel(saveTo)} · 업그레이드 화면에서 다시 볼 수 있음`, LOGIC_WIDTH / 2, L.msgY);
        }
        if (shopBought) {
            drawShopButton(L.next, '다음 스테이지 ▶', null, true, true);
        } else {
            const selPrice = shopSel >= 0 ? cardPrice(shopCards[shopSel]) : null;
            drawShopButton(L.reroll, '리롤', rerollCost, gemCount >= rerollCost, false);
            drawShopButton(L.buy, '구매', selPrice, selPrice != null && gemCount >= selPrice, true);
            drawShopButton(L.skip, '건너뛰기', null, true, false);
        }

        if (shopMsg && now - shopMsgT < 1400) {
            ctx.globalAlpha = Math.min(1, (1400 - (now - shopMsgT)) / 300);
            ctx.fillStyle = '#fff'; ctx.font = font('bold 38px'); ctx.textAlign = 'center';
            ctx.fillText(shopMsg, LOGIC_WIDTH / 2, L.msgY);
            ctx.globalAlpha = 1;
        }
    }

    function update() {
        if (gameState !== 'PLAY') return;

        movePaddle();

        // 패들 넓이 보간 (아이템 효과)
        if (paddle.targetWidth) {
            paddle.width += (paddle.targetWidth - paddle.width) * 0.15;
        }

        updateGems();

        // 기본 레이저 없음 (레이저는 상점 업그레이드로만 획득 예정)

        // 레이저 업그레이드 발사
        const laserLv = cardLevel('laser');
        if (laserLv > 0) {
            paddle.laserTimer += STEP_MS;
            if (paddle.laserTimer >= LASER_INTERVALS[laserLv] - 0.001) {   // 소수점 오차로 1프레임 늦게 발사되는 것 방지
                paddle.laserTimer -= LASER_INTERVALS[laserLv];
                const ly = paddle.y - 10;
                laserOrigins(laserLv).forEach(x => lasers.push({ x: x - 2, y: ly, w: 4, h: 20 }));
                sfx('laser');
            }
        }
        
        // 레이저 이동 및 충돌
        for (let i = lasers.length - 1; i >= 0; i--) {
            const l = lasers[i];
            l.y -= 18;
            if (l.y < HUD_TOP_H) { lasers.splice(i, 1); continue; }
            
            let hit = null;
            for (const brick of bricks) {
                if (!brick.alive) continue;
                if (l.x + l.w > brick.x && l.x < brick.x + brick.w && l.y < brick.y + brick.h && l.y + l.h > brick.y) {
                    hit = brick; break;
                }
            }
            if (hit) {
                lasers.splice(i, 1);
                if (BRICK_TIERS[hit.tier].laserProof) {
                    sfx('laserBlock');
                    spawnBurst({ x: l.x - 6, y: hit.y + hit.h - 8, w: 16, h: 10 }, 6);   // 고무: 레이저가 튕겨 나감
                } else {
                    damageBrick(hit, 1, false, 'laser');
                }
            }
        }

        // 여러 공 처리
        for (let bIdx = balls.length - 1; bIdx >= 0; bIdx--) {
            const ball = balls[bIdx];
            if (ball.hold > 0) {                                               // 발사 전: 처음 자리에 멈춰 있음 (패들은 움직일 수 있음)
                const h = ball.home;                                           // 다른 곳에서 공 자리 · 속도를 바꿨으면 (분열 · 조준 · 테스트 등) 바로 출발
                if (h && (ball.x !== h[0] || ball.y !== h[1] || ball.vx !== h[2] || ball.vy !== h[3])) ball.hold = 0;
                else { ball.hold -= STEP_MS; if (ball.hold > 0) continue; ball.hold = 0; }
            }
            const speed = Math.hypot(ball.vx, ball.vy);
            const steps = Math.max(1, Math.ceil(speed / (ball.radius * 0.5)));
            const stepX = ball.vx / steps;
            const stepY = ball.vy / steps;

            for (let s = 0; s < steps; s++) {
                ball.x += stepX;
                ball.y += stepY;

                let wallHit = false;                                                   // 심연의 구체: 좌 · 우 · 위 벽에 튕겨도 속도 +1%
                if (ball.x - ball.radius < 0) { ball.x = ball.radius; if (ball.vx < 0) wallHit = true; ball.vx = Math.abs(ball.vx); }
                if (ball.x + ball.radius > LOGIC_WIDTH) { ball.x = LOGIC_WIDTH - ball.radius; if (ball.vx > 0) wallHit = true; ball.vx = -Math.abs(ball.vx); }
                if (ball.y - ball.radius < HUD_TOP_H) { ball.y = HUD_TOP_H + ball.radius; if (ball.vy < 0) wallHit = true; ball.vy = Math.abs(ball.vy); }   // 천장 = 상단 HUD 아래
                if (wallHit) abyssBoost(ball);

                if (ball.vy > 0 && checkCollision(ball, { x: paddle.x - PADDLE_HIT_MARGIN, y: paddle.y, w: paddle.width + PADDLE_HIT_MARGIN * 2, h: paddle.height })) {
                    ball.y = paddle.y - ball.radius - 1;
                    let hitPoint = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
                    hitPoint = Math.max(-1, Math.min(1, hitPoint));
                    if (Math.abs(hitPoint) < PADDLE_MIN_OFFSET) {
                        const dir = hitPoint !== 0 ? Math.sign(hitPoint) : (ball.vx >= 0 ? 1 : -1);
                        hitPoint = dir * PADDLE_MIN_OFFSET;
                    }
                    const maxAngle = PADDLE_MAX_ANGLE;
                    const angle = hitPoint * maxAngle;
                    screenShake = Math.max(screenShake, SHAKE_PADDLE);
                    ball.vx = speed * Math.sin(angle);
                    ball.vy = -speed * Math.cos(angle);
                    // 조준: 남은 블럭이 7개 이하이면 가장 가까운 블럭을 향해 튕김
                    const plan = aimPlan(ball.x, ball.y, ball.radius);
                    if (plan) { ball.vx = speed * Math.sin(plan.a); ball.vy = -speed * Math.cos(plan.a); }
                    // 심연의 구체: 공 중심이 패들 한가운데 5% 안이면 가장 가까운 블럭을 조준해 발사
                    else if (cardLevel('abyss') > 0 && Math.abs(ball.x - (paddle.x + paddle.width / 2)) <= paddle.width * ABYSS_CENTER / 2) {
                        const ap = abyssAimPlan(ball.x, ball.y, ball.radius);
                        if (ap) { ball.vx = speed * Math.sin(ap.a); ball.vy = -speed * Math.cos(ap.a); ball.abyssFx = 400; sfx('laser'); }
                    }
                    // 볼 복제: 부딪친 볼은 사라지고 좌우로 2개 발사 (최대 8개)
                    const cloneLv = cardLevel('clone');
                    if (cloneLv > 0 && balls.length < CLONE_MAX_BALLS[cloneLv] && Math.random() < CLONE_CHANCE[cloneLv]) ball.cloneMe = true;
                    break;
                }

                // 보호 블럭: 떨어지는 공을 막고 위로 튕김. 막은 블럭은 사라짐
                if (ball.vy > 0) {
                    const sh = shields.find(q => q.alive && checkCollision(ball, q));
                    if (sh) {
                        sh.alive = false;
                        ball.y = sh.y - ball.radius - 1;
                        ball.vy = -Math.abs(ball.vy);
                        spawnBurst(sh, 40);
                        screenShake = Math.max(screenShake, SHAKE_CHIP);
                        break;
                    }
                }

                let hit = null, hitMin = Infinity, hitAxis = null;
                for (const brick of bricks) {
                    if (!brick.alive) continue;
                    if (!circleHitsRect(ball.x, ball.y, ball.radius, brick)) continue;   // 공 모양(원) 기준: 모서리 빈틈 없음 (V4.37.1)
                    const oL = (ball.x + ball.radius) - brick.x;
                    const oR = (brick.x + brick.w) - (ball.x - ball.radius);
                    const oT = (ball.y + ball.radius) - brick.y;
                    const oB = (brick.y + brick.h) - (ball.y - ball.radius);
                    // 옆 블럭에 붙어 있는 면(이음새)은 공이 닿을 수 없으므로 후보에서 뺌
                    const cand = [['left', oL], ['right', oR], ['top', oT], ['bottom', oB]].filter(([side]) => !sealedSide(brick, side));
                    const list = cand.length ? cand : [['left', oL], ['right', oR], ['top', oT], ['bottom', oB]];
                    let m = Infinity, axis = null;
                    for (const [side, v] of list) if (v < m) { m = v; axis = side; }
                    if (m < hitMin) {
                        hitMin = m; hit = brick; hitAxis = axis;
                    }
                }

                if (hit) {
                    const pwr = ball.power || 1;
                    const hpLeft = isBreakable(hit) ? BRICK_TIERS[hit.tier].hp - hit.hits : Infinity;
                    // 기본은 항상 반사. '돌파' 보유 시 볼 파워 >= 남은 체력이면 파괴하고 지나감
                    const pierce = cardLevel('pierce') > 0 && isBreakable(hit) && (BRICK_TIERS[hit.tier].gate ? hpLeft <= GATE_BALL_DMG : pwr >= hpLeft);
                    
                    damageBrick(hit, pwr);
                    
                    // 심연의 구체: 블럭에 튕길 때마다 처음 속도의 +1% (최대 2배) · 벽에 튕길 때도 (V4.48.0)
                    if (!pierce) abyssBoost(ball);
                    if (!pierce) {
                        if (hitAxis === 'left')   { ball.x = hit.x - ball.radius;         ball.vx = -Math.abs(ball.vx); }
                        if (hitAxis === 'right')  { ball.x = hit.x + hit.w + ball.radius; ball.vx =  Math.abs(ball.vx); }
                        if (hitAxis === 'top')    { ball.y = hit.y - ball.radius;         ball.vy = -Math.abs(ball.vy); }
                        if (hitAxis === 'bottom') { ball.y = hit.y + hit.h + ball.radius; ball.vy =  Math.abs(ball.vy); }
                        break;
                    }
                    // 관통: 멈추지 않고 남은 이동을 계속 (다음 블럭도 조건이 맞으면 연속 관통)
                }
            }

            if (ball.y > LOGIC_HEIGHT) {
                balls.splice(bIdx, 1);
                sfx('drop');
                continue;
            }

            if (ball.cloneMe) {
                const a = Math.atan2(ball.vy, ball.vx), spd = Math.hypot(ball.vx, ball.vy);
                balls.splice(bIdx, 1);
                const cs = cardLevel('abyss') > 0 ? BALL_BASE_SPEED : spd;   // 심연의 구체: 분열한 공은 처음 속도
                [-CLONE_SPREAD, CLONE_SPREAD].forEach(d => balls.push({
                    x: ball.x, y: ball.y, vx: Math.cos(a + d) * cs, vy: Math.sin(a + d) * cs,
                    radius: ball.radius, power: ball.power, trail: []
                }));
                spawnBurst({ x: ball.x - 20, y: ball.y - 20, w: 40, h: 40 }, 24);
                continue;
            }

            // 너무 가로로 튕기지 않게: 진행 방향이 수직에서 BALL_MAX_TILT 를 넘으면 세로 성분을 늘림 (속도 크기는 그대로)
            {
                const sp = Math.hypot(ball.vx, ball.vy), minVy = sp * Math.cos(BALL_MAX_TILT);
                if (sp > 0 && Math.abs(ball.vy) < minVy) {
                    const vy = (ball.vy >= 0 ? 1 : -1) * minVy;
                    ball.vx = Math.sign(ball.vx || 1) * Math.sqrt(sp * sp - vy * vy); ball.vy = vy;
                }
            }
            ball.trail.unshift({ x: ball.x, y: ball.y });
            if (ball.trail.length > TRAIL_MAX) ball.trail.pop();
        }

        updateEnemies();
        if (balls.length === 0) {
            lives--;
            gameState = lives > 0 ? 'LIFE_LOST' : 'GAME_OVER';
            lostAt = performance.now();
        }

        updateBurst();

        // 금속(파괴 불가)은 클리어 조건에서 제외
        if (boss) { if (!boss.dead) updateBoss(); return; }   // 보스전: 블럭 없음, 보스를 깨야 끝
        if (isKeyStage() ? !keyBrickAlive() : !bricks.some(b => b.alive && isBreakable(b))) startClearSeq();   // 키 블럭 스테이지: 키 블럭만 깨면 클리어
    }

    // ===== 벽돌 파괴 시 모래가 흩어지는 파티클 =====
    const burst = [];
    // 파괴 시 파티클 개수를 2.5배 늘림
    const BURST_PER_BRICK = 150;

    function spawnBurst(brick, count = BURST_PER_BRICK) {
        for (let i = 0; i < count; i++) {
            const a = Math.random() * Math.PI * 2;
            // 튀어 나가는 속도를 높여서 더 확 퍼지게 함
            const sp = 2 + Math.random() * 8;
            burst.push({
                x: brick.x + Math.random() * brick.w,
                y: brick.y + Math.random() * brick.h,
                vx: Math.cos(a) * sp,
                vy: Math.sin(a) * sp - 2, // 위로 솟는 힘 강화
                life: 1 + Math.random() * 0.5 // 수명도 약간 늘림
            });
        }
    }

    function updateBurst() {
        for (let i = burst.length - 1; i >= 0; i--) {
            const p = burst[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.35;      // 더 무겁게 빨리 가라앉게
            p.vx *= 0.95;      // 공기 저항을 늘려 옆으로는 빨리 멈춤 (포물선 형태 강조)
            p.life -= 0.02;    // 사라지는 속도 감소 (더 오래 보임)
            if (p.life <= 0) burst.splice(i, 1);
        }
    }

    function drawBurst() {
        const half = DOT_SIZE / 2;
        for (const p of burst) {
            // 입자가 더 밝게 빛나며 시작해 서서히 어두워짐
            const L = Math.min(255, Math.round(p.life * 300));
            ctx.fillStyle = `rgb(${L},${L},${L})`;
            ctx.fillRect(p.x - half, p.y - half, DOT_SIZE, DOT_SIZE);
        }
    }

    // ===== 패들 렌더링 (도트) =====
    // 게임 기본 패들 = 개발자 모드 5번 CLASSIC VAUS + 아이템 효과
    const LASER_PADDLE_LV = 2;
    function drawPaddle() {
        if (b3dv) return;                                                   // 보스3 삼킴 연출: 패들은 연출이 직접 그림
        const frame = Math.floor(performance.now() / SAND_INTERVAL) % SAND_FRAMES;
        if (cardLevel('laser') >= LASER_PADDLE_LV) {   // 레이저 2단계부터 레이저 패들 (양쪽 포구 = 양쪽 발사 위치)
            pvRailLaser(ctx, paddle.x, paddle.y, paddle.width, paddle.height, frame);
        } else {
            pvClassicVaus(ctx, paddle.x, paddle.y, paddle.width, paddle.height, frame);
        }
        if (paddleStun > 0) drawPaddleStun(ctx, paddle.x, paddle.y, paddle.width, paddle.height, performance.now(), paddleStun / PADDLE_STUN_MS, frame);
    }

    function drawAimGuide() {
        if (gameState !== 'PLAY') return;
        const t = performance.now();
        balls.forEach(b => {
            if (b.vy <= 0) return;
            const oy = paddle.y - b.radius - 1;
            const p = aimPlan(b.x, oy, b.radius);
            if (!p) return;
            const tgt = p.tgt, tx = tgt.x + tgt.w / 2, ty = tgt.y + tgt.h / 2;
            const pts = p.wx == null ? [[b.x, oy], [tx, ty]] : [[b.x, oy], [p.wx, p.wy], [tx, ty]];
            const segs = [];
            let total = 0;
            for (let i = 1; i < pts.length; i++) { const L = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); segs.push({ a: pts[i - 1], b: pts[i], L, s0: total }); total += L; }
            const shift = (t / 40) % 36;
            for (let d = shift; d < total; d += 36) {
                const sg = segs.find(q => d < q.s0 + q.L) || segs[segs.length - 1], u = (d - sg.s0) / sg.L;
                const L = Math.round(150 * (1 - d / total) + 40);
                ctx.fillStyle = `rgb(${L},${L},${L})`;
                ctx.fillRect(sg.a[0] + (sg.b[0] - sg.a[0]) * u - 2, sg.a[1] + (sg.b[1] - sg.a[1]) * u - 2, 4, 4);
            }
            // 벽에 닿는 지점 표시
            if (p.wx != null) { ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillRect(p.wx - 5, p.wy - 5, 10, 10); }
            // 목표 블럭 모서리 표시
            const f = 6, x0 = tgt.x + 4, y0 = tgt.y + 4, x1 = tgt.x + tgt.w - 4, y1 = tgt.y + tgt.h - 4;
            ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(x0, y0 + f); ctx.lineTo(x0, y0); ctx.lineTo(x0 + f, y0);
            ctx.moveTo(x1 - f, y0); ctx.lineTo(x1, y0); ctx.lineTo(x1, y0 + f);
            ctx.moveTo(x0, y1 - f); ctx.lineTo(x0, y1); ctx.lineTo(x0 + f, y1);
            ctx.moveTo(x1 - f, y1); ctx.lineTo(x1, y1); ctx.lineTo(x1, y1 - f);
            ctx.stroke();
        });
    }

    function drawShields() {
        const f = Math.floor(performance.now() / SAND_INTERVAL) % SAND_FRAMES;
        shields.forEach((q, i) => {
            if (!q.alive) return;
            scatterDots(ctx, q.x, q.y, q.w, q.h, { seed: 8300 + i, frame: f, spacing: 2.4, density: 0.9, lum: (nx, ny) => 230 - ny * 70 });
            strokeDotRect(ctx, q.x, q.y, q.w, q.h, 6, { seed: 8350 + i, frame: f, lum: 255, density: 0.95, spacing: 2 });
        });
    }

    // ===== 공, 레이저, 아이템 렌더링 =====
    // 심연의 구체 공 그림: 보스2 구체를 공 크기로 (줄무늬 3줄만 보이게 넓힌 그림을 미리 6장)
    let abyssBallCv = null;
    function abyssBallSprite(f) {
        if (!abyssBallCv) {
            abyssBallCv = [];
            for (let i = 0; i < SAND_FRAMES; i++) {
                const cv = document.createElement('canvas'); cv.width = cv.height = 40; const c = cv.getContext('2d'), ct = Math.cos(B2_TILT), st = Math.sin(B2_TILT), band = Math.PI / 3.2;
                scatterDots(c, 1, 1, 38, 38, { seed: 4401, frame: i, spacing: 1.7,
                    mask: (nx, ny) => Math.hypot(nx - 0.5, ny - 0.5) <= 0.5,
                    lum: (nx, ny) => { const dx = (nx - 0.5) * 2, dy = (ny - 0.5) * 2, d2 = dx * dx + dy * dy, z = Math.sqrt(Math.max(0, 1 - d2));
                        if (d2 > 0.86) return 170 + 70 * z; const lat = Math.asin(Math.max(-1, Math.min(1, dy * ct - z * st)));
                        return Math.floor((lat + Math.PI / 2 + i * 0.12) / band) % 2 === 0 ? 245 * (0.45 + 0.55 * z) : 70; } });
                abyssBallCv.push(cv);
            }
        }
        return abyssBallCv[f % abyssBallCv.length];
    }
    function drawBall() {
        const frame = Math.floor(performance.now() / SAND_INTERVAL) % SAND_FRAMES;
        
        balls.forEach((ball, bIdx) => {
            const pwr = ball.power || 1;
            


            // 파워 2 이상: 공 크기는 그대로 두고, 공 안에서 회전하는 밝은 점(파워-1개)과
            // 촘촘한 코어로 표현. 공 테두리 밖으로 아무것도 그리지 않는다.
            if (pwr >= 2) {
                const t = performance.now() / 260;
                const orbit = ball.radius * 0.55;
                const n = Math.min(pwr - 1, 6);
                for (let k = 0; k < n; k++) {
                    const a = t + k * Math.PI * 2 / n;
                    const ox = ball.x + Math.cos(a) * orbit, oy = ball.y + Math.sin(a) * orbit;
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(ox - 2.5, oy - 2.5, 5, 5);
                }
            }

            if (cardLevel('abyss') > 0) {                                      // 심연의 구체: 작은 줄무늬 구체 + 수정 반짝임
                const sph = abyssBallSprite(frame), now = performance.now();
                ctx.drawImage(sph, ball.x - ball.radius - 1, ball.y - ball.radius - 1, ball.radius * 2 + 2, ball.radius * 2 + 2);
                const tw = 0.5 + 0.5 * Math.sin(now / 90 + bIdx), a = (now / 400 + bIdx) % (Math.PI * 2);
                ctx.fillStyle = `rgba(255,255,255,${0.55 + 0.45 * tw})`;
                ctx.fillRect(ball.x + Math.cos(a) * ball.radius * 0.6 - 1.5, ball.y + Math.sin(a) * ball.radius * 0.6 - 1.5, 3, 3);
                ctx.fillRect(ball.x - ball.radius * 0.4 - 2, ball.y - ball.radius * 0.45 - 2, 4, 4);
                if (ball.abyssFx > 0) { ball.abyssFx -= 16; ctx.fillStyle = `rgba(255,255,255,${0.5 * ball.abyssFx / 400})`; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius * (1.2 + (1 - ball.abyssFx / 400)), 0, Math.PI * 2); ctx.fill(); }
                return;
            }
            const d = ball.radius * 2;
            scatterDots(ctx, ball.x - ball.radius, ball.y - ball.radius, d, d, {
                seed: 4001 + bIdx * 10, frame, spacing: 2.5,
                mask: (nx, ny) => Math.hypot(nx - 0.5, ny - 0.5) <= 0.5,
                density: (nx, ny) => Math.max(0.25, 1 - Math.hypot(nx - 0.34, ny - 0.34) * 1.05),
                lum: (nx, ny) => Math.max(70, 255 - Math.hypot(nx - 0.34, ny - 0.34) * 210)
            });
        });
        
        lasers.forEach((l, i) => {
            scatterDots(ctx, l.x, l.y, l.w, l.h, { seed: 8000 + i, frame, density: 1, lum: 255, spacing: 1.5 });
        });
        
        const gemT = performance.now();
        gems.forEach(g => drawMoneyGem(ctx, g.x, g.y, GEM_SIZE, gemT, g.phase));
    }

    // ===== 잔상 렌더링 (도트 혜성 꼬리) =====
    function drawTrail() {
        const frame = Math.floor(performance.now() / SAND_INTERVAL) % SAND_FRAMES;
        
        balls.forEach((b, bIdx) => {
            for (let i = b.trail.length - 1; i >= 1; i--) {
                const p = b.trail[i];
                const fade = 1 - i / TRAIL_MAX;
                const size = b.radius * 2 * (0.3 + fade * 0.7);

                scatterDots(ctx, p.x - size / 2, p.y - size / 2, size, size, {
                    seed: 5000 + i + bIdx * 100, frame,
                    spacing: 2.8,
                    mask: (nx, ny) => Math.hypot(nx - 0.5, ny - 0.5) <= 0.5,
                    density: fade * fade * 0.85,
                    lum: 40 + fade * 200
                });
            }
        });
    }

    // ===== 메인 드로우 =====
    // 프롤로그 SKIP 버튼: 검은 판 + 어두운 모래 테두리 + 회색 글씨 + 모래 화살표 (게임 HUD 와 같은 결)
    const SKIP_BTN = { x: LOGIC_WIDTH - 208, y: 40, w: 168, h: 60 };
    function drawSkipButton(t) {
        const { x, y, w, h } = SKIP_BTN, f = Math.floor(t / SAND_INTERVAL) % SAND_FRAMES;
        const pulse = 0.5 + 0.5 * Math.sin(t * 0.004);   // 아주 약하게 숨쉬듯
        ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.beginPath(); ctx.roundRect(x, y, w, h, 8); ctx.fill();
        scatterDots(ctx, x + 3, y + 3, w - 6, h - 6, { frame: f, seed: 8801, spacing: 3.2, density: 0.18, lum: 60 });   // 안쪽 옅은 모래
        strokeDotRect(ctx, x, y, w, h, 8, { seed: 8802, frame: f, lum: 95 + 30 * pulse, density: 0.9, spacing: 2.2 });
        ctx.fillStyle = 'rgb(150,150,150)'; ctx.font = font('bold 27px'); ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        ctx.fillText('SKIP', x + 26, y + h / 2 + 1);
        // 모래 화살표 두 개 (▶▶)
        const ax = x + w - 62, ay = y + h / 2;
        [0, 16].forEach((dx, i) => scatterDots(ctx, ax + dx, ay - 10, 14, 20, { frame: f, seed: 8810 + i, spacing: 1.8, density: 0.95, lum: 130 + 40 * pulse,
            mask: (nx, ny) => nx < 1 - Math.abs(ny - 0.5) * 2 }));
    }
    function draw() {
        if (gameState === 'ENDING') { drawEndingGame(); drawVolumeButton(); return; }
        if (gameState === 'HOWTO') {
            const t = performance.now() - howtoStartT;
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, LOGIC_WIDTH, LOGIC_HEIGHT);
            ctx.save(); ctx.translate(0, (LOGIC_HEIGHT - HT_H) / 2); drawHowTo(ctx, t);
            if (t >= HT_READY_MS) { ctx.globalAlpha = Math.min(1, (t - HT_READY_MS) / 500) * (0.45 + 0.55 * Math.abs(Math.sin(t * 0.0025)));
                ctx.fillStyle = '#bbb'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = font('30px'); ctx.fillText('> TOUCH <', HT_W / 2, HT_H - 60); ctx.globalAlpha = 1; }
            ctx.restore(); drawSkipButton(t); drawVolumeButton(); return;   // SKIP: 게임 방법도 바로 넘길 수 있음 (V4.48.4)
        }
        if (gameState === 'PROLOGUE') {
            const t = performance.now() - prologueStartT;
            {                                                                     // 자동으로 안 넘어감: 마지막 문구 뒤 누르면 시작 (V4.44.2)
                ctx.fillStyle = '#000'; ctx.fillRect(0, 0, LOGIC_WIDTH, LOGIC_HEIGHT);
                ctx.save(); ctx.translate(0, (LOGIC_HEIGHT - PRO_H) / 2); drawPrologueD(ctx, t, true); ctx.restore();
                drawSkipButton(t);
                drawVolumeButton();
                return;
            }
        }

        ctx.fillStyle = '#020202';
        ctx.fillRect(0, 0, LOGIC_WIDTH, LOGIC_HEIGHT);

        // 화면 흔들림 - 게임 장면에만 적용
        ctx.save();
        if (screenShake > 0) {
            ctx.translate((Math.random() - 0.5) * screenShake * 2.8, (Math.random() - 0.5) * screenShake * 2.2);
        }

        // 배경 먼지 - 가장 먼저 그려 모든 오브젝트 뒤에 깔림
        drawDust();

        const baseFrame = Math.floor(performance.now() / SAND_INTERVAL);

        // 벽돌 - 미리 만든 모래 스프라이트를 블리팅
        for (const brick of bricks) {
            if (!brick.alive) continue;
            const f = (baseFrame + brick.phase) % SAND_FRAMES;
            const BT = BRICK_TIERS[brick.tier];
            if (BT.gate) { drawGateBrick(ctx, brick.x, brick.y, brick.w, brick.h, BT, performance.now(), brick.hits, f); continue; }
            if (BT.key) { drawKeyBrick(ctx, brick.x, brick.y, brick.w, brick.h, BT, performance.now(), f); continue; }
            if (BT.turret) { drawGameTurret(brick, f, performance.now()); continue; }
            const displayHits = Math.min(brick.hits, BT.hp === Infinity ? 0 : BT.hp - 1);
            ctx.drawImage(brickSprites[brick.tier][displayHits][f], brick.x, brick.y);
        }

        drawBurst();
        for (let i = keyFxList.length - 1; i >= 0; i--) if (!drawKeyFx(ctx, keyFxList[i], performance.now())) keyFxList.splice(i, 1);
        drawTrail();
        drawShields();
        drawAimGuide();
        drawEnemies();
        drawBoss();
        drawPaddle();
        drawBall();
        ctx.restore();

        // ===== 상태 오버레이 (START / GAME_OVER / NEXT_STAGE / LIFE_LOST) =====
        if (gameState !== 'PLAY' && gameState !== 'CLEAR_SEQ' && gameState !== 'SHOP' && gameState !== 'CARD_INTRO' && gameState !== 'UPG_VIEW' && gameState !== 'BOSS2_FINALE' && gameState !== 'BOSS3_DEVOUR' && gameState !== 'BOSS_DIE') {   // BOSS_DIE: 보스1 · 2 가 모래로 흩어지는 연출은 덮지 않음 (V4.48.1)
            ctx.fillStyle = 'rgba(0,0,0,0.85)';
            ctx.fillRect(0, 0, LOGIC_WIDTH, LOGIC_HEIGHT);
            drawDust();

            ctx.fillStyle = '#fff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            if (gameState === 'START') {
                ctx.font = font('bold 82px');
                ctx.fillText('STIPPLE', LOGIC_WIDTH / 2, LOGIC_HEIGHT / 2 - 180);
                ctx.font = font('bold 110px');
                ctx.fillText('BREAKOUT', LOGIC_WIDTH / 2, LOGIC_HEIGHT / 2 - 70);
                ctx.font = font('40px');
                ctx.fillText('PUSH START', LOGIC_WIDTH / 2, LOGIC_HEIGHT / 2 + 120);
                ctx.font = font('28px');
                ctx.fillText('V4.49.0', LOGIC_WIDTH / 2, LOGIC_HEIGHT - 160);
            } else if (gameState === 'GAME_OVER') {
                if (performance.now() - lostAt >= OVER_TO_TITLE_MS) goTitle();
                ctx.font = font('bold 100px');
                ctx.fillText('SYSTEM_FAILURE', LOGIC_WIDTH / 2, LOGIC_HEIGHT / 2 - 100);
                ctx.font = font('40px');
                ctx.fillText('> TITLE (CLICK) <', LOGIC_WIDTH / 2, LOGIC_HEIGHT / 2 + 100);
            } else if (gameState === 'NEXT_STAGE') {
                ctx.font = font('bold 90px');
                ctx.fillText(`STAGE ${currentStage + 1} CLEARED`, LOGIC_WIDTH / 2, LOGIC_HEIGHT / 2 - 100);
                ctx.font = font('40px');
                ctx.fillText('> CLICK FOR NEXT STAGE <', LOGIC_WIDTH / 2, LOGIC_HEIGHT / 2 + 100);
            } else if (gameState === 'LIFE_LOST') {
                ctx.font = font('bold 80px');
                ctx.fillText('SIGNAL LOST', LOGIC_WIDTH / 2, LOGIC_HEIGHT / 2 - 100);
                ctx.font = font('40px');
                ctx.fillText('> CLICK TO RESUME <', LOGIC_WIDTH / 2, LOGIC_HEIGHT / 2 + 100);
            }
        }

        drawHUD();
        if (gameState === 'CLEAR_SEQ' || gameState === 'SHOP') drawClearSeq();
        if (gameState === 'CARD_INTRO') drawCardIntro();
        if (gameState === 'UPG_VIEW') drawUpgradeView();
        if (gameState === 'BOSS_WARN') drawBossWarn();
    }

    // ===== 상시 HUD (모든 상태에서 가장 위에 그림) =====
    const HUD_TOP_H = 96;          // 72px 점수가 들어가도록 76 -> 96
    const HUD_COLOR = 'rgb(178,178,178)';   // HUD 글씨/아이콘 밝기 70% (255 x 0.7)
    const HUD_BOTTOM_H = 96;
    const VOL_BTN = { x: LOGIC_WIDTH - 96, y: LOGIC_HEIGHT - 96 + 20, w: 80, h: 56 };   // 우측 하단
    const UPG_BTN = { x: LOGIC_WIDTH - 96, y: 20, w: 80, h: 56 };                     // 우측 상단: 업그레이드
    const GEM_RIGHT = UPG_BTN.x - 22;                                                  // 보석 숫자 오른쪽 끝
    let upgHudPulse = 0;
    let soundOn = true;   // 볼륨 상태
    // ===== 사운드 (Web Audio 합성, 16비트 칩 느낌) =====
    // 합성 함수는 (ac, out, t) 를 받아서 실제 재생과 음량 측정(OfflineAudioContext)에 같이 씀
    const SND = (() => {
        const noiseCache = new WeakMap();
        function noiseBuf(ac) {
            let b = noiseCache.get(ac);
            if (!b) {
                b = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.5), ac.sampleRate);
                const d = b.getChannelData(0);
                for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
                noiseCache.set(ac, b);
            }
            return b;
        }
        // 음 하나: 파형, 시작/끝 주파수, 길이, 음량, 필터
        function tone(ac, out, t, o) {
            const osc = ac.createOscillator(), g = ac.createGain();
            osc.type = o.type || 'square';
            osc.frequency.setValueAtTime(o.f0, t);
            if (o.f1) osc.frequency.exponentialRampToValueAtTime(o.f1, t + (o.bend || o.dur));
            if (o.detune) osc.detune.value = o.detune;
            const a = o.attack || 0.002;
            g.gain.setValueAtTime(0.0001, t);
            g.gain.linearRampToValueAtTime(o.gain, t + a);
            g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
            let node = osc;
            if (o.lp) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; node.connect(f); node = f; }
            if (o.hp) { const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = o.hp; node.connect(f); node = f; }
            node.connect(g); g.connect(out);
            osc.start(t); osc.stop(t + o.dur + 0.02);
        }
        function noise(ac, out, t, o) {
            const src = ac.createBufferSource(), g = ac.createGain();
            src.buffer = noiseBuf(ac);
            let node = src;
            if (o.lp) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; node.connect(f); node = f; }
            if (o.hp) { const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = o.hp; node.connect(f); node = f; }
            if (o.bp) { const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = o.bp; f.Q.value = o.q || 1; node.connect(f); node = f; }
            g.gain.setValueAtTime(o.gain, t);
            g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
            node.connect(g); g.connect(out);
            src.start(t); src.stop(t + o.dur + 0.02);
        }
        const hz = m => 440 * Math.pow(2, (m - 69) / 12);          // MIDI 번호 -> Hz
        // 블럭 파괴 음계: C장조 5음 (연속으로 깨면 한 칸씩 올라감)
        const BREAK_SCALE = [72, 74, 76, 79, 81, 84, 86, 88, 91, 93, 96];

        const sfx = {
            // 블럭 파괴: 딱 하는 타격 + 맑은 종소리 + 짧은 저음 쿵 (가장 중요)
            break(ac, out, t, step = 0) {
                const m = BREAK_SCALE[Math.min(step, BREAK_SCALE.length - 1)], f = hz(m);
                noise(ac, out, t, { dur: 0.035, gain: 0.30, hp: 2500 });
                tone(ac, out, t, { type: 'square', f0: f * 2, f1: f, bend: 0.04, dur: 0.10, gain: 0.13, lp: 6000 });
                tone(ac, out, t + 0.004, { type: 'triangle', f0: f * 2, dur: 0.28, gain: 0.16 });
                tone(ac, out, t + 0.004, { type: 'sine', f0: f * 3, dur: 0.18, gain: 0.05 });
                tone(ac, out, t, { type: 'sine', f0: 160, f1: 55, dur: 0.09, gain: 0.28 });
            },
            // 벽돌에 튕김 (안 깨짐): 짧고 둥근 톡
            hit(ac, out, t) {
                tone(ac, out, t, { type: 'square', f0: 520, f1: 480, dur: 0.05, gain: 0.07, lp: 2200 });
                noise(ac, out, t, { dur: 0.015, gain: 0.08, hp: 3000 });
            },
            // 고무에 튕김: 통통 튀는 보잉
            rubber(ac, out, t) {
                tone(ac, out, t, { type: 'triangle', f0: 150, f1: 330, bend: 0.05, dur: 0.16, gain: 0.26 });
                tone(ac, out, t + 0.05, { type: 'sine', f0: 330, f1: 210, bend: 0.1, dur: 0.14, gain: 0.10 });
            },
            // 고무에 레이저 막힘: 먹먹한 툭
            laserBlock(ac, out, t) {
                noise(ac, out, t, { dur: 0.06, gain: 0.12, lp: 700 });
                tone(ac, out, t, { type: 'sine', f0: 180, f1: 90, dur: 0.07, gain: 0.10 });
            },
            // 레이저 발사: 작고 가벼운 피융
            laser(ac, out, t) {
                tone(ac, out, t, { type: 'square', f0: 1500, f1: 700, bend: 0.06, dur: 0.07, gain: 0.025, hp: 500 });
            },
            // 키 블럭 파괴: 자물쇠 철컥 2번 → 올라가는 장조 화음 (G C E G) + 반짝이 + 낮은 쿵. 약 1초
            keyBreak(ac, out, t) {
                noise(ac, out, t, { dur: 0.03, gain: 0.30, bp: 3200, q: 4 });
                tone(ac, out, t, { type: 'square', f0: 1760, dur: 0.03, gain: 0.06, lp: 6000 });
                noise(ac, out, t + 0.075, { dur: 0.04, gain: 0.32, bp: 1900, q: 3 });
                tone(ac, out, t + 0.075, { type: 'square', f0: 1170, f1: 980, dur: 0.05, gain: 0.07, lp: 5000 });
                tone(ac, out, t, { type: 'sine', f0: 130, f1: 45, dur: 0.18, gain: 0.30 });
                [67, 72, 76, 79].forEach((m, i) => {
                    const s = t + 0.14 + i * 0.07;
                    tone(ac, out, s, { type: 'triangle', f0: hz(m + 12), dur: 0.55 - i * 0.05, gain: 0.15 });
                    tone(ac, out, s, { type: 'sine', f0: hz(m + 24), dur: 0.3, gain: 0.04 });
                });
                [96, 100, 103].forEach((m, i) => tone(ac, out, t + 0.45 + i * 0.05, { type: 'sine', f0: hz(m), dur: 0.25, gain: 0.025 }));
            },
            // BREAKOUT 글씨가 뜰 때 (약 1.2초): 묵직한 쿵 + 금속 쨍 + 위로 열리는 짧은 5도 화음 (탈출 시작 신호)
            titleHit(ac, out, t) {
                noise(ac, out, t, { dur: 0.06, gain: 0.35, hp: 1800 });
                tone(ac, out, t, { type: 'sine', f0: 110, f1: 40, dur: 0.45, gain: 0.45 });
                tone(ac, out, t, { type: 'square', f0: 55, dur: 0.25, gain: 0.08, lp: 600 });
                tone(ac, out, t + 0.01, { type: 'triangle', f0: 1568, dur: 0.6, gain: 0.05 });
                [57, 64, 69].forEach((m, i) => tone(ac, out, t + 0.06 + i * 0.03, { type: 'square', f0: hz(m), dur: 1.1, gain: 0.04, lp: 2600, attack: 0.01 }));
                tone(ac, out, t + 0.06, { type: 'triangle', f0: hz(45), dur: 1.1, gain: 0.12 });
            },
            // 엔딩 A (열린 눈, 16초): 깨지는 소리 → 하얀 빛 (높은 화음) → 장조로 천천히 올라가는 곡 (A 장조, 72 BPM) → 새벽 (길게 남는 화음)
            endA(ac, out, t) {
                noise(ac, out, t + 2.4, { dur: 0.08, gain: 0.3, hp: 2500 });
                [69, 76, 81, 85].forEach((m, i) => tone(ac, out, t + 3.0 + i * 0.06, { type: 'sine', f0: hz(m + 12), dur: 2.4, gain: 0.03, attack: 0.3 }));
                const B = 60 / 72, chords = [[57, 61, 64, 69], [54, 57, 61, 66], [50, 54, 57, 62], [52, 56, 59, 64], [57, 61, 64, 69], [50, 54, 57, 62], [52, 56, 59, 64], [57, 61, 64, 69]];
                chords.forEach((ch, k) => { const s = t + 4.0 + k * B * 1.6;
                    tone(ac, out, s, { type: 'triangle', f0: hz(ch[0] - 12), dur: B * 1.7, gain: 0.08, attack: 0.08 });
                    ch.slice(1).forEach((m, j) => tone(ac, out, s + j * B * 0.4, { type: 'square', f0: hz(m + 12), dur: B * 0.9, gain: 0.018, lp: 2400 }));
                    tone(ac, out, s, { type: 'sine', f0: hz(ch[3] + 12), dur: B * 1.6, gain: 0.03, attack: 0.2 }); });
                [69, 73, 76, 81].forEach(m => tone(ac, out, t + 4.0 + 8 * B * 1.6, { type: 'triangle', f0: hz(m), dur: 3.2, gain: 0.05, attack: 0.4 }));
            },
            // 엔딩 B (모래시계, 16초): 문이 열리는 화음 → 1스테이지 곡 첫 음 (멀리, 느리게) → 뒤집힐 때 내려가는 소리 → 째깍 · 모래 흐름 → 프롤로그 첫 화음이 반음 어긋나 들림
            endB(ac, out, t) {
                [62, 66, 69].forEach((m, i) => tone(ac, out, t + 1.2 + i * 0.08, { type: 'sine', f0: hz(m + 12), dur: 2.4, gain: 0.03, attack: 0.3 }));
                [69, 72, 76, 72, 69, 67].forEach((m, i) => tone(ac, out, t + 4.2 + i * 0.55, { type: 'triangle', f0: hz(m), dur: 0.5, gain: 0.05, lp: 1800 }));
                tone(ac, out, t + 7.6, { type: 'sawtooth', f0: 220, f1: 55, bend: 1.8, dur: 1.9, gain: 0.04, lp: 900 });
                tone(ac, out, t + 7.6, { type: 'sine', f0: 110, f1: 27, bend: 1.8, dur: 1.9, gain: 0.08 });
                for (let k = 0; k < 9; k++) { tone(ac, out, t + 9.6 + k * 0.6, { type: 'square', f0: 1760, dur: 0.02, gain: 0.025, lp: 5000 }); tone(ac, out, t + 9.9 + k * 0.6, { type: 'square', f0: 1320, dur: 0.02, gain: 0.02, lp: 5000 }); }
                for (let k = 0; k < 10; k++) noise(ac, out, t + 10.8 + k * 0.42, { dur: 0.45, gain: 0.02, bp: 4500, q: 1.5 });
                [57, 64, 69].forEach(m => tone(ac, out, t + 11.8, { type: 'triangle', f0: hz(m), dur: 3.5, gain: 0.05, attack: 0.5 }));
                [58, 65].forEach(m => tone(ac, out, t + 12.6, { type: 'sine', f0: hz(m), dur: 2.6, gain: 0.03, attack: 0.8 }));
            },
            // 보스3 삼킴 (약 5.6초): 쩍 갈라지는 소리 · 귀울림 → 맥놀이 저음 → 점점 높아지는 빨아들임 · 신음 → 꿀꺽 → 정적 · 심장 박동 2번 → 가는 고음
            devour(ac, out, t) {
                noise(ac, out, t, { dur: 0.09, gain: 0.35, hp: 2000 });
                tone(ac, out, t, { type: 'square', f0: 90, f1: 38, dur: 0.32, gain: 0.22, lp: 900 });
                tone(ac, out, t, { type: 'sine', f0: 1800, f1: 2500, dur: 0.6, gain: 0.018 });
                tone(ac, out, t + 0.6, { type: 'sawtooth', f0: 55, dur: 3.4, gain: 0.07, lp: 420, attack: 0.5 });
                tone(ac, out, t + 0.6, { type: 'sawtooth', f0: 58.3, dur: 3.4, gain: 0.07, lp: 420, attack: 0.5 });
                for (let k = 0; k < 11; k++) noise(ac, out, t + 1.8 + k * 0.2, { dur: 0.32, gain: 0.03 + k * 0.012, bp: 300 + k * 260, q: 2 });
                tone(ac, out, t + 1.8, { type: 'sine', f0: 420, f1: 60, bend: 2.2, dur: 2.2, gain: 0.07 });
                tone(ac, out, t + 1.8, { type: 'triangle', f0: 233, f1: 95, bend: 2.2, dur: 2.2, gain: 0.04, detune: -30 });
                noise(ac, out, t + 4.0, { dur: 0.28, gain: 0.5, lp: 300 });
                tone(ac, out, t + 4.0, { type: 'sine', f0: 72, f1: 28, dur: 0.55, gain: 0.42 });
                tone(ac, out, t + 4.03, { type: 'triangle', f0: 210, f1: 80, dur: 0.15, gain: 0.1 });
                for (const at of [4.9, 5.28]) tone(ac, out, t + at, { type: 'sine', f0: 62, f1: 40, dur: 0.2, gain: 0.36, lp: 300 });
                tone(ac, out, t + 5.6, { type: 'sine', f0: 3100, dur: 0.45, gain: 0.012 });
                // 마지막 눈 (5.6 ~ 10.4초): 눈꺼풀이 젖은 듯 벌어지는 소리 → 아주 낮은 웅웅거림 · 느려지는 심장 → 정면을 보는 순간 낮은 쿵 → 감기는 소리
                noise(ac, out, t + 5.6, { dur: 0.6, gain: 0.05, bp: 700, q: 6 });
                tone(ac, out, t + 5.9, { type: 'sawtooth', f0: 41, dur: 4.4, gain: 0.05, lp: 160, attack: 1.2 });
                tone(ac, out, t + 5.9, { type: 'sine', f0: 43.5, dur: 4.4, gain: 0.06, attack: 1.2 });
                for (const at of [7.2, 8.1, 9.1]) tone(ac, out, t + at, { type: 'sine', f0: 58, f1: 38, dur: 0.24, gain: 0.3, lp: 260 });
                tone(ac, out, t + 7.2, { type: 'sine', f0: 34, f1: 24, dur: 0.9, gain: 0.25 });
                tone(ac, out, t + 7.2, { type: 'sine', f0: 2700, f1: 2500, dur: 2.6, gain: 0.008, attack: 0.8 });
                noise(ac, out, t + 9.9, { dur: 0.35, gain: 0.06, bp: 500, q: 5 });
            },
            // 파괴 불가 블럭: 금속 쨍 (배음이 안 맞는 두 음)
            metal(ac, out, t) {
                noise(ac, out, t, { dur: 0.03, gain: 0.10, hp: 5000 });
                tone(ac, out, t, { type: 'square', f0: 1245, dur: 0.22, gain: 0.035, lp: 7000 });
                tone(ac, out, t, { type: 'triangle', f0: 1873, dur: 0.30, gain: 0.07 });
                tone(ac, out, t, { type: 'sine', f0: 2960, dur: 0.12, gain: 0.03 });
            },
            // 공 떨어뜨림: 아래로 떨어지는 음
            drop(ac, out, t) {
                tone(ac, out, t, { type: 'triangle', f0: 660, f1: 110, bend: 0.45, dur: 0.5, gain: 0.20 });
                tone(ac, out, t + 0.02, { type: 'square', f0: 330, f1: 55, bend: 0.45, dur: 0.5, gain: 0.04, lp: 900 });
                noise(ac, out, t + 0.3, { dur: 0.25, gain: 0.05, lp: 400 });
            },
            // 스테이지 클리어: 올라가는 아르페지오 + 화음
            clear(ac, out, t) {
                [72, 76, 79, 84, 88].forEach((m, i) => {
                    tone(ac, out, t + i * 0.075, { type: 'square', f0: hz(m), dur: 0.16, gain: 0.07, lp: 4000 });
                    tone(ac, out, t + i * 0.075, { type: 'triangle', f0: hz(m + 12), dur: 0.22, gain: 0.06 });
                });
                const e = t + 5 * 0.075;
                [72, 76, 79, 84].forEach(m => tone(ac, out, e, { type: 'triangle', f0: hz(m), dur: 1.1, gain: 0.07, attack: 0.01 }));
                tone(ac, out, e, { type: 'square', f0: hz(96), dur: 0.6, gain: 0.03, lp: 5000 });
            },
            // 카드 구매: 동전 두 음
            buy(ac, out, t) {
                tone(ac, out, t, { type: 'square', f0: hz(83), dur: 0.07, gain: 0.09, lp: 6000 });
                tone(ac, out, t + 0.07, { type: 'square', f0: hz(88), dur: 0.35, gain: 0.09, lp: 6000 });
                tone(ac, out, t + 0.07, { type: 'triangle', f0: hz(100), dur: 0.3, gain: 0.05 });
            }
        };

        // 배경음: 88 BPM, A단조 계열 4마디 반복. 부드러운 패드 + 삼각파 아르페지오 (에코) + 저음
        const BPM = 88, S16 = 60 / BPM / 4;
        const BARS = [
            { bass: 45, chord: [57, 60, 64, 67] },   // Am7
            { bass: 41, chord: [57, 60, 64, 65] },   // Fmaj7
            { bass: 38, chord: [57, 62, 65, 69] },   // Dm
            { bass: 40, chord: [56, 59, 64, 68] }    // E
        ];
        const ARP = [0, 1, 2, 3, 2, 1, 2, 3, 0, 2, 3, 1, 3, 2, 1, 2];
        function bgmBar(ac, out, t, bar) {

        if (absorbMax() > 0 && (gameState === 'PLAY' || gameState === 'LIFE_LOST')) {
            const n = absorbMax(), cw = 22, ch = 8, cg = 6, tw = n * cw + (n - 1) * cg, bx = paddle.x + paddle.width / 2 - tw / 2, byy = paddle.y - 18;
            for (let i = 0; i < n; i++) {

        const mw = 64, mh = 18, gap = 14, my = LOGIC_HEIGHT - HUD_BOTTOM_H / 2 - mh / 2;

            ctx.fillRect(mx + mh, my, 2, mh);
            ctx.fillRect(mx + mw - mh - 2, my, 2, mh);

    function drawVolumeButton() {
        const { x, y, w, h } = VOL_BTN;
        ctx.strokeStyle = HUD_COLOR;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.roundRect(x, y, w, h, 10); ctx.stroke();

        // 스피커 몸체
        const cx = x + 26, cy = y + h / 2;
        ctx.fillStyle = HUD_COLOR;
        ctx.beginPath();
        ctx.moveTo(cx - 12, cy - 7); ctx.lineTo(cx - 4, cy - 7); ctx.lineTo(cx + 6, cy - 15);
        ctx.lineTo(cx + 6, cy + 15); ctx.lineTo(cx - 4, cy + 7); ctx.lineTo(cx - 12, cy + 7);
        ctx.closePath(); ctx.fill();

        ctx.lineWidth = 3;
        if (soundOn) {
            // 음파 2줄
            [10, 18].forEach(r => { ctx.beginPath(); ctx.arc(cx + 8, cy, r, -Math.PI / 4, Math.PI / 4); ctx.stroke(); });
        } else {
            // X 표시
            ctx.beginPath();
            ctx.moveTo(cx + 14, cy - 9); ctx.lineTo(cx + 30, cy + 9);
            ctx.moveTo(cx + 30, cy - 9); ctx.lineTo(cx + 14, cy + 9);
            ctx.stroke();
        }
    }

    // 캔버스 좌표가 볼륨 버튼 안이면 토글하고 true 반환
    function hitVolumeButton(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const lx = (clientX - rect.left) * LOGIC_WIDTH / rect.width;
        const ly = (clientY - rect.top) * LOGIC_HEIGHT / rect.height;
        const pad = 16;   // 손가락 터치 여유
        if (lx >= VOL_BTN.x - pad && lx <= VOL_BTN.x + VOL_BTN.w + pad &&
            ly >= VOL_BTN.y - pad && ly <= VOL_BTN.y + VOL_BTN.h + pad) {
            soundOn = !soundOn;
            applyVolume();
            return true;
        }
        return false;
    }

    function loop(now) {
        if (lastTime === 0) lastTime = now;
        let delta = now - lastTime;
        lastTime = now;

        if (delta > 250) delta = STEP_MS;

        accumulator += delta;
        let steps = 0;
        while (accumulator >= STEP_MS && steps < 5) {
            updateDust();
            screenShake = Math.max(0, screenShake - SHAKE_DECAY * STEP_MS / 1000);
            
            if (hitStopTimer > 0) {
                hitStopTimer -= STEP_MS;
            } else {
                if (gameState === 'CLEAR_SEQ') updateClearSeq();
                else if (gameState === 'CARD_INTRO') updateCardIntro();
                else if (gameState === 'BOSS_WARN') updateBossWarn();
                else if (gameState === 'BOSS_DIE') updateBossDie();
                else if (gameState === 'BOSS2_FINALE') updateBoss2Finale();
                else if (gameState === 'BOSS3_DEVOUR') updateB3Devour();
                else update();
            }
            if (gemHudPulse > 0) gemHudPulse -= STEP_MS;
            if (upgHudPulse > 0) upgHudPulse -= STEP_MS;
            
            accumulator -= STEP_MS;
            steps++;
        }

        draw();
        requestAnimationFrame(loop);
    }

    const OVER_TO_TITLE_MS = 6000;
    function goTitle() { initGame(0); gameState = 'START'; score = 0; gemCount = 0; stageGems = 0; gems.length = 0; for (const k in upgrades) delete upgrades[k]; }   // 처음 켰을 때와 같은 타이틀 화면 (지난 판의 수정 · 점수 · 카드 지움, V4.48.1)
    function tryStart() {
        if ((gameState === 'GAME_OVER' || gameState === 'LIFE_LOST') && performance.now() - lostAt < LOST_HOLD_MS) return;
        if (gameState === 'GAME_OVER') { goTitle(); return; }
        if (gameState === 'START') {
            lives = START_LIVES;
            score = 0;
            gemCount = 0;
            for (const k in upgrades) delete upgrades[k];

        } else if (gameState === 'NEXT_STAGE') {
            initGame(currentStage + 1);

        } else if (gameState === 'LIFE_LOST') {
            initGame(currentStage, false);
            gameState = 'PLAY';
        }
    }
    function toLogic(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        return { x: (clientX - rect.left) * LOGIC_WIDTH / rect.width, y: (clientY - rect.top) * LOGIC_HEIGHT / rect.height };
    }
    function onTap(clientX, clientY) {
        unlockAudio();
        if (hitVolumeButton(clientX, clientY)) return;
        const p = toLogic(clientX, clientY);
        if (gameState === 'PROLOGUE') {
            if ((p.x > LOGIC_WIDTH - 250 && p.y < 120) || performance.now() - prologueStartT >= PR4_WAIT_AT) {   // SKIP 버튼 · 또는 마지막 문구 뒤 아무 곳이나 → 게임 방법
                gameState = 'HOWTO'; howtoStartT = performance.now();
                if (!AC || AC.state !== 'running') unlockAudio();   // 스킵 버튼으로 넘어가도 소리 켜짐
            }
            return;
        }
        if (gameState === 'HOWTO') {                                              // 게임 방법: SKIP 버튼은 언제나 · 4번 다 보여 준 뒤에는 아무 곳이나 → 1스테이지
            if ((p.x > LOGIC_WIDTH - 250 && p.y < 120) || performance.now() - howtoStartT >= HT_READY_MS) gameState = 'PLAY';
            return;
        }
        if (gameState === 'ENDING') { if (endingDone() && performance.now() - endingT0 > ENDING_SILENCE_MS + END_LOOP + 2500) goTitle(); return; }   // 엔딩 중에는 못 넘김, 끝난 뒤 누르면 타이틀
        if (gameState === 'SHOP') { handleShopTap(p.x, p.y); return; }

        if (gameState === 'PLAY' && inRect({ x: UPG_BTN.x - 16, y: UPG_BTN.y - 16, w: UPG_BTN.w + 32, h: UPG_BTN.h + 32 }, p.x, p.y)) { openUpgradeView(); return; }
        tryStart();
    }

<canvas class="dev-fill" id="dev-bg-canvas" width="1170" height="1400" style="width:100%; display:block; background:#000;"></canvas>
<div class="dev-pager" style="display:flex; gap:10px; align-items:center; margin-top:10px;">${nav('prev', '◀', i === 0)}<div style="flex:1; text-align:center; font:bold 22px Menlo, monospace;">${i + 1} / ${n}</div>${nav('next', '▶', i === n - 1)}</div>`;

        prologue: {

            get body() {

                const nav = (k, label, off) => `<button class="dev-pro-nav" data-nav="${k}" ${off ? 'disabled' : ''} style="flex:1; padding:10px 0; font:bold 24px Menlo, monospace; border-radius:6px; cursor:${off ? 'default' : 'pointer'}; border:1px solid ${off ? '#333' : '#fff'}; background:#000; color:${off ? '#444' : '#fff'};">${label}</button>`;

                return `<div style="display:flex; gap:10px; align-items:center; margin-bottom:8px;">${nav('prev', '◀', endingPage === 0)}<div style="flex:3; text-align:center; font:bold 20px Menlo, monospace;">${V.name}</div>${nav('next', '▶', endingPage === ENDING_VIEWS.length - 1)}</div>
<div style="font-size:14px; color:#888; margin-bottom:6px;">${V.note}</div>
<canvas class="dev-fill" id="dev-ending-canvas" width="${PRO_W}" height="${PRO_H}" style="width:100%; display:block; background:#000; border:1px solid #444;"></canvas>`;

        },
        money: {
            title: '6. 보석',
            body: `<canvas class="dev-fill" id="dev-gem-canvas" width="1170" height="460" style="width:100%; background:#000; border:1px solid #444;"></canvas>`
        }
    };

    // --- 패들 후보: 기본 패들(1번)에서 조금씩만 변형 ---
    const paddleVariants = [
        { name: '1. SAND RAIL (이전 기본)',        fn: pvSandRail },
        { name: '2. VAUS + LASER (내장형)',   fn: pvRailLaser },
        { name: '3. BASE LONG (x1.4)',        fn: pvRailLong },
        { name: '4. BASE TRI-CELL (전기 연결)', fn: pvRailTriCell },
        { name: '5. CLASSIC VAUS (현재 적용)',    fn: pvClassicVaus }
    ];

    // 기본 패들의 레일 + 본체 외곽 + 양끝 브래킷 (공통 부분)
    function drawRailShell(c, x, y, w, h, f, seedBase) {
        const railH = h * 0.16, by = y + railH + 3, bh = h - railH - 5;
        scatterDots(c, x + w*0.04, y, w*0.92, railH, {
            seed: seedBase + 1, frame: f, spacing: 2.6,
            density: nx => 0.45 + (1 - Math.abs(nx-0.5)*2) * 0.55,
            lum: nx => 170 + (1 - Math.abs(nx-0.5)*2) * 85
        });
        return { railH, by, bh };
    }

    function drawRailBrackets(c, x, w, h, by, bh, f, seedBase) {
        const bw = h * 0.5;
        [x, x + w - bw].forEach((bx, i) => scatterDots(c, bx, by, bw, bh, {
            seed: seedBase + 10 + i, frame: f, density: 0.95, lum: 255, spacing: 2.7
        }));
    }

    // 1. 기본 패들
    function pvSandRail(c, x, y, w, h, f) {
        const { by, bh } = drawRailShell(c, x, y, w, h, f, 3000);
        scatterDots(c, x, by, w, bh, {
            seed: 3002, frame: f, density: 0.88,
            lum: (nx, ny) => 150 + (1-Math.abs(nx-0.5)*2)*55 + (1-ny)*40
        });
        strokeDotRect(c, x, by, w, bh, bh*0.35, { seed: 3003, frame: f, lum: 255, density: 0.95 });
        drawRailBrackets(c, x, w, h, by, bh, f, 3000);
        scatterDots(c, x+w/2-2.5, by+bh*0.18, 5, bh*0.64, { seed: 3020, frame: f, density: 1, lum: 255, spacing: 2.2 });
    }

    // 금속 명암 프로파일 (세로 위치 ny: 0=위, 1=아래)
    // 위쪽 강한 하이라이트 띠 + 가운데 어두운 반사 + 아래쪽 약한 2차 반사 = 연마된 은색 금속
    function metalLum(ny) {
        const hi  = 130 * Math.exp(-Math.pow((ny - 0.26) / 0.11, 2));
        const sec =  55 * Math.exp(-Math.pow((ny - 0.80) / 0.09, 2));
        const edge = 40 * Math.min(1, Math.min(ny, 1 - ny) * 6);   // 위아래 끝은 어둡게
        return Math.min(255, 85 + edge + hi + sec);
    }

    // 캡슐형 Vaus 실루엣 판정 (로컬 픽셀 좌표). ins만큼 안쪽으로 축소한 형태로 판정
    // 양끝은 위가 비스듬히 깎이고 아래는 거의 평평한 기수(nose) 형태
    const VAUS_CAP = 1.1;   // 끝 캡 길이 = 높이 x 1.1
    const VAUS_TRAP_TOP = 0.42, VAUS_TRAP_BOT = 0.2;   // 맨 끝에서 위 / 아래가 깎이는 비율 (끝면 높이 = 38%)
    function inCapsule(px, py, w, h, ins) {
        const W = w - ins * 2, H = h - ins * 2;
        const X = px - ins, Y = py - ins;
        if (X < 0 || X > W || Y < 0 || Y > H) return false;
        const capLen = H * VAUS_CAP;
        const d = Math.min(X, W - X);
        if (d >= capLen) return true;
        // 사다리꼴 끝: 둥근 곡선 대신 곧은 사선. 끝면(세로 평평한 부분)을 남겨서 각진 느낌
        const t = 1 - d / capLen;                       // 0 = 캡 안쪽 시작, 1 = 맨 끝
        const top = H * VAUS_TRAP_TOP * t;              // 위는 크게 깎임
        const bot = H - H * VAUS_TRAP_BOT * t;          // 아래는 조금 깎임
        return Y >= top && Y <= bot;
    }

    // 2. Vaus 캡슐형 은색 본체 + 본체 안에 내장된 레이저 포트
    //    모든 요소가 패들 높이(h) 안에만 그려져 공이 튀어나온 부분에 걸리지 않음
    function pvRailLaser(c, x, y, w, h, f) {
        const capLen = h * VAUS_CAP;
        const inside = (nx, ny, ins) => inCapsule(nx * w, ny * h, w, h, ins);

        // 1) 은색 원통 본체 - 위 하이라이트 / 아래 반사 / 양끝 캡은 살짝 밝게
        scatterDots(c, x, y, w, h, {
            seed: 3150, frame: f, spacing: 2.1, jitter: 0.5, density: 0.97,
            mask: (nx, ny) => inside(nx, ny, 0),
            lum: (nx, ny) => metalLum(ny) * (Math.min(nx, 1 - nx) * w < capLen ? 1.08 : 1)
        });

        // 2) 외곽선 - 위쪽은 밝게, 아래쪽은 어둡게 해서 입체감
        scatterDots(c, x, y, w, h, {
            seed: 3151, frame: f, spacing: 1.7, jitter: 0.3, density: 1,
            mask: (nx, ny) => inside(nx, ny, 0) && !inside(nx, ny, 2.2),
            lum: (nx, ny) => ny < 0.5 ? 255 : 140
        });

        // 3) 끝 캡과 본체를 나누는 이음새 (어두운 홈 + 안쪽 밝은 모서리)
        [capLen, w - capLen].forEach((dx, i) => {
            scatterDots(c, x + dx - 1.2, y + 3, 2.4, h - 6, { seed: 3160 + i, frame: f, spacing: 1.5, jitter: 0.2, density: 1, lum: 30 });
            scatterDots(c, x + dx + (i === 0 ? 1.8 : -3.4), y + 3, 1.6, h - 6, { seed: 3162 + i, frame: f, spacing: 1.5, jitter: 0.2, density: 0.9, lum: 230 });
        });

        // 4) 끝 캡 상단 광택 (참고 이미지의 파란 하이라이트를 밝기로 표현)
        [capLen * 0.55, w - capLen * 0.55].forEach((cx, i) => {
            const rw = capLen * 0.42, rh = h * 0.14;
            scatterDots(c, x + cx - rw / 2, y + h * 0.14, rw, rh, {
                seed: 3165 + i, frame: f, spacing: 1.5, jitter: 0.2, density: 1,
                mask: (nx, ny) => Math.hypot((nx - 0.5) * 2, (ny - 0.5) * 2) <= 1,
                lum: 255
            });
        });

        // 5) 회로 트레이스 (참고 이미지의 주황 라인) - 하단을 가로지르고 위로 꺾이는 밝은 선
        const tY = y + h * 0.72;
        const x0 = x + capLen + 5, x1 = x + w - capLen - 5;
        scatterDots(c, x0, tY - 1.1, x1 - x0, 2.2, { seed: 3170, frame: f, spacing: 1.5, jitter: 0.15, density: 1, lum: 235 });
        scatterDots(c, x0, tY + 1.4, x1 - x0, 1.4, { seed: 3171, frame: f, spacing: 1.5, jitter: 0.15, density: 1, lum: 40 });
        [x0, x + w * 0.4, x + w * 0.6, x1 - 2.2].forEach((tx, i) => {
            scatterDots(c, tx, y + h * 0.5, 2.2, tY - (y + h * 0.5) + 1, { seed: 3172 + i, frame: f, spacing: 1.5, jitter: 0.15, density: 1, lum: 235 });
        });

        // 6) 내장형 레이저 포트 - 본체 안에 파묻힌 하우징, 포구는 본체 윗면과 같은 높이
        [0.28, 0.72].forEach((t, i) => {
            const hw = h * 0.42, hh = h * 0.5;
            const hx = x + w * t - hw / 2, hy = y + h * 0.14;
            // 움푹 들어간 어두운 하우징
            scatterDots(c, hx, hy, hw, hh, { seed: 3180 + i, frame: f, spacing: 1.6, jitter: 0.2, density: 1, lum: 40 });
            strokeDotRect(c, hx, hy, hw, hh, 2, { seed: 3185 + i, frame: f, lum: 200, density: 1, spacing: 1.6 });
            // 원통형 포신 (왼쪽 세로 하이라이트)
            const bwid = hw * 0.38, bx = hx + (hw - bwid) / 2;
            scatterDots(c, bx, hy + 2, bwid, hh - 4, {
                seed: 3190 + i, frame: f, spacing: 1.4, jitter: 0.15, density: 1,
                lum: (nx) => 120 + 135 * Math.exp(-Math.pow((nx - 0.35) / 0.25, 2))
            });
            // 포구 발광 (하우징 안쪽 윗부분)
            scatterDots(c, bx - 1, hy + 1, bwid + 2, 2.5, { seed: 3195 + i, frame: f, spacing: 1.3, jitter: 0.1, density: 1, lum: 255 });
        });
    }

    // 3. 기본 패들을 1.4배 길게 (중심 기준 확장)
    function pvRailLong(c, x, y, w, h, f) {
        const lw = w * 1.4;
        pvSandRail(c, x - (lw - w) / 2, y, lw, h, f);
    }

    // 4. 기본 패들 내부를 3칸으로 나누고 칸 사이를 전기 아크로 연결
    function pvRailTriCell(c, x, y, w, h, f) {
        const { by, bh } = drawRailShell(c, x, y, w, h, f, 3200);
        const bw = h * 0.5;
        const gap = h * 0.45;
        const innerX = x + bw + 3;
        const innerW = w - (bw + 3) * 2;
        const cellW = (innerW - gap * 2) / 3;

        // 외곽선은 기본 패들과 동일하게 전체를 감싼다
        strokeDotRect(c, x, by, w, bh, bh*0.35, { seed: 3203, frame: f, lum: 255, density: 0.95 });
        drawRailBrackets(c, x, w, h, by, bh, f, 3200);

        for (let i = 0; i < 3; i++) {
            const cx = innerX + i * (cellW + gap);
            // 셀 본체 - 가운데 셀이 가장 밝음
            scatterDots(c, cx, by + 3, cellW, bh - 6, {
                seed: 3230 + i, frame: f, density: 0.9,
                lum: (nx, ny) => (i === 1 ? 190 : 160) + (1-ny)*40
            });
            strokeDotRect(c, cx, by + 3, cellW, bh - 6, 3, { seed: 3240 + i, frame: f, lum: 230, density: 0.9, spacing: 2.2 });
        }

        // 셀 사이 전기 아크 - 프레임마다 지그재그 모양이 바뀜
        const midY = by + bh / 2;
        for (let g = 0; g < 2; g++) {
            const gx0 = innerX + cellW + g * (cellW + gap);
            const steps = Math.max(6, Math.round(gap / 1.6));
            for (let s = 0; s <= steps; s++) {
                const t = s / steps;
                const jitter = (hash3(3300 + g, s, f) - 0.5) * bh * 0.55 * Math.sin(t * Math.PI);
                const px = gx0 + gap * t;
                const py = midY + jitter;
                c.fillStyle = 'rgb(255,255,255)';
                c.fillRect(px - DOT_SIZE/2, py - DOT_SIZE/2, DOT_SIZE, DOT_SIZE);
                // 아크 주변 희미한 방전 입자
                if (hash3(3310 + g, s, f) < 0.35) {
                    const L = 120 + (hash3(3320 + g, s, f) * 80) | 0;
                    c.fillStyle = `rgb(${L},${L},${L})`;
                    c.fillRect(px + (hash3(3330+g, s, f)-0.5)*4, py + (hash3(3340+g, s, f)-0.5)*6, DOT_SIZE, DOT_SIZE);
                }
            }
        }

        // 중앙 코어 마커 (가운데 셀 안)
        scatterDots(c, x + w/2 - 2.5, by + bh*0.18, 5, bh*0.64, { seed: 3220, frame: f, density: 1, lum: 255, spacing: 2.2 });
    }

    // 5. 클래식 아케이드 Vaus - 좌우 둥근 엔드캡(원작 빨강) + 가운데 은색 원통, 사이에 검은 틈
    //    흑백이므로 엔드캡은 더 어둡고 조밀한 도트, 원통은 밝은 금속 반사로 구분
    function pvClassicVaus(c, x, y, w, h, f) {
        const gap = 3;                 // 캡과 원통 사이 검은 틈
        const capW = h * 1.05;         // 엔드캡 길이
        const bodyX = x + capW + gap;
        const bodyW = w - (capW + gap) * 2;
        const bodyY = y + h * 0.12;    // 원통은 캡보다 살짝 얇음
        const bodyH = h * 0.76;

        // 1) 가운데 은색 원통 - 위 반사띠 + 아래 2차 반사
        scatterDots(c, bodyX, bodyY, bodyW, bodyH, {
            seed: 5001, frame: f, spacing: 2.0, jitter: 0.45, density: 0.98,
            lum: (nx, ny) => metalLum(ny)
        });
        // 원통 윗/아랫면 경계선
        scatterDots(c, bodyX, bodyY, bodyW, 1.8, { seed: 5002, frame: f, spacing: 1.5, jitter: 0.15, density: 1, lum: 255 });
        scatterDots(c, bodyX, bodyY + bodyH - 1.8, bodyW, 1.8, { seed: 5003, frame: f, spacing: 1.5, jitter: 0.15, density: 1, lum: 110 });

        // 2) 좌우 엔드캡 - 바깥쪽은 반원, 안쪽은 평평한 캡슐 반쪽
        [0, 1].forEach(side => {
            const cx0 = side === 0 ? x : x + w - capW;
            scatterDots(c, cx0, y, capW, h, {
                seed: 5010 + side, frame: f, spacing: 1.9, jitter: 0.4, density: 1,
                mask: (nx, ny) => {
                    // 바깥쪽 절반만 둥글게 깎음
                    const ox = side === 0 ? nx : 1 - nx;          // 0 = 바깥 끝
                    if (ox >= 0.5) return true;
                    const dx = (0.5 - ox) / 0.5;                   // 0~1
                    const dy = (ny - 0.5) / 0.5;                   // -1~1
                    return dx * dx + dy * dy <= 1;
                },
                // 캡은 원통보다 어둡게(원작 빨강 톤), 위쪽 광택만 밝게

            // 캡 외곽 밝은 테두리 느낌 - 윗부분 광택점

            scatterDots(c, hlx, y + h * 0.16, capW * 0.32, h * 0.14, {
                seed: 5020 + side, frame: f, spacing: 1.4, jitter: 0.15, density: 1,
                mask: (nx, ny) => Math.hypot((nx - 0.5) * 2, (ny - 0.5) * 2) <= 1,

    }

    let stagePreviewSet = 'draft', stagePreviewIdx = 0;

    function stageStats(L) {

    }

    const SV_Y0 = 0, SV_H = LOGIC_HEIGHT;
    function stagePreviewFrame(cv) {

    function drawStagePreview() {

        c.fillStyle = '#ccc'; c.beginPath(); c.arc(X(LOGIC_WIDTH / 2), Y(LOGIC_HEIGHT - 300), 18 * s, 0, Math.PI * 2); c.fill();
        // 위 · 아래 HUD 띠 (게임과 같은 높이) + 천장 선
        c.fillStyle = 'rgba(0,0,0,0.8)'; c.fillRect(F.x, F.y, F.w, HUD_TOP_H * s); c.fillRect(F.x, Y(LOGIC_HEIGHT - HUD_BOTTOM_H), F.w, HUD_BOTTOM_H * s);
        c.fillStyle = HUD_COLOR; c.font = font(`bold ${Math.max(10, 36 * s) | 0}px`); c.textBaseline = 'middle';
        c.textAlign = 'left'; c.fillText(`STAGE : ${item.n}`, X(24), Y(HUD_TOP_H / 2));
        c.textAlign = 'center'; c.fillText('000000', X(LOGIC_WIDTH / 2), Y(HUD_TOP_H / 2));
        c.strokeStyle = 'rgba(255,255,255,0.18)'; c.lineWidth = 1; c.beginPath(); c.moveTo(F.x, Y(HUD_TOP_H)); c.lineTo(F.x + F.w, Y(HUD_TOP_H)); c.stroke();
        // 거리 표시 (게임 px): 천장 -> 맨 위 벽돌 / 맨 아래 벽돌 -> 패들

            c.beginPath(); c.moveTo(mx, Y(HUD_TOP_H)); c.lineTo(mx, Y(top)); c.moveTo(mx, Y(bottom)); c.lineTo(mx, Y(paddle.y)); c.stroke(); c.setLineDash([]);
            c.fillStyle = '#9a9a9a'; c.font = font(`${Math.max(10, 30 * s) | 0}px`); c.textAlign = 'right';
            c.fillText(`${Math.round(top - HUD_TOP_H)}px`, mx - 6, Y((HUD_TOP_H + top) / 2));

    }

    // ===== 패들 마비 (적에게 부딪히거나 미사일에 맞으면 1초 동안 못 움직임) =====
    const PADDLE_STUN_MS = 1000;
    // 충격 흡수: 방어력 최대 = 단계, 30초마다 1 충전, 적 공격 1번에 1 소모하고 마비를 막음 (상태 변수는 파일 앞쪽)
    function resetAbsorb() { absorbCharge = cardLevel('absorb'); absorbTimer = 0; paddleStun = 0; absorbFlash = 0; }
    function updateAbsorb(dt) {
        if (paddleStun > 0) paddleStun = Math.max(0, paddleStun - dt);
        if (absorbFlash > 0) absorbFlash = Math.max(0, absorbFlash - dt);
        if (absorbCharge >= cardLevel('absorb')) { absorbTimer = 0; return; }
        absorbTimer += dt;
        if (absorbTimer >= ABSORB_RECHARGE_MS) { absorbTimer -= ABSORB_RECHARGE_MS; absorbCharge++; }
    }
    // 적(돌격형 몸통 / 원거리형 미사일) 이 패들에 맞았을 때 부름. true = 마비됨
    function hitPaddleByEnemy() {
        if (absorbCharge > 0) { absorbCharge--; absorbFlash = 400; if (absorbCharge === cardLevel('absorb') - 1) absorbTimer = 0; return false; }
        paddleStun = PADDLE_STUN_MS;
        return true;
    }
    // k = 남은 마비 비율 (1 = 막 맞음, 0 = 풀림). 패들 위에 덧그림
    function drawPaddleStun(c, x, y, w, h, t, k, f) {
        if (k <= 0) return;
        const age = 1 - k;
        // 1) 맞은 순간 흰 번쩍임 (0.12초)
        if (age < 0.12) { c.fillStyle = `rgba(255,255,255,${0.85 * (1 - age / 0.12)})`; c.beginPath(); c.roundRect(x - 4, y - 4, w + 8, h + 8, h / 2); c.fill(); }
        // 2) 몸체를 어둡게 + 지지직 가로줄 (TV 잡음)
        c.fillStyle = `rgba(0,0,0,${0.45 * Math.min(1, k * 3)})`; c.beginPath(); c.roundRect(x, y, w, h, h / 2); c.fill();
        const tick = Math.floor(t / 45);
        for (let i = 0; i < 4; i++) {
            if (hash3(tick, i, 77) > 0.55) continue;
            const ly = y + hash3(tick, i, 78) * h, lw = w * (0.2 + 0.6 * hash3(tick, i, 79)), lx = x + (w - lw) * hash3(tick, i, 80);
            c.fillStyle = `rgba(255,255,255,${0.35 + 0.4 * k})`; c.fillRect(lx, ly, lw, 2);
        }
        // 3) 전기: 패들 위를 기어다니는 지그재그 모래 번개 3줄
        for (let j = 0; j < 3; j++) {
            if (hash3(tick, j, 90) > 0.35 + 0.6 * k) continue;   // 풀릴수록 드문드문
            const sx = x + w * (0.1 + 0.8 * hash3(tick, j, 91)), seg = 5, len = h * (1.2 + hash3(tick, j, 92));
            let px = sx, py = y - len * 0.35;
            for (let q = 0; q < seg; q++) {
                const nx = px + (hash3(tick, j * 10 + q, 93) - 0.5) * h * 1.4, ny = py + len / seg;
                const steps = 6;
                for (let m = 0; m <= steps; m++) {
                    const bx = px + (nx - px) * m / steps, by = py + (ny - py) * m / steps;
                    c.fillStyle = `rgba(255,255,255,${0.6 + 0.4 * hash3(j, q * 7 + m, tick)})`;
                    c.fillRect(bx - 1, by - 1, 2.4, 2.4);
                }
                px = nx; py = ny;
            }
        }
        // 4) 튀는 불꽃 점 (위로 튀었다 떨어짐)
        for (let i = 0; i < 10; i++) {
            const life = ((t / 600 + hash3(i, 3, 5)) % 1), sx = x + w * hash3(i, 4, 6), vx = (hash3(i, 5, 7) - 0.5) * 60;
            const px = sx + vx * life, py = y - 26 * Math.sin(life * Math.PI) + h * 0.3;
            if (hash3(i, tick, 8) < k * 0.9) { c.fillStyle = `rgba(255,255,255,${(1 - life) * 0.9})`; c.fillRect(px - 1, py - 1, 2, 2); }
        }
        // 5) 남은 시간 줄 (패들 아래, 줄어듦)
        c.fillStyle = 'rgba(255,255,255,0.75)'; c.fillRect(x + w * (1 - k) / 2, y + h + 6, w * k, 3);
    }
    // 마비 중 패들 흔들림 (좌우로 떨림, 끝날수록 약해짐)
    const paddleStunShake = (t, k) => k > 0 ? Math.sin(t * 0.09) * 3 * k + (hash3(Math.floor(t / 40), 1, 2) - 0.5) * 3 * k : 0;

    // 개발자 화면 캔버스 1px 이 게임 화면 몇 px 인지 (패들을 게임과 같은 크기로 보이게)
    function devCanvasScale(cv) {
        const gw = canvas.getBoundingClientRect().width, cw = cv.clientWidth;
        if (!gw || !cw) return 1;

    }
    let paddleRAF = 0, paddlePage = 0, brickRAF = 0, keyPreviewT0 = 0, keyPreviewCell = null;
    // 개발자 모드 5번에서 넘겨 보는 패들 디자인 (게임에는 기본만 쓰는 중)
    const PADDLE_VIEWS = [
        { name: '기본 패들', note: '게임에서 쓰는 중', fn: pvClassicVaus },
        { name: '레이저 패들', note: '레이저 2단계 이상일 때 게임에서 씀', fn: pvRailLaser }
    ];
    const STUN_DEMO_MS = 2600;   // 미리보기 반복: 0.8초 정상 -> 맞음 -> 1초 마비 -> 0.8초 정상
    function drawPaddlePreview() {

        c.fillStyle = '#000'; c.fillRect(0, 0, cv.width, cv.height);
        // 맨 위: 마비 모션
        const u = t % STUN_DEMO_MS, hitAt = 800, k = u >= hitAt && u < hitAt + PADDLE_STUN_MS ? 1 - (u - hitAt) / PADDLE_STUN_MS : 0;
        c.fillStyle = '#ddd'; c.font = font('bold 40px'); c.textAlign = 'left'; c.textBaseline = 'top';
        c.fillText('마비 (1초)', 24, 20);
        c.fillStyle = '#888'; c.font = font('30px'); c.textAlign = 'right';
        c.fillText(k > 0 ? `마비 ${(k * PADDLE_STUN_MS / 1000).toFixed(1)}초` : '정상', cv.width - 24, 24);
        const pw0 = PADDLE_SIZES[0] * sc;
        const moving = k > 0 ? 0 : Math.sin(t * 0.004) * 140 * sc;     // 정상일 때는 좌우로 움직이고, 마비 중에는 멈춤
        const px = (cv.width - pw0) / 2 + moving + paddleStunShake(t, k) * sc, py = 170;
