    function isBreakable(brick) {
        return BRICK_TIERS[brick.tier].hp !== Infinity;
    }

    function initGame(stageIndex = 0, resetBricks = true) {
        currentStage = stageIndex;
        if (currentStage >= STAGES.length) currentStage = 0; // 올클리어 시 처음으로
        
        if (resetBricks) {
            stageGems = 0;
            buildShields();
            bricks.length = 0;
            const layout = STAGES[currentStage];
            const layoutRows = layout.length;
            
            for (let r = 0; r < layoutRows; r++) {
                const rowStr = layout[r];
                for (let c = 0; c < cols; c++) {
                    const ch = rowStr[c];
                    if (ch === '.') continue;
                    const tier = ch in STAGE_CHAR_TIER ? STAGE_CHAR_TIER[ch] : parseInt(ch, 10);
                    
                    bricks.push({
                        x: offsetX + c * brickWidth,
                        y: offsetY + r * (brickHeight + layoutGap(layout)),
                        w: brickWidth,
                        h: brickHeight,
                        alive: true,
                        tier,
                        hits: 0,
                        phase: (r * cols + c) % SAND_FRAMES,
                        r, c
                    });
                }
            }
            gemPlan = { total: rollStageGems(currentStage), n: Math.max(1, bricks.filter(isBreakable).length), broken: 0, u: Math.random() };
        }

        paddle.width = paddle.targetWidth = PADDLE_SIZES[cardLevel('size')];
        paddle.x = LOGIC_WIDTH / 2 - paddle.width / 2;
        paddle.targetX = paddle.x;
        screenShake = 0;
        resetDustHoles();
        paddle.laserTimer = 0;
        paddle.defaultLaserTimer = 0;
        hitStopTimer = 0;
        
        balls.length = 0;
        balls.push({
            x: LOGIC_WIDTH / 2,
            y: LOGIC_HEIGHT - 300,
            vx: (Math.random() > 0.5 ? 1 : -1) * BALL_VX,
            vy: -BALL_VY,
            radius: 18,
            power: ballPower(),
            trail: []
        });
        lasers.length = 0;
        gems.length = 0;
    }

    // power 인자를 받아 데미지를 줌. 기본값은 1 (레이저 용)
    function damageBrick(hit, power = 1, fromShard = false) {
        if (!isBreakable(hit)) {
            sfx('metal');
            spawnBurst(hit, 8);
            screenShake = Math.max(screenShake, SHAKE_METAL);
        } else {
            hit.hits += power;
            if (hit.hits >= BRICK_TIERS[hit.tier].hp) {
                hit.alive = false;
                sfx('break');
                spawnBurst(hit);
                const isBlackhole = BRICK_TIERS[hit.tier].name === 'GRAVITY';
                addBrickDustHole(hit, isBlackhole ? 'BLACKHOLE' : 'NORMAL');
                screenShake = Math.max(screenShake, SHAKE_BRICK);
                if (isBlackhole) {
                    hitStopTimer = 80; // 블랙홀은 파괴 시 좀 더 길게 히트스톱
                } else {
                    hitStopTimer = 50;
                }
                // 점수 획득
                score += BRICK_TIERS[hit.tier].hp * 100;
                
                // 보석 드롭: 스테이지 총량을 깨는 순서대로 나눔. 2개 이상이면 옆으로 조금 벌려서
                const gn = gemsForBreak();
                for (let k = 0; k < gn; k++) {
                    gems.push({ x: hit.x + hit.w / 2 + (k - (gn - 1) / 2) * GEM_SIZE * 0.9, y: hit.y + hit.h / 2, phase: Math.random() * 1400 });
                }
                // 파편: 붙어 있는 모든 블럭 (대각선 포함 8칸) 에 데미지 1. 파편으로 깨진 블럭은 다시 파편을 일으키지 않음
                if (!fromShard && cardLevel('shard') > 0) {
                    for (const n of bricks) {
                        if (n === hit || !n.alive || !isBreakable(n)) continue;
                        if (Math.abs(n.r - hit.r) <= 1 && Math.abs(n.c - hit.c) <= 1) damageBrick(n, 1, true);
                    }
                }
            } else {
                sfx(BRICK_TIERS[hit.tier].laserProof ? 'rubber' : 'hit');
                spawnBurst(hit, 14);
                screenShake = Math.max(screenShake, SHAKE_CHIP);
            }
        }
    }

    // ===== 물리 =====
    function checkCollision(b, rect) {
        return b.x + b.radius > rect.x &&
               b.x - b.radius < rect.x + rect.w &&
               b.y + b.radius > rect.y &&
               b.y - b.radius < rect.y + rect.h;
    }

    // 레이저 발사 위치 (C안): 패들이 벽에 가까울수록 발사 위치를 벽 쪽으로 옮김
    //  t: 패들 위치 0 (왼쪽 벽) ~ 1 (오른쪽 벽). k = 부호 유지 제곱 -> 가운데 근처에서는 거의 그대로, 벽에 붙으면 패들 끝에서 발사
    const LASER_EDGE = 4;   // 벽에 붙었을 때 패들 끝에서 안쪽으로 떨어진 거리 (px)
    function laserOrigins(lv) {
        const w = paddle.width, room = LOGIC_WIDTH - w;
        const t = room > 0 ? Math.max(0, Math.min(1, paddle.x / room)) : 0.5;
        const sN = (t - 0.5) * 2, k = Math.sign(sN) * sN * sN;
        if (lv === 1) return [paddle.x + w / 2 + k * (w / 2 - LASER_EDGE)];
        const shift = k * (w * 0.28 - LASER_EDGE);
        return [paddle.x + w * 0.28 + shift, paddle.x + w * 0.72 + shift];
    }

    function movePaddle() {
        if (keys['ArrowLeft']) paddle.targetX -= paddle.speed;
        if (keys['ArrowRight']) paddle.targetX += paddle.speed;
        paddle.targetX = Math.max(0, Math.min(paddle.targetX, LOGIC_WIDTH - paddle.width));
        // 목표 위치를 부드럽게 따라감 (Pretext Breaker: dt x 16)
        paddle.x += (paddle.targetX - paddle.x) * Math.min(1, PADDLE_FOLLOW * STEP_MS / 1000);
    }

    function updateGems(speedMul = 1) {
        // 보석 낙하 및 패들로 받기
        const magLv = cardLevel('magnet'), magMul = Math.pow(MAGNET_STEP, magLv - 1);
        const magR = MAGNET_RANGE * magMul, magPull = MAGNET_PULL * magMul, pcx = paddle.x + paddle.width / 2;
        for (let i = gems.length - 1; i >= 0; i--) {
            const g = gems[i], r = GEM_SIZE / 2;
            g.y += GEM_FALL_SPEED * speedMul;
            if (magLv > 0) {
                const dx = pcx - g.x;
                if (Math.hypot(dx, paddle.y - g.y) < magR) g.x += Math.sign(dx) * Math.min(Math.abs(dx), magPull * speedMul);
            }
            if (g.y - r > LOGIC_HEIGHT) { gems.splice(i, 1); continue; }
            if (g.y + r > paddle.y && g.y - r < paddle.y + paddle.height &&
                g.x + r > paddle.x && g.x - r < paddle.x + paddle.width) {
                gemCount++;
                stageGems++;
                gems.splice(i, 1);
            }
        }
    }

    function cheatClearStage() {
        if (gameState !== 'PLAY') return;
        bricks.forEach(b => { if (b.alive && isBreakable(b)) { b.alive = false; spawnBurst(b, 30); } });
        startClearSeq();
    }

    // 마지막 블럭이 깨지면 호출
    function startClearSeq() {
        sfx('clear');
        gameState = 'CLEAR_SEQ';
        clearPhase = 'COLLECT';
        clearT = 0;
        balls.length = 0;
        lasers.length = 0;
    }

    function updateClearSeq() {
        clearT += STEP_MS;
        updateBurst();
        if (clearPhase === 'COLLECT') {
            // 남은 보석은 2배 속도로 떨어지고 패들로 받을 수 있음 (다 사라지면 다음 단계, 안전장치 6초)
            movePaddle();
            updateGems(2);
            if (gems.length === 0 || clearT >= CLEAR_COLLECT_MAX_MS) { gems.length = 0; clearPhase = 'SHOW'; clearT = 0; clearInterest = cardLevel('interest') > 0 ? Math.min(INTEREST_CAP, Math.floor(gemCount * INTEREST_RATE)) : 0; clearBonus = clearBonusFor(currentStage); gemCount += clearInterest + clearBonus; }
        } else if (clearPhase === 'SHOW' && clearT >= CLEAR_SHOW_MS) { clearPhase = 'FLY'; clearT = 0; }
        else if (clearPhase === 'FLY' && clearT >= CLEAR_FLY_MS) { clearPhase = 'FADE'; clearT = 0; gemHudPulse = 400; }
        else if (clearPhase === 'FADE' && clearT >= CLEAR_FADE_MS) { clearPhase = ''; openShop(); }
    }

    // 클리어 연출 그리기 (HUD 위에 그림)
    function drawClearSeq() {
        const ease = t => 1 - Math.pow(1 - t, 3);
        const cx = LOGIC_WIDTH / 2, cy = LOGIC_HEIGHT / 2, now = performance.now();
        if (gameState === 'SHOP') { drawShop(); return; }
        if (clearPhase === 'COLLECT') return;

        // 게임 화면 어둡게 (FADE 단계에서 완전히 검게)
        const dim = clearPhase === 'FADE' ? 0.55 + 0.45 * Math.min(1, clearT / CLEAR_FADE_MS) : 0.55;
        ctx.fillStyle = `rgba(0,0,0,${dim})`;
        ctx.fillRect(0, HUD_TOP_H, LOGIC_WIDTH, LOGIC_HEIGHT - HUD_TOP_H);

        // STAGE CLEAR 제목 (FLY 동안 서서히 사라짐)
        const titleA = clearPhase === 'SHOW' ? Math.min(1, clearT / 250) : clearPhase === 'FLY' ? 1 - clearT / CLEAR_FLY_MS : 0;
        if (titleA > 0) {
            ctx.fillStyle = `rgba(255,255,255,${titleA})`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.font = font('bold 84px'); ctx.fillText(`STAGE ${currentStage + 1} CLEAR`, cx, cy - 260);
        }
        if (clearPhase === 'FADE') return;

        // 보석 + 획득 개수: SHOW 에서 0부터 카운트업, FLY 에서 우측 상단 HUD 보석 위치로 이동하며 작아짐
        const earned = stageGems + clearBonus + clearInterest;
        const shown = clearPhase === 'SHOW' ? Math.round(earned * ease(Math.min(1, clearT / 700))) : earned;
        ctx.font = font('bold 40px');
        const tx = GEM_RIGHT - ctx.measureText(String(gemCount)).width - 34, ty = HUD_TOP_H / 2;
        const k = clearPhase === 'FLY' ? ease(Math.min(1, clearT / CLEAR_FLY_MS)) : 0;
        const pop = clearPhase === 'SHOW' ? 0.6 + 0.4 * ease(Math.min(1, clearT / 300)) : 1;
        const sc = (1 - k * 0.63) * pop;                  // 120px -> 44px (HUD 보석 크기)
        const x = cx + (tx - cx) * k, y = cy + (ty - cy) * k;
        drawMoneyGem(ctx, x, y - 70 * sc, 120 * sc, now);
        ctx.globalAlpha = 1 - k;
        ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = font(`bold ${Math.max(1, Math.round(110 * sc))}px`);
        ctx.fillText('+' + shown, x, y + 60 * sc);
        // 보석 내역: 받은 보석 / 클리어 보너스 / 이자 (SHOW 동안 한 줄씩 나타남)
        ctx.font = font(`bold ${Math.max(1, Math.round(44 * sc))}px`);
        ctx.fillStyle = 'rgb(190,190,190)';
        const lines = [`클리어 보너스 +${clearBonus}`];
        if (clearInterest > 0) lines.push(`이자 +${clearInterest}`);
        lines.forEach((t, i) => {
            const a = clearPhase === 'SHOW' ? Math.min(1, Math.max(0, (clearT - 500 - i * 250) / 200)) : 1;
            ctx.globalAlpha = (1 - k) * a;
            ctx.fillText(t, x, y + (150 + i * 64) * sc);
        });
        ctx.globalAlpha = 1;
    }

    // ===== 상점 (스테이지 사이) =====
    // 가격은 임시값. 가격 = 기본가 + 단계별 상승 x 현재 보유 단계 (여분 패들은 구매 횟수)
    // 카드 가격: [1단계, 2단계, ...] (1회 구매 카드는 1개). 여분 패들은 구매 횟수별, 끝을 넘으면 마지막 값
    const SHOP_PRICES_DEFAULT = {
        pierce:   [60],
        size:     [10, 15, 20, 25, 30],
        laser:    [20, 45, 70, 95, 120],
        clone:    [20, 40, 65, 90, 120],
        power:    [25, 50, 80, 110],
        shield:   [15, 25, 35, 45, 55],
        life:     [30, 45, 60],
        magnet:   [10, 25, 40, 55, 70],
        interest: [100],
        shard:    [150],
        aim:      [200]
    };
    const PRICE_KEY = 'sb_shop_prices';
    // 업그레이드 카드 단계별 효과 (개발자 모드 7번 표시용). [0] = 카드 없음, [1] = 1단계 ...
    function upgradeEffects(id) {
        const pct = v => Math.round(v * 100) + '%';
        const sec = ms => (ms / 1000).toFixed(1) + '초';
        const up = (v, base) => v === base ? '' : ` (+${Math.round((v / base - 1) * 100)}%)`;
        switch (id) {
            case 'size':   return PADDLE_SIZES.map(w => `패들 폭 ${w}px${up(w, PADDLE_SIZES[0])}`);
            case 'laser':  return LASER_INTERVALS.map((ms, lv) => {
                if (!lv) return '레이저 없음';
                const n = lv === 1 ? 1 : 2;
                return `${lv === 1 ? '가운데' : '양쪽'} ${n}발 / ${sec(ms)} · 초당 ${(n * 1000 / ms).toFixed(1)}발`;
            });
            case 'clone':  return CLONE_CHANCE.map((c, lv) => lv ? `패들에 튕길 때 ${pct(c)} 확률로 공 +1 (최대 ${CLONE_MAX_BALLS[lv]}개)` : '복제 없음');
            case 'power':  return Array.from({ length: MAX_BALL_POWER }, (_, lv) =>
                               `볼 파워 ${1 + lv} (한 번에 체력 ${1 + lv}칸)` + (1 + lv === MAX_BALL_POWER ? ' · 최대' : ''));
            case 'shield': return Array.from({ length: 6 }, (_, lv) => lv ? `패들 아래 막이 블럭 ${lv + 1}개 (스테이지마다 다시 채움)` : '보호막 없음');
            case 'magnet': return Array.from({ length: 6 }, (_, lv) => {
                if (!lv) return '자석 없음';
                const m = Math.pow(MAGNET_STEP, lv - 1);
                return `끌어당기는 거리 ${Math.round(MAGNET_RANGE * m)}px · 힘 ${(MAGNET_PULL * m).toFixed(1)}${lv > 1 ? ` (1단계 대비 +${Math.round((m - 1) * 100)}%)` : ''}`;
            });
            case 'life':   return Array.from({ length: MAX_LIVES + 1 }, (_, n) => n ? `목숨 +1 (최대 ${MAX_LIVES})` : `시작 목숨 ${START_LIVES}`);
        }
        return null;
    }
    const clonePrices = src => Object.fromEntries(Object.entries(src).map(([k, a]) => [k, a.slice()]));
    const SHOP_PRICES = clonePrices(SHOP_PRICES_DEFAULT);
    try {   // 개발자 모드에서 저장한 가격
        const saved = JSON.parse(localStorage.getItem(PRICE_KEY) || 'null');
        if (saved) for (const k in SHOP_PRICES) if (Array.isArray(saved[k]) && saved[k].length === SHOP_PRICES[k].length && saved[k].every(v => Number.isFinite(v) && v >= 0)) SHOP_PRICES[k] = saved[k].slice();
    } catch (e) {}
    const REROLL_BASE = 3, REROLL_STEP = 2;   // 리롤 비용 (임시값): 3, 5, 7...
    const MAX_LIVES = 3;
    const upgrades = {};          // 카드 id -> 보유 단계 (여분 패들은 구매 횟수)
    let lastPurchase = null;      // 직전 상점에서 산 카드 (4단계 흡수 연출용)
    let shopCards = [], shopSel = -1, shopBought = null, rerollCost = REROLL_BASE;
    let shopOpenT = 0, shopMsg = '', shopMsgT = 0;

    const cardById = id => SHOP_CARDS.find(c => c.id === id);
    const cardLevel = id => upgrades[id] || 0;
    function cardPrice(id) { const a = SHOP_PRICES[id]; return a[Math.min(cardLevel(id), a.length - 1)]; }
    function canOffer(card) {
        if (card.id === 'life') return lives < MAX_LIVES;
        return cardLevel(card.id) < card.max;          // 1회/5단계 카드는 최대 단계면 제외
    }
    function rollShopCards() {
        const pool = SHOP_CARDS.filter(canOffer).map(c => c.id);
        for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
        shopCards = pool.slice(0, 3);
        shopSel = -1;
        shopOpenT = performance.now();
    }
    function openShop() {
        gameState = 'SHOP';
        shopBought = null;
        lastPurchase = null;
        rerollCost = REROLL_BASE;
        shopMsg = '';
        rollShopCards();
    }

    // 상점 화면 배치 (그리기와 터치 판정이 같은 값을 사용)
    function shopLayout() {
        const pad = 40, gap = 30, cw = (LOGIC_WIDTH - pad * 2 - gap * 2) / 3, ch = cw * 1.5, cy = 420;
        const cards = shopCards.map((id, i) => ({ x: pad + i * (cw + gap), y: cy, w: cw, h: ch }));
        const by = cy + ch + 110, bw = 330, bh = 116, bgap = 30, bx = (LOGIC_WIDTH - bw * 3 - bgap * 2) / 2;
        return {
            cards,
            reroll: { x: bx, y: by, w: bw, h: bh },
            buy:    { x: bx + bw + bgap, y: by, w: bw, h: bh },
            skip:   { x: bx + (bw + bgap) * 2, y: by, w: bw, h: bh },
            next:   { x: LOGIC_WIDTH / 2 - 260, y: by, w: 520, h: bh },
            msgY: by + bh + 90
        };
    }
    const inRect = (r, x, y) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;

    function shopToast(msg) { shopMsg = msg; shopMsgT = performance.now(); }

    // 다음 스테이지 시작. 직전 상점에서 산 카드가 있으면 흡수 연출 후 시작
    const INTRO_POP_MS = 300, INTRO_HOLD_MS = 800, INTRO_FLY_MS = 550;
    const INTRO_CARD_W = 343, INTRO_CARD_H = 515, INTRO_SCALE = 1.25;
    let introCard = null, introT = 0;
    function goNextStage() {
        initGame(currentStage + 1);
        if (lastPurchase) {
            introCard = lastPurchase;
            lastPurchase = null;
            introT = 0;
            gameState = 'CARD_INTRO';
        } else {
            gameState = 'PLAY';
        }
    }
    function updateCardIntro() {
        introT += STEP_MS;
        movePaddle();
        if (introT >= INTRO_POP_MS + INTRO_HOLD_MS + INTRO_FLY_MS) {
            introCard = null;
            upgHudPulse = 450;
            gameState = 'PLAY';
        }
    }
    // 카드 위치: 가운데 -> 곡선을 그리며 업그레이드 버튼으로 (빨려 들어가듯 점점 빨라짐)
    function introPose(t) {
        const cx = LOGIC_WIDTH / 2, cy = LOGIC_HEIGHT / 2;
        const tx = UPG_BTN.x + UPG_BTN.w / 2, ty = UPG_BTN.y + UPG_BTN.h / 2;
        if (t < INTRO_POP_MS) {
            const u = t / INTRO_POP_MS, back = 1 + 2.2 * Math.pow(u - 1, 3) + 1.2 * Math.pow(u - 1, 2);   // 살짝 튀어나왔다 자리잡음
            return { x: cx, y: cy, sc: INTRO_SCALE * back, rot: 0, a: Math.min(1, u * 2), k: 0 };
        }
        if (t < INTRO_POP_MS + INTRO_HOLD_MS) {
            const bob = Math.sin((t - INTRO_POP_MS) / 160) * 6;
            return { x: cx, y: cy + bob, sc: INTRO_SCALE, rot: 0, a: 1, k: 0 };
        }
        const u = Math.min(1, (t - INTRO_POP_MS - INTRO_HOLD_MS) / INTRO_FLY_MS), k = u * u * u;
        const qx = LOGIC_WIDTH * 0.92, qy = LOGIC_HEIGHT * 0.42;           // 곡선 조절점
        const x = (1 - k) * (1 - k) * cx + 2 * (1 - k) * k * qx + k * k * tx;
        const y = (1 - k) * (1 - k) * cy + 2 * (1 - k) * k * qy + k * k * ty;
        return { x, y, sc: INTRO_SCALE * (1 - k) + 0.05 * k, rot: k * 0.9, a: k > 0.85 ? (1 - k) / 0.15 : 1, k };
    }
    function drawCardIntro() {
        if (!introCard) return;
        const P = introPose(introT), f = Math.floor(performance.now() / SAND_INTERVAL) % SAND_FRAMES;
        // 배경 어둡게 (날아가는 동안 걷힘)
        ctx.fillStyle = `rgba(0,0,0,${0.6 * (1 - P.k)})`;
        ctx.fillRect(0, HUD_TOP_H, LOGIC_WIDTH, LOGIC_HEIGHT - HUD_TOP_H - HUD_BOTTOM_H);
        // 안내 문구 (가운데에 있을 때만)
        if (P.k === 0) {
            ctx.globalAlpha = P.a;
            ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.font = font('bold 56px');
            ctx.fillText('UPGRADE', P.x, P.y - INTRO_CARD_H * INTRO_SCALE / 2 - 60);
            ctx.globalAlpha = 1;
        }
        // 날아가는 동안 뒤에 남는 모래 꼬리
        if (P.k > 0) {
            for (let i = 1; i <= 14; i++) {
                const q = introPose(introT - i * 18);
                if (q.k <= 0) break;
                const L = Math.round(255 * (1 - i / 15));
                ctx.fillStyle = `rgb(${L},${L},${L})`;
                const d = 10 * (1 - i / 15) + 2;
                ctx.fillRect(q.x - d / 2 + Math.sin(i * 2.3) * 8, q.y - d / 2 + Math.cos(i * 1.7) * 8, d, d);
            }
        }
        ctx.save();
        ctx.globalAlpha = Math.max(0, P.a);
        ctx.translate(P.x, P.y);
        ctx.rotate(P.rot);
        ctx.scale(P.sc, P.sc);
        drawShopCard(ctx, -INTRO_CARD_W / 2, -INTRO_CARD_H / 2, INTRO_CARD_W, INTRO_CARD_H, cardById(introCard), cardLevel(introCard), f, { noPrice: true });
        ctx.restore();
    }

    // 상점 터치 처리 (논리 좌표)
    function handleShopTap(x, y) {
        const L = shopLayout();
        if (shopBought) { if (inRect(L.next, x, y)) goNextStage(); return; }
        const ci = L.cards.findIndex(r => inRect(r, x, y));
        if (ci >= 0) { shopSel = ci === shopSel ? -1 : ci; return; }
        if (inRect(L.reroll, x, y)) {
            if (gemCount < rerollCost) { shopToast('보석이 부족합니다'); return; }
            gemCount -= rerollCost;
            rerollCost += REROLL_STEP;
            rollShopCards();
            return;
        }
        if (inRect(L.buy, x, y)) {
            if (shopSel < 0) { shopToast('카드를 먼저 선택하세요'); return; }
            const id = shopCards[shopSel], price = cardPrice(id);
            if (gemCount < price) { shopToast('보석이 부족합니다'); return; }
            gemCount -= price;
            sfx('buy');
            upgrades[id] = cardLevel(id) + 1;
            if (id === 'life') lives = Math.min(MAX_LIVES, lives + 1);
            shopBought = id;
            lastPurchase = id;
            return;
        }
        if (inRect(L.skip, x, y)) goNextStage();
    }

    function drawShopButton(r, label, cost, enabled, strong) {
        ctx.fillStyle = strong && enabled ? 'rgb(235,235,235)' : 'rgb(12,12,12)';
        ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 16); ctx.fill();
        ctx.strokeStyle = enabled ? 'rgb(220,220,220)' : 'rgb(70,70,70)';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 16); ctx.stroke();
        ctx.fillStyle = strong && enabled ? '#000' : (enabled ? 'rgb(235,235,235)' : 'rgb(80,80,80)');
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = font('bold 42px');
        if (cost == null) { ctx.fillText(label, r.x + r.w / 2, r.y + r.h / 2); return; }
        const text = `${label} ${cost}`, tw = ctx.measureText(text).width, gx = r.x + r.w / 2 - (tw + 40) / 2;
        ctx.textAlign = 'left';
        ctx.fillText(text, gx, r.y + r.h / 2);
        drawMoneyGem(ctx, gx + tw + 26, r.y + r.h / 2, 34, performance.now());
    }

    function drawShop() {
        const now = performance.now(), f = Math.floor(now / SAND_INTERVAL) % SAND_FRAMES, L = shopLayout();
        ctx.fillStyle = '#000';
        ctx.fillRect(0, HUD_TOP_H, LOGIC_WIDTH, LOGIC_HEIGHT - HUD_TOP_H - HUD_BOTTOM_H);

        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = '#fff'; ctx.font = font('bold 96px');
        ctx.fillText('SHOP', LOGIC_WIDTH / 2, 230);
        ctx.fillStyle = 'rgb(150,150,150)'; ctx.font = font('34px');
        ctx.fillText(shopBought ? '구매 완료' : '카드 1장을 구매할 수 있습니다', LOGIC_WIDTH / 2, 320);

        if (!shopCards.length) {
            ctx.fillStyle = 'rgb(150,150,150)'; ctx.font = font('36px');
            ctx.fillText('구매할 수 있는 카드가 없습니다', LOGIC_WIDTH / 2, L.msgY - 400);
        }

        shopCards.forEach((id, i) => {
            const r = L.cards[i], card = cardById(id), price = cardPrice(id);
            // 등장: 카드마다 0.12초 간격으로 아래에서 떠오름
            const t = Math.min(1, Math.max(0, (now - shopOpenT - i * 120) / 350)), e = 1 - Math.pow(1 - t, 3);
            const sel = i === shopSel && !shopBought, lift = sel ? -18 : 0;
            ctx.save();
            ctx.globalAlpha = e;
            ctx.translate(0, (1 - e) * 60 + lift);
            drawShopCard(ctx, r.x, r.y, r.w, r.h, card, cardLevel(id), f, { price, affordable: gemCount >= price });
            if (sel) {
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 6;
                ctx.beginPath(); ctx.roundRect(r.x - 8, r.y - 8, r.w + 16, r.h + 16, 20); ctx.stroke();
            }
            if (shopBought && id !== shopBought) {          // 산 카드 외에는 어둡게
                ctx.fillStyle = 'rgba(0,0,0,0.65)';
                ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 14); ctx.fill();
            }
            if (shopBought === id) {                         // 구매 완료 표시
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.roundRect(r.x + 20, r.y + r.h / 2 - 40, r.w - 40, 80, 12); ctx.fill();
                ctx.fillStyle = '#000'; ctx.font = font('bold 40px'); ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';   // drawShopCard 가 'top' 으로 바꿔 두므로 다시 지정 (글씨가 아래로 처지던 원인)
                ctx.fillText('구매 완료', r.x + r.w / 2, r.y + r.h / 2);
            }
            ctx.restore();
        });

        if (shopBought) {
            drawShopButton(L.next, '다음 스테이지 ▶', null, true, true);
        } else {
            const selPrice = shopSel >= 0 ? cardPrice(shopCards[shopSel]) : null;
            drawShopButton(L.reroll, '리롤', rerollCost, gemCount >= rerollCost, false);
            drawShopButton(L.buy, '구매', selPrice, selPrice != null && gemCount >= selPrice, true);
            drawShopButton(L.skip, '건너뛰기', null, true, false);
        }

        if (shopMsg && now - shopMsgT < 1400) {
            ctx.globalAlpha = Math.min(1, (1400 - (now - shopMsgT)) / 300);
            ctx.fillStyle = '#fff'; ctx.font = font('bold 38px'); ctx.textAlign = 'center';
            ctx.fillText(shopMsg, LOGIC_WIDTH / 2, L.msgY);
            ctx.globalAlpha = 1;
        }
    }

    function update() {
        if (gameState !== 'PLAY') return;

        movePaddle();

        // 패들 넓이 보간 (아이템 효과)
        if (paddle.targetWidth) {
            paddle.width += (paddle.targetWidth - paddle.width) * 0.15;
        }

        updateGems();

        // 기본 레이저 없음 (레이저는 상점 업그레이드로만 획득 예정)

        // 레이저 업그레이드 발사
        const laserLv = cardLevel('laser');
        if (laserLv > 0) {
            paddle.laserTimer += STEP_MS;
            if (paddle.laserTimer >= LASER_INTERVALS[laserLv] - 0.001) {   // 소수점 오차로 1프레임 늦게 발사되는 것 방지
                paddle.laserTimer -= LASER_INTERVALS[laserLv];
                const ly = paddle.y - 10;
                laserOrigins(laserLv).forEach(x => lasers.push({ x: x - 2, y: ly, w: 4, h: 20 }));
                sfx('laser');
            }
        }
        
        // 레이저 이동 및 충돌
        for (let i = lasers.length - 1; i >= 0; i--) {
            const l = lasers[i];
            l.y -= 18;
            if (l.y < HUD_TOP_H) { lasers.splice(i, 1); continue; }
            
            let hit = null;
            for (const brick of bricks) {
                if (!brick.alive) continue;
                if (l.x + l.w > brick.x && l.x < brick.x + brick.w && l.y < brick.y + brick.h && l.y + l.h > brick.y) {
                    hit = brick; break;
                }
            }
            if (hit) {
                lasers.splice(i, 1);
                if (BRICK_TIERS[hit.tier].laserProof) {
                    sfx('laserBlock');
                    spawnBurst({ x: l.x - 6, y: hit.y + hit.h - 8, w: 16, h: 10 }, 6);   // 고무: 레이저가 튕겨 나감
                } else {
                    damageBrick(hit, 1);
                }
            }
        }

        // 여러 공 처리
        for (let bIdx = balls.length - 1; bIdx >= 0; bIdx--) {
            const ball = balls[bIdx];
            const speed = Math.hypot(ball.vx, ball.vy);
            const steps = Math.max(1, Math.ceil(speed / (ball.radius * 0.5)));
            const stepX = ball.vx / steps;
            const stepY = ball.vy / steps;

            for (let s = 0; s < steps; s++) {
                ball.x += stepX;
                ball.y += stepY;

                if (ball.x - ball.radius < 0) { ball.x = ball.radius; ball.vx = Math.abs(ball.vx); }
                if (ball.x + ball.radius > LOGIC_WIDTH) { ball.x = LOGIC_WIDTH - ball.radius; ball.vx = -Math.abs(ball.vx); }
                if (ball.y - ball.radius < HUD_TOP_H) { ball.y = HUD_TOP_H + ball.radius; ball.vy = Math.abs(ball.vy); }   // 천장 = 상단 HUD 아래

                if (ball.vy > 0 && checkCollision(ball, { x: paddle.x - PADDLE_HIT_MARGIN, y: paddle.y, w: paddle.width + PADDLE_HIT_MARGIN * 2, h: paddle.height })) {
                    ball.y = paddle.y - ball.radius - 1;
                    let hitPoint = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
                    hitPoint = Math.max(-1, Math.min(1, hitPoint));
                    if (Math.abs(hitPoint) < PADDLE_MIN_OFFSET) {
                        const dir = hitPoint !== 0 ? Math.sign(hitPoint) : (ball.vx >= 0 ? 1 : -1);
                        hitPoint = dir * PADDLE_MIN_OFFSET;
                    }
                    const maxAngle = PADDLE_MAX_ANGLE;
                    const angle = hitPoint * maxAngle;
                    screenShake = Math.max(screenShake, SHAKE_PADDLE);
                    ball.vx = speed * Math.sin(angle);
                    ball.vy = -speed * Math.cos(angle);
                    // 조준: 남은 블럭이 5개 이하이면 가장 가까운 블럭을 향해 튕김
                    const plan = aimPlan(ball.x, ball.y, ball.radius);
                    if (plan) { ball.vx = speed * Math.sin(plan.a); ball.vy = -speed * Math.cos(plan.a); }
                    // 볼 복제: 부딪친 볼은 사라지고 좌우로 2개 발사 (최대 8개)
                    const cloneLv = cardLevel('clone');
                    if (cloneLv > 0 && balls.length < CLONE_MAX_BALLS[cloneLv] && Math.random() < CLONE_CHANCE[cloneLv]) ball.cloneMe = true;
                    break;
                }

                // 보호막: 떨어지는 공을 막고 위로 튕김. 막은 블럭은 사라짐
                if (ball.vy > 0) {
                    const sh = shields.find(q => q.alive && checkCollision(ball, q));
                    if (sh) {
                        sh.alive = false;
                        ball.y = sh.y - ball.radius - 1;
                        ball.vy = -Math.abs(ball.vy);
                        spawnBurst(sh, 40);
                        screenShake = Math.max(screenShake, SHAKE_CHIP);
                        break;
                    }
                }

                let hit = null, hitMin = Infinity, hitAxis = null;
                for (const brick of bricks) {
                    if (!brick.alive) continue;
                    if (!checkCollision(ball, brick)) continue;
                    const oL = (ball.x + ball.radius) - brick.x;
                    const oR = (brick.x + brick.w) - (ball.x - ball.radius);
                    const oT = (ball.y + ball.radius) - brick.y;
                    const oB = (brick.y + brick.h) - (ball.y - ball.radius);
                    const m = Math.min(oL, oR, oT, oB);
                    if (m < hitMin) {
                        hitMin = m; hit = brick;
                        hitAxis = (m === oL) ? 'left' : (m === oR) ? 'right' : (m === oT) ? 'top' : 'bottom';
                    }
                }

                if (hit) {
                    const pwr = ball.power || 1;
                    const hpLeft = isBreakable(hit) ? BRICK_TIERS[hit.tier].hp - hit.hits : Infinity;
                    // 기본은 항상 반사. '돌파' 보유 시 볼 파워 >= 남은 체력이면 파괴하고 지나감
                    const pierce = cardLevel('pierce') > 0 && isBreakable(hit) && pwr >= hpLeft;
                    
                    damageBrick(hit, pwr);
                    
                    if (!pierce) {
                        if (hitAxis === 'left')   { ball.x = hit.x - ball.radius;         ball.vx = -Math.abs(ball.vx); }
                        if (hitAxis === 'right')  { ball.x = hit.x + hit.w + ball.radius; ball.vx =  Math.abs(ball.vx); }
                        if (hitAxis === 'top')    { ball.y = hit.y - ball.radius;         ball.vy = -Math.abs(ball.vy); }
                        if (hitAxis === 'bottom') { ball.y = hit.y + hit.h + ball.radius; ball.vy =  Math.abs(ball.vy); }
                        break;
                    }
                    // 관통: 멈추지 않고 남은 이동을 계속 (다음 블럭도 조건이 맞으면 연속 관통)
                }
            }

            if (ball.y > LOGIC_HEIGHT) {
                balls.splice(bIdx, 1);
                sfx('drop');
                continue;
            }

            if (ball.cloneMe) {
                const a = Math.atan2(ball.vy, ball.vx), spd = Math.hypot(ball.vx, ball.vy);
                balls.splice(bIdx, 1);
                [-CLONE_SPREAD, CLONE_SPREAD].forEach(d => balls.push({
                    x: ball.x, y: ball.y, vx: Math.cos(a + d) * spd, vy: Math.sin(a + d) * spd,
                    radius: ball.radius, power: ball.power, trail: []
                }));
                spawnBurst({ x: ball.x - 20, y: ball.y - 20, w: 40, h: 40 }, 24);
                continue;
            }

            ball.trail.unshift({ x: ball.x, y: ball.y });
            if (ball.trail.length > TRAIL_MAX) ball.trail.pop();
        }

        if (balls.length === 0) {
            lives--;
            gameState = lives > 0 ? 'LIFE_LOST' : 'GAME_OVER';
        }

        updateBurst();

        // 금속(파괴 불가)은 클리어 조건에서 제외
        if (!bricks.some(b => b.alive && isBreakable(b))) startClearSeq();
    }

    // ===== 벽돌 파괴 시 모래가 흩어지는 파티클 =====
    const burst = [];
    // 파괴 시 파티클 개수를 2.5배 늘림
    const BURST_PER_BRICK = 150;

    function spawnBurst(brick, count = BURST_PER_BRICK) {
        for (let i = 0; i < count; i++) {
            const a = Math.random() * Math.PI * 2;
            // 튀어 나가는 속도를 높여서 더 확 퍼지게 함
            const sp = 2 + Math.random() * 8;
            burst.push({
                x: brick.x + Math.random() * brick.w,
                y: brick.y + Math.random() * brick.h,
                vx: Math.cos(a) * sp,
                vy: Math.sin(a) * sp - 2, // 위로 솟는 힘 강화
                life: 1 + Math.random() * 0.5 // 수명도 약간 늘림
            });
        }
    }

    function updateBurst() {
        for (let i = burst.length - 1; i >= 0; i--) {
            const p = burst[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.35;      // 더 무겁게 빨리 가라앉게
            p.vx *= 0.95;      // 공기 저항을 늘려 옆으로는 빨리 멈춤 (포물선 형태 강조)
            p.life -= 0.02;    // 사라지는 속도 감소 (더 오래 보임)
            if (p.life <= 0) burst.splice(i, 1);
        }
    }

    function drawBurst() {
        const half = DOT_SIZE / 2;
        for (const p of burst) {
            // 입자가 더 밝게 빛나며 시작해 서서히 어두워짐
            const L = Math.min(255, Math.round(p.life * 300));
            ctx.fillStyle = `rgb(${L},${L},${L})`;
            ctx.fillRect(p.x - half, p.y - half, DOT_SIZE, DOT_SIZE);
        }
    }

    // ===== 패들 렌더링 (도트) =====
    // 게임 기본 패들 = 개발자 모드 5번 CLASSIC VAUS + 아이템 효과
    function drawPaddle() {
        const frame = Math.floor(performance.now() / SAND_INTERVAL) % SAND_FRAMES;
        if (paddle.mode === 'LASER') {
            pvRailLaser(ctx, paddle.x, paddle.y, paddle.width, paddle.height, frame);
        } else {
            pvClassicVaus(ctx, paddle.x, paddle.y, paddle.width, paddle.height, frame);
        }
    }

    function drawAimGuide() {
        if (gameState !== 'PLAY') return;
        const t = performance.now();
        balls.forEach(b => {
            if (b.vy <= 0) return;
            const oy = paddle.y - b.radius - 1;
            const p = aimPlan(b.x, oy, b.radius);
            if (!p) return;
            const tgt = p.tgt, tx = tgt.x + tgt.w / 2, ty = tgt.y + tgt.h / 2;
            const pts = p.wx == null ? [[b.x, oy], [tx, ty]] : [[b.x, oy], [p.wx, p.wy], [tx, ty]];
            const segs = [];
            let total = 0;
            for (let i = 1; i < pts.length; i++) { const L = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); segs.push({ a: pts[i - 1], b: pts[i], L, s0: total }); total += L; }
            const shift = (t / 40) % 36;
            for (let d = shift; d < total; d += 36) {
                const sg = segs.find(q => d < q.s0 + q.L) || segs[segs.length - 1], u = (d - sg.s0) / sg.L;
                const L = Math.round(150 * (1 - d / total) + 40);
                ctx.fillStyle = `rgb(${L},${L},${L})`;
                ctx.fillRect(sg.a[0] + (sg.b[0] - sg.a[0]) * u - 2, sg.a[1] + (sg.b[1] - sg.a[1]) * u - 2, 4, 4);
            }
            // 벽에 닿는 지점 표시
            if (p.wx != null) { ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillRect(p.wx - 5, p.wy - 5, 10, 10); }
            // 목표 블럭 모서리 표시
            const f = 6, x0 = tgt.x + 4, y0 = tgt.y + 4, x1 = tgt.x + tgt.w - 4, y1 = tgt.y + tgt.h - 4;
            ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(x0, y0 + f); ctx.lineTo(x0, y0); ctx.lineTo(x0 + f, y0);
            ctx.moveTo(x1 - f, y0); ctx.lineTo(x1, y0); ctx.lineTo(x1, y0 + f);
            ctx.moveTo(x0, y1 - f); ctx.lineTo(x0, y1); ctx.lineTo(x0 + f, y1);
            ctx.moveTo(x1 - f, y1); ctx.lineTo(x1, y1); ctx.lineTo(x1, y1 - f);
            ctx.stroke();
        });
    }

    function drawShields() {
        const f = Math.floor(performance.now() / SAND_INTERVAL) % SAND_FRAMES;
        shields.forEach((q, i) => {
            if (!q.alive) return;
            scatterDots(ctx, q.x, q.y, q.w, q.h, { seed: 8300 + i, frame: f, spacing: 2.4, density: 0.9, lum: (nx, ny) => 230 - ny * 70 });
            strokeDotRect(ctx, q.x, q.y, q.w, q.h, 6, { seed: 8350 + i, frame: f, lum: 255, density: 0.95, spacing: 2 });
        });
    }

    // ===== 공, 레이저, 아이템 렌더링 =====
    function drawBall() {
        const frame = Math.floor(performance.now() / SAND_INTERVAL) % SAND_FRAMES;
        
        balls.forEach((ball, bIdx) => {
            const pwr = ball.power || 1;
            


            // 파워 2 이상: 공 크기는 그대로 두고, 공 안에서 회전하는 밝은 점(파워-1개)과
            // 촘촘한 코어로 표현. 공 테두리 밖으로 아무것도 그리지 않는다.
            if (pwr >= 2) {
                const t = performance.now() / 260;
                const orbit = ball.radius * 0.55;
                const n = Math.min(pwr - 1, 6);
                for (let k = 0; k < n; k++) {
                    const a = t + k * Math.PI * 2 / n;
                    const ox = ball.x + Math.cos(a) * orbit, oy = ball.y + Math.sin(a) * orbit;
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(ox - 2.5, oy - 2.5, 5, 5);
                }
            }

            const d = ball.radius * 2;
            scatterDots(ctx, ball.x - ball.radius, ball.y - ball.radius, d, d, {
                seed: 4001 + bIdx * 10, frame, spacing: 2.5,
                mask: (nx, ny) => Math.hypot(nx - 0.5, ny - 0.5) <= 0.5,
                density: (nx, ny) => Math.max(0.25, 1 - Math.hypot(nx - 0.34, ny - 0.34) * 1.05),
                lum: (nx, ny) => Math.max(70, 255 - Math.hypot(nx - 0.34, ny - 0.34) * 210)
            });
        });
        
        lasers.forEach((l, i) => {
            scatterDots(ctx, l.x, l.y, l.w, l.h, { seed: 8000 + i, frame, density: 1, lum: 255, spacing: 1.5 });
        });
        
        const gemT = performance.now();
        gems.forEach(g => drawMoneyGem(ctx, g.x, g.y, GEM_SIZE, gemT, g.phase));
    }

    // ===== 잔상 렌더링 (도트 혜성 꼬리) =====
    function drawTrail() {
        const frame = Math.floor(performance.now() / SAND_INTERVAL) % SAND_FRAMES;
        
        balls.forEach((b, bIdx) => {
            for (let i = b.trail.length - 1; i >= 1; i--) {
                const p = b.trail[i];
                const fade = 1 - i / TRAIL_MAX;
                const size = b.radius * 2 * (0.3 + fade * 0.7);

                scatterDots(ctx, p.x - size / 2, p.y - size / 2, size, size, {
                    seed: 5000 + i + bIdx * 100, frame,
                    spacing: 2.8,
                    mask: (nx, ny) => Math.hypot(nx - 0.5, ny - 0.5) <= 0.5,
                    density: fade * fade * 0.85,
                    lum: 40 + fade * 200
                });
            }
        });
    }

    // ===== 메인 드로우 =====
    function draw() {
        ctx.fillStyle = '#020202';
        ctx.fillRect(0, 0, LOGIC_WIDTH, LOGIC_HEIGHT);

        // 화면 흔들림 - 게임 장면에만 적용
        ctx.save();
        if (screenShake > 0) {
            ctx.translate((Math.random() - 0.5) * screenShake * 2.8, (Math.random() - 0.5) * screenShake * 2.2);
        }

        // 배경 먼지 - 가장 먼저 그려 모든 오브젝트 뒤에 깔림
        drawDust();

        const baseFrame = Math.floor(performance.now() / SAND_INTERVAL);

        // 벽돌 - 미리 만든 모래 스프라이트를 블리팅
        for (const brick of bricks) {
            if (!brick.alive) continue;
            const f = (baseFrame + brick.phase) % SAND_FRAMES;
            const displayHits = Math.min(brick.hits, BRICK_TIERS[brick.tier].hp === Infinity ? 0 : BRICK_TIERS[brick.tier].hp - 1);
            ctx.drawImage(brickSprites[brick.tier][displayHits][f], brick.x, brick.y);
        }

        drawBurst();
        drawTrail();
        drawShields();
        drawAimGuide();
        drawPaddle();
        drawBall();
        ctx.restore();

        // ===== 상태 오버레이 (START / GAME_OVER / NEXT_STAGE / LIFE_LOST) =====
        if (gameState !== 'PLAY' && gameState !== 'CLEAR_SEQ' && gameState !== 'SHOP' && gameState !== 'CARD_INTRO' && gameState !== 'UPG_VIEW') {
            ctx.fillStyle = 'rgba(0,0,0,0.85)';
            ctx.fillRect(0, 0, LOGIC_WIDTH, LOGIC_HEIGHT);
            drawDust();

            ctx.fillStyle = '#fff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            if (gameState === 'START') {
                ctx.font = font('bold 82px');
                ctx.fillText('STIPPLE', LOGIC_WIDTH / 2, LOGIC_HEIGHT / 2 - 180);
                ctx.font = font('bold 110px');
                ctx.fillText('BREAKOUT', LOGIC_WIDTH / 2, LOGIC_HEIGHT / 2 - 70);
                ctx.font = font('40px');
                ctx.fillText('PUSH START', LOGIC_WIDTH / 2, LOGIC_HEIGHT / 2 + 120);
                ctx.font = font('28px');
                ctx.fillText('V4.11.1', LOGIC_WIDTH / 2, LOGIC_HEIGHT - 160);
            } else if (gameState === 'GAME_OVER') {
                ctx.font = font('bold 100px');
                ctx.fillText('SYSTEM_FAILURE', LOGIC_WIDTH / 2, LOGIC_HEIGHT / 2 - 100);
                ctx.font = font('40px');
                ctx.fillText('> REBOOT (CLICK) <', LOGIC_WIDTH / 2, LOGIC_HEIGHT / 2 + 100);
            } else if (gameState === 'NEXT_STAGE') {
                ctx.font = font('bold 90px');
                ctx.fillText(`STAGE ${currentStage + 1} CLEARED`, LOGIC_WIDTH / 2, LOGIC_HEIGHT / 2 - 100);
                ctx.font = font('40px');
                ctx.fillText('> CLICK FOR NEXT STAGE <', LOGIC_WIDTH / 2, LOGIC_HEIGHT / 2 + 100);
            } else if (gameState === 'LIFE_LOST') {
                ctx.font = font('bold 80px');
                ctx.fillText('SIGNAL LOST', LOGIC_WIDTH / 2, LOGIC_HEIGHT / 2 - 100);
                ctx.font = font('40px');
                ctx.fillText('> CLICK TO RESUME <', LOGIC_WIDTH / 2, LOGIC_HEIGHT / 2 + 100);
            }
        }

        drawHUD();
        if (gameState === 'CLEAR_SEQ' || gameState === 'SHOP') drawClearSeq();
        if (gameState === 'CARD_INTRO') drawCardIntro();
        if (gameState === 'UPG_VIEW') drawUpgradeView();
    }

    // ===== 상시 HUD (모든 상태에서 가장 위에 그림) =====
    const HUD_TOP_H = 96;          // 72px 점수가 들어가도록 76 -> 96
    const HUD_COLOR = 'rgb(178,178,178)';   // HUD 글씨/아이콘 밝기 70% (255 x 0.7)
    const HUD_BOTTOM_H = 96;
    const VOL_BTN = { x: LOGIC_WIDTH - 96, y: LOGIC_HEIGHT - 96 + 20, w: 80, h: 56 };   // 우측 하단
    const UPG_BTN = { x: LOGIC_WIDTH - 96, y: 20, w: 80, h: 56 };                     // 우측 상단: 업그레이드
    const GEM_RIGHT = UPG_BTN.x - 22;                                                  // 보석 숫자 오른쪽 끝
    let upgHudPulse = 0;
    let soundOn = true;   // 볼륨 상태
    // ===== 사운드 (Web Audio 합성, 16비트 칩 느낌) =====
    // 합성 함수는 (ac, out, t) 를 받아서 실제 재생과 음량 측정(OfflineAudioContext)에 같이 씀
    const SND = (() => {
        const noiseCache = new WeakMap();
        function noiseBuf(ac) {
            let b = noiseCache.get(ac);
            if (!b) {
                b = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.5), ac.sampleRate);
                const d = b.getChannelData(0);
                for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
                noiseCache.set(ac, b);
            }
            return b;
        }
        // 음 하나: 파형, 시작/끝 주파수, 길이, 음량, 필터
        function tone(ac, out, t, o) {
            const osc = ac.createOscillator(), g = ac.createGain();
            osc.type = o.type || 'square';
            osc.frequency.setValueAtTime(o.f0, t);
            if (o.f1) osc.frequency.exponentialRampToValueAtTime(o.f1, t + (o.bend || o.dur));
            if (o.detune) osc.detune.value = o.detune;
            const a = o.attack || 0.002;
            g.gain.setValueAtTime(0.0001, t);
            g.gain.linearRampToValueAtTime(o.gain, t + a);
            g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
            let node = osc;
            if (o.lp) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; node.connect(f); node = f; }
            if (o.hp) { const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = o.hp; node.connect(f); node = f; }
            node.connect(g); g.connect(out);
            osc.start(t); osc.stop(t + o.dur + 0.02);
        }
        function noise(ac, out, t, o) {
            const src = ac.createBufferSource(), g = ac.createGain();
            src.buffer = noiseBuf(ac);
            let node = src;
            if (o.lp) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; node.connect(f); node = f; }
            if (o.hp) { const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = o.hp; node.connect(f); node = f; }
            if (o.bp) { const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = o.bp; f.Q.value = o.q || 1; node.connect(f); node = f; }
            g.gain.setValueAtTime(o.gain, t);
            g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
            node.connect(g); g.connect(out);
            src.start(t); src.stop(t + o.dur + 0.02);
        }
        const hz = m => 440 * Math.pow(2, (m - 69) / 12);          // MIDI 번호 -> Hz
        // 블럭 파괴 음계: C장조 5음 (연속으로 깨면 한 칸씩 올라감)
        const BREAK_SCALE = [72, 74, 76, 79, 81, 84, 86, 88, 91, 93, 96];

        const sfx = {
            // 블럭 파괴: 딱 하는 타격 + 맑은 종소리 + 짧은 저음 쿵 (가장 중요)
            break(ac, out, t, step = 0) {
                const m = BREAK_SCALE[Math.min(step, BREAK_SCALE.length - 1)], f = hz(m);
                noise(ac, out, t, { dur: 0.035, gain: 0.30, hp: 2500 });
                tone(ac, out, t, { type: 'square', f0: f * 2, f1: f, bend: 0.04, dur: 0.10, gain: 0.13, lp: 6000 });
                tone(ac, out, t + 0.004, { type: 'triangle', f0: f * 2, dur: 0.28, gain: 0.16 });
                tone(ac, out, t + 0.004, { type: 'sine', f0: f * 3, dur: 0.18, gain: 0.05 });
                tone(ac, out, t, { type: 'sine', f0: 160, f1: 55, dur: 0.09, gain: 0.28 });
            },
            // 벽돌에 튕김 (안 깨짐): 짧고 둥근 톡
            hit(ac, out, t) {
                tone(ac, out, t, { type: 'square', f0: 520, f1: 480, dur: 0.05, gain: 0.07, lp: 2200 });
                noise(ac, out, t, { dur: 0.015, gain: 0.08, hp: 3000 });
            },
            // 고무에 튕김: 통통 튀는 보잉
            rubber(ac, out, t) {
                tone(ac, out, t, { type: 'triangle', f0: 150, f1: 330, bend: 0.05, dur: 0.16, gain: 0.26 });
                tone(ac, out, t + 0.05, { type: 'sine', f0: 330, f1: 210, bend: 0.1, dur: 0.14, gain: 0.10 });
            },
            // 고무에 레이저 막힘: 먹먹한 툭
            laserBlock(ac, out, t) {
                noise(ac, out, t, { dur: 0.06, gain: 0.12, lp: 700 });
                tone(ac, out, t, { type: 'sine', f0: 180, f1: 90, dur: 0.07, gain: 0.10 });
            },
            // 레이저 발사: 작고 가벼운 피융
            laser(ac, out, t) {
                tone(ac, out, t, { type: 'square', f0: 1500, f1: 700, bend: 0.06, dur: 0.07, gain: 0.025, hp: 500 });
            },
            // 파괴 불가 블럭: 금속 쨍 (배음이 안 맞는 두 음)
            metal(ac, out, t) {
                noise(ac, out, t, { dur: 0.03, gain: 0.10, hp: 5000 });
                tone(ac, out, t, { type: 'square', f0: 1245, dur: 0.22, gain: 0.035, lp: 7000 });
                tone(ac, out, t, { type: 'triangle', f0: 1873, dur: 0.30, gain: 0.07 });
                tone(ac, out, t, { type: 'sine', f0: 2960, dur: 0.12, gain: 0.03 });
            },
            // 공 떨어뜨림: 아래로 떨어지는 음
            drop(ac, out, t) {
                tone(ac, out, t, { type: 'triangle', f0: 660, f1: 110, bend: 0.45, dur: 0.5, gain: 0.20 });
                tone(ac, out, t + 0.02, { type: 'square', f0: 330, f1: 55, bend: 0.45, dur: 0.5, gain: 0.04, lp: 900 });
                noise(ac, out, t + 0.3, { dur: 0.25, gain: 0.05, lp: 400 });
            },
            // 스테이지 클리어: 올라가는 아르페지오 + 화음
            clear(ac, out, t) {
                [72, 76, 79, 84, 88].forEach((m, i) => {
                    tone(ac, out, t + i * 0.075, { type: 'square', f0: hz(m), dur: 0.16, gain: 0.07, lp: 4000 });
                    tone(ac, out, t + i * 0.075, { type: 'triangle', f0: hz(m + 12), dur: 0.22, gain: 0.06 });
                });
                const e = t + 5 * 0.075;
                [72, 76, 79, 84].forEach(m => tone(ac, out, e, { type: 'triangle', f0: hz(m), dur: 1.1, gain: 0.07, attack: 0.01 }));
                tone(ac, out, e, { type: 'square', f0: hz(96), dur: 0.6, gain: 0.03, lp: 5000 });
            },
            // 카드 구매: 동전 두 음
            buy(ac, out, t) {
                tone(ac, out, t, { type: 'square', f0: hz(83), dur: 0.07, gain: 0.09, lp: 6000 });
                tone(ac, out, t + 0.07, { type: 'square', f0: hz(88), dur: 0.35, gain: 0.09, lp: 6000 });
                tone(ac, out, t + 0.07, { type: 'triangle', f0: hz(100), dur: 0.3, gain: 0.05 });
            }
        };

        // 배경음: 88 BPM, A단조 계열 4마디 반복. 부드러운 패드 + 삼각파 아르페지오 (에코) + 저음
        const BPM = 88, S16 = 60 / BPM / 4;
        const BARS = [
            { bass: 45, chord: [57, 60, 64, 67] },   // Am7
            { bass: 41, chord: [57, 60, 64, 65] },   // Fmaj7
            { bass: 38, chord: [57, 62, 65, 69] },   // Dm
            { bass: 40, chord: [56, 59, 64, 68] }    // E
        ];
        const ARP = [0, 1, 2, 3, 2, 1, 2, 3, 0, 2, 3, 1, 3, 2, 1, 2];
        function bgmBar(ac, out, t, bar) {
            const B = BARS[bar % BARS.length];
            B.chord.forEach(m => tone(ac, out, t, { type: 'square', f0: hz(m), dur: S16 * 16, gain: 0.010, attack: 0.5, lp: 650 }));
            tone(ac, out, t, { type: 'triangle', f0: hz(B.bass), dur: S16 * 7.5, gain: 0.08, attack: 0.02 });
            tone(ac, out, t + S16 * 8, { type: 'triangle', f0: hz(B.bass), dur: S16 * 7.5, gain: 0.07, attack: 0.02 });
            for (let i = 0; i < 16; i++) {
                const m = B.chord[ARP[i]] + 12 + (i >= 8 && bar % 2 ? 12 : 0);
                tone(ac, out.arp || out, t + i * S16, { type: 'triangle', f0: hz(m), dur: S16 * 1.6, gain: 0.028 });
                if (i % 4 === 2) noise(ac, out, t + i * S16, { dur: 0.03, gain: 0.010, hp: 7000 });
            }
        }
        // 긴장: 블럭 5개 이하 남았을 때. 조용한 심장 박동 + 작은 째깍
        function tensionBeat(ac, out, t) {
            tone(ac, out, t, { type: 'sine', f0: 62, f1: 45, dur: 0.18, gain: 0.08 });
            tone(ac, out, t + 0.22, { type: 'sine', f0: 58, f1: 42, dur: 0.16, gain: 0.05 });
            tone(ac, out, t + S16 * 4, { type: 'square', f0: hz(93), dur: 0.03, gain: 0.012, hp: 2000 });
        }
        return { sfx, bgmBar, tensionBeat, S16 };
    })();

    // 재생: 첫 터치/키 입력에서 AudioContext 를 만듦 (iOS 는 사용자 입력이 있어야 소리 남)
    let AC = null, audioMaster = null, sfxBus = null, bgmBus = null;
    let bgmNextBar = 0, bgmBarIdx = 0, bgmTimer = null, breakCombo = 0, lastBreakT = -9;
    const sfxLast = {};
    const SFX_MIN_GAP = { break: 0.025, hit: 0.03, rubber: 0.04, laserBlock: 0.04, laser: 0.05, metal: 0.04 };
    const BGM_VOLUME = 0.55, MASTER_VOLUME = 0.8;
    function unlockAudio() {
        try {
            if (!AC) {
                const C = window.AudioContext || window.webkitAudioContext;
                if (!C) return;
                AC = new C();
                const comp = AC.createDynamicsCompressor();
                comp.threshold.value = -12; comp.ratio.value = 4;
                audioMaster = AC.createGain(); audioMaster.gain.value = soundOn ? MASTER_VOLUME : 0;
                sfxBus = AC.createGain(); sfxBus.connect(audioMaster);
                bgmBus = AC.createGain(); bgmBus.gain.value = BGM_VOLUME; bgmBus.connect(audioMaster);
                // 아르페지오 에코 (3/16 박자, 되먹임 35%)
                const dl = AC.createDelay(1), fb = AC.createGain(), wet = AC.createGain();
                dl.delayTime.value = SND.S16 * 3; fb.gain.value = 0.35; wet.gain.value = 0.5;
                const arp = AC.createGain(); arp.connect(bgmBus); arp.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(bgmBus);
                bgmBus.arp = arp;
                audioMaster.connect(comp); comp.connect(AC.destination);
                bgmNextBar = AC.currentTime + 0.1;
                bgmTimer = setInterval(scheduleBgm, 50);
            }
            if (AC.state === 'suspended') AC.resume();
        } catch (e) { AC = null; }
    }
    function scheduleBgm() {
        if (!AC) return;
        while (bgmNextBar < AC.currentTime + 0.3) {
            SND.bgmBar(AC, bgmBus, bgmNextBar, bgmBarIdx);
            if (tensionActive()) for (let k = 0; k < 4; k++) SND.tensionBeat(AC, bgmBus, bgmNextBar + k * SND.S16 * 4);
            bgmNextBar += SND.S16 * 16; bgmBarIdx++;
        }
    }
    const tensionActive = () => gameState === 'PLAY' && bricks.some(b => b.alive && isBreakable(b)) &&
                                bricks.filter(b => b.alive && isBreakable(b)).length <= TENSION_LEFT;
    const TENSION_LEFT = 5;
    function applyVolume() { if (audioMaster) audioMaster.gain.setTargetAtTime(soundOn ? MASTER_VOLUME : 0, AC.currentTime, 0.02); }
    function sfx(name) {
        if (!AC || !soundOn || AC.state !== 'running') return;
        try {
            const t = AC.currentTime, now = performance.now() / 1000;   // 간격 판단은 화면 시계 (오디오 시계는 끊겨서 갈 수 있음)
            if (now - (sfxLast[name] || -9) < (SFX_MIN_GAP[name] || 0)) return;   // 한꺼번에 여러 번 나면 한 번만
            sfxLast[name] = now;
            if (name === 'break') {
                breakCombo = now - lastBreakT < 0.9 ? breakCombo + 1 : 0;     // 0.9초 안에 연속으로 깨면 음이 올라감
                lastBreakT = now;
                SND.sfx.break(AC, sfxBus, t, breakCombo);
            } else SND.sfx[name](AC, sfxBus, t);
        } catch (e) {}
    }
    document.addEventListener('visibilitychange', () => { if (AC) (document.hidden ? AC.suspend() : AC.resume()); });


    function drawHUD() {
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fillRect(0, 0, LOGIC_WIDTH, HUD_TOP_H);
        ctx.fillRect(0, LOGIC_HEIGHT - HUD_BOTTOM_H, LOGIC_WIDTH, HUD_BOTTOM_H);

        ctx.textBaseline = 'middle';
        ctx.font = font('bold 36px');

        // 좌측 상단: STAGE
        ctx.fillStyle = HUD_COLOR;
        ctx.textAlign = 'left';
        ctx.fillText(`STAGE : ${currentStage + 1}`, 24, HUD_TOP_H / 2);

        // 상단 가운데: 점수
        ctx.textAlign = 'center';
        ctx.font = font('bold 72px');
        ctx.fillText(String(score).padStart(6, '0'), LOGIC_WIDTH / 2, HUD_TOP_H / 2);

        // 우측 상단: 보유 보석
        const pulse = gemHudPulse > 0 ? Math.sin((gemHudPulse / 400) * Math.PI) : 0;
        ctx.font = font(`bold ${Math.round(40 + pulse * 14)}px`);
        ctx.textAlign = 'right';
        ctx.fillStyle = pulse > 0 ? '#fff' : HUD_COLOR;
        ctx.fillText(String(gemCount), GEM_RIGHT, HUD_TOP_H / 2);
        ctx.font = font('bold 40px');
        const gemTextW = ctx.measureText(String(gemCount)).width;
        drawMoneyGem(ctx, GEM_RIGHT - gemTextW - 34, HUD_TOP_H / 2, 44, performance.now());
        drawUpgradeButton();

        // 우측 하단: 볼륨 버튼 (이모지 대신 도형으로 그려 iPhone/Mac 동일하게)
        drawVolumeButton();

        // 좌측 하단: 남은 패들 (미니 패들 아이콘)
        const mw = 64, mh = 18, gap = 14, my = LOGIC_HEIGHT - HUD_BOTTOM_H / 2 - mh / 2;
        for (let i = 0; i < lives; i++) {
            const mx = 24 + i * (mw + gap);
            ctx.fillStyle = HUD_COLOR;
            ctx.beginPath(); ctx.roundRect(mx, my, mw, mh, mh / 2); ctx.fill();
            ctx.fillStyle = '#000';                         // 양끝 캡 구분선
            ctx.fillRect(mx + mh, my, 2, mh);
            ctx.fillRect(mx + mw - mh - 2, my, 2, mh);
        }

        // 하단 가운데: 볼 파워 (크게)
        let maxPwr = 1;
        balls.forEach(b => { if ((b.power || 1) > maxPwr) maxPwr = b.power; });
        ctx.fillStyle = HUD_COLOR;
        ctx.font = font('bold 32px');
        ctx.textAlign = 'center';
        ctx.fillText(`POWER ${maxPwr}`, LOGIC_WIDTH / 2, LOGIC_HEIGHT - HUD_BOTTOM_H / 2);
    }

    function drawUpgradeButton() {
        const { x, y, w, h } = UPG_BTN;
        const p = upgHudPulse > 0 ? Math.sin((upgHudPulse / 450) * Math.PI) : 0;
        const col = p > 0 ? '#fff' : HUD_COLOR;
        ctx.save();
        ctx.translate(x + w / 2, y + h / 2);
        ctx.scale(1 + p * 0.25, 1 + p * 0.25);
        ctx.strokeStyle = col; ctx.lineWidth = 2 + p * 2;
        ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, 10); ctx.stroke();
        // 겹친 카드 아이콘
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.roundRect(-10, -18, 26, 34, 4); ctx.stroke();
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.roundRect(-18, -12, 26, 34, 4); ctx.fill();
        ctx.fillStyle = '#000';
        ctx.fillRect(-12, -4, 14, 3); ctx.fillRect(-12, 3, 14, 3);
        ctx.restore();
    }

    // ===== 업그레이드 보기 (게임 일시정지) =====
    function upgViewLayout() {
        const owned = SHOP_CARDS.filter(c => cardLevel(c.id) > 0).map(c => c.id);
        const cols = 4, pad = 40, gap = 24, sc = 0.74;
        const cw = INTRO_CARD_W * sc, ch = INTRO_CARD_H * sc, top = 340;
        const cards = owned.map((id, i) => ({ id, x: pad + (i % cols) * (cw + gap), y: top + Math.floor(i / cols) * (ch + gap), w: cw, h: ch }));
        const resume = { x: LOGIC_WIDTH / 2 - 260, y: LOGIC_HEIGHT - HUD_BOTTOM_H - 200, w: 520, h: 116 };
        return { cards, resume, sc };
    }
    function openUpgradeView() { gameState = 'UPG_VIEW'; }
    function closeUpgradeView() { gameState = 'PLAY'; }
    function handleUpgViewTap(x, y) {
        if (inRect(upgViewLayout().resume, x, y) || inRect(UPG_BTN, x, y)) closeUpgradeView();
    }
    function drawUpgradeView() {
        const L = upgViewLayout(), f = Math.floor(performance.now() / SAND_INTERVAL) % SAND_FRAMES;
        ctx.fillStyle = 'rgba(0,0,0,0.9)';
        ctx.fillRect(0, HUD_TOP_H, LOGIC_WIDTH, LOGIC_HEIGHT - HUD_TOP_H - HUD_BOTTOM_H);
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = '#fff'; ctx.font = font('bold 80px');
        ctx.fillText('UPGRADES', LOGIC_WIDTH / 2, 190);
        ctx.fillStyle = 'rgb(150,150,150)'; ctx.font = font('34px');
        ctx.fillText(`일시정지  ·  보유 ${L.cards.length}종`, LOGIC_WIDTH / 2, 270);
        if (!L.cards.length) {
            ctx.fillStyle = 'rgb(130,130,130)'; ctx.font = font('38px');
            ctx.fillText('보유한 업그레이드가 없습니다', LOGIC_WIDTH / 2, LOGIC_HEIGHT / 2 - 100);
        }
        L.cards.forEach(r => {
            ctx.save();
            ctx.translate(r.x, r.y);
            ctx.scale(L.sc, L.sc);
            drawShopCard(ctx, 0, 0, INTRO_CARD_W, INTRO_CARD_H, cardById(r.id), cardLevel(r.id), f, { noPrice: true, owned: true });
            ctx.restore();
        });
        drawShopButton(L.resume, '계속하기 ▶', null, true, true);
    }

    function drawVolumeButton() {
        const { x, y, w, h } = VOL_BTN;
        ctx.strokeStyle = HUD_COLOR;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.roundRect(x, y, w, h, 10); ctx.stroke();

        // 스피커 몸체
        const cx = x + 26, cy = y + h / 2;
        ctx.fillStyle = HUD_COLOR;
        ctx.beginPath();
        ctx.moveTo(cx - 12, cy - 7); ctx.lineTo(cx - 4, cy - 7); ctx.lineTo(cx + 6, cy - 15);
        ctx.lineTo(cx + 6, cy + 15); ctx.lineTo(cx - 4, cy + 7); ctx.lineTo(cx - 12, cy + 7);
        ctx.closePath(); ctx.fill();

        ctx.lineWidth = 3;
        if (soundOn) {
            // 음파 2줄
            [10, 18].forEach(r => { ctx.beginPath(); ctx.arc(cx + 8, cy, r, -Math.PI / 4, Math.PI / 4); ctx.stroke(); });
        } else {
            // X 표시
            ctx.beginPath();
            ctx.moveTo(cx + 14, cy - 9); ctx.lineTo(cx + 30, cy + 9);
            ctx.moveTo(cx + 30, cy - 9); ctx.lineTo(cx + 14, cy + 9);
            ctx.stroke();
        }
    }

    // 캔버스 좌표가 볼륨 버튼 안이면 토글하고 true 반환
    function hitVolumeButton(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const lx = (clientX - rect.left) * LOGIC_WIDTH / rect.width;
        const ly = (clientY - rect.top) * LOGIC_HEIGHT / rect.height;
        const pad = 16;   // 손가락 터치 여유
        if (lx >= VOL_BTN.x - pad && lx <= VOL_BTN.x + VOL_BTN.w + pad &&
            ly >= VOL_BTN.y - pad && ly <= VOL_BTN.y + VOL_BTN.h + pad) {
            soundOn = !soundOn;
            applyVolume();
            return true;
        }
        return false;
    }

    function loop(now) {
        if (lastTime === 0) lastTime = now;
        let delta = now - lastTime;
        lastTime = now;

        if (delta > 250) delta = STEP_MS;

        accumulator += delta;
        let steps = 0;
        while (accumulator >= STEP_MS && steps < 5) {
            updateDust();
            screenShake = Math.max(0, screenShake - SHAKE_DECAY * STEP_MS / 1000);
            
            if (hitStopTimer > 0) {
                hitStopTimer -= STEP_MS;
            } else {
                if (gameState === 'CLEAR_SEQ') updateClearSeq();
                else if (gameState === 'CARD_INTRO') updateCardIntro();
                else update();
            }
            if (gemHudPulse > 0) gemHudPulse -= STEP_MS;
            if (upgHudPulse > 0) upgHudPulse -= STEP_MS;
            
            accumulator -= STEP_MS;
            steps++;
        }

        draw();
        requestAnimationFrame(loop);
    }

    // 게임 시작/재시작 - iOS에서 touchstart가 click을 막으므로 양쪽 모두 연결
    function tryStart() {

            lives = START_LIVES;
            score = 0;

        } else if (gameState === 'LIFE_LOST') {

        }
    }

        const rect = canvas.getBoundingClientRect();
        return { x: (clientX - rect.left) * LOGIC_WIDTH / rect.width, y: (clientY - rect.top) * LOGIC_HEIGHT / rect.height };
    }

        unlockAudio();
        if (hitVolumeButton(clientX, clientY)) return;

        if (gameState === 'SHOP') { handleShopTap(p.x, p.y); return; }

    }
