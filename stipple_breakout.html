    // --- 패들 후보: 기본 패들(1번)에서 조금씩만 변형 ---
    const paddleVariants = [
        { name: '1. SAND RAIL (이전 기본)',        fn: pvSandRail },
        { name: '2. VAUS + LASER (내장형)',   fn: pvRailLaser },
        { name: '3. BASE LONG (x1.4)',        fn: pvRailLong },
        { name: '4. BASE TRI-CELL (전기 연결)', fn: pvRailTriCell },
        { name: '5. CLASSIC VAUS (현재 적용)',    fn: pvClassicVaus }
    ];

    // 기본 패들의 레일 + 본체 외곽 + 양끝 브래킷 (공통 부분)
    function drawRailShell(c, x, y, w, h, f, seedBase) {
        const railH = h * 0.16, by = y + railH + 3, bh = h - railH - 5;
        scatterDots(c, x + w*0.04, y, w*0.92, railH, {
            seed: seedBase + 1, frame: f, spacing: 2.6,
            density: nx => 0.45 + (1 - Math.abs(nx-0.5)*2) * 0.55,
            lum: nx => 170 + (1 - Math.abs(nx-0.5)*2) * 85
        });
        return { railH, by, bh };
    }

    function drawRailBrackets(c, x, w, h, by, bh, f, seedBase) {
        const bw = h * 0.5;
        [x, x + w - bw].forEach((bx, i) => scatterDots(c, bx, by, bw, bh, {
            seed: seedBase + 10 + i, frame: f, density: 0.95, lum: 255, spacing: 2.7
        }));
    }

    // 1. 기본 패들
    function pvSandRail(c, x, y, w, h, f) {
        const { by, bh } = drawRailShell(c, x, y, w, h, f, 3000);
        scatterDots(c, x, by, w, bh, {
            seed: 3002, frame: f, density: 0.88,
            lum: (nx, ny) => 150 + (1-Math.abs(nx-0.5)*2)*55 + (1-ny)*40
        });
        strokeDotRect(c, x, by, w, bh, bh*0.35, { seed: 3003, frame: f, lum: 255, density: 0.95 });
        drawRailBrackets(c, x, w, h, by, bh, f, 3000);
        scatterDots(c, x+w/2-2.5, by+bh*0.18, 5, bh*0.64, { seed: 3020, frame: f, density: 1, lum: 255, spacing: 2.2 });
    }

    // 금속 명암 프로파일 (세로 위치 ny: 0=위, 1=아래)
    // 위쪽 강한 하이라이트 띠 + 가운데 어두운 반사 + 아래쪽 약한 2차 반사 = 연마된 은색 금속
    function metalLum(ny) {
        const hi  = 130 * Math.exp(-Math.pow((ny - 0.26) / 0.11, 2));
        const sec =  55 * Math.exp(-Math.pow((ny - 0.80) / 0.09, 2));
        const edge = 40 * Math.min(1, Math.min(ny, 1 - ny) * 6);   // 위아래 끝은 어둡게
        return Math.min(255, 85 + edge + hi + sec);
    }

    // 캡슐형 Vaus 실루엣 판정 (로컬 픽셀 좌표). ins만큼 안쪽으로 축소한 형태로 판정
    // 양끝은 위가 비스듬히 깎이고 아래는 거의 평평한 기수(nose) 형태
    const VAUS_CAP = 1.1;   // 끝 캡 길이 = 높이 x 1.1
    function inCapsule(px, py, w, h, ins) {
        const W = w - ins * 2, H = h - ins * 2;
        const X = px - ins, Y = py - ins;
        if (X < 0 || X > W || Y < 0 || Y > H) return false;
        const capLen = H * VAUS_CAP;
        const d = Math.min(X, W - X);
        if (d >= capLen) return true;
        const t = 1 - d / capLen;
        const e = Math.sqrt(Math.max(0, 1 - t * t));
        const top = H * 0.55 * (1 - e);
        const bot = H - H * 0.25 * (1 - e);
        return Y >= top && Y <= bot;
    }

    // 2. Vaus 캡슐형 은색 본체 + 본체 안에 내장된 레이저 포트
    //    모든 요소가 패들 높이(h) 안에만 그려져 공이 튀어나온 부분에 걸리지 않음
    function pvRailLaser(c, x, y, w, h, f) {
        const capLen = h * VAUS_CAP;
        const inside = (nx, ny, ins) => inCapsule(nx * w, ny * h, w, h, ins);

        // 1) 은색 원통 본체 - 위 하이라이트 / 아래 반사 / 양끝 캡은 살짝 밝게
        scatterDots(c, x, y, w, h, {
            seed: 3150, frame: f, spacing: 2.1, jitter: 0.5, density: 0.97,
            mask: (nx, ny) => inside(nx, ny, 0),
            lum: (nx, ny) => metalLum(ny) * (Math.min(nx, 1 - nx) * w < capLen ? 1.08 : 1)
        });

        // 2) 외곽선 - 위쪽은 밝게, 아래쪽은 어둡게 해서 입체감
        scatterDots(c, x, y, w, h, {
            seed: 3151, frame: f, spacing: 1.7, jitter: 0.3, density: 1,
            mask: (nx, ny) => inside(nx, ny, 0) && !inside(nx, ny, 2.2),
            lum: (nx, ny) => ny < 0.5 ? 255 : 140
        });

        // 3) 끝 캡과 본체를 나누는 이음새 (어두운 홈 + 안쪽 밝은 모서리)
        [capLen, w - capLen].forEach((dx, i) => {
            scatterDots(c, x + dx - 1.2, y + 3, 2.4, h - 6, { seed: 3160 + i, frame: f, spacing: 1.5, jitter: 0.2, density: 1, lum: 30 });
            scatterDots(c, x + dx + (i === 0 ? 1.8 : -3.4), y + 3, 1.6, h - 6, { seed: 3162 + i, frame: f, spacing: 1.5, jitter: 0.2, density: 0.9, lum: 230 });
        });

        // 4) 끝 캡 상단 광택 (참고 이미지의 파란 하이라이트를 밝기로 표현)
        [capLen * 0.55, w - capLen * 0.55].forEach((cx, i) => {
            const rw = capLen * 0.42, rh = h * 0.14;
            scatterDots(c, x + cx - rw / 2, y + h * 0.14, rw, rh, {
                seed: 3165 + i, frame: f, spacing: 1.5, jitter: 0.2, density: 1,
                mask: (nx, ny) => Math.hypot((nx - 0.5) * 2, (ny - 0.5) * 2) <= 1,
                lum: 255
            });
        });

        // 5) 회로 트레이스 (참고 이미지의 주황 라인) - 하단을 가로지르고 위로 꺾이는 밝은 선
        const tY = y + h * 0.72;
        const x0 = x + capLen + 5, x1 = x + w - capLen - 5;
        scatterDots(c, x0, tY - 1.1, x1 - x0, 2.2, { seed: 3170, frame: f, spacing: 1.5, jitter: 0.15, density: 1, lum: 235 });
        scatterDots(c, x0, tY + 1.4, x1 - x0, 1.4, { seed: 3171, frame: f, spacing: 1.5, jitter: 0.15, density: 1, lum: 40 });
        [x0, x + w * 0.4, x + w * 0.6, x1 - 2.2].forEach((tx, i) => {
            scatterDots(c, tx, y + h * 0.5, 2.2, tY - (y + h * 0.5) + 1, { seed: 3172 + i, frame: f, spacing: 1.5, jitter: 0.15, density: 1, lum: 235 });
        });

        // 6) 내장형 레이저 포트 - 본체 안에 파묻힌 하우징, 포구는 본체 윗면과 같은 높이
        [0.28, 0.72].forEach((t, i) => {
            const hw = h * 0.42, hh = h * 0.5;
            const hx = x + w * t - hw / 2, hy = y + h * 0.14;
            // 움푹 들어간 어두운 하우징
            scatterDots(c, hx, hy, hw, hh, { seed: 3180 + i, frame: f, spacing: 1.6, jitter: 0.2, density: 1, lum: 40 });
            strokeDotRect(c, hx, hy, hw, hh, 2, { seed: 3185 + i, frame: f, lum: 200, density: 1, spacing: 1.6 });
            // 원통형 포신 (왼쪽 세로 하이라이트)
            const bwid = hw * 0.38, bx = hx + (hw - bwid) / 2;
            scatterDots(c, bx, hy + 2, bwid, hh - 4, {
                seed: 3190 + i, frame: f, spacing: 1.4, jitter: 0.15, density: 1,
                lum: (nx) => 120 + 135 * Math.exp(-Math.pow((nx - 0.35) / 0.25, 2))
            });
            // 포구 발광 (하우징 안쪽 윗부분)
            scatterDots(c, bx - 1, hy + 1, bwid + 2, 2.5, { seed: 3195 + i, frame: f, spacing: 1.3, jitter: 0.1, density: 1, lum: 255 });
        });
    }

    // 3. 기본 패들을 1.4배 길게 (중심 기준 확장)
    function pvRailLong(c, x, y, w, h, f) {
        const lw = w * 1.4;
        pvSandRail(c, x - (lw - w) / 2, y, lw, h, f);
    }

    // 4. 기본 패들 내부를 3칸으로 나누고 칸 사이를 전기 아크로 연결
    function pvRailTriCell(c, x, y, w, h, f) {
        const { by, bh } = drawRailShell(c, x, y, w, h, f, 3200);
        const bw = h * 0.5;
        const gap = h * 0.45;
        const innerX = x + bw + 3;
        const innerW = w - (bw + 3) * 2;
        const cellW = (innerW - gap * 2) / 3;

        // 외곽선은 기본 패들과 동일하게 전체를 감싼다
        strokeDotRect(c, x, by, w, bh, bh*0.35, { seed: 3203, frame: f, lum: 255, density: 0.95 });
        drawRailBrackets(c, x, w, h, by, bh, f, 3200);

        for (let i = 0; i < 3; i++) {
            const cx = innerX + i * (cellW + gap);
            // 셀 본체 - 가운데 셀이 가장 밝음
            scatterDots(c, cx, by + 3, cellW, bh - 6, {
                seed: 3230 + i, frame: f, density: 0.9,
                lum: (nx, ny) => (i === 1 ? 190 : 160) + (1-ny)*40
            });
            strokeDotRect(c, cx, by + 3, cellW, bh - 6, 3, { seed: 3240 + i, frame: f, lum: 230, density: 0.9, spacing: 2.2 });
        }

        // 셀 사이 전기 아크 - 프레임마다 지그재그 모양이 바뀜
        const midY = by + bh / 2;
        for (let g = 0; g < 2; g++) {
            const gx0 = innerX + cellW + g * (cellW + gap);
            const steps = Math.max(6, Math.round(gap / 1.6));
            for (let s = 0; s <= steps; s++) {
                const t = s / steps;
                const jitter = (hash3(3300 + g, s, f) - 0.5) * bh * 0.55 * Math.sin(t * Math.PI);
                const px = gx0 + gap * t;
                const py = midY + jitter;
                c.fillStyle = 'rgb(255,255,255)';
                c.fillRect(px - DOT_SIZE/2, py - DOT_SIZE/2, DOT_SIZE, DOT_SIZE);
                // 아크 주변 희미한 방전 입자
                if (hash3(3310 + g, s, f) < 0.35) {
                    const L = 120 + (hash3(3320 + g, s, f) * 80) | 0;
                    c.fillStyle = `rgb(${L},${L},${L})`;
                    c.fillRect(px + (hash3(3330+g, s, f)-0.5)*4, py + (hash3(3340+g, s, f)-0.5)*6, DOT_SIZE, DOT_SIZE);
                }
            }
        }

        // 중앙 코어 마커 (가운데 셀 안)
        scatterDots(c, x + w/2 - 2.5, by + bh*0.18, 5, bh*0.64, { seed: 3220, frame: f, density: 1, lum: 255, spacing: 2.2 });
    }

    // 5. 클래식 아케이드 Vaus - 좌우 둥근 엔드캡(원작 빨강) + 가운데 은색 원통, 사이에 검은 틈
    //    흑백이므로 엔드캡은 더 어둡고 조밀한 도트, 원통은 밝은 금속 반사로 구분
    function pvClassicVaus(c, x, y, w, h, f) {
        const gap = 3;                 // 캡과 원통 사이 검은 틈
        const capW = h * 1.05;         // 엔드캡 길이
        const bodyX = x + capW + gap;
        const bodyW = w - (capW + gap) * 2;
        const bodyY = y + h * 0.12;    // 원통은 캡보다 살짝 얇음
        const bodyH = h * 0.76;

        // 1) 가운데 은색 원통 - 위 반사띠 + 아래 2차 반사
        scatterDots(c, bodyX, bodyY, bodyW, bodyH, {
            seed: 5001, frame: f, spacing: 2.0, jitter: 0.45, density: 0.98,
            lum: (nx, ny) => metalLum(ny)
        });
        // 원통 윗/아랫면 경계선
        scatterDots(c, bodyX, bodyY, bodyW, 1.8, { seed: 5002, frame: f, spacing: 1.5, jitter: 0.15, density: 1, lum: 255 });
        scatterDots(c, bodyX, bodyY + bodyH - 1.8, bodyW, 1.8, { seed: 5003, frame: f, spacing: 1.5, jitter: 0.15, density: 1, lum: 110 });

        // 2) 좌우 엔드캡 - 바깥쪽은 반원, 안쪽은 평평한 캡슐 반쪽
        [0, 1].forEach(side => {
            const cx0 = side === 0 ? x : x + w - capW;
            scatterDots(c, cx0, y, capW, h, {
                seed: 5010 + side, frame: f, spacing: 1.9, jitter: 0.4, density: 1,
                mask: (nx, ny) => {
                    // 바깥쪽 절반만 둥글게 깎음
                    const ox = side === 0 ? nx : 1 - nx;          // 0 = 바깥 끝
                    if (ox >= 0.5) return true;
                    const dx = (0.5 - ox) / 0.5;                   // 0~1
                    const dy = (ny - 0.5) / 0.5;                   // -1~1
                    return dx * dx + dy * dy <= 1;
                },
                // 캡은 원통보다 어둡게(원작 빨강 톤), 위쪽 광택만 밝게
                lum: (nx, ny) => 70 + metalLum(ny) * 0.45
            });
            // 캡 외곽 밝은 테두리 느낌 - 윗부분 광택점
            const hlx = side === 0 ? cx0 + capW * 0.35 : cx0 + capW * 0.35;
            scatterDots(c, hlx, y + h * 0.16, capW * 0.32, h * 0.14, {
                seed: 5020 + side, frame: f, spacing: 1.4, jitter: 0.15, density: 1,
                mask: (nx, ny) => Math.hypot((nx - 0.5) * 2, (ny - 0.5) * 2) <= 1,
                lum: 255
            });
        });
    }

    let stagePreviewSet = 'draft', stagePreviewIdx = 0;
    const stageCharTier = ch => ch in STAGE_CHAR_TIER ? STAGE_CHAR_TIER[ch] : parseInt(ch, 10);
    function stageStats(L) {
        let n = 0, hits = 0, gold = 0, rubber = 0;
        L.map(r => r.slice(0, cols)).join('').split('').forEach(ch => {
            if (ch === '.') return;
            const T = BRICK_TIERS[stageCharTier(ch)];
            if (T.hp === Infinity) { gold++; return; }
            n++; hits += T.hp; if (T.laserProof) rubber++;
        });
        return { n, hits, gold, rubber };
    }
    function stagePreviewList() {
        const all = STAGES.map((L, i) => ({ n: i + 1, L }));
        return stagePreviewSet === 'current' ? all : all.slice(0, 8);   // 'draft' = 1세션 (1~8)
    }
    function stagePreviewNav(k) {
        const n = stagePreviewList().length;
        if (k === 'prev') stagePreviewIdx = Math.max(0, stagePreviewIdx - 1);
        else if (k === 'next') stagePreviewIdx = Math.min(n - 1, stagePreviewIdx + 1);
        else if (k === 'set') { stagePreviewSet = stagePreviewSet === 'draft' ? 'current' : 'draft'; stagePreviewIdx = 0; }
    }
    // 미리보기 캔버스를 개발자 화면 남은 높이에 딱 맞춤 (스크롤 없이 한 화면)
    function fitStageCanvas(cv) {
        if (!cv.clientWidth) return;
        const panel = document.getElementById('dev-panel');
        const other = panel.offsetHeight - cv.clientHeight;
        const pad = parseFloat(getComputedStyle(devOverlay).paddingTop) * 2;
        const cssH = Math.max(160, Math.min(devOverlay.clientHeight - pad - other - 6, cv.clientWidth * SV_H / LOGIC_WIDTH));
        cv.style.height = cssH + 'px';
        cv.height = Math.round(cssH * cv.width / cv.clientWidth);
    }
    // 보여 주는 영역: 블럭 시작 60px 위 ~ 1000px (14줄까지). 모든 스테이지 같은 배율
    const SV_Y0 = offsetY - 60, SV_H = paddle.y + paddle.height + 20 - SV_Y0;   // 블럭 시작 조금 위 ~ 패들 아래
    function stagePreviewFrame(cv) {
        const s = Math.min(cv.width / LOGIC_WIDTH, cv.height / SV_H);
        const w = LOGIC_WIDTH * s, h = SV_H * s;
        return { s, x: (cv.width - w) / 2, y: (cv.height - h) / 2, w, h };
    }
    function drawStagePreview() {
        const cv = document.getElementById('dev-stage-canvas');
        if (!cv) return;
        fitStageCanvas(cv);
        const c = cv.getContext('2d');
        const f = Math.floor(performance.now() / SAND_INTERVAL) % SAND_FRAMES;
        const list = stagePreviewList(), item = list[Math.min(stagePreviewIdx, list.length - 1)];
        const F = stagePreviewFrame(cv), s = F.s;
        c.fillStyle = '#000'; c.fillRect(0, 0, cv.width, cv.height);
        c.fillStyle = '#080808'; c.fillRect(F.x, F.y, F.w, F.h);
        item.L.forEach((row, r) => row.slice(0, cols).split('').forEach((ch, col) => {
            if (ch === '.') return;
            c.drawImage(brickSprites[stageCharTier(ch)][0][(f + r * cols + col) % SAND_FRAMES],
                F.x + (offsetX + col * brickWidth) * s, F.y + (offsetY - SV_Y0 + r * (brickHeight + layoutGap(item.L))) * s, brickWidth * s, brickHeight * s);
        }));
        // 패들과 공 (시작 위치)
        const pw = PADDLE_SIZES[0];
        pvClassicVaus(c, F.x + (LOGIC_WIDTH - pw) / 2 * s, F.y + (paddle.y - SV_Y0) * s, pw * s, paddle.height * s, f);
        c.fillStyle = '#ccc';
        c.beginPath(); c.arc(F.x + LOGIC_WIDTH / 2 * s, F.y + (LOGIC_HEIGHT - 300 - SV_Y0) * s, 18 * s, 0, Math.PI * 2); c.fill();
        c.strokeStyle = 'rgba(255,255,255,0.3)'; c.lineWidth = 2;
        c.strokeRect(F.x + 1, F.y + 1, F.w - 2, F.h - 2);
    }

    function drawPaddlePreview() {
        const cv = document.getElementById('dev-paddle-canvas');
        if (!cv) return;
        const c = cv.getContext('2d');
        const f = Math.floor(performance.now() / SAND_INTERVAL) % SAND_FRAMES;
        const rowH = 190, sc = 1.6;
        cv.height = rowH * PADDLE_SIZES.length;
        c.fillStyle = '#000';
        c.fillRect(0, 0, cv.width, cv.height);
        PADDLE_SIZES.forEach((w, i) => {
            const top = i * rowH, pw = w * sc, ph = paddle.height * sc;
            c.fillStyle = '#ddd'; c.font = font('bold 40px');
            c.textAlign = 'left'; c.textBaseline = 'top';
            c.fillText(i === 0 ? '기본' : `크기 ${i}단계`, 24, top + 20);
            c.fillStyle = '#888'; c.font = font('32px'); c.textAlign = 'right';
            c.fillText(`폭 ${w}`, cv.width - 24, top + 24);
            pvClassicVaus(c, (cv.width - pw) / 2, top + 90, pw, ph, f);
            c.strokeStyle = 'rgba(255,255,255,0.12)'; c.lineWidth = 1;
            c.beginPath(); c.moveTo(0, top + rowH - 0.5); c.lineTo(cv.width, top + rowH - 0.5); c.stroke();
        });
    }

    // 개발자 모드 2번 배치 (그리기와 테스트가 같은 값을 사용)
    const BP = { cols: 2, pad: 24, gap: 24, cellH: 440, scale: 2.5, titlePx: 48, descPx: 34, labelPx: 30 };
    // 칸 안 세로 위치 (칸 위쪽 기준)
    BP.titleY = 24;
    BP.hpY = BP.titleY + BP.titlePx + 12;
    BP.descY = BP.hpY + BP.descPx + 18;
    BP.descLine = BP.descPx + 10;
    BP.brickY = BP.descY + BP.descLine * 2 + 16;
    function brickPreviewLayout(canvasW) {
        const cw = (canvasW - BP.pad * 2 - BP.gap * (BP.cols - 1)) / BP.cols;
        const rows = Math.ceil(BRICK_TIERS.length / BP.cols);
        const cells = BRICK_TIERS.map((T, i) => ({
            i, x: BP.pad + (i % BP.cols) * (cw + BP.gap), y: BP.pad + Math.floor(i / BP.cols) * (BP.cellH + BP.gap), w: cw, h: BP.cellH
        }));
        return { cells, height: BP.pad * 2 + rows * BP.cellH + (rows - 1) * BP.gap, bw: brickWidth * BP.scale, bh: brickHeight * BP.scale };
    }
    // 폭을 넘으면 줄바꿈 (공백 기준, 공백이 없으면 글자 단위)
    function wrapText(c, text, maxW) {
        const words = text.split(' '), lines = []; let cur = '';
        for (const w of words) {
            const t = cur ? cur + ' ' + w : w;
            if (c.measureText(t).width <= maxW || !cur) cur = t; else { lines.push(cur); cur = w; }
        }
        if (cur) lines.push(cur);
        return lines;
    }

    function drawBrickPreview() {
        const cv = document.getElementById('dev-brick-canvas');
        if (!cv) return;
        const c = cv.getContext('2d');
        const f = Math.floor(performance.now() / SAND_INTERVAL) % SAND_FRAMES;
        const L = brickPreviewLayout(cv.width);
        cv.height = L.height;
        c.fillStyle = '#000';
        c.fillRect(0, 0, cv.width, cv.height);

        L.cells.forEach(cell => {
            const T = BRICK_TIERS[cell.i], x = cell.x, y = cell.y, w = cell.w, ix = x + 22;
            // 칸 테두리
            c.strokeStyle = 'rgba(255,255,255,0.22)'; c.lineWidth = 2;
            c.beginPath(); c.roundRect(x, y, w, cell.h, 14); c.stroke();

            // 제목: 번호. 이름 [체력]
            const hpLabel = T.hp === Infinity ? '파괴 불가' : `${T.hp}타`;
            c.textAlign = 'left'; c.textBaseline = 'top';
            c.fillStyle = '#eee'; c.font = font(`bold ${BP.titlePx}px`);
            c.fillText(`${cell.i + 1}. ${T.name}`, ix, y + BP.titleY);
            c.fillStyle = T.laserProof ? '#fff' : '#aaa'; c.font = font(`bold ${BP.descPx}px`);
            c.fillText(`[${hpLabel}${T.laserProof ? ' · 레이저 무효' : ''}]`, ix, y + BP.hpY);

            // 설명 ('1타 파괴 - ...' 에서 앞부분은 제목과 겹치므로 '-' 뒤만)
            const desc = T.desc.includes(' - ') ? T.desc.split(' - ').slice(1).join(' - ') : T.desc;
            c.fillStyle = '#999'; c.font = font(`${BP.descPx}px`);
            wrapText(c, desc, w - 44).slice(0, 2).forEach((line, k) => c.fillText(line, ix, y + BP.descY + k * BP.descLine));

            // 벽돌 2개: 새 벽돌 / 마지막 1타 남음 (파괴 불가는 1개만)
            const by = y + BP.brickY, two = T.hp !== Infinity && T.hp > 1;
            const bx1 = two ? x + w / 2 - L.bw - 10 : x + w / 2 - L.bw / 2, bx2 = x + w / 2 + 10;
            drawTierBrick(c, bx1, by, L.bw, L.bh, cell.i, 0, f);
            if (two) drawTierBrick(c, bx2, by, L.bw, L.bh, cell.i, T.hp - 1, f);
            c.fillStyle = '#777'; c.font = font(`${BP.labelPx}px`); c.textAlign = 'center';
            if (two) {
                c.fillText('새 벽돌', bx1 + L.bw / 2, by + L.bh + 8);
                c.fillText('1타 남음', bx2 + L.bw / 2, by + L.bh + 8);
            } else {
                c.fillText(T.hp === Infinity ? '공이 튕겨 나감' : '1타에 파괴', bx1 + L.bw / 2, by + L.bh + 8);
            }
        });
    }

    function drawItemPreview() {
        const cv = document.getElementById('dev-item-canvas');
        if (!cv) return;
        const c = cv.getContext('2d');
        const f = Math.floor(performance.now() / SAND_INTERVAL) % SAND_FRAMES;

        c.fillStyle = '#000';
        c.fillRect(0, 0, cv.width, cv.height);

        // 실제 크기 85x42, 프리뷰에서는 1.8배로 보여줌
        const itemW = 85 * 1.8;
        const itemH = 42 * 1.8;
        const spacing = cv.width / ITEM_TYPES.length;

        ITEM_TYPES.forEach((item, i) => {
            const x = spacing * (i + 0.5) - itemW / 2;
            const y = cv.height * 0.4 - itemH / 2;

            scatterDots(c, x, y, itemW, itemH, {
                seed: 8100 + i, frame: f, spacing: 2.5 * 1.8, density: 0.95, lum: item.color,
                mask: (nx, ny) => {
                    const cx = Math.max(0.25, Math.min(0.75, nx));
                    return Math.hypot((nx - cx) * 2, ny - 0.5) <= 0.5;
                }
            });
            strokeDotRect(c, x, y, itemW, itemH, itemH / 2, { seed: 8150 + i, frame: f, lum: 255, density: 0.95, spacing: 2.0 * 1.8 });
            scatterDots(c, x + itemW/2 - 1.5, y, 3, itemH, { seed: 8160 + i, frame: f, density: 1, lum: 0 });

            c.fillStyle = '#000';
            c.font = font('bold ' + Math.floor(30 * 1.8) + 'px');
            c.textAlign = 'center'; c.textBaseline = 'middle';
            c.fillText(item.type, x + itemW/2, y + itemH/2 + 2 * 1.8);

            // 라벨
            c.fillStyle = '#aaa';
            c.font = font('24px');
            c.fillText(`${item.type} : ${item.desc}`, x + itemW/2, y + itemH + 60);
        });
    }

    // ===== 개발자 모드: 상점 카드 예시 (10종) =====
    // 카드 = 둥근 사각 테두리 + 상단 아이콘(도트) + 이름 + 단계 표시 + 설명
    const SHOP_CARDS = [
        { id: 'pierce',  name: '돌파',      cat: '공격', max: 1, desc: ['약한 블럭은', '튕기지 않고 관통'] },
        { id: 'size',    name: '크기 증가', cat: '방어', max: 5, desc: ['패들이', '더 길어진다'] },
        { id: 'laser',   name: '레이저',    cat: '공격', max: 5, desc: ['패들에서', '레이저 발사'] },
        { id: 'clone',   name: '볼 복제',   cat: '공격', max: 5, desc: ['패들에 튕길 때', '확률로 볼 추가'] },
        { id: 'power',   name: '파워',      cat: '공격', max: 4, desc: ['볼 파워', '+1'] },
        { id: 'shield',  name: '보호막',    cat: '방어', max: 5, desc: ['패들 아래 블럭이', '공을 막아 준다'] },
        { id: 'life',    name: '여분 패들', cat: '방어', max: 0, desc: ['목숨', '+1'] },

        { id: 'interest',name: '이자',      cat: '돈',   max: 1, desc: ['스테이지 종료 시', '보유 돈 +10%'] },
        { id: 'shard',   name: '파편',      cat: '공격', max: 1, desc: ['깨질 때 좌우', '블럭에 데미지'] },
        { id: 'aim',     name: '조준',      cat: '공격', max: 1, desc: ['블럭 5개 이하면', '남은 블럭 조준'] }
    ];

    // 아이콘 영역(cx, cy 중심, s = 한 변)에 카드별 그림을 도트로 그림
    function drawCardIcon(c, id, cx, cy, s, f) {
        const L = 235;
        const dot = (x, y, w, h, o = {}) => scatterDots(c, x, y, w, h, Object.assign({ seed: 9100 + (x|0) + (y|0), frame: f, spacing: 2.2, jitter: 0.35, density: 0.95, lum: L }, o));
        const disc = (x, y, r, o = {}) => dot(x - r, y - r, r * 2, r * 2, Object.assign({ mask: (nx, ny) => Math.hypot(nx - 0.5, ny - 0.5) <= 0.5 }, o));
        const miniPaddle = (x, y, w, h) => {
            dot(x, y, w, h, { mask: (nx, ny) => { const r = h / w / 2; const px = Math.min(Math.max(nx, r), 1 - r); return Math.hypot((nx - px) * w / h, ny - 0.5) <= 0.5; }, lum: (nx, ny) => metalLum(ny) });
        };
        const brick = (x, y, w, h, lum = 200) => { dot(x, y, w, h, { density: 0.85, lum }); strokeDotRect(c, x, y, w, h, 3, { seed: 9200 + (x|0), frame: f, lum: 255, density: 0.95, spacing: 2 }); };
        const h = s / 2;

        switch (id) {
            case 'pierce': {    // 가운데 블럭을 깨고 뚫고 지나가는 공
                const bw = h * 0.58, bh = h * 0.36, by = cy - bh / 2 + h * 0.05;
                // 양옆 멀쩡한 블럭
                brick(cx - bw * 1.5 - 4, by, bw, bh, 170);
                brick(cx + bw * 0.5 + 4, by, bw, bh, 170);
                // 가운데 블럭: 깨진 조각 4개가 바깥으로 튕겨나감
                [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sy], k) => {
                    const px = cx + sx * bw * 0.34 - bw * 0.2, py = by + sy * bh * 0.55 + bh * 0.25 - bh * 0.2;
                    dot(px, py, bw * 0.4, bh * 0.4, { density: 0.9, lum: 185, seed: 9500 + k });
                });
                // 뚫린 자리 모래 파편
                for (let k = 0; k < 16; k++) {
                    const a = k * 2.4, r = h * (0.1 + (k % 4) * 0.06);
                    disc(cx + Math.cos(a) * r * 1.4, by + bh / 2 + Math.sin(a) * r * 0.8, 1.8, { lum: 220 - (k % 4) * 30, density: 1 });
                }
                // 아래에서 올라오는 궤적 + 블럭 위로 빠져나간 공
                for (let i = 0; i < 6; i++) disc(cx, cy + h * 0.9 - i * h * 0.12, 2.5 + i * 0.5, { lum: 70 + i * 25, density: 0.75 });
                disc(cx, cy - h * 0.62, h * 0.2, { lum: (nx, ny) => 255 - Math.hypot(nx - 0.35, ny - 0.35) * 160 });
                // 공 뒤로 속도선
                [-1, 1].forEach(d => dot(cx + d * h * 0.1 - 1, cy - h * 0.38, 2.5, h * 0.22, { lum: 200, density: 1, spacing: 1.5 }));
                break;
            }
            case 'size': {      // 짧은 패들 → 긴 패들, 양쪽 화살표
                miniPaddle(cx - h * 0.35, cy - h * 0.5, h * 0.7, h * 0.18);
                miniPaddle(cx - h * 0.9, cy + h * 0.25, h * 1.8, h * 0.18);
                [-1, 1].forEach(d => {
                    const ax = cx + d * h * 0.55;
                    dot(ax - (d > 0 ? 0 : h * 0.3), cy - h * 0.12, h * 0.3, 3, { lum: 255, density: 1, spacing: 1.5 });
                    for (let k = 0; k < 5; k++) dot(ax + d * h * 0.3 - d * k * 2.2, cy - h * 0.12 - k * 2.2, 2, 2 + k * 4.4, { lum: 255, density: 1, spacing: 1.5 });
                });
                break;
            }
            case 'laser': {     // 패들 위로 솟는 레이저 3줄
                miniPaddle(cx - h * 0.8, cy + h * 0.55, h * 1.6, h * 0.2);
                [-0.45, 0, 0.45].forEach((t, i) => dot(cx + t * h - 2, cy - h * 0.9, 4, h * 1.35, { lum: (nx, ny) => 255 - ny * 90, density: 1, spacing: 1.6 }));
                break;
            }
            case 'clone': {     // 공 하나가 둘로 갈라짐
                disc(cx, cy + h * 0.5, h * 0.2);
                disc(cx - h * 0.5, cy - h * 0.45, h * 0.2);
                disc(cx + h * 0.5, cy - h * 0.45, h * 0.2);
                [-1, 1].forEach(d => { for (let k = 0; k < 6; k++) disc(cx + d * h * 0.08 * k, cy + h * 0.25 - k * h * 0.11, 2.2, { lum: 170, density: 0.9 }); });
                break;
            }
            case 'power': {     // 공 + 주변 방사선
                disc(cx, cy, h * 0.3, { lum: (nx, ny) => 255 - Math.hypot(nx - 0.35, ny - 0.35) * 140 });
                for (let k = 0; k < 8; k++) {
                    const a = k * Math.PI / 4, r0 = h * 0.45, r1 = h * 0.8;
                    for (let t = 0; t <= 1; t += 0.2) disc(cx + Math.cos(a) * (r0 + (r1 - r0) * t), cy + Math.sin(a) * (r0 + (r1 - r0) * t), 2.2, { lum: 255 - t * 110, density: 1 });
                }
                break;
            }
            case 'shield': {    // 떨어지는 공 + 바닥 방벽
                disc(cx, cy - h * 0.5, h * 0.18);
                for (let k = 1; k < 5; k++) disc(cx, cy - h * 0.5 - k * h * 0.12, 2, { lum: 200 - k * 35, density: 0.8 });
                dot(cx - h * 0.9, cy + h * 0.35, h * 1.8, h * 0.22, { lum: (nx) => 150 + Math.sin(nx * Math.PI * 6 + f) * 60 + 40, density: 0.95, spacing: 2 });
                dot(cx - h * 0.9, cy + h * 0.33, h * 1.8, 3, { lum: 255, density: 1, spacing: 1.5 });
                break;
            }
            case 'life': {      // 미니 패들 + 큰 '+'
                miniPaddle(cx - h * 0.75, cy + h * 0.45, h * 1.5, h * 0.22);
                dot(cx - h * 0.4, cy - h * 0.4 - 4, h * 0.8, 8, { lum: 255, density: 1, spacing: 1.6 });
                dot(cx - 4, cy - h * 0.8, 8, h * 0.8, { lum: 255, density: 1, spacing: 1.6 });
                break;
            }
            case 'magnet': {    // 말굽 자석 (U자, 입이 위) + 위에서 끌려오는 모래알
                const R = h * 0.62, T = h * 0.3;              // 바깥 반지름, 두께
                const botY = cy + h * 0.7, armTop = cy - h * 0.25;
                const ccx = cx, ccy = botY - R;               // 아치 중심
                // 몸통: 아래쪽 반원 아치 + 위로 올라가는 두 다리
                dot(ccx - R, armTop, R * 2, botY - armTop, {
                    spacing: 2, density: 0.97,
                    mask: (nx, ny) => {
                        const px = ccx - R + nx * R * 2, py = armTop + ny * (botY - armTop);
                        const dx = px - ccx;
                        if (py >= ccy) { const d = Math.hypot(dx, py - ccy); return d <= R && d >= R - T; }
                        return Math.abs(dx) <= R && Math.abs(dx) >= R - T;
                    },
                    lum: (nx, ny) => { const py = armTop + ny * (botY - armTop); return py < armTop + T * 0.9 ? 250 : 125 + (1 - ny) * 50; }
                });
                // 극 끝 경계선 (금속 캡과 몸통 구분)
                [-1, 1].forEach(d => dot(ccx + d * (R - T / 2) - T / 2, armTop + T * 0.9 - 2.5, T, 2.5, { lum: 30, density: 1, spacing: 1.4 }));
                // 극 사이 자기장 호 2줄 (극 위쪽)
                [0.55, 0.85].forEach((k, i) => {
                    for (let t = 0.1; t <= 0.9; t += 0.1) {
                        const a = Math.PI * t;
                        disc(ccx - Math.cos(a) * (R - T / 2), armTop - Math.sin(a) * h * 0.22 * k * 1.6, 1.6, { lum: 150 - i * 40, density: 1 });
                    }
                });
                // 위에서 극 쪽으로 끌려오는 모래알
                for (let k = 0; k < 9; k++) {
                    const t = k / 8, side = k % 2 ? 1 : -1;
                    disc(ccx + side * (R - T / 2) * (0.4 + 0.6 * t), cy - h * 0.95 + t * h * 0.55, 2.2, { lum: 110 + t * 145, density: 1 });
                }
                break;
            }
            case 'interest': {  // 쌓인 모래알 더미 + 위로 '%'
                dot(cx - h * 0.8, cy, h * 1.6, h * 0.8, { mask: (nx, ny) => ny > Math.pow(Math.abs(nx - 0.5) * 2, 1.6) * 0.9, lum: (nx, ny) => 160 + (1 - ny) * 90, density: 0.9, spacing: 2 });
                disc(cx - h * 0.35, cy - h * 0.7, h * 0.12, { density: 1 });
                disc(cx + h * 0.35, cy - h * 0.2, h * 0.12, { density: 1 });
                for (let t = 0; t <= 1; t += 0.08) disc(cx + h * 0.45 - t * h * 0.9, cy - h * 0.85 + t * h * 0.8, 2.2, { lum: 255, density: 1 });
                break;
            }
            case 'aim': {       // 조준경: 원 + 십자선, 가운데 블럭, 아래에서 올라오는 공 궤적
                brick(cx - h * 0.28, cy - h * 0.16, h * 0.56, h * 0.32, 200);
                const R = h * 0.72;
                dot(cx - R, cy - R, R * 2, R * 2, { mask: (nx, ny) => { const d = Math.hypot(nx - 0.5, ny - 0.5); return d <= 0.5 && d >= 0.43; }, lum: 245, spacing: 1.8 });
                [[0, -1], [0, 1], [-1, 0], [1, 0]].forEach(([dx, dy]) => {
                    const x = cx + dx * R * 0.72, y = cy + dy * R * 0.72;
                    if (dx === 0) dot(x - 2, y - R * 0.22, 4, R * 0.44, { lum: 255, density: 1, spacing: 1.4 });
                    else dot(x - R * 0.22, y - 2, R * 0.44, 4, { lum: 255, density: 1, spacing: 1.4 });
                });
                for (let i = 0; i < 6; i++) disc(cx - h * 0.62 + i * h * 0.1, cy + h * 0.95 - i * h * 0.13, 2 + i * 0.35, { lum: 80 + i * 28, density: 0.85 });
                break;
            }
            case 'shard': {     // 폭탄처럼 터지는 모래 폭발 + 양옆 블럭 균열
                const bw = h * 0.42, bh = h * 0.4, by = cy - bh / 2;
                brick(cx - h - 2, by, bw, bh, 160);
                brick(cx + h - bw + 2, by, bw, bh, 160);
                // 양옆 블럭 균열 (폭발 쪽에서 뻗는 지그재그)
                [-1, 1].forEach(d => {
                    let px = cx + d * (h - bw) , py = cy;
                    for (let t = 0; t < 7; t++) {
                        px += d * bw * 0.12; py += (t % 2 ? 1 : -1) * bh * 0.12;
                        c.fillStyle = 'rgb(8,8,8)'; c.fillRect(px - 1.4, py - 1.4, 2.8, 2.8);
                    }
                });
                // 폭발 별 (뾰족한 12각): 중심이 가장 밝고 끝으로 갈수록 어두움
                const spikes = 12, rOut = h * 0.62, rIn = h * 0.3;
                dot(cx - rOut, cy - rOut, rOut * 2, rOut * 2, {
                    spacing: 1.9, density: 0.95,
                    mask: (nx, ny) => {
                        const dx = (nx - 0.5) * 2 * rOut, dy = (ny - 0.5) * 2 * rOut;
                        const a = Math.atan2(dy, dx), d = Math.hypot(dx, dy);
                        const k = Math.abs(((a / (Math.PI * 2 / spikes)) % 1 + 1) % 1 - 0.5) * 2;   // 0 = 뿔 끝, 1 = 골
                        return d <= rIn + (rOut - rIn) * (1 - k);
                    },
                    lum: (nx, ny) => 255 - Math.hypot(nx - 0.5, ny - 0.5) * 2 * 150
                });
                // 중심 섬광 (가장 밝은 코어)
                disc(cx, cy, h * 0.16, { lum: 255, density: 1, spacing: 1.4 });
                // 바깥으로 날아가는 파편 줄기 (끝에 굵은 알갱이)
                for (let k = 0; k < 10; k++) {
                    const a = k * Math.PI * 2 / 10 + 0.3;
                    for (let t = 0; t < 4; t++) {
                        const r = rOut * (1.05 + t * 0.14);
                        disc(cx + Math.cos(a) * r, cy + Math.sin(a) * r * 0.9, 1.4 + (t === 3 ? 1.4 : 0), { lum: 230 - t * 35, density: 1 });
                    }
                }
                break;
            }
        }
    }

    // 카드 1장 그리기. level = 현재 보유 단계 (예시 표시용)
    function drawShopCard(c, x, y, w, hgt, card, level, f, opts = {}) {
        // 카드 배경과 테두리
        c.fillStyle = 'rgb(10,10,10)';
        c.beginPath(); c.roundRect(x, y, w, hgt, 14); c.fill();
        strokeDotRect(c, x, y, w, hgt, 14, { seed: 9300 + x, frame: f, lum: 230, density: 0.95, spacing: 2 });

        // 분류 태그 (좌상단)
        c.font = font('bold 26px');
        c.textAlign = 'left'; c.textBaseline = 'top';
        c.fillStyle = 'rgb(140,140,140)';
        c.fillText(card.cat, x + 14, y + 12);

        // 아이콘 영역
        const iconS = w * 0.56;
        const icx = x + w / 2, icy = y + 48 + iconS / 2;
        strokeDotRect(c, icx - iconS / 2, icy - iconS / 2, iconS, iconS, 8, { seed: 9400 + x, frame: f, lum: 90, density: 0.8, spacing: 2.6 });
        drawCardIcon(c, card.id, icx, icy, iconS * 0.9, f);

        // 이름
        let ty = icy + iconS / 2 + 16;
        c.fillStyle = 'rgb(240,240,240)';
        c.font = font('bold 46px');
        c.textAlign = 'center';
        c.fillText(card.name, x + w / 2, ty);
        ty += 60;

        // 단계 표시: 1~5단계는 칸, 1단계는 '1회', 반복은 '반복'
        if (card.max > 1) {
            const pip = 22, gap = 10, tw = card.max * pip + (card.max - 1) * gap;
            for (let i = 0; i < card.max; i++) {
                const px = x + w / 2 - tw / 2 + i * (pip + gap);
                if (i < level) { c.fillStyle = 'rgb(230,230,230)'; c.fillRect(px, ty, pip, pip); }
                else { c.strokeStyle = 'rgb(110,110,110)'; c.lineWidth = 1.5; c.strokeRect(px + 0.75, ty + 0.75, pip - 1.5, pip - 1.5); }
            }
        } else {
            c.fillStyle = 'rgb(140,140,140)';
            c.font = font('26px');
            c.fillText(opts.owned && card.max !== 1 ? `${level}회 구매` : (card.max === 1 ? '1회 구매' : '반복 구매'), x + w / 2, ty - 1);
        }
        ty += 40;

        // 설명 (2줄)
        c.fillStyle = 'rgb(175,175,175)';
        c.font = font('30px');
        card.desc.forEach((line, i) => c.fillText(line, x + w / 2, ty + i * 40));

        // 가격 자리 (미정)
        if (opts.noPrice) {
            // 가격 표시 없음 (획득 연출용)
        } else if (opts.price == null) {
            c.fillStyle = 'rgb(120,120,120)';
            c.font = font('bold 30px');
            c.fillText('가격 ???', x + w / 2, y + hgt - 46);
        } else {
            c.font = font('bold 36px');
            const pt = String(opts.price), pw = c.measureText(pt).width, px = x + w / 2 - (pw + 40) / 2;
            c.textAlign = 'left';
            c.fillStyle = opts.affordable ? '#fff' : 'rgb(90,90,90)';
            c.fillText(pt, px + 40, y + hgt - 50);
            drawMoneyGem(c, px + 14, y + hgt - 32, 30, performance.now());
            c.textAlign = 'center';
        }
    }

    // ===== 개발자 모드: 돈 모양 후보 (8종) =====
    // 모든 모양은 한 변 size 의 정사각형 안에서 mask(모양)와 lum(밝기)로 정의 -> 도트로 그림
    const MONEY_SHAPES = [
        { id: 'grain',     name: '모래 덩어리', desc: ['울퉁불퉁한', '모래 뭉치'] },
        { id: 'coin',      name: '동전',        desc: ['테두리가 밝은', '둥근 동전'] },
        { id: 'gem',       name: '보석',        desc: ['면마다 밝기가', '다른 마름모'] },
        { id: 'star',      name: '별',          desc: ['뾰족한', '5각 별'] },
        { id: 'hourglass', name: '모래시계',    desc: ['모래가 아래로', '쌓인 모래시계'] },
        { id: 'ingot',     name: '금괴',        desc: ['윗면이 밝은', '사다리꼴 덩어리'] },
        { id: 'sparkle',   name: '반짝이',      desc: ['네 방향으로', '빛나는 별빛'] },
        { id: 'marble',    name: '구슬',        desc: ['하이라이트가 있는', '유리 구슬'] }
    ];

    function moneyShapeDef(id) {
        // x, y: 중심 기준 -0.5 ~ 0.5
        const P = (fn) => (nx, ny) => fn(nx - 0.5, ny - 0.5);
        switch (id) {
            case 'grain': return {
                mask: P((x, y) => { const a = Math.atan2(y, x); return Math.hypot(x, y) <= 0.4 + Math.sin(a * 3 + 0.7) * 0.06 + Math.cos(a * 5) * 0.04; }),
                lum: P((x, y) => 245 - Math.hypot(x + 0.15, y + 0.15) * 230), density: 0.8
            };
            case 'coin': return {
                mask: P((x, y) => Math.hypot(x, y) <= 0.46),
                lum: P((x, y) => { const d = Math.hypot(x, y); if (d > 0.36) return 250; if (Math.abs(x) + Math.abs(y) < 0.16) return 245; return 130 + (-(x + y)) * 120; })
            };
            case 'gem': return {
                mask: P((x, y) => Math.abs(x) / 0.44 + Math.abs(y) / 0.48 <= 1),
                lum: P((x, y) => x < 0 ? (y < 0 ? 252 : 160) : (y < 0 ? 205 : 105))
            };
            case 'star': return {
                mask: P((x, y) => { const a = Math.atan2(y, x) + Math.PI / 2, d = Math.hypot(x, y); const k = Math.abs(((a / (Math.PI * 2 / 5)) % 1 + 1) % 1 - 0.5) * 2; return d <= 0.2 + 0.28 * (1 - k); }),
                lum: P((x, y) => 255 - Math.hypot(x, y) * 260)
            };
            case 'hourglass': return {
                mask: P((x, y) => { if (Math.abs(y) > 0.46) return false; if (Math.abs(y) > 0.38) return Math.abs(x) <= 0.38; return Math.abs(x) <= 0.05 + Math.abs(y) * 0.8; }),
                lum: P((x, y) => { if (Math.abs(y) > 0.38) return 250; if (y > 0.12) return 225; if (y < -0.2 && y > -0.38) return 200; return Math.abs(x) < 0.04 ? 210 : 60; })
            };
            case 'ingot': return {
                mask: P((x, y) => y >= -0.22 && y <= 0.22 && Math.abs(x) <= 0.3 + (y + 0.22) * 0.45),
                lum: P((x, y) => y < -0.1 ? 252 : (x < -0.3 + (y + 0.22) * 0.1 ? 150 : 190 - (y + 0.1) * 150))
            };
            case 'sparkle': return {
                mask: P((x, y) => Math.pow(Math.abs(x) / 0.48, 0.75) + Math.pow(Math.abs(y) / 0.48, 0.75) <= 1),
                lum: P((x, y) => 255 - Math.hypot(x, y) * 200)
            };
            case 'marble': return {
                mask: P((x, y) => Math.hypot(x, y) <= 0.44),
                lum: P((x, y) => { if (Math.hypot(x + 0.14, y + 0.16) < 0.09) return 255; return 215 - Math.hypot(x + 0.1, y + 0.1) * 250 + (Math.hypot(x, y) > 0.38 ? 60 : 0); })
            };
        }
    }

    // size 크기의 돈 모양 1개를 (cx, cy) 중심에 그림. 실제 게임에서도 이 함수를 그대로 쓸 예정
    function drawMoneyShape(c, id, cx, cy, size, f) {
        const d = moneyShapeDef(id);
        scatterDots(c, cx - size / 2, cy - size / 2, size, size, {
            mask: d.mask, lum: d.lum, density: d.density || 0.97,
            spacing: Math.max(1.3, size / 26), size: Math.max(1, size / 34), jitter: 0.3,
            seed: 9700 + id.length * 31, frame: f
        });
    }

    // ===== 확정 돈 모양: 보석 + 반짝임 =====
    // t: ms. 실제 게임에서도 이 함수를 그대로 사용
    const GEM_GLINT_PERIOD = 1400;   // 빛줄기가 보석을 한 번 훑는 주기 (ms)
    const GEM_TWINKLE_PERIOD = 900;  // 별빛이 한 번 반짝이는 주기 (ms)
    function drawMoneyGem(c, cx, cy, size, t, phase = 0) {
        const f = Math.floor(t / SAND_INTERVAL) % SAND_FRAMES;
        const base = moneyShapeDef('gem');
        // 1) 빛줄기: 왼쪽 위 → 오른쪽 아래로 지나가는 밝은 띠. 주기의 앞 45% 동안만 지나가고 나머지는 쉼
        const g = ((t + phase) % GEM_GLINT_PERIOD) / GEM_GLINT_PERIOD;
        const sweep = g < 0.45 ? -0.7 + (g / 0.45) * 1.4 : 9;
        scatterDots(c, cx - size / 2, cy - size / 2, size, size, {
            mask: base.mask,
            lum: (nx, ny) => { const x = nx - 0.5, y = ny - 0.5; return Math.abs((x + y) - sweep) < 0.09 ? 255 : base.lum(nx, ny); },
            density: 0.97, spacing: Math.max(1.3, size / 26), size: Math.max(1, size / 34), jitter: 0.3,
            seed: 9731, frame: f
        });
        // 2) 별빛: 왼쪽 위 꼭짓점 근처에서 커졌다 작아지는 4갈래 빛
        const tw = Math.sin((((t + phase * 1.7) % GEM_TWINKLE_PERIOD) / GEM_TWINKLE_PERIOD) * Math.PI);
        const pulse = Math.pow(Math.max(0, tw), 3);
        if (pulse > 0.05) {
            const r = size * 0.42 * pulse, sx = cx - size * 0.16, sy = cy - size * 0.24;
            scatterDots(c, sx - r, sy - r, r * 2, r * 2, {
                mask: (nx, ny) => Math.pow(Math.abs(nx - 0.5) / 0.5, 0.5) + Math.pow(Math.abs(ny - 0.5) / 0.5, 0.5) <= 1,
                lum: 255, density: 1, spacing: Math.max(1.1, size / 34), size: Math.max(1, size / 30), jitter: 0.15,
                seed: 9741, frame: f
            });
        }
    }

    // 개발자 모드: 선택된 보석 애니메이션 미리보기 (화면이 열려 있는 동안만 동작)
    let gemPreviewRAF = 0;
    function startGemPreview() {
        cancelAnimationFrame(gemPreviewRAF);
        const step = () => {
            const cv = document.getElementById('dev-gem-canvas');
            if (!cv || devDetailScreen.style.display === 'none') { gemPreviewRAF = 0; return; }
            const c = cv.getContext('2d'), t = performance.now();
            c.fillStyle = '#000'; c.fillRect(0, 0, cv.width, cv.height);
            c.textAlign = 'center'; c.textBaseline = 'top';
            c.fillStyle = 'rgb(160,160,160)'; c.font = font('36px');
            c.fillText('확대', 290, 20);
            c.fillText('실제 크기', 820, 20);
            drawMoneyGem(c, 290, 230, 260, t);
            // 실제 크기 40px 4개가 서로 다른 타이밍으로 떨어지며 반짝임
            for (let k = 0; k < 4; k++) {
                const y = 90 + ((t * 0.12 + k * 90) % 320);
                drawMoneyGem(c, 640 + k * 120, y, 40, t, k * 350);
            }
            gemPreviewRAF = requestAnimationFrame(step);
        };
        gemPreviewRAF = requestAnimationFrame(step);
    }

    function drawMoneyPreview() {
        const cv = document.getElementById('dev-money-canvas');
        if (!cv) return;
        const c = cv.getContext('2d');
        const f = Math.floor(performance.now() / SAND_INTERVAL) % SAND_FRAMES;
        const cols = 4, gap = 22, pad = 26;
        const cw = (cv.width - pad * 2 - gap * (cols - 1)) / cols, ch = 430;
        const rows = Math.ceil(MONEY_SHAPES.length / cols);
        cv.height = pad * 2 + rows * ch + (rows - 1) * gap;
        c.fillStyle = '#000'; c.fillRect(0, 0, cv.width, cv.height);

        MONEY_SHAPES.forEach((m, i) => {
            const x = pad + (i % cols) * (cw + gap), y = pad + Math.floor(i / cols) * (ch + gap);
            c.fillStyle = 'rgb(10,10,10)';
            c.beginPath(); c.roundRect(x, y, cw, ch, 12); c.fill();
            strokeDotRect(c, x, y, cw, ch, 12, { seed: 9600 + i, frame: f, lum: 150, density: 0.9, spacing: 2.2 });

            c.textAlign = 'center'; c.textBaseline = 'top';
            c.fillStyle = 'rgb(240,240,240)'; c.font = font('bold 32px');
            c.fillText((i + 1) + '. ' + m.name, x + cw / 2, y + 16);

            // 확대 (4배)
            drawMoneyShape(c, m.id, x + cw / 2, y + 170, 160, f);

            // 실제 크기 (40px) : 떨어지는 모습 3개 + 미니 패들 조각
            c.fillStyle = 'rgb(120,120,120)'; c.font = font('22px');
            c.fillText('실제 크기', x + cw / 2, y + 268);
            [0, 1, 2].forEach(k => drawMoneyShape(c, m.id, x + cw / 2 + (k - 1) * 62, y + 318 + k * 6, 40, (f + k) % SAND_FRAMES));

            c.fillStyle = 'rgb(175,175,175)'; c.font = font('24px');
            m.desc.forEach((line, li) => c.fillText(line, x + cw / 2, y + 358 + li * 30));
        });
    }

    // 개발자 모드 7번 카드 예시 배치: 2열, 카드 기본 크기(343x515)를 확대
    function shopPreviewLayout(canvasW) {
        const cols = 2, gap = 28, pad = 30;
        const cw = (canvasW - pad * 2 - gap * (cols - 1)) / cols, sc = cw / INTRO_CARD_W, ch = INTRO_CARD_H * sc;
        const rows = Math.ceil(SHOP_CARDS.length / cols);
        const cards = SHOP_CARDS.map((_, i) => ({ x: pad + (i % cols) * (cw + gap), y: pad + Math.floor(i / cols) * (ch + gap), w: cw, h: ch }));
        return { cards, sc, height: pad * 2 + rows * ch + (rows - 1) * gap };
    }

    function drawShopPreview() {
        const cv = document.getElementById('dev-shop-canvas');
        if (!cv) return;
        const c = cv.getContext('2d');
        const f = Math.floor(performance.now() / SAND_INTERVAL) % SAND_FRAMES;

        const L = shopPreviewLayout(cv.width);
        cv.height = L.height;

        c.fillStyle = '#000';
        c.fillRect(0, 0, cv.width, cv.height);

        SHOP_CARDS.forEach((card, i) => {
            const r = L.cards[i];
            // 예시로 보유 단계를 카드마다 다르게 채워 보여줌
            const level = card.max > 1 ? (i % card.max) + 1 : 0;
            c.save();
            c.translate(r.x, r.y);
            c.scale(L.sc, L.sc);
            drawShopCard(c, 0, 0, INTRO_CARD_W, INTRO_CARD_H, card, level, f, { price: cardPrice(card.id), affordable: true });
            c.restore();
        });
    }

    function openDevOverlay() {
        devOverlay.classList.add('open');
        devMenuScreen.style.display = 'block';
        devDetailScreen.style.display = 'none';
    }

    devEntry.addEventListener('click', openDevOverlay);
    document.getElementById('dev-close').addEventListener('click', () => devOverlay.classList.remove('open'));
    document.getElementById('dev-back-btn').addEventListener('click', () => {
        devDetailScreen.style.display = 'none';
        devMenuScreen.style.display = 'block';
    });

    function jumpToStage(i) {
        if (lives < 1) lives = START_LIVES;
        introCard = null;
        initGame(i);
        gameState = 'PLAY';
        devOverlay.classList.remove('open');
    }
    devDetailBody.addEventListener('click', e => {
        const t = e.target.closest && e.target.closest('.dev-sv-nav');
        if (!t || t.disabled) return;
        stagePreviewNav(t.dataset.nav);
        devDetailBody.innerHTML = devContent.stageview.body;
        drawStagePreview();
    });
    // 7. 카드 가격 > 카드 상세: 단계별 비용 · 누적 · 효과 (저장된 가격 기준)
    let priceDetailId = null, shopDetailId = null;
    function priceDetailBody(id, backCls = 'dev-price-back') {
        const c = cardById(id), pr = SHOP_PRICES[id], isLife = id === 'life';
        const eff = upgradeEffects(id) || ['없음', c.desc.join(' ') + ' (1회 구매)'];
        const n = isLife ? pr.length : Math.max(1, c.max);
        const td = 'padding:8px 6px; border-bottom:1px solid #2a2a2a; vertical-align:top;';
        let cum = 0, rows = `<tr style="color:#777;"><td style="${td}">${isLife ? '시작' : '기본'}</td><td style="${td} text-align:right;">-</td><td style="${td} text-align:right;">-</td><td style="${td}">${eff[0]}</td></tr>`;
        for (let lv = 1; lv <= n; lv++) {
            const price = pr[Math.min(lv - 1, pr.length - 1)]; cum += price;
            rows += `<tr><td style="${td} white-space:nowrap;">${isLife ? lv + '번째' : lv + '단계'}</td><td style="${td} text-align:right; font-weight:bold;">${price}</td><td style="${td} text-align:right; color:#999;">${cum}</td><td style="${td}">${eff[Math.min(lv, eff.length - 1)]}</td></tr>`;
        }
        return `<div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
<button class="${backCls}" style="padding:6px 12px; font:16px Menlo, monospace; border-radius:6px; cursor:pointer; border:1px solid #666; background:#000; color:#ccc;">◀ 목록</button>
<div style="font:bold 22px Menlo, monospace;">${c.name}</div></div>
${isLife ? '<div style="font-size:13px; color:#888; margin-bottom:6px;">목숨이 최대면 상점에 안 나옴</div>' : ''}
<table style="width:100%; border-collapse:collapse; table-layout:fixed; font-size:15px; line-height:1.4;"><colgroup><col style="width:17%"><col style="width:13%"><col style="width:13%"><col></colgroup>
<tr style="color:#888; font-size:13px;"><td style="${td}">단계</td><td style="${td} text-align:right;">비용</td><td style="${td} text-align:right;">누적</td><td style="${td}">효과</td></tr>${rows}</table>`;
    }
    // 3. 상점 카드: 카드 그림 누르면 상세
    devDetailBody.addEventListener('click', e => {
        const back = e.target.closest && e.target.closest('.dev-shop-back');
        if (back) { shopDetailId = null; devDetailBody.innerHTML = devContent.shop.body; drawShopPreview(); return; }
        const cv = e.target.id === 'dev-shop-canvas' ? e.target : null;
        if (!cv) return;
        const r = cv.getBoundingClientRect(), k = cv.width / r.width;
        const x = (e.clientX - r.left) * k, y = (e.clientY - r.top) * k;
        const L = shopPreviewLayout(cv.width);
        const i = L.cards.findIndex(q => x >= q.x && x <= q.x + q.w && y >= q.y && y <= q.y + q.h);
        if (i < 0) return;
        shopDetailId = SHOP_CARDS[i].id;
        devDetailBody.innerHTML = devContent.shop.body;
    });
    devDetailBody.addEventListener('click', e => {
        const card = e.target.closest && e.target.closest('.dev-price-card');
        const back = e.target.closest && e.target.closest('.dev-price-back');
        if (!card && !back) return;
        priceDetailId = card ? card.dataset.id : null;
        devDetailBody.innerHTML = devContent.price.body;
    });
    // 7. 카드 가격: 입력하면 합계만 바로 갱신, 저장을 눌러야 게임에 반영
    function readPriceInputs() {
        const out = clonePrices(SHOP_PRICES);
        devDetailBody.querySelectorAll('.dev-price-in').forEach(el => {
            const v = Math.max(0, Math.round(Number(el.value) || 0));
            out[el.dataset.id][+el.dataset.i] = v;
        });
        return out;
    }
    devDetailBody.addEventListener('input', e => {
        if (!e.target.classList || !e.target.classList.contains('dev-price-in')) return;
        const P = readPriceInputs(); let total = 0;
        devDetailBody.querySelectorAll('.dev-price-sum').forEach(el => {
            if (el.dataset.id === 'life') return;
            const sum = P[el.dataset.id].reduce((x, y) => x + y, 0); total += sum; el.textContent = sum;
        });
        const t = document.getElementById('dev-price-total'); if (t) t.querySelector('b').textContent = total;
        const m = document.getElementById('dev-price-msg'); if (m) m.textContent = '저장하지 않음';
    });
    devDetailBody.addEventListener('click', e => {
        const b = e.target.closest && e.target.closest('.dev-price-btn');
        if (!b) return;
        if (b.dataset.act === 'save') {
            const P = readPriceInputs();
            for (const k in P) SHOP_PRICES[k] = P[k];
            try { localStorage.setItem(PRICE_KEY, JSON.stringify(SHOP_PRICES)); } catch (err) {}
        } else {
            for (const k in SHOP_PRICES_DEFAULT) SHOP_PRICES[k] = SHOP_PRICES_DEFAULT[k].slice();
            try { localStorage.removeItem(PRICE_KEY); } catch (err) {}
        }
        devDetailBody.innerHTML = devContent.price.body;
        document.getElementById('dev-price-msg').textContent = b.dataset.act === 'save' ? '저장됨' : '기본값으로 되돌림';
    });
    devDetailBody.addEventListener('click', e => {
        const b = e.target.closest && e.target.closest('.dev-stage-jump');
        if (b) jumpToStage(parseInt(b.dataset.stage, 10));
    });

    document.querySelectorAll('.dev-menu-btn[data-cat]').forEach(btn => {
        btn.addEventListener('click', () => {
            const cat = btn.getAttribute('data-cat');
            if (cat === 'stageview') stagePreviewIdx = 0;
            if (cat === 'price') priceDetailId = null;
            if (cat === 'shop') shopDetailId = null;
            const data = devContent[cat];
            devDetailTitle.textContent = data.title;
            devDetailBody.innerHTML = data.body;
            devMenuScreen.style.display = 'none';
            devDetailScreen.style.display = 'block';
            if (cat === 'paddle') drawPaddlePreview();
            if (cat === 'brick') drawBrickPreview();
            if (cat === 'shop') drawShopPreview();
            if (cat === 'stageview') drawStagePreview();
            if (cat === 'money') startGemPreview();
        });
    });
</script>
</body>
</html>
