<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>STIPPLE BREAKOUT</title>
    <style>
        /* iPhone Safari 대응: 폰트는 반드시 실명으로 지정한다.
           generic monospace는 Mac(Menlo)과 iOS(Courier)에서 글자폭이 달라
           같은 문자열이 다른 너비로 렌더링된다. */
        :root {
            --mono: "Menlo", "Monaco", "Courier New", monospace;
        }

        html, body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: var(--mono);
            /* iOS 터치 보정 끄기 - 게임 조작 간섭 방지 */
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            overscroll-behavior: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            /* dvh: iOS Safari 주소창 표시/숨김에 따라 100vh가 변하는 문제 회피.
               미지원 브라우저는 앞의 100vh로 폴백된다. */
            height: 100vh;
            height: 100dvh;
        }

        /* 1170x2080 9:16 비율 유지 및 레터박싱 */
        #game-container {
            position: relative;
            width: 100vmin;
            height: calc(100vmin * 2080 / 1170);
            max-height: 100vh;
            max-height: 100dvh;
            max-width: calc(100vh * 1170 / 2080);
            max-width: calc(100dvh * 1170 / 2080);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        canvas {
            width: 100%;
            height: 100%;
            background: #020202;
            display: block;
            /* iOS에서 캔버스 드래그가 스크롤/새로고침으로 넘어가지 않게 함 */
            touch-action: none;
        }

        /* CRT 스캔라인 오버레이 */
        #game-container::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.18) 50%);
            z-index: 2;
            background-size: 100% 4px;
            pointer-events: none;
        }

        /* 개발자 모드 진입 버튼 (게임 영역 내부 좌측 하단) */
        #dev-entry {
            position: absolute;
            left: 2%;
            bottom: 2%;
            width: 8%;
            height: 4%;
            background: transparent;
            border: none;
            z-index: 10;
            cursor: pointer;
        }

        /* 업그레이드 화면의 저장 코드 입력칸 (게임 좌표 x 80 ~ 1090, y 1582 ~ 1732 에 맞춤) */
        #code-box { display: none; position: absolute; left: 6.84%; width: 86.32%; top: 77.2%; height: 5.6%; z-index: 15; gap: 2%; align-items: stretch; }
        #code-box.open { display: flex; }
        #code-in { flex: 1; min-width: 0; background: #000; color: #fff; border: 2px solid #ddd; border-radius: 1.2vmin; font: bold 2.6vmin var(--mono); font-size: min(2.6vmin, 2.2vh); letter-spacing: 0.15em; text-align: center; text-transform: uppercase; padding: 0 2%; }
        #code-go { width: 24%; background: #eee; color: #000; border: none; border-radius: 1.2vmin; font: bold 2.4vmin var(--mono); font-size: min(2.4vmin, 2vh); }
        #code-msg { position: absolute; left: 0; right: 0; top: 108%; text-align: center; color: #fff; font: bold 2vmin var(--mono); font-size: min(2vmin, 1.6vh); }
        /* 개발자 모드 암호 창 */
        #dev-lock { display: none; position: absolute; inset: 0; z-index: 25; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; font-family: var(--mono); color: #fff; }
        #dev-lock.open { display: flex; }
        #dev-lock-box { width: 70%; max-width: 320px; border: 1px solid #fff; background: #000; padding: 20px; box-sizing: border-box; text-align: center; }
        #dev-pass-in { width: 100%; box-sizing: border-box; padding: 10px; font: bold 26px var(--mono); letter-spacing: 0.5em; text-align: center; background: #111; color: #fff; border: 1px solid #888; border-radius: 6px; }
        #dev-lock-box button { flex: 1; padding: 10px 0; font: bold 16px var(--mono); border-radius: 6px; cursor: pointer; }
        #dev-pass-x { background: #000; color: #ccc; border: 1px solid #666; }
        #dev-pass-go { background: #fff; color: #000; border: none; }
        #dev-pass-msg { min-height: 20px; margin-top: 8px; font-size: 14px; color: #f77; }
        /* 개발자 메뉴 (첫 화면): 한 쪽 10개 · 얇은 버튼 · 작은 쪽 막대 · 위아래 빈 곳 줄임 */
        #dev-overlay.menu { padding: 1.5% 0; }
        #dev-overlay.menu #dev-panel { padding: 3% 4%; }
        #dev-menu-screen h2 { margin-bottom: 6px; }
        #dev-menu-screen .dev-menu-btn { padding: 10px 14px; margin-top: 6px; font-size: 19px; }
        #dev-menu-nav { margin-top: 10px !important; gap: 8px !important; }
        #dev-menu-nav .dev-mn-nav { padding: 3px 0 !important; font-size: 15px !important; }
        #dev-menu-page { font-size: 14px !important; color: #aaa; }
        /* 개발자 상세 화면: 창 높이를 꽉 채움. 내용 칸이 남는 높이를 다 가지고, 쪽 막대는 맨 아래 */
        #dev-overlay.detail { padding: 0; align-items: stretch; overflow: hidden; }
        #dev-overlay.detail #dev-panel { margin: 8px auto; height: calc(100% - 16px); padding: 3% 4%; display: flex; flex-direction: column; }
        #dev-overlay.detail #dev-detail-screen { flex: 1; display: flex !important; flex-direction: column; min-height: 0; }
        #dev-overlay.detail #dev-detail-title { margin-bottom: 8px; }
        #dev-overlay.detail #dev-detail-body { flex: 1; display: flex; flex-direction: column; min-height: 0; }
        #dev-overlay.detail #dev-detail-body > .dev-pager { margin-top: 0 !important; padding-top: 8px; }
        /* 내용이 남는 높이보다 짧으면 세로 가운데 (쪽 막대는 맨 아래 그대로) */
        #dev-overlay.detail #dev-detail-body > :first-child { margin-top: auto !important; }
        #dev-overlay.detail #dev-detail-body > :nth-last-child(1 of :not(.dev-pager)) { margin-bottom: auto !important; }
        #dev-overlay.detail canvas.dev-fill { flex: 1; min-height: 0; width: 100%; object-fit: contain; }
        /* 개발자 모드 오버레이 - 게임 영역(1170x2080) 내부로 제한 */
        #dev-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.95);
            color: #fff;
            font-family: var(--mono);
            z-index: 20;
            justify-content: center;
            align-items: center;
            overflow-y: auto;
            box-sizing: border-box;
            padding: 4% 0;
        }
        #dev-overlay.open { display: flex; }
        #dev-panel {
            width: 92%;
            border: 1px solid #fff;
            padding: 4%;
            box-sizing: border-box;
            margin: auto;
        }
        #dev-panel h2 {
            text-align: center;
            font-size: 28px;
            letter-spacing: 2px;
            margin-top: 0;
        }
        .dev-menu-btn {
            display: block;
            width: 100%;
            box-sizing: border-box;
            background: #000;
            color: #fff;
            border: 1px solid #fff;
            font-family: var(--mono);
            font-size: 22px;
            padding: 16px;
            margin-top: 12px;
            cursor: pointer;
            text-align: left;
        }
        .dev-menu-btn:hover { background: #fff; color: #000; }
        #dev-close {
            margin-top: 10px;
            width: 100%;
            padding: 8px;
            background: #000;
            color: #fff;
            border: 1px solid #fff;
            font-family: var(--mono);
            font-size: 16px;
            cursor: pointer;
        }
        #dev-panel { position: relative; }
        #dev-panel h2 { padding: 0 48px; }
        #dev-panel #dev-back-btn, #dev-close {
            position: absolute; top: 12px; margin: 0;
            width: 40px; height: 40px; padding: 0; font-size: 18px; text-align: center; border-color: #666; color: #ccc;
        }
        #dev-panel #dev-back-btn { left: 12px; }
        #dev-close { right: 12px; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="1170" height="2080"></canvas>
    <button id="dev-entry" aria-label="dev mode"></button>
    <div id="code-box"><input id="code-in" maxlength="19" placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false"><button id="code-go">이동</button><div id="code-msg"></div></div>

    <div id="dev-lock"><div id="dev-lock-box">
        <div style="font-weight:bold; font-size:20px; letter-spacing:2px; margin-bottom:12px;">DEVELOPER MODE</div>
        <input id="dev-pass-in" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="암호 4자리">
        <div style="display:flex; gap:8px; margin-top:10px;"><button id="dev-pass-x">취소</button><button id="dev-pass-go">확인</button></div>
        <div id="dev-pass-msg"></div>
    </div></div>
    <div id="dev-overlay">
        <div id="dev-panel">
            <div id="dev-menu-screen">
                <h2>DEVELOPER MODE</h2>
                <button class="dev-menu-btn" data-cat="stagejump">1. 스테이지 이동</button>
                <button class="dev-menu-btn" data-cat="stageview">2. 스테이지 미리보기</button>
                <button class="dev-menu-btn" data-cat="shop">3. 상점 카드</button>
                <button class="dev-menu-btn" data-cat="brick">4. 블럭</button>
                <button class="dev-menu-btn" data-cat="paddle">5. 패들</button>
                <button class="dev-menu-btn" data-cat="money">6. 보석</button>
                <button class="dev-menu-btn" data-cat="price">7. 카드 가격</button>
                <button class="dev-menu-btn" data-cat="enemy">8. 적 디자인</button>
                <button class="dev-menu-btn" data-cat="prologue">9. 프롤로그</button>
                <button class="dev-menu-btn" data-cat="background">10. 배경</button>
                <button class="dev-menu-btn" data-cat="music">11. 음악</button>
                <button class="dev-menu-btn" data-cat="ending">12. 엔딩</button>
                <div id="dev-menu-nav" style="display:flex; gap:10px; align-items:center; margin-top:14px;">
                    <button class="dev-mn-nav" data-nav="prev" style="flex:1; padding:10px 0; font:bold 24px Menlo, monospace; border-radius:6px; background:#000; color:#fff; border:1px solid #fff; cursor:pointer;">◀</button>
                    <div id="dev-menu-page" style="flex:1; text-align:center; font:bold 22px Menlo, monospace;">1 / 2</div>
                    <button class="dev-mn-nav" data-nav="next" style="flex:1; padding:10px 0; font:bold 24px Menlo, monospace; border-radius:6px; background:#000; color:#fff; border:1px solid #fff; cursor:pointer;">▶</button>
                </div>
            </div>
            <div id="dev-detail-screen" style="display:none;">
                <h2 id="dev-detail-title"></h2>
                <div id="dev-detail-body" style="font-size:20px; line-height:1.6; min-height:80px;"></div>
                <button class="dev-menu-btn" id="dev-back-btn" aria-label="back">◀</button>
            </div>
            <button id="dev-close" aria-label="close">✕</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // 게임 내부 논리 해상도 (고정)
    const LOGIC_WIDTH = 1170;
    const LOGIC_HEIGHT = 2080;

    // 충격 흡수 상태 (initGame 이 시작할 때 쓰므로 앞쪽에 둠)
    const ABSORB_RECHARGE_MS = 30000;
    let absorbCharge = 0, absorbTimer = 0, paddleStun = 0, absorbFlash = 0;
    function absorbMax() { return cardLevel('absorb'); }
    let gameState = 'START'; // START, PLAY, GAME_OVER, CLEAR
    let stageJinglePending = false;              // 새 스테이지가 시작되면 스테이지 시작음 (음악 감독이 처리)
    let DOT_LUM_MUL = 1;                         // 모래 점 밝기 배율 (적 그릴 때만 올림)
    const ENEMY_LUM_MUL = 1.5, MISSILE_LUM_MUL = 1.15;

    // 캔버스 폰트 스택 - CSS와 동일하게 실명 지정.
    // generic monospace는 macOS와 iOS에서 서로 다른 폰트로 해석되어
    // 글자폭이 달라지므로 절대 단독 사용하지 않는다.
    const MONO = '"Menlo", "Monaco", "Courier New", monospace';
    const font = (spec) => `${spec} ${MONO}`;

    // 고정 타임스텝 - 60Hz 기준. iPhone ProMotion(120Hz)에서도 같은 속도 보장
    const STEP_MS = 1000 / 60;
    let lastTime = 0;
    let accumulator = 0;

    // ===== 샌드아트 도트 렌더링 공통 파라미터 =====
    const DOT_SPACING = 3.4;     // 도트 간격. 작을수록 촘촘한 모래알
    const DOT_SIZE = 1.5;        // 도트 지름. 네모 느낌 없애려고 아주 작게
    const DOT_JITTER = 1.25;     // 도트 위치 흔들림. 격자 느낌 제거용
    const SAND_INTERVAL = 110;   // ms. 모래알이 다시 자리잡는 주기
    const SAND_FRAMES = 6;       // 미리 만들어 두는 모래 배치 프레임 수

    // 결정론적 해시 - 같은 입력이면 항상 같은 값
    function hash3(a, b, c) {
        let h = (a * 73856093) ^ (b * 19349663) ^ (c * 83492791);
        h = (h ^ (h >>> 13)) * 1274126177;
        return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
    }

    // 임의 컨텍스트에 도트를 흩뿌린다. 샌드아트 렌더링의 핵심 단 하나의 함수.
    //  density: 0~1, 도트가 찍힐 확률 (밀도)
    //  lum: 0~255 또는 (nx, ny) => 0~255 함수
    //  mask: (nx, ny) => bool, 도형 내부 판정. 생략하면 사각형 전체
    function scatterDotsColor(c, x, y, w, h, opts) {
        const {
            density = 1, lum = 255, mask = null, seed = 0, frame = 0,
            spacing = DOT_SPACING, size = DOT_SIZE, jitter = DOT_JITTER,
            r = 255, g = 255, b = 255
        } = opts;

        const cols = Math.max(1, Math.round(w / spacing));
        const rows = Math.max(1, Math.round(h / spacing));
        const stepX = w / cols;
        const stepY = h / rows;
        const isLumFn = (typeof lum === 'function');
        const half = size / 2;

        for (let gr = 0; gr < rows; gr++) {
            for (let gc = 0; gc < cols; gc++) {
                const nx = (gc + 0.5) / cols;
                const ny = (gr + 0.5) / rows;
                if (mask && !mask(nx, ny)) continue;

                const r1 = hash3(seed + gc * 31 + gr * 17, gr, frame);
                const localDensity = (typeof density === 'function') ? density(nx, ny) : density;
                if (r1 > localDensity) continue;

                const r2 = hash3(seed + 911, gc * 7 + gr, frame);
                const r3 = hash3(seed + 1777, gr * 13 + gc, frame);

                const dx = x + stepX * (gc + 0.5) + (r2 - 0.5) * jitter * 2;
                const dy = y + stepY * (gr + 0.5) + (r3 - 0.5) * jitter * 2;

                let L = isLumFn ? lum(nx, ny) : lum;
                L = Math.max(0, Math.min(255, L * (0.75 + r2 * 0.35) * DOT_LUM_MUL));
                const fR = Math.min(255, Math.round((L / 255) * r));
                const fG = Math.min(255, Math.round((L / 255) * g));
                const fB = Math.min(255, Math.round((L / 255) * b));

                c.fillStyle = `rgb(${fR},${fG},${fB})`;
                c.fillRect(dx - half, dy - half, size, size);
            }
        }
    }

    function scatterDots(c, x, y, w, h, opts) {
        const {
            density = 1,
            lum = 255,
            mask = null,
            seed = 0,
            frame = 0,
            spacing = DOT_SPACING,
            size = DOT_SIZE,
            jitter = DOT_JITTER
        } = opts;

        const cols = Math.max(1, Math.round(w / spacing));
        const rows = Math.max(1, Math.round(h / spacing));
        const stepX = w / cols;
        const stepY = h / rows;
        const isLumFn = (typeof lum === 'function');
        const half = size / 2;

        for (let gr = 0; gr < rows; gr++) {
            for (let gc = 0; gc < cols; gc++) {
                // 정규화 좌표 - 명암/마스크 계산에 사용
                const nx = (gc + 0.5) / cols;
                const ny = (gr + 0.5) / rows;

                if (mask && !mask(nx, ny)) continue;

                const r1 = hash3(seed + gc * 31 + gr * 17, gr, frame);
                const localDensity = (typeof density === 'function') ? density(nx, ny) : density;
                if (r1 > localDensity) continue;

                const r2 = hash3(seed + 911, gc * 7 + gr, frame);
                const r3 = hash3(seed + 1777, gr * 13 + gc, frame);

                // 격자에서 살짝 벗어나게 흔들어 모래알처럼 보이게 함
                const dx = x + stepX * (gc + 0.5) + (r2 - 0.5) * jitter * 2;
                const dy = y + stepY * (gr + 0.5) + (r3 - 0.5) * jitter * 2;

                let L = isLumFn ? lum(nx, ny) : lum;
                // 알알이 밝기를 조금씩 다르게 해서 모래 질감을 살림
                L = Math.max(0, Math.min(255, L * (0.75 + r2 * 0.35) * DOT_LUM_MUL));

                c.fillStyle = `rgb(${L|0},${L|0},${L|0})`;
                c.fillRect(dx - half, dy - half, size, size);
            }
        }
    }

    // ===== 입력 =====
    let keys = {};
    window.addEventListener('keydown', e => { keys[e.code] = true; unlockAudio(); });
    window.addEventListener('keyup', e => keys[e.code] = false);
    // 치트키 V: 깰 수 있는 블럭을 모두 깸 (게임 중에만, 보스전 제외) -> 평소처럼 클리어
    window.addEventListener('keydown', e => { if (e.code === 'KeyV' && !e.repeat) cheatClearStage(); });

    function handleMove(clientX) {
        const rect = canvas.getBoundingClientRect();
        // 캔버스는 CSS로 축소 표시되므로 논리 좌표로 환산해야 한다.
        // iPhone에서는 rect.width가 논리 해상도(1170)와 크게 다르다.
        const scaleX = LOGIC_WIDTH / rect.width;
        const newX = (clientX - rect.left) * scaleX - paddle.width / 2;
        // 바로 이동하지 않고 목표만 정함. update()에서 부드럽게 따라가 약간의 관성이 생김
        paddle.targetX = Math.max(0, Math.min(newX, LOGIC_WIDTH - paddle.width));
    }

    // touchstart도 처리해야 첫 터치에 패들이 즉시 반응한다.
    const inTopHud = clientY => { const r = canvas.getBoundingClientRect(); return (clientY - r.top) * LOGIC_HEIGHT / r.height < HUD_TOP_H; };
    canvas.addEventListener('touchstart', e => {
        e.preventDefault();
        if (inTopHud(e.touches[0].clientY)) return;
        handleMove(e.touches[0].clientX);
    }, { passive: false });

    canvas.addEventListener('touchmove', e => {
        e.preventDefault();
        handleMove(e.touches[0].clientX);
    }, { passive: false });

    canvas.addEventListener('mousemove', e => { if (!inTopHud(e.clientY)) handleMove(e.clientX); });

    // iOS는 더블탭 확대와 핀치 줌을 문서 레벨에서 시도하므로 차단한다.
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('dblclick', e => e.preventDefault());

    // ===== 조작감 튜닝 (Pretext Breaker에서 흡수) =====
    const PADDLE_FOLLOW = 16;              // 패들이 목표를 따라가는 속도 (초당 계수)
    const PADDLE_HIT_MARGIN = 2;           // 패들 좌우 판정 여유 (px)
    const PADDLE_MIN_OFFSET = 0.18;        // 정중앙 반사 방지 - 최소 기울기
    const PADDLE_MAX_ANGLE = 65 * Math.PI / 180;   // 최대 반사 각도
    const BALL_LAUNCH_DELAY_MS = 1000;             // 스테이지 시작 · 이어 하기 때 공이 멈춰 있는 시간 (V4.49.0)

            if (h.life <= 0) dustHoles.splice(i, 1);
        }
        if (gameState !== 'PLAY') { wakeX = wakeY = null; return; }
        if (balls.length > 0) {
            const primary = balls[0];
            if (wakeX === null) { wakeX = primary.x; wakeY = primary.y; return; }
            const dx = primary.x - wakeX, dy = primary.y - wakeY;
            if (dx * dx + dy * dy >= WAKE_SPACING * WAKE_SPACING) {

                dustHoles.push({ x: primary.x, y: primary.y, r: WAKE_HOLE_R, life: WAKE_LIFE, max: WAKE_LIFE });

        if (rx <= -r || rx >= r || ry <= -r || ry >= r) return false;
        const d2 = rx * rx + ry * ry;
        if (d2 >= r * r) return false;

        if (type === 1) {

            pushOut.y = cy + (hash3(888, i, 0)-0.5)*10;
            return true;
        }

        let d = Math.sqrt(d2), ux, uy;
        if (d > 0.01) { ux = rx / d; uy = ry / d; }
        else { ux = (i & 1) ? 1 : -1; uy = 0; }      // 정중앙이면 좌우로 나눠 보냄
        pushOut.x = cx + ux * r;
        pushOut.y = cy + uy * r;
        return true;
    }

    function updateDust() {

        for (let i = 0; i < DUST_COUNT; i++) {

            let nhx = hx[i] + bx[i] + Math.sin(t + ph[i]) * 0.06;

            if (nhx < 0)             { nhx += LOGIC_WIDTH;  x[i] += LOGIC_WIDTH; }
            else if (nhx >= LOGIC_WIDTH)  { nhx -= LOGIC_WIDTH;  x[i] -= LOGIC_WIDTH; }
            if (nhy < 0)             { nhy += LOGIC_HEIGHT; y[i] += LOGIC_HEIGHT; }
            else if (nhy >= LOGIC_HEIGHT) { nhy -= LOGIC_HEIGHT; y[i] -= LOGIC_HEIGHT; }
            hx[i] = nhx; hy[i] = nhy;

                }

            y[i] += (ty - y[i]) * DUST_EASE;
        }
    }

    // 캔버스가 축소 표시되면 1.5px 점은 1px 미만으로 뭉개져 사라진다.
    // 화면 표시 배율을 역산해 실제 화면에서 최소 DUST_MIN_SCREEN_PX 크기가 되도록 보정한다.
    let dustDotSize = 2.6;

        }
    }
    window.addEventListener('resize', updateDustDotSize);

    function drawDust() {
        if (galaxyActive()) { drawField(ctx, getGalaxy(), dustDotSize); drawSparkles(ctx, performance.now()); return; }
        if (blackholeActive()) { drawField(ctx, getBlackhole(), dustDotSize); drawSparkles(ctx, performance.now(), BH_SPARKS); return; }
        { const F = insideField(); if (F) { drawField(ctx, F, dustDotSize); (currentStage <= IN_A_LAST ? drawFleshLive : drawIrisLive)(ctx, performance.now()); return; } }
        const s = dustDotSize, half = s / 2;
        const { x, y } = dust;
        for (let b = 0; b < DUST_BUCKETS; b++) {
            const L = DUST_LUM[b];
            ctx.fillStyle = `rgb(${L},${L},${L})`;
            for (let i = b; i < DUST_COUNT; i += DUST_BUCKETS) {

    }

    // ===== 배경 점 무리 (공용): 1세션 = 모래 먼지, 2세션 (9~16스테이지) = 점묘 은하, 3세션 (17~24스테이지) = 블랙홀 =====
    // 점마다 원래 자리(home)가 있고, 공 · 공의 흔적 · 깨진 벽돌 구멍이 덮으면 가장자리로 밀려났다가 돌아옴 (1세션 먼지와 같은 방식)
    const GAL_LUM = [34, 52, 74, 98, 126, 160];        // 은하 밝기 6단계 (벽돌 150~250 보다 어둡게)
    const GAL_FIRST = 8, GAL_LAST = 15;                // 은하 배경을 쓰는 스테이지 (0부터 센 번호 = 9~16스테이지)
    const galaxyActive = () => currentStage >= GAL_FIRST && currentStage <= GAL_LAST && gameState !== 'START' && gameState !== 'PROLOGUE';
    const BH_FIRST = 16, BH_LAST = 23;                 // 블랙홀 배경을 쓰는 스테이지 (0부터 센 번호 = 17~24스테이지)
    const blackholeActive = () => currentStage >= BH_FIRST && currentStage <= BH_LAST && gameState !== 'START' && gameState !== 'PROLOGUE';
    function galRng(seed) { let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
    // pts: [x, y, 밝기 단계]. drift = 1세션 먼지처럼 원래 자리가 천천히 떠다님
    function makeField(pts, lum, drift) {
        const n = pts.length, F = { n, lum, drift, x: new Float32Array(n), y: new Float32Array(n), hx: new Float32Array(n), hy: new Float32Array(n), idx: lum.map(() => []) };
        pts.forEach(([x, y, b], i) => { F.x[i] = F.hx[i] = x; F.y[i] = F.hy[i] = y; F.idx[b].push(i); });
        F.idx = F.idx.map(a => Int32Array.from(a));
        if (drift) {
            F.bx = new Float32Array(n); F.by = new Float32Array(n); F.ph = new Float32Array(n);
            for (let i = 0; i < n; i++) { F.bx[i] = (Math.random() - 0.5) * 0.12; F.by[i] = (Math.random() - 0.5) * 0.12; F.ph[i] = Math.random() * 6.283; }
        }
        return F;
    }
    // 참고 그림: 화면 가운데를 비스듬히 가로지르는 큰 나선 은하 + 작은 은하 2개 + 모서리 성운 + 흩어진 별
    function buildGalaxyPoints() {
        const R = galRng(20261009), g = () => { let u = 0; while (!u) u = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.2832 * R()); };
        const pts = [], put = (x, y, L) => { if (x >= -10 && x <= LOGIC_WIDTH + 10 && y >= -10 && y <= LOGIC_HEIGHT + 10) pts.push([x, y, Math.max(0, Math.min(5, L | 0))]); };
        const spiral = (cx, cy, size, tilt, flat, nArm, nCore, nHaze, bright) => {
            const ct = Math.cos(tilt), st = Math.sin(tilt);
            const place = (u, v, L) => { const vv = v * flat; put(cx + u * ct - vv * st, cy + u * st + vv * ct, L); };
            for (let i = 0; i < nCore; i++) { const r = Math.abs(g()) * size * 0.05, a = R() * 6.2832; place(Math.cos(a) * r, Math.sin(a) * r, bright + 1.6 - r / (size * 0.05)); }
            for (let arm = 0; arm < 2; arm++) for (let i = 0; i < nArm; i++) {
                const t = Math.pow(R(), 0.85), r = size * (0.04 + 0.96 * t);
                const a = arm * Math.PI + 2.4 * Math.log(r / (size * 0.04)) + g() * 0.07;
                const rr = r + g() * (0.03 + 0.07 * t) * size;
                place(Math.cos(a) * rr, Math.sin(a) * rr, bright - t * 2.6 + R() * 1.2 + (R() < 0.07 ? 1.6 : 0));   // 가끔 밝은 덩어리 (별 무리)
            }
            for (let i = 0; i < nHaze; i++) { const r = size * Math.min(1, -Math.log(1 - R() * 0.98) * 0.3), a = R() * 6.2832; place(Math.cos(a) * r, Math.sin(a) * r, bright - 3.2 - r / size * 1.2 + R()); }
        };
        spiral(600, 1010, 820, -0.62, 0.45, 1000, 240, 450, 4.2);
        spiral(1065, 1250, 60, -0.5, 0.6, 55, 25, 20, 3.4);
        spiral(165, 1720, 75, -0.4, 0.55, 65, 30, 25, 3.4);
        const wisp = (x0, y0, x1, y1, bx, by, n, wd) => { for (let i = 0; i < n; i++) {
            const t = R(), mx = (x0 + x1) / 2 + bx, my = (y0 + y1) / 2 + by;
            put((1 - t) * (1 - t) * x0 + 2 * (1 - t) * t * mx + t * t * x1 + g() * wd, (1 - t) * (1 - t) * y0 + 2 * (1 - t) * t * my + t * t * y1 + g() * wd, 1 + R() * 1.4); } };
        wisp(-20, 80, 360, 520, -60, 80, 260, 55);        // 왼쪽 위 성운
        wisp(820, 1700, 1190, 2060, 120, -60, 260, 60);   // 오른쪽 아래 성운
        for (let i = 0; i < 650; i++) { const b = R(); put(R() * LOGIC_WIDTH, R() * LOGIC_HEIGHT, b < 0.85 ? R() * 2.2 : 2.5 + R() * 2.5); }   // 흩어진 별
        return pts;
    }
    // 반짝이는 큰 별 (십자 빛): 멀리 있어서 공에 밀리지 않음
    const GAL_SPARKS = (() => { const R = galRng(777); return Array.from({ length: 13 }, () => ({ x: 40 + R() * (LOGIC_WIDTH - 80), y: 120 + R() * (LOGIC_HEIGHT - 240), s: 10 + R() * 18, ph: R() * 6.28 })); })();
    function drawSparkles(c, t, list = GAL_SPARKS) {
        for (const p of list) {
            const k = 0.55 + 0.45 * Math.sin(t * 0.0018 + p.ph), L = 120 + 70 * k, n = Math.round(p.s * (0.6 + 0.4 * k));
            c.fillStyle = `rgb(${L | 0},${L | 0},${L | 0})`; c.fillRect(p.x - 2, p.y - 2, 4, 4);
            for (let i = 3; i <= n; i += 2) {
                const a = (1 - i / (n + 1)) * k, LL = L * a | 0; if (LL < 20) break;
                c.fillStyle = `rgb(${LL},${LL},${LL})`;
                c.fillRect(p.x + i - 1, p.y - 1, 2, 2); c.fillRect(p.x - i - 1, p.y - 1, 2, 2); c.fillRect(p.x - 1, p.y + i - 1, 2, 2); c.fillRect(p.x - 1, p.y - i - 1, 2, 2);
            }
        }
    }
    // ===== 배경 3: 블랙홀 (참고 그림). 배경 2 와 같은 방식: 점 겹침 허용, 밝기 단계 =====
    // 검은 구멍 + 가장자리의 가늘고 밝은 빛의 고리 + 둘레 빛무리 (왼쪽이 더 밝음) + 구멍 앞을 비스듬히 지나는 강착 원반
    // + 블랙홀을 도는 납작한 소용돌이 줄기 + 작은 나선 은하 2개 + 떠다니는 바위 조각 + 모서리 성운 + 흩어진 별
    const BH_LUM = [30, 46, 66, 90, 118, 150, 190];

    const STAGE_CHAR_TIER = { X: 5, a: 6, b: 7, c: 8, p: 9, q: 10, r: 11, u: 12, v: 13, w: 14, k: 15, L: 16, R: 17 };   // 숫자 0~4 는 그대로, 나머지 문자

    const TURRET_A = { S: 80, period: 4000, charge: 700 };   // 벽 감시포: 크기 · 발사 간격 · 조준 고정 후 발사까지 (ms)

    // 벽돌 1개를 그림. hits = 지금까지 맞은 횟수 (균열 표현용)
    const BRICK_BACK = 'rgb(14,14,14)';   // 벽돌 바탕 (배경 점보다 어둡게, 거의 검정)
    function drawTierBrick(c, x, y, w, h, tierIdx, hits, f) {
        const T = BRICK_TIERS[tierIdx];
        if (T.gate) { drawGateBrick(c, x, y, w, h, T, f * SAND_INTERVAL * 3, hits, f); return; }
        if (T.key) { drawKeyBrick(c, x, y, w, h, T, f * SAND_INTERVAL * 3, f); return; }
        if (T.turret) return;   // 포탑은 게임에서 매 프레임 직접 그림 (포신이 돎)
        const inset = 3, vx = x + inset, vy = y + inset, vw = w - inset * 2, vh = h - inset * 2;
        const seed = 7000 + tierIdx * 97;
        // 불투명 바탕: 모래 점 사이로 배경이 비치지 않게 어두운 판을 먼저 깜 (점 색은 그대로)
        if (!T.laserProof) { c.fillStyle = BRICK_BACK; c.beginPath(); c.roundRect(vx, vy, vw, vh, T.hp === Infinity ? 3 : brickRadius); c.fill(); }   // 고무는 원래 단색 판이라 그대로

        if (T.hp === Infinity) {
            // GOLD: 촘촘하고 흔들림이 적은 도트 + 금속 반사 명암. 흑백이지만 금색의 무거운 톤 부여
            scatterDots(c, vx, vy, vw, vh, {
                seed, frame: f, spacing: 1.9, jitter: 0.35, density: T.density,
                lum: (nx, ny) => (metalLum(ny) * 0.4 + 20) * (0.92 + 0.08 * Math.sin(nx * Math.PI))
            });
            // 두꺼운 이중 테두리
            strokeDotRect(c, vx, vy, vw, vh, 3, { seed: seed + 1, frame: f, lum: 255, density: 1, spacing: 1.6 });
            strokeDotRect(c, vx + 3, vy + 3, vw - 6, vh - 6, 2, { seed: seed + 2, frame: f, lum: 70, density: 1, spacing: 1.8 });
            // 네 모서리 리벳 (밝은 머리 + 오른쪽 아래 그림자)
            const r = Math.max(2.2, vh * 0.09);
            [[0.1, 0.24], [0.9, 0.24], [0.1, 0.76], [0.9, 0.76]].forEach(([px, py], k) => {
                const cx = vx + vw * px, cy = vy + vh * py;
                const disc = (nx, ny) => Math.hypot(nx - 0.5, ny - 0.5) <= 0.5;
                scatterDots(c, cx - r + 1, cy - r + 1, r * 2, r * 2, { seed: seed + 10 + k, frame: f, spacing: 1.2, jitter: 0.1, mask: disc, density: 1, lum: 30 });
                scatterDots(c, cx - r, cy - r, r * 2, r * 2, { seed: seed + 20 + k, frame: f, spacing: 1.2, jitter: 0.1, mask: disc, density: 1,
                    lum: (nx, ny) => 255 - Math.hypot(nx - 0.3, ny - 0.3) * 130 });
            });
            return;
        }

        if (T.laserProof) {
            // 고무: 점 없이 단색으로 꽉 채운 민짜. 더 둥근 모서리 + 윗면에 흐린 밝은 선 하나 (무광 입체감)
            const L = T.lum, rr = Math.min(12, vh / 2);
            c.fillStyle = `rgb(${L},${L},${L})`;
            c.beginPath(); c.roundRect(vx, vy, vw, vh, rr); c.fill();
            const hl = Math.min(255, L + 55);
            c.fillStyle = `rgb(${hl},${hl},${hl})`;
            c.beginPath(); c.roundRect(vx + rr, vy + 3, vw - rr * 2, 3, 1.5); c.fill();
        } else {
            // 일반 벽돌: 무늬 홈(pattern=0)에서 밀도와 밝기를 각각 dAmp, lAmp만큼 줄임
            scatterDots(c, vx, vy, vw, vh, {
                seed, frame: f,
                density: (nx, ny) => T.density * (1 - T.dAmp * (1 - T.pattern(nx, ny, vw, vh))),
                lum: (nx, ny) => T.lum * (1 - T.lAmp * (1 - T.pattern(nx, ny, vw, vh))) * (0.88 + (1 - ny) * 0.16)
            });
            strokeDotRect(c, vx, vy, vw, vh, brickRadius, { seed: seed + 1, frame: f, lum: 255, density: 0.9 });
        }

        // 남은 체력 표시 - 아래쪽 작은 점 눈금 (남은 타격 수만큼)
        const left = T.hp - hits;
        if (T.hp > 1) {
            const pip = 3.2, gap = 5, total = T.hp * pip + (T.hp - 1) * gap;
            for (let p = 0; p < T.hp; p++) {
                const px = vx + vw / 2 - total / 2 + p * (pip + gap), py = vy + vh - pip - 3;
                scatterDots(c, px, py, pip, pip, { seed: seed + 40 + p, frame: f, spacing: 1.1, jitter: 0.1, density: 1, lum: p < left ? 255 : 55 });
            }
        }

        // 맞은 횟수만큼 균열 - 중앙에서 뻗는 지그재그 도트 선
        for (let k = 0; k < hits; k++) {
            const ang = (k * 2.39996) + tierIdx;            // 황금각으로 겹치지 않게 분산
            const len = Math.min(vw, vh * 2.4) * (0.32 + 0.1 * k);
            let px = vx + vw / 2, py = vy + vh / 2;
            const steps = Math.round(len / 2.2);
            for (let s = 0; s < steps; s++) {
                const wob = (hash3(seed + 60 + k, s, 0) - 0.5) * 1.3;
                px += Math.cos(ang + wob) * 2.2;
                py += Math.sin(ang + wob) * 2.2 * 0.55;
                if (px < vx + 2 || px > vx + vw - 2 || py < vy + 2 || py > vy + vh - 2) break;
                c.fillStyle = 'rgb(10,10,10)';
                c.fillRect(px - 1.1, py - 1.1, 2.2, 2.2);
            }
        }

            brickSprites.push(states);
        });

    // 라운드 사각 경계를 따라 도트를 촘촘히 배치
    function strokeDotRect(c, x, y, w, h, r, opts) {
        const { seed = 0, frame = 0, lum = 255, density = 1, spacing = 2.4 } = opts;
        const path = [];

        // 라운드 사각형 둘레를 따라 점 좌표를 생성
        const addLine = (x1, y1, x2, y2) => {
            const len = Math.hypot(x2 - x1, y2 - y1);
            const n = Math.max(1, Math.round(len / spacing));
            for (let i = 0; i < n; i++) {
                const t = i / n;
                path.push([x1 + (x2 - x1) * t, y1 + (y2 - y1) * t]);
            }
        };
        const addArc = (cx, cy, a1, a2) => {
            const len = Math.abs(a2 - a1) * r;
            const n = Math.max(1, Math.round(len / spacing));
            for (let i = 0; i <= n; i++) {
                const a = a1 + (a2 - a1) * (i / n);
                path.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
            }
        };

        addLine(x + r, y, x + w - r, y);
        addArc(x + w - r, y + r, -Math.PI / 2, 0);
        addLine(x + w, y + r, x + w, y + h - r);
        addArc(x + w - r, y + h - r, 0, Math.PI / 2);
        addLine(x + w - r, y + h, x + r, y + h);
        addArc(x + r, y + h - r, Math.PI / 2, Math.PI);
        addLine(x, y + h - r, x, y + r);
        addArc(x + r, y + r, Math.PI, Math.PI * 1.5);

        const half = DOT_SIZE / 2;
        path.forEach(([px, py], i) => {
            if (hash3(seed, i, frame) > density) return;
            const j1 = hash3(seed + 7, i, frame) - 0.5;
            const j2 = hash3(seed + 13, i, frame) - 0.5;
            const L = Math.min(255, lum * (0.8 + hash3(seed + 21, i, frame) * 0.3));
            c.fillStyle = `rgb(${L|0},${L|0},${L|0})`;
            c.fillRect(px + j1 * 1.4 - half, py + j2 * 1.4 - half, DOT_SIZE, DOT_SIZE);
        });
    }

        } else ctx.drawImage(sh, boss.x - sh.width / 2, boss.y + B2_DY - sh.height / 2);
        if (boss.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${0.5 * boss.flash})`; ctx.beginPath(); ctx.ellipse(boss.x, boss.y + B2_DY, B2_W, B2_H, 0, 0, Math.PI * 2); ctx.fill(); }
    }

    // ===== 물리 =====
    // 블럭의 한 면에 다른 살아 있는 블럭이 딱 붙어 있으면 true (공이 그 면에 닿을 수 없음)
    function sealedSide(b, side) {
        const E = 1;
        for (const q of bricks) {
            if (q === b || !q.alive) continue;
            if (side === 'left'   && Math.abs(q.x + q.w - b.x) < E && Math.abs(q.y - b.y) < E) return true;
            if (side === 'right'  && Math.abs(b.x + b.w - q.x) < E && Math.abs(q.y - b.y) < E) return true;
            if (side === 'top'    && Math.abs(q.y + q.h - b.y) < E && Math.abs(q.x - b.x) < E) return true;
            if (side === 'bottom' && Math.abs(b.y + b.h - q.y) < E && Math.abs(q.x - b.x) < E) return true;
        }
        return false;
    }
    function checkCollision(b, rect) {
        return b.x + b.radius > rect.x &&
               b.x - b.radius < rect.x + rect.w &&
               b.y + b.radius > rect.y &&
               b.y - b.radius < rect.y + rect.h;
    }

    // 레이저 발사 위치 (C안): 패들이 벽에 가까울수록 발사 위치를 벽 쪽으로 옮김
    //  t: 패들 위치 0 (왼쪽 벽) ~ 1 (오른쪽 벽). k = 부호 유지 제곱 -> 가운데 근처에서는 거의 그대로, 벽에 붙으면 패들 끝에서 발사
    const LASER_EDGE = 4;   // 벽에 붙었을 때 패들 끝에서 안쪽으로 떨어진 거리 (px)
    function laserOrigins(lv) {
        const w = paddle.width, room = LOGIC_WIDTH - w;
        const t = room > 0 ? Math.max(0, Math.min(1, paddle.x / room)) : 0.5;
        const sN = (t - 0.5) * 2, k = Math.sign(sN) * sN * sN;
        if (lv === 1) return [paddle.x + w / 2 + k * (w / 2 - LASER_EDGE)];
        const shift = k * (w * 0.28 - LASER_EDGE);
        return [paddle.x + w * 0.28 + shift, paddle.x + w * 0.72 + shift];
    }

    function movePaddle() {
        updateAbsorb(STEP_MS);
        if (paddleStun > 0) { paddle.targetX = paddle.x; return; }   // 마비 중에는 못 움직임
        if (keys['ArrowLeft']) paddle.targetX -= paddle.speed;
        if (keys['ArrowRight']) paddle.targetX += paddle.speed;
        paddle.targetX = Math.max(0, Math.min(paddle.targetX, LOGIC_WIDTH - paddle.width));
        // 목표 위치를 부드럽게 따라감 (Pretext Breaker: dt x 16)
        paddle.x += (paddle.targetX - paddle.x) * Math.min(1, PADDLE_FOLLOW * STEP_MS / 1000);
    }

    function updateGems(speedMul = 1) {
        // 보석 낙하 및 패들로 받기
        const magLv = cardLevel('magnet'), magMul = MAGNET_MUL[Math.min(magLv, MAGNET_MUL.length - 1)];
        const magR = MAGNET_RANGES[Math.min(magLv, MAGNET_RANGES.length - 1)], magPull = MAGNET_PULL * magMul, pcx = paddle.x + paddle.width / 2;
        for (let i = gems.length - 1; i >= 0; i--) {
            const g = gems[i], r = GEM_SIZE / 2;
            g.y += GEM_FALL_SPEED * speedMul;
            if (magLv > 0) {
                const dx = pcx - g.x;
                if (Math.hypot(dx, paddle.y - g.y) < magR) g.x += Math.sign(dx) * Math.min(Math.abs(dx), magPull * speedMul);
            }
            if (g.y - r > LOGIC_HEIGHT) { if (gameState === 'CLEAR_SEQ') { g.y = LOGIC_HEIGHT + r; continue; } gems.splice(i, 1); continue; }   // 클리어 중에는 버리지 않음 (곧 흡수)
            if (g.y + r > paddle.y && g.y - r < paddle.y + paddle.height &&
                g.x + r > paddle.x && g.x - r < paddle.x + paddle.width) {

                gems.splice(i, 1);

        }
    }

    // 치트키 V: 깰 수 있는 블럭을 모두 깸 (공이 깬 것과 같음: 점수 · 수정 · 파편 · 구멍). 클리어는 다음 업데이트에서 평소처럼
    function cheatClearStage() {

    // ===== 엔딩 (게임 적용 · V4.43.0): 마지막 스테이지 클리어 → 2초 검은 정적 (소리 없음) → 엔딩 A '열린 눈' (16초, 음악) → THE END → 누르면 타이틀 =====

    // 클리어 연출 그리기 (HUD 위에 그림)
    function drawClearSeq() {

        if (titleA > 0) {

            ctx.font = font('bold 84px'); ctx.fillText(`STAGE ${currentStage + 1} CLEAR`, cx, cy - 260);

        const earned = stageGems + clearBonus + clearInterest;

        ctx.font = font('bold 40px');

        const k = clearPhase === 'FLY' ? ease(Math.min(1, clearT / CLEAR_FLY_MS)) : 0;
        const pop = clearPhase === 'SHOW' ? 0.6 + 0.4 * ease(Math.min(1, clearT / 300)) : 1;
        const sc = (1 - k * 0.63) * pop;                  // 120px -> 44px (HUD 보석 크기)
        const x = cx + (tx - cx) * k, y = cy + (ty - cy) * k;

    // ===== 상점 (스테이지 사이) =====
    // 가격은 임시값. 가격 = 기본가 + 단계별 상승 x 현재 보유 단계 (여분 패들은 구매 횟수)
    // 카드 가격: [1단계, 2단계, ...] (1회 구매 카드는 1개). 여분 패들은 구매 횟수별, 끝을 넘으면 마지막 값
    const SHOP_PRICES_DEFAULT = {
        pierce:   [60],
        size:     [10, 15, 20, 25, 30],
        laser:    [20, 45, 70, 95, 120],
        clone:    [25, 45, 65, 90, 100],
        power:    [25, 50, 80, 110],
        shield:   [15, 25, 35, 45, 55],
        life:     [30, 45, 60],
        magnet:   [20, 25, 40],
        interest: [30],
        shard:    [80],
        aim:      [65],
        absorb:   [30, 50, 70],
        abyss:    [0],                                 // 보스2 보상 (팔지 않음)
        save:     [50]                                 // 저장: 살 때마다 50 (여러 번)
    };
    const PRICE_KEY = 'sb_shop_prices';
    // 업그레이드 카드 단계별 효과 (개발자 모드 7번 표시용). [0] = 카드 없음, [1] = 1단계 ...
    function upgradeEffects(id) {
        const pct = v => Math.round(v * 100) + '%';
        const sec = ms => (ms / 1000).toFixed(1) + '초';
        const up = (v, base) => v === base ? '' : ` (+${Math.round((v / base - 1) * 100)}%)`;
        switch (id) {
            case 'size':   return PADDLE_SIZES.map(w => `패들 폭 ${w}px${up(w, PADDLE_SIZES[0])}`);
            case 'laser':  return LASER_INTERVALS.map((ms, lv) => {
                if (!lv) return '레이저 없음';
                const n = lv === 1 ? 1 : 2;
                return `${lv === 1 ? '가운데' : '양쪽'} ${n}발 / ${sec(ms)} · 초당 ${(n * 1000 / ms).toFixed(1)}발`;
            });
            case 'clone':  return CLONE_CHANCE.map((c, lv) => lv ? `패들에 튕길 때 ${pct(c)} 확률로 공 +1 (최대 ${CLONE_MAX_BALLS[lv]}개)` : '분열 없음');
            case 'power':  return Array.from({ length: MAX_BALL_POWER }, (_, lv) =>
                               `볼 파워 ${1 + lv} (한 번에 체력 ${1 + lv}칸)` + (1 + lv === MAX_BALL_POWER ? ' · 최대' : ''));
            case 'shield': return Array.from({ length: 6 }, (_, lv) => lv ? `패들 아래 좌우 끝에 보호 블럭 ${lv * 2}개 (한쪽 ${lv}개) · 한 번 막으면 사라짐 · 스테이지 시작 · 이어 하기 때 다시 채움` : '보호 블럭 없음');
            case 'magnet': return MAGNET_MUL.map((_, lv) => {

            });
            case 'absorb': return [0, 1, 2, 3].map(lv => lv ? `방어력 ${lv} · ${ABSORB_RECHARGE_MS / 1000}초마다 1 충전 · 적 공격 1번에 1 소모하고 마비를 막음` : '충격 흡수 없음');
            case 'life':   return Array.from({ length: MAX_LIVES + 1 }, (_, n) => n ? `목숨 +1 (최대 ${MAX_LIVES})` : `시작 목숨 ${START_LIVES}`);
            case 'save':   return ['저장 안 함', '산 순간의 진행을 16자리 코드로 · 다음 스테이지 (보스전 포함) 부터 다시 시작 · 몇 번이든 살 수 있음'];
        }
        return null;
    }
    const clonePrices = src => Object.fromEntries(Object.entries(src).map(([k, a]) => [k, a.slice()]));
    const SHOP_PRICES = clonePrices(SHOP_PRICES_DEFAULT);
    try {   // 개발자 모드에서 저장한 가격

        if (saved) for (const k in SHOP_PRICES) if (Array.isArray(saved[k]) && saved[k].length === SHOP_PRICES[k].length && saved[k].every(v => Number.isFinite(v) && v >= 0)) SHOP_PRICES[k] = saved[k].slice();
    } catch (e) {}
    const REROLL_BASE = 3, REROLL_STEP = 2;   // 리롤 비용 (임시값): 3, 5, 7...
    const MAX_LIVES = 3;
    const upgrades = {};          // 카드 id -> 보유 단계 (여분 패들은 구매 횟수)
    let lastPurchase = null;      // 직전 상점에서 산 카드 (4단계 흡수 연출용)
    let shopCards = [], shopSel = -1, shopBought = null, shopBoughtLv = 0, shopBoughtPrice = 0, rerollCost = REROLL_BASE;
    let shopOpenT = 0, shopMsg = '', shopMsgT = 0;

    const cardById = id => SHOP_CARDS.find(c => c.id === id);
    const cardLevel = id => upgrades[id] || 0;
    function cardPrice(id) { const a = SHOP_PRICES[id]; return a[Math.min(cardLevel(id), a.length - 1)]; }
    const SAVE_FROM_STAGE = 10;     // 저장 카드: 10스테이지 클리어 뒤 상점부터 (보스 앞 상점 포함)
    const ABSORB_FROM_STAGE = 10;   // 10스테이지 클리어 뒤 상점부터 등장 (그 상점에는 꼭 나옴)
    // ===== 저장 코드: 16자리 (32글자: 헷갈리는 O 0 I 1 뺌), 4자리씩 '-' =====
    // 담는 것: 버전 · 다음 위치 (스테이지 0~31, 보스1 32, 보스2 33, 보스3 34) · 목숨 · 보석 · 점수 (100 단위) · 카드 단계
    // 남는 자리는 검사값 (한 글자만 틀려도 걸러짐)
    const SAVE_ABC = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', SAVE_VER = 2;
    const SAVE_CARDS = ['pierce', 'size', 'laser', 'clone', 'power', 'shield', 'magnet', 'interest', 'shard', 'aim', 'absorb', 'abyss'];
    const SAVE_FIELDS = () => [['ver', 4], ['to', 35], ['lives', MAX_LIVES + 1], ['gems', 4096], ['score', 65536], ...SAVE_CARDS.map(id => [id, cardById(id).max + 1])];
    let saveCode = null, saveTo = null;          // 최근에 산 저장 코드, 그 코드로 가는 곳
    const saveStageLabel = to => to == null ? '' : to === 32 ? '보스1 부터' : to === 33 ? '보스2 부터' : to === 34 ? '보스3 부터' : `${to + 1}스테이지 부터`;
    function saveNextTo() {                      // 상점 다음에 갈 곳 (goNextStage 와 같은 순서)
        if (currentStage === BOSS_AFTER_STAGE && !boss) return 32;
