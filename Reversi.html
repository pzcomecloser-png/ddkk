// 기본 순서: 모든 줄이 동시에, 놓은 칸에서 가까운 칩부터 도미노처럼
function dominoSchedule(f, mo) {
  const maxLen = Math.max(...f.lines.map(L => L.cells.length));
  const gap = Math.min(120, 700 / maxLen);   // 긴 줄일수록 간격을 좁혀 너무 길어지지 않게
  for (const L of f.lines) for (const q of L.cells) q.at = mo.pre + (q.d - 1) * gap;
}

function startFx(m, p) {
  const byDir = {};
  for (const q of m.flips) (byDir[q.dir] = byDir[q.dir] || []).push({ ...q, done: false, landed: false });
  const lines = Object.keys(byDir).map(dir => ({ dir: +dir, cells: byDir[dir].sort((a, b) => a.d - b.d) }));
  const type = motionFor(m.flips.length), mo = MOTIONS[type];
  const f = { type, p, r: m.r, c: m.c, x: chipX(m.c), y: chipY(m.r), lines, cells: {}, start: performance.now(), dropped: false };
  f.cells[m.r * N + m.c] = { placed: true };
  (mo.schedule || dominoSchedule)(f, mo);
  f.cut = IS_CORNER(m.r * N + m.c) ? CUT_MS : 0;   // 모서리를 차지하면 컷씬 뒤에 뒤집기 시작
  f.cutWord = CUT_WORDS[Math.floor(Math.random() * CUT_WORDS.length)];
  f.cnt = 0; f.cntAt = 0;
  let last = 0;
  let end = 0;
  for (const L of lines) for (const q of L.cells) {
    q.mat = q.at; q.at += f.cut; if (q.land != null) q.land += f.cut;   // q.mat = 모션 시간 기준 (컷씬 제외)
    f.cells[q.r * N + q.c] = q; last = Math.max(last, q.at); end = Math.max(end, q.land != null ? q.land : q.at + FLIP_MS);
  }
  f.lastMe = last - f.cut;
  f.ev = mo.events ? mo.events(f) : [];
  f.dur = Math.max(end + 300, (mo.minDur || 0) + f.cut);
  fx = f;
  fxSound(f);
}

function updateFx(now) {
  if (!fx) return;
  const e = now - fx.start;
  if (!fx.dropped && e >= DROP_MS * 0.8) { fx.dropped = true; dust(fx.x, fx.y + CR * 0.6, now, 10); SFX.place(); }
  const me = e >= DROP_MS ? e - fx.cut : -1;
  for (const ev of fx.ev) if (!ev.done && me >= ev.at) { ev.done = true; ev.f(fx, now); }
  for (const L of fx.lines) for (const q of L.cells) {
    if (!q.done && e >= q.at + FLIP_MS * 0.5) { q.done = true; board[q.r][q.c] = fx.p; fx.cnt++; fx.cntAt = e; flipSfx(fx.cnt); }   // 공중에서 색이 바뀜
    if (!q.landed && e >= (q.land != null ? q.land : q.at + FLIP_MS)) { q.landed = true; dust(chipX(q.c), chipY(q.r) + CR * 0.6, now, 6); glow[q.r * N + q.c] = now + 900; }
  }
  if (e >= fx.dur) {
    for (const L of fx.lines) for (const q of L.cells) board[q.r][q.c] = fx.p;   // 안전장치
    fx = null; nextTurn();
  }
}

function drawFx(now, t) {
  if (!fx) return;
  const e = now - fx.start;
  const mo = MOTIONS[fx.type];
  const inCut = fx.cut && e >= DROP_MS && e < DROP_MS + fx.cut;
  const me = e >= DROP_MS ? e - fx.cut : e;   // 모션 시간 (컷인 제외)
  const pose = (!inCut && me >= MS0 && mo.pose) ? mo.pose(fx, me, t) : { dx: 0, dy: 0, sx: 1, sy: 1, rot: 0, face: 'happy' };
  if (!inCut && me >= MS0 && mo.under) mo.under(fx, me, t, pose);
  // 놓은 칩: 위에서 떨어져 '탁' 찌그러짐 → 이후 모션 자세
  if (me < MS0 || inCut || !mo.pose) {
    const k = e / DROP_MS, h = (1 - easeIn(k / 0.8)) * CR * 2.6;
    const sq = k >= 0.8 && k < 1.6 ? Math.sin(clamp01((k - 0.8) / 0.8) * Math.PI) * 0.22 : 0;
    shadowAt(fx.x, fx.y, h);
    ctx.save(); ctx.translate(fx.x, fx.y - h); ctx.scale(1 + sq, 1 - sq);
    drawChip(0, 0, CR, fx.p, t, 0, k < 1.6 ? 'normal' : 'happy', false);
    ctx.restore();
  } else {
    shadowAt(fx.x, fx.y, Math.max(0, -pose.dy));
    ctx.save(); ctx.translate(fx.x + pose.dx, fx.y + pose.dy); ctx.rotate(pose.rot); ctx.scale(pose.sx, pose.sy);
    drawChip(0, 0, CR, fx.p, t, 0, pose.face, false);
    ctx.restore();
  }
  // 뒤집히는 칩
  for (const L of fx.lines) {
    const [dr, dc] = DIRS[L.dir], ang = Math.atan2(dr, dc);
    for (const q of L.cells) mo.chip ? mo.chip(fx, q, me, t) : drawFlipChip(q, e, t, ang, now);
  }
  // 모션은 컷인 시간을 뺀 시간축으로 그림
  if (fx.cut && e >= DROP_MS + fx.cut) cornerAura(fx, t);
  if (!inCut) mo.draw(fx, me, t, pose);
  drawCounter(fx, e);
  drawParts(now);
  if (inCut) drawCutIn(fx, e - DROP_MS, t);
}

// 뒤집힌 개수: 하나 뒤집힐 때마다 '+N'이 툭 튀어나옴, 많을수록 크고 금색
function drawCounter(f, e) {
  if (!f.cnt) return;
  popText(`+${f.cnt}`, f.x, textY(f, MOTIONS[f.type].counterK || 0.95), e - f.cntAt, f.dur - f.cntAt,
    58 + Math.min(f.cnt, 10) * 3, f.cnt >= 6 ? '#ffd23c' : '#ffffff', 0);
}

function cornerAura(f, t) {
  const pulse = 0.5 + 0.5 * Math.sin(t * 10);
  ctx.strokeStyle = `rgba(255,210,60,${0.5 + 0.4 * pulse})`; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.arc(f.x, f.y, CR * 1.25 + pulse * 6, 0, TAU); ctx.stroke();
}

// ===== 모서리 컷씬 =====
// 번쩍 → 띠가 쾅 → 성난 얼굴 클로즈업 + 기운 → 눈빛 번쩍 → 기합! (입 크게, 덜덜) → '모서리 GET!!' 도장 쾅 → 퇴장
function shout(txt, x, y, size, sc, fill, edge, rot, alpha) {
  if (sc <= 0 || alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sc, sc);
  ctx.font = `900 ${size}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.lineWidth = size * 0.3; ctx.strokeStyle = '#000'; ctx.strokeText(txt, 0, 0);
  ctx.lineWidth = size * 0.14; ctx.strokeStyle = edge; ctx.strokeText(txt, 0, 0);
  ctx.fillStyle = fill; ctx.fillText(txt, 0, 0);
  ctx.restore();
}
function fitSize(txt, size, maxW) {
  ctx.font = `900 ${size}px ${FONT}`;
  const w = ctx.measureText(txt).width * 1.15;   // 테두리 여유
  return w > maxW ? Math.floor(size * maxW / w) : size;
}
function glint4(x, y, r) {
  ctx.fillStyle = '#fff'; ctx.beginPath();
  ctx.moveTo(x, y - r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.quadraticCurveTo(x, y, x, y + r);
  ctx.quadraticCurveTo(x, y, x - r, y); ctx.quadraticCurveTo(x, y, x, y - r); ctx.fill();
}
// 얼굴 뒤 기운 (1P 파란 불꽃 / 2P 주황 불꽃), 위쪽이 더 길게 타오름
function drawAura(R, t, p, power) {
  const cols = p === BLACK ? ['rgba(63,116,255,.9)', '#8fc4ff', '#ffffff'] : ['rgba(255,80,20,.9)', '#ffae2e', '#fff3b0'];
  for (let ly = 0; ly < 3; ly++) {
    ctx.fillStyle = cols[ly];
    ctx.beginPath();
    const n = 20;
    for (let i = 0; i <= n * 2; i++) {
      const a = i / (n * 2) * TAU;
      let rr = R * 0.97, lift = 0;
      if (i % 2 === 0) {
        const up = Math.max(0, -Math.sin(a)), fl = Math.sin(t * 24 + i * 1.7 + ly * 2) * 0.1;
        rr = R * (1 + (0.22 + 0.38 * up + fl) * power * (1 - ly * 0.32));
        lift = R * 0.08 * power;
      }
      const x = Math.cos(a) * rr, y = Math.sin(a) * rr - lift;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath(); ctx.fill();
  }
}

function drawCutIn(f, ce, t) {
  const port = orient === 'port', k = CHIP[f.p], bc = BAND_COL[f.p];
  const kin = easeOut(ce / CI.IN), kout = easeIn((ce - CI.OUT) / (CI.END - CI.OUT));
  ctx.fillStyle = `rgba(0,0,0,${0.6 * kin * (1 - kout)})`; ctx.fillRect(-80, -80, LW + 160, LH + 160);
  if (ce < 100) { ctx.fillStyle = `rgba(255,255,255,${0.6 * (1 - ce / 100)})`; ctx.fillRect(-80, -80, LW + 160, LH + 160); }
  // 배치: f*=얼굴, t*=GET 글자, n*=이름표, w*=기합 글자 (띠 중심 기준)
  const L = port
    ? { bh: 640, fx: 0, fy: -130, R: 205, tx: 0, ty: 225, tw: LW - 120, ts: 130, nx: -LW / 2 + 140, ny: -250, wx: 330, wy: -230, ws: 80 }
    : { bh: 400, fx: -LW / 2 + 360, fy: 0, R: 235, tx: 300, ty: 40, tw: LW - 840, ts: 150, nx: 300, ny: -155, wx: -LW / 2 + 630, wy: -150, ws: 92 };
  ctx.save();
  ctx.translate(LW / 2 + (kout - (1 - kin)) * LW * 1.4, LH / 2);
  ctx.rotate(-0.08);
  // 띠
  const bw = LW * 1.8, g = ctx.createLinearGradient(0, -L.bh / 2, 0, L.bh / 2);
  g.addColorStop(0, bc[1]); g.addColorStop(0.5, bc[0]); g.addColorStop(1, bc[1]);
  ctx.fillStyle = g; ctx.fillRect(-bw / 2, -L.bh / 2, bw, L.bh);
  ctx.fillStyle = '#ffd23c'; ctx.fillRect(-bw / 2, -L.bh / 2 - 18, bw, 12); ctx.fillRect(-bw / 2, L.bh / 2 + 6, bw, 12);
  ctx.fillStyle = '#fff'; ctx.fillRect(-bw / 2, -L.bh / 2 - 30, bw, 5); ctx.fillRect(-bw / 2, L.bh / 2 + 25, bw, 5);
  // 집중선 (얼굴을 향해, 기합 순간 더 굵게)
  ctx.save(); ctx.beginPath(); ctx.rect(-bw / 2, -L.bh / 2, bw, L.bh); ctx.clip();
  const pw = ce >= CI.ROAR ? 1 : 0.5, seed = Math.floor(ce / 45);
  ctx.strokeStyle = `rgba(255,255,255,${0.22 + 0.2 * pw})`; ctx.lineCap = 'round';
  for (let i = 0; i < 48; i++) {
    const h = Math.sin(i * 12.9898 + seed * 78.233) * 43758.5453, fr = h - Math.floor(h);
    const a = i / 48 * TAU + fr * 0.12, r0 = L.R * (1.25 + fr * 0.9), r1 = LW * 1.2;
    ctx.lineWidth = 2 + fr * 7 * pw;
    ctx.beginPath(); ctx.moveTo(L.fx + Math.cos(a) * r0, L.fy + Math.sin(a) * r0);
    ctx.lineTo(L.fx + Math.cos(a) * r1, L.fy + Math.sin(a) * r1); ctx.stroke();
  }
  ctx.restore();
  // 얼굴 클로즈업
  const fe = ce - CI.FACE, roar = ce >= CI.ROAR;
  let pop = fe < 0 ? 0 : easeOut(fe / 200) * (1 + 0.12 * Math.sin(clamp01(fe / 320) * Math.PI));
  if (roar) pop *= 1 + 0.1 * (1 - clamp01((ce - CI.ROAR) / 220));
  pop *= 1 + kout * 0.4;
  const vib = roar && ce < CI.ROAR + 520 ? 6 : 0;
  if (pop > 0) {
    ctx.save();
    ctx.translate(L.fx + Math.sin(t * 95) * vib, L.fy + Math.cos(t * 83) * vib);
    ctx.scale(pop, pop);
    drawAura(L.R, t, f.p, roar ? 1.25 : 0.7);
    drawChip(0, 0, L.R, f.p, t, 0, roar ? 'roar' : 'fierce', false);
    ctx.restore();
    const gk = (ce - CI.GLINT) / 160;   // 눈빛 번쩍
    if (gk > 0 && gk < 1) {
      const tw = Math.sin(gk * Math.PI);
      for (const s of [-1, 1]) glint4(L.fx + s * 0.28 * L.R * pop, L.fy - 0.14 * L.R * pop, L.R * 0.34 * tw);
    }
  }
  // 이름표
  const na = clamp01((ce - 140) / 150);
  if (na > 0) {
    const nm = pname(f.p);
    ctx.globalAlpha = na; ctx.font = `900 52px ${FONT}`;
    const w = ctx.measureText(nm).width + 50;
    ctx.fillStyle = '#ffd23c'; rrect(L.nx - w / 2, L.ny - 38, w, 76, 38); ctx.fill();
    ctx.fillStyle = '#111'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(nm, L.nx, L.ny + 2);
    ctx.globalAlpha = 1;
  }
  // 기합!
  const we = ce - CI.ROAR;
  if (we >= 0) {
    const sc = we < 120 ? easeOut(we / 120) * 1.3 : 1.3 - 0.3 * clamp01((we - 120) / 150);
    shout(f.cutWord || CUT_WORDS[0], L.wx + Math.sin(t * 80) * 4, L.wy, L.ws, sc, '#ffffff', k.accent, 0.14, 1);
  }
  // '모서리 GET!!' 도장 쾅
  const se = ce - CI.STAMP;
  if (se >= 0) {
    const TXT = '모서리 GET!!', ts = fitSize(TXT, L.ts, L.tw);
    const sc = se < 130 ? 2.4 - 1.5 * easeIn(se / 130) : 0.9 + 0.1 * easeOut((se - 130) / 140);
    const al = clamp01(se / 60);
    ctx.save(); ctx.translate(L.tx, L.ty); ctx.scale(sc, sc); ctx.globalAlpha = al;
    ctx.font = `900 ${ts}px ${FONT}`;
    const tw = ctx.measureText(TXT).width;
    ctx.beginPath();   // 터지는 배경
    for (let i = 0; i < 28; i++) {
      const a = i / 28 * TAU, rr = i % 2 ? 0.78 : 1.0;
      const x = Math.cos(a) * tw * 0.62 * rr, y = Math.sin(a) * ts * 0.8 * rr;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath(); ctx.fillStyle = '#ffd23c'; ctx.fill(); ctx.lineWidth = 8; ctx.strokeStyle = '#000'; ctx.stroke();
    ctx.restore();
    shout(TXT, L.tx, L.ty, ts, sc, '#ffffff', '#ff3b3b', -0.03, al);
    if (se > 100 && se < 420) {   // 충격 링
      const rk = (se - 100) / 320;
      ctx.strokeStyle = `rgba(255,255,255,${1 - rk})`; ctx.lineWidth = 10 * (1 - rk) + 2;
      ctx.beginPath(); ctx.ellipse(L.tx, L.ty, tw * 0.62 * (0.9 + rk * 0.5), ts * 0.8 * (0.9 + rk * 0.5), 0, 0, TAU); ctx.stroke();
    }
  }
  ctx.restore();
}

// 한 칩: 대기(덜덜) → 들썩 + 진행 방향으로 납작해지며 회전 → 공중에서 색 바뀜 → 착지 찌그러짐
function drawFlipChip(q, e, t, ang, now) {
  const x = chipX(q.c), y = chipY(q.r), le = e - q.at, k = le / FLIP_MS;
  const ph = (q.r * N + q.c) * 1.7;
  if (k < 0) {                                         // 대기: 차례가 다가올수록 심하게 떨림
    const amp = 1.5 + 4 * clamp01((le + 450) / 450);
    drawChip(x + Math.sin(t * 55 + ph) * amp, y, CR, board[q.r][q.c], t, ph, 'scared');
    return;
  }
  if (k >= 1) {                                         // 착지 찌그러짐
    const sq = Math.sin(clamp01((le - FLIP_MS) / 160) * Math.PI) * 0.18;
    ctx.save(); ctx.translate(x, y + sq * CR * 0.3); ctx.scale(1 + sq, 1 - sq);
    drawChip(0, 0, CR, board[q.r][q.c], t, ph, 'happy');
    ctx.restore();
    return;
  }
  const h = Math.sin(k * Math.PI) * CR * 1.1;          // 들썩
  const sc = Math.cos(k * Math.PI), w = Math.max(0.05, Math.abs(sc));
  const grow = 1 + 0.15 * Math.sin(k * Math.PI);
  const p = k < 0.5 ? 3 - fx.p : fx.p;
  shadowAt(x, y, h);
  ctx.save();
  ctx.translate(x, y - h);
  ctx.rotate(ang); ctx.scale(w * grow, grow); ctx.rotate(-ang);   // 줄 방향으로 납작해짐
  if (w < 0.45) {                                      // 옆면(두께): 반은 흑, 반은 백
    const th = CR * (0.45 - w) * 0.9;
    ctx.save(); ctx.rotate(ang);
    ctx.fillStyle = CHIP[BLACK].body; ctx.fillRect(-th, -CR, th, CR * 2);
    ctx.fillStyle = CHIP[WHITE].body; ctx.fillRect(0, -CR, th, CR * 2);
    ctx.restore();
  }
  drawChip(0, 0, CR, p, t, ph, k < 0.5 ? 'scared' : 'dizzy', false);
  ctx.restore();
}

function shadowAt(x, y, h) {
  const k = clamp01(1 - h / (CR * 3));
  ctx.fillStyle = `rgba(0,0,0,${0.35 * k})`;
  ctx.beginPath(); ctx.ellipse(x, y + CR * 0.24, CR * (0.6 + 0.42 * k), CR * (0.5 + 0.4 * k), 0, 0, TAU); ctx.fill();
}

function ring(x, y, age, life) {
  if (age < 0 || age > life) return;
  const k = age / life;
  ctx.strokeStyle = `rgba(255,255,255,${0.7 * (1 - k)})`; ctx.lineWidth = 8 * (1 - k) + 2;
  ctx.beginPath(); ctx.arc(x, y, CR * (0.8 + 1.4 * easeOut(k)), 0, TAU); ctx.stroke();
}

function dust(x, y, now, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.PI + Math.random() * Math.PI, sp = 80 + Math.random() * 160;
    parts.push({ x: x + (Math.random() - .5) * CR, y, vx: Math.cos(a) * sp * 1.6, vy: Math.sin(a) * sp * 0.5, born: now, life: 350 + Math.random() * 200, s: 8 + Math.random() * 8 });
  }
}
function drawParts(now) {
  parts = parts.filter(q => now - q.born < q.life);
  for (const q of parts) {
    const a = (now - q.born) / 1000, k = (now - q.born) / q.life;
    if (q.drop) {   // 물방울
      ctx.fillStyle = `rgba(127,212,255,${1 - k})`;
      ctx.beginPath(); ctx.arc(q.x + q.vx * a, q.y + q.vy * a + 900 * a * a, q.s * (1 - k * 0.5), 0, TAU); ctx.fill();
      continue;
    }
    if (q.col) {   // 반짝이
      ctx.globalAlpha = 1 - k; drawStar(q.x + q.vx * a, q.y + q.vy * a + 300 * a * a, q.s * (1.6 - k), q.s * 0.6, q.col); ctx.globalAlpha = 1;
      continue;
    }
    ctx.fillStyle = `rgba(225,235,225,${0.5 * (1 - k)})`;
    ctx.beginPath(); ctx.arc(q.x + q.vx * a, q.y + q.vy * a, q.s * (0.6 + k), 0, TAU); ctx.fill();
  }
}

// 만화 글자: 튀어나왔다가 사라짐
function popText(txt, x, y, age, hold, size, col, rot = -0.08) {
  if (age < 0 || age > hold) return;
  const sc = age < 140 ? easeOut(age / 140) * 1.25 : 1.25 - 0.25 * clamp01((age - 140) / 120);
  ctx.save();
  ctx.globalAlpha = clamp01((hold - age) / 150);
  ctx.translate(Math.max(size * 3, Math.min(LW - size * 3, x)), Math.max(size, y));
  ctx.rotate(rot); ctx.scale(sc, sc);
  ctx.font = `900 ${size}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = size * 0.18; ctx.strokeStyle = '#000';
  ctx.strokeText(txt, 0, 0); ctx.fillStyle = col; ctx.fillText(txt, 0, 0);
  ctx.restore();
}

// ===== 개발용 단축키 (Mac 키보드, 게임 중에만) =====
// 1 딱밤(1개) · 2 뿅망치(2개) · 3 부메랑(3개) · 4 프라이팬(4개) · 5 불꽃놀이(5개)
// 6 마법(6개) · 7 번개(7개) · 8 UFO(8개) · 9 파도타기(9개) · 0 초필살 빔(10개) · C 모서리 컷씬
// 판 가운데 (3,3)에 흑을 두면 [방향, 길이]의 백 줄이 뒤집힘 (방향: 4 →, 6 ↓, 7 ↘, 3 ←)
const TEST_SETS = {
  1: [[4, 1]], 2: [[4, 2]], 3: [[4, 3]], 4: [[4, 2], [6, 2]], 5: [[4, 3], [6, 2]],
  6: [[4, 3], [6, 3]], 7: [[4, 3], [6, 3], [7, 1]], 8: [[4, 3], [6, 3], [7, 2]],
  9: [[4, 3], [6, 3], [7, 3]], 10: [[4, 3], [6, 3], [7, 3], [3, 1]]
};
function testCount(n) {
  if (scene !== 'game' || fx || gameOver || confirmQuit) return;
  board = Array.from({ length: N }, () => Array(N).fill(EMPTY));
  const r0 = 3, c0 = 3;
  for (const [dir, len] of TEST_SETS[n]) {
    const [dr, dc] = DIRS[dir];
    for (let d = 1; d <= len; d++) board[r0 + dr * d][c0 + dc * d] = WHITE;
    board[r0 + dr * (len + 1)][c0 + dc * (len + 1)] = BLACK;
  }
  turn = BLACK; cpuAt = 0;
  place({ r: r0, c: c0, flips: flipsFor(board, r0, c0, BLACK) });
}
// C 키: 모서리 (0,0)에 두어 3줄 6개를 뒤집는 판
function testCorner() {
  if (scene !== 'game' || fx || gameOver || confirmQuit) return;
  board = Array.from({ length: N }, () => Array(N).fill(EMPTY));
  for (const [r, c] of [[0, 1], [0, 2], [1, 0], [2, 0], [1, 1], [2, 2]]) board[r][c] = WHITE;
  for (const [r, c] of [[0, 3], [3, 0], [3, 3]]) board[r][c] = BLACK;
  turn = BLACK; cpuAt = 0;
  place({ r: 0, c: 0, flips: flipsFor(board, 0, 0, BLACK) });
}
addEventListener('keydown', e => {
  if (e.key >= '1' && e.key <= '9') testCount(+e.key);
  else if (e.key === '0') testCount(10);
  else if (e.key === 'c' || e.key === 'C') testCorner();
});

function turnLabel(p, active, t) {
  if (!active) return '대기 중';
  return (mode === 'cpu' && p === WHITE) ? '생각 중' + '.'.repeat(1 + Math.floor(t * 3) % 3) : '내 차례!';
}

// 가로모드 패널 (세로로 긴 형태)
function drawPanelV(p, cx, t) {
  const k = CHIP[p], active = !gameOver && turn === p;
  const x = cx - 220, y = BY, w = 440, h = N * CELL - 90;
  ctx.fillStyle = active ? 'rgba(255,255,255,.08)' : 'rgba(255,255,255,.03)';
  rrect(x, y, w, h, 32); ctx.fill();
  if (active) {
    ctx.strokeStyle = k.accent; ctx.lineWidth = 6;
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 4);
    rrect(x, y, w, h, 32); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = k.accent; ctx.font = `900 96px ${FONT}`;
  ctx.fillText(pname(p), cx, y + 85);
  ctx.fillStyle = stoneColor(p); ctx.font = `700 44px ${FONT}`;
  ctx.fillText(stoneLabel(p), cx, y + 160);
  drawChip(cx, y + 330, 100, p, t, p * 2, active);
  ctx.fillStyle = '#fff'; ctx.font = `900 170px ${FONT}`;
  ctx.fillText(countOf(board, p), cx, y + 590);
  ctx.font = `700 56px ${FONT}`;

// ===== CPU AI =====
// 칸별 가중치: 모서리 최고, 모서리 바로 옆(X·C칸)은 모서리를 내주기 쉬워서 위험
const WT = [
  100, -20, 10,  5,  5, 10, -20, 100,
  -20, -50, -2, -2, -2, -2, -50, -20,
   10,  -2,  1,  1,  1,  1,  -2,  10,
    5,  -2,  1,  0,  0,  1,  -2,   5,
    5,  -2,  1,  0,  0,  1,  -2,   5,
   10,  -2,  1,  1,  1,  1,  -2,  10,
  -20, -50, -2, -2, -2, -2, -50, -20,
  100, -20, 10,  5,  5, 10, -20, 100

function aiPlay(b, m, p) { const nb = b.slice(); nb[m.i] = p; for (const j of m.f) nb[j] = p; return nb; }

function wAt(b, i) {

}

  for (let i = ms.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ms[i], ms[j]] = [ms[j], ms[i]]; }
  return ms.sort((x, y) => WT[y.i] - WT[x.i]);
}

    return -negamax(b, 3 - p, depth, -beta, -alpha, true);   // 패스

    if (v > alpha) alpha = v;

// 쉬움: 40%는 아무 데나, 나머지도 많이 뒤집는 것만 봄 (모서리 개념 없음)
function cpuEasy(b, p, ms) {

}
// 보통: 많이 뒤집기 + 모서리 우선 + 위험한 칸과 상대에게 모서리 내주는 수 피하기 (1수만 봄)
function cpuNormal(b, p, ms) {

    if (aiMoves(aiPlay(b, m, p), 3 - p).some(q => IS_CORNER(q.i))) s -= 60;
    if (s > bs) { bs = s; best = m; }
  }

// 어려움: 가중치 + 둘 수 있는 칸 수, 4수 앞 탐색 / 빈칸 10개 이하면 끝까지 계산

// ===== 아주 어려움: 제한 시간 안에서 최대한 깊이 읽기 =====
// 평가: 칸 가중치 + 둘 수 있는 칸 수 + 빈칸에 닿은 칩(적을수록 좋음) + 모서리에서 이어진 안 뒤집히는 가장자리

  const a = [];

    for (const [dr, dc] of DIRS) { const y = r + dr, x = c + dc; if (y >= 0 && y < 8 && x >= 0 && x < 8) n.push(y * 8 + x); }

const EDGE_WALKS = [[0, 1, 8], [7, -1, 8], [56, 1, -8], [63, -1, -8]];

    kids.sort((x, y) => x.k - y.k);   // 끝내기: 상대가 둘 곳 적은 수부터 / 중반: 좋은 칸부터

  const src = [
    `const DIRS=${JSON.stringify(DIRS)},WT=${JSON.stringify(WT)},CORNERS=${JSON.stringify(CORNERS)},ADJ=${JSON.stringify(ADJ)},EDGE_WALKS=${JSON.stringify(EDGE_WALKS)};`,
    ...[aiFlips, aiMoves, aiPlay, wAt, posScore, discs, finalScore, stableEdges, evalX, expertSearch].map(f => f.toString()),
    'onmessage=e=>postMessage({id:e.data.id,r:expertSearch(new Int8Array(e.data.b),e.data.p,e.data.budget)});'
  ].join('\n');
  aiWorker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
  aiWorker.onmessage = e => { if (e.data.id === cpuReq) cpuResult = e.data.r; };
  aiWorker.onerror = () => { aiWorker = null; };   // 실패하면 아래에서 직접 계산
} catch (e) { aiWorker = null; }

function updateCpu(now) {
  if (!isCpuTurn()) return;
  if (confirmQuit) { if (cpuAt) cpuAt = Math.max(cpuAt, now + 300); return; }   // 확인창 동안 대기
  if (!cpuAt) {
    cpuAt = now + 500 + Math.random() * 500;   // 0.5~1초 생각
    if (diff === 'expert') {
      cpuReq++; cpuResult = null;
      if (aiWorker) aiWorker.postMessage({ id: cpuReq, b: Array.from(toFlat(board)), p: WHITE, budget: EXPERT_MS });
    }
    return;
  }
  if (now < cpuAt) return;
  let i;
  if (diff === 'expert') {
    if (aiWorker && !cpuResult) return;   // 아직 계산 중 (계속 '생각 중...')
    const r = cpuResult && moves.some(v => v.r * 8 + v.c === cpuResult.i) ? cpuResult : expertSearch(toFlat(board), WHITE, 250);
    i = r.i;
  } else {
    const a = aiChoose(toFlat(board), WHITE, diff);
    i = a && a.i;
  }
  cpuAt = 0; cpuResult = null;
  const m = moves.find(v => v.r * 8 + v.c === i);
  if (m) place(m);
}

// ===== 게임방법 (애니메이션 약 21초) =====
// 장: 소개 / ① 끼우면 뒤집기 / ② 8방향 동시에 / ③ 못 두는 곳과 PASS / 정리
const HOW = [0, 2500, 8000, 13500, 18000];
const B = BLACK, W = WHITE;
const HOW_CH = [
  null,
  { head: '① 끼우면 뒤집기!', lines: ['내 칩 사이에 상대 칩을 끼우면', '끼인 칩이 전부 내 색으로!', ['뒤집을 수 있는 칸에만 둘 수 있어요', '#7fb2ff']],
    cells: [[2, 0, B], [2, 1, W], [2, 2, W]], hint: [2, 3, 300], place: [2, 3, B, 1400],
    flips: [[2, 2, 1900], [2, 1, 2050]],
    says: [[2, 0, '끼워볼까~?', 450, 950], [2, 2, '히익!', 1050, 750], [2, 1, '어? 나 까매졌어?!', 2700, 1700]],
    pops: [[2, 3, '뽁!', 1400 + 210, 500]] },
  { head: '② 8방향 한꺼번에!', lines: ['가로·세로·대각선', '끝이 내 칩으로 막힌 줄은 모두 뒤집혀요', ['막히지 않은 줄은 그대로!', '#ffd23c']],
    cells: [[2, 0, B], [2, 1, W], [0, 2, B], [1, 2, W], [0, 0, B], [1, 1, W], [4, 4, B], [3, 3, W], [3, 2, W]],
    hint: [2, 2, 300], place: [2, 2, B, 1100], flips: [[2, 1, 1600], [1, 2, 1600], [1, 1, 1600], [3, 3, 1600]],
    rays: [[[2, 0], [0, 2], [0, 0], [4, 4]], 1150, 2100],
    says: [[1, 1, '같이 뒤집혔다~!', 2200, 1500], [3, 2, '휴~ 살았다', 2700, 2000, true]],
    pops: [[2, 2, '한꺼번에!!', 1350, 650]] },
  { head: '③ 못 두는 곳 · PASS', lines: ['뒤집을 수 없는 칸엔 못 둬요', '둘 곳이 하나도 없으면 PASS', ['차례가 상대에게 넘어가요', '#9aa0a8']],
    cells: [[1, 1, W], [1, 2, W], [2, 1, W], [2, 2, W], [3, 3, W], [4, 0, B]], bad: [0, 4, 900], pass: 2600,
    sad: [4, 0, 1800], says: [[1, 2, '여긴 안 돼~', 1100, 1200], [4, 0, '둘 곳이 없어…', 1800, 1700]] },
  null
];
const HOW_SUM = [
  ['끼우기', '#7fb2ff', '상대 칩을 끼우면 뒤집기'],
  ['8방향', '#ffd23c', '여러 줄을 한꺼번에 뒤집기'],
  ['모서리', '#ff7ad9', '절대 안 뒤집혀서 유리!'],
  ['PASS', '#9aa0a8', '둘 곳 없으면 차례 넘김'],
  ['승리', '#5aff96', '끝났을 때 칩이 많으면 승리!']
];
let howStart = 0, howFired = 0;
const HOW_EV = [];
HOW_CH.forEach((ch, i) => {
  if (!ch) return;
  const t0 = HOW[i];
  if (ch.place) HOW_EV.push({ t: t0 + ch.place[3] + DROP_MS * 0.8, f: () => SFX.place() });
  (ch.flips || []).forEach(([, , at], k) => HOW_EV.push({ t: t0 + at + FLIP_MS * 0.5, f: () => flipSfx(k + 1) }));
  if (ch.bad) HOW_EV.push({ t: t0 + ch.bad[2], f: () => SFX.cancel() });
  if (ch.pass) HOW_EV.push({ t: t0 + ch.pass, f: () => SFX.pass() });
  (ch.says || []).forEach(sy => HOW_EV.push({ t: t0 + sy[3], f: () => tone(880, 0.07, 'sine', 0.12, 1320) }));
});
HOW_EV.push({ t: HOW[4], f: () => SFX.start() });
for (const at of [900, 1300]) HOW_EV.push({ t: at, f: () => tone(880, 0.07, 'sine', 0.12, 1320) });   // 소개 말풍선
HOW_EV.sort((a, b) => a.t - b.t);

function startHow(now) { go('howto'); howStart = now; howFired = 0; parts = []; }
function howTap(now) {
  if (now - sceneTime < 300) return;
  const e = now - howStart, last = HOW.length - 1;
  if (e >= HOW[last]) { if (e - HOW[last] > 600) { SFX.click(); go('mode'); } return; }
  const next = HOW.find(v => v > e);   // 탭: 다음 장으로
  howStart = now - next; howFired = HOW_EV.filter(v => v.t < next).length; SFX.click();
}

function howGeo() {
  return orient === 'port'
    ? { cx: LW / 2, cy: 1000, cs: 180, capX: LW / 2, capY: 270, bodyY: 1560 }
    : { cx: 560, cy: 610, cs: 160, capX: 1480, capY: 330, bodyY: 560 };
}
const hXY = (g, r, c) => [g.cx + (c - 2) * g.cs, g.cy + (r - 2) * g.cs];

function drawMiniBoard(g) {
  const S = g.cs * 5, x0 = g.cx - S / 2, y0 = g.cy - S / 2;
  ctx.fillStyle = '#0f3221'; rrect(x0 - 18, y0 - 18, S + 36, S + 36, 26); ctx.fill();
  ctx.strokeStyle = '#2e7a52'; ctx.lineWidth = 4; rrect(x0 - 18, y0 - 18, S + 36, S + 36, 26); ctx.stroke();
  for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++) {
    ctx.fillStyle = (r + c) % 2 ? '#1c5a3b' : '#216641';
    rrect(x0 + c * g.cs + 4, y0 + r * g.cs + 4, g.cs - 8, g.cs - 8, 14); ctx.fill();
  }
}

function drawTapHint(g, x, y, age) {
  if (age < 0 || age > 700) return;
  const k = age / 700;
  ctx.strokeStyle = `rgba(255,255,255,${1 - k})`; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.arc(x, y, g.cs * (0.15 + 0.35 * k), 0, TAU); ctx.stroke();
  ctx.font = `${Math.round(g.cs * 0.42)}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('👆', x + g.cs * 0.12, y + g.cs * 0.42 - Math.sin(k * Math.PI) * 14);
}

// 말풍선: 톡 튀어나왔다가 사라짐. below=true면 칩 아래쪽에 (꼬리가 위로)
function bubble(txt, x, y, age, hold, size = 40, below = false) {
  if (age < 0 || age > hold) return;
  const k = age < 180 ? easeOut(age / 180) * (1 + 0.18 * Math.sin(age / 180 * Math.PI)) : 1;
  ctx.save();
  ctx.globalAlpha = clamp01((hold - age) / 160);
  ctx.font = `800 ${size}px ${FONT}`;
  const w = ctx.measureText(txt).width + size * 1.1, h = size * 1.7;
  const bx = Math.max(w / 2 + 12, Math.min(LW - w / 2 - 12, x));
  ctx.translate(bx, y + Math.sin(age * 0.008) * 3); ctx.scale(k, k);
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#111'; ctx.lineWidth = 4; ctx.lineJoin = 'round';
  rrect(-w / 2, -h / 2, w, h, h / 2); ctx.fill(); ctx.stroke();
  const tx = Math.max(-w / 2 + h / 2, Math.min(w / 2 - h / 2, x - bx)), s = below ? -1 : 1, e0 = s * (h / 2), tip = s * (h / 2 + 20);
  ctx.beginPath(); ctx.moveTo(tx - 13, e0 - s * 3); ctx.lineTo(tx, tip); ctx.lineTo(tx + 13, e0 - s * 3); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(tx - 13, e0); ctx.lineTo(tx, tip); ctx.lineTo(tx + 13, e0); ctx.stroke();
  ctx.fillStyle = '#111'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(txt, 0, 2);
  ctx.restore();
}

// 미니 칩: 뒤집기 시각(at)이 있으면 들썩 → 납작 → 색 바뀜 → 착지
function hChip(g, r, c, p0, p1, at, e, t) {
  const [x, y] = hXY(g, r, c), R = g.cs * 0.38, ph = (r * 5 + c) * 1.7;
  if (at == null || e < at) {
    const scared = at != null && e > at - 600;
    drawChip(x + (scared ? Math.sin(t * 55 + ph) * 3 : 0), y, R, p0, t, ph, scared ? 'scared' : 'normal');
    return;
  }
  const k = (e - at) / FLIP_MS;
  if (k >= 1) {   // 착지: 찌그러졌다가 웃음
    const sq = Math.sin(clamp01((e - at - FLIP_MS) / 180) * Math.PI) * 0.2;
    ctx.save(); ctx.translate(x, y + sq * R * 0.3); ctx.scale(1 + sq, 1 - sq);
    drawChip(0, 0, R, p1, t, ph, e - at < FLIP_MS + 1400 ? 'happy' : 'normal');
    ctx.restore(); return;
  }
  const h = Math.sin(k * Math.PI) * R * 1.1, w = Math.max(0.05, Math.abs(Math.cos(k * Math.PI)));
  shadowAt(x, y, h);
  ctx.save(); ctx.translate(x, y - h); ctx.scale(w * (1 + 0.15 * Math.sin(k * Math.PI)), 1 + 0.15 * Math.sin(k * Math.PI));
  drawChip(0, 0, R, k < 0.5 ? p0 : p1, t, ph, k < 0.5 ? 'scared' : 'dizzy', false);
  ctx.restore();
}

function howCaption(g, e0, head, lines) {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.globalAlpha = clamp01(e0 / 250);
  ctx.font = `900 ${fitSize(head, 84, orient === 'port' ? LW - 80 : 1060)}px ${FONT}`;
  ctx.lineWidth = 14; ctx.strokeStyle = '#000';
  ctx.strokeText(head, g.capX, g.capY); ctx.fillStyle = '#ffd23c'; ctx.fillText(head, g.capX, g.capY);
  lines.forEach((L, i) => {
    const k = clamp01((e0 - 400 - i * 900) / 300);
    if (k <= 0) return;
    const [txt, col] = Array.isArray(L) ? L : [L, '#ffffff'];
    ctx.globalAlpha = k; ctx.fillStyle = col;
    ctx.font = `700 ${fitSize(txt, 54, orient === 'port' ? LW - 80 : 1060)}px ${FONT}`;
    ctx.fillText(txt, g.capX, g.bodyY + i * 92 + (1 - k) * 20);
  });
  ctx.globalAlpha = 1;
}

function howChapter(g, ch, e, t) {
  drawMiniBoard(g);
  const flipAt = {};
  for (const [r, c, at] of ch.flips || []) flipAt[r * 5 + c] = at;
  // 둘 수 있는 칸 점
  if (ch.hint && (!ch.place || e < ch.place[3])) {
    const [x, y] = hXY(g, ch.hint[0], ch.hint[1]), pulse = 0.5 + 0.5 * Math.sin(t * 5);
    ctx.globalAlpha = clamp01((e - ch.hint[2]) / 300) * (0.6 + 0.4 * pulse);
    ctx.fillStyle = CHIP[B].accent; ctx.beginPath(); ctx.arc(x, y, 16, 0, TAU); ctx.fill();
    ctx.strokeStyle = CHIP[B].accent; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(x, y, g.cs * 0.28, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  if (ch.place) drawTapHint(g, ...hXY(g, ch.place[0], ch.place[1]), e - ch.place[3] + 500);
  if (ch.rays) {   // 뒤집히는 줄: 놓은 칸에서 끝 칩까지 색색의 점선
    const [ends, a0, a1] = ch.rays, [px, py] = hXY(g, ch.place[0], ch.place[1]);
    const al = clamp01((e - a0) / 150) * (1 - clamp01((e - a1 + 250) / 250));
    if (al > 0) {
      ctx.lineWidth = 10; ctx.lineCap = 'round'; ctx.setLineDash([18, 16]); ctx.lineDashOffset = -e * 0.12;
      ends.forEach(([r, c], i) => {
        const [x, y] = hXY(g, r, c), k = easeOut((e - a0) / 300);
        ctx.strokeStyle = RAINBOW[i]; ctx.globalAlpha = al;
        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + (x - px) * k, py + (y - py) * k); ctx.stroke();
      });
      ctx.setLineDash([]); ctx.globalAlpha = 1;
    }
  }
  for (const [r, c, p] of ch.cells) {
    if (ch.sad && ch.sad[0] === r && ch.sad[1] === c && e >= ch.sad[2]) {   // 둘 곳이 없어 시무룩
      const [x, y] = hXY(g, r, c), sk = Math.sin(clamp01((e - ch.sad[2]) / 220) * Math.PI) * 0.15;
      ctx.save(); ctx.translate(x + Math.sin(t * 40) * 2, y + sk * 20); ctx.scale(1 + sk, 1 - sk);
      drawChip(0, 0, g.cs * 0.38, p, t, 0, 'scared'); ctx.restore();
      continue;
    }
    hChip(g, r, c, p, 3 - p, flipAt[r * 5 + c], e, t);
  }
  if (ch.place && e >= ch.place[3]) {   // 놓는 칩: 떨어져 '탁'
    const [r, c, p, at] = ch.place, [x, y] = hXY(g, r, c), R = g.cs * 0.38, k = (e - at) / DROP_MS;
    const h = (1 - easeIn(k / 0.8)) * R * 2.6, sq = k >= 0.8 && k < 1.6 ? Math.sin(clamp01((k - 0.8) / 0.8) * Math.PI) * 0.22 : 0;
    shadowAt(x, y, h);
    ctx.save(); ctx.translate(x, y - h); ctx.scale(1 + sq, 1 - sq); drawChip(0, 0, R, p, t, 0, k < 1.6 ? 'normal' : 'happy', false); ctx.restore();
    const n = (ch.flips || []).filter(([, , a]) => e >= a + FLIP_MS * 0.5).length;
    if (n) popText(`+${n}`, x, y - g.cs * 0.8, 0, 99999, 64, '#ffffff', 0);
  }
  for (const [r, c, txt, at, hold] of ch.pops || []) {
    const [x, y] = hXY(g, r, c);
    popText(txt, x, y - g.cs * 0.95, e - at, hold, 60, '#ffd23c', -0.1);
  }
  if (ch.bad) {   // 못 두는 곳
    const [r, c, at] = ch.bad, [x, y] = hXY(g, r, c);
    drawTapHint(g, x, y, e - at + 500);
    const be = e - at;
    if (be >= 0 && be < 1500) {
      const k = clamp01(be / 150), sh = be < 300 ? Math.sin(be * 0.12) * 10 : 0;
      ctx.strokeStyle = `rgba(255,90,110,${k})`; ctx.lineWidth = 12; ctx.lineCap = 'round';
      const d = g.cs * 0.26;
      ctx.beginPath(); ctx.moveTo(x - d + sh, y - d); ctx.lineTo(x + d + sh, y + d); ctx.moveTo(x + d + sh, y - d); ctx.lineTo(x - d + sh, y + d); ctx.stroke();
      popText('여기엔 못 둬요!', x - g.cs * 0.9, y - g.cs * 0.75, be, 1300, 44, '#ff8a9a', 0);
    }
  }
  if (ch.pass && e >= ch.pass) {   // PASS 배지
    const pe = e - ch.pass, sc = pe < 160 ? easeOut(pe / 160) * 1.2 : 1.2 - 0.2 * clamp01((pe - 160) / 150);
    ctx.save(); ctx.translate(g.cx, g.cy); ctx.scale(sc, sc); ctx.rotate(-0.08);
    ctx.fillStyle = 'rgba(0,0,0,.85)'; rrect(-300, -85, 600, 170, 40); ctx.fill();
    ctx.strokeStyle = '#ffd23c'; ctx.lineWidth = 6; rrect(-300, -85, 600, 170, 40); ctx.stroke();
    ctx.fillStyle = '#ffd23c'; ctx.font = `900 100px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('PASS', 0, 6);
    ctx.restore();
  }
  for (const [r, c, txt, at, hold, below] of ch.says || []) {   // 말풍선은 맨 위에
    const [x, y] = hXY(g, r, c);
    bubble(txt, x, below ? y + g.cs * 0.85 : y - g.cs * 0.85, e - at, hold, 40, below);
  }
  howCaption(g, e, ch.head, ch.lines);
}

function howIntro(e, t) {
  const port = orient === 'port', cy = LH / 2;
  const s = e < 300 ? easeOut(e / 300) * 1.15 : 1.15 - 0.15 * clamp01((e - 300) / 200);
  ctx.save(); ctx.translate(LW / 2, cy - (port ? 330 : 280)); ctx.scale(s, s);
  ctx.font = `900 140px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.lineWidth = 20; ctx.strokeStyle = '#000'; ctx.strokeText('게임방법', 0, 0);
  ctx.fillStyle = '#ffd23c'; ctx.fillText('게임방법', 0, 0);
  ctx.restore();
  for (const [p, dx, ph] of [[B, -220, 0], [W, 220, 1.5]]) {
    const hop = Math.abs(Math.sin(t * 5 + ph)) * 30;
    drawChip(LW / 2 + dx, cy - hop, 95 * easeOut((e - 200) / 400), p, t, ph, true);
  }
  ctx.fillStyle = '#fff'; ctx.font = `900 70px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText('VS', LW / 2, cy);
  bubble('잘 부탁해!', LW / 2 - 220, cy - 175, e - 900, 1500);
  bubble('후후, 덤벼!', LW / 2 + 220, cy - 175, e - 1300, 1150);
  ctx.font = `700 60px ${FONT}`;
  ['흑과 백이 번갈아 칩을 놓아', '내 색 칩을 더 많이 만들면 승리!'].forEach((txt, i) => {
    ctx.globalAlpha = clamp01((e - 600 - i * 400) / 300);
    ctx.font = `700 ${fitSize(txt, 60, LW - 80)}px ${FONT}`;
    ctx.fillText(txt, LW / 2, cy + 260 + i * 95);
  });
  ctx.globalAlpha = 1;
}

function howSummary(d, t) {
  const port = orient === 'port';
  const y0 = port ? 640 : 300, step = port ? 190 : 150, x0 = port ? 60 : LW / 2 - 560;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.font = `900 110px ${FONT}`; ctx.lineWidth = 16; ctx.strokeStyle = '#000';
  const hy = port ? 420 : 150;
  ctx.strokeText('정리!', LW / 2, hy); ctx.fillStyle = '#ffd23c'; ctx.fillText('정리!', LW / 2, hy);
  HOW_SUM.forEach(([tag, col, desc], i) => {
    const k = easeOut((d - 300 - i * 350) / 300);
    if (k <= 0) return;
    const y = y0 + i * step, x = x0 - (1 - k) * 60;
    ctx.globalAlpha = k;
    ctx.fillStyle = col; rrect(x, y - 52, 230, 104, 52); ctx.fill();
    ctx.fillStyle = '#111'; ctx.font = `900 ${fitSize(tag, 52, 200)}px ${FONT}`; ctx.textAlign = 'center';
    ctx.fillText(tag, x + 115, y + 3);
    ctx.fillStyle = '#fff'; ctx.font = `700 ${fitSize(desc, port ? 48 : 54, LW - x - 290)}px ${FONT}`; ctx.textAlign = 'left';
    ctx.fillText(desc, x + 265, y + 3);
  });
  ctx.globalAlpha = 1; ctx.textAlign = 'center';
}

function drawHowto(t, now) {
  drawBg(t, now);
  const e = now - howStart;
  while (howFired < HOW_EV.length && e >= HOW_EV[howFired].t) HOW_EV[howFired++].f();
  let ch = 0;
  for (let i = 0; i < HOW.length; i++) if (e >= HOW[i]) ch = i;
  const le = e - HOW[ch];
  if (ch === 0) howIntro(le, t);
  else if (ch === HOW.length - 1) howSummary(le, t);
  else howChapter(howGeo(), HOW_CH[ch], le, t);
  const py = orient === 'port' ? 110 : 70;   // 진행 점
  for (let i = 0; i < HOW.length; i++) {
    ctx.fillStyle = i === ch ? '#ffd23c' : i < ch ? 'rgba(255,255,255,.7)' : 'rgba(255,255,255,.25)';
    ctx.beginPath(); ctx.arc(LW / 2 + (i - 2) * 50, py, i === ch ? 14 : 10, 0, TAU); ctx.fill();
  }
  const last = ch === HOW.length - 1;
  if (!last || le > 1800) {
    ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t * 4);
    ctx.fillStyle = '#fff'; ctx.font = `700 50px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(last ? '탭하여 돌아가기' : '탭하면 다음 ▶', LW / 2, LH - (orient === 'port' ? 120 : 60));
    ctx.globalAlpha = 1;
  }
}

function fxShake(now) {
  if (!fx) return [0, 0];
  const e = now - fx.start;
  let a = 0;
  if (fx.cut && e >= DROP_MS && e < DROP_MS + fx.cut) {
    const ce = e - DROP_MS;
    a = ce >= CI.STAMP ? 14 * (1 - clamp01((ce - CI.STAMP) / 320)) : ce >= CI.ROAR ? 4 : 0;
  } else if (MOTIONS[fx.type].shake && e >= DROP_MS + fx.cut) a = MOTIONS[fx.type].shake(fx, e - fx.cut);
  return [Math.sin(now * 0.09) * a, Math.cos(now * 0.11) * a];
}

// 게임 포기 확인창
function drawQuit(t, now) {
  const k = easeOut((now - confirmAt) / 180), sc = 0.85 + 0.15 * k * (1 + 0.06 * Math.sin(clamp01((now - confirmAt) / 260) * Math.PI));
  ctx.fillStyle = `rgba(0,0,0,${0.6 * k})`; ctx.fillRect(-80, -80, LW + 160, LH + 160);
  const w = Math.min(LW - 80, 900), h = 560, cx = LW / 2, cy = LH / 2;
  ctx.save(); ctx.globalAlpha = k;
  ctx.translate(cx, cy); ctx.scale(sc, sc); ctx.translate(-cx, -cy);
  ctx.fillStyle = '#1b1f2a'; rrect(cx - w / 2, cy - h / 2, w, h, 44); ctx.fill();
  ctx.strokeStyle = '#ffd23c'; ctx.lineWidth = 6; rrect(cx - w / 2, cy - h / 2, w, h, 44); ctx.stroke();
  drawChip(cx, cy - 175, 62, turn, t, 0, 'scared');   // 걱정하는 칩
  const TXT = '게임을 포기하시겠습니까?';
  ctx.fillStyle = '#fff'; ctx.font = `900 ${fitSize(TXT, 64, w - 80)}px ${FONT}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(TXT, cx, cy - 30);
  for (const b of QUIT_BTNS) {
    const yes = b.id === 'yes';
    ctx.fillStyle = yes ? '#ff5a6e' : '#2c3242'; rrect(b.x, b.y, b.w, b.h, 36); ctx.fill();
    ctx.strokeStyle = yes ? '#ffc9d0' : 'rgba(255,255,255,.85)'; ctx.lineWidth = 6; rrect(b.x, b.y, b.w, b.h, 36); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = `900 76px ${FONT}`; ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 4);
  }
  ctx.restore();
}

function frame(now) {
  const t = now / 1000;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#0d0f14'; ctx.fillRect(0, 0, CW, CH);
  if (orient === 'land') ctx.setTransform(0, 1, -1, 0, CW, 0);   // 가로모드: 오른쪽 90° (x,y) → (1170-y, x)
  if (scene === 'title') drawTitle(t, now);
  else if (scene === 'mode') drawMode(t, now);
  else if (scene === 'diff') drawDiff(t, now);
  else if (scene === 'howto') drawHowto(t, now);
  else {
    updateFx(now);
    updateCpu(now);
    const sh = fxShake(now);
    ctx.save(); ctx.translate(sh[0], sh[1]);
    if (orient === 'land') { drawPanelV(BLACK, BX / 2, t); drawPanelV(WHITE, LW - BX / 2, t); }
    else { drawPanelH(WHITE, BY / 2, t); drawPanelH(BLACK, LH - BY / 2, t); }   // 세로: 2P 위, 1P 아래
    drawBoard(t);
    ctx.restore();
    drawToast(now);
    drawResult(t);
  }
  drawVol();
  drawHome();
  if (confirmQuit) drawQuit(t, now);
  requestAnimationFrame(frame);
}

applyLayout();
reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
